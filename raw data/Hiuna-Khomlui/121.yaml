ID: "121"

Title: "KENDIBO NAI CHAWANG PIRUN"

Key: "E"

Time signature: "6/8"

V1: |
  1. Kendibo nai chawang pirun I daora, 
  Debonai niu wang ngao ralo? 
  Loibo tingmik tu I khuan bamme, 
  Sibo ram wang tangra maning nge.

CH: |
  (Chorus)
  He! Rapiu wibo tingmik debo nai niu ngao ralo? 
  Kadih chariubo ram haitu, 
  Saodia lujiu tadne, Salem ram ga; 
  Seraphim dungnai thuanjiu lung bamne.

V2: |
  2. Kadih ga lungsa kakung maidung, 
  Siga khuan bamme malum mai; 
  Nang di siboram ga wang lung raleng, 
  Kadih ga naten kawi tenlo.

V3: |
  3. Phuilo, apiu niu hai chiujiu dinne, 
  Hiupuina gasu niu makjiu, 
  Tinggen chawang bamsi ngut ngam lakge, 
  Chiujiu Rapiu niu senjiu bamme.

