ID: "58"

Title: "NAIMACHANG RAPIU NASAI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Nai machang Rapiu nasai I suitadne, 
  I hai Rapiu nagu-e; 
  Mpuiga I kaojiu bamliudi nang ra, 
  A Rapiu thiujiu bamne.

CH: |
  (Chorus)
  Kahiambo tingthung tanwang bamliudi, 
  Ting naih sabo wangdi I nagu; 
  Tingtheng jeng leng I nagu thiuni-e, 
  I hai Rapiu nagu-e.

V2: |
  2. Maidung niu marengjiu ngaokhai lak bamdi, 
  I hai Rapiu nagu-e; 
  Aka maidungniu atu saodiak liudi, 
  I hai Rapiu nagu-e.

V3: |
  3. Kadih pabam machang ga rontad bamdi, 
  I hai Rapiu nagu-e; 
  I shaidi ringdi degu thiuwang liudi, 
  I hai Rapiu nagu-e.

