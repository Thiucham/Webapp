ID: "86"

Title: "KEMSU SUKHE TINGWANG"

Key: "A"

Time signature: "6/8"

V1: |
  1. Kemsu sukhe Tingwang nahmaidung, 
  Pawanse wangtang chang rabode; 
  Hiuna gu chariponse piulujiu, 
  Satan ritu aphenra tadpat sukhe.

CH: |
  (Chorus)
  Shaijiu bam maidung zijiu bam maidung, 
  Nang zibamra ma Nang pingmakjiu ma? 
  Kadih tinglang hai wangtang surade, 
  Zijiu bam mai hina seniu, 
  Zikiang sujiu paten tensukhe; 
  Rapiu wangrabo wantu, 
  Maihina khuan jiu bam khe.

V2: |
  2. Zikiang sudakhe Tingwang nahdung, 
  Pawan thengbilakde kadih hai; 
  Maihina niu tenkhaibo hina, 
  Rapiu niu phuilan raleng wanglan sune.

V3: |
  3. Namen jijiu rontad bam maidung, 
  Maikhatna niudi ngut lulakge; 
  Pasai ngut lanleng pawan hade, 
  Rapiu niu kubambo wan ga ngut sukhe.

V4: |
  4. Satan gu riphen sang sang dungniu, 
  Maihina tu hiamra wangsude; 
  Hiuna gu ch'riponse piulujiu, 
  Paliu tu ngamra leng aphen sudakhe.

