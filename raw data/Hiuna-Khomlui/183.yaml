ID: "183"

Title: "ATU GUKHAIBO LAM"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Atu gukhaibo lam hai, 
  Aringting bamthen rah bamne; 
  Lungsiat niu panah pithiude, 
  Aringting bamthenna madu bamne.

CH: |
  (Chorus)
  Oh! anuan suang paniu lungsabo hai diye, 
  Alan niu liu ngamlakbo lungsa; 
  Atu gukhaibo lam hai, 
  Aringting bamthenna madu bamne.

V2: |
  2. Chariu chunwi bam liudi. 
  I hai panah lengsi gapde; 
  Tinggen ki si aki gapde, 
  Apiu pam ga tingtheng mathak bamne.

V3: |
  3. Nuan gasu kupatbo lam, 
  I ra bamdi ra kam lulak; 
  Patu simak maidung khuga, 
  Panah thiura I rah madu bamne.

