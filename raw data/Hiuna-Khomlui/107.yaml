ID: "107"

Title: "KADIH ATINGLANG LOI DASAI"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Kadih atinglang loi dasai, 
  Tinggen ramga lungne; 
  Rapiu niu kaden khaibo ram gasi, 
  Lungra nawang sude.

CH: |
  (Chorus)
  He, dedao niu wang ralo, 
  Tinggen ram wiboga lungra; 
  Nsuan nen nchun ga wang suma, 
  I niu khuan bamme.

V2: |
  2. Aliu lung hai tan bam takhe, 
  Tinggen ram nawangde; 
  Kadih tinglang naimiksi kiu dasai, 
  Taten tenlan lakge.

V3: |
  3. Kadih tinglang hai loidasai, 
  Nen ramga ngutne; 
  Tinggen masan maidung nai adaojiu, 
  Chunwilui thiubamne.

V4: |
  4. Kadih tinglang hai loidasai, 
  Tinggen ram ga lungne; 
  Karingbo shaili singbang sung gasi, 
  Tingtheng matha sune.

