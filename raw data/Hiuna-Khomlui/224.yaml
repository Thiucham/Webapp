ID: "224"

Title: "HAMIMAI TU PHIURA LENG"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Hamimai tu phiura leng, 
  Tingwang Napiu tu lang khai ye, 
  Kadih nuan niu phuijiu bambo ga, 
  Paniu ranpad khaimide.

CH: |
  (Chorus)
  Shai khai mide, 
  Shailujiu ringsu lande, 
  Tasi ye phuilo, Tingwang ngam; 
  Ngao nisai tuhoi wanglo.

V2: |
  2. Charao lungga khailu jiu, 
  Chari mainiu khom lujiu bam, 
  Ting kalikbo kumjiu suboga, 
  Chap ngammak kaokam mide.

V3: |
  3. Shaibo tu ngam lubopiu, 
  Aliu khuga wanglan bamme, 
  Pahom maidung tusi thoi khaijiu, 
  Agi manaibo thiulo.

