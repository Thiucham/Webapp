ID: "160"

Title: "CHENGSA CHAKUNG NIU ATU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Chengsa chakung niu atu bangbam, 
  Lungsa khaibo hang ga I bamne; 
  Tiudi I singbo Jesu niu si, 
  Tingwang tu thuanra ranpat khaide.

CH: |
  (Chorus)
  Ranpat khaide, atu rankhaide, 
  Chakung gasu niu Rapiu niu; 
  Ranpat khai, Rapiu Jesu nai I bam ye sai, 
  Tingwang tu thuanra ranpat khaide.

V2: |
  2. Nai machang I kem khangbibi-e, 
  Chariubo kamuang hakam mide; 
  Pabam kubo ga I khangbibi, 
  Tingwang tu thuanra ranpat khaide.

V3: |
  3. Kasa chariubo I sao diak khai, 
  Kadih chariubo niu rengmagui; 
  Kawi tenra nai machang shing bam, 
  Tingwang tu thuanra ranpat khaide.

