ID: "236"

Title: "TINGWANG NIU THOIDAM KAWI PIJIU"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Tingwang niu thoidam kawi pijiu, 
  Benbo kikhun thiura, 
  Tingwang kendibo lunglen milo, 
  Nanai ringting bamthen.

CH: |
  (Chorus)
  Mathabo kikhun thiujiu lunglo, 
  Khrista kendi lunglen milo, 
  Issac nai Rebicca kikhun kumjiu, 
  Mathajiu lung milo.

V2: |
  2. Eden ga Adam nai Eve khuga, 
  Nang aruang khaibo kum, 
  Khat khattu kungjiu lungbam raleng, 
  Nangthoi kawi pilo.

V4: |
  4. Napao nanai thoi lukjiu lunglo, 
  Tingpui marui lunglo, 
  Kasaiboniu ramna makthenna, 
  Tingpui marui lunglo.

