ID: "144"

Title: "MAKE KHUANSI CHIUJI SUDE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Make khuansi chiuji sude, 
  Rapiu kamun ga chap bamde; 
  Tinggen majadung sang sang naih, 
  Luisan thiune, halleluyah.

CH: |
  (Chorus)
  I mathakne tinggen ramga; 
  Withubo nai Jesu ngaone; 
  Tinggen mai nai chalui thiujiu, 
  Tingtheng jeng Jesu tu thuan bamne.

V2: |
  2. Dih chariubo hai phut lujiu, 
  Chun n-nian Rapiu Jesu niu; 
  Benjiu bambo tinggen ramga, 
  Naimik biu pagengha siga.

V3: |
  3. Din ngamlakge tinggen ram wi, 
  Eden reng lung ga lung maidung; 
  Mathajiu rontad nchamne, 
  Sabo bamlakge siga si.

V4: |
  4. Chunsa mikdui luangbo hina, 
  Khrista ben niu nun sang khaine; 
  Tinggen ramga shailan lakge, 
  Mikdui luangbo bamlan lakge.

