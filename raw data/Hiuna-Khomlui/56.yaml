ID: "56"

Title: "WIBO TEN THIURA NANG"

Key: "G"

Time signature: "4/4"

V1: |
  1. Wibo ten thiura nang tinglang pipadlo, 
  Siga Khrista niu pachun wikhai sune, 
  Wibo ten thiura pawan si raipadlo, 
  Khrista ten thiura leng pawan hawang sude.

CH: |
  (Chorus)
  Jesu tu lukhai makmai sira. 
  Aliu kadih ga lungcham bamliudi, 
  Tinggen lam wang aruangbonai dasai, 
  Aliu dung ngao dao lanmak sui ye.

V2: |
  2. Pawan hawang sude tingmik loiwangde; 
  Lung kasan thiujiu taniabo thuan milo, 
  Khrista kamun ga chapjiu khuan bamde. 
  Pamaidung tu luraleng khuan jiu bamme.

V3: |
  3. Tinggen dih wiboga tingtheng lungbamne, 
  Siga chahiu naimik biudi bamlakge, 
  Sibo bamga mikduidi luanglan lakge, 
  Tingkum sang sang Jesu nai lungcham bamsune.

