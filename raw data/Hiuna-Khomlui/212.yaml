ID: "212"

Title: "PHUILO CHARAKHUM"

Key: "A"

Time signature: "4/4"

V1: |
  1. Phuilo, charakhum wang sune, chamaidung ga; 
  Sisi katiu kasak gu chara khum makge; 
  Tingwang cham sinidi phiulakrabo wanne, 
  Sibo tingmiksi wang sude.

CH: |
  (Chorus)
  Duidi khat lam suniu duidi khat lam, 
  Naimik padlam suniu naimik ngutlam; 
  Tingwang cham sinijiu phiuron bamdi, 
  Phiudi phiudao lanra makge.

V2: |
  2. Khristen kawimaidi npuitad mao nine, 
  Tingwang lad masanbo tu matan jiu phiune; 
  Tiudi malumjiu rankhaibo lutao maidung, 
  Turonna Tingwang kadane.

V3: |
  3. Phuilo, thainai hai rankalubo tingmikge, 
  Duidi buiniang kumjiu Tingwang cham dinbamne; 
  Nang thainai Tingwang tu chamlam lumak misai, 
  Nsuan naira phiudao lan lakge.

