ID: "76"

Title: "PATING THENGJIU RONMENG"

Key: "D"

Time signature: "4/4"

V1: |
  1. Pating thengjiu ronmeng tadlude, Rapiu; 
  Shairabo bam gasu duakjiu; 
  Atu nana pithiu khailo, 
  Nabiusi akhupi ngao khailo.

CH: |
  (Chorus)
  He! Jesu atu lungsakhaibo, 
  Suang haye, nang magenthiu khengbo; 
  Naring bamsi akhu pikhailo, 
  Apum nai ahiuna naleng pide.

V2: |
  2. Tuhoi nakhu ga malan wangde, Rapiu; 
  Nangniu lungsabo pen gasu; 
  Atu nana pithiu khailo, 
  Nang wang lanrabotu khuan bamme.

V3: |
  3. Tuhoira I namai mide, a Rapiu; 
  Nang chariu kheng khaibo don niu; 
  Maning khaisai mikdui kiujiu, 
  A Rapiu, a Rapiu chiujiu ku.

V4: |
  4. Tinggen Zionram ben pad bonai dasai, 
  Makeniu kubo chiudasai; 
  Tinggen mailun lipadlujiu, 
  Chaluiniu thiujiu thuanne, Rapiu.

