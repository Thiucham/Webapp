ID: "210"

Title: "NALIULUNG TANJIU BAM MAIDUNG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naliulung tanjiu bam maidung, 
  Patingsi nawang sude; 
  Nang detheng namen ribamlo?
  Pawan natu khuanmakge.

CH: |
  (Chorus)
  Tingwang niu thaiting miksu, 
  Nang karing ting lumisai; 
  Nang tu chami niu rusune, 
  Lungli wang makge sai.

V2: |
  2. Kati kadi maidung tudi, 
  Ladjan thiune, Tingwang niu; 
  Nang tu ladjan thiubo naisai, 
  Nang detiu jiu kakralo?

V3: |
  3. John sum ga raokhaibosi, 
  Hai tiujiu Jesu dinne; 
  Hiuna ga manasan makmai, 
  Tingwang dih ga ngut lakge.

V4: |
  4. He! Tingwang tu mikre maidung, 
  Namun niu din ngam lakge; 
  Saomak jiu nahiu kagiet jiu, 
  Chamijai ga bam sune.

