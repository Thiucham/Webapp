ID: "36"

Title: "A LUNG BAM HAI SIANG KHAIBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. A lung bam hai siang khaibo bam, 
  Lungpubo duidih riga, 
  Oh! a Rapiu kha khai khelo, 
  Kha khai khelo.

CH: |
  (Chorus)
  Jesu nang Chawangdi tangsai, 
  Maning tao khailo, 
  Kadih nuan jengphi lu maidung, 
  Rapiu khuan chiuga bam ngammak, 
  Jesu nang Chawangdih tangsai, 
  Maning tao khailo,

V2: |
  2. Wibo wan hai pating dunne, 
  I singam mak kahiambo, 
  Tamiubo kamuang niu gombam ga, 
  Khakhai khelo.

V3: |
  3. Pawan wiga ringting mutne,
  Sikhailo ringbo paopiu, 
  Pawan hina nangleng jeng niu 
  Piu rabo-e.

V4: |
  4. Kadih gulam hina suangdi, 
  Natu alungniu machun, 
  Siangkhaibo tathu pirundi, 
  Runkhai bamde.

