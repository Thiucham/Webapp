ID: "187"

Title: "I NIU SIDE PAHAI A RAPIU YE"

Key: "G"

Time signature: "4/4"

V1: |
  1. I niu side, pahai a Rapiu ye, 
  Pating thengjiu nuan niu atu chawang thiu; 
  Rapiu Calvary ga shaibo matha makge, 
  I juringbo luraleng Pah shaibo.

CH: |
  (Chorus)
  A maodung phiujiu I ping nge, 
  A Rapiu nang bamjiu I pingmak; 
  Nang khuga diujiu I tad lanlakge.

V2: |
  2. Pating thengde nuan ga I ron tadbo, 
  Kawi ten thiura aringting hawang kum; 
  Detiu ralo, a Rapiu yo, khakhai khelo; 
  Kamao ngam hina I tenlan lakde.

V3: |
  3. Nangniu Calvary gasi chariujiu, 
  Nazai luangbosi alungniu maning saomak; 
  Sise aleng jengniu makma, a Rapiu yo, 
  Kamao chun hina I maning lanlak.

