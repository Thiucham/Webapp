ID: "115"

Title: "I SI MASANDE PALING SINGJIU"

Key: "A"

Time signature: "4/4"

V1: |
  1. I si masande paling singjiu, 
  Haibo kadih hai aki makge, 
  Nai khadna nbinmeng kumbo ye, 
  Chariubo kadih piri gahai.

CH: |
  (Chorus)
  Tingtheng lakge, I malan mide, 
  Mathabo tinggen aki lamsi, 
  Tinggen mazanai bamcham lujiu, 
  Mathabo luisi thiucham bamne.

V2: |
  2. Alung chun singga a Rapiu lad, 
  Wang sude, make marakiu jiu; 
  Mara wangbo khuan, niu chiu dinne, 
  Tinggen dihsi mana wang sude.

V3: |
  3. Kadihga bambo aten hina, 
  Alad din hina ha kamsune, 
  Tiubam di Rapiu lad hinara, 
  Khat nadi halan ragu makge.

V4: |
  4. Chariu maidung saone naikhat ra; 
  Tinggen kadih si wangtang dasai, 
  Thiubambo aliu luithiu hina, 
  Mathajiu Tinggen lam thiulanne.

