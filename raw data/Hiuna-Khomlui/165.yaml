ID: "165"

Title: "CHUNWIBO KHUAN TINGWANG LENG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Chunwibo khuan Tingwang leng pilo kadihmai, 
  Chunwibo khuan Tingwang leng pilo; 
  Chunwibo khuan Tingwang leng pilo kadihmai, 
  Mathajiu machalo, 
  Chalui thiujiu pasuang ga wanglo.

V2: |
  2. Nangliu benkhiu khailo, Rapiu leng maihiina; 
  Nangliu benkhiu khailo, Rapiu leng; 
  Nangliu benkhiu khailo, Rapiu leng maihiina; 
  Kuchangbo Rapiu ye, 
  Kadihri ga dithubo wang ye.

V3: |
  3. Tingwang tu thuanbo lui thiulanlo, mathiuna; 
  Tingwang tu thuanbo lui thiulanlo; 
  Tingwang tu thuanbo lui thiulanlo, mathiuna; 
  Kuchangbo Rapiu ye, 
  Chalui thiujiu patu kahumlo.

V4: |
  4. Khrista kamuang ga tuangjiu wangbo ngao sune, 
  Rapiu Khrista kamuang ga tuangjiu wangne, 
  Rapiu Kamuang ga tuangjiu wangbo ngao sune, 
  Malummai chunwilo, 
  Mathajiu Patu adao sune,

V5: |
  5. Halleluyah shenlo, Rapiu leng maihina; 
  Halleluyah shenlo, Rapiu leng; 
  Halleluyah shenlo, Rapiu leng maihina; Kuchangbo Rapiu ye, 
  Halleluyah maihina shenlo.

