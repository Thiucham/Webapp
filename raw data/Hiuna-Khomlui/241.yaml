ID: "241"

Title: "SUJIU TADLO HE! CHABON MAI"

Key: "A"

Time signature: "6/8"

V1: |
  1. Sujiu tadlo, he! chabon maidung yo, 
  Tingwang ten thiura leng tadpad sukhe; 
  Nang tad maksai saoniu, 
  Tingwang tien thiuralo? 
  Sujiu ten sukhe chabon maidung.

CH: |
  (Chorus)
  Tingwang niu aliu tu kujiu bamme, 
  Saoniu aliu leng tadralo?
  Isaiah niu chiujiu paokak khai-e, 
  Haiga I bamme, atu lang khailo.

V2: |
  2. Tuhoi pawan bamga chabon maidung, 
  Napumtan bambo wan ga tensukhe; 
  Ningting wibambo wan, 
  Din ngam thiu ngambo wan, 
  Rapiu leng pipad jiu ten sukhe.

V3: |
  3. Rangkang chakhiu chalan hina suangdi, 
  Kachia kumbo ringting pipad lujiu; 
  Nsuannai leng khaimakjiu, 
  Thainai tenkhai sulo, 
  Tingwang niu aliu tu luni-e.

