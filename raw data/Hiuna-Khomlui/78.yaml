ID: "78"

Title: "NAIKHAT NCHUN PAWAN KHATGA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naikhat nchun pawan khatga, 
  Nicodim Jesu ga wang-e; 
  Jesu niu pakhuga dinne, 
  Nang mana san ra ye.

CH: |
  (Chorus)
  Nang mana san siakra ye (2x) 
  Tinggen dihga wangni maidung, 
  Manasanlo.
  (Repeat chorus)

V2: |
  2. Kaloibo wanhai wang sude, 
  Karing tingdi hawang sude; 
  Lungsa maidung malumsulo, 
  Tamiubo wang sude.

V3: |
  3. Tuhoi wan ga lungsa maidung, 
  Nangniu nuan tenkhai mibose; 
  Masiak makjiu madu patlo, 
  Rapiu Jesu khuga.

V4: |
  4. Tering ga manabo tering, 
  Hiuna ga manabo hiuna; 
  Palingbo ringbo luraleng, 
  Nang mana kasanlo.

V5: |
  5. Tuhoi wan ga saokum mainiu, 
  Manasan jiu bam makge sai; 
  Chariu magen thiubo wangsai, 
  Manasan lulakge.

