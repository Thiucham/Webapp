ID: "5"

Title: "MANIA HINA TINGWANG NIU DAM"

Key: "G"

Time signature: "4/4"

V1: |
  1. Mania hina Tingwang niu dam khai-e, 
  Gandam ruang ga wikachangbo sira,
  Tingwang lun kum chamaina tu damkhai, 
  Dejiu wigulo chamainah ringting.

CH: |
  (Chorus)
  Matha bamkhe Tingwang bensiam hina, 
  Aruang lujiu Tingwang tu thuan sukhe,
  Jerusalem namsantu maning-e.

V2: |
  2. Dejiuwilo achi asingna mai, 
  Tingwang niu ju aruang khai bibo hai, 
  {Naikhat (2x)} wibi bijiu lungkhe, 
  Pawan tadbam ga Tingwang ten thiukhe.

V3: |
  3. Achunwi ye mania hina ngaojiu, 
  Singpon suangga kalana chuncham kum, 
  Chawan ramliang ndio khuan chiu riri, 
  Aky tinggen ky lam zuantad mine.

