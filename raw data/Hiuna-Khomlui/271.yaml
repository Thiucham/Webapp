ID: "271"

Title: "KULAM KACHIA TARA"

Key: "E"

Time signature: "6/8"

V1: |
  1. Kulam kachia tara jujiu, 
  Chalui thiubam mai saolo; 
  Kinglo, Jehovah chawang lungsiat; 
  Pakendi tu thuan bamme.

CH: |
  (Chorus)
  Paliu pon Miria zai niu, 
  Khiu khai lujiu mana kasan mai ye. 
  Paliu pon Miria zai niu, 
  Khiu khai lujiu mana kasan mai ye.

V2: |
  2. Tingtheng chawang bam chap magui, 
  Thuan'lui thiu bam mai soulo? 
  Kadih chariu kheng ngam lujiu, 
  Tinggen kadih zuan mai ye.

V3: |
  3. Phuilo, kama ganbo ponniu, 
  Phaini thiujiu lung bam mai, 
  Paliu pirun ben nkiu ye, 
  Miria zai niu liu mai ye.

