ID: "138"

Title: "KADENLO PAWANDE"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu Jesu niu din-e, 
  Kadenlo pawande; 
  Tinggen nai kadih hami sune, 
  Alad keng hai pakiak khat nadi, 
  Halan lakge.

CH: |
  (Chorus)
  He! Tingwang naram wangra lengsi, 
  Malum maidung niu phuijiu bamme; 
  Masan maidung tu lukhang bonai, 
  Nuan phung maileng chabam bamma?

V2: |
  2. Tingwang kadihga wang raleng, 
  Tingwang siniu makjiu; 
  Majah di Panah di simak, 
  Panah piu wangrabo, 
  Tathak sikhap kum sune.

V3: |
  3. Panah piu wanglan rabosi, 
  Nang de kaden sulo; 
  Noah ken ga pat mibo kumjiu, 
  Lungbambo kadih harabode, 
  Si wan gasi.

