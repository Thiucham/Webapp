ID: "279"

Title: "CHAMAINA HINA HAI NUAN"

Key: "G"

Time signature: "4/4"

V1: |
  1. Chamaina hina hai nuan mai-e, 
  Jesu niu ku-e, akhu wanglo; 
  Akhu wang maitu phutlan jat lakge, 
  Pihani makge, palungsa niu.

CH: |
  (Chorus)
  Sikam lakge, dinngam lakge, 
  Jesu lungsiat hai tasi-e; 
  Sikam lakge, dinngam lakge, 
  Suang ha Jesu lungsa.

V2: |
  2. Magenthiubo hai aliu leng-e, 
  Pah chariubo hai din ngam lakge; 
  Aliu leng jeng niu Jesu shai khai-e, 
  Nuan ritu ngamjiu sulan mide.

V3: |
  3. Moses ken ga padmibo kumjiu, 
  Tatudui sakjiu sulan mide; 
  Tuhoira tatu duisi Jesuye, 
  Charimai akhu wang sak lulo.

