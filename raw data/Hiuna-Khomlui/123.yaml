ID: "123"

Title: "KADIHGA N-MANBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga n-manbo khat di hah, 
  Thiuniu chariubo niu phuimide; 
  Jesu niu makjiu aringting, 
  Maikhat di rankhaira haye.

CH: |
  (Chorus)
  Mikdui luang lanlakge siga, 
  Oh! dejiu ga wilo siboram; 
  Naikhat ra I di tad sune, 
  Jerusalem namdi kasan ga.

V2: |
  2. Nuan bang rip phungjiu bam maidung, 
  Wangjiu Khrista ga mathak lulo; 
  Chariubo hina sao mine, 
  Matha chunwilui thiu bamne.

V3: |
  3. Tinggen dih wangtangbo naisai, 
  Kadih mania hina hamine, 
  Karingbo singbang sung gasi,
  Rapiu tu thuan jiu bammine

