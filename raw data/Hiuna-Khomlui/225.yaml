ID: "225"

Title: "KALEK WILUJIU KABUAK BAMBO"

Key: "E"

Time signature: "6/8"

V1: |
  1. Kalek wilujiu kabuak bambo suang, 
  Kalek sadi Rapiu tu pingbo niu wi-e, 
  Kalek wilujiu nchang makbo suang, 
  Kalek sadi lungchangbo niu wi-e.

CH: |
  (Chorus)
  Kachia nai rangkang tura, 
  Chami niu madiu ye, 
  Chamai kendisidi madiu lubui ye, 
  Chiudi chamaina lungra Rapiu niu madiu sune.

V2: |
  2. Pumtan bammai siniu lung lakmaitu, 
  Kam mathat maisira chamiutu kammasa, 
  Bambo tingkai tingriu kum gapbo-e, 
  Ka arat mai suang kalek saboniu wi-e.

V3: |
  3. Kalek samai kheng, nang chiukhai maksai, 
  Nangniu khengbo khuandi Rapiu chiukhai lakge, 
  Nadon winisai kalek samaitu lungsalo, 
  Khantiakbo haira nuanne.

