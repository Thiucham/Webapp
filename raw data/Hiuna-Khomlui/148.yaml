ID: "148"

Title: "KADIH KENHAI LOIDASAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadih kenhai loidasaira, 
  Rapture tingmik wangkhai sune, 
  Malum maitu lukhang bonai, 
  Kadih chariubo niu jinne.

CH: |
  (Chorus)
  Malum maidung n-man sune, 
  Rapiu khumki ga nang bamne, 
  Saodiak maidung kapjiu huine, 
  Chuak liudi pawan rimide.

V2: |
  2. Saokhai diakmai kadih maidung. 
  Lumimai tu phiutao lakge, 
  Saokhai diabo silu dasai, 
  Paga jumjiu chuakjiu kapne.

V3: |
  3. Chalungsa sibo hiunasi, 
  Kadih gasu lukhang mine; 
  Agi njangbo bamlakge, 
  Kadih kabuakbo niu jinne.

V4: |
  4. Sabo wansi khengtao makra, 
  Tuhoi Rapiu tu lukhailo, 
  Chalung limai thiulan lujiu, 
  Hiuna masanbo pingutlo.

