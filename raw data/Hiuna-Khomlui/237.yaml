ID: "237"

Title: "ALUNG NIU TANIA BAM LIUDI"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Alung niu tania bam liudi, 
  Nang maningbo ten bamne; 
  Alung gasi wangtang khailo, 
  Malan thiu makjiu bamlo. 
  {Nang bambo niu, nang bambo niu, 
  Achun wijiu bamra-e. (2x)}

V2: |
  2. Natu wankhat magiang lujiu, 
  Nang maningbo ten bamne; 
  Nang ramgasi wangtang khailo, 
  Nang leng I pikhai kamne. 
  {Pikhai sune, pikhai sune, 
  Nang tu magiang lusaira. (2x)}

V3: |
  3. Vangbo riangsi kamtap khailo, 
  Ahiuna tu rankhailo; 
  Tamiubo ga bamni makge, 
  Nabiu benbo pikhailo. 
  {Ben dasai niu, ben dasai niu,
  Alung chun benjiu bamne. (2x)}

