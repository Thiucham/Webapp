ID: "124"

Title: "NAIMACHANG AKHUGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naimachang akhuga bam bamlo Rapiu, 
  I di nang khuga bam bamni-e; 
  Natu 'ning ye saorabo ram pilenlo, 
  Chalui thiune chariubo kamuang hang ga.

CH: |
  (Chorus)
  Chunwibo singgiu wangtang dasai, 
  Mikdui luang jiu ramna mimai tu; 
  Rapiu ram wiga majang ngut khaine, 
  Sibo tinggen ram charapen kum penne.

V2: |
  2. Kuiji kachangnge aliu chunwibo si, 
  He! Calvary lam mari phuilo; 
  Charapen thin jiu chalui thiujiu bamne, 
  Chunwibo niu siboram si phui bamne.

V3: |
  3. Karaiga chunwi hina hakam midi, 
  Calvary lam tingben patlande; 
  Zion ram wibosi lekhailan bamde, 
  Aliu ram kareng kamunsi ben mide.

V4: |
  4. Tuhoi tacheng wijiu majang bambo si, 
  Tinggen ram ga wangtangbo naisai; 
  Chawang song ga si chalui thiujiu bamne, 
  Malan hajiu a Rapiu tu thuan bamne.

