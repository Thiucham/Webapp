ID: "83"

Title: "PHUILO TINGWANG BENSIAM"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Phuilo Tingwang bensiam hina niu dinbam, 
  Kadampiu niu khuan bam kaden mawi khailujiu; 
  Ngaonibo niu agunjiu bam sanbo kadihtu, 
  Wahina sankam misune.

CH: |
  (Chorus)
  He! kadih mai hina susulo, 
  Tamiubo thuan milo; 
  Ngutsulo, nang kabenbo gase; 
  Kadih niu pacham madubam.

V2: |
  2. Phuilo, Tingwang bensiam hina niu dinbam; 
  Khuanjiu bamme, Tingwang maidung madu padra; 
  Tingwang niu kadih pakhiangna dam sanmibo sai, 
  Kakungmai nang bam degalo ?

V3: |
  3. Phuilo, Tingwang bensiam hina niu dinbam; 
  Tingpok sidi wakia kum lem mahasune; 
  Tingwang niu kadih pakhiangna dam sanmibonai, 
  Nabam hai majilu sumah?

