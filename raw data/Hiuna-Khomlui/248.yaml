ID: "248"

Title: "AKUMJIU WARIK KUM MAILENG"

Key: "D"

Time signature: "4/4"

V1: |
  1. Akumjiu warik kum maileng. 
  Pazai penniu ringthuibo lutaode; 
  I ring nga de, tura ringthuibo lutaode; 
  Ringbo kikhun khat thiujiu lungne. (3x)

CH: |
  (Chorus)
  Halleluyah oh! halleluyah, 
  Tingtheng Zion ram wiboga; 
  Lungrabo leng nkhuan jiu bamme.

V2: |
  2. Tinggen ram wiga lungraleng, 
  Calvary Cross gasu atu liukhai; 
  Pazai luang khaibosi nangdi lukhaisulo, 
  Tinggen ramga tingtheng lungra leng. (3x)

V3: |
  3. Kadih lungchun phut misulo, 
  Naliu pumsi Tingwang gu kalenne; 
  Lungchun masan makmai tingtheng chariu sune, 
  Malan hajiu chariu bamsune. (3x)

V4: |
  4. Rankhaibo tinggen ram gasi, 
  Naikhat tinglang loijiu I tadsune; 
  Lungchun mikniu ngaotang makbo tinggen ramsi, 
  Malum mainiu tinggen ga lungne. (3x)

