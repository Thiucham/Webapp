ID: "4"

Title: "KADIHGA CHUNWI MATHAВО НАYЕ"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga chunwi mathabo haye, he, Rapiu, 
  Naikhatdi chunwi matha daomak, 
  Nang tinggen wang tang sai, 
  Mathane benkhiu jiu, 
  Halleluyah natu thuan bamne.

CH: |
  (Chorus)
  Ngamkam kambo he! arawang 
  Nang tinggen wangtang makthen, 
  Satan niu liutu ngam makra, 
  Naben jat lamsu ngen khailo.

V2: |
  2. Kadih gu wibo tura masen mak, he! Rapiu, 
  Chakhiu chalan niu atu dammak, 
  Nang ben niu kasiam khai, 
  Nasiu niu mut khaijiu, 
  Naten thiura atu lungwang khai.

V3: |
  3. Pakendijiu bambo chara ruang ga Charawang, 
  Nakendi si maidin ngamlakge, 
  Tinggen niu nabam thiu kadih niu napan thiu, 
  Nakendi tu I thuanjiu bamne.

