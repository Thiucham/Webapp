ID: "204"

Title: "KADIHGA THIUNIU CHARIU"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kadihga thiuniu chariumai kengbam phuiye, 
  Nuan jengniu thiuniu chariumai bam; 
  Tingwang kendi lura thiuniu chariumai bam, 
  Kadih pawan saisuijiu chariumai bam.

CH: |
  (Chorus)
  Oh! Calvary (2x) Calvary tu zuan wanglo, 
  Milypoi tu maseng subosi; 
  Nanuan kuak lura, nathiuniu wilura.

V2: |
  2. Moses niu Israel mainadung tu juken khai, 
  Paliu nuanjeng niu kam chariu khai; 
  Ramjing ga Moses niu kaniu sijusu khai, 
  Malumjiu phuimai gu thiuniu piwi khai ye.

V3: |
  3. Rapiu Jesu din-e, 'Bangrip phungmai wanglo, 
  I niu naliu tu mathak khaine, 
  Malumjiu wanglo, Calvary mily zaiga, 
  Nagu malum siniu na thiuniu wikhaine.

