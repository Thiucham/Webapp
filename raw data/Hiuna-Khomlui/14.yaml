ID: "14"

Title: "PAKENDIBO RAPIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Pakendibo Rapiu Tingwang, 
  Nuan mai tu ranlubo zainiu; 
  Akum maitudi nalung saniu,
  Anuan gasu atu juduak khai.

CH: |
  (Chorus)
  Maisuang hahbo lungsa, 
  Ting kadih tu ranlubo, 
  Halleluyah Halleluyah; 
  Withubo Tingwang kendi milo.

V2: |
  2. Ringting hai Naben ga bamme, 
  Chariubo bang I phung ngamlak; 
  Atu chunwi khai nalung saniu, 
  Rapiu nazan kumai sanwi-e.

V3: |
  3. I niu chariu khengh jiu bamga, 
  Rapiu nabenpom hang gasu; 
  Abang rit luak khai nalung saniu, 
  Tingtheng ringbo atu pikhai-e.

