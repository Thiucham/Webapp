ID: "301"

Title: "HE! SHINGNA APUI PIU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. He! shingna apui piu maidung yo, 
  Nang dega bamlo? 
  Naikhat nadi a Rapiu leng, 
  Tadpad lujiu changam kamkhai bamma?

CH: |
  (Chorus)
  Sao, sao tadralo? 
  Rapiu niu kubamme, 
  Saoniu mariwang jiu phuikhai ralo? 
  Rapiu gu lujam dungsi minrem sude.

V2: |
  2. Nagu kabambosi pipadra, 
  Rapiu masenne, 
  Hamimai tu pui wanglusai,
  Rapiu niu tathuan pikhai bi sune.

V3: |
  3. Kanam bonai a Rapiu nakhu, 
  Wang maniu sune, 
  "Nangam dungra nde silo?" 
  Nang detiujiu 'pao kenkak khairalo?

