ID: "233"

Title: "ALUNG CHUNNIU RAPIU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Alung chunniu Rapiu tu thuan, 
  Tingwang duan niu hiuna chunwi; 
  Atu Paniu maning taojiu, 
  Paniu aleng kawi kamkhai.

CH: |
  (Chorus)
  Chawang dungtu jukiu khaijiu, 
  Lung manuan maitu jusukhai; 
  Kalek wimaitu pumruang khai, 
  Mariu maitu pi magiu khai.

V2: |
  2. Kangambo ben henpad khaijiu, 
  Lung manuan maitu thoikhaide; 
  Jehovah tiujiu thuan bamme, 
  Alung amun pakhiang naniu.

V3: |
  3. Paniu ladren khaibo kumjiu, 
  Abraham tudi thoikhaijiu; 
  Pakai pakik kingka khaide, 
  Paniu lungsabo lenkhaibi.

