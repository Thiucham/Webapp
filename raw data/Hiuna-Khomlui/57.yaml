ID: "57"

Title: "KARINGTING KAMUANG KUM"

Key: "A"

Time signature: "4/4"

V1: |
  1. Karingting kamuang kum lenbam, 
  Kamun niabam ngut rabo 'pui; 
  Kashaibo kamunse manga, 
  Mathiu ngutde nangra delam?

CH: |
  (Chorus)
  Ira marumbo 'pui ngutde, 
  Tinggen tangbo cross mpuiga; 
  Kadpat khaide apum 'hiuna, 
  Jesu gu kamuang I thiune.

V2: |
  2. Suanghaye lungsabo kalen, 
  Tingwang niu pibo palungsiat; 
  Malum gapjiu ngutmai tura, 
  Hathon lakge kujiu bamme.

V3: |
  3. Oh! nuan phungmai maning taoma? 
  Cross gu racham tingtheng ringbo; 
  Natu kubam manuan najiu, 
  Rankhai nijiu natu khuan bam.

V4: |
  4. Rapiu Jesu tu malumlo, 
  Shaibo hiunatu malummai;
  Simai dungtu sikam mide, 
  Chamizaiga khairabo leng.

