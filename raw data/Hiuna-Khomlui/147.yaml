ID: "147"

Title: "KALOIBO WAN WANG RABOTU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kaloibo wan wang rabotu maninglo, 
  Lungsa maidung kaden sulo; 
  Duan wibo thiusune halleluyah, Amen.

CH: |
  (Chorus)
  Oh! Singnah kakung maidung, 
  Malum sulo tuhoi; 
  Halleluyah, Amen,

V2: |
  2. Kaloibo wan wangji sude wasilo, 
  Jesu Khrista ladzan paopiu, 
  Malum maitu lura halleluyah, Amen.

V3: |
  3. Kadih lungchun luni maidung lunglilo, 
  Chari dibo magen thiuga, 
  Nang kheng tao makraleng halleluyah Amen.

V4: |
  4. Wangrabo pawantu simak kadenlo, 
  Jesu dinne, paten tenlo, 
  Malum maidung hina halleluyah, Amen.

