ID: "15"

Title: "GETSAMANI KARENG LUNG GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Getsamani kareng lung ga Jesu kahum,
  Anuan bangrit hina phung lujiu;
  Nchun jirim rim ga kapjiu kahum bamme, 
  He! apiu he! apiu tiu ku.

CH: |
  (Chorus)
  He! apiu apiang luthuan khailo,
  Tiudi nang niu maningbo thiulo;
  Chunding wan ga Rapiu niu khudung lujiu, 
  He! apiu he! apiu tiu ku.

V2: |
  2. He! Peter wanchak khat di kheng ngamlak jiuma? 
  Mikre mai nawangde kahumlo;
  Hiuna ra luniye chapumra ngamlakge, 
  Jesu niu haitiu jiu din-e.

V3: |
  3. Juda Iscariot Jesu khuga nawang jiu,
  He! Rapiu tiujiu wang kapupde; 
  Apang heng nai tathun thin lujiu tad patde, 
  Calvary luang but lam zuan jiu.

V4: |
  4. Jesu chariye tiujiu Cross ga sen bamme, 
  Maikhat niudi pikhaimi makge; 
  Papum niu chari chang jiu senpadbo makge,
  Nang hiunatu kubo gu-e.

