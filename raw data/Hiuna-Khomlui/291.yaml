ID: "291"

Title: "THAINAI APUI BAMSAI"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Thainai apui bamsai akamai rong jaojiu, 
  Natu ngaora kum alung chun ga; 
  Chunsa mikdui luang jiu bamdi, 
  Malan wang lanlakde.

CH: |
  (Chorus)
  Chunding ga ngena kapbo wan machang, 
  Marui khuang khuan chiukhai apui tu maning: 
  Zikiu amang lamsu manjiu, 
  Malan wanglan lakde.

V2: |
  2. Thiuniu chariubo niu alung chariu bonai, 
  Achunset paokhaira maidi hah; 
  Achunsa mikdui luang bamme, 
  Malan wanglo, apui.

V3: |
  3. Akamai sai suide, achun wibo daomak, 
  Akiluang wang apui bam ren phui; 
  Magen nah thiujiu lung bamdi, 
  Tinggen lamniu daone.

