ID: "171"

Title: "HE! A RAPIU ATU JUKHAILO"

Key: "A"

Time signature: "4/4"

V1: |
  1. He! a Rapiu atu jukhailo, 
  Chariubo bang I phung bam gahai; 
  Luthuan khailo abang rip hina, 
  Tingtheng mathabo ramga lungne.

CH: |
  (Chorus)
  Pawan machang atu jukhailo,
  Kadih ting lang I tad tuan makthen; 
  Nalung saniu atu jukhailo, 
  Chariubo bang hina saodiak jiu, 
  Tingtheng mathabo ramga lungne.

V2: |
  2. Tamiubo kadih ga bamthenna, 
  Tamiubo niu npui gom bamga; 
  Luthuan khailo, abang rip hina, 
  Phung ngam makge, he! ah wang Jesu.

V3: |
  3. Kadih tingmik hai loibonai sai, 
  I duak khairabo bamwadi ha; 
  Naben jat niu atu jukhailo, 
  Atinglang hai loibonai dasai.

