ID: "23"

Title: "RANKHAIPIU PAZAI LUANG KHAI"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. Rankhaipiu pazai luang khai-e, 
  Anuan masan raleng; 
  Papi se makhum kiu mide, 
  Ahiuna juringra.

CH: |
  (Chorus)
  Milypoi manuanbo piu, 
  Calvary ga shai khai; 
  Milypoi shaikhai jiu ring sulande, 
  Aliu tu Ranpao-e.

V2: |
  2. I nuan kaphung maitu kumjiu, 
  Singpai riga reh-e; 
  Lungsabo nai nkha sibo, 
  Tingtheng ringbo pikhai.

V3: |
  3. Naimik di paju nbaijiu, 
  Pabiu ben ngam lakmi; 
  Rankhai piu niu amao phungjiu, 
  Singpai riga shaikhai.

V4: |
  4. I di api makhum kiu-e, 
  Rapiu singpai suang ga; 
  Pah kathiu khengbo maning tao, 
  Pazu I ngao dasai.

