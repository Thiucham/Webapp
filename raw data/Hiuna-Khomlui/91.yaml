ID: "91"

Title: "SAONIU TINGWANG TEN THIURALO"

Key: "G"

Time signature: "6/8"

V1: |
  1. Saoniu Tingwang ten thiuralo? 
  Kadih ga bambo singnah mai; 
  Aliu hai aliu rang thiuju mide, 
  Dampaopiu tu sita mide.

CH: |
  (Chorus)
  He! wanglo Rapiu ten thiu sukhe; 
  Pawan hawang mide; 
  Majad jiu lung lisulo, 
  Aliu pirun lura; 
  Sansabo ruang ga jaomakra.

V2: |
  2. Bible ga niu haitiu dinne, 
  Naliu lung kabuak mitulo; 
  Apiuki ga chabam kengjiu bamme; 
  Siga wangra mai kengmakge.

V3: |
  3. Tingwang niu Khrista tu langkiu, 
  Nuanmai panah thiulu raleng; 
  Tuhoira aliu panah thiumide, 
  Chunwibo hai dinngam lakge.

