ID: "52"

Title: "KHAT KHAT TU NALIU KUNGLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Khat khat tu naliu kunglo, khat khat kung jiu lunglo;
  Khat khat tu manang silo, I manang khaibo kum; 
  Khat khat bang phung arilo;
  Khat khat matha chamlo;
  Khat khat kungjiu lungbisai, amaiye tiu sira.

CH: |
  (Chorus)
  He kungbo singnah dung yo, 
  Rapiu ladantu kinglo, Aliu panahdung thiujiu 
  Khat khattu aliu kung khe.

V2: |
  2. Khat khattu kuak khai rilo, I niu kuak khaibo kum, 
  Khat khatleng singkhai bamlo, 
  I niu singkhaibo kum, khat khattu lungsa silo, 
  Khat khattu machalo, 
  Nangniu lunibo kumjiu, kadiumai ga tenlo.

V3: |
  3. Natu mikre maidung tu, Nangra lungsa bilo, 
  Kasa tenkhai maidung leng, 
  Thoidam kheng khai 'linlo, 
  Naliu hai kadih taiye, Naliu kadih 'biu-e, 
  Naliu ten wibosi niu, Tingwang ken lunglenlo.

