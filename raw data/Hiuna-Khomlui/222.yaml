ID: "222"

Title: "RANKHAIPIU JESU KADIH MAINUAN"

Key: "A"

Time signature: "4/4"

V1: |
  1. Rankhaipiu Jesu kadihmai nuan jeng niu, 
  Palung chariu jiu Getsamani ga; 
  Chunding ga kahum, apiang luthon khailo, 
  Amaning makge, nang maning thiulo.

CH: |
  (Chorus)
  Rankhaipiu tu phuilo, 
  Calvary wang tangde,
  Rankhaipiu tu phuilo, 
  Singchaiga siang khaide,
  Naimik ben ngammak kathidi malai-e, 
  Jesu niu wahina loikhai mide.

V2: |
  2. Tachengsa donniu Rankhaipiu Jesu tu, 
  Khaoring kuang nai Calvary ga kheng khai, 
  A Rapiu tu mikremai niu minlutad, 
  He! a Rapiu nang wang lanlak dama?

V3: |
  3. Rankhai piu Jesu palung magen thiu jiu, 
  Kasuangdui sidi tazaikum luang kiu, 
  Rome riphen kasa mainiu kam chariukhai, 
  Milypoi Jesu pamou hai haye.

