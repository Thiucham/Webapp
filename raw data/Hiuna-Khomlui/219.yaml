ID: "219"

Title: "MANING KAM LAKBO LUNGSIAT"

Key: "G"

Time signature: "6/8"

V1: |
  1. Mai maning kam lakbo nang lungsiat, 
  Clavary luang ga shaikhaibo; 
  Nalungsiat kumbo ngao makge, no! 
  Kadih aringting lung ga.

CH: |
  (Chorus)
  Lungsasibo Jesu, 
  Nang zaipen niu atu ran khaibo; 
  Nang lungsiat niu gukhai.

V2: |
  2. Kadihri ga nagu lungsiat si, 
  Singgiu kumjiu luangjiu bamme; 
  Maluang taning ga dinron tadne, 
  Mai kadamak nang lungsiat.

V3: |
  3. Nalungsiat kumbo ngao makge, no! 
  Kadih aringting lung gasi; 
  Wadi makbo atu nazainiu, 
  Atu Juringbo pikhai.

V4: |
  4. Halan lakbo nalungsiat siniu, 
  Tingkadih tu rankhai mide; 
  Maisuang habo chariu lungsiat si, 
  Atu tasiang ga duak khai.

