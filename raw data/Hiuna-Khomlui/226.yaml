ID: "226"

Title: "LADJAN THIURABO TINGMIKSI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Ladjan thiurabo tingmiksi, 
  Naimachang nawangde; 
  Kahiambo nai chariubo niu, 
  Arimai thiujiu hiam bamme.

CH: |
  (Chorus)
  He, atu phut khaidulo, 
  Akhuga bam bamlo; 
  Zion luang I wangtang makthen, 
  Rankhaipiu atu majanglo.

V2: |
  2. Asuang ga hiambo giu dibam, 
  Hara ping-e, Rapiu; 
  Sibo giuga kahak mimai, 
  Malan thiumakbo ram wanglak.

V3: |
  3. Noah ken ga patmibo nai, 
  Sadom kilong kumjiu; 
  Maipum amanra maning jiu, 
  He! chawang tu saokhai lujiu.

V4: |
  4. Nagu ariak ga raobo kum, 
  Kadih kabuak mide; 
  Lungsa bosi hakam mide, 
  Thiuniu chariubo niu phui-e.

