ID: "73"

Title: "TAZAI PEN NIU KUAKHAIBO SI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tazai pen niu kuakkhai bose I ye. 
  Tiudi kashabo niu asai sui; 
  Nang makjiu pumtan kaki aleng ha, 
  A Rapiu I wangtang lusuma?

CH: |
  (Chorus)
  Oh! a Rapiu Zion ram wiboga, 
  Nkhuan bamme magenthiumai nahdung; 
  Atu kulo masanmai maduiga,
  Mangaidu navang Lazarus tu kumjiu.

V2: |
  2. Sibo bamga nuan nai mijai ha-e, 
  Thuanbo luithiu ye masan maidung;
  I niu nuan phungjiu pui maobam liudi, 
  Lunglimai ringbo ngaone tiu-e.

V3: |
  3. Nahiuna masanbo langkiu khaijiu, 
  Karaidao nalad piumak maitu;
  Kam mahalo nalad piumak maitu, 
  Pasai ngao daone, masan maitu.

