ID: "274"

Title: "EDEN MATHABO ZION"

Key: "E"

Time signature: "4/4"

CH-: |
  (Chorus)
  Eden mathabo Zion, 
  Tingkum kahabo ram,
  I niu nkhuan bamne, a Rapiu tingmik; 
  Tingwang ladriat namdi ga,
  Chahiu, naimik biu hane, 
  Milypoi biu siniu, 
  Tingtheng jeng ben sune.

V1-: |
  1. Loimakbo mathabo ramgasi, 
  Nuan phungbo atudi lukhailo, 
  Alungli jiu wangne, 
  A Rapiu lukhailo.

V2-: |
  2. Chawan wang thingna dung mara bam, 
  I di aki Tinggen tadni-e, 
  I ronmeng theng lakge, 
  Aki zuan mirade.

