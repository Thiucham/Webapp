ID: "265"

Title: "EDEN RAM WIBO GA LUNGRA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Eden ram wibo ga lungra, 
  Wangrabo tingmik namide; 
  Naikhat tingmik loibo naisai, 
  Wangtang sune, tinggen ramga.

CH: |
  (Chorus)
  Alung chun nai ahiuna hai, 
  Tinggen ram ga lemjiu tadbam; 
  Kadih ram ga lungni makge, 
  Tadsuda khe lungsa maidung.

V2: |
  2. Manglam ngaowibo suang wi-e, 
  Milypoi niu benjiu bamme; 
  Ribam talo, pawan hade;
  Jupat khaine, Khrista siniu.

V3: |
  3. Canaan ram tang makra manang, 
  Tamiubo kamuang niu gomme; 
  Benwang lanlo, Rankhaibopiu;
  Ringbo singbang ga mathakne.

V4: |
  4. Naikhat tinggen ramga rontad, 
  Wanglan nimak, wanglan nimak; 
  Suikhai makge, Khrista siniu; 
  Malan wangde, kadih ramga.

