ID: "109"

Title: "CHUNWIBO NKIU YE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Chunwibo nkiu ye, he! Rapiu, 
  Suanghabo Nangam kam hinasi; 
  Tadmibo chamai karingting hai, 
  Madan niu madujiu kati khai.

CH: |
  (Chorus)
  Masin rimrim bambo wan gasi, 
  Rapiu gu kawicham chiulujiu; 
  Tingjingbo alungchun nkhamsi, 
  Lekhailo, Jesu wangji sune.

V2: |
  2. Malumlubo maidung hina niu, 
  Kahiambo ga kao khailan bamde; 
  Rapiu gu lungsabo khuan siniu, 
  Tuhoi natu kujiu khuan bamme.

V3: |
  3. Karingbo majibo npuisi, 
  Jesu makjiu kakibo haye; 
  Hiuna ga mana sanlu maidung, 
  Tinggendih si paliu ngutra ye.

V4: |
  4. Chunwilo, lungli lumai hina; 
  Tinggen kadih si naliu gu-e; 
  Maikhat niu natu kada lulak, 
  Ganbiu kumjiu nang ben bamsune.

