ID: "150"

Title: "KADIHRI MAI LUNGLILO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kadihri mai lunglilo, 
  Pawansi nawang sude; 
  Khrista gu ladzan tingmik, 
  Wangsude watheng makjiu.

CH: |
  (Chorus)
  Wang sune Rapiu niu, 
  Tinggen lamsu wang sune; 
  Nuirim rim jiu wang sune, wang sune, 
  Nang nai atu luraleng.

V2: |
  2. Khrista niu haitiu dinne, 
  I niu wangbo wang gasi; 
  Mily nai kami dungtu, 
  Zan tambo kum aliu tu.

V3: |
  3. Malum mak maidung tusi, 
  Chamijai ga thuan khaine; 
  Rapiu tu malum mai tu, 
  Phungwang mide tinggen ga.

