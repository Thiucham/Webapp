ID: "7"

Title: "TINGWANG GU PUMTAN MALAN HAYE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang pumtan phuilo, 'liutu dam khaibosi, 
  Haise kadihrigu pumtan makge, 
  Tingwang gu pumtan makma? 
  Kadih buiniang suang keng.

CH: |
  (Chorus)
  Kadih ga aliu lungjiu bambo hai; 
  Naimachang kawiten thiu bamra leng, 
  Kubamme pabam hina kawicham niu, 
  Damkhai mibo aliu hai Tingwang gu biamsiam-e, 
  Pah wangbo nai panah dungtu lutad mine.

V2: |
  2. Palad hahbo chamai kadih ga kengjiu, 
  Pamik tiatbo maidi kengjiu bamme; 
  Paphi paben tangmibo chariu mai bamphui-e, 
  Ringbo hiupuina ra khat ronna-e.

V3: |
  3. Phuilo singgiuki ga tadui luang bambose, 
  Paphi paben hah-e, palad ha-e. 
  Tiudi chamai sang sang tu pisakjiu ringkhai ye, 
  Tingwang gu pumtanra malan haye.

