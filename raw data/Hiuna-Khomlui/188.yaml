ID: "188"

Title: "I NUAN PHUNG JIU BAMGA"

Key: "E"

Time signature: "6/8"

V1: |
  1. I nuan phung jiu bamga, 
  Tamiubo niu phui ye, 
  Sibo wan ga maidung niu khantiakbo niu phui, 
  Sibo duanniu alung chariubo niu phui ye.

CH: |
  (Chorus)
  Naikhat nchun Rapiu niu atu ku ye, 
  Nuan phungbo mai akhu wanglo. 
  Nsuan sujju alung mathabo niu phui ye.

V2: |
  2. Alung chariu liudi, 
  Ahiuna matha ye, 
  I kaleksabo mai thiudi Jesu bamme, 
  Sibo duan niu alung mathabo niu phui ye.

V3: |
  3. Atu ran khaiganiu, 
  Rapiu gu lungsabo, 
  Nuan phung maitu lung saju-e, Rankhaibo piu, 
  Jesu gu lungsabo p I phung jiu wang-e.

