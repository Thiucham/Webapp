ID: "216"

Title: "CROSS GA LADKENG CHANIA"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. Cross ga ladkeng chania Jesu niu senne, 
  Sibo chamniu haichiu dinne; 
  "Apiu paliu mao kuak khailo, 
  Degu ten ten bamlo tiubo paliu simak". (2x)

V2: |
  2. "Nang thai nai Paradise ga I nai bam chamne, 
  Mpuimai nanah tu phuilo; 
  Apiu Tingwang, apiu Tingwang, 
  Detiu atu phut khai gulo, I chari-e". (2x)

V3: |
  3. Ladkeng charuk haitiu sen "hainiu loide, 
  Apiu naben ga ahiuna pikhaide"; 
  Tiujiu senbamme, 
  Rapiu papi makiang kiu jiu nuanri ngamde.

