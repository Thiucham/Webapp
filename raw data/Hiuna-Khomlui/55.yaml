ID: "55"

Title: "MASANBO RINTING"

Key: "A"

Time signature: "4/4"

V1: |
  1. Masanbo rinting thiusulo,
  Nanglung chun Jesu leng pilo,
  Nuanpui ga mari lantalo;
  Kadih lungchun phung lantalo.

CH: |
  (Chorus)
  Harabo hiuna sangsang, 
  Harabo npui tadjiu ronbam; 
  Jesu ga pumtan khenglujiu kemsu sulo, 
  Cross si phungjiu dinron tadlo;
  Ringbo Tingwang lad dintadlo.

V2: |
  2. Tingwang natu dam mawi khaide, 
  Naronna siga lungtalo; 
  Cross si phuijiu nking bamlo, 
  Kubo khuanse nking bamlo.

V3: |
  3. Pawan khamsi lekhai bamga, 
  Tingwang lungsa khaibo chamsi; 
  Pawan bamga dinron tadlo, 
  Nsuan naileng dakkhai lantalo.

V4: |
  4. Kadih ten leng maran talo, 
  Tingwang luleng pu khai sulo; 
  Khrista pengphai nai apang heng, 
  Puanjiu aphenlo chari ngamne.

