ID: "45"

Title: "LUNGSA SIBO JESU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Lungsa sibo Jesu khuga wang mathaklo, 
  Chabang karit phungjiu chariumai; 
  Chariubo kadih ga thiuniu bammai wanglo, 
  Mathak khai raleng Jesu niu khuan bamme.

CH: |
  (Chorus)
  Kendibo Chawang pirun, 
  Luni maidung wanglo, 
  Tajainiu liukhaibo silumai; 
  Khrista gu chawang dihcham, 
  Maidung ga paoronlo, 
  Tinggen ga chagan kumjiu benbam sune.

V2: |
  2. Pawan hawang sune kadihri maidung ga, 
  Majadjiu kasabo thuan milo; 
  Kadih rapen wibo kui maha kamra-e, 
  Karingbo Jesu ga nang malan wanglo.

V3: |
  3. Harabo hiuna sang sang kadih ga bamme, 
  Nang tadjiu kawicham din khailo; 
  Naimik pad naimik ngut tingpi tingrun lamse, 
  Jesu niu rankhaibo chamse paoronlo.

