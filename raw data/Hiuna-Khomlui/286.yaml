ID: "286"

Title: "RAMNABO TINGMIK PAD SUDE"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. Ramnabo tingmik pad sude, 
  Apui apiu asingnah maidung; 
  Chunsa jiu phutpad khairade, 
  Bamdia sulo, kemsu mide.

CH: |
  (Chorus)
  Nthai bam cham nsuan nai ramna, 
  Lungni makge, hai kadih ga; 
  Tingwang pam ga wang bam chamne.

V2: |
  2. I tad rabonai kapjiu tad, 
  Aliu mikdui singgiu kumjiu luang; 
  Tad mideno, I lungsa mai; 
  Bamdiak sulo, kemsu mide.

V3: |
  3. I tadra bonai chunsajiu, 
  Mikdui luang jiu I niu kanui-e; 
  Ramna nimak jiu ramnade, 
  Bamdiak sulo, lungsa maidung.

V4: |
  4. Chunsajiu karenghang tadkiu, 
  Mari phuikhang lan lungsamai tu; 
  Maluang dibo niu deng namjiu, 
  Lungsa maidung tu ngaomakge.

