ID: "253"

Title: "TINGGEN DIHWI CHAMUN NIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tinggen dihwi chamun niu dinngam lakge, 
  Phumling mai chalungsa maidung yo; 
  Rapiu niu panah dungtu nkhuan jiu bamme, 
  Malumjiu lunglijiu wangsulo.

CH: |
  (Chorus)
  Aliugu phumling tinggen lam bamme, 
  Manang lantalo, lungsa maidung; 
  Maihina leng chabam kaden loide, 
  Siga maihina halleluyah senne.

V2: |
  2. Kadih tu ramna rabo wan wangsude, 
  Pawan hai hade, ribamtalo; 
  Nazereth Jesu niu ju aruang khaisune, 
  Malum khaisulo, Rapiu dinne.

V3: |
  3. Khrista niu dinne, lungchun ncham bamlo, 
  Lungsa maidung mathajiu bamlo; 
  Tinggen lam Khrista nai lung ncham bam raleng, 
  Malum khaisulo, Rapiu dinne.

V4: |
  4. Naliu pum pakhiang nasi Tingwang gu-e, 
  Naliu chun rangthiu theng bamtalo; 
  Paladpiu mai leng kachia pirun kaden khaibam, 
  Halleluyah he! halleluyah.

