ID: "39"

Title: "KADIHGA MATHABO I PHIU BAMGA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga mathabo I phiu bamga, 
  Rankhaipiu kubam lungsabo khuan niu;
  Aleng juringbo lujiu ri ngade, 
  Tinggen mathabo se aleng jude.

CH: |
  (Chorus)
  A Wang Jesu Rankhaibopiu, 
  Nangnge atu pi mathabo;
  Witing thuibo gu tinglang hai, 
  Akhu ga pikhailo.

V2: |
  2. Mathak ra nai manaibo phiubamga, 
  Saokhai rabo bamha Khrista makjiu; 
  Abang rip hina pakhu thuan khaijiu, 
  Chariu hina saojiu ri nga mide.

V3: |
  3. Ating lang hai nakhu ga pikhaide, 
  A Rapiu lukhaijiu thinpiu khailo; 
  Nuan niu gombambo ga lung bam maidung, 
  Nabiu benbo gase ngutlan raleng.

V4: |
  4. Atu maluang bamlo oh! a Rapiu, 
  Nachunbo ten hinasi tenkhaijiu; 
  Nalungsa tu I sijiu lungbamne, 
  Tinggen ram gase I wangtang makthen.

