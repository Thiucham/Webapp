ID: "111"

Title: "JORDAN DUI KEN PADBONAI SAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jordan dui ken padbonai sai, 
  Kawibo chaki lamsi; 
  Rankhai maidung niu khuan bamme, 
  Paliu lun si I ngaone.

CH: |
  (Chorus)
  He! Jehovah zai pen niu sibo dungsi, 
  Kasiam khaide, aliu mathiu naleng; 
  Anuan hina siga kuak khai kam mide, 
  Khiu masan khai pazai masanbo niu.

V2: |
  2. A Wangpiu bambo ram wibo, 
  I niu nkhuan ngam lakge; 
  Karingbo singbang sung ga, 
  Dedao niu mathak ralo?

V3: |
  3. Tinggen Jerusalem namsan, 
  Param wi din ngam lakge; 
  Siga Jesu niu khuan bamme, 
  Namsan wibo ga ngutra.

V4: |
  4. Rankhaibopiu pam wangtang sai, 
  Lung chariubo bamlakge; 
  Nuan karitbo phung bam maidung, 
  Sigasi saokhai sune.

