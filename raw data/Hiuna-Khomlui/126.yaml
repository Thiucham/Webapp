ID: "126"

Title: "CHAMAINA HINA RAPIU TU MALUM"

Key: "D"

Time signature: "4/4"

V1: |
  1. Chamaina hina Rapiu tu malum lulo, 
  Kadih ladzan thiura nawangde, 
  Malum makmai hina shaibo rengmun ga ngutne, 
  Rapiu gu ladriatne.

CH: |
  (Chorus)
  Saokhai du Rapiu atu, 
  Karingbo nakan hang ga ting theng jiu bamra, 
  Shaimai sulanjiu chunwi ncham jiu bamra, 
  Nabam karingbo kajui hang ga, 
  Hosana tinggen maza nai.

V2: |
  2. Rapiu lungsajiu pazainiu liukhai atu, 
  Calvary singchai gasu rankhai, 
  Adam nai Eve niu nuan tenkhai mibo jeng ga niu, 
  Chariubo wang mine.

V3: |
  3. Rapiu niu aliu tu panah leng dam khai-e, 
  I papao ruingam lakge, Rapiu; 
  Aliu ringting ga paten wibo tenjiu bamkhe, 
  Chunwibo ga lungra.

