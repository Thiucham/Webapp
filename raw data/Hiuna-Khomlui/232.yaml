ID: "232"

Title: "PHUILO THAINAI DAVID NAMGA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Phuilo, thainai David namga, 
  Chawang thiura lungwang bamme; 
  Bethlehem namdi matomki gasi, 
  Ngena lungwang bamme.

CH: |
  (Chorus)
  Kukachangbo ga Tingwang, 
  Kadihri hai manaichialo, 
  Tiujiu mazadung niu thuanne.

V2: |
  2. Miriakhuan maidung khuan bamga, 
  'Liuleng Rankhaipiu lungwangde; 
  Khaorui kuang ga ngenatu majeebam, 
  Phailep majiu bamme.

V3: |
  3. Naimik padlamsu kasimai, 
  Paliu gu kabam thinlujiu; 
  Chawang Ngena tu wang kahum bamme, 
  Tingwang kendi milo.

V4: |
  4. Tinggen Wangna lungwang bamme, 
  Zat hina niu chunwi lulo; 
  Nuanmai tu ranraleng lung wangbo-e, 
  Chunwijiu thuan kiulo.

