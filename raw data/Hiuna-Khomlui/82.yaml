CH-: |
  (Chorus)
  I mana san ganiu,
  Pakhiangna limide; 
  I manasan ganiu, 
  Alunlung hina likamde.

V1-: |
  1. Karaidao tenbo I ten lan lakde, (3x) 
  Alunlung hina likamde.

V2-: |
