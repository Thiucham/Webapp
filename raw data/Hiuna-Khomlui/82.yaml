  Alunlung hina likamde.

V4-: |
  4. Karaidao gu lui I thiulan lakde, (3x)
  Alunlung hina likamde.

V5-: |
  5. Kungbo singnah yo nang dekum bamlo? (3x)
  Nangdi manasan lu dama?

V6-: |
  6. Tuhoi Khrista ga nang wangmak misai, (3x) 
  Nang tinggen dih ngut lulakge.

