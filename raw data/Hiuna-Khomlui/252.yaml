ID: "252"

Title: "TINGGEN RAMGA TINGTHENG"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tinggen ramga tingtheng lungne, 
  Jesu zan ga malum maidung; 
  Matha chunwi n-man bamne, 
  Malan hajiu matha bamne.

CH: |
  (Chorus)
  Mathabo kim lanlakge, 
  Jerusalem kasan gasi; 
  Mainapiu tu malum maidung, 
  Tinggen ramga mathak bamne.

V2: |
  2. Benkhiu jiu matha bamsune, 
  Jesu zai niu liukhai maidung; 
  N-man bamne, tinggen ramga, 
  Malum maidung niu thuankiujiu.

V3: |
  3. Jerusalem kasan gasi, 
  Lungsa maidung tu dao sune; 
  Rankhaibopiu Jesu suang ga, 
  Ngao sune, lungsa maidung tu.

