ID: "97"

Title: "TINGWANG TU MACHARA MAISAO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang tu machara maisao bamlo? 
  Chakha minbam ga Peter tu kukum, 
  Taten pubo wan gasu paniu ku, 
  Npaokak khaimaise sanwi mai ye.

CH: |
  (Chorus)
  Naimik kiumak ga paten tenlo, 
  Kadih lujam min rem kammide, 
  Rapiu naten phuira wangbo naisai, 
  Chaben ruang bammak raleng tenlulo.

V2: |
  2. Pasai taten phi naleng hasune, 
  Pasai leng maningjiu taten tenlo, 
  Rapiu natu lungsabo rachamse, 
  Dinrontad rabose naten don ne.

V3: |
  3. Tanmai sonmai lengdi taten bamme, 
  Jimai rimai lengdi taten bamme, 
  Amanbo gadi chariubo gadi, 
  Maihina leng bamme taten donse.

V4: |
  4. Chawang Khrista Rapiu ten thiu raleng, 
  Pipad khaide naphi pa hang gase, 
  Pumtan pikiu khailo naten thiura, 
  Thoidam pikiu khailo he! a Rapiu.

