ID: "199"

Title: "PAWANKHAD TAMIUGA"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Pawankhad tamiuga ronntad bam, 
  Atu ranpao nai aruang makbo wan; 
  Alung lepad jiu patu lukhai, 
  Pagu thoidam aleng pikhaide.

CH: |
  (Chorus)
  I nkhin lan lakge, nkhinlanlak, nkhinlanlakge, 
  Nai machang pah agu nai 'biu-e; 
  I nkhin lan lakge, khinlanlak, khinlanlakge, 
  Npui machang pah niu jukhai sune.

V2: |
  2. Nai machang paniu majang bam ga, 
  Jesu khuga nuan maitu juwangne; 
  Cross ga luang padbo tazaisi niu, 
  Akum nuan phung maitu khiubo zai.

V3: |
  3. Nai machang paniu atu kuak khai, 
  Anuan si kabun suang kaara khiu khai; 
  Tuhoira pasi aleng mide, 
  Pah lungsa jiu atu kuak khaide.

