ID: "48"

Title: "RAPIU KUBAM DE TUHOI WAN"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Rapiu kubam de tuhoi wan gahai, 
  Withubo ringting 'san ga wangleng;
  Palatren dungse nang malum sui-e, 
  Na Rapiu thiujiu patu malum bisai.

CH: |
  (Chorus)
  Natu kubam de, 
  Damkhaibo piu Tingwang niu; 
  Ringbam nang leng pisune, 
  Npuilen khaine paniu, 
  Sitang ngamlakbo, 
  Maning silakbo ringting, 
  Chariu tingjingbo ramga, 
  Ringting nangleng pine.

V2: |
  2. Natu kubam de, 
  Damkhaibopiu Tingwang niu; 
  Ringbam nang leng pisune,
  Paniu npui dinkhaine, 
  Tu' nachun pilo, 
  Rapiu tu pui dinkhailo, 
  Nang lung chun kham lepatlo, 
  Gukhaipiu ga thainai.

