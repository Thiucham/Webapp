ID: "92"

Title: "TINGWANG TEN THIURA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Tingwang ten thiura tingtheng lakge, 
  Tinggen nai kadihsi hamisune; 
  Chamai ringtingdi hamisune, 
  Malum maidung lungra kadih kasan damne chiu-e.

CH: |
  (Chorus)
  Oh! Rapiu chabam kadenra tadmide, 
  Tingtheng makjiu kuwang sune; 
  Siga jaomak maira chariu khengjiu, 
  Kadih gu wisidi luni lakge.

V2: |
  2. Tingwang ten thiura mai sao bamlo? 
  Tingwang chamdin dinjiu nuan tenmide; 
  Tingwang tu thuanjiu nuan tenmide, 
  Rapiu tu kahumjiu chamijai lam tad kammine.

V3: |
  3. Tingwang ten thiura chunwi bamlo, 
  Magen thiu chariubo daojiu bamdi; 
  Kadih rapen niu hiamjiu bamdi, 
  Rapiu ga khengbam mai kadih kasan ga lungsune.

