ID: "30"

Title: "RINGBO DUISI WANG SAKLULO"

Key: "G"

Time signature: "6/8"

V1: |
  1. Ringbo duise wang saklulo, 
  Sakmai hinase ringsune, 
  Tingtheng jeng Pahnai lung bamne, 
  Siga chariubo bamlakge.

CH: |
  (Chorus)
  Siga chariubo bamlakge, 
  Withubo dih gase,
  Rengmun hina leji sune, 
  Malum maidung ngutne.

V2: |
  2. Ringbo duise wang saklulo, 
  Tingtheng jeng lung cham bam raleng, 
  Rapiu khuan tanjiu kubamme, 
  Zion rengmun ga chap lujiu.

V3: |
  3. Ringbo duise wang saklulo, 
  Tingwang ladtu piumak tulo, 
  Noah ken ga padmibo kum, 
  Chariu magen thiubo wangne.

