ID: "67"

Title: "RIPHEN PUAN HAI KHAIKIU PING-E"

Key: "G"

Time signature: "4/4"

V1: |
  1. Riphen puan hai khaikiu ping-e, 
  I bambo dih chari tanne; 
  Tingmik machang kahiambo niu, 
  Chamai hinatu hiamjiu bamme.

CH: |
  (Chorus)
  Ripuan pilo Immanuel, 
  Nahiuna niu majang khailo; 
  Nuan niu kareng thiubo dih ga, 
  Nangniu atu malong bamlo.

V2: |
  2. Apumtan hai habam liudi, 
  Nangri maileng buimak liudi; 
  Khengsi maileng chawang pirun, 
  Nangniu kaden khaibose pilo.

V3: |
  3. Phui khailo a Rapiu Jesu, 
  Nang zai pen niu chari ngamne; 
  Nuan niu kareng thiubo dihga, 
  Ngam raleng naripuan pikhailo.

V4: |
  4. Nangniu chari piha khailo, 
  Nazai pen niu chari ngamne; 
  Napumtan niu nkha khailo, 
  Nuan phung maidung tu juken padra.

