ID: "49"

Title: "RAPIU KHRISTA GUYE"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Rapiu Khrista guye nahiuna hai, 
  Hiuna tu rejiu bamra hah-e; 
  Paniu tuhoi natu kujiu bamde, 
  Tuhoi Khrista ga ngut khaisulo.

CH: |
  (Chorus)
  Akah singnah puipiu thiumai, 
  Karaidao tense tenlan talo; 
  Patu rejiu maseng khailan talo, 
  Aliu leng shaikhaibo Khrista tu.

V2: |
  2. Pah kiu sude aliu tu luraleng, 
  Malum khaimak maihina tuse; 
  Dejiu chariu ralo sibo wan ga, 
  Chariu pingbo niu paduan thiune.

V3: |
  3. Patu malum maidung chakhuang thiune, 
  Malum makmai chamijai tadne; 
  Nuanpuiki lam tadjiu bam maidung tu, 
  Malan wanglo Khrista kubamme.

