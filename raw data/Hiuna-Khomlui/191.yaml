ID: "191"

Title: "HIUNAH GA ALIU KHATDE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Hiunah ga aliu khatde. 
  Khrista aliu khatde. 
  Aliu lungkhat chunkhat thiura, 
  Rapiu ga aliu kahumme.

CH: |
  (Chorus)
  Khat khat tu kuak khai karijiu, 
  Lungsajiu lungbo ga, 
  Aliu khristen ne tiubo mainiu ngao milo.

V2: |
  2. Aliu tad ncham bamne, 
  Khat khat ben goak lujiu, 
  Masuanglam tad ngut bamne, 
  Tingwang ki tang makthen na.

V3: |
  3. Aliu ten ncham bamne, 
  Tingwang lad piulujiu, 
  Hami maidung leng dinne. 
  Khrista gu wibo gospel.

V4: |
  4. Khat khat leng kahum bamne, 
  Aliu piu Tingwang ga, 
  Khat khat tu manang sijiu, 
  Lungsajiu aliu lungbamne.

