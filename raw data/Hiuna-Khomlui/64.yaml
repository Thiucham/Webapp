ID: "64"

Title: "KADIHMAI NIU PAWAN TU SIMAK"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Kadihmai niu pawan tu simak, 
  Zat hina hakam misune; 
  Pawan si tingtheng lakge, 
  Pawan natu khuan makge.

CH: |
  (Chorus)
  Tingtheng lakge pawan sira, 
  Pawansi wangtang sude; 
  Kadih witu phut milo.

V2: |
  2. Kadih maidung mathing jiu bamlo, 
  Wang rabo tu naliu simak; 
  Maomakjiu harabo-e, 
  Pawan naliu simakge.

V3: |
  3. Tinggen maidung naliu tu khuan bam, 
  Luisan thiubam tinggen maidung; 
  Aliudi siga wangne, 
  Agunlo pawan nade.

V4: |
  4. kheng sijiu naliu khuan bamlo, 
  Kadih maidung thuanjiu bamlo; 
  Tinggen mai chalui thiujiu, 
  Naliu nai thuan nchamne.

