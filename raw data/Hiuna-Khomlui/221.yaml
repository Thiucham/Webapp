ID: "221"

Title: "GETSAMANI KARENG LUNGGA"

Key: "D"

Time signature: "6/8"

V1: |
  1. Getsamani kareng lungga, 
  Jesu niu kahumjiu bamga, 
  Tingwang npao khai-e; 
  Rapiu Jesu tu.

CH: |
  (Chorus)
  Magen thiumai tu ku-e, 
  Kubamme, Rapiu malan wanglo, malanwanglo, 
  Rapiu khuga malan wanglo, malan wanglo, 
  Lungsa khaibo wan ga.

V2: |
  2. Chariubo bangsi phung lujiu, 
  Delam baikhaira phiubamlo? 
  Nangdi npao khailo, 
  Rapiu Jesu tu.

V3: |
  3. Sijiu, sijiu nbai bammai, 
  Jesu wang lanbonai dasai; 
  Ladzan thiu sang jingne, 
  Rapiu Jesu niu.

