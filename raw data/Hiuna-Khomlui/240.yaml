ID: "240"

Title: "HE! CHABON DUNG"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! chabon dung chabon wan ga, 
  Tingwang leng pipadlo, 
  Tingwang niu natu paten pi tenkhai ni-e, 
  Na Rapiu tu machabamlo, 
  Kachia kumbo wan ga.

CH: |
  (Chorus)
  Nang chabon wanwibo ga, 
  Na Rapiu tu maning taolo; 
  Chabon tingga malum lulo, 
  Tuhoi hai pawande.

V2: |
  2. Pawan nai tingmik hah wangde,
  Karingting dun mide; 
  Kawibo ringting hina ta jumisune, 
  He! chabondung nang pen bamga; 
  Na Rapiu ten thiulo.

V3: |
  3. Tingwang dinne, chabon wan ga, 
  Tuhoi aten tenlo; 
  Kawibo ringtingsi nsuan nai kuimi sune, 
  Tuhoi pawan bam ga tenlo; 
  Tuhoi hai pawande.

