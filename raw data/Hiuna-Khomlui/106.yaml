ID: "106"

Title: "ALUNG NUAN NIU TAMIU BAMGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Alung nuan niu tamiu bamga, 
  Tinggen gu cham dinkhailo; 
  Charapen kumjiu pashi mashi raleng, 
  Pithiu khailo, 
  Ringbo chawang pirun lura.

CH: |
  (Chorus)
  He! a Rapiu hiuna langkiu khailo, 
  Naleng parim wibo penkumjiu pen raleng; 
  Nang chawang pirunsi luraleng, 
  Maningbo wangtang khailo.

V2: |
  2. Aliu bambo tamiubo ramga, 
  Kawi cham phungwang khailo; 
  Charapen kum pen raleng nai, 
  Pashi mashi raboleng, 
  Kuilan makbo pirun lura.

V3: |
  3. A Rapiu hiuna niu makjiu, 
  Ningting marak ngam lakge; 
  Tingthuibo nai mathabo pen, 
  Alung ga pen rabo hai, 
  Satan rih siniu kham bamme.

V4: |
  4. A Rapiu niu khamsi lekhai, 
  Lungsabo tensi tenra; 
  Siamthubo ten ga malumsui, 
  Boten thiumai hina si, 
  Tinggen gu chalan rihbo-e.

