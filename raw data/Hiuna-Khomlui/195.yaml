ID: "195"

Title: "I KADIH HAIGA CHABIN"

Key: "D"

Time signature: "4/4"

V1: |
  1. I kadih haiga chabin mai thiu-e, 
  Chiudi naikhat aram wangmine; 
  Pawan khatga taten thiukhai lujiu, 
  Jesu khuga wang matha mine.

CH: |
  (Chorus)
  I chabin mai ye, chiudi naikhat, 
  Kabenbo ram ga atu khuanbam; 
  Atu kubo hai dejiuga wilo, 
  Tingtheng jeng Jesu nai lungmine.

V2: |
  2. I kadih haiga chabin mai thiu-e, 
  Chiudi Rapiu niu atu lekhai; 
  I Patu ngaosai pawatwi ngaone, 
  Charingambo luiniu patu thuanne.

V3: |
  3. I chabin mai ye, chiudi tathuansi, 
  Aleng radi tinggen ga bamme; 
  Charingambo make khuan I chiusaira, 
  Patu thuanbo luiniu thiubamne.

