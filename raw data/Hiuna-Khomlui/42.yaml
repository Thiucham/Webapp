ID: "42"

Title: "KADIHGA LUNGSA MAIDUNG YO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kadihga lungsa maidung yo, 
  Jesu niu lungsa jiu kubamme; 
  Akhu wanglo nuan kuak khaine, 
  Tingthengjiu ringthuibo pisune.

CH: |
  (Chorus)
  Wanglo kubo khuan chiulo, 
  Karingbo ting loimak ga; 
  Wanglo ringbo Jesu ga, 
  Maning kamlak lune loibonai.

V2: |
  2. Mangai dulo lungsa maidung, 
  Kadenlo nahiuna hamakra; 
  Nuan niu hiuna shairabo-e, 
  Nuan kuak lusai hiuna ring sune.

V3: |
  3. Jesu wattu wang jiu phuilo, 
  Kadih puat hina nagu thiudi; 
  Hiuna hamisai shaibo-e, 
  Hiuna tu deniu akhia ralo.

