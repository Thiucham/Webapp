ID: "213"

Title: "KANAMBO TINGMIK"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kanambo tingmik siwang dasai, 
  Rapiu ten thiu khaira mai hahjiu; 
  Papui, papiu, pachi, panamai, 
  Cham lakbo wang sune, Rapiu dinne.

CH: |
  (Chorus)
  Khrista tu simakjiu lungbam mai, 
  Natu ladzan thiura khuan bamme; 
  Paleng sibo, maitu manma, wasao thiubo, 
  Kashaibo niu natu khuanjiu bamme.

V2: |
  2. Rapiu niu dinne, He! lungsamai, 
  Kadih gu kasabo nisha ga; 
  Tadra suang Khrista puan piu lujiu, 
  Marilo, nahiuna ringbo ngaone.

V3: |
  3. Rapiu niu dinne, He! lungsamai, 
  Khantiakbo makha agamai; 
  Thiurasuang Khrista puan piu lujiu, 
  Nahiuna ringra leng kaden sulo.

