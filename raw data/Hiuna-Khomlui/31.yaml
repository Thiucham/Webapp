ID: "31"

Title: "CHIU KHAILO A RAPIU"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Chiu khailo Tingwang niu natu,
  Manuanjiu kubamme; 
  Wang majadlo pakhu gasi, 
  He! nuan phung maidung yo.

CH: |
  (Chorus)
  Wanglo, wanglo jiu ku bamme, 
  He! nuan phung maidung yo; 
  Naleng amanbo pikhaine, 
  Nang malum mak jiuma?

V2: |
  2. Cross gasu natu ruikhaibo, 
  Nang si pao phung bamme; 
  Kalangjiu napao ruimak sai, 
  Natu simak sune.

V3: |
  3. Hiuna niu nasi masira, 
  Kadihga wangkiu sai; 
  Tuhoi kuga nang wang maksai, 
  Natu simak sune.

V4: |
  4. Nting jiu kubo khuan chiulo, 
  Nang mari phuimak sai; 
  Hiuna niu haitiujiu dinne, 
  Nang malum mak mai ye.

