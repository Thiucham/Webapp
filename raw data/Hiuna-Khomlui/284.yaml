ID: "284"

Title: "TINGKADIH DAMPOU JEHOVAH"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tingkadih dampao, Jehovah, 
  Tingwang nalungsiat si diye, 
  Aruang khaidi ramna khailan, 
  Kapbo nuibo kadih chiang-e.

CH: |
  (Chorus)
  Lungsabo singna maidung, 
  Thainai ramna lanra bode, 
  Nangliu mangwilo, chiu kanui khai; 
  {Salam (2x)} Tingwang zan ga.

V2: |
  2. Ramna lanrabo wan wangde, 
  Kadihri niu n-chungbo kum, 
  Naliu mang wilo, chiu kanuikhai; 
  Dechiu ralo? kadih chiang-e.

V3: |
  3. Tachiang tadbo npui ga lunglo, 
  Aliu dung ramna bamliudi, 
  Tingwang kubo khuan chiuraleng, 
  Sing jiu bamkhe pawan machang.

