ID: "220"

Title: "RAPIU NIU LUNGSABO GASI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rapiu niu lungsabo gasi, 
  Hami maidung tu kuwang-e, 
  Aleng pazai kungbo luangkhai-e, 
  Hami maidung tu rankhai raleng.

CH: |
  (Chorus)
  He! Haijiu thiujiu khenghkhai-e, 
  Maidung chengsa jeng gasu niu, 
  Detiuralo, Tingwang nahpiusi? 
  Maidung cheng ga jeng gasu shaikhai.

V2: |
  2. Achengsa hinadi kuak khai, 
  Lung magen thiumai tu kung-e, 
  Chengsa taniabo khiu masanra, 
  Masan maidung wangkhai kalanglo.

V3: |
  3. Tacheng samaitu ranraleng, 
  Detiujiu chawang dibo piusi, 
  Khaoring kuang naih Calvary Cross ga, 
  Haijiu kha thiujiu kheng khaimide.

V4: |
  4. Jat hinadi wangkhaisulo, 
  Chunwibo nai mathabosi, 
  Rapiu gasu niu piwang lande, 
  Param kawiga majang ngutra.

