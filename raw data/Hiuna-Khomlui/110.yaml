ID: "110"

Title: "PAJAN TADHAI KIMLAN MAKBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Pajan tadhai kimlan makbo, 
  Rapiu niu kasiambo ramsi; 
  Nen nchun bamlan lakge, 
  Zion namdi wibo gasi.

CH: |
  (Chorus)
  Tinggen Jerusalem gasi, 
  Mariu charibo bamlan lakge; 
  Chahiu naimik chagan pageng hah, 
  Milypoi niu benne sigasi.

V2: |
  2. Chariubo kadihram ganiu, 
  Ringbo namdi zuan tadbonai; 
  Shaijiu ramnabo wadaodi, 
  Bamlan lakge Tinggen npuiga.

V3: |
  3. Pawangdih masanbo gasi, 
  Shaijiu ramnabo bam lakge; 
  Mikdui long chunsabo hahne, 
  Pawang dih kawibo gase.

