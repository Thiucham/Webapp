ID: "139"

Title: "BIBLE GA BAMBO RILIU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Bible ga bambo riliu khang kariu racham, 
  Khang mangiu niu kaden, khang mangiu kaden mak; 
  Kadenlu maidung mibung gasi thaodui bam, 
  Kadenmak maidung paruang thinbam.

CH: |
  (Chorus)
  Nawang sude, nkhuan bamlo, 
  Nsuan, n-nen, nchun gasu liuma? 
  Kadenlo maikhat nadi pawan simakge, 
  Mathing lujiu nkhuan jiu bamlo.

V2: |
  2. Riliu khang mangiu niu khang mangiu ga dinne, 
  Naliu gu thaoduisi aliu leng pikhailo; 
  Sigasi khang mangiu niu haichiujiu dinne, 
  Naliu tadjiu zuanmai ga liulo.

V3: |
  3. Sibo wan ga riliu khang mangiu tad mide, 
  Magiangpiu wang lujiu nkhamsi nam mide; 
  Paliu niu wang lujiu nkhamsi maganne, 
  Naliu tu I simakge tiu-e.

V4: |
  4. Rapiu niu wanglan rabo wansi wang sude, 
  Pamaidung tu lurabo leng wanglan sune; 
  Sigasi kaden lujiu bam maidung siniu, 
  Tingtheng jeng karingbo ngao sune.

