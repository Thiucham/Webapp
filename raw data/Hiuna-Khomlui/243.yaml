ID: "243"

Title: "NAIMIK KIU KHAIBO SAILAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naimik kiukhaibo sailam, 
  Naikhad I tad sune; 
  Atu lungsapiu Jesu, 
  Benpuam gasi wang saone.

CH: |
  (Chorus)
  Naimik kiu khaibo sailam, 
  Tinggen atu khuanbam; 
  Naimik kiu khaibo sailam, 
  Jesu tu I ngao daone.

V2: |
  2. Tenbam maidung wang saone, 
  Kajui sungdi hahne; 
  Chariubo mangai mine,
   Oh! dejiu suang haralo.

V3: |
  3. Mazadung make mutsai, 
  Rapiu wangkiu sune;. 
  Pamaidung tu lusune,
  Chari ngambo tingmik thiune.

