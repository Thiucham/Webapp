ID: "206"

Title: "MALACHI GA RAO KHAI YE"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Malachi 3:10 ga rao khai ye, 
  Nagu potkat abow ga phungwang lulo; 
  Atu madiujiu nagu pot phungwang lulo, 
  Tinggen gu kamun lekhaine.

CH: |
  (Chorus)
  Thoidam lumai thiulo, 
  Thoidam tingriu kumjiu khaine; 
  Wahina ga withubo Tingwang leng pilo, 
  Tinggen ga lungwimai thiune.

V2: |
  2. Kadihgu chakhiu nang makhuan bamdi, 
  Hamira ye, nang ringting loibo naisai; 
  Wadaodi halan makbo chakhiu makhuanlo, 
  Khrista gu ladrenne, haisi.

V3: |
  3. Nangliu hai kadihri gu matai ye, 
  Nangliu hai kadihpiri gu nbiu si ye; 
  Tamiubo ga bam maidung tu thaoben khaira, 
  Khrista niu natu kubo-e.

