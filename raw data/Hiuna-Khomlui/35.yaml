ID: "35"

Title: "KADIH WAN HAI KALI BIBI"

Key: "A"

Time signature: "6/8"

V1: |
  1. Kadih wan hai kali bibi wangsude, 
  Lungsa maidung nalungdi kalilu sulo; 
  Mathingjiu lunglo naring ting ga hai, 
  Pawan haise naikhat naikhat kali sude.

CH: |
  (Chorus)
  Wanglulo Khrista niu kubo wan ga, 
  Wanglulo Khrista kujiu bamme; 
  Natu khuan thengjiu bam ngam lakde, 
  Tuhoi pawan wiga wang lulo.

V2: |
  2. Suan naira nang lung linijiu bamliudi, 
  Nang lung lirabo wansi daolak misune; 
  Tuhoi pawan bamga ribam talo, 
  He! lungsamai ribam talo pawan hade.

V3: |
  3. Khrista gu lungsara tuhoidi kubam, 
  He! lungsamai ningting sijiu lunglu sulo; 
  Pawan wiga nalung lilu sulo, 
  Lukhairabo wan ga nalung lilu sulo.

