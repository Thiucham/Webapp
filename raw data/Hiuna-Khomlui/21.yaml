ID: "21"

Title: "RAPIU JESU RINGTING"

Key: "D"

Time signature: "4/4"

V1: |
  1. Rapiu Jesu ringting makum khaisai, 
  Chunwi mathabo hah chariubo ronna; 
  Oh! Jerusalem riukhaira hajiu, 
  Taji phaidi hajiu Khrista se.

CH: |
  (Chorus)
  Atu ranpao Khrista gu chariuse, 
  Maikhat di phungkha khai ramai hajiu; 
  Chunsa jengsa calvary cross ga, 
  Anuan jeng niu shaikhai mide.

V2: |
  2. Aman khai mak kadih puipiu pamga, 
  Rapiu Tingwang tu machabo ringting thiu; 
  Tiusak magiumak adonjeng niu, 
  Khengh khai-e cross ga shaibo tangjiu.

V3: |
  3. Shairabo simasuang lubo chariu, 
  Suikhai mak chariubo piang luthon mira; 
  Oh! dejiu chariu rebambo thadse, 
  Chariude ahiuna donjeng niu.

