ID: "177"

Title: "HE! A RAPIU LUNGSAJIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. He! a Rapiu lungsajiu nangniu, 
  A paorui khailo; 
  Nang makjiu kadiubo Tingwang hade. 
  A Rapiu ga apum nai ahiuna katpad khaide.

CH: |
  (Chorus)
  Kuak khailo ringbo Tingwang, 
  Na khuga wang-e, a Rapiu kuak khailo; 
  Masanbo hiuna akhu wangkhailo, 
  Nawangdih wang tangbonai dasai lukhailo.

V2: |
  2. I tadkhaibo bam machang, 
  A Rapiu npui dinkhailo, 
  Alung, amun, amik nang thinkhailo, 
  A Rapiu ga apum nai ahiuna katpad khaide.

V3: |
  3. Ngambo Tingwang aliu tu, 
  Kahiam ga jukhai mane, 
  Karingbo, majibo npui, nang ye, halleluyah, 
  Nazan kendibo thiulo, Amen.

