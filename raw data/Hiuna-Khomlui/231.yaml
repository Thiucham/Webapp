ID: "231"

Title: "TINGWANG KADIHMAI TU KUNGJIU"

Key: "G"

Time signature: "6/8"

V1: |
  1. Tingwang kadihmai tu kungjiu, 
  Jupao thiura leng mai keng langkhai, 
  Ningting mai chari katan mainiu, 
  Chawang thiu wang.

CH: |
  (Chorus)
  Chawang mairuang ga chawang piura, 
  Tingwang nah manonbo Jesu ye; 
  Kadihri ga paken dijiu wangne, 
  Chunwibo Christmas nai.

V2: |
  2. Kalek sathubo di Jesu, 
  Mainiu ngaorao thubo di Jesu; 
  Kadihri tinggen paken dithubo di Jesu.

V3: |
  3. Nuanri tanjiu bambo kadih, 
  Ningting, pumtan mainiu ngamlumak, 
  Manonbo Khrista niu wang jiu nuan ritu ngamde.

