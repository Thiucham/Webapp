ID: "54"

Title: "SAOKUM MAIGA HIUNA MASANBO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Saokum maiga Hiuna masanbo ha sai, 
  Manasan maiye tiura buimak,
  Hiuna masanbo pikiu khaira;
  Rapiu Jesu khu ga khenglo.

V2: |
  2. Hiuna masanbo hai Rapiu kalen ne,
  Rangkang chalan niu liu ngam makge, 
  Rapiu kenditu thuankiu raleng; 
  Hiuna masanbo pikiulo.

V3: |
  3. Nuan phungbam ga Rapiu lad piu ngam makge, 
  Liu ringting ga mathabo ha-e, 
  Agimanaibo lutao makge; 
  Hiuna masanbo pikiulo.

V4: |
  4. Saokum mainiu Tingwang zan ga wangnge sai, 
  Paringting se kasanlan sune, 
  Matha chunwibo kim lanlakge;
  Tinggen chawang bam suang gase.

