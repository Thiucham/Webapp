ID: "168"

Title: "NUAN MAI YE TINGWANG ATU"

Key: "D"

Time signature: "4/4"

V1: |
  1. Nuan mai ye, Tingwang atu kuak khailo, 
  Naphi pah hang ga kuak khaira phiu-e.

CH: |
  (Chorus)
  Akhu ga nang bam maksai shaibo kadih aleng, 
  Tinggen ram witu ngaora atu majanglo.

V2: |
  2. Mathabo haye hai kadih riga, 
  Kadih ritu ngamra nang tu maning-e.

V3: |
  3. Tingtheng nakhusu I diu tad bamdi, 
  Nakhuan chiujiu tuhoi malan wangde.

V4: |
  4. He! Rapiu atu pi masan khailo, 
  Naram tangra nuanri tu aphenne.

