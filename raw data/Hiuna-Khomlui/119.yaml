ID: "119"

Title: "I BAMBO RAMSI TAMIUBO RAMME"

Key: "G"

Time signature: "4/4"

V1: |
  1. I bambo ramsi tamiubo ramme, 
  A Rapiu yo atu nkha khailo, 
  Nakansung wiboga I bamraleng, 
  Na lungsha niu atu majang khailo.

CH: |
  (Chorus)
  Kadih ramwitu maning lanlakge, 
  Rapiu lungbo ram wang tang dasai, 
  He .... he.... he! nkha khailo, 
  Nawangdih ga lung raleng.

V2: |
  2. Tinggen dihwi mainiu dinsi lakge, 
  Aliu lungbo kadih kum makge, 
  Magen thiu chariubo bamlan lakge, 
  Kadih chunsa mikdui luangbo haye.

V3: |
  3. Tadrai mibo akahmai malummai, 
  Rapiu pamga wang aruang dasai, 
  Chunwi mathabo luisan thiu chamjiu, 
  Sibo ramga tingtheng lungbam sune.

