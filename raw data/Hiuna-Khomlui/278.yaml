ID: "278"

Title: "CHABANG KARITBO PHUNGJIU"

Key: "E"

Time signature: "4/4"

CH-: |
  (Chorus)
  Chabang karitbo phungjiu, 
  Magen thiujiu bammai.
  Jesu khu wanglo, 
  I pi mathak khaine, Jesu niu ku bamme.

V1-: |
  1. Magen thiu chariu jiu bammai, 
  Mariu chari khengjiu bammai.
  Paki palu hajiu rontad bammai, 
  Jesu khu wanglo.

V2-: |
  2. Kap huijiu mikdui luang bammai, 
  Agi manaibo daomak mai.
  Pui piu hajiu chunsa bam maiyo, 
  Jesu khu wanglo.

V3-: |
  3. Tasen chalan hajiu lungmai, 
  Lung chun matha ngamlak bammai. 
  Nang maning wang tang ngam lakbam mai, 
  Jesu khu wanglo.

