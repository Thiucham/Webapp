ID: "6"

Title: "APIU TINGWANG NIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Apiu Tingwang niu haitiu dinne, 
  Nangliu atu ping makjiu ma? 
  Duipui tu damkhaipao si I ye, 
  Duidih niu wadaodi malem mi makge.

CH: |
  (Chorus)
  He kapangbo nahdung akhuanse nkinglo, 
  Namik bamdi ngao ngam makge, 
  Nakon bamdi chiu ngamlu makge, 
  Loibonai de padralo tiubose.

V2: |
  2. Dampao Tingwang niu haitiu dinne, 
  Nalung tatu kum tanmide, 
  Naliu rontad mengmi maidung yo, 
  Chamai hina Dampao tu pingta midi.

V3: |
  3. Apiu Tingwang niu haitiu dinne, 
  A maning mai khat nadiha, 
  Tathiu chari lungchun phung kammide, 
  Kadihpiri maihina dung khu gase.

