ID: "60"

Title: "ALIU MATHABO TINGLANG HAI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Aliu mathabo tinglang hai, 
  Tingmik machang tadjiu bamme; 
  Aliu ting lang hai loi dasai, 
  Tinggenki lam tadne.

CH: |
  (Chorus)
  Kaden sulo kaden makmai, 
  Tingtheng lakde Jesu wangra; 
  Lukhai sulo pawan wiga, 
  Tuhoi Khrista tu lukhailo. (2x)

V2: |
  2. Lungsabo wan hai loidasai, 
  Khengsibo wandi loidasai; 
  Nang maning kamlak jiu chuakne, 
  Nkham nammi sune.

V3: |
  3. Tinggen nkham lekhai bamga, 
  Ngut sulo nahiuna ringra; 
  Nang rilune majad sulo, 
  Pawan hami sune.

