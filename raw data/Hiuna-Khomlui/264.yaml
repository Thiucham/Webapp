ID: "264"

Title: "TINGGEN RENGMUN"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tinggen rengmun lelujiu khuan bam, 
  Natu kujiu bamme; 
  Nalung tanmai thiu theng bamtalo,
  Matha chunwibo daolulo.

CH: |
  (Chorus)
  He! wangjiu sanwimai thiululo, 
  Natu kujiu bamme; 
  He! sanwimai thiululo, 
  Tinggen ram lung mira.

V2: |
  2. Khrista kamuang ga tuangjiu wangne, 
  Malum maitu lura; 
  Khang nianiu athao akao bamdi, 
  Khat tu saojiu khat tad mide.

V3: |
  3. Ladzan paopiu niu wang chap mine, 
  Maihina kahumme; 
  A Piugu thoidam dao maidung yo, 
  Wangjiu ringbo dui saklulo.

V4: |
  4. Khangsia ra kap, khangsia niu nuibam, 
  Chawang bampeng suang ga; 
  Khangsia ra tad, khangsia niu shaibam, 
  Ramna mide, he! ramnade.

