ID: "62"

Title: "KADEN SULO MALUM MAIDUNG YO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kaden sulo malum maidung yo, 
  Rapiu wangrabo wan namide; 
  Pawanse chak lujiu lunglilo thainai, 
  Pah wangrabo wanse namide.

CH: |
  (Chorus)
  Sulo nuan bam ganiu, 
  Ngutlo suang lam phuijiu; 
  Lungsamai naliu ringbam silu dama? 
  Pah wang lanbonai wide chiu khaisuma?

V2: |
  2. Khrista niu wang lanbonai dasai, 
  Maihina niu patu ngao sune; 
  Saobidi nuan mahinjiu bamngam lakge, 
  Nuan phung maidung suang habam sune.

V3: |
  3. Kaden sulo pawan wangtangde, 
  Malum bamga patu dao suma? 
  Pamaidung chunwijiu patu ngao daone, 
  Chunwi mathabo tingmik thiune.

V4: |
  4. Namibung ben mawijiu bamlulo, 
  Malum matipjiu nkhuan bamlo; 
  Jesu niu malum maidung tu lusune,
  Malum mak maitu saokhai diane.

