ID: "142"

Title: "KATUM JIU WANG SUNE"

Key: "E"

Time signature: "6/8"

V1: |
  1. Katum jiu hahwang kinbo kadih hai, 
  Taten loi atiat sidi loi mide, 
  Tiudi ranlubo sira daomakge, 
  Tingwang ten thiujiu mijai lam tad kam mide.

CH: |
  (Chorus)
  Tinggen lamsu tingsin khuan kum, 
  Milypoi niu benbo ramga, 
  Mazadung niu thuanjiu bamne, 
  Kadalumai niu sibo ramga, 
  Tingtheng Jesu nai Chawang thiu cham bamne.

V2: |
  2. Kukhaimai keng kadalumai ra tam, 
  Kukhaibo bamga chap matip lulo, 
  Aliu kadalumai thiu makgesai, 
  Tingtheng chariujiu shaibo mijailam tadne.

V3: |
  3. Jesu wang kin nang aliutu lura, 
  Dejiu wira patu daolumai si, 
  Kadih gu chariubo kheng lan makjiu, 
  Mathabo kim mak halleluyah tinggen ga.

V4: |
  4. Rapture ga saokhaidia bam mai sira, 
  Chariu khengjiu shaira tu phiu bamdi, 
  Sibowan ga kashaibo hamine, 
  Chariubo lon a Rapiu tiujiu kusune.

