ID: "101"

Title: "NUAN NIU TAMIUBO"

Key: "G"

Time signature: "6/8"

V1: |
  1. Nuan niu tamiubo kadih ga, 
  Ronmeng jiu bammai sang sang bamme; 
  Sidung tu puiwangra mai haye, 
  Khrista tu malum mai makjiu.

CH: |
  (Chorus)
  Sulo sulo naliu Khrista riphen maidung, 
  Tamiubo ga hara maitu; 
  Kabenbo ga juwang khailo, 
  Pakendibo pirun pine.

V2: |
  2. Natu di tenra kuye sai, 
  Rapiu I bamme chiujiu sulo; 
  Natu chapkhu jiu khakhai raleng, 
  Phumling mai aliu bamme.

V3: |
  3. Masanbo phaini piu lujiu, 
  Kadihri karing thenna tenlo; 
  Najantad, naphi jeng leng makjiu, 
  Rapiu tu machabo ten lo.

