ID: "208"

Title: "KAWICHAM NIU DINNE"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Kawicham niu dinne, saotu I ping ralo? 
  Chami pum shai ratu pingra mah? 
  Nagu agu hiuna shaira tu ping ralo, 
  Tuhoi haide, aliu kadarabo wansi.

CH: |
  (Chorus)
  Chamaina niu chamipum tu kamshat ngamme, 
  Hiuna tura kamshat ngam makge; 
  Tingwang ra wahina kangambo paopiu-e, 
  Chamaina tu pingra ma? Chara tu ping ralo!

V2: |
  2. Tingwang masong ga wadi mahin lulakge, 
  Mahinbosi madulen khaine; 
  Saokum mainiu pamao bamsai madu padlo, 
  Tingwang ki si naki thiujiu lung niye sai.

V3: |
  3. Saokum mainiu pamao bamme tiu din padsai, 
  Tingwang niu pamao kuak khai bine; 
  Saokum mainiu pamao haye tiumai sira, 
  Paronna pariga maosan khailan bamne.

