ID: "193"

Title: "HE! CHUNRANG THIU LUNG BAMMAI"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. He! chunrang thiu lung bammai, 
  Hiuna ringra kaden jiu khuan bamkhe, 
  Nsuan nai nahnai tiu bamtalo, 
  Pawan hade, ribam takhe.

CH: |
  (Chorus)
  Tuhoi Rapiu kubo khuan chiusai, 
  Nanglung tanbam talo riju makga wanglu khe.

V2: |
  2. Chaliang bambo pui piu mai, 
  Nang chaliang niu tinggen tadlu suma? 
  Tingwang ra manon leng damkhai, 
  Nang hiuna ra kapjiu bamme.

V3: |
  3. Withubo chabon tingga, 
  Paten thiura Tingwang niu masenne, 
  Drugs nai jaopiang leng lungbam mai, 
  Saodia mine, Rapture tingmik.

V4: |
  4. Lungwi ningting bam liudi, 
  Tingwang jao makbo lungwi ningtingra, 
  Halan mibo mikha kumjiu, 
  Tingtheng lakge, hamisune.

