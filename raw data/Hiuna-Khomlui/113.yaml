ID: "113"

Title: "KHRISTA GA DIUJIU"

Key: "D"

Time signature: "6/8"

V1: |
  1. Khrista ga diujiu I chariu, 
  Ariga muang tamiubo niu gom bam; 
  Nuan npuiga I ronmeng tadbam liudi, 
  Tamiubo ga tadjiu tinggen nai'biu, 
  Benwangbo tu khuan bam.

CH: |
  (Chorus)
  Tinggen nai'biu ben wang lanlo, 
  Tingthung tanbo khengbam gahai, 
  Phut khai mane, he! a Rapiu; 
  Na lungsiat niu I mathak bamrade.

V2: |
  2. Dechiujiu I wangtang ralo? 
  Tamiubo niu I tadrabo npuiga, 
  Tadbamniu ye hamirabo npuiga; 
  Chawang bang khuan chiujiu, 
  Chaki lam I malan wanglan rade.

V3: |
  3. Chariubo niu dui kasuak kum, 
  Atu pikao raleng thiujiu bamme, 
  Amalum hai siamjiu bamliu tadi; 
  Rapiu Jesu tu malumbo pen niu, 
  I nkhin lan lakde.

