ID: "105"

Title: "WICHAM DINTADRA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Wicham dintadra napum pipadlo, 
  Nasen nalanniu wicham dintadlo, 
  Nang pawan bamga wicham dintadlo, 
  Nang rathoi siniu wichamdin tadlo.

CH: |
  (Chorus)
  Singnah yo zitheng bamtalo, 
  Gerabo lujamdi bamme, 
  'Lupou ga aliu kheng bam khe, 
  Paniu ge ramai leng lang khaisune.

V2: |
  2. Gao khaira habo Milydung kumjiu, 
  Paliu dung niu tad maren padbo ga, 
  Manam khaoring niu paliutek thiude, 
  Amily dung tu manang khai maiha.

V3: |
  3. Khrista zan chiujat makmai keng bamme, 
  Singchai lun ngao jat makmaidi bamme, 
  Jonah tu Tingwang niu langkhaibo kum, 
  Nang tudi siga tadra leng langbam.

