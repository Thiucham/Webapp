ID: "25"

Title: "TINGEN HIUNA THAOKIU KHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tinggen hiuna thaokiu khailo, 
  Wang bamlo aliu ruang ga; 
  Makiangsu khailanlo jimi maitu, 
  Pawan machang majangjiu bamlo.

CH: |
  (Chorus)
  Aliu maning ye hiuna sanbo, 
  Nangniu maksai mpui maokam sune; 
  Jukhailo ganbiu benbo Zion ramga, 
  Naram masanbo ga.

V2: |
  2. Maning khailo pah rankhaibo, 
  Ringbo 'pui simak maileng; 
  Nazai niu rankhaibo tu silude, 
  Detiu ralo he! a wangpiu yo?

V3: |
  3. Hiuna Masanbo wangkhai sai, 
  Kadih maidung duan wine; 
  Nuan rise niu tanjiu wangbam liudi, 
  Natu thuan jiu chalui thiu bamne.

V4: |
  4. Jesu manuanbo dinkhailo, 
  Chariujiu kheng khaibose; 
  Dintadlo tathu pirun runbose,
  Tasibo lungsa se dintadlo.

