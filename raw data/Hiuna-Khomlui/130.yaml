ID: "130"

Title: "MALUMBO NOAH NIU KADENBO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Malumbo Noah niu kadenbosi phuilo, 
  Nuan gu duidisi wang tang makbo ga; 
  Tingwang lad ga malumjiu, 
  Nuan gu duidi kenra leng malee rui.

CH: |
  (Chorus)
  Tuhoi wan gadi saokum mainiu, 
  Pahiuna tu lungsa ye sai; 
  Kadenlo Rapiu wang makbo suang ga, 
  Tinggen Jerusalem ga lung raleng.

V2: |
  2. A Rapiu Jesu wang sune hai kadih ga, 
  Khangnia pangiu don ga makhum bamne; 
  Malum maitu lutadne, 
  Malum kamak maitu khaidia sune.

V3: |
  3. A Rapiu Jesu wang sune hai kadih ga, 
  Maipui khang nia athao akao bamne; 
  Malum maitu lutadne, 
  Malum kamak maitu khaidia sune.

V4: |
  4. A Rapiu Jesu wang sune hai kadih ga, 
  Khangnia taziga zi ncham bamne; 
  Malum maitu lutadne, 
  Malum kamak maitu khaidia sune.

