ID: "41"

Title: "PHUILO NKHAMGA I CHAP-E"

Key: "G"

Time signature: "4/4"

V1: |
  1. Phuilo nkhamga I chap-e, 
  Natu kubo khuan chiululo; 
  Dinlo chengsha jiu mao maidung, 
  I nalung ga ngutlu buima?

CH: |
  (Chorus)
  Phuilo nkham ga I chap-e, 
  Natu kubo khuan chiululo; 
  Chengsha maobo niu phui bambo, 
  I nalung ga ngutlu buima?

V2: |
  2. Najeng gasu tathu pirun, 
  Runkhaijiu natu khuan bamme; 
  Dinlo chengshajiu mao maidung, 
  I nalung ga ngutlu buima?

V3: |
  3. Pageng hasai natu kulak, 
  Achariu tu maning khailo; 
  Nanuan kuak lura I shaikhai, 
  I nalung ga ngutlu buima?

V4: |
  4. I phung wangye Tinggen kalen, 
  Wiboram ga majang khaira; 
  Dinlo chengsha kamao maidung, 
  I nalung ga ngutlu buima?

