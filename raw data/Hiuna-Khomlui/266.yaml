ID: "266"

Title: "PAWAN HAI HAWANG MIDE"

Key: "G"

Time signature: "3/4"

V1: |
  1. Pawan hai hawang mide, kaden jiu khuan bamlo, 
  Kadih tinglang niu wangtang dasai. 
  Chamai zat hinaniu ngao jisune, Tinggen dihsi; 
  Nchun tamiubo bamlakge.

CH: |
  (Chorus)
  Thainai gasu lungli mikhe, 
  Singnamai pawan hade, 
  Chamaijat hinaniu ngao misune, wang tangbonai; 
  Siga chunsabo bamlakge.

V2: |
  2. Lungchun hai nchang bamlo pirun hai luknisai; 
  Naten kam jaojiu patu thuanlo; 
  Chariu magen thiu maitu lungsa sijiu lunglo, 
  Sansabo ruang ga jao makra.

V3: |
  3. Kadih tamiu wang kinne, malum matip bamlo. 
  Kahiambo niu tanjiu wang bamdi, 
  Rapiu niu gukhai sune, malum maihinatu; 
  Tinggendih tang jiu gukhaine.

