ID: "125"

Title: "KADIH KENDIBO I PHIU BAMGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadih kendibo I phiu bamga, 
  Alung ga kawicham din wangjiu, 
  'Pui maomai nang malan wanglo tiu.

CH: |
  (Chorus)
  A Rapiu makjiu I matha raha!
  'Puimao ga sao atu majangla?
  Rapiu nang makjiu matha raha.

V2: |
  2. Chariubo niu I npui mao liudi, 
  Nanglung saniu I n-man khaide, 
  Kadih lungchun I mangai mide.

V3: |
  3. He! Rankhaipiu tu I tuhoi ku, 
  Aringting hina naleng pikhai, 
  Atu piulo, Rapiu na ngamleng.

V4: |
  4. Tuhoi kadih mania marengde, 
  Rapiu nang ringbo chamdin ronne, 
  Chalui niu dinronne shai makthen.

