ID: "156"

Title: "RAPIU NIU WANGLAN RABO"

Key: "A"

Time signature: "6/8"

V1: |
  1. Rapiu niu wanglan rabo pawansi nawang sude, 
  Phuilo pawansi nabibi wang sude; 
  Maruk khaimibo lulanra leng Rapiu wanglan rabo-e, 
  Oh! Halleluyah Jesu Chawang m'wangde.

CH: |
  (Chorus)
  Sulo sulo, ahiuna yo; 
  Jesu Khrista niu chawang m'wang rabo wande; 
  Rapiu gu phumling mai hina, 
  Oh! mathaboniu phuimide, 
  Oh! halleluyah Jesu chawang m'wangde.

V2: |
  2. Rapiu niu wanglanrabo pawansi nawang sude, 
  Kamuang ga ntaolu kendijiu wangne; 
  Tinggen mazadungniu thuanjiu kuthubo paken dimilo, 
  Oh! halleluyah Jesu chawang m'wangde.

V3: |
  3. Rapiu niu wang lanrabo pawansi nawang sude, 
  Phuisulo, Zion luangga wanlan sude; 
  Pah niu lungsamai hinatu majang lujiu wanglan sude, 
  Oh! halleluyah Jesu chawang m'wangde.

V4: |
  4. Rapiu niu wang lanrabo pawansi nawang sude, 
  Kadenjiu bammai hinatu lusune; 
  Kiulanbo nai halan makjiu, 
  Tingtheng jengjiu lungphu sune; 
  Oh! halleluyah Jesu chawang m'wangde.

