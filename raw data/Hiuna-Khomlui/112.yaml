ID: "112"

Title: "HAIBO DIHGA I NIU WANGBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Haibo dihga I niu wangbo, 
  Thingna dungniu singpon riga; 
  Mathak khailu jiu lemtad mibo kum, 
  I niu wangbo.

CH: |
  (Chorus)
  Riat khai mibo ramsi wang tangra, 
  Akan bamjiu lemsi saira; 
  Soalan makjiu lemtad mine, 
  Rapiu niu kaden khaibo ram gasi.

V2: |
  2. Saron pen wi penbo ramga, 
  Kachia namdi mathabo ram; 
  Sibo ramga lung raleng Jesu niu, 
  Nkhuan bamme.

V3: |
  3. Haibo kadih remkiu mide, 
  Tingtheng lakde haibo kadih; 
  Kadih ram wihina saodiak lujiu, 
  Lemtad mine.

