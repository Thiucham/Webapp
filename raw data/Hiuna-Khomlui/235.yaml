ID: "235"

Title: "TINGWANG NIU THOIDAM"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Tingwang niu thoidam kawi pijiu, 
  Tingpui maruijiu lungmilo; 
  Khrista kikhun thiulujiu, 
  Tingtheng manaijiu lung milo.

V2: |
  2. Tingwang niu thoidam khai bide, 
  Pathuan thiujiu lungbam milo; 
  Khrista gu benbo biusi, 
  Pi ngao milo, maihina ga.

V3: |
  3. Napao nanaitu kungjiu lunglo, 
  Ri nga jiu lungbo pui thiulo; 
  Chakhuang thiujiu lungmilo,
  Rapiu maning tenjiu bamlo.

V4: |
  4. Duan wijiu lungbo kikhun thiulo, 
  Khat khat tu kungjiu lungmilo; 
  Chunkhat pumkhat thiujiu, 
  Khrista gu wi lunglenbo thiumilo.

V5: |
  5. Khrista kikhun thiujiu lungmilo, 
  Naki talung wibambisai; 
  Rapiu wanglanbo naisai, 
  Tingtheng ringbo pirun pine.

