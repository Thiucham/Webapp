ID: "186"

Title: "RAPIU TINGWANG"

Key: "E"

Time signature: "2/3"

V1: |
  1. Rapiu Tingwang si atu khuanpao-e, 
  I niu lunibo hina machang bamme; 
  Paniu madiabo piuriang liga jukhai, 
  Tadui kawibo ajai ga jukhai bi ye.

CH: |
  (Chorus)
  Paniu ajengtan kasan pikhai bi ye. 
  Paniu majibo npui ga jukhai ye. 
  Paniu ladren khaibo kumjiu.

V2: |
  2. I niu tamiu thubo ga tad bamdi, 
  Rapiu yo, I ra wadi ping lakge. 
  Palamra nang niu atu majang jiu bamme, 
  Nagu mily khuanbo thun nai singtiang siniu.

V3: |
  3. Mikre maisuang ga nang akuang kan khai, 
  Nang atu chakhuang thiubo sang maikumjiu. 
  Apiangsi pawang cheng tangbo masunphui khai ye, 
  Nagu kawibo nai lungsabo siniu.

