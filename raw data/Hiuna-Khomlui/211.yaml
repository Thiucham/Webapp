ID: "211"

Title: "SADOM KADIH NIU TINGWANG TU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Sadom kadih niu Tingwang tu simakbo jengniu, 
  Tingwang lungpom paliu khu wangne.

CH: |
  (Chorus)
  Malumlulo, Tingwang lungpom ngaora 
  Ping mai hina niu. (2x)

V2: |
  2. Tuhoi di malummak maira Sadom sikumjiu, 
  Tingwang lungpom paliu khu wangne.

V3: |
  3. Palungsa anuan suang kengye tuhoidi kubam, 
  Nang nuan hina khiu masan khaine.

V4: |
  4. Jesu khu ngam hina bamme, patu malum sai, 
  Chamijai gasu rankhai bine.

