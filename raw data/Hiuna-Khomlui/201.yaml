ID: "201"

Title: "I NIU CHIUYE PAKENDIBO"

Key: "F"

Time signature: "4/4"

V1: |
  1. I niu chiuye, pakendibo Rankhaibopiu rachamsi, 
  Akum maitu ranpad raleng Calvary ga shaikhai; 
  I niu chiuye, pazai kungbosi aleng niu pikhai ye, 
  Anuan hina luthuanjiu chari sidi ngam khaide.

CH: |
  (Chorus)
  He! chari ngambo Rankhaipiu, 
  Jesu zan tingtheng jeng; 
  Pazai kungbo seniu atu liukhaijiu piduakde, 
  Jesu niu lungsa khaijiu lungsapao I hungbamme, 
  Pazai masanbo siniu atu chari ngamkhaide.

V2: |
  2. I niu chiuye, tasibo ngam gasu piwi khaibosi, 
  Paphi tangmai tu pi tadkhai, miktiatbo pi ngao khai; 
  I niu sene, lungsajiu Jesu atu piwi khailo, 
  Jesu wanglujiu rankhai atu piring khaide.

V3: |
  3. I niu chiuye, aleng paniu chaki kaden khaibo cham, 
  I niu chiuye, duidi genlam kachiapui luanlamsi; 
  Masan maidung niu chaluithiujiu kenpadbo npui gasi, 
  Naikhat tingmik sigasi I chari ngamlui thiune.

