ID: "74"

Title: "KARAIDAO RIANKHAIBO DIHGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Karaidao riankhaibo dihga a Rapiu niu, 
  Pamaidungtu lulanra maning jiu; 
  Paopeh dungtu juken khai lande.

CH: |
  (Chorus)
  Malumjiu piu maidung leng-e, 
  Riankhai mibo Canaan ramse; 
  Kachia niu alon khaiboram, 
  Siga lungra I alung line.

V2: |
  2. Malum makmai Israel mai jat hina niu, 
  Pharao vang gasu jupat khai liudi; 
  Rapiu lungsiat tu sikhai makge.

V3: |
  3. Lungsa maitu juken pat rabonai nchun, 
  Mily zainiu kamun ga tailujiu;
  Paliu tu Rapiu niu rankhaide.

V4: |
  4. Tingwang niu kadih tu hai jiukha lungsajiu, 
  Panahpiu khat natuse pikhai-e; 
  Patu malummai ringrabo-e.

