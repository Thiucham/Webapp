ID: "203"

Title: "PHUILO PETER NIU PABAM HINA"

Key: "E"

Time signature: "6/8"

V1: |
  1. Phuilo, Peter niu pabam hina ga, 
  Pawan khat dinron jiu tad bamga; 
  Chariu magian thiumai hinatu, 
  Wikhaimibo makma singna maidung.

CH: |
  (Chorus)
  Wikachangbo hai a Rapiu ye, 
  Palad piumai di piumak maidi, 
  Chariu magianthiubo wang dasai, 
  Rapiu makjiu I saorabo bamha.

V2: |
  2. Tabitha kubo maipui khadtu, 
  Ramna mirabo pawan siakga, 
  Peter niu Tingwang zan ga kheng jiu, 
  Shaijiu bambo puitu jusu khaide.

V3: |
  3. Khrista gu racham halan lakge, 
  Chariumai chunsamai hinatu, 
  Phuilo, paracham niu kimkhaide, 
  Rapiu makjiu agi manaibo ha.

