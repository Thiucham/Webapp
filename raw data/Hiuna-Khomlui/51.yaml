ID: "51"

Title: "SAOKUM MAINIU"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Saokum mainiu Khrista ga bamme sai, 
  Pahai dam kasan lanbo mania side; 
  Kaguang dungse hakam mide, 
  Phuilo, mania hina kasan lande.

CH: |
  (Chorus)
  Tingwang matha malabo wahina, 
  Khrista zai niu aleng matha liukhai; 
  Manangbo wadaodi bamlan lakge, 
  Phuilo mania hina kasan lande.

V2: |
  2. Aleng Eden kasan wanglan sude, 
  Jesu khuga malum khaibo penniu; 
  Kashaibo ganiu ringlande, 
  Rapiu Jesu lungsa penniu daode.

V3: |
  3. Tamiubo ga nsuan benpadbo kum, 
  Alung chun ga kasan lonkhai lande; 
  Oh! a Rapiu yo jukhailo, 
  Shaibo katang naleng I niu thiune.

V4: |
  4. Lungsa maidung yo, Rapiu ga wanglo; 
  Pawan wibo ga Rapiu leng tenkhe; 
  Paopeh riak situ saodiajiu, 
  Eden kasan ga aliu lung bamne.

