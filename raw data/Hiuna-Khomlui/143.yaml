ID: "143"

Title: "KANAMBO TINGMIK WANGSUNE"

Key: "G"

Time signature: "6/8"

V1: |
  1. Kanambo tingmik wangsune, 
  Tamiubo si wang misune, 
  Nuan kadih tadtonbonai sai, 
  Kadihtu maning lanlakge.

CH: |
  (Chorus)
  Malum lumai dejiu chunwira? 
  Tinggen kadih wang tangbo naisai, 
  Kapjiu chariubo sibamlan lakmine, 
  Tingtheng jeng Rapiu tu thuanbamne.

V2: |
  2. Tingkum pawan maning phuilo, 
  Wahina kalikam mine, 
  Pabam machang sabokhuan niu, 
  Wang sune kadihri gahai.

V3: |
  3. Rapiu gu tingmik wangmak ga, 
  Pawan kabambo tinglung ga, 
  Nahiuna ringra phiu lulo,
  Rapiu si wangji mirade.

