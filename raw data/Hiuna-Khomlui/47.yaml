ID: "47"

Title: "KADIHRI SI I RING BAMBO RAMME"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihri si I ring bambo ramme, 
  Amanbo haye Rapiu ga makjiu; 
  Tinggen dihra aman changbo ramme, 
  Chunwi mathabo si ngaosune.

CH: |
  (Chorus)
  Oh! lungsajiu natu kujiu bamme, 
  Chalung lisulo kakungmai; 
  Pawan hade kadihri haise, 
  Jesu ga apum pipad khaide.

V2: |
  2. Rapiu nangniu atu jukhailo, 
  Na sai I suine tinggen ki tadra, 
  Apum nai ahiuna pakhiangna; 
  I niu Rapiu ga pipad khaide.

V3: |
  3. Kadihri maidung lung li sulo, 
  Rapture wan nade kadenjiu bamlo; 
  Pawan hade kadihri haisi, 
  Rapiu niu natu kujiu bamme.

