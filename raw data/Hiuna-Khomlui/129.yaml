ID: "129"

Title: "RINGRABO NPUI GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Ringrabo mpui ga aliu padlujiu, 
  Maihina jeng ganiu; 
  Kamaobo mpui ga rontad bamme, 
  Nkha khaira maihah.

CH: |
  (Chorus)
  Jupad lujiu nang patu ringra jengniu dinlo, 
  Dejiu wiralo nang hami maitu phiu wangsai; 
  Tathuan wibo daone.

V2: |
  2. Hiuna shaibo bamhina ga tadjiu, 
  Ringbo cham paoronlo; 
  Pah lungsabo wan siloi misaira, 
  Lungniudi ngao lakge.

V3: |
  3. Tinggendih kawibo ga lungra leng, 
  Rapiu niu kubamme; 
  Namdi wibo Zion Salem ramga, 
  Chariu kapbo hane.

V4: |
  4. Tingnai mikpui sangkhat lungjiu bamdi, 
  Naikhat kumjiu lungne;
  Tingtheng jeng chawang thiujiu bammine, 
  Tinggen dih ga.
  Dejiu wiralo nang patu ngaobonai dasai, 
  Kadihri gu chariubo hina tu mangaine, 
  Benbo Khrista suang ga.

