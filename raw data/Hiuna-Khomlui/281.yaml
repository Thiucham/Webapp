ID: "281"

Title: "NUAN BANGRIT PHUNG JIU BAM"

Key: "D"

Time signature: "4/4"

V1: |
  1. Nuan bangrit phung jiu bammai yo; 
  Khrista luthuan khaine, chiu-e; 
  Tinggen kadih ngut lura leng, 
  Aliu tu kujiu bamme.

CH: |
  (Chorus)
  Halleluyah, halleluyah, hosanna, halleluyah. 
  Halleluyah, hosanna ringbo daode.

V2: |
  2. Khrista Cross ga shai bambosi, 
  Nang nai aleng-e, lukhailo; 
  Tuhoi nang lungliwang lulo, 
  Khrista niu kujiu bamme.

V3: |
  3. Tinggen dihra wichangbo-e, 
  Kachariubo bamlan lakge; 
  Maihina chunwibam sune, 
  Halleluyah, hosanna.

