ID: "18"

Title: "TASI JESU LUNGSA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tasi Jesu lungsa, 
  Anuan suang di diang-e; 
  Akumjiu nuan phung maidung leng, 
  Pazai luang kiukhai-e.

CH: |
  (Chorus)
  Palungsa I makum ngamlu lakge, 
  Apumtan akhuan bamthen thuanjiu bamliudi;
  Thuankim lulakge tasi Jesu lungsa.

V2: |
  2. Lungsamai ben jiajiu, 
  Aliu tu kubamme;
  Lungsamai akhu wanglulo, 
  I pi mathak khaine.

V3: |
  3. Nazu maripadlo, 
  Rankhaibopiu khulam; 
  Namao hina kuak khai bine, 
  Chiujiu kujiu bamme.

V4: |
  4. Kadihri mai phuilo, 
  Pawan hai hawangde;
  Suikhaibo wan ga wangmaise,
  Pasan kawimai-e.

