ID: "262"

Title: "NAIMIK KIUMAKBO RAMGA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naimik kiumakbo ramga, 
  Kisin kawibo gasi; 
  Pawansi tadlan lakge, 
  Wahina kuilan lakge.

CH: |
  (Chorus)
  Tinggen ga mikdui luang lakge, 
  Kashai thiuniubo diha-e; 
  Takum pariak chaklakge; 
  Chun tamiubo diha-e.

V2: |
  2. Kamun hina kachia-e, 
  Kisin kawibo gasi; 
  Puiki di kachia niu ben, 
  Chun tamiubo di ha-e.

V3: |
  3. Naimik biu pageng ha-e, 
  Kisin kawibo gasi; 
  Milypoi niu benbamne, 
  Chun tamiubo diha-e.

