ID: "202"

Title: "NANUAN JENG NIU THIUNIU SAI"

Key: "G"

Time signature: "6/8"

V1: |
  1. Nanuan jeng niu nang thiuniu sai, 
  Dinlo Jesu piwikhaine; 
  Ranlubo singgiu tu phuilo, 
  Ranlubo singgiu Calvary; 
  Kadih luangri ga long kiu-e, 
  Nang thiuniubo wilura leng, 
  Singgiu Jesu zaibam.

CH: |
  (Chorus)
  Thiuniu wira singgiu Jesu zaibam, 
  Nang maodung jengniu, 
  Thiuniu bamsai khenglo; 
  Wirabo bam Jesu zainiu nangtu, 
  Kam masan lubui ye.

V2: |
  2. Detiu kamaobo phutmaklo? 
  Ranlurabosi tuhoi ye; 
  Pakendijiu wangji sune; 
  Kamao maidung chariu raleng; 
  Tingwang lungpom nang marilo, 
  Kamaobo nai kasabosi, 
  Nang phutpad misulo.

V3: |
  3. Maomai Tingwang khu wang lulo, 
  Manbo ngaone, Tingwang khuga; 
  Thiuniubo hina wiraleng, 
  Natu ranlura pazailuang; 
  Pasi Tingwang mily poi ye, 
  Kathiu kaniu wiluraleng, 
  Singgiu Jesu zai ye.

