ID: "71"

Title: "I KADIHGA KALUNG TING CHUN"

Key: "E"

Time signature: "4/4"

V1: |
  1. I kadihga kalung ting chunwi mathajiu, 
  Calvary lungsa tazai luangbose, 
  Alung chun ga wangtang khaibosi, 
  Hamirabo dih gasu atu rankhaide.

CH: |
  (Chorus)
  He! nakhulam I zuan wang nge, Rapiu; 
  Wa khatdi masia makge kadihga, 
  I ron tadga Rankhaipiu tu lukhaide, 
  Calvary zai niu atu rankhai.

V2: |
  2. Tadraimai kawimai nai takum, kawangsi, 
  I maning ye, a Rapiu tu thuanbo; 
  Shaibo tang atu chalungsha piu, 
  Amen rimide, Rapiu atu kuak khailo.

V3: |
  3. Pating theng jiu Rapiu tu I sao dialiudi, 
  Dejiukha chengsha phung jiu bamliudi, 
  Pah kakungbo chamniu atu ku, 
  Alung ga mathabo halan lakbo pikhai.

V4: |
  4. Akhuan nai atu nang matha pibo Rapiu, 
  Pawan wibo nang mathapi Rapiu, 
  Natu thuanbo gusi kuimakjiu, 
  Tuhoira a Rapiu natu thuan kiusune.

