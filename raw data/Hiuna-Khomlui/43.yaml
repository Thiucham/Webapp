ID: "43"

Title: "RAPIU NIU KUBAMME"

Key: "E"

Time signature: "4/4"

V1: |
  1. Rapiu niu kubamme nuan phung maitu, 
  Na nuanse tazai kum heng bam liudi; 
  Khiu masan khaine Calvary zainiu, 
  Wang lulo nang dejiu ribam ralo.

CH: |
  (Chorus)
  Kujiu bamme natu kungbo donniu, 
  Kabun kumjiu masan khaine tiu-e; 
  Wang maihina ri nga jiu bamne, 
  Halleluyah thuanjiu bamne, Jesu tu.

V2: |
  2. Paladpiu maidung donwi mai thiune, 
  Dejiu wiralo ranlumai thiusai; 
  Tinggen ramga paken dimai thiune, 
  Kangampiu Jesu khuga wanglulo.

V3: |
  3. Namen jijiu wanglo khamle bamga, 
  Pawan tuan mibine mazat sulo; 
  Kamaobo ngam hina phut misulo, 
  Ribam talo pawan tuan mibine.

V4: |
  4. Suan naileng dakkhai lanjiu bam talo, 
  Thainai tingmik Jesu tu lukhailo; 
  Shaibo nuan npui gasu malan wang jiu, 
  Sanwi mai thiusulo lungsa maidung.

