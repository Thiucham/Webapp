ID: "293"

Title: "I WADAODI MANGAI LAK"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. I wadaodi mangai lakge, 
  Apui niu kungjiu din khaibo; 
  Ramna khaide apam nahtu; 
  Maning tao-e apui singbo.

CH: |
  (Chorus)
  Apui lungsa makumbo ga, 
  Tuhoidi pa ringbamra kum; 
  Tingkai gasu pakhuan chiuwang, 
  Maning tao-e apui singbo.

V2: |
  2. I wadaodi mangai lakge, 
  Paniu alung matha khaibo; 
  Tingwang niu se-e I tenbo; 
  Maning tao-e apui singbo.

V3: |
  3. Tingkum haitheng I mangai lak, 
  Apuiniu kung jiu dinbo lad; 
  Pabam 'dao tu lungchun niu ngao,
  Manuan jiu apui niu singbo.

V4: |
  4. I wadaodi mangai lakge, 
  Palad niu atu majang bam; 
  Anuan hina paniu kuak khai, 
  Rapiu chiukhai apui singbo.

