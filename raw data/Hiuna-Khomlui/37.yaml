ID: "37"

Title: "JESU KUYE NUAN BANG LUTHUANRA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jesu kuye nuan bang luthuanra, 
  Satan vang nang thiubamra khama? 
  Lungsajiu kuga wanglak jiuma?

CH: |
  (Chorus)
  Lungliwang maitu paniu luni-e, 
  Tuhoi limaksai pawan hade; 
  Paniu dinbo wan wangtang sude.

V2: |
  2. Khrista niu tazan dung kuboga, 
  Nazan kusai dejiu chunwira! 
  Kachia namdi ga lungni makma?

V3: |
  3. Khamle bamga ngutlo chiu dinne, 
  Tuhoi ngutkhai mak maidung sira;
  Kubamdi malan wangbi lakge.

V4: |
  4. Tinggendih wise din ngam lakge, 
  Mazadung nai Siraphim dungniu;
  Patu thuanbo lui niu kanginne.

