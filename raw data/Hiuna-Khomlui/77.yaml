ID: "77"

Title: "PAWANSE CHAK LUJIU LUNGLI SULO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Pawanse chak lujiu lungli sulo lungsa maidung,
  Malumjiu namik rakpatlo; 
  Rapiu Jesu wangne tiujiu, 
  Madan dungniu madu bamme.

CH: |
  (Chorus)
  Rita sulo lungsa maidung, 
  Rapiu Jesu wang jisude; 
  Chalung tanmai malum makmai, 
  Silakge pah wangbo wan ga.

V2: |
  2. Tinggen lam chahiu chagan naimik dungtuse phuilo, 
  Rapiu ladrense wangsude; 
  Malumjiu masuang lam phuilo, 
  Rankhaibopiu wangji sune.

V3: |
  3. Phuilo dutsy bang di pabuan kasan buanlan sude, 
  Tinglum wanse nawang sude; 
  Chawangdih nai param chamse, 
  Chari thiura kaden loide.

V4: |
  4. Phuilo Noah nai Lot ken ga pat mibose kumjiu, 
  Aliu gadi wangkhai sune; 
  Saoniu tadjiu sao bamdiak ra? 
  Kaden sulo nawang sude.

