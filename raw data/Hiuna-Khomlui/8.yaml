ID: "8"

Title: "A RAPIU NIU CHAMAI HINA TU"

Key: "E"

Time signature: "6/8"

V1: |
  1. A Rapiu niu chamai hina tu dam khai ye, 
  Wa kasimai thiujiu Kawicham dinron raleng; 
  Hiupuina ga zipjiu bam maidung tu, 
  Makiangsu khaira natu langwangbo-e.

CH: |
  (Chorus)
  Wa kasimai nbai bamtalo, 
  Wa kasimai ji bamtalo; 
  Silu ngaolu chiulubo hina dinron sulo.

V2: |
  2. Khangsia maitu phuilo phaimiu pi thiukhai-e, 
  Hah mirabo hiupuina dungtu di ranlura; 
  Haisi Rapiu gu pumtan niu makma! 
  Saokum mai phaimiu thiujiu lungbambo hai.

V3: |
  3. Khangsia ra tasi ningting sibam lujiu, 
  Hiupuina ga walam simakjiu zipjiu bamme; 
  Malum maitu kadara wangbonai, 
  Nang detiujiu Rapiu tu adao ralo?

