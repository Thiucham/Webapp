ID: "137"

Title: "JESU WANGLAN RABO WAN"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jesu wanglan rabo wansi nawang sude, 
  Kadih hai loimakga kadenlo zathina niu; 
  Pah wangsai jengphi luraleng, 
  Ramting pakhiangna habo naisai.

CH: |
  (Chorus)
  Tinggen npuiga I tadsune, 
  Chawang bam suang ga wang arongne; 
  Halleluyah zathina niu, 
  Chawang tu thuanjiu chalui thiune.

V2: |
  2. Tinggen lamsu make khuan niu kuwang sune, 
  Papumsiak wang sune, Khrista ga shai mimai nai; 
  Lungsa maidung surai sune, 
  Sisai ringbam mai adao sune.

V3: |
  3. Tinggen namdi gasira benbo niu phui ye, 
  Siga Khrista lungbam, aliu nai lungbam chamne; 
  Kamong rilam phung khang sune, 
  Siga tingtheng jeng lungbam sune.

V4: |
  4. Kahbo phai maliang niu apuan thiujiu piune, 
  Khrista 'biu gasi patu thuanbolui thiu chamne; 
  Make khuan nai nthiam khuanniu,

