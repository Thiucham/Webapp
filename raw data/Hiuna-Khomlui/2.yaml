ID: "2"

Title: "RINGRA LENG TINGWANG NIU"

Key: "A"

Time signature: "6/8"

V1: |
  1. Ringra leng Tingwang niu ku-e, 
  Nuan npui ga shai bam maitu;
  Palung chariujiu kubamme, 
  Wangdaolu maidung san wi-e.

CH: |
  (Chorus)
  Ring raleng paksulo, (2x)
  Shaibo nuan npui ga bam maidung; 
  Tuhoi masuang lam zuanjiu paklo.

V2: |
  2. Ring raleng Tingwang niu ku-e, 
  Sodom kadih ga lung maitu; 
  Maidi palad chiukhai makjiu,
  Lot kikhuntu ra ranlu-e.

V3: |
  3. Ring raleng Tingwang niu ku-e, 
  Majatjiu lunglilu sulo; 
  Masai mari phuilan maira, 
  Lot nao kumjiu nang shai lune.

