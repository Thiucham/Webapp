ID: "275"

Title: "HE! MATHABO TINGGEN RAM"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! mathabo tinggen ram, 
  Dedao niu wang tang ralo? 
  I machunne, nawangdih tinggen ramsi, 
  Nawangdih tinggen sira tingtheng jiu halan lakge, 
  He! I maning nge, mathabo tinggen ram.

CH: |
  (Chorus)
  Dedaoniu wang tang ralo? 
  Debonai niu wangtang ralo? 
  Khamlan lakbo tinggen ram, 
  Dedao niu I ngao ralo? 
  He! I maning nge, mathabo tinggen ram.

V2: |
  2. Kadih gu chunwi siniu, 
  Atu hiam wangbam liudi, 
  A Rapiu niu atu majangjiu bamne, 
  Chariubo kadihram tu saodiajiu I tatdasai, 
  Kadih chariubo tu maning lanlakge.

V3: |
  3. Nawangdih tinggen dihra, 
  Chahiu, naimik biu ha-e, 
  Tingthung tanbo nai chariubo bam lakge, 
  Milypoi niu benbamne chuntamiubo bamlakge; 
  He! I maning nge, mathabo tinggen ram.

