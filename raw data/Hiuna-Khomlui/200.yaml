ID: "200"

Title: "JEPTHA NATU AMON MAI"

Key: "E"

Time signature: "6/8"

V1: |
  1. Jeptha natu Amon mainiu chari thiuraleng, 
  Jehovah niu natu kupad, 
  Nang lung manang makjiu chaplo,
  Chariu songha kheng ngam lakbo nakhu ga wang ne.

CH: |
  (Chorus)
  Nangniu kung thubo nangnah puitu nang lungsa ma?
  Lungsa bamdi phut khai sulo, 
  Rapiu chun ne, manang mane, 
  Lungniu bamdi Jehovah niu luni mijiu ye.

V2: |
  2. I niu lungsathubo anah khad ronna haitu, 
  Phui ngam lakge apam nah tu,
  I niu aphai phek kek lujiu, 
  Alung chariubohai dinngam lakge, he! apiu.

V3: |
  3. I niu Rawang khuga ladren thiukhai mibosi, 
  Detiu ralo, apam nah yo? 
  I niu lungsabo anah tu, 
  Israel mai kadih leng pipad khai mirabo de.

