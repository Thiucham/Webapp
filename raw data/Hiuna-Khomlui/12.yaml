ID: "12"

Title: "HAIBO KADIHGA I RINGBO TING"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Haibo kadihga I ringbo ting loi dasai, 
  Paken dibo chawang tu I ngao dao sune; 
  Pasuang ga aten hinase lenkhai dasai,
  Paniu machang khai sune.

CH: |
  (Chorus)
  Lungsabo chawang niu, (2x)
  Lungsabo niu machang khairabo leng khuanbam; 
  Tingwang ram kendibo gase, 
  Ngut raleng lang khaisune.

V2: |
  2. Kungbo lungsamai hina tadrai kam mide,
  Tinggen ram kuilan makbo gase ngut raleng; 
  Kuilan makbo Tinggen salem ga karuhne, 
  Chawang puanse khailujiu.

V3: |
  3. Ritlangbo Cross se masenjiu I pon diuma? 
  Chari tanbo niu naimachang aphen bamdi; 
  Pakendibo tinggen chawang tu suang bamne, 
  Immanuel ram gase.

V4: |
  4. Kadih phuikhaijiu achun wirabo bam hah, 
  Tamiubo niu gomnam jiu bambo ramgase; 
  Tiudi kangambo chawang Jesu suang gase, 
  Ngambo luise thiu bamne.

V5: |
  5. Nuan gasu chalung liwang lumai hinara, 
  Tinggen ram kendibo namdihga ngut raleng; 
  Karingbo chamse phung lumai sira ngutne, 
  Chawang niu haitiu dinne.

