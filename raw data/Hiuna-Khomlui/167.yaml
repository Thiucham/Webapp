ID: "167"

Title: "TINGWANG GASU RUANMENG"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang gasu ruanmeng lujiu, 
  Haibo dihga lungbambo hai, 
  Kadih tinglang haira tingtheng ringra makge, 
  Lungsabo jeng gasu wanglo tiujiu kuwe.

CH: |
  (Chorus)
  Oh! tasi ye atu lungsabo, 
  Ajeng gasu shaikhai bosi,
  Wanglo thuankiu sukhe; 
  Rankhaibopiu tusi, 
  Patu thuanbo makjiu, 
  Kaki wibo haye.

V2: |
  2. Tingwang tuhoi I wangsude, 
  Napamga wang ye lukhailo, 
  Kadih tinglang haira tingtheng ringra makge, 
  Lungsabo jeng gasu wanglo tiujiu kuwe.

V3: |
  3. Kadih rapen kum tinglang hai, 
  Pawan khatga hakam sune, 
  I niu khengbo hina aleng pikhai lande, 
  Lungsabo jeng gasu tinggen kham lekhaide.

