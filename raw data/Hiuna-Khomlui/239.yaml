ID: "239"

Title: "CHABONMAI NALIU CHUNWI"

Key: "E"

Time signature: "6/8"

V1: |
  1. Chabonmai naliu chunwi di ri nga lulo, 
  Nalung chun saisui jiu kamnibo kam lulo, 
  Chiudi wakhat ra nang maning khailan ra-e, 
  Kanambonai Tingwang ladzan thiusang jingne.

CH: |
  (Chorus)
  He! nang tingtheng jiu chabon lunlung thiu bamlak, 
  Siniu tuhoi nang tu Dampao Tingwang jeng niu, 
  Nang ringting paten thiujiu maning tao bamlo, 
  Tingmik khatdi tingkum si hawang makha ga.

V2: |
  2. Chabonmai naliu dungra riphenmai ben ga, 
  Pawan withujiu kabam tavai pithu ye, 
  Sulo, Tingwang ten thiuraleng marak lulo, 
  Nang tenlu bui ting ntou achung bam rama?

V3: |
  3. Chabonmai naliu nah kha-e chiu dintulo; 
  Nang nahkha-e di mainiu majommala tu; 
  Nalad nalui di najai ali dung gasu, 
  Nang lungsabo gasu maitu lunglen lulo.

V4: |
  4. Chabonmai naliu leng pating khat wang sune, 
  Naphi naben niu nang pum phung matan bamlo, 
  Naphi naben hai n-nuhjiu kaphik sune, 
  Nakon pang di namik ngao ren ra misune.

