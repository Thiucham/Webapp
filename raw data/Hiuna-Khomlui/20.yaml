ID: "20"

Title: "KADIHGA MANAIBO PHIU BAMDI"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kadihga manaibo phiu bamdi, 
  Daomakge Jesu makjiu; 
  Jesu ronnaye manaibo wang, 
  Kadih ga kawibo haye.

CH: |
  (Chorus)
  Agimanaibo ngaoni sai, 
  Jesu tu chaka thiulo; 
  Agimanaibo Jesu ye, 
  Wangmai hinaniu ngao lune.

V2: |
  2. Kadih ga manaibo hamide, 
  Kasabo niu phui mide; 
  Rapiu ga manaibo wanglulo, 
  Tuhoi phiurabo wan side.

V3: |
  3. Kadih ga mathabo daobamdi, 
  Sira hahlan nuang miye; 
  Jesu tu chaka thiulung misai, 
  Mathabo tingtheng leng daoye.

