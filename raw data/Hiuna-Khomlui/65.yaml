ID: "65"

Title: "KADIHGA MAI KHAT DI"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. Kadihga mai khat di lungwang lon nia makge, 
  Tuhoi ringjiu bamga Jehovah ngam kamlo; 
  Pawan nawang sude kaden mawijiu bamlo, 
  Tuhoi tiubo wanse nang nai aleng gapde.

CH: |
  (Chorus)
  He! Khrista gu lungsabo lutao maidung yo, 
  Tuhoi wan ga Khrista leng taten thiu sukhe; 
  Suan naira dekumbo lunlung ga lung ralo, 
  Nangdi I di simak Khrista gu tingmikse.

V2: |
  2. Panah dungtu kungju lubo jeng gasu niu, 
  Nang karingting pise khaijiu bambo gu-e; 
  Aliu tuhoi palungsa simak bamra ma? 
  Pating pawanse mai gadi pise makge.

V3: |
  3. Khrista naleng jengniu pawan theng jiu khuan bam, 
  Pah lungsabo wan ga wang lumak maituse; 
  Khrista palung pom khai mibonai dasaira, 
  Nang chuakjiu hui bamdi silanra gu makge.

