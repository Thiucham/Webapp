ID: "32"

Title: "ALIU LUNGBO KADIHRI HAI"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Aliu niu lungbo kadihri gahai,
  Kasabo niu phui ye;
  Khantiakbo nai lungwi leng ronna mijiu, 
  Rapiu ten thiuleng mai hade.

CH: |
  (Chorus)
  Thaisu lungli wanglo Jesu niu kuwe.
  Nahiuna leng maranjiu tenkhai sulo;
  Pawan hade a Rapiu wangkiu lan raleng,
  Pah wang bonai sai bensiam dung hami sune.

V2: |
  2. Khristen thiujiu shaira mai kengmide, 
  Ringbo npui simakjiu; 
  Tingwang ten thiu maidung niu dinron bamdi, 
  Lukhaira maira ha mide.

V3: |
  3. Tingwang racham chiulujiu ngaolujiu, 
  Masai khinjiu lungmi; 
  Wameng kahum mainiu ringbo pui ngaolujiu, 
  Rapiu ten leng thiukam mide.

