ID: "75"

Title: "LOIBO WAN WANGSUDE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Loibo wan wangsude lungsa maidung yo, 
  Nalung tanmai thiutheng bamtalo; 
  Kadih ga chawang hinase ha kammi sune, 
  Dinsilakbo pingbo wan wang sune siga.

CH: |
  (Chorus)
  Lungsamai naliu lung lisulo oh..oh, 
  Maning makbo wan ga wang sune; 
  Rapiu niu sulujiu nkham nam midasai, 
  Kapjiu huibam liudi nkham lelan bi lakge.

V2: |
  2. Ringbo Tingwang lad hina hai chiu lujiu, 
  Ntam jiu kanui khan jiu bammai; 
  Kadih ga chariu magen thiubo wang
  dasai, 
  Mikdui luangjiu ramnabo lunsi ngao sune.

V3: |
  3. Haibo kadih ga lungbam maihina tu, 
  Tingwang niu ladzan thiubo naisai; 
  Chiulujiu, ngaolujiu, sijiu, malum makmai, 
  Tinggen namdih ga paliu leng chabam hade.

V4: |
  4. Malum maihina niu tinggen wangdasai, 
  Kadih ga malummak maidung ra; 
  Satan niu paliutu majangjiu lung dasai, 
  Chariubo nai pingbo niu paliu dam thiune.

