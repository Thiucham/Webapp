ID: "209"

Title: "DAHTING NOAH KEN GA KUMJIU"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Daating Noah ken ga kumjiu, 
  Mai hina hai nuan niu phuide; 
  Sadom nai Gomora ga padmibo kumjiu, 
  Paruanna chunrang thiu jengniu, Kam maha mide.

CH: |
  (Chorus)
  Noah ken ga mai hinatu, 
  Tingwang niu tadui niu kammut; 
  Sadom nai Gomora namdi niase kumjiu, 
  Paruanna chunrang thiu jengniu, Kam maha mide.

V2: |
  2. Tuhoi ken ga mai hina niu, 
  Taniabo siniu phui mide; 
  A Rapiu niu rian khaibo ga wangtang dasai, 
  Tinggen dih ga sidi paliuleng chabam hade.

V3: |
  3. Haijeng gasu singnah nangdi, 
  Nthai suniu lungli sulo; 
  Natu lungsapiu niu pakhu wangra kubam, 
  A Rapiu Rankhaibo piu niu natu gukhaira.

