ID: "179"

Title: "ARINGTING PAWAN KASIA LUNG"

Key: "G"

Time signature: "⚪"

V1: |
  1. Aringting pawan kasia lung ga, 
  Rapiu tu mangaide, 
  Diujiu tadbo I malan wangde, 
  Anuan hina sao khaidia lujiu.

CH: |
  (Chorus)
  Lukhai khelo! atu Tingwang, 
  Diujiu atu phut khai landia dulo, 
  I suanbo nangniu si ye, 
  Hiuna sanbo alung ga ngut bamkhailo.

V2: |
  2. Naikhat Rapiu akhuga dinne,
  Nang lung manang talo, 
  Paman thiumak ringbodui saklo, 
  Hiuna charibo pikim khailo.

V3: |
  3. Puimengbo I thiude nang suang ga, 
  A Rapiu yo, I hai; 
  Malan wangde, Tingwang nakhu lam, 
  I kap bamme, lungsa khai khelo.

