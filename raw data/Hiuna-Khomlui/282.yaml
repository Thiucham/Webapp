ID: "282"

Title: "NUAN NIU SUANGHA BAMGA"

Key: "A"

Time signature: "4/4"

V1: |
  1. Nuan niu suangha bam ga, 
  Natu'na I phiu-e; 
  Ating langhai I silumak, 
  Gukhailo he! Rapiu.

CH: |
  (Chorus)
  Palungsiat I malum, 
  Papam ga wang lungra; 
  Kungbo ben niu pamra, 
  Natu phiu-e, lungsa khaijiu, 
  Kuak khailo, he! Rapiu.

V2: |
  2. Anuan hai dichang-e, 
  Ripmibo nuan bangsi; 
  Anuan niu rimkhai mibosi, 
  Kuak khailo he! Rapiu.

V3: |
  3. Saoleng Rapiu shaikhai? 
  Saoleng Pazai luangkhai; 
  Nuan masanra nai mangambo, 
  Kuak khaira leng shaikhai.

