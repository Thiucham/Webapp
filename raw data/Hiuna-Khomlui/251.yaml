ID: "251"

Title: "HAI KADIH TU ARAMME"

Key: "D"

Time signature: "4/4"

V1: |
  1. Hai kadih tu aramme, tiu maning dulo, 
  Kakungmai Jordan genlam lungra tadmide.

CH: |
  (Chorus)
  Naimik niu benbo matha-e, 
  Chahiu, chagandung sidi; 
  Kadih mania wageng ha-e, 
  Benbo Jesu suang ga.

V2: |
  2. Sibo dihga shai thiuniubo hina hane, 
  Lungsamai tu maninglak Jordan genlamsi.

V3: |
  3. Malum maidung tinggen lam, 
  Tingtheng lungbamne, 
  Lungsamai tadrai maidung sega khuan bamne.

V4: |
  4. Malum maidung tinggen lam, 
  Tingtheng lungbamne, 
  Jordan giu kenpad dasai tinggen dih ngaone.

