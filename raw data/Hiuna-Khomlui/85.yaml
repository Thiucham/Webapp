ID: "85"

Title: "PATING THENG JIU"

Key: "D"

Time signature: "6/8"

V1: |
  1. Pating theng jiu ron meng lude aringting,
  Kadih witu lungsa jengniu; 
  Pawan wibo juh kammide, 
  Apumtan hina di thenthui kam mijiu.

CH: |
  (Chorus)
  I wang lande Rapiu pamga; 
  Mpui ronmeng tadbam gasu; 
  Lungsa pen niu kubo khuan chiude, 
  I malan wanglande.

V2: |
  2. Nuan gu wiga pitadra atu hiambam, 
  Tamiubo ga I rontad bam; 
  Shaibo nuan niu chawang thiu raleng, 
  Ahiuna chariu jiu rontad bamliu-e.

V3: |
  3. Tinggen dihga I wangtang bonai dasai, 
  Tinggen Rapiu pao I phung jiu; 
  Pakhuga I de phung wangra, 
  Pakhuga achun mathabo phungwangne.

