ID: "9"

Title: "HE! SINGNA MAIDUNG KADIH"

Key: "E"

Time signature: "6/8"

V1: |
  1. He! singna maidung kadih gahai, 
  Dithubo Rapiu gu kalentu; 
  Nahiupuina pakhiangna jaojiu, 
  Lutaora Rapiu ga kheng lulo.

CH: |
  (Chorus)
  Lungsiat niu dithu-e, 
  Rapiu suangga lungsabo niu dithu-e; 
  Nangdi Rapiu ten thiuniye sai, 
  Dithubo lungsiat se nang khuga bamlo.

V2: |
  2. Maidung niu mazadung lad sijiu, 
  Silujiu laddin khai ngam bamdi; 
  Dithubo lungsiat si haye sai, 
  Biujiu bambo bang khuanse kumme.

V3: |
  3. Lungsabo ra tingtheng kheng ngamme, 
  Maidung tudi nkha khai ngamme; 
  Lungsa bora manmabo ha-e, 
  A Rapiu lungsiat se nakhuga bamlo.

