ID: "259"

Title: "PUM WIJIU LUNGBO RINGTING"

Key: "E"

Time signature: "6/8"

V1: |
  1. Pum wijiu lungbo ringting hai hawangji sune, 
  Singna dungniu 'ning khailo pawan hade; 
  Nalung lilo, Tinggen kadih nade.

CH: |
  (Chorus)
  Pawan sade, pawan dunde, 
  Lungsa pawan loiwang sude; 
  A Rapiu si wangmi rade, 
  Nalung lilo, tinggen kadih nade.

V2: |
  2. He! ringbo cham chiumak maidung hinasi phuilo, 
  Tingtheng ring rabo kadih tu phuilo; 
  Zuanwang sulo, mikdui kiu kajaojiu.

V3: |
  3. Matha chunwibo pawan hai loiwangji sude, 
  Pawan hade, Rapiu ten thiu raleng; 
  Mathajiu Rapiu tensi ten sukhe.

