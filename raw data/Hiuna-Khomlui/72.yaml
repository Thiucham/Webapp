ID: "72"

Title: "HE! KHRISTEN MAIDUNG YO"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! Khristen maidung yo, matip jiu chaplo, 
  Kahiambo rise tanwang sude; 
  Namik rakpatjiu masuang lam phuilo, 
  Malum maidung niu charise ngam sune.

CH: |
  (Chorus)
  Halleluyah nuan ritu ngamjiu, 
  Thiusune chari ngambo luise; 
  Chari ngambo pirunse run lujiu, 
  Mazadung nai chalui thiune.

V2: |
  2. Rapiu gu apang hengsi thin sulujiu, 
  Kempat sulo, Jesu tu phuijiu; 
  Ngamra kha khaine manang bam dulo, 
  Hujiu tad ngutlo, masuang lam phuijiu.

V3: |
  3. Ka ngampiu Khrista ripuansi piu lujiu, 
  Aphenlo, satan ritu ngamne;
  Chari ngam wangbo maihina leng sira, 
  Chari ngambo pirunse runkhai sune.

V4: |
  4. Rapiu Jesu Khrista zan ganiu ngamne, 
  Shaibo nuan ritu ngam shang jingne; 
  Pengphai puan sujiu make marane,
  Dejiu wiralo, chari ngamwang dasai!

