ID: "89"

Title: "NGANG SUJIU PHUILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Ngang sujiu phuilo Rapiu lujam, 
  Chamiu minremra thiu bamde; 
  Saoniu khomwang ralo, 
  Min majinbambo miusy dungse.

CH: |
  (Chorus)
  Tingwang niu natu pikhaibo, 
  Kalen situ kam maring jiu bamlo; 
  Hiupuina pumtanse lulujiu, 
  Rapiu lugera leng tad sukhe.

V2: |
  2. Gerabo lujam sira di-e, 
  Rapiu niu chamai phiu bamme; 
  Natu atu ku-e, 
  Miusy dungtu khom madui raleng.

V3: |
  3. Wanglo singnah pui piu maidung, 
  Pawan hai duiliu kum luangbam; 
  Naimik kiuma kha ga, 
  Gemadui lujiu khom wang sukhe.

V4: |
  4. Jonah tu Tingwang niu langbo kum, 
  Natudi Tingwang niu langbam; 
  Maikhat di hajiu ma? 
  Isaiah kumjiu kak khai sukhe.

