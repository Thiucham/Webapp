ID: "132"

Title: "JESU WANG SUDE, NANG KADEN"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jesu wang sude, nang kaden bamlo; 
  Pahai karaibo nai kanambo ye; 
  Majatjiu tinggen lamsu wangsune, 
  Maihina kadenjiu nkhuan bamlo.

CH: |
  (Chorus)
  Jesu wang sune, nang kaden bamlo, 
  Kalangjiu wangne, maomakjiu wangne; 
  Kadih chariubo saojiu khuan bamlo, 
  Kamaomai hinatu saokhai diane, 
  Malum maitu paniu majang tadne; 
  I pasai suine, aron naliudi.

V2: |
  2. Jesu akhu din nuan kuak khairaleng, 
  Anuan hina khiu masan luraleng; 
  Kadih gu lungchun gasu malanjiu, 
  Tingwang khuga matipjiu I chapne.

V3: |
  3. Nuan niu aliu tu ngamlan bilakge, 
  Satan ngam hina genshat khaimide; 
  Jesu gu mathabo tuhoi lude, 
  Palungsiat niu aliu tu ran khaide.

