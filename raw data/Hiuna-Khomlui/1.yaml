ID: "1"

Title: "RAPIU TINGWANG NIU MAIHINATU"

Key: "E"

Time signature: "3/3"

V1: |
  1. Rapiu Tingwang niu maihina dungtu, 
  Lungsajiu kubam lungsabo khuan niu; 
  Patu malumjiu paten ten maileng, 
  Rapiu niu thoidam pisune.

CH: |
  (Chorus)
  Rapiu lungsiat hai wi nkiu bibi, 
  Pawan niu tadbo kumjiu wi nkiu; 
  Saomakjiu aliu paten ten bamkhe, 
  Loibonai chawang pirun lura.

V2: |
  2. Phuilo gerabo lujam min bamde, 
  Gera maira tam lujamra dibam; 
  Kungbo kachia miusy khom maduira, 
  Oh! Rapiu thoidam pikhailo.

V3: |
  3. Chariu bamliudi matha bamliudi,
  'Wan machang Jesu khu I mangiune;
  Nuan nai tamiubo ga lung maidungra, 
  Cross pengphaise ponjiu bamne.

