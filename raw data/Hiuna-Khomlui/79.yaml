ID: "79"

Title: "KADIHGA TACHENG SAMAIDUNG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadihga tacheng sha maidung lunglilo, 
  Sao sulo nuan phungmai, 
  Rapiu natu khuanjiu bamme, 
  Kalangjiu wanglo pawan hade.

CH: |
  (Chorus)
  Jerusalem namdi gasi wangtang makthen, 
  A Rapiu atu jukhailo; 
  Tingtheng jiu matha saomakbo ramga, 
  Rapiu nai wanglung bamne.

V2: |
  2. Apui piu, achi, asinghna maidung tu, 
  Ramna khai kadihga; 
  Tinggen lam wangjiu matha bamra, 
  Kadihga ramna aka maitu.

V3: |
  3. Dedao suniu wangtang ralo, tinggen ga; 
  Khuan ngam lak a Rapiu; 
  Phui bamme, wangtang rabo ramtu; 
  Kadihga chariu bosi khengjiu.

