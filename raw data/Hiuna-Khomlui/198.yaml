ID: "198"

Title: "OH! KADIH CHARIUBO"

Key: "G"

Time signature: "4/4"

CH-: |
  (Chorus)
  Oh! kadih ramsi chariubo ronna, 
  Wadi simakge, karingting si; 
  Paman kungjiu lungwangbo ringting si, 
  Pasi masi khailakma?

V1-: |
  1. Kawibo chamsi piukhailakma? 
  Majibo npui ga tadkhailakma? 
  Tad khaini makma Rapiu gu npui ga.

V2-: |
  2. Makum khailanlo, pawan khatra; 
  Chariu jumisune, naleng jengniu; 
  Rapiu gu tingmik wangtangbo nai dasai.

V3-: |
  3. Chunwi ni makma? Singnah maidung, 
  Mathabo luisi thiukhai ni makma? 
  Karingting haisi chapiubon kumbo we.

