ID: "122"

Title: "RAMLUANG GA"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Ramluang ga thon diabo, 
  Mariu kazing hang ga; 
  I kapjiu khengh ngam mak, 
  Kadih chariubo ga.

CH: |
  (Chorus)
  Tingwang nah mily gaopiu khuansi, 
  Akhuga senwang jiu achunwi;
  Akamai tinggen lam bam, 
  I kadih npui ga tad; 
  Achunsa Rapiu khakhailo.

V2: |
  2. Singgiu gen ga chapjiu, 
  Chariu khengh bam rama? 
  Singgiu si kenra leng, 
  A Rapiu jukhailo.

V3: |
  3. Kadihga bamthen nang, 
  Mariu chari lung nge; 
  Kadih si ken dasai, 
  Mathabo kim lakge.

