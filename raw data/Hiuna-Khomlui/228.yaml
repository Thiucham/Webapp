ID: "228"

Title: "THAINAI RANKHAIPIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Thainai Rankhaipiu Jesu lungwang bamme, 
  Bethlehem Namdi Matomki lung gasi, 
  Khaoring niu sakbo kuang lungga mazi bam, 
  Wibo kalen niu thinwang kahum bamme.

CH: |
  (Chorus)
  David namdiga aliutu rankhai raleng wangbamme, 
  Alung niu maningbo, 
  Siram ga Rankhaipiu bamme.

V2: |
  2. Ting kaku genlam Tingsangpui niu raijiu, 
  Naimik padlam wakasimai zuanwang ye, 
  Miria khuan maidung di zuanwang kahumme, 
  Tinggen maja sang sang wang jiu thuan bamme.

V3: |
  3. Herod Chawangra palung magenthiu bam, 
  Judah ram lungga nahmai tu kamshat bam, 
  Tingwang Nah Jesu tura rankhai mide, 
  Chamai tu ranra Piu tu wang thuan lulo.

