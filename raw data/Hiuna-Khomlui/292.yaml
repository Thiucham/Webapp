ID: "292"

Title: "HAIBO DIH HAIRA"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Haibo dih haira, naikhat hamisune, 
  Chaben niu thiubo hina hahmi rabo-e; 
  Chiudi malum lumai hah lanbo thiulakge, 
  Ningting mainiu, chaki thiubo kumjiu.

CH: |
  (Chorus)
  Nangliu Tingwang ki ye, masanthubo ki ye, 
  Naliu simak jiuma, Hiuna masanbo ki; 
  Tingwang ki kamasa mai, 
  Tingwang niu pihah khaisune. 
  Tingwang ki masan-e, naliudi hai side.

V2: |
  2. Khrista rigahai, kiphung thiujiu lungmai 
  Matha malasune, hai 'ringting loidasai; 
  Nang tenbo saisuijiu thoidamsi lusune; 
  Siniu thainai, chaki hai kat khaide.

V3: |
  3. Khrista riga thiusubo kiphung situ, 
  Kachia nai rangkang paman kung boki dung-e; 
  Chiudi singnui, magao, niuthiubo kidungsi, 
  Kaloibo nai chameejai ga khaine.

V4: |
  4. Khrista riganiu, maksai kiphung ha-e, 
  Kahembo tingthung wang jiu kanuk bamliudi; 
  Khrista riga jengniu, malai lanbi lakge, 
  Thainai chaki hai kat ngut khailande.

