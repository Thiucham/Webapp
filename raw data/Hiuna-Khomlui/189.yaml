ID: "189"

Title: "NARINGTING WIBO GA TENLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naringting wibo ga tenlo, 
  Pawan hamide kalanglo; 
  Saokum mainiu pawan tonmisai, 
  Lungniu sune,

CH: |
  (Chorus)
  Masai nkhinjiu bam maidung yo, 
  Nasuang lam phuipat lanlo; 
  Nasuang ga Cross som bamme, 
  Wangjiu khenglan lulo.

V2: |
  2. Nang kajit rontad bamliudi, 
  Mariwanglo lukhai lanne; 
  Naleng thainai haide, 
  Lukhai lanrabo wansi.

V3: |
  3. Thainai naleng ye, nsuan naira, 
  Tingwang gu-e, lungsa maiyo; 
  Nagu nuan hengjiu bamdi, 
  Lukhailanne chiu ye.

V4: |
  4. Pawan tonmak ga nang wanglo, 
  Natu kujiu bambo wan ga; 
  Tinggen lamsu pawan, 
  Hamide chiujiu ku-e.

