ID: "288"

Title: "ALIU TU DAMPAO NIU PACHUN MIJIU"

Key: "G"

Time signature: "2/4"

V1: |
  1. Aliu tu Dampao niu pachun mijiu, 
  Aliusai suijiu piubon niudi, 
  Khaoring hina nchung mide, 
  Mangwi khe, mangwilo.

CH: |
  (Chorus)
  Mangwilo, mangwilo, mangwi ramnara, 
  Mangwi khe, mangwilo.

V2: |
  2. Aliu kamai niudi kanui khai-e, 
  Pating pawan niudi kanui khai,
  Chahiu, naimik di kanui khai, 
  Mangwi khe, mangwilo.

V3: |
  3. Ramnara mangwi khe kanui khaiye, 
  Aliusai suijiu singnui 'tangmi, 
  Singgiu khun kum jiu aliudi, 
  Mangwi khe, mangwilo.

