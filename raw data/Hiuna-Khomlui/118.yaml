ID: "118"

Title: "CANAAN KADIH TAM WIBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Canaan kadih tam wibo ramga, 
  Lungra I maning nge, 
  Kadih ram tamiubo tu phut khai jiu, 
  Wang tang kinne.

CH: |
  (Chorus)
  Canaan ram kasan gasi wangtang dasai, 
  Kadih gu chariubo tu maning lanlak, 
  Chariubo kasuang padbosi bamlan lakge.

V2: |
  2. Tuhoi padbambo tusi phuilo, 
  Chararet nai chari khuan niu, 
  Phuimide pabam machang, 
  N-manbo bamlan lakge.

V3: |
  3. Chun chariubo nai kapbo hane, 
  Canaan charapen ram gasi, 
  Chariubo sao khailujiu, 
  Thingna kumjiu lentadne.

