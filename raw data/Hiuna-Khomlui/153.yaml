ID: "153"

Title: "A RAPIU JESU NIU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. A Rapiu Jesu niu haitiujiu dinkhai ye, 
  Palad rian piulumai san wi ye; 
  Palamra a Rapiu wangrabo pawansi, 
  Tinggen Maza niudi silumak,

CH: |
  (Chorus)
  Mainahpiu wangrabo pawansi silumak 
  Kaden lujiu bam mai niu ringne, 
  Palamra Rapiu wangrabo pawan simak, 
  Panahpiu Jesu niudi simak.

V2: |
  2. Noah niu aliam ga ngut makthen maidung niu, 
  Tanao tanah thiujiu bam niu ye; 
  Chiujiu tadui disu paliu tu malin mi, 
  Sikumjiu chamai nahpiu wangne.

V3: |
  3. Chaki paosi niu ka-aga mai wangrabo, 
  Pawansi silujiu bamme sai; 
  Paniu paki ga ngutjiu aga milakge, 
  Sikumjiu chamai nahpiu wangne.

