ID: "285"

Title: "LUNG CHARIUBO WAN GA"

Key: "A"

Time signature: "4/4"

V1: |
  1. Lung chariubo wan ga detiu ralo? 
  Tingmik kiuratu khuan lulak Rapiu; 
  I ringrabo leng ha kadih gahai, 
  Saokhai milo, kadih aringting hai.

CH: |
  (Chorus)
  Lung magen thiubo kadihri tuhai, 
  Saojiu wangne, Rapiu na tinggen ga, 
  Magen thiubo I niu mangai mine, 
  Kadihtu saodiakjiu wang bam mine.

V2: |
  2. Kadihri ga lungsamai nai ramna, 
  Kikhun maidi ramnabo kadih-e; 
  Kulam thingna kumjiu I lem sisai, 
  I saodiane, kadih chariubo hai.

V3: |
  3. Tinggen namdih ga lungbam maidung niu, 
  Kadih magen thiubo kheng lanlakge; 
  Phainoi benjiu tinggen dih ga bammai, 
  Detiubo wan ga I di wangralo?

