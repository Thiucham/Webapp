ID: "280"

Title: "PHUILO KADIHGA HIAMBO NIU PHUI-E"

Key: "G"

Time signature: "4/4"

V1: |
  1. Phuilo, kadihga hiambo niu phui-e; 
  Akhu naimachang hai tiu majeng; 
  Akamai atu phutlu tad midi, 
  Aliu lung wadaodi agilak.

CH: |
  (Chorus)
  Watheng makjiu nang sitang kamlune, 
  Watheng makjiu nang sisiak lune; 
  Naikhat aliu tinggen wangbam sune, 
  Sibonai nang wahina sine.

V2: |
  2. Nang chariudi dejiu meng bamgulo? 
  Marumbo npuiga tad raleng tu; 
  Hiuna kakeng lam puitu si simak, 
  Kasiara tinggen ga manaibam.

V3: |
  3. Naikhat Rankhaipiu Jesu tu daone, 
  Nuan tu phutlu jiu tadpat dasai; 
  Siga ranlumai hina tu daone, 
  Sibonai nang simasan lune.

