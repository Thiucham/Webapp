ID: "161"

Title: "PAKEN DILANG HALLELUYAH"

Key: "E"

Time signature: "3/4"

V1: |
  1. Paken dilang halleluyah, 
  Aliu thuanne Immanuel; 
  Thuanbo sinai chawang hina, 
  Malan hajiu nagu kamme. 
  Halleluyah, halleluyah, Amen. (2x)

V2: |
  2. Kadihri chamai zahina niu, 
  Maza dung sinai lungkhat jiu; 
  Nang rankhaibo zaipen ganiu, 
  Salem kasan ga tat kiura. 
  Halleluyah, halleluyah, Amen. (2x)

V3: |
  3. Suk kachang-e, Suk kachang-e, 
  Nang masanbo nai lungsabo; 
  Charui ramga bam maidung di, 
  Tinggen chamsi dinkam lakge. 
  Halleluyah, halleluyah, Amen. (2x)

V4: |
  4. Sukbo, kendibo, dinronlo, 
  Cross ga wang jiu akheng khaibo, 
  Tinggen chawang pirun saojiu, 
  Kadih kendi kam masanne. 
  Halleluyah, halleluyah, Amen. (2x)

