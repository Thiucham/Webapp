ID: "297"

Title: "TINGWANG NIU ALIU CHAMAI TU"

Key: "A"

Time signature: "6/8"

V1: |
  1. Tingwang niu aliu chamai tu, 
  Pawan khat kadih ga pilung wangkhai; 
  Taniang niu dambo chamai tu hai, 
  Karingbo hiuna pikhai-e.

CH: |
  (Chorus)
  Kadih rapen hai chamai ye, 
  Chapiunui kumjiu tangmi; 
  Aliu gara wanglan lakde, 
  Maningtaobo gu ting mikge.

V2: |
  2. Pui piu singna thiu maidung niu, 
  Aliu tu saodia lujiu lemtad mi; 
  Kadih chariubo khengh lanlakge, 
  Tinggen ga wang mathak mine.

V3: |
  3. Kadih haira tingtheng lakge, 
  Tingtheng lungrabo kadih khat bamme; 
  Atu malum maira sai midi, 
  Ringlanne chiu, Jesu dinne.

