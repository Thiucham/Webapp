ID: "149"

Title: "MAIHINA LUNGCHUN GA PINGBO"

Key: "E"

Time signature: "6/2"

V1: |
  1. Maihina lungchun ga chariubo nai pingbo, 
  'Liuchun rang thiubo si hajisune; 
  Tingwang khu manonlo ripbo gasu duakra, 
  Suitadlo tinggen pui, Khristen sulo.

CH: |
  (Chorus)
  Jesu kiulan sune nsuan, nian, nchun, 
  Sansabo thiulune make mutsai; 
  Shaimaidung ringsujiu tingpuk ga adaone, 
  Shailan jadmakbo ram tinggen zuanne.

V2: |
  2. Lungsabo hawangne, pui piulad liamsune, 
  Sabo nkiu sune, Rapiu dinne; 
  Haibo hina wangsai kaloibo wanmide, 
  Make mara sune, watheng lakde.

V3: |
  3. Chariu kheng theng lakde, tingtheng matha sune, 
  Duidih genlam aliu aruang dasai; 
  Kadih tu ramnajiu kulam aliu lem khangne, 
  Kendibo ki ga aliu mathakne.

