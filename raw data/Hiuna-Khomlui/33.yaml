ID: "33"

Title: "NUAN NIU PHUIBO DIHGA"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Nuan niu fuibo dihga hiuna dung kapjiu bam,
  Ringrabo mpui lam zuan simakjiu; 
  Chariu rabo hiupuina tu lungsa mai, 
  Kalangjiu malan wanglo ku bamme.

CH: |
  (Chorus)
  Oh! tamiubo mpui lam rontad mi maidung, 
  Nang tadbo mpuise maji lurama? 
  Ringra leng benbo 'pui ga, 
  Zuan wanglo tiu ku bamme;
  Wanglo wanglo tiu kuye singnahmai.

V2: |
  2. Rapiu wanglan bonai nang silumak gesai, 
  Chariujiu nang benkhiujiu kap sune; 
  Lukhai khelo kujiu kap bamdi, 
  I natu simakge tiumi sune.

V3: |
  3. Malum lumak maidung lengra chami jaiga, 
  Malum mailengra tinggen chawang bam; 
  Karingbo bamse nang kada luye sai,
  Tingtheng tingtheng jeng matha bam sune.

