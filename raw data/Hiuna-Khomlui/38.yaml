ID: "38"

Title: "JESU KHRISTA MILI HAMIBO TU"

Key: "D"

Time signature: "4/4"

V1: |
  1. Jesu Khrista mily hamibo tu phiura wang,
  Jesu kamao maitu ranlu raleng kadih ga wang-e; 
  Paniu nang nai alengjeng gasu papum pikhai, 
  He! singnahmai nang napum pira kaden dama?

CH: |
  (Chorus)
  Kadih ga chamai kakeng hakam mide, 
  Wanglo kamaomai tu rankhai bine kubam; 
  Tuhoi pakhu wanglulo,
  Nang rita sulo.

V2: |
  2. Jesu Cross ga shaikhai nang nai atu ranlura, 
  Kamao maitu kubam Tingwang khu wangra kaden lulo; 
  Dejiu wiralo nang kamao maitu ranlusai, 
  Nagu naikhat jengphi tingtheng karingbo ngaone.

V3: |
  3. Nagu karing riang nai nakhiu di Tingwang gu-e, 
  Aliu haise thinlujiu Tingwang ten thiu madi ra-e; 
  Nang Tingwang cham phung maksai pah gu chamlam lulak, 
  Ladzan kathiubonai chamijaiga bam sune.

