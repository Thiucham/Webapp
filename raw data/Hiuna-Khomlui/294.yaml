ID: "294"

Title: "JUBILEE TINGMIK"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jubilee tingmik thainai wangsude, 
  Tasibo mathabo wangsude; 
  Maluang taning ga chunwibo phui-e, 
  Chunwibo Jubilee bang khuan.

CH: |
  (Chorus)
  Chunwi jubilee (2x) 
  Chunwi sui-e, thainai tingmik hai; 
  Thoidam lusune, Tingwang khuga.

V2: |
  2. Thiusulo, thainai Jubilee luisi, 
  Aliu Rapiu Khrista tu thuanjiu; 
  Kadih ga agi manai bam raleng, 
  Maningbosi wangtang raleng.

V3: |
  3. Lungsabo benniu aliu tu jukhai, 
  Chungbo dui ga aliu tu jukhai; 
  Madiabo piuriangjiu ga jukhailo, 
  Hai siniu Patu thuan sukhe.

V4: |
  4. Pawan machang chunwibo wang raleng, 
  Karingting thengjiu lungrabo leng; 
  Tingwang khuga thuan kiujiu bam raleng, 
  Thoidam khailo, Tingwang nangniu.

