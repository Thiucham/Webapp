ID: "255"

Title: "JESU NIU CHAWANG THIUJIU LUNGSUNE"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Jesu niu chawang thiujiu lungsai, 
  Phaimiu thiujiu patu lungchamne; 
  Tingkum sang patu chawang thiu chamne.

CH: |
  (Chorus)
  Chiu khaijiu mathabo niu fui-e, 
  Agi manaijiu mathak rabo; 
  Malinium kadih ga lungdasai. (2x)

V2: |
  2. Ringsu maihina wang arong jiu, 
  Jerusalem tu chap maguijiu; 
  Tingwang kenditu thuanbam sune.

V3: |
  3. Jesu tu malum khaimak maira, 
  Kadihga lung ncham bamliudi; 
  Tinggen lamra ramna rabo-e.

