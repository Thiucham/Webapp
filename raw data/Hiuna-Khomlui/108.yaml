ID: "108"

Title: "HIUNA LUNGRABO NAMDI BAM"

Key: "G"

Time signature: "6/8"

V1: |
  1. Hiuna lungrabo namdi bam, 
  Kadih tingmik loidasai;
  Siga ranpatbo lui wibo, 
  Tinggen mai niu thiu sune.

CH: |
  (Chorus)
  Lungsa sao makbo lungsiat naih, 
  Manglam niu di mantang makbo; 
  Rankhaibo bam pikhaibosi, 
  Rankalu maidung donwi-e.

V2: |
  2. Paliu chunwi lui thiu sune, 
  Tingtheng jeng thiujiu bamne; 
  Chariubosi bamlan lakge, 
  Mikduidi luanglan lakge.

V3: |
  3. Kenpatbo lui sao thiuralo? 
  Ringthuibo sao luralo? 
  Chariubo nai nuantu ngamjiu, 
  Wang maidung niu lusune.

V4: |
  4. Paliu Jesu sai shui mai-e, 
  Kadih witu phut maidung; 
  Paliu ranpat lu mimai-e, 
  Jesu Cross ga shai ganiu.

