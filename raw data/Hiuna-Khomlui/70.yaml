ID: "70"

Title: "RAIGA EDEN WIBO GASU"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Raiga Eden wibo gasu, 
  Tingwang niu atu ramna khai; 
  Apum hai masan mak mai ye, 
  Aleng mathabo adao mak.

CH: |
  (Chorus)
  Tuhoira I niu silude lungsa khaibo, 
  I tingtheng ringra pazai luangjiu shaikhai; 
  Sabo hina kuak khaimide, 
  Khrista zai niu khiu masan khai.

V2: |
  2. He! Tingwang I ra nuan mai ye, 
  Alung ga sabo niu phui-e; 
  Nakhuga diujiu tad bamga, 
  Chriubo niu atu gomliam.

V3: |
  3. Lungchun taniabo niu atu, 
  Tingwang gasu ramna khai-e; 
  A Rapiu nai anaih kakga, 
  A nuan niu piramna khaide.

