ID: "145"

Title: "MAIKIAM PHUNGBO HA"

Key: "E "

Time signature: "4/4"

V1: |
  1. Maikiam phungbo ha Tingwang Milypoi, 
  Pagu chawang bamgasi tamiubo ha, 
  Naimikbiu niu pageng haye, 
  Tingwang naih tingtheng jeng matha aruang bamne.

CH: |
  (Chorus)
  Amen, wangkiulo a Rapiu Jesu; 
  Rapiu Jesu chalung sasibo, 
  Masan maidung si majang bamlo, 
  {Halleluyah Amen. (2x)}

V2: |
  2. Rapiu phaimiudung hiuna Tingwang niu, 
  Wahina wangrabo pilen khaiye, 
  Kinglo I wang kiuji rabo-e, 
  Haibo cham piumaidung si pasan wimai ye.

V3: |
  3. Pawansi wang majat surabo-e, 
  Chengsa maisi chengsa tenjiu bamlo, 
  Masanmai masanjiu bamlo, 
  Sitiujiu bamlo, I wang majat rabo-e.

