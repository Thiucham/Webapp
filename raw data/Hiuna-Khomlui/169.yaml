ID: "169"

Title: "RAPIU NIU KASIAM KHAIBO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Rapiu niu kasiam khaibo tinggen, 
  Alung chun ga maning tao-e; 
  Satan bang thiubam maidung, 
  Tinggen dih ga ngut ngam lakge dinne.

CH: |
  (Chorus)
  Oh! Rapiu atu kuak khailo, 
  A nuan dunghina kuak khailo; 
  Nang makjiu kakibo npui haye, 
  Kuak khai khelo, Tingwang kuak khai khelo.

V2: |
  2. I niu bambo tamiubo gasu, 
  Rapiu niu kubo khuan chiuwe; 
  Masai maritad talo, 
  Tadlan misai nang shai sune dinne.

V3: |
  3. Nawangdih zuan tadne, a Rapiu; 
  Nangniu lungsabo tashi ye; 
  Nawangdih wangtang makthen, 
  Naben jadniu atu jukhai khelo.

