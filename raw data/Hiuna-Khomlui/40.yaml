ID: "40"

Title: "RAPIU KUBO KHUANSE KINGLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Rapiu kubo khuanse kinglo kadih mainahdung, 
  Wangrabo tingmik namide atense changmak.

CH: |
  (Chorus)
  Wangsiakne halleluyah (2x)
  Kamuang ga tong lujiu, 
  Pakendi madubo ngaosune.

V2: |
  2. Paniu kada padmai majang wangbonai dasai, 
  Saokhai diakmai hina sira chariubo khengne.

V3: |
  3. Chamijai ga bammai sira tingkum sangsang jiu, 
  Lung magen thiubo kheng phune, amanni bamdi.

V4: |
  4. Tingen kalek luramaira ri nga jiu bamne, 
  Rapiu chunwi tenlu maira amanjiu bamne.

