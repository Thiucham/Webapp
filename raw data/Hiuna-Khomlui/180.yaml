ID: "180"

Title: "KADEN SULO MALUM MAIDUNG"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kaden sulo malum maidung ri bamtalo,
  Pawan khatna leng nge, aliu karing ting hai, 
  Kadih gahai kawibo nai paman kungbo, 
  Pawan khatga halan kammi sune.

CH: |
  (Chorus)
  Kadih aki hai hakam miliudi, 
  Tinggen aki wibo bamme, 
  Kadih gahai lungphu raleng chaki haye, 
  Kaden khaibo Tinggen aki bamme.

V2: |
  2. Naleng pikhaibo chakhiu chalan hinasi, 
  Nangleng pibo ten thiuleng pibogu makge, 
  Kadih ga hai wakhat nadi phungwang makge, 
  Wakhat nadi phungtad lanra haye.

V3: |
  3. Lungsabo khuan niu kubamme chariu maitu, 
  Kadih ga Tingwang niu chariu maihinatu, 
  Malum maihina leng palungsa pikhai ye, 
  Cham retkhaibo ramga phung wang khaine.

