ID: "246"

Title: "TINGGEN RAMLAM"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Tinggen ramlam aliu leng, 
  Chaki kawi khad bamme; 
  Tingtheng lungra chaki bamme, 
  Haibo chaki wibosi, 
  Amun niu din ngam lakge, 
  Tingtheng lungra chaki bamme.

CH: |
  (Chorus)
  Tinggen lam chaki wibosi, 
  Tingtheng lungra chaki bamme; 
  Chagan ramsi ken dasai, 
  Benboki ga I ngutne, 
  Chaky wibo aliu leng nge.

V2: |
  2. Haibo ki kabenbosi, 
  Kawibo siniu phui-e; 
  Tingtheng lungra chaki bamme, 
  Kadih ramsi kendasai chunsabo hina hane, 
  Chaki wibo wangtang dasai.

V3: |
  3. Duidi gensi kendasai, 
  Aliu lung aruang bamne; 
  Tingtheng lungra chaki bamme, 
  Agi manaibo genlam aliu lung macham bamne, 
  Tingtheng lungra chaki bamme.

