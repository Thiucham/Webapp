ID: "117"

Title: "NAIKHAT NBIN DUNG LOI WANG"

Key: "D"

Time signature: "4/4"

V1: |
  1. Naikhat nbin 'dung loi wang kam misai, 
  Rapiu kaku khuan I chiusai, 
  Nagu karing alem ga I ngutne, 
  Duidi tu kenwang misune.

CH: |
  (Chorus)
  Gukhaibine, Kashai giu tu ken kawangdou (2x) 
  Gukhaibine duiditu kenwang misune.

V2: |
  2. Kachia ramga wangra kaden luma? 
  Siga tingtheng lungbam sune, 
  Siga chunwi pamalan thiulakge, 
  Kashai giu tu kenwang sune.

V3: |
  3. Asingnah mai wangra kaden luma ? 
  Tingtheng karingbo namdi ga, 
  Siga kashai thiuniubo bamlakge, 
  Tingtheng mathajiu bamsune.

