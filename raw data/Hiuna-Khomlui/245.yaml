ID: "245"

Title: "MASENNE RAPIU JESU LUNGBO RAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Masenne, Rapiu Jesu lungbo ram, 
  Jordan gen wibo ram gasi; 
  Majang khailo, Salem ramga.

CH: |
  (Chorus)
  Oh! mathabo ram kabenbo ramlam, 
  Lungsabo ram Tingwang namdi; 
  Rapen kawi penbo ramga.

V2: |
  2. Kamuang rilam mathabo ram gasi, 
  Majang khailo, sibo ramga; 
  Tamiu lan makbo ram gasi.

V3: |
  3. Hamilo kadih magen thiubosi, 
  Majang khailo, he! a Rapiu, 
  Chunsa jengsa makbo ramga.

V4: |
  4. Sibo n-manbo ram wangtang dasai, 
  Kadih chariubo maning lak; 
  Halleluyah Rapiu suang ga.

V5: |
  5. Oh! Rapiu nang kasiam khaibo namdi, 
  Chiujiu ahiuna magen thiu; 
  Rapiu atu majang khailo.

V6: |
  6. Rapiu hiuna kumjiu lemsi saira, 
  Lemtadne Salem ram wiga; 
  Lily penwi penbo ramga.

