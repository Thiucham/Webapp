ID: "128"

Title: "PATING PATING WANGBO KUMJIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Pating pating wangbo kumjiu kaden lulo, 
  Naimachang pating kalijiu; 
  Pacham changbo ga chap matip lulo.

CH: |
  (Chorus)
  Tamiuting theng mide, 
  Tingben patji sune; 
  Tingben nia thinlujiu; 
  Tingben ga bambo kumjiu bamlulo.

V2: |
  2. Chamaidung kadihri tu kungbi bi sune, 
  Kasabo niu maitu mani; 
  Rapiu cham changbo tu nbai mine.

V3: |
  3. Lad dinpiu wangbamme kada lumai ruangga, 
  Kaden lulo pating mine; 
  Kaden makmai singnui kum tangmine.

V4: |
  4. Chamai watniu Rapiu wattu nbai mine, 
  Kaden lulo pating mine; 
  Kaden makmai tu majang hamine.

V5: |
  5. Naoh kiting kumjiu chunwi bam maidungra, 
  Wangbam kadalumai ruangga,
  Kadenlulo nang phut khaimi mane.

