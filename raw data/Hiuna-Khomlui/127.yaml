ID: "127"

Title: "ISRAEL NADUNGTU JEHOVAH NIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Israel nadungtu Jehovah niu lungsa, 
  Moses tu langjiu juken khaide; 
  Rian khaibo ram wangtang makra, 
  Hiambo niu namme.

CH: |
  (Chorus)
  Tasibo ye, tasibo ye; 
  Egypt ram lung phung maidung; 
  Chamriat khaibo Canaan kadih, 
  Wang tang ngam makge.

V2: |
  2. Kachia namdi wiga ki khundung lung chamne, 
  Rian khaibo dih tu phuikim lakge; 
  Ringbo salem lui thiujiu thuanne, 
  Pana piu tu.

V3: |
  3. Aring chapbam haisi chunwibo phichap ye, 
  Majang khailo hiuna masanbo; 
  Retkhaibo ram wangtang sai, 
  Mathalui thiu bamne.

