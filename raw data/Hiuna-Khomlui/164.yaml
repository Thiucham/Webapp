ID: "164"

Title: "HE! RAPIU NATU THUANBO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. He! Rapiu Natu thuanbo, natu chakhuang thiubo, 
  Hai dejiu wilo; 
  Rapiu khu chalui thiulo lungsa maidung, 
  Aliu hai Pagu milydung ye.

CH: |
  (Chorus)
  Wanglo, Rapiu tu thuankiu sukhe, 
  Aliu hai Pagu milydung ye; 
  Pipadbo jaojiu thuankiu sukhe, 
  Tingwang khu chalui thiukhe, 
  Tinggen ram ga wangtang makthen.

V2: |
  2. Nsuan machang nagu saomakbo lungsa khaibosi, 
  Tingkum machang thuanjiu; 
  Rapiu lad kam maringjiu bamrabo leng, 
  Nagu pumtan kasan pikhailo.

V3: |
  3. He! Rapiu nagu kangambo ten niu aliu tu, 
  Pijiu chunwi khailo; 
  Nangniu tasibo tenkhai mibo dungsi, 
  I thuankiubo lui thiujiu bamne.

