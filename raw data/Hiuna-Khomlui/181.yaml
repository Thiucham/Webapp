ID: "181"

Title: "TINGWANG LADREN BAMME"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Tingwang ladren bamme, 
  Palad piumak maileng; 
  Pakhiangna nagu thiubam didu. 
  Natu lungsabo si nang pasuk sidama? 
  Nang chak dama? (2x) pasuk.

CH: |
  (Chorus)
  Nang pasuk sidama nahiuna harabo, 
  Pakhiangna nagu thiubam didu. 
  Kadih mathabo niu nahiuna hasui ye, 
  Nang chak dama? (2x) pasuk.

V2: |
  2. Tingtheng nsuan wan ga, 
  Nang wang ngam mak sui ye; 
  Kadih gu wi machunbo jeng niu, 
  Tuhoidi naladren nakhuga bamsui ye. 
  Nang chak dama? (2x) pasuk.

V3: |
  3. Nsuan kubo wan ga, 
  Tad tuan mibo naisai; 
  Kashaibo ting wang tangbonai sai. 
  Magian thiubo kheng jiu kapjiu huibam didu, 
  Nang chak dama, nahiuna ringting leng.

