ID: "174"

Title: "ARONNA CHARIU JIU BAMGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Aronna chariu jiu bamga, 
  Rapiu nalad I piune; 
  Natu malum jiu lukhaine, 
  Thainai nakhu ga wangne.

CH: |
  (Chorus)
  Rapiu napam ga I wang-e, 
  Nagu thoidam pikhailo; 
  Jesu napam ga I wang-e, 
  Napam ga soura wang-e.

V2: |
  2. Nang masanne, nang manuanne, 
  Jesu napam ga wang-e; 
  Nang lungsa gasu wadaodi, 
  Atu phut pad midulo.

V3: |
  3. Chariubo hina sao raleng, 
  Nakhu wang-e, lukhailo; 
  Chawan naimik kiumak gasu, 
  Thoidam lumai rong jaone.

V4: |
  4. Lungsa jiu akhu nawanglo, 
  Tingthung niu pui tamiu ga; 
  Chariu gasu chunwi khailo, 
  Tamiubo pi ben khailo.

