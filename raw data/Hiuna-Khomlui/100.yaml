ID: "100"

Title: "TINGWANG NIU DINKHAI MIBOSI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tingwang niu dinkhai mibosi, 
  Wangtang makbo degu bamlo. 
  Tuhoi di wang jiu bamme, 
  Kadih pabam hina ga.

CH: |
  (Chorus)
  Makum khailo kakungbo cham, 
  Thainai dinron jiu bamme. 
  Ting kadih hami liudi, 
  Tingwang ladra halan lakge.

V2: |
  2. Tingwang lad wathao thiumak mai, 
  Nahiuna ra kapjiu bamme. 
  Shai mibo sailam niura, 
  Kawi ngam kamlak sune.

V3: |
  3. Rapiu niu kaden khaibo ram, 
  Malum maidung wang lung sune. 
  Shailan lakbo tingtheng ram, 
  Thuanjiu bamne malum mai.

V4: |
  4. Pasai wang lung rabo ramsi, 
  Agunjiu bamlo singnah mai. 
  Chunsabo bamlan lakge. 
  Shailan lakge siga ra.

