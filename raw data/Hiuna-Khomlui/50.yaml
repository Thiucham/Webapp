ID: "50"

Title: "NAIKHAT ALIU RINGTING"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naikhat aliu ringting hai loi dasai,
  Tuhoi thiubo luise thiu lanlak;
  Naikhat nsuan I sulanbo naida saira, 
  Kulam aliu dejiu chunwi ralo,

CH: |
  (Chorus)
  I ngao sune Tingwang zuse, 
  Apiu Tingwang lungsa I ngao bonai dasai; 
  Kulam aliu dejiu matha ralo,

V2: |
  2. Naikhat naikhat thiujiu I khuan bamne, 
  Amee bung hai ben m'wi khailujiu; 
  Chaky paoniu rengmun hai lepadbo naisai, 
  Pakhu a hiupuina len khang sune.

V3: |
  3. Kaden sibo maise donwi sune, 
  Tingwang khu 'liu kamsi lenbonai; 
  Wide tiujiu dinkhai sune sibo wan ga, 
  Dinkhaira leng Tingwang ten thiu sukhe.

