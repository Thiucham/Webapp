ID: "276"

Title: "PAWAN KHAD WANGBO RINGTING"

Key: "G"

Time signature: "4/4"

V1: |
  1. Pawan khad wangbo ringting, 
  Charapen kumbo ringting tu, 
  Jesu niu pibo ringting si, 
  Naikhat ra tadkam sune, 
  Jesu niu kaden khaibo ram.

CH: |
  (Chorus)
  Tingkum sang sang lungrabo ram, 
  Calvary zai niu liukhaide, 
  Charapen niu phuiboram, 
  Jesu nai tingtheng lungrabo ram.

V2: |
  2. Jesu niu kiulanbonai, 
  Maihina niu ngaoni sune, 
  Malummak maidung ngaolakge, 
  Na Rawang tu adaora, 
  Nang kaden luma lungsamai?

V3: |
  3. Maihina wang lung sune, 
  Charapen niu phuibo ramga, 
  Tachiang wijiu lungbo ramga, 
  Tingtheng ram nami maitu, 
  Milypoi niu ju aruangne.

