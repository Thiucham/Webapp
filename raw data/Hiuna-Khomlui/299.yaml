ID: "299"

Title: "KADIH CHARIU RAMGA"

Key: "G"

Time signature: "3/2"

V1: |
  1. Kadih chariu ramga pui piu hajiu lungmai, 
  Nchungjiu, kapjiu, chunsabo niu phuibamdi, 
  Pui piu tiu kuraha sansa mai thiubamdi, 
  A Piu Tingwang niu phui ngạo.

CH: |
  (Chorus)
  He! Apui, oh! Apiu, 
  Napen ga niu I lungwang bambo ye, 
  He! Apiu, oh! Apui, 
  Nalun ngao makjiu pui piu kura ha.

V2: |
  2. Namdi wibo ramlam I niu rontad bamdi, 
  Pui piu lungsatu I niu makum taoboga, 
  Atu kupad rakum amikdui niu raijiu, 
  Maning bamme, nanai tu.

V3: |
  3. Machangbo kikhun thiujiu I lungbam ni-e, 
  Saoniu rukhaijiu saoniu nking khai ralo? 
  Suanglam phuiwangdi ha sailam phuiwangdi hah, 
  Gomra habo thingna kum.

V4: |
  4. Tenren thiulu wang jiu kikhun kham rungbamme, 
  Khamle khai khelo, tiubamdi kak khai makge; 
  Saoniu lekhai ralo, maikhat nadi hah ye; 
  A Piu Tingwang yo, chiu kap.

