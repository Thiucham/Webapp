ID: "94"

Title: "RAPIU KHRISTA NIU DINKHAIBO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rapiu Khrista niu dinkhaibo, 
  Hiuna khomwang maileng; 
  Pagu tathuan wibo phungjiu, 
  Njan khaira wangji sune.

CH: |
  (Chorus)
  Oh! hamirade hiuna dungse, 
  Tadlujiu phui khailo; 
  'Puimengjiu bam maitu jukhailo, 
  Rapiu niu kanui khaibo we; 
  Tingtheng ringbo racham paoron khailo.

V2: |
  2. Tingtheng ringrabo rachamse, 
  Chiukhai makmai bamme; 
  Mariu kajing hangga tadjiu, 
  Pingjiu bamme gukhai bilo.

V3: |
  3. Masai nkhinjiu bai bam mai, 
  Nahiuna kap bamme; 
  Hiuna khom mai thiujiu lungra, 
  Kujiu bamme malan wanglo.

