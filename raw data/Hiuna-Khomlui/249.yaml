ID: "249"

Title: "TINGGEN RAMGA I LUNG RABO LENG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tinggen ramga I lung rabo leng, 
  Kadenleng a Rapiu tad mide; 
  Jukhairabo ramgasi, 
  Malumai lungsa maidung, 
  Tinggen masan mai nai chalui thiune.

CH: |
  (Chorus)
  Tinggen dih withubo, 
  Mathabo ramgasi; 
  Lung chariubo ha-e, 
  Sibo ramga naikhat tad sune.

V2: |
  2. Alengjeng niu Rapiu shai khai-e, 
  Aringting hai loibonai dasai; 
  Lung chariubo ramtusi, 
  I tadton patlu dasai, 
  Tinggen masan mai nai chalui thiune.

V3: |
  3. Tinggen ramga I wangtang dasai, 
  Chahiu, naimik biudi bamlakge; 
  Tingtheng jeng a Rapiu nai, 
  Lungchamne, wibo ramga; 
  Chunwibosi pamalan thiulakge.

