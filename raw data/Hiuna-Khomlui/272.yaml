ID: "272"

Title: "EGYPT KADIHGA LUNGWANG KHAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Egypt kadihga lungwang khailu jiu, 
  Kabanggu potrit phungbambo Israel, 
  Magen thiu lujiu lungliwang lanbo, 
  Ranpad khai raleng Moses tu lang khai.

CH: |
  (Chorus)
  Moses, Israel hamirade! 
  Moses majang khaisulo, 
  Natu I niu jukhai bine, 
  Canaan dih wang tang makthen.

V2: |
  2. Moses niu dinne, sonbo mai I ye, 
  Amaidung siniu atu malumlak, 
  Tingwang niu dine, I majang bamne; 
  Ladren khaibo Canaan wangtang makthen.

V3: |
  3. Egypt kadih haisi aki makge, 
  Aki sira Canaan Jordan genlam, 
  Ladren khaiboram thoidam niu phuibo, 
  Magen thiubo npui hai kenpad dasai.

V4: |
  4. Chariu magen thiubo ga jukhai jiu, 
  Ladren khaibo Canaan wangtang ngammak, 
  Pis ga luangbut ga amik niu phui khaijiu, 
  Joshua ben ga charamsi pikhaide.

