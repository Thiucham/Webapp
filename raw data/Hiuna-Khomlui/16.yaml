ID: "16"

Title: "JESU, JESU NARONNA YE"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Jesu, Jesu naronna ye, 
  Nuan phungmaitu lungsa khai; 
  Nangniu maitu kungbo jengniu, 
  Nazainiu ranpad khaide.

CH: |
  (Chorus)
  Atu silo, atu silo, 
  He Jesu aliu Rapiu. (2x)

V2: |
  2. Nuan phung mai kadihri ga hai, 
  Chamai kengjiu bamphui-e; 
  Aliu chunsaye naronna, 
  Aliu leng chariu kheng khai.

V3: |
  3. He Jesu nalad piu raleng, 
  Nachun wijiu gukhailo; 
  Aliu pumtan habo jengniu, 
  Nangniu aliu tu gulo.

