ID: "296"

Title: "KADIHGA APUI MAK KAKI HA"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Kadihga apui mak kaki ha, 
  Atu saodiak jiu tad raimi; 
  Chunsa jengsa jiu hui bamdi, 
  Tingwang niu majang khaine.

CH: |
  (Chorus)
  Ana yo I tadmidi, 
  Tingwang natu majang bamne; 
  kadih ram nabo saodiak jiu, 
  Salem ram ga adao lanne.

V2: |
  2. Kadihga magennah thiubam mai, 
  Raijiu Tingwang tu phiu lulo; 
  Nadon wijiu lung niye sai, 
  Tingwang ladtu phung lulo.

V3: |
  3. Kadihga lung chariujiu bammai, 
  Sao khairabo bam Jesu ye; 
  Naringting wijiu lungnisai, 
  Tingtheng ringbo Cross phunglo.

