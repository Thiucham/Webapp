ID: "214"

Title: "I ACHENG SABO MAI YE"

Key: "D"

Time signature: "4/4"

V1: |
  1. I acheng sabo mai ye, 
  Kuak khaileng Rapiu Khrista, 
  Lungsa shibo piu Tingwang, 
  Atu lungsa khaira leng.

CH: |
  (Chorus)
  Rapiu zai luang khaibosi, 
  Jathina dungleng masan, masan, 
  I di sigasi khiune, achengsa, 
  Masan raleng.

V2: |
  2. Karaibo mai Adam si, 
  Tingwang niu siang khaibide, 
  Kadih maidung rih gasi, 
  Tamiubo niu ladzan thiu.

V3: |
  3. Acheng sa jeng gasu niu, 
  Calvary Cross rigasi, 
  Rapiu niu pazai njan, 
  Anuan hina masanra.

V4: |
  4. Aben chengsa jeng ganiu 
  Rapiu ben natri genkhai, 
  Aphi chengsa jeng ganiu, 
  Rapiu phi natri genkhai.

