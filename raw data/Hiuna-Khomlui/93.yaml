ID: "93"

Title: "SULO KHRISTEN MAIDUNG"

Key: "D"

Time signature: "4/4"

V1: |
  1. Sulo khristen maina dung yo, 
  Pawan haise hawang sude; 
  Paopeh chengtu saodiak lujiu, 
  Tenlo nahiuna ring raleng.

CH: |
  (Chorus)
  I masia makge haibo dih matha tu, 
  Tingwang niu kujiu bambo ga; 
  Paopeh chengtu saodiak lujiu, 
  Tenlo nahiuna ring raleng.

V2: |
  2. Singnah maidung pawan hade, 
  Haijiu dunbo ringting lung ga; 
  Chariu magen thiubo saojiu, 
  Hiuna ringrabo 'pui tadlo.

V3: |
  3. Manasan makjiu bam mai yo, 
  Kakungbo singnah maidung yo; 
  Ladzan tingmik nawang sude,
  Nsuan nai nanai tiubam talo.

