ID: "170"

Title: "ATU KUAK KHAILO, RAPIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Atu kuak khailo, Rapiu atu kuaklo, 
  I tenra simakjiu pawan thengjiu bamme; 
  Tiudi aleng pawan hamide, Rapiu; 
  Atu kuak khailo, Rapiu kuak khailo.

CH: |
  (Chorus)
  Aduan jeng niu hiuna sikamlak, 
  Hamide takum haitheng tamiuga, 
  Nama suang ga I dedinralo? 
  Atu kuak khailo, Rapiu kuak khailo.

V2: |
  2. Nang juringbo man hahju lude, Rapiu, 
  Nagu thoidam sikam lakjiu atu pikhai; 
  Tiudi mathabo I maning ye, Rapiu, 
  Atu kuak khailo, Rapiu kuak khailo.

V3: |
  3. Atu kubo si masuang lumak jengniu, 
  Nang atu lang khai ye, hiuna juring raleng; 
  Tiudi maikhat di maluang wangmak, Rapiu, 
  Atu kuak khailo, Rapiu kuak khailo.

