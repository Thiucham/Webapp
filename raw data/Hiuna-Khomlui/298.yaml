ID: "298"

Title: "TINGWANG NIU CHAMAI TU"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Tingwang niu chamai tu damkhai, 
  Ringbo Hiupuina si pikhai; 
  Karingting hai mikha kumme. 
  Pawan haisi tadsao makjiu bam.

CH: |
  (Chorus)
  Tinggen ram ga apamnah tu, 
  I niu ngao dao bonai dasai; 
  Chunsa mikdui luanglan lakge, 
  Tingwang pam ga aliu aruangne.

V2: |
  2. Nuan hahbo apamnah ringting, 
  Rapiu nang niu majang bamlo; 
  Alung chunniu nakhu paokhai, 
  Dunjumibo apamnah ringting.

V3: |
  3. Tinggen ram ga mikdui luanglak, 
  Kadih lungchun maning lanlak; 
  Rapiu naben pom hang gasi, 
  Gukhai khelo, papui piu atu.

