ID: "34"

Title: "KHRISTEN TU KAM CHARIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Khristen tu kam chariu bam Saul niu, 
  Tingwang nahpiu tuse luni mak; 
  Damuscus namdi kareng hangga, 
  Hiuna niu pariga ladzan thiu.

CH: |
  (Chorus)
  He! Saul Saul tiujiu kuwang-e, 
  Rapiu nang hai saolo chiu-e, 
  Kamchariu bambo Jesu ye; 
  Tiubo khuan niu dinne.

V2: |
  2. Sibosai Jesu niu Paul ku-e, 
  Sulujiu namdi lam zuantadlo;
  Nachengsha kuak khaine tiu bamme, 
  Zat hina ga ringbo cham dinlo.

V3: |
  3. Sibosai Paul mana kasanjiu, 
  Kam chariu mimai hina riga;
  Hiuna cham kawibo dinronkhai, 
  Mai sang kaimai juringbo lude.

V4: |
  4. Masanbo Paul mana kasanjiu, 
  Rome wangpiu Nero niu relujiu;
  Kavangky lungga ju ngut lujiu, 
  Apang hengniu papi dangmide.

V5: |
  5. Masanbo Paul tinggen wangmide, 
  Rapiu benjatlam wangbam mide; 
  Kadih gu chengsha ruilan raleng, 
  Rapiu khuga wangjiu kheng bamme.

