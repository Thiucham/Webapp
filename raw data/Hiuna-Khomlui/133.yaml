ID: "133"

Title: "RAPIU WANGLAN KINNE"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Rapiu wanglan kinne, aliutu kadara; 
  Chunwimai chunshamai singnamai, 
  Kikhun khat thiu bamdi malum makmai tura, 
  Chariubo mijaiga khairade.

CH: |
  (Chorus)
  Wanglo tuhoi Khrista niu ku bamme, 
  Karingbo majibo daoraleng. 
  Dinronnlo kawicham paoronlo tadpadjiu, 
  Tenkhaibo phijengra halakge.

V2: |
  2. Rapiu wang tang dasai malum mai kadane; 
  Karingmai kashaimai thiulakge, 
  Tuhoi ringjiu bamdi, tuhoi shaijiu bamdi; 
  Malum maitu ronna kadane.

V3: |
  3. Tadrai maidung ruang ga malum mai bamsune, 
  Tuhoidi khangsiara bamsune; 
  Saoniu tadjiu saotu bamdiak mirabolo. 
  Kadenlo pawansi namide.

