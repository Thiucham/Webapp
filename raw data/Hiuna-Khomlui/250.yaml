ID: "250"

Title: "WANGRA KHUANBAM ZION NAMDI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Wangra khuanbam Zion namdi,
  Masan mainiu mathakbo ram, 
  Sibo ramwi wangtang raleng, 
  Kaden loimide, siboram.

CH: |
  (Chorus)
  {Halleluyah (2x)} chalui thiu thuan bamme; 
  Asingnah maidung yo, kalangsulo; 
  Awangpiu cham wangtang mide. 
  Sibo ram wiga lung raleng, 
  Kaden loimide, sibo ram;
  {Halleluyah (2x)} chalui thiu thuan bamme.

V2: |
  2. Masanbo Namdi kawisi, 
  Phuikim makge, sibo Namdi, 
  He! dedao niu wangtang ralo? 
  Nkhuan bamme, Zion Namdi.

V3: |
  3. Kapjiu nchungbo bamlakge, 
  Mikdui luangjiu chunsa raha, 
  I maning-e, sibo Namdi, 
  Atu kulo He! a Rapiu.

