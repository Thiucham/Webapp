ID: "136"

Title: "TINGGEN GA MIKDUI LUANG"

Key: "G"

Time signature: "2/3"

V1: |
  1. Tinggen ga mikdui luang chunsabo hah, 
  Maihina siga chunwine; 
  Chunsabo bamlak, chunwi kammine, 
  Chunwimai kangrong sui bonai.

CH: |
  (Chorus)
  Kaplak mikdui luanglak siga, 
  Chunsajiu chariubo hane; 
  Kaplak mikdui luanglak siga, 
  Tinggen ga mikdui luang lanlak.

V2: |
  2. Kendi mai thiura tinggen lam khuanbam, 
  Aliu tingtheng lungrabo ga; 
  Rankhaipiu khuga tingtheng lung mine, 
  Chunsa lanlak rabo ramga.

V3: |
  3. Naikhat tingmik tinggen dihga wangjiu, 
  Aten hinasi madune; 
  Wahina ngaone, khat khat tu kungne, 
  Tinggen ga wahina sanne.

