ID: "24"

Title: "KALEN HINA RUANG GASU"

Key: "D"

Time signature: "6/8"

V1: |
  1. Kalen hina ruang ga suniu, 
  Lungsabo niu dithubo-e, 
  Jesu gu lungsabo kawibosi, 
  Wahina ruang gasu dithubo ye.

CH: |
  (Chorus)
  Jesu Gukhaipiu-e (2x) 
  Naleng aleng jeng niu, 
  Calvary Cross gase shai khai ye.

V2: |
  2. Lungsabo niu kuakhai bi ye, 
  Lungsabo niu njan khai ye, 
  Jesu gu lungsabo kawibosi, 
  Wahina ruang gasu dithubo ye.

V3: |
  3. Maisuang habo ten thiubam mai, 
  Maluang kaku hinatudi, 
  Pabam kali ngamra I ten ngamdi, 
  Lungsabo hasai I degeng ralo?

