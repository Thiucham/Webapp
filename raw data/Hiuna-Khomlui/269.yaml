ID: "269"

Title: "PHUILO TINGGEN AKI SI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Phuilo, Tinggen aki si, kadih mai niu sitang mak, 
  Magenthiu chariubo, bam lanlak tinggen ramga, 
  Tinggen mathabo tu I niu thuanjiu bam mine, 
  Tinggen aki watsi kadihwat niu kadalak.

CH: |
  (Chorus)
  Tinggen ramtu charih jiu khuan bamme, 
  Khrista niu chunwi jiu khuan bamra ye, 
  Kap huibo mikduidi luang lanlakge, 
  Matha ringabo niu aringting thiujiu lungne.

V2: |
  2. Milypoina gubiusi naimik kumjiu benbamne, 
  Naimik biu pageng ha Khrista niu benbam sune, 
  Milypoina ju kumjiu aliudi benbam sune, 
  Pana thiu lumaitu pirunsi runkhai sune.

V3: |
  3. Phuilo, tadrai mimai niu charao gasu sulanjiu, 
  Magen thiu chariubo saodia jiu tadpad mide, 
  Kashaibo gu pumtan niu paliu tu ngamlan lakge, 
  Khrista niu kubonai matha jiu lemtad mine.

