ID: "273"

Title: "KADIH RAM HAI NUAN MAI NIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadih ram hai nuan mainiu lungbo ramme; 
  Lungchun tamiubo ben khailo, kadih ga; 
  Khrista ladzan wang makha ga, 
  Kadenjiu khuan bamlo. 
  Pah wang lanrabo pawan nawangde.

CH: |
  (Chorus)
  Khrista wang lan jisune, 
  Kamuang gasu make mutjiu wangne, 
  Khrista wang kiubo naisai, 
  Malum maidung lemkhang patu adaone.

V2: |
  2. Malum maidung lungrabo ramsi phuilo, 
  Maisuang habo ganbiu kabenbo niu phui, 
  Tinggen dihwi maidin ngamlak, 
  Thuanjiu thuan kimlulak, 
  Malum maidung lungrabo Tinggen si.

V3: |
  3. Kadih riga chunrang thiujiu lung bammai, 
  Kaloibo wan wang dasai chariu sune, 
  Malanhabo chamijai si, 
  Nuan phung maidung leng nge, 
  Ping jiu, ping jiu, chamijai ga tadne.

