ID: "227"

Title: "LUNG CHARIUBO DONJENG NIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Lung chariubo donjeng niu, 
  Tinggen ramtu I phuibam; 
  Kadih gu wisi niu, 
  Hiamkao mide, atu hai.

CH: |
  (Chorus)
  He! atu Rankhaipiu suang gasi, 
  Pamaidung tu kadabo nai sai; 
  Chang kamakbo atudi, 
  Wang chapne, Rapiu suang ga.

V2: |
  2. Kadihri gu masia niu, 
  Nai machang asai sui wang; 
  Magen thiude, Rapiu; 
  Nalungsa niu kha khailo.

V3: |
  3. Namai leng kadabonai, 
  Atudi lukhai suma? 
  Napum tan pikhailo, 
  Nahiuna niu gukhailo.

V4: |
  4. Naken dibo tingmik ga, 
  Namaitu lusu misai; 
  Kadih gu kawitu, 
  Mangai sune, Tinggen ga.

