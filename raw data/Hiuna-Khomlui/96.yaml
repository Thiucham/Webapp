ID: "96"

Title: "RINGBO HIUNA HAJIU SHAIRA MAI"

Key: "G"

Time signature: "6/8"

V1: |
  1. Ringbo hiuna hajiu shaira mai kengbam, 
  Mariu chari pasao phiulak kin; 
  Manang khaimai hajiu pibam rama? 
  Jesu lungsiat din khaira khonbam.

CH: |
  (Chorus)
  Wanton mibine, Tingwang ten thiura, 
  Chagan kum benne, hiuna khomsai; 
  Tingtheng chami ga chariu khengratu, 
  Ngaotang makjiu manang khaimaiha.

V2: |
  2. Tad raimi maidung tingtheng leng hamide, 
  Paopeh pui piu, chaka singnahdung; 
  Chariu bamdi saoniu rankhai lanra, 
  Matuak bamliudi malan lakde.

V3: |
  3. Tuhoi wan gadi kengmai kahu thiubam, 
  Thiubo mijai npuilam maranbam; 
  Rijumakga ringbo laddin khaira, 
  Kungbo mikdui niu dinkhai lakma?

V4: |
  4. Psalm 126 gu 5,6 ga, 
  Kap huijiu chalin maruk mimai; 
  Matha chunwi thuanbo luiniu thiune, 
  Miusi khomwang lanbonai dasai.

