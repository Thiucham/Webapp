ID: "26"

Title: "WANGKIULO HIUNA MASANBO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Wangkiulo hiuna masanbo, 
  Chalungchun limakbo maiga; 
  Ranpad rabo 'pui simakjiu, 
  Ringbo mpui dinlenlo.

CH: |
  (Chorus)
  Mpui dinlenlo mpui palingbo, 
  Pawan hamakbo tingga; 
  Alungchun gasu simasan raleng, 
  Tingtheng jeng majang khailo.

V2: |
  2. Wangkiulo hiuna masanbo, 
  Nuan ga kabang thiubam maidung; 
  Rankhaibo mpui simakjiu, 
  Ringbo mpui dinlenlo.

V3: |
  3. Wangkiulo hiuna masanbo, 
  Nalad niu majangjiu bamlo; 
  Aliu hiuna ranpad khailo, 
  Ringbo mpui dinlenlo.

