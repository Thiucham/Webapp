ID: "256"

Title: "ZION KASAN GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Zion kasan ga lungra leng, 
  Duidi gen I kenpad dasai; 
  Sibo ramga I lung sune.

CH: |
  (Chorus)
  Halleluyah Amen.
  Halleluyah Amen Amen, 
  Amen halleluyah Amen,
  Halleluyah  halleluyah,
  Amen Amen wi-e wi-e,
  Aram Zion Zion.

V2: |
  2. Lungsabo wan hailoi dasai, 
  Wibo ramga I tad sune; 
  Zion aram Zion gase.

V3: |
  3. Nuan bamlakge Tinggen ramga, 
  Zion aram Zion gase; 
  Lungchariu, thiuniubo hade.

V4: |
  4. Kap saosulo Zion namai, 
  Nanuan hina kuak khai mide; 
  kaden lude aman raleng.

