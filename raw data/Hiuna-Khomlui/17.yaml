ID: "17"

Title: "NAIKHAT I MAKUMJIU ARINGTING"

Key: "G"

Time signature: "3/4"

V1: |
  1. Naikhat I makumjiu aringting phui khaijiu, 
  Asuang kasabo ha kadih ga, 
  Amikdui padjiu I Rapiu ga, 
  Calvary cross ngao ye.

CH: |
  (Chorus)
  I niu detiubo gu thiuralo? 
  Nangniu cross ga chariu kheng khaibo, 
  Chamaina ra kasa jeng niu shai, 
  Jesu lungsa jiu shaikhai.

V2: |
  2. Kahiambo wan wangsai calvary ngao khailo, 
  Tamiubo kamuang I len kemra, 
  Kadih aringting hai loimakthen,
  A rawang chiu bamne.

V3: |
  3. Lenkinbo thingna niu chunwi lui thiusaira, 
  Tasing tatu Rapiu cham dinsai, 
  I Rapiu tu thuankiumak talak, 
  Jukhailo a rawang.

