ID: "229"

Title: "KADIHMAI NUAN PHUNG KHAIRA"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Kadihmai nuan phung khaira, 
  Chamaidung tu gukhaira; 
  Tingwang nahpiu Jesu Khrista si, 
  Mana khai Bethlehem ga.

CH: |
  (Chorus)
  Kadih matha chunwi thubosi, 
  Pabam machang naga; 
  Patu simakbo bam hinaga, 
  Tadjiu dinruan sukhe.

V2: |
  2. Nang maidung hina siniu, 
  Nuan hang ga bammai hina, 
  Rapiu Tingwang tu lukhai raleng, 
  Shai khai Calvary cross ga.

V3: |
  3. Kadih nuan ga bam maidung, 
  Tamiubo ga bam maidung; 
  Phuikhai lujiu lungsa makjiu ma? 
  Ranpad raleng tad sukhe.

