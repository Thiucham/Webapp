ID: "29"

Title: "TINGWANG NIU MAI KHATNA TUDI"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Tingwang niu maikhatna tudi piha khaini makge, 
  Lungli jiu pakhuga wang maidung tu luni-e; 
  Tingwang hiuna seniu haitiu jiu dinkhai-e, 
  Nang kadih harabo wan majat jiu wang sude.

CH: |
  (Chorus)
  Lungli lujiu malum sulo, 
  Rankhaibopiu tu phuilo; 
  Naliu lungli sulo nuan gasu ran khaira, 
  Nang kadih harabo wan majat jiu wang sude.

V2: |
  2. Haibo kadih hai nuan niu chawang thiujiu lungbo ramme, 
  Kamaobo nuan tense niu fuijiu lungbo ramme; 
  Tiulujiu saklujiu mengjiu bam maidung yo, 
  Malum makbo wan ga nang kadih hasune.

V3: |
  3. Nang kadih hai Sadom khatdi Gomrah nai 'chamme, 
  Din ngam lakbo chariu kapingbo wan wang sune; 
  Loibo wan wang dasai nuan niu chawang thiune, 
  Chakin wibo bam lakge loibo wan wang dasai.

V4: |
  4. Lungsa maidung pawan hai chak lujiu lungli sulo, 
  Lungsa khaibo pawan hina tadton misune; 
  Noah niu lungbo wan ga pad mibo kumjiu, 
  Kapjiu huijiu bam liudi rankhai lanbi lakge.

