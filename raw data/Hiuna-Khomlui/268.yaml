ID: "268"

Title: "TINGGEN CHAWANG DIH WANG TANG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tinggen chawang dih wang tangbo nai sai, 
  Kachariubo mangai mine, 
  Kadih ramtu maning lanlak, 
  Jerusalem namsan gasi.

CH: |
  (Chorus)
  Dedao suniu wangtang ralo? 
  Apiu bambo amanbo ram, 
  Nawangdih wang tangbo naisai, 
  Atu maning taokhailo.

V2: |
  2. Kadih wan hai kalikam mine; 
  Pawan hai sa khit khit mine; 
  Kapingbo niu pabam machang, 
  Tamiuwang ye, kadih ramga.

V3: |
  3. Rapture tingmiksi na wangsude; 
  Rapiu tu mangaikam mine, 
  Pawan hade, kadensulo; 
  Lungli lanra pawan hade.

