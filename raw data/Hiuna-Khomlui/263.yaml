ID: "263"

Title: "MAISUANG HABO TINGGEN RAM"

Key: "E"

Time signature: "6/8"

V1: |
  1. Maisuang habo tinggen ram gasi, 
  Malum maidung leng kaden khai bam; 
  Naliu bam leng chabam kadenra, 
  I tad mine, chiu Jesu dinne.

CH: |
  (Chorus)
  Jesu niu aliutu ku-e, 
  Akhu wanglo, ringbo pine; 
  Chunwi matha ri nga bamne; 
  Jerusalem nam san gasi.

V2: |
  2. Kadih ram tamiu ga lung bamthen, 
  Chunwi matha amanbo haye; 
  Kapjiu kapjiu chariu kheng lumai, 
  Tinggen ga chagan kumben bamne.

V3: |
  3. I niu kungbo pui piu, singnahmai, 
  Shairabo puilam tadtheng talo; 
  Lukhailo tiujiu kapjiu bamdi, 
  Shaibo chamijai ga tad sune.

V4: |
  4. Maidin silakbo tinggendih si, 
  Chunwibo ronna phuijiu bamme; 
  Shaibo thiuniubo wakhat di hah, 
  Halleluyah, chiujiu thuan bamme.

