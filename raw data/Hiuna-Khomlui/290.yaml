ID: "290"

Title: "TINGWANG NIU DAMKHAIBO"

Key: "G"

Time signature: "2/3"

V1: |
  1. Tingwang niu damkhaibo mania ruang ga, 
  Apui apiu kumbo I niu ngao mak! 
  Atu makot jiu bambo Tingwang ye, apui piu;

CH: |
  (Chorus)
  Apui he, apui! 
  Thainai delam nangtad mijiulo, apui! 
  Nakhon chiuni jiu napamna I kap bamme; 
  Dechiujiu atu paokak maklo? 
  Maning kamlak apui lungsiat,
  Apui he! apui! (kanam thuboleng)

V2: |
  2. Chakhuang changee rongdi wan wang sude, 
  Maipui pajiuna puan thiujiu nuibam; 
  Napamna thiujiu bambo nanahpuan thiu khailo.

V3: |
  3. Chawan ramliang maipuidung wang sude, 
  Nahmai benju apui wantu khuanjiu; 
  Tingjing wangjiu marui wang kiumide, wang lanmak.

V4: |
  4. Lujam phakkiu ramju ramton tenjiu, 
  Apamna kap bamme, I ra wang yah, 
  Tingsa tingphu rong ga kapjiu atu phiu wang-e.

V5: |
  5. Napuan thiulu delam tadra? apui! 
  Charau bam lam nang tad khaisu rama? 
  Wijiu tadlo, tinggen ga ngao dao lanne, apui.

