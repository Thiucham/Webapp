ID: "254"

Title: "NAIMIK KIUMAKBO ZION RAM"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naimik kiumakbo Zion ram wangtang sai, 
  Matha malajiu lungsune. 
  Naimik kiumakbo Zion ram wangtang sai, 
  Matha mala matha malajiu lungsune.

CH: |
  (Chorus)
  Tinggen aki wangtangbo naisai, 
  Agimanaijiu lung sune. 
  Kadih chariubo hina maning lanlak, 
  Matha mala matha malajiu lungsune.

V2: |
  2. Naimik kiumakbo Zion ram wangtang sai, 
  Chunwi mathajiu lungsune. 
  Tadraimibo lungsa maidungtu daojiu, 
  Matha mala matha malajiu lungsune.

V3: |
  3. Milypoi lungbo Zion ram wangtang sai, 
  Kajikdui kumjiu lungsune. 
  Khrista chawang thiubo ramga wangtang sai, 
  Kuilan makjiu tingtheng jengjiu lungbam sune.

