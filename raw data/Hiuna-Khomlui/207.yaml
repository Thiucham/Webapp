ID: "207"

Title: "TING KADIH DAMPAO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Ting kadih Dampao Rapiu niu, 
  Chamaitu kadih ga pilungjiu; 
  Ten ren tiura leng pikhaide, 
  Lujam hina miusi lingra pikhai,

CH: |
  (Chorus)
  Miusan kawibo ngaolujiu, 
  Chunwijiu phungwang lulo; 
  Miusan ngee wan wang ngaolujiu, 
  Phung wangjiu kat khailulo.

V2: |
  2. Tingwang niu thoidam khaibosi, 
  Ling khaibo alinsi poksura; 
  Tingnai, tingriu pikiu khai ye, 
  Tingkai, kajikdui pijiu mawi khai.

V3: |
  3. Lungchun ganiu pimisulo, 
  Maja makjiu pipat khai sulo; 
  Kap huijiu marup khai maisi, 
  Nuijiu chunwijiu gelan wang kinne.

V4: |
  4. Phuilo, lujamsi minmide, 
  Geraleng lupao piuga khenglo; 
  Minrem kam mira thiubamde, 
  Kengjiu khomwang raleng nang tad sulo.

