ID: "257"

Title: "NAIMIK KIUMAK ZION NAMDI"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Naimik kiumak zion namdi, 
  Kapjiu benthuibo tingmik machang jiu; 
  Kungbo phaiben jiu Chawang niu rankhai, 
  Aleng di chabam siram ga bamme.

CH: |
  (Chorus)
  Maning bamme. (2x)
  Pabam kawibo songdi withubo; 
  Lungsa khaipiu Khrista lun wibosi, 
  Ngaoni ye, alung chariubo saora.

V2: |
  2. Kawibo din ngamlakbo ram, 
  Tazai penniu liukhaide, sibo ram; 
  Hiupuina niu charam wibo phiubam, 
  Kadihram hai kui sang jing ra ye.

V3: |
  3. Kungbo rankhai mai lungbo ram, 
  Wangtang makra alung magen thiubam; 
  Atu phuilo, hiuna niu majangra; 
  Chawang Jesu lungbo ram maning-e.

