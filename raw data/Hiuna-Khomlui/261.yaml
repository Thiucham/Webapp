ID: "261"

Title: "TINGKUM SANG SANG"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Tingkum sang sang tad mide, tadui luang kum, 
  Chakin chakindi loiwangde; 
  Pawan wihina chamang kum tad mide, 
  Wangrabo chakintu agunne.

CH: |
  (Chorus)
  Millenium kadih pao Khrista gu chawangdih, 
  Tingkum sang chawang thiujiu lungne; 
  Siga pingbo chari bamlan lakde, 
  Agi manai wijiu lungsune.

V2: |
  2. Tingkum sang sang loi khaimide, thai nai hai; 
  Takum, chakin kasan wangde; 
  Jesu Khrista gu jubilee wang sune, 
  Suanghah ngeedi thiusune siga.

V3: |
  3. Tinggen jubilee bangsi biukhai sune, 
  Duiruak duimi lamsu wangsune, 
  Siga ramnami maidungtu adaone, 
  Suanghah ngeedi thiusune siga.

