ID: "68"

Title: "CHARIU MAGENTHIUBO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Chariu magenthiubo kadih ramgase, 
  Nangniu atu dam wang khai-e; 
  Chiubamdi Nang niu atu phut khaimakge, 
  Suang ha nalungsiat niu atu jukhai.

CH: |
  (Chorus)
  I niu machunne, withubo tinggen ram, 
  Dedao wangtang ralo; 
  Khuan ngamlak sibo ram, 
  I wang tangra.

V2: |
  2. Alung chun niu ngao Canaan ram wibo, 
  Benbamme chahiu chagan kumjiu; 
  Naikhat I wang ngaone siram wiboga. 
  Magenthiu chariu bosi bamlakge.

V3: |
  3. Kadih ga aringting si loi makthenna, 
  Naben niu atu jukhailo; 
  Tingtheng nalungsiat I niu thuan bamne, 
  Na tinggen ramga I wangtang makthen.

