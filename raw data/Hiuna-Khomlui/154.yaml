ID: "154"

Title: "HE! TINGGEN RAMGA"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. He! tinggen ramga wangni maidung, 
  Rapiu Jesu tu phuilo; 
  Natu lungsa jengniu luang bamra, 
  Rapiu Jesu tu phuilo.

CH: |
  (Chorus)
  Rapiu Jesu tu phuilo; (2x) 
  Nchun, nian natu luang bamra, 
  Rapiu Jesu tu phuilo.

V2: |
  2. Sabo nuan ga hah khaimi makra, 
  Rapiu Jesu tu phuilo; 
  Malumbo lunlung nakhu bamra, 
  Rapiu Jesu tu phuilo.

V3: |
  3. Naringting ga chariu bamliudi, 
  Rapiu Jesu tu phuilo; 
  Nakhu ga wang bam khaine chiu ye. 
  Rapiu Jesu tu phuilo.

V4: |
  4. Kasha thiuniubo wangbam liudi, 
  Rapiu Jesu tu phuilo; 
  Tinggen ramga wang tang makthen, 
  Rapiu Jesu tu phuilo.

