ID: "242"

Title: "RAPIU KHRISTA SUANG GA"

Key: "A"

Time signature: "6/8"

V1: |
  1. Rapiu Khrista suang ga, 
  Kawimai thiuraleng, 
  Khat niu khat tu chakhuang thiulo, 
  Rapiu niu pachun wikhaine.

CH: |
  (Chorus)
  Ephisa Bible ga raokhai bamme, 
  Napui napiu tu chakhuang thiusilo,
  Haisi karaibo gu chamriat side, 
  Majailumai nahmai chabon dungra, 
  Rapiu suang ga paduan wine.

V2: |
  2. Ting kai tingriu wangdi, 
  Malai lanmak rabo, 
  Khristen kawi thiu jiu lungra, 
  Khristen kikhun ga niu wangnge.

V3: |
  3. Nahmai Chabondungtu, 
  Thoidam khailo, Rapiu; 
  Thainai pawan kawibo ga, 
  Nang ten kawi pithiu khailo.

