ID: "166"

Title: "ALUNG GA AGIMANAIBO NIU PHUI YE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Alung ga agimanaibo niu phui ye, 
  Rankhaipiu tu lukhai ga suniu; 
  Alung ga naimik biu kumjiu benwang nge; 
  Alung ga manaibo bam mide.

CH: |
  (Chorus)
  Alung ga mathabo bamme, (2x)
  I niu thuanjiu bamne; 
  Rankhaibo piutu,
  Alung ga mathabo phuimide.

V2: |
  2. Haikumbo benbo mathabo tinglang hai, 
  Amun siniu dingam lulakge; 
  Tingtheng mathabo bam pah niu ranpad khaijiu, 
  Chamai mun niu dingam lulakge.

V3: |
  3. Kadih ga chakhiu chalan keng bamliudi, 
  Haijiukha kengjiu bamliu tadi; 
  Kadih gu wisiniu alung matha mak, 
  Khrista tu lukhai jiu ri ngade.

