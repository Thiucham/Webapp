ID: "295"

Title: "TINGTHENG TUDI GA THIUKHAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingtheng tudi ga thiukhaibo ki kum, 
  Rapiu nang niu kawi pikhailo; 
  Nang makendi dinjiu bammi raleng, 
  Haibo ki hai kadpat khai mide.

CH: |
  (Chorus)
  Namakendi din bammilo, 
  Natu thuanbo luithiu bamra; 
  Tingtheng jeng natu thuanjiu bam raleng, 
  Pipad khaide, nthai nakhu ga.

V2: |
  2. He! Rapiu naki masanbo lung ga, 
  Naten thiurabo leng wangmide; 
  Aliu leng tingtheng jeng kareng thiulo, 
  Natu thuanbo lui thiubam milo.

V3: |
  3. He! Rapiu khadih ga nang bam daodi, 
  Jerusalem raki ga nang tad; 
  Tuhoi haiboki masanbo gahai, 
  Majang jiu bamlo, tingtheng jengniu.

