ID: "159"

Title: "I LUNGBO RAMSI TAMIU YE"

Key: "A"

Time signature: "4/4"

V1: |
  1. I lungbo ramsi tamiu ye Rapiu, 
  Hiambo niu chunsa lungpuhbo; 
  Malan khaide, Rankhaipiu lungsa, 
  Rapiu Nakhuga I bam ni ye.

CH: |
  (Chorus)
  I singbo chiukhaikhelo, 
  I khengbo thoidam khai; 
  Nakhuan manuanbo kingjiubam, 
  Nang rankhaibo, Nang rankhaibo khuansi.

V2: |
  2. Asuang ga Getsamani chariusi, 
  Nkha khairamai khat di ha; 
  I niu nasai suitad rabo leng, 
  Rapiu Nakhuga I bamni ye.

V3: |
  3. Tamiubo kadih ga pabiu benkhai, 
  Alung tamiubo benkhailo; 
  Calvary gu lungsabo siniu, 
  Atu khajiu jusulo, Rapiu.

V4: |
  4. Kungjiu bamliudi nagu ye, Rapiu; 
  Naleng jengniu kam masanlo; 
  Pawan hina naleng niu thinne, 
  He! Tingwang atu piukhai khelo.

