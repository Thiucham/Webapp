ID: "196"

Title: "KARINGTING BANGRIP"

Key: "D"

Time signature: "4/4"

V1: |
  1. Karingting bangrip pakhiangnasi, 
  Tingwang kadih wangbo naisai; 
  Hasune kadih mania pakhiangna; 
  Nahiuna wadi halakge.

CH: |
  (Chorus)
  Mathabam daomakbo kadih ringtingsi, 
  Tadbam wangra bam simakjiu; 
  Ngutsulo tingtheng ringbo silura leng; 
  Ringbo Jesu Khrista khuga.

V2: |
  2. Chunwibo phuibo hiuna ringting; 
  Kadih chunwibo phuibo niu; 
  Kapjiu ahikbam tuhoi tangbo, 
  Tamiubo kadihri gahai.

V3: |
  3. Lungsabo chaka ngut khaisulo, 
  Tingtheng ringbosi Jesu ye; 
  Hiuna tu dejiuga chariu khai, 
  Matha khaira Jesu bamme.

