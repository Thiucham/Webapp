ID: "185"

Title: "KADIH CHARIUBO KADIHRI GA"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Kadih chariubo kadihri ga, 
  I ron mengtad jiu lung mide, 
  Lukhai khelo he! a Rapiu.

CH: |
  (Chorus)
  Kadih magenthiubo ramga I lungwangjiu, 
  Tuhoira tadmide, 
  Saodia lujiu Tinggen tadmide.

V2: |
  2. Kadih ga wimakbo ten thiumai, 
  Tinggen ramga ngut ngam lakge, 
  Lungpubo niu Padam thiune.

V3: |
  3. Kadih ga nchun kum tamiu wang, 
  Chariubo niu gomjiu bamdi, 
  Kha khai khelo, he! a Rapiu.

V4: |
  4. I ringbo tingmik hai loidasai, 
  Tinggen ramga tingtheng lungne, 
  Nazan thuanne, he! a Rapiu.

