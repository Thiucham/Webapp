ID: "172"

Title: "WAHINA DAMBO"

Key: "D"

Time signature: "6/8"

V1: |
  1. Wahina dambo Rapiu Tingwang, 
  Kadih ramga I lungbam thenna; 
  Nangniu atu khakhaira kheng ye, 
  Kahiambo tanbo kadihri ga.

CH: |
  (Chorus)
  Pawan machang atu jukhailo, 
  Pawan machang natu malumra; 
  Nagu pumtan niu atu julo, 
  Aringting hai nachunbo thiulo.

V2: |
  2. Naimachang agu lunlung gasi, 
  Chamchang, maji jiu I lungbamra; 
  Tacheng matipmai thiujiu bamra, 
  Nkhakhai lanra I niu kheng-e.

V3: |
  3. Kahiambo kadihri ram gasi, 
  Thiukaniubo kahiambo hajiu; 
  Agimanai jiu I lung bamra, 
  I niu khengbo rathoi chiukhailo.

