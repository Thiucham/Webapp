ID: "10"

Title: "NAIMIK KUMJIU BENBO"

Key: "E"

Time signature: "6/8"

V1: |
  1. Naimik kumjiu benbo tuhoi I ngao-e, 
  Tingwang niu lungsabo dinngam lakge, 
  Haijiukha wibo paniu thoidam khaibi-e, 
  Aliu ramlung ga kabenbo wang-ye.

CH: |
  (Chorus)
  Asingna maidung yo matha bamlo, 
  Tamiubo gasu aliutu ran khai ye, 
  Kadih mainadung ringbo cham paoron tadlo, 
  Kamao mai khuga ringbo cham dinlo.

V2: |
  2. Aliu kadihri ga lung aman raleng, 
  Rapiu niu lungsabo din ngam lakge, 
  Paten wibo tenra paniu ku khaibiye, 
  Aliudih ga paniu thoidam khaide.

V3: |
  3. Rapiu niu lungsabo asingna maidung, 
  Paniu lungsabo cham dinron tadlo, 
  A Rapiu zantu thuan kiujiu lungbam milo, 
  Aliu ram lung ga kabenbo wang ye.

