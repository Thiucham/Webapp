ID: "135"

Title: "KADIH PIRI PABAM MACHANG NAGA"

Key: "G"

Time signature: "2/3"

V1: |
  1. Kadih piri pabam machang naga, 
  Kasabo niu phuimide, 
  Mao makjiu kadih hai hakam sune; 
  Bible niu din khaibo ladren sai shuijiu, 
  Kadih piri haisi chami niu rukam rabo we.

CH: |
  (Chorus)
  Khrista niu kiulanbonai dasai, 
  Kadih gu wasi mai hina niu; 
  Paliu nbai khairabo bam phiu lakge, 
  Khrista kiulan dasai.

V2: |
  2. Kadih piri ga wasi maidungsi, 
  Naningting wijiu bamdi; 
  Rapiu niu nang tu ladjan thiu sune; 
  Kadihmai munniu kadih mai liriang niu, 
  Pi maji khai ngamlakge, patu Tingwang kiu dasai.

V3: |
  3. Kadihgu napum leng song nkiujiu, 
  Nahiuna leng kadenlo; 
  Kadihga lungbo hina hakamne, 
  Nachakhiu hina, nahiuna leng tenlo, 
  Kadih piri pakhiangna mao makjiu hakam sune.

