ID: "302"

Title: "PAKENDIBO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. He! Rapiu nazan kendibo siniu, 
  Juken khaide shaibo ganiu ringra, 
  Agu nuan niu achun sajiu bamdi, 
  Majang khailo, He! Jehovah Jereh.

CH: |
  (Chorus)
  Pakendibo Rapiu natu thuanne, 
  Immanuel nang niu malong khaijiu; 
  Nanah maikumjiu makod jiu bamdi, 
  Majang khailo, He! Jehovah Jereh.

V2: |
  2. Jesu nazan kendibotu thuanne, 
  Natu simakjiu lungmai keng bandi, 
  Jesu ronna na-e, atu kuak khaibo, 
  Majang khailo, He! Jehovah Jereh.

V3: |
  3. Jesu nang makendibo thiumilo, 
  Nalungsiat penniu singchai ga shaikhai; 
  Aringting bamthen natu thuan bamne. 
  Majang khailo He! Jehovah Jereh.

