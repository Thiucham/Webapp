ID: "205"

Title: "CORINTHIA GA PUAL NIU DINNE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Corinthia ga Pual niu dinne, Hiuna masanbo niu phuijiu; 
  Kengjiu maruk maihina kengjiu luye, paluluang ga, 
  Kengjiu luye, paben dimai.

CH: |
  (Chorus)
  Pual niu dinkhai bosai suijiu, Tingjiu khaimai tamjiu lu-e; 
  Sikumjiu kengjiu pimai kengjiu lu-e, pagu tathuan, 
  Miusan ngee ga kengjiu pilo.

V2: |
  2. Lungsa khai-e, Rapiu Tingwang, chunwijiu mathiu pimilo; 
  Lungchun niu maja makjiu pinijiu pimai mathiu tu, 
  Tingwang niu pachun wikhaine.

V3: |
  3. Malumbo niu na Rapiu leng, maja makjiu pikhaisulo; 
  Napumniu katan boting, maran khaijiu pipat sulo, 
  Tathuan dine, a Rapiu ga.

V4: |
  4. Rapiu thoidam kadih mai niu, Kalek samai lunglak maileng; 
  Maja makjiu pimilo, Nanglung chun niu pini milo, 
  Malumjiu Rapiu Khrista tu.

V5: |
  5. Nanglung chun niu matha lujiu, Nang lupuk ga bambo hina; 
  Buanbo masi masengbo, Kiakiubo hina dung sidi; 
  Tingwang guye, maning taolo.

