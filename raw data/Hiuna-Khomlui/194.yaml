ID: "194"

Title: "NAIKHAT GU RINGTING HAISI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naikhat gu ringting haisi, 
  Mathak bam wadi ha, 
  Tadui niu luangbo kumjiu, 
  Aring ting malan lak, 
  Chapiubon niu tangbo kumjiu.

CH: |
  (Chorus)
  {Maruk khaibo linsidi, 
  Tatu riga chia khaibo dung, (2x)}
  Jesu wang kiubonai dasai, 
  Papao khu wang ngam mak, 
  Thuanmi sune, kadih gasi.

V2: |
  2. Pen bambo rapen dungsi, 
  Nai khatra kui sune, 
  Tingthung wangbo wan gasi, 
  Gukhaira ha sune, 
  Rapiu Khrista siniu makjiu.

V3: |
  3. Chapiu niu tangbo kumjiu, 
  Naikhatra kuisune, 
  Ringbambo aliuring ting, 
  Tad sune, ahiuna; 
  Kadih pum hai sao diak lujiu.

