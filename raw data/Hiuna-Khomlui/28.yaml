ID: "28"

Title: "ALIU CHAMAI RINGTING"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Aliu chamai ringting hai dunbo-e, 
  Nang hai detheng lungra maning bamlo, 
  Kadih wantu sijiu lungli sulo, 
  Tuhoi side lukhai rabo wan.

CH: |
  (Chorus)
  Singnah mai tuhoi pawan wibo-е, 
  Nating lang maikhat niu dinsimakge, 
  Mik ngao makjiu lungkajit jiu bamsai, 
  Tingwang lungpomsi ngao jisune.

V2: |
  2. Naikhat, naikhat chiubo haihiambo-e, 
  Pawan sira nangtu khuanlak sune, 
  Kaloibonai Jesu lungsa lura, 
  Tuhoi pawan bamga ten lukhe.

V3: |
  3. Kadih luni niu nalung tan talo, 
  Nahiuna kapjiu bambosi nangsima? 
  Tuhoi pawan hai hawang midasai, 
  Nachun wijiu daongam lusuma.

