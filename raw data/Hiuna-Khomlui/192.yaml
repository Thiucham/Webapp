ID: "192"

Title: "NANG TENDON SI"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Nang tendonsi ngamdiu then ten mawi jiu, 
  Gukhaipiu cham maidungkhu dinne sai, 
  Masai khindu mainiu malum makbam di, 
  Rapiu din sune, ten mawide.

CH: |
  (Chorus)
  Oh! a npui, I tadloi wangbo nai sai, 
  Chariu lakjiu chari ngam wangbonai, 
  Tathun tungjiu Cross ponjiu I wangbonai, 
  Rapiu din sune, ten mawide.

V2: |
  2. Hai ringting ga taten loi wangbonai, 
  Nang ten jengphi luraleng wangbonai, 
  Dejiu wibo chunwibo gu lad kenglo? 
  Paniu dinsune ten mawide.

V3: |
  3. Nang ngam diuthen matan jiu tenbamdi, 
  Wang tanglakjiu phi, ben jam kam liudi, 
  Cross si ponjiu patu adao kalanglo, 
  Rapiu dinsune, ten mawide.

