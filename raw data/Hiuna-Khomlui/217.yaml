ID: "217"

Title: "TINGWANG NAH PIU TUSI PHUILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang nah piu tusi phuilo, 
  Genrabo Cross si pon lujiu; 
  Shaibo bam lam tadde, 
  Rankhai ramai bamma? 
  Pijiu wanglan raleng.

CH: |
  (Chorus)
  He! aliu Rapiu shaibosi, 
  I ngao raleng ping nge; 
  Cross si somkhai lujiu, 
  Rapiu tu gen raleng, 
  Tiujiu akheng bamme, 
  Rapiu tu phui ngam mak.

V2: |
  2. Phuikhang ngaolu alung makge, 
  Nuan phung khaibo Rapiu tusi; 
  Pachariu phui ngam makge, 
  Tinggen lam phui khangjiu, 
  Mazadung kap bamme.

V3: |
  3. Kadih ga bam maidung phuilo, 
  Aliu leng shaibo Rapiu tu; 
  Pachariu phui ngam mak, 
  Kamuang niu wang kiujiu, 
  A Rapiu tu sung nge.

