ID: "134"

Title: "RAPIU NIU WANGLAN RABO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rapiu niu wanglan rabo wansi nawang sude, 
  Kaden makmai hina tusi luthuanne; 
  Rapiu niu khena thinlu jiu wang sude, 
  Kadih ga min bambo ludungsi gera.

CH: |
  (Chorus)
  Oh! phuilo gerabo lusi min bamde, 
  Rapiu niu khom madui sune, pasi si; 
  Kaden sulo a Rapiu wang lan sude; 
  Luthuan misune kaden mak maidungtu.

V2: |
  2. Bible ga raokhaibosi kumjiu wangtang sude, 
  Kadih pabam hina ga wang tang mide; 
  Kadih ga chariubo ta thiu charih niu, 
  A Rapiu wanglan rabo madan thiubam.

V3: |
  3. A Rapiu tu malum maidung tu kada padra, 
  Mariu niu gembosi kumjiu gem sune; 
  Patu malum lumak mai hina tura,
  Kathiubo chamizai gasi thuan khaine.

