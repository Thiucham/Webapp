ID: "267"

Title: "KADIH GU WIBOSI PHUTMI SUKHE"

Key: "G"

Time signature: "6/8"

V1: |
  1. Kadih gu wibosi phutmi sukhe, 
  Jerusalem san ga tingtheng lungra, 
  Rapiu niu aliu tu kujiu bamme, 
  Kalang jiu wangsulo, nuan phung maidung.

CH: |
  (Chorus)
  Maisuang habo kendi bonai, 
  Ngambo lui thiu sune, 
  Tingwang tu simak jiu lung mai hina, 
  Chariubo niu paduan thiujiu, 
  Tamiubo ram ga lung sune, 
  Rapiu tu malum maira chunwine.

V2: |
  2. Oh! singna mai naringting tu sima? 
  Kadampou niu kuwangbo nai sai, 
  Nang kak ngamma? Rapiu wangbo nai sai; 
  Kaden bam khe, pawan tu nang simak.

V3: |
  3. Rapiu wangbonai malum maihina, 
  Halleluyah, hosanna sen bamne; 
  Tinggen lamsu make khuanchiu dasai, 
  Malummak maileng ra pawan hade.

