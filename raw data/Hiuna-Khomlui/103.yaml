ID: "103"

Title: "WICHAM DINRA NATU KU YE"

Key: "E"

Time signature: "6/8"

V1: |
  1. Wicham dinra natu ku ye, 
  Tinggen kadih nade, chiujiu dinron tadlo; 
  Thiuniu maitu piwi khailo, 
  Rasa dungtu hathon khailo; 
  Naliu leng pumtan pikhai mide.

CH: |
  (Chorus)
  Rapiu lujam gasi taten thiuramai sao bamlo? 
  Isaiah kumjiu tad padkhe, 
  Rapiu Jesu wangji sune.

V2: |
  2. Lungsha maidung lungli sulo, 
  Natu pikhaibo kalensi thinlan sulo, 
  Nangniu tenmak jiu bam mesai, 
  Chariubosi wang misune, 
  Rapiu Jesu niu haitiu dinne.

V3: |
  3. Tinggen Jerusalem san ga, 
  Malum maiten gajao maidung wang lung sune. 
  Siga kapbo, shaibo haye, 
  Tingwang biuniu benjiu bamne, 
  Tingtheng jeng Patu thuanjiu bamne.

