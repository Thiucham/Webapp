ID: "173"

Title: "RANKHAIBO KHAMSI LEKHAIDE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Rankhaibo khamsi lekhaide, 
  Calvary luang ga; 
  Lungpuh chariubo haraleng, 
  Mathajiu lung aruang raleng, 
  Kaden khai ye, Tinggen ki se.

CH: |
  (Chorus)
  I zuanwang nge, a Rapiu nang kaden khaibo, 
  Kahiambo ri tanwang liudi, 
  Nangniu atu jujiu bamlo.

V2: |
  2. Ahiuna leng Rapiu shaibo, 
  Calvary Cross ga; 
  Nian nai chundi wangbam milo, 
  Siga nang lung rabo ramme, 
  Zuanwanglo chariubo kimne.

V3: |
  3. Kaguangbo mania hakamde, 
  Dam kasan lande; 
  Nuan ga shaimibo sulanjiu, 
  Manbo ramga lungra kaden, 
  Mathajiu lung aruang raleng.

V4: |
  4. Immanuel, Tinggen chawangdi, 
  N-manbo ramga;
  He! dedaoniu wang tang ralo? 
  Maning bamme, tingtheng ramsi; 
  Kakung maidung siga bamme.

