ID: "244"

Title: "NAIKHAT ALIU RINGTING"

Key: "E"

Time signature: "4/4"

V1: |
  1. Naikhat aliu ringting hai loi dasai, 
  Tuhoi thiubo luisi thiu lanlak; 
  Naikhat nsuan I sulanbonai dasaira,
  Kulam aliu dejiu chunwi ralo!

CH: |
  (Chorus)
  I ngao sune.Tingwang zusi, 
  A Piu Tingwang lungsa I ngaobonai dasai; 
  Kulam aliu dejiu matha ralo,

V2: |
  2. Naikhat, naikhat thiujiu I khuanbamne, 
  Amee bung hai ben mawi khailujiu; 
  Chaki paoniu rengmun hai lepadbo nai sai, 
  Pakhu ahiupuina len khang sune.

V3: |
  3. Kaden sibo maisi duanwi sune, 
  Tingwang khu 'liu kamsi lenbonai; 
  Wide, tiujiu dinkhai sune, sibo wan ga; 
  Dinkhaira leng Tingwang ten thiu sukhe.

