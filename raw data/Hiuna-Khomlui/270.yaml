ID: "270"

Title: "LUNGCHUN NIU MANING"

Key: "D"

Time signature: "4/4"

V1: |
  1. Lungchun niu maning silakbo tinggen, 
  Malum maidung leng-e; 
  Jesu niu patu malum maileng, 
  Kaden khaibo tinggen Jerusalem.

CH: |
  (Chorus)
  Siga naimik, chahiu, chagan hah, 
  Khrista niu ben bamme; 
  Chunwi pamalan thiulak, Jerusalem gasi, 
  Halleluyah, tiujiu thuan bamne.

V2: |
  2. Chariu magen thiu mikdui luangbo hina, 
  Khrista niu nunsangne; 
  Kadihri gu wibo hinasi, 
  Mangai sune, tinggen wang tangbonai.

V3: |
  3. Shailujiu ringsulanbo naidasai, 
  Lemkhang jiu adaone; 
  Maza sang sang niu chunwi daone. 
  Kuilan lakbo tinggen rapen thiune.

V4: |
  4. Khrista niu kaden khaibo pirun runjiu, 
  Chawang suang ga chapjiu; 
  Nuirim rim Patu ju ngao lujiu, 
  Kahumjiu halleluyah, oh! Amen.

