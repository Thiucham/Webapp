ID: "175"

Title: "RANKHAIBO PIU GASU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Rankhaibo piu gasu ron meng tadmiliudi, 
  Paman hah lungsa jiu kubo I chiu-e; 
  Chariubo gasu atu gukhaide, 
  Pawang dih wiga lungra paben niu jukhai.

CH: |
  (Chorus)
  He! Rapiu nangniu atu lungsabo side, 
  Shaibo nuan bam gasu nang tu mazuan wang-e; 
  Nangben jat niu jukhailo, a Rapiu, 
  Naram wiga lungra a Rapiu lukhailo.

V2: |
  2. Kadih mainiu sichiabo chariubo ramga, 
  Nbin jiu rontadbo ting loi dasai; 
  Tinggen Jerusalem ga lung dasai, 
  Pawang tu thuanbo lui saomakjiu thiu bamne.

V3: |
  3. Jordan giu duisi ken ngam lakge, a Rapiu; 
  Lungsabo naben niu atu julo; 
  Tingtheng ram wiga atu jukhailo, 
  Nawang bampeng suang ga kuimakjiu thuan bamne.

V4: |
  4. Tuhoi pawan wiga Khrista tu lukhailo, 
  Chabuan ringting tu Khrista luni-e; 
  Nawang dihsi wangtang bonai dasai, 
  Namai thiumak maidung dejiu sansa ralo.

