ID: "234"

Title: "NALENG ALENG JENGNIU"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Naleng aleng jengniu, 
  Jesu Khrista tu mana-e; 
  Maihina wang kahum sukhe, 
  Zat hina leng lungwang bamde.

CH: |
  (Chorus)
  Pakendi milo, halleluyah; 
  Maihina chunwilulo thainai; 
  Zat hina Wang lungwang bamme.

V2: |
  2. Kadih manai chialo, 
  Kulam Tingwang kendi bamlo; 
  Karingbo cham phung wang khai ye, 
  Bethlehem Nam matomki ga.

V3: |
  3. Immanuel Jesu, 
  Chawang mairi ga Chawang ye; 
  Pabiu kabenbo thao kiusi, 
  Maihina leng thaoben khai-e,

V4: |
  4. Paken kadibo cham,
  Kadihri ga pisi chailo; 
  Dikachangbo Wang Khrista tu, 
  Thuanlo, Chawang Immanuel.

