ID: "131"

Title: "TAMIUBO KADIHRI"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Tamiubo kadihri gahai, 
  Ronmeng kam mide milydung; 
  Damkhaibo Tingwang tu mangaijiu, 
  Pak marenkam mide milydung.

CH: |
  (Chorus)
  Mathingjiu khuanbamlo, 
  Khrista wang ratu; 
  Kaden lujiu lungpu 
  Chariu hahjiu zuantadlo tinggen npui.

V2: |
  2. Kadih mai pawan aga kamde, 
  Suannai leng dak khai kamde; 
  Chiudi Rapiu wanglan rabowan, 
  Maikhat nadi din ngam lakge.

V3: |
  3. Karaimai niu nami sune, 
  Namainiu raimi sune; 
  Thiumak, agimak lum buak, buak sai, 
  Masiu thuan mine chiu dinkhai ye.

