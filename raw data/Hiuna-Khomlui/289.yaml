ID: "289"

Title: "KADIHGA LUNGSA APHEN MAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga lungsa aphen mai, 
  Diumibo kadih ram wiboga, 
  N-man jiu lungrabo kadihga, 
  Ramnara nawang sude.

CH: |
  (Chorus)
  He! Rapiu ramna bam liudi, 
  Kendibo ramga wangtang makthen, 
  Jukhai khelo, lungsabo benniu; 
  Majangjiu npui dinkhailo.

V2: |
  2. Wang Immanuel jukhailo, 
  Saodiak sune, mikdui luangbo ram; 
  Mathabo ramlam zuantad mide; 
  I tadra npui dinkhailo.

V3: |
  3. Charapen kumbo kadih hai, 
  Pawan machang bam ncham raleng, 
  Tingtheng jiu lungsabo aphen mai, 
  Pawan hai lemtad mine.

