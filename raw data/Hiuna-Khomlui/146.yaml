ID: "146"

Title: "HAIBO KADIHRI KAHIAMBO DIH"

Key: "E"

Time signature: "4/4"

V1: |
  1. Haibo kadihri kahiambo dih ye, 
  Lung n-manbo haye, Rapiu makjiu, 
  A Rapiu leng lung kasan thiu lankhe, 
  Pasai aliu chuaklan mak raleng.

CH: |
  (Chorus)
  Pawan khat Rapiu majangne, 
  Tinggen Jerusalem ga, 
  Kikhun mainaih matha aruang bamra, 
  A Rapiu tu mangaimi mane.

V2: |
  2. Rapiu Khrista si Cross ga wang shaikhai, 
  Aliu chengsa hina khiu masan khai, 
  Kungbo pazai niu aliu tu liukhai, 
  A Rapiu tensi ten jiu bamkhe.

V3: |
  3. A Rapiu wanglanbo naidasaira, 
  Tingkalikbo kumjiu ben wang sune, 
  Sibonai tinggen maidung machangne, 
  Maihina tu kada lansune.

