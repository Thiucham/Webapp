ID: "104"

Title: "NINEVAH NAMDI"

Key: "E"

Time signature: "3/4"

V1: |
  1. Ninevah Namdi ga tad raleng, 
  Jonah tu Tingwang niu lang khai ye, 
  Tingwang niu dinbo lam tad makjiu, 
  Tarsis npui lam tadkhai mide.

CH: |
  (Chorus)
  Jonah (2x) Nang dega bamlo? 
  Natu Tingwang niu phiujiu bamme, 
  Patu nangniu mangai midi, 
  Tingwang ra natu mangai mimakge.

V2: |
  2. Jonah tu chakha dibo lungga, 
  Nchun nen jeng sum bam khai ye, 
  Tingwang ga pamao kuak ra kheng nge, 
  Pamao hina kuak khai mide.

V3: |
  3. Nineveh namdi ga tadlu jiu, 
  Paliu nuan gasu lung lilura, 
  Jonah niu Tingwang chamsi dinkhai, 
  Chariubo gasu piduak khai.

