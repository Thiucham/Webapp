ID: "59"

Title: "ATU KARINGBO SINGBANG"

Key: "G"

Time signature: "4/4"

V1: |
  1. Atu karingbo singbang thiu khailo, 
  Singgiu mung ga subo singbang kumjiu; 
  Pamen jangjiu pabuan ringbo buanra, 
  Hiuna ten thiubo si masi raleng.

CH: |
  (Chorus)
  Pikasanlo aliu lungchun hina, 
  Pihamilo 'daa lung hinasi; 
  Kawimai lung kumjiu wibam raleng, 
  Siboram wiboga I wang raleng.

V2: |
  2. Ringsang jing sune chariubam liudi, 
  Jesu sung gase ringrabo bamme; 
  Khrista niu sombo singbang shailan lak, 
  Kadih hamiliudi halan lakge.

V3: |
  3. Pating patheng chariujiu bamliudi, 
  Ringbo Tingwang pirun wang luraleng; 
  Siga wangra Jesu kubamme, 
  Amanbo tinggen ramga wang raleng.

