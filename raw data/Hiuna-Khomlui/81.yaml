ID: "81"

Title: "MPUI MENGJIU RONTADKIN MAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Mpui mengjiu rontadkin maidung tuse, 
  Rapiu niu lungli wangra kubamme, 
  Pawan rimi makga malan wanglo, 
  Tingtheng jeng amanbo pikhai sune.

CH: |
  (Chorus)
  Chalung lilulo  chalunglilo, 
  Rapiu niu natu tingtheng ringbo pine, 
  Kalangjiu lungli wanglusai, 
  Tingtheng jengjiu mathabo pisune.

V2: |
  2. Tuhoi kadih ga chunrang thiubam mai, 
  Kadih gu winiu natu ranlulak, 
  Kashaibo tingmik niu nammi mak ga, 
  Ringbo Jesu ga nang malan wanglo.

V3: |
  3. Kadih mathabo tuse phutlujiu, 
  Ringrabo mpui lam zuan wang sukhe, 
  Chunwi saomakbo tinggen ramgase, 
  Rapiu nai tingtheng tingtheng lungbamne.

