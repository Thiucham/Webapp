ID: "87"

Title: "HAMI MAIDUNG TU"

Key: "A"

Time signature: "4/4"

V1: |
  1. Hami maidung tu ranpad raleng, 
  Tingwang Napiu tu langkiu khai ye; 
  Harabo npui tadjiu bambo ga, 
  Adao ye, Rankhaibopiu Jesu tu.

CH: |
  (Chorus)
  Nang ling khaibo gelan sune, (2x)
  Chamai pum leng maruk maidung, 
  Maipum leng shaibo gelane, 
  Hiuna leng maruk mai sira, 
  Hiuna tingtheng ringbosi lusune, 
  Nangniu lingkhaibo gelanne.

V2: |
  2. Tingwang niu thou tai khaibo David, 
  Nuan niu masiabo tenbo jengniu; 
  Panahpiu ga shaibo pad mide, 
  Kadih riga mikrebo dung niu phui.

V3: |
  3. Panahpiu tu malum mak maira, 
  Tingtheng chariubosi lusune; 
  Panahpiu tu malum mai sira, 
  Hiuna tingtheng ringbo lutao sune.

