ID: "215"

Title: "PAKEN DI MILO JESU ZAN"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Pakendi milo Jesu zan; 
  Kadih nai tinggen ga; 
  Mazadung Tingwang tu thuanbo, 
  Satan ping kadun bam.

CH: |
  (Chorus)
  Aleng machang makbo hade, 
  Kakitu masen mak.
  Khrista shaibo aleng gapde, 
  Alengjeng niu shai-e.

V2: |
  2. Nuan phung maileng Khrista shai-e, 
  Sahmai malin thiujiu; 
  Nuan hina kuak khai kam mide, 
  Mathabo pikhaide.

V3: |
  3. Palungsa hai pisi chialo, 
  Rankhaibo madulo; 
  I niu rahkhainibo chamsi, 
  Milypoi marih-e.

V4: |
  4. Mathajiu pajan madulo, 
  Aringting bam thenna; 
  Maihina ga paoron tadne, 
  Milypoi marih si.

