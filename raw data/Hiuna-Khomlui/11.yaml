ID: "11"

Title: "ANUAN DUNG PHIUPAD GA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Anuan dung phiupad ga tinggen lam,
  Naikhatra ladzan ga I chapne; 
  I duak ngam makge Tingwang suang ga, 
  Saobamlo atu gukhai ngamra?

CH: |
  (Chorus)
  Tasi Jesu lungsa wichang nge, 
  Khat khat thiujiu anuan dung kuak khai; 
  I duakne lungsa niu ladzan ga, 
  Jesu khu malumjiu piduak khai.

V2: |
  2. Nuan jeng Jesu tu Cross ga kamshat, 
  Buimakbo aliu leng jeng ganiu; 
  Paniu kheng khaide, anuan jengniu, 
  Jesu gapbe, liutu gu khaira.

V3: |
  3. Kabo Chawangbam peng ga taojiu, 
  Kati kadih kata hinatu; 
  Duidih nai charuiram hinatu, 
  Ladzan thiune kaloibo naisai.

V4: |
  4. Ringbo ariak ga pazan hamai, 
  Jesu tu malum mak maidung tu; 
  Malan habo shaibo mijaiga, 
  Tingtheng jeng chariu kheng bamsune.

