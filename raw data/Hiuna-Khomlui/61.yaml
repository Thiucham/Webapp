ID: "61"

Title: "CHAMAI RINGTING DUIRIANG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Chamai ringting duriang luangbo kumjiu tadbam, 
  Pating pawan sira malan wangsune; 
  Chamai ringting ra malan wangbi lakge, 
  Kuikam mide charapen kumjiu, 
  Malan wangbi lakge.

V2: |
  2. Lungsa maidung lungli sulo pawan hade, 
  Chamai kinwibo hina kuimi sune; 
  Pabam machang nchungbo niu fui mine, 
  Malan wanglo ringbo Jesu ga, 
  Pawan hawang sude.

V3: |
  3. Lungsabo pui piu asingnah thiumai dung yo, 
  Kapjiu ramna sune kadih loibonai; 
  Malum makmai chamijai ga tad sune, 
  Malan hajiu chariu kheng sune, 
  Dejiu sansa ralo.

V4: |
  4. Malumjiu ramna mibo aphen maidungtu, 
  Ngao dao sune tinggen Salem namdi ga; 
  Kapjiu ramna khaibo chunsha mikduise, 
  Nun sang khaine a wang Jesu niu, 
  Kapbo bamlan lakge.

V5: |
  5. Malum maidung tinggen lam wang aruang bonai, 
  Chawang tu chap maguijiu thuanbam sune; 
  Chunsa jengsabo hina bamlan lakge, 
  Chawang Jesu nai matha chamjiu, 
  Ringa saomak bamne.

