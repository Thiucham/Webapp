ID: "53"

Title: "I MUMSY KENNE"

Key: "D"

Time signature: "4/4"

V1: |
  1. I mumsy kenne naliu pakeh-e, 
  Kungbo 'sy masilo Jesu leng, 
  Masy makbo keh hinase tura, 
  Rapiu luthuanne Jesu dinne.

CH: |
  (Chorus)
  I mumsy kenne naliu pakeh-e, 
  I mumsy kenne akhu bamlo,
  Nang lukanihi khenglo pikhaine, 
  Apiu atu kungkum I natu kung.

V2: |
  2. Aladkeng seniu naliu masande, 
  Akhu bamlo 'sy masy kengra, 
  Aladren hina naliu khu bamsai, 
  Tinggen ga kendibo luchamne.

V3: |
  3. Nasy niu kadihmai natu sine, 
  Nnian nahkum benbo ga tadlo, 
  Natu jupao saisuijiu nang tadlo, 
  Kendibo chawang dih ga jukhaine.

