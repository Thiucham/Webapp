ID: "69"

Title: "KADIH PABAM HINA GA"

Key: "D"

Time signature: "6/8"

V1: |
  1. Kadih pabam hina ga dinron tadlo,
  'Liutu rankhai mibo chamse, 
  Juringbo bam simak maidung khuga, 
  Pawan hamide nang kalang sulo.

CH: |
  (Chorus)
  Atu langbo-e natu langbo-e, 
  Shairabo hiunatu jupad khaira, 
  Nang tadpad jiu din ngamlak bamdi, 
  Nang malin leng mai khattu lang khailo.

V2: |
  2. Phumling ga malumbo asingnah maidung, 
  Tingwang lujamse minbamde, 
  Khom madui raleng chamai phiubamme, 
  Npao kak khaimaise sanwi mai-e.

V3: |
  3. Kadih haiga lung wijiu bam maidung yo, 
  Nahiuna leng nang tensulo, 
  Nakhiu nalan Rapiu leng pipadlo, 
  Kalu maisuang pipad maidon wi-e.

