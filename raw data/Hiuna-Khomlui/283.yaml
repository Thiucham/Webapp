ID: "283"

Title: "NTHAI KADIH HARABO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Nthai kadih hara bonai, 
  Kumme aliu ramnabo; 
  Tingwang niu kawi machangbo, 
  Pikhailo, aliu dung leng.

CH: |
  (Chorus)
  Ramna rabode, nthai hai; 
  Chunsa jengsabo niu phui-e; 
  Tingwang niu majang jiu bamlo, 
  Aliu ramna bamliudi.

V2: |
  2. Aliu dung ramna bamliudi, 
  Gukhailo, nalung saniu; 
  Gaomakbo milydung kumjiu, 
  Phut khaide, aliu dungtu.

V3: |
  3. Lungsa maidungtu ramnajiu, 
  Chunsa jengsa niu phui-e, 
  Ramna khaibo chunsa mikdui, 
  He! Tingwang nunsang khailo.

