ID: "84"

Title: "SAO BIDI TADUI NAI HIUNA GA"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Sao bidi tadui nai hiuna ga, 
  Mana maksai, mana maksai; 
  Tinggen nahmai thiu ngam lulakge, 
  Rapiu Jesu niu dinne.

CH: |
  (Chorus)
  Sao bidi malumsai tingtheng ringbo lune, 
  Sao bidi malumsai tingtheng ringbo; 
  Tingtheng ringbo lune.

V2: |
  2. Sao bidi pagu kaphiu thinlu, 
  Masai liangrilan mai hina; 
  Tinggen mai thiu ngam lulakge; 
  Tiujiu Jesu niu dinne.

V3: |
  3. Sao bidi papui piu tu kungjiu, 
  Masai lam mari mai hina, 
  Tinggen mai thiu ngam lulakge; 
  Tiujiu Jesu niu dinne.

V4: |
  4. Sao bidi asai suine tiu sai, 
  Kasa lungchun hina thuanjiu; 
  Pagu Singchai ponjiu wanglo; 
  Tiujiu Jesu niu dinne.

