ID: "182"

Title: "I RINGBO NPUIGA CHAKA WIBO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. I ringbo npuiga chaka wibo khat bamme, 
  Paniu atu majang jiu tad bamme; 
  Tamiubo piben jiu achun piwikhai ye, 
  Sibo piusi atu rankhaibo piuye.

CH: |
  (Chorus)
  I manang lak apuiki wimak liudi, 
  Maluang ram nai taningdi ga tadjiu bamdi; 
  I niu si ye pah atu majang jiu bambo, 
  Kachiaram gasi majang ngut khaine.

V2: |
  2. Tingkum haitheng palungsait tu I silumak, 
  Cross ga aleng shaibo tu simak ga;
  I malumme, pase atu rankhaipiu ye, 
  Chiubo naisi anai chaka thiude.

V3: |
  3. I wadaodi tamiuram ga tadlan lakge, 
  A n-pui di phiujiu bamlan lakge; 
  Tuhoira tinggen ngutbo npui I silude, 
  Nai machang Jesu nai tad cham bamne.

