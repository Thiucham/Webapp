ID: "247"

Title: "TINGGEN JERUSALEM GASI"

Key: "E"

Time signature: "3/4"

V1: |
  1. Tinggen Jerusalem namdi gasi, 
  Charuang dibo gasi I wangbam sune, 
  Rapiu Jesu niu wanglo tiu dinne, 
  Pahom maidung mun gasu wangdin len khai.

CH: |
  (Chorus)
  Tinggen Jerusalem gasi maihina, 
  Tingtheng ringbo shailan singbang sung ga, 
  Chun wibo khuan niu Rapiu tu thuanne. 
  Nangdi wang raojiuma sibo ram gasi?

V2: |
  2. Tinggen Jerusalem namdi gasi, 
  Wangtang raleng pawansi na wang sude, 
  Nang sibo ram tangra maning bamma? 
  Nangdi tadrao jiuma? sibo ram gasi.

V3: |
  3. Tinggen Jerusalem namdi gasi, 
  Sabo, taniabo, makhum dinbo siniu, 
  Chap ngam lakge, sibo namdi gasi. 
  Karingbo gu ariak ga pazan hamai.

