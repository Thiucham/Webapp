ID: "19"

Title: "RAPIU NIU DINBO WAN HAI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Rapiu niu dinbo wan hai wangtang sude, 
  Pabam machang padmide;
  Takum pawandi kali mide, 
  Tamiubo hai wangji sude; 
  Rapiu tu malum khai sulo.

CH: |
  (Chorus)
  He! Rapiu atu lungsalo, 
  I chariu magen thiuga; 
  Atu khakhaira mai hahjiu, 
  Rapiu atu majang khailo.

V2: |
  2. Hai kadih haira Noah ken ga kumjiu, 
  Rapiu tu phut kam mide; 
  Kadih ram wibo phiu maidung niu,
  Chamizai ga paliu ngutne, 
  Tingtheng chariu kheng bam sune.

V3: |
  3. Kakungbo tadrai mibo malum mainiu, 
  Atu nkhuanjiu bamme; 
  I niu chariu magenthiubo ga, 
  Atu khakhai ramai hajiu;
  I niu natu khuan bamme.

V4: |
  4. Aliu ringting hai chawan ramliang kumine, 
  Charapen kum kuimide; 
  Tadmibo wantu I mazuanjiu, 
  Lungsajiu kapjiu huibamdi, 
  Pawan hai malan wanglakge.

V5: |
  5. Kadih haiga ramnajiu lungbam liudi, 
  Tinggen ga aruang lanne; 
  I chariujiu tadbamliu tadi, 
  Jordan duise kenmak thenna, 
  Rapiu atu majang khailo.

