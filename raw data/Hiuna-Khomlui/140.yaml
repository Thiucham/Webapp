ID: "140"

Title: "I RING BAMBO LUNLUNG NIU"

Key: "G"

Time signature: "4/4"

CH-: |
  (Chorus)
  I ring bambo lunlung niu, 
  Jesu tu ngaodao sune, 
  Paniu wanglan bonai sai, 
  Patu ngaodao lansang jingne, 
  I ring bambo lunlung niu.

V1-: |
  1. Palunsi ri nga saijiu, 
  Lungsa juniu nui rim rim, 
  Atu lura wangsune, 
  Nuan niu phuibo kadih ga.

V2-: |
  2. Ahiuna siniu palad, 
  Masanbosi Chiulujiu, 
  Ahiuna si mathaye, 
  Pasi aleng ringbo ye.

V3-: |
  3. Pah wang lanbonai dasai, 
  I niu patu daosune, 
  Mathabo niu phuilujiu, 
  Rankhaipiu tu adaone.

V4-: |
  4. Rapiu Jesu tu kunglo, 
  Paniu dinbo lad piulo, 
  Paniu natu phung khangne, 
  Kawibo Tinggen ramga.

