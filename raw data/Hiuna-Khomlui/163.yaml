ID: "163"

Title: "HE! JESU NANG BENBO KUM"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! Jesu nang benbo kum aliudi, 
  Tingtheng jeng benbam raleng; 
  Pikhailo nangbiu benbosi aleng, 
  Zat hina niu natu thuanbam raleng.

CH: |
  (Chorus)
  Rapiu nang kendi tasi ye, 
  Chalui thiujiu thuan bamne, masan mai; 
  Mazadung niu thuanjiu bambo gasi, 
  I di thuanta makjiu thuan bamsune.

V2: |
  2. Tinggen dihga lungjiu bam miraleng, 
  Jesu niu chariu khengjiu; 
  Shaikhai bosi nang lukhai lakjiuma? 
  Patu malumlo tinggen jukhaine.

V3: |
  3. Kadih ga aliu lungjiu bamliudi, 
  Tinggen si aliu leng ye; 
  Naliu bamleng kadenra I tadne, 
  I bambo ga naliu tu 'luang wang-e.

