ID: "230"

Title: "CHAWANG TU LUNG KIUBOΝΑΙ"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Chawang tu lung kiubonai kabenbo ngao-e, 
  Bethlehem tu maning-e, rapen wibo penbam; 
  Chagan niu atu majang tadsai, 
  Bethlehem namdih gasi Chawang tu kahumne.

CH: |
  (Chorus)
  {Kulangbo ga, kulangbo ga, 
  Tingwang kendi jiu bamlo; (2x)}
  Amen Amen 
  Tingwang kendijiu bam lo, 
  {Amen. (3x)}

V2: |
  2. Bethlehem kilong dibosi wikachang nge, 
  Kadihri pabam machang, nangam niu phui mide; 
  Nangjan ganiu tinggen nah lungwang jiu, 
  Mary niu pamjiu bamme, Immanuel wangtu.

V3: |
  3. Christmas adaobo nai Bethlehem tu ning nge, 
  Ngaoni ye siboramsi Tinggen nah lungwang jiu; 
  Mazadung niu chunwi lui thiu-e, 
  Alung ga maning bamme, wadaodi mangailak.

