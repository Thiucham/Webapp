ID: "102"

Title: "RAPIU GU LUJAM"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rapiu lujam ga taten thiuramai ha, 
  Lujam hinasi manamkiu kam mide; 
  Tiusak nibo nai khiulan donjengniu, 
  Khan tiakbo niu Rapiu tu ma ngai kamde.

CH: |
  (Chorus)
  Rapiu niu kubo khuansi chiukhaimak kadihmai, 
  Phuilo Rapiu wanglan jimi rabode; 
  Malum mai hina Rapiu sai sui tadne, 
  Tinggen Jerusalem ga tingtheng lungne.

V2: |
  2. Tingwang gu kalen wibo daomai thiujiu, 
  Maikentiak nibo lungchun niu phut ngamlak; 
  Kadih lungchun niu Rapiu lad khamnam, 
  Rapiu gu lungpom tu kheng jiu bamrama?

V3: |
  3. Malum mai thiujiu Rapiu ten thiu khaimak, 
  Rasa dungdi malumjiu pingjiu bamme; 
  Kasamai kumjiu nang tad bam rama? 
  Wangjiu ringbo duipin gasi sak lulo.

