ID: "95"

Title: "KADIH RIGA LUNGWIJIU BAMLIU"

Key: "G"

Time signature: "6/8"

V1: |
  1. Kadih riga lungwijiu bamliu tadi, 
  Rapiu lengdi lungwi khaimak misai; 
  Hai kadihgu lungwibo haira, 
  Halan nuangmi rabo mikha kumme.

CH: |
  (Chorus)
  Tingwang ladniu pabam machang, 
  Tingkainiu hunwangbo kumjiu; 
  Nang leng aleng dinronjiu bamde, 
  Malum khaijiu palad dinron sukhe.

V2: |
  2. Wahina sijiu ningting bamliu tadi, 
  Rapiu tu simakjiu ningting maidung; 
  Ningting niu tinggen tad ngam lakge, 
  Jesu tu lukhaimai ronna tadne.

V3: |
  3. Ningting niu tingpok lam chaki thiu bamdi, 
  Siniu tingtheng lung ngamboki makge; 
  Jesu kendijiu wangbo naisai, 
  Chamai bensiam hina hamisune.

