ID: "178"

Title: "OH! A RAPIU LUNGSA KHAI KHELO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Oh! a Rapiu lungsa khai khelo, 
  I hai sansa thubo nuan mai ye, 
  A 'pui lon hai tamiu bibi ye, 
  Benbo biusi pikhai khelo.

CH: |
  (Chorus)
  Aphen maidung ra benboga bam, 
  Paliu chunwibo niu phuijiu bam, 
  Chunsajiu bambo hai aronna kumme, 
  Oh! Rapiu lung sakhai khelo.

V2: |
  2. Kadih pabam machang ga tad bamdi, 
  Tennibo ngam hina tenbamdi, 
  Akhu chunwibo haiwadi haye, 
  Aringting tamiu midmid le.

V3: |
  3. He! Rapiu Jesu nakhu gasu, 
  Pawan theng jiu ronmeng bamliudi, 
  Tuhoi napam ga malan wangde, 
  Ringbo duisi pisak khailo.

