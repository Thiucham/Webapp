ID: "90"

Title: "TINGWANG TEN THIURA"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tingwang ten thiura chamai tamme, 
  Tingwang tenleng maidi hadama? 
  Malan habo mijai gase, 
  Ka kengmai hiuna hakhai kammide.

CH: |
  (Chorus)
  He! chabon maidung yo Khrista lengniu, 
  Sikam kalak hamiramaitu; 
  Haramaitu phiumakge sai, 
  Tingwang suang ga dedin ralo? 
  Paliu zaimanse aliukhu kheng sune.

V2: |
  2. Tingwang ten thiura chamai tamme, 
  Nkhakhaira leng chamai phiu-e; 
  Nkhakhaira maihajiu ma? 
  Aliu Rapiu lunglak maitajiu ma?

V3: |
  3. Tingwang ten thiura chamai tamme, 
  Chawang Jesu niu natu kubamme;
  Harabo kadih chun hina, 
  Phutkhai lujiu Tingwang leng ten sukhe.

