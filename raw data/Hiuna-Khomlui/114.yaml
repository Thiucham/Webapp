ID: "114"

Title: "ZION LUANG NAI TINGGEN GANBIU"

Key: "G"

Time signature: "⚪"

V1: |
  1. Zion luang nai tinggen ganbiu, 
  Rapiu niu kasiambo; 
  Siga I wang tangbonai sai, 
  Chunwi rapen lune.

CH: |
  (Chorus)
  Siga wangtangra nkhuan bamme, 
  Zaipen niu liukhaibo zion ram; 
  He! debonai niu wangtang ralo? 
  A Rapiu bam naimik kiumakbo ram.

V2: |
  2. Jordan giugen ga chariujiu, 
  Rapiu tu thuan bamme; 
  Ganbiu genlam wibo ramsi, 
  Dedao niu ngaoralo?

V3: |
  3. Tuhoi tadkhe Zion nahmai, 
  Canaan ramwibo ga; 
  I lungbo tamiubo ramsi, 
  Saokhai kalang niye.

V4: |
  4. Chariga tanbo Immanuel, 
  Sibo ram tang dasai; 
  Lungsha khaibo phaisi benjiu, 
  Patu thuan jiu bamne.

