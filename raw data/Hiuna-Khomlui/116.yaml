ID: "116"

Title: "I MATHA NE TINGGEN AKI"

Key: "G"

Time signature: "3/2"

V1: |
  1. I mathane tinggen aki wangsai, 
  I achun wilui thiune, 
  I mathane tinggen aki wangsai, 
  I mathabo lui thiune.

CH: |
  (Chorus)
  Tinggen aki gara kabo pon maliang piulu, 
  Tinggen maza sang kai mainai, 
  I mathabo lui thiune.

V2: |
  2. Kadih ga aten hina loibonai, 
  I achunwi lui thiune, 
  Rapiu tu I wang ju ngao lusaira, 
  I mathabo lui thiune.

V3: |
  3. Alungchun niu tinggen aki tu ngao,
  Ben ranran bambo ki si, 
  Kachia niu thiubo ki wang lung dasai, 
  I mathabo lui thiune.

