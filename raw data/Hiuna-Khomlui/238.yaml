ID: "238"

Title: "TINGWANG NIU ADAM NAI EVE KHUGA"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Tingwang niu Adam nai Eve khuga, 
  Pikhaibo thoidamsi kum hai nia ga; 
  Benbo kikhun thiujiu, lungbam raleng, 
  Pikhailo nathoidam kawibosi.

CH: |
  (Chorus)
  Tingwangtu pingjiu lungbo kikhun thiulo, 
  Nangpao nangnai thuan thiujiu lungmilo; 
  Witing thuijiu lungbo kikhun thiura, 
  Nangthoi kawibo pilo, hainiaga.

V2: |
  2. Lungsabo niu nangnai ringting lung ga, 
  Tingwang tu machajiu lungbo thiulo; 
  Khat khattu kungjiu lungbam misulo, 
  Nangnai ringting ga Tingwang leng tenlo.

V3: |
  3. Chakhuang champao jiu Tingwang thuan thiulo, 
  Chunwibo kalensi lulo, thainai; 
  Matha malajiu patu sundaolo, 
  Thoidam pen niu ringthui bosi lulo.

