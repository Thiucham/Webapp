ID: "155"

Title: "RAPIU JESU WANGLAN"

Key: "E"

Time signature: "4/4"

V1: |
  1. Rapiu Jesu wanglan jimirade, 
  Maza sang, sang nai kamuang ga; 
  Kadih maidung kaden sulo, 
  Pah wanglan rabo de.

CH: |
  (Chorus)
  Kaden sulo lungsa maidung, 
  Tingtheng lakde, haibo dihai; 
  Paniu dinkhaibo hinasi, 
  Phuilo wang mirade.

V2: |
  2. Patu malum makmai hina sira, 
  Tingtheng wiboram ngao lakge; 
  Chariu kheng jiu kapbam liudi, 
  Lukhai lanbi lakge.

V3: |
  3. Tinggen Jerusalem namsan wibo, 
  Malum mai hinaniu ngaone; 
  Suanghabo rankhaibo luiniu, 
  Rapiu tu thuan bamne.

V4: |
  4. He dejiuwilo tinggen ram wisi, 
  Magenthiu chariubo hane; 
  Karingbo shing bang sung gase, 
  Thuanne, halleluyah.

