ID: "190"

Title: "TINGWANG GU BENSEM CHAMAI"

Key: "E"

Time signature: "6/8"

V1: |
  1. Tingwang gu bensem chamaina hai, 
  Shai raleng dam khaimakge, 
  Eden ga pao peh nianiu nuan tenbo jengniu, 
  Tingwang lungpom niu shaira siangde.

CH: |
  (Chorus)
  Aliu ringting tadui kum luangtad, 
  Tingkainiu hunthuan mibo singnui kum, 
  Karingting tad mahakam mide, 
  Malan wanglan rabo sao bamlo?

V2: |
  2. Karingting dunne tiubo silo, 
  Naikhat di bamjing makge, 
  Tingtheng lungrabo ki hai kadih ga haye, 
  Thingna kumjiu lenwang khaibo-e.

V3: |
  3. Benthuijiu ladren thiujiu bamdi, 
  Tiucham nuicham jiu bamdi, 
  Zit mengjiu man bambo mangkum kadih ringting. 
  He! delamlo, aliu ringting hai?

V4: |
  4. Kapjiu kubamdi wanglan makge, 
  Pui piu asingnah maitu, 
  Ramna nimakge, he! kadihri lung chun-ye, 
  Zuantad kam mide, Tingwang pamga.

