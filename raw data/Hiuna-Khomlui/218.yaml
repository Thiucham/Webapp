ID: "218"

Title: "NUANMAI JENGNIU"

Key: "⚪"

Time signature: "6/8"

V1: |
  1. Nuanmai jengniu Tingwang tu, 
  Calvary ga khengh khai ye; 
  Chamai nahpiu kadihri ga wang, 
  Maomeng hahbo Khrista tu cross riga, 
  Jusujiu khengh khai mide.

CH: |
  (Chorus)
  Tuhoide, nanuan hina kuak khairabo wansi, 
  Kalangjiu Rapiu ga wanglo, nang chuak lune; 
  Ladzan tingmik ga, 
  Nagah jumjiu kapjiu bamliudi; 
  Lukhai lanra leng ha-e.

V2: |
  2. A Piu I sakrabo piangsi, 
  Luthon khailo chiujiu kheng-e, 
  Chiujiu a chunmakjiu nachunbo thiulo; 
  Chiujiu Jesu dinne, maisuang hahbo 
  Khrista kasuang dui si, tazai thiujiu luangkiu-e.

V3: |
  3. Panahpiu pumlibosi, 
  Golgatha ga langkiu khaimide. 
  Jaokhiang duisi Patu pijiu, 
  Rapiu charisi kimmakge, 
  Paphi paben natri gen khaijiu Rapiu chariu dinngam lakge.

V4: |
  4. Cross rigasu Rapiu shenne, 
  Eloi, Eloi Lama SaBathani, tuhoi gasu nangnai l hai, 
  Paradise (Tinggen di ga) bam chammi rade, 
  Apiu paliu simak jiu tenbamme; 
  Paliu mao kuak khai bilo.

