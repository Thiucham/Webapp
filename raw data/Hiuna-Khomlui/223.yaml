ID: "223"

Title: "MALUANG KAKU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Maluang kakubo genlam I phui ngao, 
  A Rapiu tu singchai riga si; 
  Patu mikre mainiu kam chariu jiu khai,
  A Rapiu tu singchai ga maseng khai.

CH: |
  (Chorus)
  A Rapiu tu singchai ga maseng khai, 
  A Rapiu Jesu Cross riga senne;
  "He! apui yo, nangnah atu phuilo".

V2: |
  2. Patu mikre mai niu a Rapiu tu,
  Malong rilam a Rapiu tu jutad;
  A Rapiu chariubo alung chun ga,
  I shaibo tang jiu patu mangai lak.

V3: |
  3. Mania hina achung masim rim rim, 
  Kamuang tamiu kathi di malai-e;
  Chariubo kamuang tamiu kadihga,
  Naimik tamiu kadihri nchung nge.

