ID: "158"

Title: "RAPIU NIU LUNGSAJIU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Rapiu niu lungsajiu nuan phung maitu kubamme, 
  Malan hajiu ringbo pikhaine; 
  Rapiu cham chiukhai lujiu malumlu maidungsi, 
  Khrista nai lungchamne, tinggen ga; 
  He! phuilo, gerabo lujam minren kamde.

CH: |
  (Chorus)
  A Rapiu niu khom madui sune, 
  Malum maidung wang lungne, 
  Tinggendih wibo ga, 
  Rapiu ladpiu makmai kap sune.

V2: |
  2. Kadih tamiubo ram ga lungbam mai lunglilo, 
  Majad jiu wangsulo rimak ga; 
  Singna maidung yo, naleng thainaide pawansi, 
  Zuan wanglo Rapiu nkhon bamme.

V3: |
  3. Nuanleng jengniu Khrista tu singchai ga 
  Maseng khai, 
  Masanbo zai niu nuan kuak khaine. 
  Saokum mai hiuna ga mana san lumak gesai, 
  Dejiuga sansamai thiuralo.

