ID: "120"

Title: "JESU NIU DINNE"

Key: "G"

Time signature: "4/4"

CH-: |
  (Chorus)
  Jesu niu dinne, Ladriat kasan thiu-e. 
  Lungshabo naliu ga bamlo, 
  Kawibo Samariah maipiu niu tenbo kum. 
  Maihinatu nang ki ning mai thiulo.

V1-: |
  1. Masanbo ringting thiujiu lungbam raleng, 
  Jesu niu ku-e, chariujiu bam maidung, 
  Karingbo luk ra wanglanlo.

V2-: |
  2. Kawibo tenlo, Jesu chun wi raleng, 
  Tinggen kadih ga kadimai thiuraleng, 
  Lunglak maidung leng pipadlo.

V3-: |
  3. Jesu wangbonai tathuan luni saira, 
  Natu mikre maidung tu lungsa bilo, 
  Tinggen kadih ga wangtang mak thenna.

