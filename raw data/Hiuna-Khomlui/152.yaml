ID: "152"

Title: "PAMALANBO MAKE MUTKHAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Pamalanbo make mutkhai jisune, 
  Sibonai kadih haisi kalimine; 
  Kashai mai ringsune, kamalum maidung; 
  Oh! I kungbo nang kaden luma?

CH: |
  (Chorus)
  Aliu lunlung hai kalikammine, 
  Tingwang tu aliu daobonai; 
  Tingtheng lungrabo dih wangtang sai, 
  Tingwang tu majang chunwi bamne.

V2: |
  2. Pamalanbo make mutkhai jisune, 
  Kadih ga malaimai hina pingsune; 
  Kamasan maihina tinggen khang mine, 
  Chiudi kamaomai tu phutmine.

V3: |
  3. Pamalanbo make mutkhai jisune, 
  Kaden lumak maidungtu sazai pine; 
  Oh! ashai kariubo nang kaden luma? 
  Jesu wangsune tathu tiakra.

