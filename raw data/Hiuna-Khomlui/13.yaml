ID: "13"

Title: "TINGWANG NIU ATU KUNGJU"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Tingwang niu atu kungju lu jengniu, 
  Panahpiu tuse aleng pi ye;
  Kungbo duanniuye tiubo I se,
  Tingtheng jeng I thuan bamne Rapiu tu.

CH: |
  (Chorus)
  Maitu lungsabo I silude,
  Tuhoi malumde hiuna chamse;
  Tingtheng jeng I thuan bamne Rapiu tu.

V2: |
  2. Tazai niu atu ranlubo ngaode, 
  Dejiu suangha gulo palungsiat; 
  Atu ranpad khaide pazai niu,
  Tingtheng jeng I thuan bamne Rapiu tu.

V3: |
  3. Malumbo penniu ringbo I lude, 
  Rapiu wangbonai achun wine; 
  Atu lusune chiubo I si-e, 
  Achun wijiu pah nai tad cham sune.

