ID: "27"

Title: "HIUNA RASI MASILO JESU LENG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Hiuna rasi masilo Jesu leng. 
  Nakhu ga masi makge sai; 
  Ladren kakeng nangniu piubam tadi, 
  Nangleng tinggen ga chabam haye.

CH: |
  (Chorus)
  Hiuna rasi haira, 
  Lungsabo, mathabo, manaibo, 
  Khengsibo, njangbo, kawibo, 
  Malumbo, manuanbo, papum, 
  Thinriap lumai side.

V2: |
  2. Paniu lingkhaibo paniu gelanne, 
  Teringpum ga lingkhaiye sai; 
  Tering pum thiujiu gelan sang jingne, 
  Bible ga masanjiu raokhaiye.

V3: |
  3. Saokum mainiu hiuna ga ling khaisai, 
  Ringbo hiuna gelan sune; 
  Kawibo ten thiura matan khailo, 
  Simakbo wan ga gelan sune.

