ID: "176"

Title: "KADIH TINGLANG DUNBO GAHAI"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Kadih tinglang dunbo gahai, 
  Kadih gu wiga I lungde; 
  Tuhoi I wang-e, Napam ga, 
  Kuak khai khelo, amao hina.

CH: |
  (Chorus)
  A Rapiu niu atu kungbo, 
  Senruan bamne, kadih ga hai; 
  I dinronne, atu kungbo.

V2: |
  2. Lukhaide, chakin wibo ga; 
  Tingwang niu chunrang thiubo ga; 
  I ngut khaide, kadih chun ga, 
  Kuak khai khelo amao hina.

V3: |
  3. Aringting Rapiu niu pikhai, 
  Kadih chun hina thon khaide; 
  Piukhai khelo, naleng jeng niu, 
  Kuak khelo, amao hina.

