ID: "46"

Title: "KADIHRI HAI PHUI SULO"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Kadihri hai phui sulo nuan niu tamiu kammide, 
  Naringting gu don leng phui khaisulo; 
  Pawanra duiluang kum maikhat tudi khuan lakge, 
  Pamalan wangbo Rapiu Jesu khuga.

CH: |
  (Chorus)
  Wanglo singnahmai Rapiu niu natu ku-e, 
  Nahiuna se ring raleng ngut khaisulo;
  Rapiu niu naleng jengniu tinggen kham lekhaide, 
  Ngut khai sulo Rapiu Jesu ga.

V2: |
  2. Pawan sidi na wangde Rapiu niu wanglan raleng,
  Nangniu kaden simak jiu bamra khama; 
  Ringbo pirunse nalengdi daokhai niye sai,
  Ngut khai sulo Rapiu Jesu ga.

V3: |
  3. Khristen singnah maidung yo Jesu niu dinkhai bose,
  Nang manasan makgesai hami sune; 
  Nagu hiupuina se Jesu niu pi hah nimak, 
  Ngut khai sulo Rapiu niu ku-e.

