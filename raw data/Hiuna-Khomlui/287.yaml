ID: "287"

Title: "APUI KUMBO HAH"

Key: "⚪"

Time signature: "4/4"

V1: |
  1. Dejiu wilo, a Piu Tingwang niu kadambo, 
  Apui kura damkhai bamliubo hai; 
  Papui panah khat khattu kungjin bambo hai, 
  Tasibo ngam niu chamai tu phuikhai.

CH: |
  (Chorus)
  Chariubo nai mathabo ga ku-e, 
  Apui I mangiu khai pawan machang apui pamga, 
  Manang khaijiu jukhai apui tad hina ga, 
  Apui pamga I wa pingra hahde.

V2: |
  2. Pawan majatjiu tadwang sude, apui yo; 
  Tadmide, natinglang dunbo donniu; 
  Kadih tamiude; apui yo, ngao lanmakjiu; 
  Tingjing jiu rimrim mide, kadih hai.

V3: |
  3. Apui niu saodiakjiu I magen nah thiubam, 
  Kahuibo niu atinglang thiurama? 
  Maipuitu ngaosai apuitu makum tao-e, 
  Huita makge, apuitu naimachang.

V4: |
  4. Singrian, duithuak, 'lumeng npui luan hinaga, 
  Makum dasai alung chun niu ngaobam; 
  Majang lungjiu bam pakhu pajiunah tu, 
  Adiu wibamme, apui yo, na sailam.

