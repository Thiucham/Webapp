ID: "84"

Title: "HALLELUYAH AMEN, HALLELUYAH"

Key: "B"

Time signature: "6/4"

V1: |
  1. Halleluyah Amen, Halleluyah Tingwang. 
  Hamirade, haibo dih hai. 
  Mikremai niu tenkhaibo we; 
  Aliu sai mari lan dulo.

CH: |
  (Chorus)
  Wanglo, lungsa maidung yo; 
  Aliu sailam mari dukhe. 
  Aliu pum hai hawang dasai, 
  Kadih hai saodiakne.

V2: |
  2. Wanglo, singnah maidung; 
  Mathiuna wang khai lo. 
  Aliu lung chariu khai dukhe. 
  Hiuna chariubo maidungra, 
  Karingting haidi dun miye.

V3: |
  3. Wahina kangambo tinggen, 
  Wang ronna nge. 
  Jitalo, akamaidung yo. 
  Tuhoi aliu chariu liu di; 
  Tinggen lam mathabo thiune.

Translation: "(Halleluyah Amen, Halleluyah)"

Category: "Melodious praises"

