ID: "82"

Title: "RANKHAIPIU KHUAN NIU ALUNG MATHA YE"

Key: "AB"

Time signature: "3/2"

V1: |
  1. Rankhaipiu khuan niu alung matha ye. 
  Tadui luang kumjiu mazuan kiu mide. 
  Khrista shaikhaibo kawibo pen niu, 
  I hai ring bamme.

CH: |
  (Chorus)
  Tinggen lam rankhaibo luise thiujiu, 
  Mathabo lui niu tadui luang kumjiu,
  Rapiu leng jengniu matha lui thiujiu. 
  Mathajiu adao ne.

V2: |
  2. Rankhaibopiu niu kubo khuan chiu ye. 
  Tinggen lam atu khumki ga wangra; 
  Nalungsa pen niu wakhambo hajiu, 
  I wangdi, Jesu.

V3: |
  3. Jesu niu lungsabo malan thiumak. 
  Lungchariu maileng ringbo pikhai ye. 
  Nalungsa pen niu kuak khailo, Rapiu; 
  Lungsabo Jesu.

Translation: "(Excited by the Redeemer's voice)"

Category: "Melodious praises"

