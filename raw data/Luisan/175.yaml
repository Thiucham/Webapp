ID: "175"

Title: "TINGTHENG DIH DAMPAO JEHOVAH"

Key: "E"

Time signature: "2/4"

V1: |
  1. Tingtheng dih dampao Jehovah. 
  Tingwang nalungsa hai diye. 
  Aruang khai lujiu ramnabo; 
  Kapbo nuibo kadih cheng nge.

CH: |
  (Chorus)
  Lungsabo singnah maidung, 
  Thainaira ramna rabowe. 
  Naliu mangwilo, tiu kanui khai, 
  Salam, Salam Tingwang jan ga.

V2: |
  2. Tacheng tadbo puiga tadlo; 
  Ramnabo lad dinsubo ga. 
  Alungchun ga kap amun nui, 
  Detiu ralo kadih cheng nge.

V3: |
  3. Ramnara leng pawan wangde. 
  Ting kadih niu nchung jiu bam; 
  Tingwang khuga khatniu khatleng. 
  Khengjiu bam khe, pawan machang.

Translation: "(Jehovah the creator)"

Category: "Farewell"

