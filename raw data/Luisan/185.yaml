ID: "185"

Title: "AKAHMAI DUNG RAMNA SUKHE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Akahmai dung ramna sukhe. 
  Tingwang niu lungsa khai jiu; 
  Aliu ngao-dao lanmak thenna, 
  A Rapiu niu luang bamlo.

V2: |
  2. Akahmai nai ramna lanra, 
  Tingbang benpad lan sude. 
  Ramna raleng benthui sukhe; 
  A maningmai ngen khailo.

V3: |
  3. Aliu ramnara maning sai,
  Tingbang tamiubo kumme. 
  Aliudung ramna bamliudi, 
  Tingwang niu majang bamlo.

V4: |
  4. Aliu ramna jiu kap bamme. 
  Kadih tamiubo ramga. 
  Ramnabo lun ngaokhai lujiu, 
  Chunsa mikdui luang bamme.

Translation: "(Farewell friends)"

Category: "Farewell"

