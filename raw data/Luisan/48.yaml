ID: "48"

Title: "CANAN TANING"

Key: "C"

Time signature: "4/4"

V1: |
  1. Canan taning saronpen wi.
  Rom maidung niu kham lekhai bijiu. 
  Kadih tamiude, saronpen kao bijiu. 
  Puinahmai magen thiujiu magui mai ha; 
  Thiuniu makjiu saronpen tangh bijiu.

V2: |
  2. Saronpen wi tangh mibo sai, 
  Palungchun lam ten maidung khuga, 
  Lily niu penkhai paliu lung tamiu ga, 
  Paliu rihga nsuan ganbiu niu binwang, 
  Paliu khuga mathabo pen rim hunwang.

V3: |
  3. Saron rapen binwang lanlo; 
  Zeliangrong ram tamiubo gase. 
  Kamuang tamiu wang nge, rapen tu gomra. 
  Naimik niu padjiu nazu madu khai lo. 
  Kadih mai niu nangram wibo ngaora.

V4: |
  4. Canan taning saronpen wi; 
  Zeliangrong dih bon kasan lanlo. 
  Amanbam sune, nahmaidung hina niu. 
  Natu maningjiu hui ye, kadih mai niu. 
  Zeliangrong maidi natu thuan bamne.

V5: |
  5. Saron rapen tu I niye, 
  Tinggen dih ga wangbin bambo si. 
  Manaibo singbang ga kui khaibo piu tu. 
  Wanglan sune, chamai kendi bamra leng. 
  Khouring nai chamai chari thiu lanlak.

Translation: "(The valley of Canan)"

Category: "Melodious praises"

