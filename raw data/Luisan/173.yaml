ID: "173"

Title: "KADIH TING JINGBONAI AKAHMAI TU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Kadih ting jingbonai akahmai tu, 
  sailam mari jiu phuiwang nge. 
  Chunsabo mikdui luangbo naisai, 
  Achun mathara leng haye;

CH: |
  (Chorus)
  Oh! kadih hai ramnabo dih ye. 
  Akahmai chunshajiu bam ga; 
  Tinggen makhouna kumme sai. 
  Sibo ram ga I di lemwang niye.

V2: |
  2. Achunsha jiu I kapbambo naise, 
  Alung matha khaira maiha; 
  Akamai niu ramna khaibo nai, 
  Kadih piri tingjing mide.

V3: |
  3. Tinggen makhouna se lemkiu khailo; 
  Alung chariu piha khailo. 
  Chunsha jiu ramna khaimai tuse, 
  Tinggen ram ga adao lanne.

Translation: "(On the darkening day)"

Category: "Farewell"

