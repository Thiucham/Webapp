ID: "29"

Title: "KADIHMAI CHENGSA PHUNG PIU"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kadihmai chengsa phungpiu tu, 
  Tamiubo ri niu min de.
  Masanmai nai a Rapiu tu, 
  Detiu ra leng maning khai lo. 
  A Rapiu kathiu khengbo, 
  I niu dinsi lu lakge.

V2: |
  2. I niu maning nge, namdih gxa; 
  Hossana tiubambo se.
  Thiu-kaniujiu bam maidung tu, 
  Kawibo malan khaibo piu, 
  He! thiu ye, chengsa don niu. 
  Mathabo niu thuankiu ye.

V3: |
  3. I niu alungga masenbo, 
  Alung matha khaibo piu.
  He! shai ye, Calvary luangga 
  Zion nahmai magenthiujiu, 
  Paliu lung kamuang niu gom; 
  Kuilan rabo leng hade.

V4: |
  4. Kana ga tanou aruangbo, 
  Maning nge, mathabo ting.
  Charapen kumjiu kui mide, 
  Nagu kawibo se kuijiu, 
  Galilee ga nang bambo, 
  Debo nai niu ngaoralo?

V5: |
  5. He! Simon Peter nai Martha; 
  He! shai de, Rankhaibopiu, 
  Ruan bambo Canan ram nchung. 
  Namdi nai kahukil lungse, 
  Detiujiu ngou chia ralo? 
  Rankhaipiu ruan bambo ram.

V6: |
  6. He! thiu ye, thiu kachang len ne; 
  Magenthiubo Canan ram. 
  Kheng ta makge, magenthiubo; 
  Simon niu dinkhaibo dungse, 
  Akhuga wangtang khaijiu, 
  I arai lenglu lakge.

V7: |
  7. Tuhoira, he! Rankhaipiu, 
  Na-tinggen ram wang dasai. 
  Tathu pirun tu mangaijiu, 
  Na maken dibo pirunse, 
  Run lusai aliudung tu, 
  Phui khailo, masanmai nai.

Translation: "(Yoking the sins of all)"

Category: "Passion week/ Good friday"

