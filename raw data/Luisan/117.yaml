ID: "117"

Title: "KADIH KEN HAI WATHENG LAKDE"

Key: "G "

Time signature: "4/4"

V1: |
  1. Kadih ken hai watheng lakde, pawan hade. 
  He! tachengsa ga bam maidung se. 
  Kadih lungchun ga bam maidung yo, 
  Mari wanglo, Rapiu ga.

CH: |
  (Chorus)
  He! kadih rapen masen bammai, 
  Tingtheng jeng amanrabo lengse. 
  Saodiaklo maning lan makra, he! Singna, Rapiu ga ramgunjiu bamkhe.

V2: |
  2. Tuhoira wangrabo lunglung tu simakjiu, 
  Dinbo ladtu wajeng thiumakmai. 
  Chunrang thiujiu dinbo piumak mai. 
  Magenthiubo kheng sune.

V3: |
  3. Kasabo tamiubo ruangga, hey a Rapiu! 
  Hiuna Masanbo niu thao benlo, 
  Chengsa hina madupad sune. 
  Siga nang shaibo sui ye.

Translation: "(Soon the world will fades)"

Category: "Message"

