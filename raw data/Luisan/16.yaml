ID: "16"

Title: "DAVID NAMDI WIBO KADIH GA"

Key: "G"

Time signature: "4/2"

V1: |
  1. David namdi wibo kadih ga, 
  Siga kabuiki ren khat bamme. 
  Palung ga Rapiu tu mana khai, 
  Ningting maidung niu kahum milo.

CH: |
  (Chorus)
  Ring nga de, ring nga de, 
  Tinggen wang mana jiu ring nga de. 
  Thuanbo khuan niu kawan chia milo.
  Kawan milo, tinggendih tangjiu.

V2: |
  2. Bethlehem agimanai milo;
  Milipoina bambo bam gase, 
  Pabam ga mazadung dendi jiu, 
  Rapiu tu manabo dinkhai ye.

V3: |
  3. Ningting maidung niu dinkhai lujiu.
  Ganbiu tu ngou lujiu wang mide. 
  Kabuiki ga jibam ngenah si, 
  Mathajiu Rapiu tu wang kahum.

V4: |
  4. Tinggen ganbiu tu phuikhai lujiu, 
  Karaidao kasi maidung wang nge. 
  Bethlehem namdi ga wang mide. 
  Chawang Khrista tu kahum raleng.

Translation: "(In that beautiful city of David)"

Category: "Christmas"

