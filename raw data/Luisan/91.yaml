ID: "91"

Title: "PAKAN SUNG KAWIBO GASE"

Key: "B"

Time signature: "4/4"

V1: |
  1. Pakan sung kawibo gase, 
  Rankhai maidung niu sao bamne. 
  Paliu tingtheng ringbo ngao dasai, 
  Mathajiu bennai bam sune.

CH: |
  (Chorus)
  Lungsune, siramga lungphu ne. 
  Lungsasibo piu tu thuanjiu. 
  Tingtheng paliu mathajiu bamne. 
  Pakan sung kawibo gase.

V2: |
  2. Pakan sung kawibo gase, 
  Magen kathiubo ha sune. 
  Karingbo takhun ga khiu lujiu. 
  Kabun suangdi kaa bam sune.

V3: |
  3. Pakan sung kawibo gase, 
  Kapbo, magenthiubo hade. 
  Kasabo nai kahiambo ri se. 
  Bam lakge, namdih wibo ga.

V4: |
  4. He! wibo ram ga lung maidung, 
  Kadih magenthiubo khenglak. 
  Tinggen tara khuan wibo jujiu. 
  Kalen ken kawi thiu bamne.

Translation: "(Under His wing)"

Category: "Aspiration for Heaven"

