ID: "4"

Title: "MASANBO RAM CHAWANG MANATU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Masanbo ram chawang mana tu 
  Tinggen ganbiu niu zuan wang nge,
  Kasimai Patu zuan tadbo ga 
  Chagan tu I ngou we.
  I di ganbiu benbo saisui lusai;
  Chawang manabo Bethlehem wangtang ne.

CH: |
  (Chorus)
  He! Bethlehem I wangtang makthen. 
  Soumakjiu I tad ne.
  Nnien ganbiu niu atu majang bam. 
  Mary pam ga ngenah ju I wang ngoune.

V2: |
  2. Tuhoi Salem kamun kadibo, 
  Aliu dungleng lekhai lanne. 
  Tamiubo ram ga hami maidung 
  Tinggen lek lura leng, 
  Matha khe chawang kasan mana de.
  Kadih hai tingtheng lui wibo niu chiallo.

V3: |
  3. Tingwang tu thuan lakra soulo?
  Tinggen masan maidung niu zuan wang. 
  Chawang tu huijiu tinggen lede. 
  Kapjiu kadih phui ye. 
  Tinggen lam ganbiuse tu zuan wangjiu, 
  Masanbo Bethehem luang wangtang mide.

V4: |
  4. Tuhoi sujiu tadsu dakhe; 
  Charam kawibo lam zuan raleng, 
  Kadih wang niu mikre bam liudi; 
  Chamainah dung niudi;
  I ra amaning nge, a wangpiu tu,
  Wibo ram gadi paniu luang bam raleng.

Translation: "(The Holy land)"

Category: "Christmas"

