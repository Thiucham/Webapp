ID: "28"

Title: "CHARIUBO RAM TAMIUBO KADIH GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Chariubo ram tamiubo kadih ga,
  He! Jesu chariu khengh khai dia ye. 
  He! wibo ramse phutkhai lujiu,
  He! kadih maileng jeng gasu khengh khai.

CH: |
  (Chorus)
  He! Calvary luangga changiu jam phungjiu chariubo. 
  Pazai manne nuan kaphungmai tu rankhaibo. 
  He! masanbo zai luangbo se, 
  Tamiu ramtu kendasai wibo ram ga wang ne.

V2: |
  2. Dibo tingmik wangra khuan bambo se. 
  He! Pah shairabo singchai ponjiu, 
  Calvary luang lam zuantad mide. 
  Patulep ga changiu jam phung khaide.

V3: |
  3. Rankhaibopiu shairabo luang rihga. 
  Maidung wang maduijiu phui bamme. 
  Lungsa maidung kapjiu hui bamme. 
  Kadih maitu phuijiu chalad senkiu.

V4: |
  4. Singchai ga khengbo Jesu ronna nge; 
  Phuikhai makjiu makhum kiu mide. 
  He! Simon Peter masai mide.
  He! Jehudi ben ga pikhai mide.

Translation: "(In the world of darkness)"

Category: "Passion week/ Good friday"

