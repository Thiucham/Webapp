ID: "78"

Title: "CHALUI WIRA ALENG HA YE"

Key: "C"

Time signature: "4/4"

V1: |
  1. Chalui wira aleng ha ye, 
  Haibo dih gara. 
  Khrista aleng shaikhaibo se, 
  Alui wira leng nge.

CH: |
  (Chorus)
  He! alui wikachangbo Khrista ye. 
  Kahiambo nai chariubo ga, 
  Arengdi nai I masenbo nang nge.

V2: |
  2. Kadihri lui wibo sera, 
  Kuilan rabo we. 
  Khrista tu thuanbo lui sera, 
  Kuilanbo thiu makge.

V3: |
  3. Magenthiujiu kap bam gadi, 
  Achunwibo nang. 
  Masenra leng kaki ha ye, 
  Khrista tuse makjiu.

V4: |
  4. David lengdi rengdi nang nge. 
  Gukhaibo nang nge. 
  I di nangtu rengdi thiune; 
  A Rapiu Jesu tu.

Translation: "(No more pleasing song)"

Category: "Melodious praises"

