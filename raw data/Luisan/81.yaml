ID: "81"

Title: "RINGBO TINGWANG TINGTHENG RINGBO PIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Ringbo Tingwang tingtheng ringbo piu. 
  Nangra ngaokam sikambo Piu we. 
  I nakhugasu diutadbo hai, 
  Mathabo ringtingse ngao makge.

CH: |
  (Chorus)
  He! lungsasibo a Rapiu; 
  Thainai tingmik hai nakhuga, 
  Malan wang nge, atu lukhailo. 
  Aringting bamthen naleng thiune.

V2: |
  2. Kadih wi tu lungsabo jengniu. 
  Nuan niu atu majang jiu lung nge. 
  Lungsabo khuan niu kubo chiujiu, 
  Malan wanglo, lungsa maidung yo.

V3: |
  3. Ronmeng mibo kum aringting hai, 
  Rapiu gasu diutad bam ga hai, 
  Apuilon hai tamiubo niu phui. 
  Tinggen naimikbiu binwang lanlo.

V4: |
  4. Pawan wibo si tadtom mide. 
  Rapen kuibo kumjiu kui mide. 
  I hui bamdi wanglan bi lak ge; 
  Tad diu mide, lungsabo wanse.

Translation: "(Living God of eternal)"

Category: "Melodious praises"

