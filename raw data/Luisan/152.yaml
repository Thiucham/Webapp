ID: "152"

Title: "HAMILO, KADIH CHARIUBO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Hamilo, kadih chariubo; 
  Akamaih tu ramnabo se. 
  Thiuniu jiu lung magen thiumai, 
  Tingtheng amanra malan wanglo.

CH: |
  (Chorus)
  Lung magen thiubo bamlakge.
  A Rapiu lungbo ramga se. 
  Kadih chariu khenglan lakge. 
  A hiupuina mathak ra tadlo.

V2: |
  2. Maning bamlo, I wanglan ra; 
  Pawan naih Pating nawangde. 
  Kadih mania kali sune, 
  Zuanlo a Rapiu natu ku we.

V3: |
  3. Aka maidung naih mathajiu, 
  Zion a Rapiu tu thuankhe. 
  A Rapiu atu rankhai jiu, 
  luang ngutkhai khelo, tinggen ramga.

V4: |
  4. Kadihri ga lung chariumai. 
  Zion a Rapiu tu thuanlo, 
  Pazai siniu khiu masan mai: 
  Achun wi ye, tiujiu thuan bamkhe.

Translation: "(Let there be no trouble)"

Category: "Heaven nature"

