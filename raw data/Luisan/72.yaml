ID: "72"

Title: "TINGGEN JERUSALEM KASAN"

Key: "D"

Time signature: "2/4"

V1: |
  1. Tinggen Jerusalem kasan. 
  Tinggen masan maidung ki ye. 
  Siga Immanuel niu ladjan thiu bamme. 
  Maningjiu zuanwang nge, Zion ram tuse.

CH: |
  (Chorus)
  Haibo kadih suang amanne, tinggen ramse, 
  Tingmik, chahiu, takum machang. 
  Chamai kengbi biye. 
  Zion luang rihga Milipoi tu thuanbo lui thiu ye.

V2: |
  2. Immanuel najai siniu. 
  Atingtheng lui wibo thiune. 
  Masanbo ramga wangtangsai I niu thiu ne. 
  A Rapiu ringlan sing pense I ngao ne.

V3: |
  3. He! Gukhaipiu Halleluyah:
  Charam hinase nagu we. 
  Najai niu atu khiu khaijiu I nagu we. 
  Thuan bamne, Chariubo Zion luang hangga.

V4: |
  4. Wangra dama, He! a Rapiu?
  Kadih chariubo niu gomnam. 
  Canan ram nai nalunse maning ta lak ge. 
  Ating loisai masanbo ramga bamne.

Translation: "(The new Jerusalem)"

Category: "Melodious praises"

