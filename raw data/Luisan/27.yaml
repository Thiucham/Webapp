ID: "27"

Title: "KADIH PHAI KUM JIU KUIMIBOGA"

Key: "DB"

Time signature: "4/4"

V1: |
  1. Kadih phai kum jiu kuimibo ga. 
  A Rapiu Jesu nang wang lanlo. 
  Calvary ga nang chariu khengh khaibo; 
  Zat hina niu Nang tu mangai kiu de.

CH: |
  (Chorus)
  He! magenthiujiu khengh khai mibo nai, 
  Calvary ga Na jai luangkhaibo, 
  Maningsao makge, Calvary tu 
  Khengh khai mibose I niu mangai lakge.

V2: |
  2. Kadih mathabo kuiwang mijiu, 
  Calvary mathabo thiu bamne. 
  Puitad kameng maidung napen gasu; 
  Mathajiu bamne, he! Najai pen niu.

V3: |
  3. Tadrai maidung ra a Rapiu ga, 
  Matha malajiu chunwi bamme. 
  Paliu bam charapen rim wibo niu, 
  Luangchia khaijiu, he! nang tingtheng ramga.

V4: |
  4. Khengh khaibo jamse phung maidung niu, 
  Zion luang wibo ga chap bamne. 
  Mangai lakge, chariu khengh khaibo lun, 
  Pajamse phuijiu dinkam lulakge.

Translation: "(While fading so soon)"

Category: "Passion week/ Good friday"

