ID: "104"

Title: "NKHUAN BAMME ZION NAMSAN WI"

Key: "B"

Time signature: "2/4"

V1: |
  1. Nkhuan bamme Zion namsan wi; 
  Chawang kendibo tinggen. 
  I maningjiu machun bamme, 
  Kadih chariubo saojiu.

CH: |
  (Chorus)
  He! namsan wibo benbo ram. 
  Chawang ramwibo ngao niye. 
  Saomakjiu akhuga bamlo, 
  Saomakjiu atu majanglo.

V2: |
  2. Napi rihga lem kajit bambo, 
  Ten chariuboram gasu. 
  Shaibo luangbut ga I bamme. 
  Tingtheng ringbo ram zuanjiu.

V3: |
  3. Ringbo piu nang kadih tu phuilo, 
  Chariubo muang niu gombam. 
  Kadih chariu maningjiu kap; 
  Chawang dihga mathane.

V4: |
  4. Atu gukhailo, He! a Rapiu, 
  Shaibo naisai mathara. 
  Lungsa siniu masan khailo. 
  Zion ramtu zuan sukhe.

Translation: "(Awaiting the beautiful Zion)"

Category: "Aspiration for Heaven "

