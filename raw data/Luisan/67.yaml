ID: "67"

Title: "I NAKI LENG THIUNE"

Key: "E"

Time signature: "4/4"

V1: |
  1. I naki leng thiune. Amanbo nai wibo. 
  Nahiupuina leng tinggen lam; 
  Mariu charibo ha; Nagu tinggen ramga. 
  {Tingthenjiu kuimakbo ramme. (2x)}
  Mariu charibo ha; Nagu tinggen ramga. 
  Tingthenjiu kuimakbo ramme.

V2: |
  2. Sebo ramse I ra. Amang kumjiu ngao we. 
  Amanjiu kuimakbo ramse. 
  Tura ndiu tade, I maningbo ramse. 
  {Aleng amanboki thiu bam. (2x)}
  Tura ndiu tade, I maningbo ramse. 
  Aleng amanboki thiu bam.

V3: |
  3. Sebo ram maihina Wang lungrabo ramme,
  Nazareth Jesu lungbo ram:
  Sebo ramga lungmai, Tingthengjiu amanbam. 
  {Paniu lungsa khaibo donniu. (2x)}
  Sebo ramga lungmai, Tingthengjiu amanbam.
  Paniu lungsa khaibo donniu.

V4: |
  4. Siboram ki wi amanbo dinsi lakge, 
  Siga lung magenthiubo ha; 
  Chakhuan wijiu mathabo luise thiu bamne.
  {Kadihri mainah ngao daosai. (2x)}
  Chakhuan wijiu mathabo luise thiu bamne, 
  Kadihri mainah ngao daosai.

V5: |
  5. Wanglo asingnah mai naliu di wang suilo,
  Tadsukhe Zion ram zuanjiu,
  Rankhaipiu niu thiukhaibo ky ga lungra leng. 
  Kashai thiuniu makbo ramga,
  Shailan makjiu thiuniu makbo,
  Chariujiu kapingbo bam lakge siram ga, 
  Kapjiu mikdui luangbo hane.

Translation: "(I shall build for thee)"

Category: "Melodious praises"

