ID: "53"

Title: "ZION LUANGDI RIHGA SE"

Key: "A"

Time signature: "2/2"

V1: |
  1. Zion luangdi rihgase, 
  Kashai thiumakbo bamga, 
  Chari dibo Jesu niu, Ku ye, chiukhailo. 
  Chari thiumai riphen dung. 
  Naliu ripon piu sulo, 
  Charimai nawang sude. Chaheng ponsulo.

V2: |
  2. Wanglo, tachengsa maidung, 
  Ringrabo lung phung lujiu, 
  Narih tuse ngamra leng, Jesu ga wanglo. 
  Charaw lungga jengsum bam, 
  Shaibo rih tu ngam lujiu, 
  Paken nai pajan dijiu, Tinggen wang mide.

V3: |
  3. Kadihmai ju rao lujiu, 
  Tingwang janga mangam mai, 
  Chari thiu ga nbai mai, asai sui dulo.
  Papui-papiu saodiak jiu, 
  Shai maha leng pingmakjiu, 
  Masai marilan makmai, Asaisui wanglo.

V4: |
  4. Wanglo nuan kaphung maidung, 
  Tinggen dihga ngutra leng,
  Namen jijiu wangsulo. Jesu sai suira. 
  Ringbo bantu machunjiu, 
  Tingtheng ka amanbo ram; 
  Halakbo Tingwang ramga, Ngutra kadenlo.

Translation: "(On great Mt. Zion)"

Category: "Melodious praises"

