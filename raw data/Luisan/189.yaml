ID: "189"

Title: "JISULO LUNGSAMAI JISULO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jisulo lungsamai jisulo mathakjiu.
  Naimik kasan padlan makthen, 
  Ting kadih loibo khuan chiu dasaira, 
  Lungsa maidung nai bam aruang lanne.

CH: |
  (Chorus)
  Salam salam salam (3x) 
  Aliu ngaidao lan makthen 
  Tinggen ramga wangtang dasai, 
  Bamlak ge ramnabo salam.

V2: |
  2. He! lungsamai jisulo, jiju misulo; 
  Kapjiu mikdui luangbo hajiu, 
  Kadih ga lung magen thiubo hina, 
  Saokhai diakjiu mathakra jisulo.

V3: |
  3. Ramna khaide, nahmai kumjiu thiuniu dulo; 
  Mikdui luangbo charaw lungga, 
  Thiuniu makjiu apiu khulam zuanlo; 
  Kapjiu kahuibose bamlan lakge.

V4: |
  4. Tinggen ram wangdasai atu mangai mane. 
  Mikdui luangjiu lungsamai dung, 
  Naimik kiumibo kumjiu hamide. 
  Magen thiumai mikdui luang sao sulo.

Translation: "(Sleep, Oh! Sleep)"

Category: "Farewell"

