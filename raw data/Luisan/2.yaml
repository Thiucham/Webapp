ID: "2"

Title: "CHAMAI ZAT HINANIU THUANLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Chamai zat hina niu thuanlo,
  Thuanlo ngenah Rankhaipiu tu.
  Mathabo luisan thiulo,
  Thiulo, chakhu niu.

V2: |
  2. Thuanlo, thualo Rankhaipiu tu,
  Mana wang nge Bethlehem ga.
  Wangljiu phuilo ngenah tu,
  Khouring kuang lung ga.

V3: |
  3. Papui Mary niu papam ga,
  Pamme ngenah Rankhaipiu tu,
  Kasimai nai masanmai,
  Wangjiu kahumme.

V4: |
  4. Masanmai nai kasimai kum;
  Nang di tadlujiu kahumlo.
  Karingting wibo lung ga,
  Rankhaibo Piu tu.

V5: |
  5. Tinggen lam paken di bamlo;
  Kadihri ga pajan dilo;
  Ting-kadih ga di bam lo,
  Pajan tingtheng jiu.

Translation: "(Praise ye all nation)"

Category: "Christmas"

