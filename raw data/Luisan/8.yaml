ID: "8"

Title: "MATHAJIU THUANLO TINGGEN WANGTU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadih riga chawang maina kengbam liudi, 
  Chawang Khrista kumbo mana lumai haye 
  Tinggen Wang Bethlehem matomki ga mana, 
  Tingwang tu thuan raleng kadih mainah madui.

CH: |
  (Chorus)
  Mathajiu thuansukhe, tinggen wang tu thuanlo. 
  Ka manabo nai ye, mathiuna mathalo! 
  Tinggen wang kadibo pirun janra mana, 
  Tinggen masan mai nai aliu thuanjiu bam khe.

V2: |
  2. Tinggen lam masan mai thuanjiu mathalui thiu, 
  Siga milikhuanmai manam hang ga chiu yе. 
  Jesu manabo bamse palingjiu dinkhai, 
  Paliu gu mili phut lujiu wang kahumme.

V3: |
  3. Naimik padlamsu kasimai thao phungjiu wang, 
  Tingsangpui niu raijiu paliu majang wang nge, 
  Khouring kuang ga papui Mary niu pam bamme.
  Kakungbo gu hina pilujiu kahumme.

V4: |
  4. Chawang Herod sira palung magenthiu bam, 
  Kahum rabo kumjiu kasimai ga maniu. 
  Judea ran lungga nahmaidung tu kamshat bam, 
  Ngenah wang tu tinggen wang niu juring khai ye.

V5: |
  5. He! Jesu thai nai aliu khuga wanglanlo; 
  Wang kasan thiulanjiu tingtheng wang thiu lanlo; 
  Aben masan makdi Mary bense kumjiu, 
  Tingtheng natu thuan raleng takum wanglan ne.

Translation: "(Praise the king of heaven)"

Category: "Christmas"

