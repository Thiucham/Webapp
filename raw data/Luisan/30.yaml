ID: "30"

Title: "HE! WANGJIU THUANLO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Malum makbo maning daosai. 
  Alung pubo nai phiu ye sai. 
  Calvary ga wang ngao sune, 
  Aliu dung leng shai khaibopiu, ka mariapiu tu.

CH: |
  (Chorus)
  He! wangjiu thuanlo shaikhaibopiu tu. 
  Chariu maidung ladjan loijiu,
  Kadih nuan phung maha khai ye, 
  Phui kimlak piu niu.

V2: |
  2. Kuimibo tu majabo Piu, 
  Ntang mira majabo Piu, 
  Rommai riphen kasamai niu, 
  Kamshat raleng rejiu bamme. Tingtheng Rapiu tu.

V3: |
  3. Palung thiumai hina wanglo; 
  Rankhaipiu tu nkhara leng. 
  Akhu kawi siniu senjiu, 
  Thuan lujiu ramna khai sukhe, Rankhaibopiu tu.

V4: |
  4. A Rapiu tu minbo nai chun,
  A Rapiu shai khaibo nai chun.
  Mikdui luang soumakbo Piu se, 
  Sulan mibose ngao lujiu, kapta lan mide.

Translation: "(Oh! come and praise Him)"

Category: "Passion week/ Good friday"

