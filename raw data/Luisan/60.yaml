ID: "60"

Title: "PAKENDIBO TINGMIK"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Pakendibo tingmik nawangde. 
  Manaibo Wang nai ranpad maidung niu, 
  Tinggen lamsu nchom nai baja niu. 
  Atu ku ye, rankhai maidung niu.

CH: |
  (Chorus)
  Pakendibo tingmik; 
  Kaden bamlo ranpadra leng; 
  Chawang suangga chapra lengse, 
  A Rapiu ten hai ten bamkhe.

V2: |
  2. Karaidao Noah ringbo kense, 
  Maningtao jiu kasabo thuan milo. 
  Hakam sune, aliu lungbo kadih.
  Zat hina ranpadmai Jordon ken.

V3: |
  3. Kachia namdih ga wangtang dasai, 
  Siga aliu mathajiu aman ne. 
  Lung magenthiujiu kapbo bam lakge. 
  Ranpad mainahdung bam aruang ne.

V4: |
  4. Kadapad maidung maning bamlo; 
  Pakendibo ram wangtangbo naisai, 
  Chawang hina wang a Rapiu dibo. 
  Karingthen thuan bamkhe Khrista tu.

Translation: "(The day of his glory)"

Category: "Melodious praises"

