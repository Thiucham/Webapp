ID: "89"

Title: "MAGENTHIU JIU KAPBO RAMTU"

Key: "B"

Time signature: "4/4"

V1: |
  1. Magenthiu jiu kapbo ram tu, 
  Marenjiu amanbo ga bamne. 
  Zuanjiu tadne, tamiu liudi, 
  Atu jukhailo, kabenbo gase.

CH: |
  (Chorus)
  Npuiki tamiubo gasu, 
  I machunbo tu phuijiu tadne. 
  He! sibo ram kawibo ga matha bamne. 
  I karingting tu maning lan lakge.

V2: |
  2. He! kamathabo nazu se.
  I niu thuan bambo kuiwang mide. 
  Amaning maidung bambo ram. 
  Thenbo thiumakjiu bambo ram gase.

V3: |
  3. He! phuikhailo, rankhai maidung 
  Matha malajiu chalui thiu we. 
  A Rapiu damkhaibo Salem; 
  Lung kamasan maidung nai bam chamne.

V4: |
  4. Lungsa maidung sibo ramtu, 
  Zuanjiu tadkhe kabenbo ramlam 
  Tinggen masan maidung siniu, 
  Aliu bambo ramtu phuisao makge.

Translation: "(Land of weary and weeping)"

Category: "Melodious praises"

