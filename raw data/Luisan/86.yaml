ID: "86"

Title: "ALAD DIN NANG PIUMAK MIDE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Alad din nang piumak mide. 
  Adam dega bai maha gulo. 
  Alad ga masai khinjiu bam, 
  Kashai ram nang zuan mide.

CH: |
  (Chorus)
  I kubo khuan kinglo, Adam. 
  I kubo khuan kinglo, tuhoi Adam. 
  Nadon niu kadihmai maokam mide.

V2: |
  2. Apiu atu mangai dulo. 
  Kashaibo ramga lungjiu bamdi, 
  Nalad dan I maning taojiu, 
  Kapjiu I kahui bamme.

V3: |
  3. Alad din maningjiu bamsai, 
  Chunwi mathajiubam mi sune. 
  Tuhoi shaibo nai chariubo; 
  Thuankiu we, nasuang ga se.

V4: |
  4. Tingwang kubo Adam chiuye. 
  Chariubo niu alung phui mide. 
  A Rapiu atu re dulo. 
  Nang makjiu I baira ha.

Translation: "(Thou has disobeyed me)"

Category: "Melodious praises"

