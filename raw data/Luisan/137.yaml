ID: "137"

Title: "TU KASAN LUNGSAJIU AMANBO GA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Tu kasan lungsajiu amanbo ga,
  A Rapiu bam dibo. 
  Mathabo rapen kawi penbo se, 
  Kuilan mak rabo leng.

CH: |
  (Chorus)
  Aliu maduijiu aman bamne. 
  Tinggen lam masan mai nahdung nai, 
  Chariubo ramga kap bambose, 
  A Rapiu suangga bennai bamne.

V2: |
  2. I karingbo tinghai loimak thenna. 
  Aleng kamuang tamiu. 
  Amanbo ramse wangtang lu dasai; 
  Kadih tu maning lak.

V3: |
  3. Sibo namdih amanbo ram zuanjiu, 
  Kadih tu saodiak ne, 
  Tuh parim manam wibo manam de. 
  He! dejiu wi gulo.

V4: |
  4. Rankhaipiu zu I wang ngao lu dasai, 
  Pabam dibo rihga, 
  Ladjan thiune, rankhaimai mathara; 
  Halleluyah, Amen.

Translation: "(Our new heavenly home)"

Category: "Heaven nature"

