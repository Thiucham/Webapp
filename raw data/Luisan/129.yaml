ID: "129"

Title: "TINGWANG NIU ALIUTU LUNGSAJIU KUBAM"

Key: "F"

Time signature: "2/4"

V1: |
  1. Tingwang niu aliutu lungsajiu kubam; 
  Aliu Paten tenjiu bamra leng. 
  Jukhailo, nang niu rankhai maitu; 
  Aliu natu maningjiu kahumme.

CH: |
  (Chorus)
  He! Rapiu natu thuan bamme.
  Namaidung niu natu ku bamme.
  Chiukhailo, namai niu kubo khuan. 
  Tingtheng, tingthengjiu natu kahum ne.

V2: |
  2. Nang niu lungsabo aliu chabon dungtu, 
  Nkha khaira leng khuanjiu bamme. 
  Tamiubo dihga aliu bamthen. 
  Khakhaira leng maningjiu kahumme.

V3: |
  3. Ping mane, kungbo asingnah maidung yo. 
  Tenlo, khenglo, Pah niu kha khaine. 
  Chawan ramliang kumme, 'liu ringting. 
  Tadmibo wan se malan wang lakge.

Translation: "(God is calling us with love)"

Category: "Prayer"

