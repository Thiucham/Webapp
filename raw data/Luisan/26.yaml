ID: "26"

Title: "TACHENG SANIU BANG BAMBO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tachengsa niu bang bambo se, 
  Rankhaipiu niu khikhai. 
  Tathu pirunse runkhaijiu,
  Tajai luang maring jiu jutad, 
  Phaimiu ki hinaga, 
  Kasha daobo hina khenghjiu shaikhai.

CH: |
  (Chorus)
  He! tinggen wang se, 
  Chariubo hina khengh; 
  Israel mai nai kadih mai 
  Chawang dung ladjan thiusi sai, 
  Kendibo a Rapiu tu singchai ga,
  Ju sujiu gen lakge.

V2: |
  2. Maidung sui ye, duakshat raleng; 
  Chawangdibo kiga. 
  Tingwang magenthiu makhum kiu;
  Nuan phungmai leng apum pikhai, 
  Calvary singchai ga. 
  Pari maidung niu chunwijiu senbam

V3: |
  3. He! tinggen dihse kachin ne. 
  Chawang khum luraleng. 
  Chamai niu kapbo lui thiulo;
  Tadui luang kum mikdui luanglo: 
  Nthi di juwanglo. 
  Tinggen wang chariujiu shaibo naise.

V4: |
  4. Tachengsabo nai shaibo tu, 
  Ngamjiu sulan mide. 
  Shaibo don ga chariu maise, 
  Ringbo ram ga matha bamne, 
  Rankhaipiu pen niu. 
  Ringbo namdi amanbo lumide.

Translation: "(From the bondage of sin)"

Category: "Passion week/ Good friday"

