ID: "80"

Title: "DEJIU WILO JESU WUT HAI"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Dejiu wilo, Jesu wut hai. 
  Paniu dinbo cham phungjiu, 
  Pah dinbo kum amanra leng. 
  Patu I mangai lakge.

CH: |
  (Chorus)
  Jesu tu I niu malumjiu; 
  I niu si masan bamme. 
  Jesu, Jesu dibo Jesu; 
  Patu I mangai lakge.

V2: |
  2. Dejiu wilo, Jesu wut hai. 
  Pazai niu khiu masan khai. 
  Atu ku we, chalungsajiu, 
  Kawibo ram wangra leng.

V3: |
  3. Dejiu wilo, Jesu wut hai. 
  Pazai niu atu rankhai; 
  Tinggen lam tingtheng lung bamne. 
  Amanbo ram aleng nge.

Translation: "(How so sweet is Jesus)"

Category: "Melodious praises"

