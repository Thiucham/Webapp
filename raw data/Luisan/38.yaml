ID: "38"

Title: "KASARI DAOJIU TINGWANG NAHSE"

Key: "D"

Time signature: "2/4"

V1: |
  1. Kasa ri daojiu Tingwang nahse.
  Tathu pirun runra leng maningjiu. 
  Lungchariujiu papiu ga kheng, 
  Kasuangdui se tajai kum luang, Gethsamane ga.
  Israel mai pawang tu nimme.

CH: |
  (Chorus)
  Luni makge (2x) Israel mainiu luni mak, 
  Pariga kamaobo khaira. 
  Maidung ladjan thiu. 
  Pilate nang niu ladjan thiu lan lo.

V2: |
  2. Israel mai pawang tu jujiu 
  Calvary luang singchai ga gen mankhai. 
  Papui Mary lung magen thiu.
  Kawibo pen kuimibo si, palung magenthiu. 
  Tinggen maidung di magen thiu we.

V3: |
  3. Chariu we, charaw tamiubo ga. 
  A Rapiu Hiupuina tadbo naise, 
  Jerusalem kahuki ga, 
  Deng nambo phai phiekek mide, kathidi malai ye. 
  Masanbo Hiupuina wanglanlo.

V4: |
  4. Kasa rihngamjiu pating tangde; 
  Ting-kadih a Rapiu Khrista ramme. 
  Nuan rih ngamkhai Tingwang seniu 
  Masanbo zai niu liukhai Calvary luang gasu,
  Manai khai kamde, a Rapiu niu.

Translation: "(Evil against the son of God)"

Category: "Passion week/ Good friday"

