ID: "98"

Title: "MALUMJIU CALVARY LUANGRI GA"

Key: "C"

Time signature: "4/4"

V1: |
  1. Malumjiu Calvary luangrih ga. 
  Charam wibo namdih paken di ye. 
  Masanmai lungbo ram. (2x) 
  Tinggen ram ga I di lung dasai. 
  Ringbo tingg magen thiubo, 
  Atu gom lan lakge.(2x)

V2: |
  2. Atu gom nam lakbo I sijiu. 
  Halleluyah, a piu tu thuan bamne. 
  Atu rankhaibo se. (2x)
  Maikiam phungjiu kasa daobo ga, 
  Tazai seniu atu rankhai. 
  Manbo ram ga lungra. (2x)

V3: |
  3. Amanbo ga I di lung dasai, 
  Kadih chariubo tu phuijiu bamne. 
  I lungbo ramtuse. (2x)
  Sigase mikdui luang lan lage, 
  A Rapiu niu atu luangne. 
  Sailam maning lak ge. (2x)

V4: |
  4. A Rapiu tu maningjiu huibam; 
  Hiupuina naih kadih ramna dasai; 
  Apiu nai lung bamne. (2x)
  Pakan rihga atu khai lujiu. 
  Jordon giudui kasuak bamdi. 
  Atu luangken khai ne. (2x)

Translation: "(Faith on Calvary)"

Category: "Aspiration for Heaven "

