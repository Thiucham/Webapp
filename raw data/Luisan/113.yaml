ID: "113"

Title: "MOSI NIU CANAN RAM ZUANNE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Daa wan Mosi niu Canan ram zuanne. 
  Madu ngam mak Tingwang ladse phungjiu; 
  Canan ram nai Pakendibo tu se ngao,
  Maning lanjiu kapni makjiu ma?

CH: |
  (Chorus)
  I niu Canan ram wibo tuse, 
  Apumtan niu wangtang lulakge. 
  Karaidao Jehovah zai niu jukhai. 
  Canan ga wibo hina ngao sune.

V2: |
  2. Cana ram aben se ganbiu kumme. 
  Jukhai Mosi majang wangtang raleng. 
  Jordon giu gen lamse saokhai diak makjiu, 
  Lungsa maidung tu juken padkhai.

V3: |
  3. Achun wibo ramtuse maningjiu, 
  Chawang ram wibo tingtheng lungbo ram; 
  Siga wangdasai charam wibo lungga, 
  Maihina charapen kum penne.

V4: |
  4. Canan rapen nai nambam wibo ga, 
  Jukhai Mosi niu karingthen lungra. 
  Malum maidung salem kasan tu thuanne. 
  Maning khaijiu kapni makjiu ma?

Translation: "(Moses towards the Land of Canaan)"

Category: "Aspiration for Heaven "

