ID: "3"

Title: "A RAPIU MANA TING WANGLAN DE"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu mana ting wanglande; 
  Lung kamagen thiumai lung ju sune.
  Dinronlo, Bethlehem maluang rihga;
  Malumbo kan niu lemkenjiu.

CH: |
  (Chorus)
  He! a Rapiu nang niu atu jukhai lo. 
  Nangpui-piu tu maningjiu, 
  Ngenah wang kapbo ram tu maning nge.

V2: |
  2. Bethlehem chagan aben lanne; 
  Eden roukham lung aben lan bamme. 
  Rak sulo, Eden nam aben lanne, 
  Machunbo ram tu zuan sukhe.

V3: |
  3. I huiye, Bethlehem natu se,
  Ting-kadih thao aben chia kam mide. 
  Matomki ga a Rapiu chariubo; 
  Papui Mary niu pam bamme.

V4: |
  4. Aman chang nge, a Rapiu ram se, 
  Aleng Bethlehem luang aben lanne.
  Karaidou pou-pe niu ngaotang makbo, 
  Saronpen thuanra tad sukhe.

Translation: "(Christmas Season)"

Category: "Christmas"

