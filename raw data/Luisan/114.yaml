ID: "114"

Title: "WANGLO, CHAMAINAH DUNG"

Key: "AB"

Time signature: "2/2"

V1: |
  1. Wanglo, chamainah dung wanglo. 
  Damkhaibo Tingwang khuga. 
  Haibo chamse ringbo chamme;
  I phungwang nge, wang kinglo.

CH: |
  (Chorus)
  Hai ye, kawibo ringbo cham, 
  Hai ye, Hiupuina ringbo cham. 
  Tingwang nah Jesu Khrista niu, 
  Aliu dung leng pi khaiye.

V2: |
  2. Chara-chari khengbo hina, 
  Thon milo, pakhiangna se.
  Siniu wageng kara ha ye. 
  Siniu nang harabo we.

V3: |
  3. Ladjan thiura pating nade. 
  Majatjiu lungli sulo. 
  Karingbo ting hai loi dasai, 
  Wangsune, ladjan tingmik.

V4: |
  4. Ladjan thiuga maomak raleng, 
  Jesu ga ngutbo hai ye. 
  Hai ye, makjiu kaki ha ye. 
  Mai ring rabo Jesu we

V5: |
  5. Kiu sune, Chawang Khrista se, 
  Mazadung sangkai mai nai. 
  Hiupuina khomwang maduijiu. 
  Ladjan thiune, mathiu tu.

Translation: "(Come, Ye all People)"

Category: "Message"

