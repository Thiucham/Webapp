ID: "162"

Title: "KADIH RIGA AKAMAI TU"

Key: "A"

Time signature: "6/8"

V1: |
  1. Kadih riga akamai tu,
  Ramna kam rabowe. 
  Kathiu kaniubo daoliudi, 
  Lungsamai tu ngao sune.

CH: |
  (Chorus)
  Kawibo kachia namdih ga. 
  Ramnalakge, siram ga. 
  Salam thiujiu ramnabo,
  Lungsamai tu ngao sune.

V2: |
  2. Lungsa maidung ramna liudi, 
  Sailam ngaolan sune. 
  Tingwang niu majangkhai sune. 
  Aliu ngaodao lanmak then.

V3: |
  3. Welcome thiujiu ngaodao sune. 
  Lungsamai tu daone. 
  Lungsabo hai dinngam lakge. 
  Chunwi jiu aruang lanne.

V4: |
  4. Lungsamai naih bamcham lanne; 
  Ramnabo bamlakge. 
  Pabam khat ga bamcham lanne; 
  Lungsamai tu ngao sune.

Translation: "(Friends on earth)"

Category: "Heaven nature"

