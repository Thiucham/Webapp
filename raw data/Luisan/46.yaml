ID: "46"

Title: "ATU RANPIU SE CALVARY LUANGGA"

Key: "B"

Time signature: "4/4"

V1: |
  1. Atu Ranpiu se Calvary luangga, 
  Ngao khai lak maidung niu huam lujiu, 
  Kamshat rabo leng cross se pipon jiu, 
  Maluang lam julad achung suijiu.

CH: |
  (Chorus)
  Oh! thiu kachang nge, khengh khaibose. 
  Tazai luangbosi aleng ring ra; 
  Tathu pirunse kendibo leng nge. 
  Chalungsa ye tinggen milipoi.

V2: |
  2. Rankhaipiu tu Calvary luang gase, 
  Kamshatbo nai tinggen mai nchung. 
  Naimik niudi Pah chariu phui ngam mak. 
  Paju len ngam makjiu ta mide.

V3: |
  3. Rankhaipiu se Calvary luang gase, 
  Masengsu khaide, cross rih gase. 
  Rapiu khengh bosi I phui ngam mak ge. 
  Kathi  wangjiu tatu bah kamde.

Translation: "(My Redeemer on Calvary)"

Category: "Passion week/ Good friday"

