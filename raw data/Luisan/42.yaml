ID: "42"

Title: "HE! TINGWANG A RAPIU TINGWANG"

Key: "N/A"

Time signature: "3/4"

V1: |
  1. He! Tingwang a Rapiu Tingwang 
  Detiu atu soudiak gulo; 
  I singjiu nangsai sui wang nge. 
  Lungsajiu athoi lukhailo.

CH: |
  (Chorus)
  I kheng ka mangaibo bamma? 
  I singbo lungsajiu ngenlo; 
  Kadiu maitu I kulakge: 
  Nangmakjiu chalungsa raha.

V2: |
  2. Jaokhiang siniu aleng changmak, 
  Changiu duakbo di chang makge. 
  singchai riga najai luangkhai. 
  Siniu achengsa masanne.

V3: |
  3. Ariamathia ga munran piu, 
  Tingwang tu khuanjiu bambowe. 
  Pilate ga pingmakjiu tadlu; 
  A Rapiu pumse wang kheng nge

V4: |
  4. Riphen kai maidung ga maniu, 
  Joseph khengbo machangra leng. 
  Papumse phainoi niu domkhai. 
  Tatu raw ga phumkhai mide.

Translation: "(Oh! Lord my God)"

Category: "Passion week/ Good friday"

