ID: "41"

Title: "RANKHAIPIU TACHENGSA MAI DONNIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rankhaipiu tachengsa mai donniu, 
  Chariu khengh kadih ga. 
  Kadih mai nuan kuak rabo leng, 
  Singchai ga genman khai.

CH: |
  (Chorus)
  Ringbo wang kamasanbo piu, 
  Aleng khengh khai loide. 
  Lung kamagen thiubo hina; 
  Aliu tu rankhaide.

V2: |
  2. Pah npuiki se phuikhailo; 
  Calvary luang tangjiu. 
  A Rapiu sui ngam lulakge, 
  Tiu dinne, pakhommai.

V3: |
  3. Rankhaibopiu se charih ye, 
  Tiujiu senbambo ga, 
  Chamai kengjiu chiubam liu di; 
  Tadui pikhai makge.

V4: |
  4. Palung chariujiu singbam ga, 
  Nkha khaira maiha; 
  Panah maidung leng jeng gasu, 
  Kashaibo si ngaode.

Translation: "(Redeemer for sinners' sake)"

Category: "Passion week/ Good friday"

