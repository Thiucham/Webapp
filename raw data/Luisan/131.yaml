ID: "131"

Title: "I ZUAN WANG NGE, SALEM RAM TUSE"

Key: "G"

Time signature: "4/4"

V1: |
  1. I zuan wang nge, Salem ram tuse 
  Magenthiu makbo ramwibo. 
  Wangrabo leng ram gun bamme; 
  Kadih ga kawibo hajiu.

CH: |
  (Chorus)
  Magenthiubo niu khengh lulak, 
  I lung bambo kadih ga hai; 
  Tinggen wangtangbo naronna nge. 
  A Rapiu atu phutkhai diak dulo.

V2: |
  2. Tingtheng ringbo singbang sungga se. 
  Tinggen Masan maidung bamme. 
  Kahiambo niu asai suijiu. 
  Atu mangai dulo, Tingwang.

V3: |
  3. Ringbo Tingwang I zuan wang nge; 
  Chariubo kamuang niu tamiu. 
  Tinggen nai kadih kakga hai, 
  Nang makjiu wangtang lulak ge.

V4: |
  4. Asuang ga shaibo Jordon di nam; 
  Karingbo niu ben bambo ram; 
  Tinggen I wangtang lura leng, 
  Tingjingpui niu atu luanglo.

Translation: "(Towards Salem)"

Category: "Heaven nature"

