ID: "45"

Title: "NUAN MAIDUNG LENG CALVARY GA"

Key: "D"

Time signature: "2/4"

V1: |
  1. Nuan maidung leng Calvary ga pazai niu liu khai.
  Lungsamai yo, tuhoi wanglo. 
  Rapiu niu ringbo mathah pibam ga.

CH: |
  (Chorus)
  Jerusalem kisin gase, 
  Chabam kaden loikhai bam me.
  Malum mai niu siga wang lungne.

V2: |
  2. Rapture tingmik wangbo nai malum maitu lune. 
  Malum makmai kadih maitu, 
  Soudiak khaijiu chariu khengh bam sune.

V3: |
  3. Penticost nai Hiupuina niu haichiu dinkhai ye;
  Hiupuina ten luni makmai, 
  Rapiu Khrista wangbo tu ngao lakge.

Translation: "(For sinners at Calvary)"

Category: "Passion week/ Good friday"

