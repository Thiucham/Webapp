ID: "153"

Title: "DEJIU KUIJI GULO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Dejiu kuiji gulo, Aliu lungbambo kadiri hai. 
  Mathabo rapen kuirabo we. Aliu ramna lengse. 
  Tingmik kasan benpad lan sude. 
  Ramna makbo ramtu I maning nge.

CH: |
  (Chorus)
  Ramna makbo mainiu dinbo ram ga, 
  Lungsamai naih mathak bamne. 
  Alu luang Piu Khrista. 
  Rankhaibopiu mathabo suang ga. 
  Chariubo bam lakge.

V2: |
  2. Kadih piriga hai, magen thiumai kapjiu hui bamdi. 
  Chariubo genlam aman bamne. Atu gupiu Khrista, 
  Sai suijiu magen thiukhai maidung. 
  Sibo ramga allu naih lung bamne.

V3: |
  3. Mathabo rapen naih, Rankhaipiu Khrista lungbo ram se. 
  Nkhuan jiu naimachang maning nge. 
  Tinggen masan mai naih, Akamai ramna khaimi maitu: 
  Dedao niu aruang jiu matharalo.

V4: |
  4. He! asingnah maidung, a Piu ten thiura make maidung, 
  Pawan se nai machang tad bamme. 
  Nsuan ganbiu benbo; Wangkiu raleng pating nawang nge 
  Taten hai tenloi sai mathak bamne.

V5: |
  5. He! Tingwaang Rankhaipiu: Mathabo rapen wibo nang nge. 
  Kadih mathabo rapen nang nge. Naju kabenbo ga.
  Mathabo hinase lenkhailo. Mathabo Saronpen wibo nang nge.

Translation: "(How fast does it fades)"

Category: "Heaven nature"

