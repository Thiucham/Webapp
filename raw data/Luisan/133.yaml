ID: "133"

Title: "MASENBO RAM MANING TALAK"

Key: "C"

Time signature: "2/4"

V1: |
  1. Masenbo ram maning talak, 
  Chariubo genlam se. 
  Karingthen magenthiubo tu, 
  Marenne, kapbo ram.

CH: |
  (Chorus)
  Kadih magenthiubo hasai, 
  Kapbo tingmik di hane, 
  A Rapiu lun ngaolu dasai, 
  Maning lakge, kadih tu.

V2: |
  2. Calvary zai kungbo siniu, 
  Tinggen khamse lekhai. 
  Siga ngutlo, ahiupuina; 
  Paken dibo ramga.

V3: |
  3. Tamiu jiu kapbo ha dasai, 
  Jordon giugen lamse. 
  Kadih magenthiubo kensai,
  Kapbo ram maning lak.

V4: |
  4. Dedao suniu wangtang ralo? 
  Tinggen ram wibo ga. 
  Kadih tu ramna khai lujiu.
  Tadmide, tinggen lam.

Translation: "(The desirable land)"

Category: "Heaven nature"

