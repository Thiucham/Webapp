ID: "50"

Title: "I LUNGBO RAM KADIH HAITU"

Key: "EB"

Time signature: "4/4"

V1: |
  1. I lungbo ram kadih haitu, 
  Dedao niu I saodiak ralo? 
  Tinggen masan mai nai, 
  Tingwang zu ngaora khuan lulak.

CH: |
  (Chorus)
  Jerusalem zikdui Tingwang niu, 
  Chariubo khengh nge. 
  Siangkhaibo singchai rihga genkhai, 
  Tathu pirun naih.

V2: |
  2. Nang khneghbo, I dinkam lulak; 
  Lungsabo Tingwang Milipoi. 
  Bethlehem namdih ga mana khai, 
  Matomki gase.

V3: |
  3. A Rapiu tu maning talak, 
  Calvary ga khengh khaibo se. 
  Nang magen thiujiu chariu khenghbo, 
  I mangai lakge.

V4: |
  4. I mangai lak a Rapiu tu, 
  Aleng jeng gasu chariubo. 
  I shaibo tangjiu mangai lakge, 
  Rankhaibo piu tu.

Translation: "(The world that I live)"

Category: "Melodious praises"

