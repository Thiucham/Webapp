ID: "90"

Title: "TINGGEN MASAN MAI WANGLO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tinggen Masan mai wanglo, maning nge. 
  Alung tamiubo tu pi hakhailo. 
  Tamiubo kamuang niu atu gom nam. 
  Tinggen ram kawibo tu zuan bam ga.

CH: |
  (Chorus)
  He! a Rapiu nang aleng katana; 
  Karingbo takhun ne, a Rapiu.
  Pakendibo tinggen ram wibose.
  Nangniu aliu tu majangjiu bamlo.

V2: |
  2. Karaidao Eden rengga penkhai jiu, 
  I phiu ye, kadih tamiubo bam ga; 
  Calvary luang tu zuan tad lan mide. 
  Pende sanbo Salem wibo gase.

V3: |
  3. Kadih rapen chamainah kui mide. 
  Mathabo lui nai chakhuan chiu tade 
  He! a Rapiu nazu ra kui makge. 
  Tingtheng jeng penbam jiu matha bamne.

V4: |
  4. Najan ku dasai tamiubo hane. 
  Tinggen ram ga thuanbo lui thiu bamne. 
  Achunwibo niu dinsi lakge.
  Sizi niu aleng kabenbo ngaode.

Translation: "(Come, Holy Ghost)"

Category: "Melodious praises"

