ID: "112"

Title: "SINGGIU GEN WIBO"

Key: "C"

Time signature: "2/4"

V1: |
  1. Singgiu gen wibo ramga I wangsai, 
  Lungchariubo bamlan lakge. 
  Kadih chariubo tu maning lakge; 
  Chunwi mathajiu lung sune.

CH: |
  (Chorus)
  Mathabo tingmik saolan makjiu, 
  Aliu wangpiu jan tu, 
  Thuankiu jiu chalui thiu bamne.

V2: |
  2. Tinggen ram wibo ga akamai niu, 
  Aliu tu wangra khuan bamme. 
  Thingna kumjiu I di lemsi lusai, 
  Lemtad mine, salem ramga.

V3: |
  3. I di sibo ram witu ngao ni ye. 
  Chahiu-chagan rilam bammai, 
  Rapiu tu thuankiu jiu chalui thiu bam. 
  Sibo ruangga I bamni ye.

V4: |
  4. Kadih chariubo ramtu saodiakjiu, 
  Rapen niu wibo ram gase, 
  Tinggen mazadung nai I rontadjiu, 
  Sibo ram ga I bam sune.

Translation: "(The beautiful bank)"

Category: "Aspiration for Heaven "

