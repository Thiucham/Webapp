ID: "99"

Title: "HAWANGNGE, KADIH RINGBO"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Hawangnge, kadih ringbo, tinggen ramse nade, 
  I niu huijiu phui bamme, wangtang rabo ramtu. 
  Kadih tamiu bamliu di, Pakendibo ramse. 
  Nawangnge, Immanuel namdih wibose.

V2: |
  2. He! Jesu natu khuanne, Lungsamai dui di ye. 
  Kadih ga chariubo hai, tinggen lam wi leng nge. 
  Chariubo kadih ga chariudi Napen gasu. 
  Kendibo Immanuel, a Rapiu luangbam.

V3: |
  3. Tinggen ladjan thiupiu niu, lungsabo don gasu. 
  Chariujiu kapbo nuira, pikhaine, tinggen lam. 
  Ngao sune, napen gasu, tinggen ram wibo se. 
  Naimik kuimakbo ramme, tamiubo di ha.

V4: |
  4. Naopoupui-Naopoupiu lun ngaonibo kum I di. 
  Ngao ni ye, namdih se nai lungsapiu Tingwang lun. 
  Lurabo wangh pirun suang, maning kung nge pibo. 
  Aleng paken dithubo, Milipoi si ye.

V5: |
  5. Tinggen Wang lungsasipiu kadih pi mathak khai, 
  Lung chariubo dao liudi, aman khai lan sune, 
  Thuankiulo, a Rapiu se di kachangbo wang nge. 
  Aleng pipad khai mide, Salem namdih se.

Translation: "(Life lessen on earth)"

Category: "Aspiration for Heaven "

