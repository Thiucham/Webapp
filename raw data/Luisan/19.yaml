ID: "19"

Title: "PIPAD SULO, PIPAD SULO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tinggen lam Tingwang kadibo.
  Takum wan wangjiu majangkhai, 
  Paniu lungsa khaibo gasu, 
  Kawibo gu wang ngao lude.

CH: |
  (Chorus)
  Pipad sulo, pipad sulo. 
  Nagu kabambo hinase, 
  Tingwang Jesu tu 
  Thuanrabo leng, Amen.

V2: |
  2. Khrista pirun runrabo leng,
  Mathajiu aliu pamaidung 
  Thai nai naki kadi sung ga, 
  Wang bamme, nagu ngaora leng.

V3: |
  3. Tingwang jan ga nang pipadlo; 
  Painia nakha kumbo liu di. 
  Nahmaidung chuwibo gasu, 
  Tinggen lam naleng bam sune.

V4: |
  4. Chawang Khrista manabo nai, 
  Naten siji pipad sulo. 
  Nang niu pipadbo gu sera, 
  Wadao khatdi halan lak ge.

Translation: "(Give, Oh! give)"

Category: "Christmas"

