ID: "115"

Title: "KADIH PAWAN HAI LOI WANG NGE"

Key: "G"

Time signature: "6/4"

V1: |
  1. Kadih pawan hai loi wang nge. 
  Kawibo hinase. 
  Aleng wi nkiubo ha ye. 
  A Rapiu Jesu se makjiu. 
  Kadih ga wibose masen makge. 
  Wadaodi salan lakbo Zion ramse aleng nge.

CH: |
  (Chorus)
  Alengra Zion ram (2x)
  Aleng nge Paohubo niu kadenkhai Zion ramse.

V2: |
  2. A Rapiu se kumlan sune, 
  Masan maidung se nai. 
  Kadih riga mathiunah niu, 
  Pakendibo se ngao sune. 
  Kadih, naimik, chahiu-chagan hade. 
  Aleng salan lakbo Zion ramse kaden khaide.

V3: |
  3. A Rapiu khuanse chiu dasai, 
  Shaimi mai ringlanjiu; 
  Zat hina tu khom madui ne. 
  Mathiuna tu ladjan thiune, 
  Malum maihina dungtu luraleng, 
  Kuilan makjiu lungrabo Zion ramse aleng nge.

V4: |
  4. Chamai ringrabo ting hade. 
  Tadkam mide, pawan; 
  Kaden bamlo, nangdi tuhoi, 
  Kadih ramwi masen dulo. 
  Jijiu bambo hiuna naliu sulo. 
  Pawan, naimik hajiu matha bambo Zion ramga.

Translation: "(Earthly times are ending by)"

Category: "Message"

