ID: "174"

Title: "KADIH PIRIGU LUNLUNG HAI AMANG KUMME"

Key: "A"

Time signature: "2/4"

V1: |
  1. Kadih pirigu lunlung hai amang kumme.
   Atu dechiura lungwanglo, He! apiu yo; 
  Achi asingnah tu majang, 
  Kadih piri ten thiu aruang. 
  Chunwibo di chunshabo di wangsao makge.

V2: |
  2. Kadih pirigu ramnabo hai hamilo; 
  Tasing, tatu kum achun thiumak bamni ye. 
  Kulam kaina nai thingna dung, 
  Ramluang ga tathiu chakhou di,
  Ramna sikum chamainah di ramna bamme.

V3: |
  3. Aliu ramna ra maning mak, He! apui yo; 
  I alung that hai leng lulak, He! Apui yo. 
  Ramna jiu aliu bam tam-tam. 
  Bamdi aliu Tingwang ten thiucham khe. 
  Pasai aliu Tingwang suang ga wang aruangne.

Translation: "(Life of dreamland)"

Category: "Farewell"

