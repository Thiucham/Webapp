ID: "120"

Title: "KADIH RIGA HIUNA KHOMBO NGAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadih riga chariu jiu hiuna khom maidung, 
  Tinggen ram ga pabiu benne. 
  Pa pirun naimik suang benne.
  Tamiu lanmakbo ram gase.

CH: |
  (Chorus)
  Kachia namdi tangra nade, 
  Lungsa maidung. 
  Sibo ram ga wangtang dasai, 
  Nuan hinase bamlan lakge.

V2: |
  2. Tinggen ram ga kawibo bambo hinase. 
  Sibo wise din ngam lakge. 
  Nuan hina se ngamkam mide. 
  Sibo ram wibo ga lungne.

V3: |
  3. Tinggen ram ga kawibo hinase ngao ne. 
  Naikhat aliu adao lanne. 
  Salam thiujiu ramna lanlak, 
  Karingbo singbang sung gase.

V4: |
  4. Rapiu niu aliu bamleng kaden khaibo se. 
  Pathen-padiat dinsi lakge. 
  Wahina kam kasan lande; 
  Kaguangbo hina thon mide.

Translation: "(The mission on earth)"

Category: "Message"

