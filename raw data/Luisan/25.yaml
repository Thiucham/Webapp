ID: "25"

Title: "DEJIU MAGENTHIU GULO, RANKHAIPIU"

Key: "DB"

Time signature: "4/4"

V1: |
  1. Dejiu magenthiu gulo, Rankhaipiu, 
  Calvary luang lamse pi ngou khai suimak ge; 
  Kadih-mania niu alung phuikam mijiu.

CH: |
  (Chorus)
  He! nalung masan makmai, 
  Dekum masan ralo, nahiupuina makjiu; 
  Chariubo niu shaibo ga luang maha de.

V2: |
  2. Wang kam wikhailo tajai giudui ga,
  Chariujiu shaibo bam ga bam maidung tuse. 
  Jupad khai lanlo, ringbo tinggen puiga

V3: |
  3. Satan pumtan charapen kumjiu kui, 
  Namaidung lungga mathabo se phui bamme, 
  Naram kawibo bam ga wangtang raleng.

Translation: "(How agony is the Redeemer)"

Category: "Passion week/ Good friday"

