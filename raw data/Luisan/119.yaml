ID: "119"

Title: "TINGWANG NIU HAI TIUJIU DINKHAI YE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang niu hai tiujiu dinkhai ye; 
  A maidung khuga aki thiu khaine, 
  Sichiujiu paliu ruang ga I lungne. 
  Paliu rawang thiune.

CH: |
  (Chorus)
  Chara dung charawang nge, Rapiu.
  Agi ngjangbo wang. 
  Patu malum lumai hina niu. 
  Tingtheng ringbo lune.

V2: |
  2. Kadih ga chunrang thiujiu bammai, 
  Kadih gu winiu natu ran lulak, 
  Kashaibo tingmik niu nammi makga, 
  Jesu khu wang lulo.

V3: |
  3. Sadom nai Gomarra ken kumjiu; 
  Rapiu tu simak jiu lungbam maidung, 
  Lungniu sune, pah wang lanbo naisai, 
  Tuhoi wangkhai sulo.

V4: |
  4. Satan gu ngam niu kadih phui bam. 
  Siga kahakjiu lungbam maidung yo. 
  Napum, nahiuna kamshatjiu bammai, 
  Tuhoi malan wanglo.

Translation: "(God says so)"

Category: "Message"

