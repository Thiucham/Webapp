ID: "118"

Title: "HE! NUAN MAI NANG DEGA BAMLO?"

Key: "A"

Time signature: "4/4"

V1: |
  1. He! nuan mai nang tuhoi dega bamlo? 
  Nang karingting pawan bambo lungga, 
  Kadih rapen wibo ga lung lujiu, 
  Siji niu shaibo ga jukhai sune.

CH: |
  (Chorus)
  Nang mana sanra ye; 
  Pawan bambo lungga. 
  Hami maitu gukhaira khuan bamme. 
  Tuhoi majatjiu Pakhu wang sulo; 
  Na nuan dung hinase kuak khai sune.

V2: |
  2. He! nuan maidung tuhoi pawan bamga, 
  Lungli sulo, pawan hami sune. 
  Nahiuna singting tu lungsa ye sai; 
  Suannai chiujiu pawan dak bam talo.

V3: |
  3. Tuhoi wan hai rankhiabo pawan ne 
  Gukhaibo wan ga nang lukhai lakma? 
  Gukhai raleng tuhoi khuanjiu bamme. 
  He! nuan mai Jesu khuga wang sulo.

Translation: "(Oh! Sinner where are you?)"

Category: "Message"

