ID: "199"

Title: "PHUILO, JESU CANA NAMGA"

Key: "AB"

Time signature: "3/4"

V1: |
  1. Phuilo, Jesu Cana namga, 
  Magiangky ga wangjiu 
  Naopaoki tu nkha khaijiu. 
  Suan maitu lungsa khai.

V2: |
  2. Magiangbo ga mathiu matha; 
  Dejiu kha wi gulo? 
  Tadui tu darkha dui muikhai. 
  Maihina niu malum.

V3: |
  3. Thoidam khaibo tingmik thainai; 
  Jesu wangkhai bonai; 
  Tasihbo ten hai tenkhai ye. 
  Jesu dejiu ngam lo.

V4: |
  4. Cana ga magiangbo nai kum; 
  Nthai magiangbo ga, 
  Aliu tu matha majanglo. 
  Nagu thoidam pilo.

V5: |
  5. Naopaopiu nai naopaopui hai, 
  Na jan ga don wilo; 
  Ringting thengbo kikhun thiura. 
  Nang niu thoidam khailo.

Translation: "(Behold, Jesus at Cana)"

Category: "Special songs"

