ID: "164"

Title: "CHUNWI MATHABO BAMDI HAYE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Chunwi mathabo bamdi haye. 
  Chunwibo bam haye, kadih ga. 
  He! lungbambo ram saodiak jiu tad mide, 
  Kaplan makra leng.

CH: |
  (Chorus)
  He! sibo ram charapen wibo ramme. 
  Magenthiu makjiu lungrabo ram. 
  Dibo rapen tu maning masenne.

V2: |
  2. Thingna kumjiu I lemsi saira; 
  Lem mine, tinggen puise zuan jiu. 
  Calvary luang singchai kubo riga se. 
  Wang taokhai mine.

V3: |
  3. Sibo ramga akamai changbam; 
  Chunshabo lunglung ngao lanlakge
  Akahmai lungbo ram ga chariubo naih, 
  Kapbo sao mine.

V4: |
  4. Haitiujiu khengbam khe, chariudih. 
  Tingwang jan gasu thiuniu makjiu; 
  Hiupuina dih ga aliu lungrabo leng. 
  Kadih saodiakne.

Translation: "(No not happiness)"

Category: "Heaven nature"

