ID: "66"

Title: "JERUSALEM NAMDIH WIBO ZION"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Jerusalem namdih wibo Zion. 
  Lungsa maidung nai tinggen masan mai. 
  Tacheng kasamai Khrista penniu, 
  Bamra bo we, naimik kiumakbo ramga.

CH: |
  (Chorus)
  Halleluyah, Tingwang kendi bamlo: 
  Halleluyah Amen, Halleluyah. 
  Maihinatu sankhaira kiu ye. 
  He! Chawang Immanuel Halleluyah.

V2: |
  2. Singchai rihga masanbo jai luangkhai, 
  Jesu jai kungbo Calvary ga luang; 
  Tachengsa masanra luangkiu ye.
  Pakendi Jesu jai luang Halleluyah.

V3: |
  3. A Rapiu nai Masanbo Hiupuina, 
  Chawang bamga mathajiu chalui thiu. 
  Nah maidung niu thuanne, a Rapiu. 
  Kukachangbo Hosanna tiujiu senne.

V4: |
  4. Jerusalem mathabo a Rapiu,
  Jerusalem ga chawang kadibo.
  A Rapiu janga wangmai thuanlo.
  Messiah tu adaojiu senne, Hosanna.

Translation: "(Beautiful City of Jerusalem)"

Category: "Melodious praises"

