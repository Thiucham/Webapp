ID: "21"

Title: "TAKUM KASAN WANGLAN SUDE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Takum kasan wang lan sude, 
  Chunsa jengsabo di hade. 
  Pabam hina tu mazuanjiu, 
  Lungsa maidung kuikam mide.

CH: |
  (Chorus)
  Delam bamlo lungsa maidung? 
  A Rapiu tingtheng ram wibo 
  Wanglo karingbo charapen, 
  Parim kawibo se lukhe.

V2: |
  2. Pawan sera tadlan lakge, 
  Kachia namdih wibo gase.
  Magenthiubo bamlan lakge. 
  Tingtheng ram kawibo gase.

V3: |
  3. Lungsamai ram tu manging nge, 
  Mazuan khe chariub gasu, 
  Tingtheng wibo Salem namdih, 
  Lungsa maidung bambo ramme.

V4: |
  4. Khuan lulakge, tinggen ramtu, 
  Siga aliu di lungra leng. 
  Lungsamai tu ramna liu di 
  Siga wijiu wang aruang ne.

Translation: "(The new year is back)"

Category: "New year"

