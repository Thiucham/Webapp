ID: "24"

Title: "GETHSAMANE RENG LUNGGA JESU"

Key: "F"

Time signature: "4/4"

V1: |
  1. Gethsamane renglung ga Jesu niu singhjlu bamga, 
  Maidung wang maduiju a Rapiu tu min de. 
  Pariga ladjan thiusi ramai ha;
  Phaimiu dibo ki ga shaira leng dinkhai.

CH: |
  (Chorus)
  Magenthiubo kamuang tamiu wang nge 
  Calvary luanglam a Rapiu tu jutad le.
  Tathu pirun nai siangkhaibo singga, 
  Nbairabo bam ha, a Rapiu Jesu.

V2: |
  2. He, Simon Peter nai ladlang tadmai dungse sulo; 
  A Rapiu tu kamshat rabo bam lam ju tad, 
  Tinggen lamsu kiubo Tingwang Nah tu. 
  Nkharamai haye, magenthiubo ga.

V3: |
  3. Ting-kadih chamlam khaira tacham kawi dinpiu tu 
  Kamshat ra dama, Zion nahmai nangliu dung? 
  Pacham kawibo nang mangai dulo;
  Naliu dung ringjiu aman bambo leng nge.

V4: |
  4. He, seraphim nai Tingwang ladlang tadmaise phuilo: 
  Gukhai ramai haye, a Rapiu Jesu tu, 
  Mai nuan phungjiu magenthiubo bam ga. 
  Palung magenthiujiu Papiu tu ku ye.

V5: |
  5. Dejiu ngao magenthiu gulo, Apiu Jordon kenra. 
  Pah pumtan hajiu papi makiang kiu mide, 
  Pah hiupuina kadih ga soudiak khai, 
  Nuan ritu ngamjiu Jordon dui ken lude.

Translation: "(Jesus at Gethsamane)"

Category: "Passion week/ Good friday"

