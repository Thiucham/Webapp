ID: "33"

Title: "RANKHAIPIU PALUNG MAGENTHIU"

Key: "AB"

Time signature: "3/2"

V1: |
  1. Rankhaipiu palung magenthiu, 
  Pa rimai niu jujiu. 
  Tad rabo bamse phuilujiu. 
  Shairabo bamdi ye.

CH: |
  (Chorus)
  Maluang ringa maseng sujiu, 
  Siangkhaibo sing rihga 
  Magenthiubo khuan chiubose, 
  Rankhaibopiu khuan ne

V2: |
  2. Chariubo singchai phunglujiu,
  A Rapiu tu ju de. 
  Shairabo luang lam zuan tad de. 
  I niu nkha khaine.

V3: |
  3. Chaphai nai tathu pirun khai, 
  Genrabo singchai di 
  Shairabo luang lam zuan tad le. 
  Anuan hina phungjiu.

V4: |
  4. Siga wang maduibo bamga, 
  Patu mikreh maidung. 
  Magenthiubo tu phui lujiu, 
  Singchai ga ju sude.

V5: |
  5. Paphi-paben natari niu, 
  Tasingga gen khaijiu. 
  I niu wahina loikhai de! 
  chiujiu Jesu senne.

V6: |
  6. Chariujiu kashaibo se nai, 
  Magenthiubo hina, 
  Jesu niu ngamkhai kam lujiu; 
  Charaw ga niu sude.

Translation: "(Redeemers Agony)"

Category: "Passion week/ Good friday"

