ID: "103"

Title: "KADIH HAI NCHUN KUM TAMIU"

Key: "GB"

Time signature: "4/4"

V1: |
  1. Kadih hai nchun kum tamiu wang nge, a Rapiu; 
  Pabam machangna ga phui khaijiu. 
  Kapbo siniu magenthiu chariubo khuan siniu, 
  Tamiu wang nge, kadih riga hai.

CH: |
  (Chorus)
  De bonai tinggen ga mathajiu wangbam ralo? 
  Tingtheng amanrabo ram gase. 
  Agimanaijiu matha saomakbo ram gase, 
  Wang tangra I nkhuan lulakge.

V2: |
  2. Delam pak khailujiu delam mbaikhai ralo? 
  I dupkhairabo bamse Nang nge. 
  Nchundi nendi a Rapiu nang wangbo ga; 
  Atu lusu khailo, a Rapiu.

V3: |
  3. A Rapiu Jesu niu kaden khaibo tinggen ram;
  Chamai mun siniu din ngam lak ge. 
  Kadih nai singbang hina sidi pabiu benne. 
  Piubon hina niu pabiu pi ye.

V4: |
  4. Tinggen dih wibo karingbo singbang sung gase, 
  Rankhai mibo maihina seniu, 
  Tingwang tu thuankiujiu mathabo lui thiu bamme. 
  Pah ken di milo, Halleluyah.

Translation: "(Darkening like night)"

Category: "Aspiration for Heaven "

