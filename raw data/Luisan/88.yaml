ID: "88"

Title: "TINGGEN GANBIU RANKHAIPIU"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Tinggen ganbiu Rankhaipiu Chawang thiubo ram. 
  Kadih ga magenthiubo hina; 
  Siga kamuang tamiubo bamlak; 
  Kapjiu ramna lanbo hade.

CH: |
  (Chorus)
  Lily pen nai pamaken di bose; 
  Milipoi nai rankhaimai bambo ram. 
  Tinggen mai nai masan mai tu, 
  Ngaora masenne.

V2: |
  2. Mazuanjiu bamlo, Pakendibo ram wangra. 
  Thuanbo lui thiubo ramlam zuanlo. 
  Kadih ga akamai phui bamdi. 
  Maningjiu malan wang lak ge.

V3: |
  3. Rankhai maidung niu Jerusalem wibo lam. 
  Matha bamme, kabenbo ramga, 
  I bam niye, Param wibo ga; 
  Alungniu maning tamakge.

V4: |
  4. Lung kamathabo a Rapiu ram wibo ram. 
  Naimik, chahiu-chagan di ha ye. 
  Chun tamiubo di bamlan lakge. 
  Milipoi se benjiu bamme.

Translation: "(Heavenly Star)"

Category: "Melodious praises"

