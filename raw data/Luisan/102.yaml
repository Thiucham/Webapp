ID: "102"

Title: "RANKHAIBO PIU DEGA BAMLO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Rankhaibo piu dega bamlo? 
  Nakhuan I chiu ni ye. 
  Natu ngaojiu mpao ni ye, 
  Nasai I sui bamne.

CH: |
  (Chorus)
  Tamiubo nai hiambo niu, 
  Maipum tan haye.
  Magenthiubo niu suibam; 
  Nakhuga bamni ye. (2x)

V2: |
  2. Alung chariujiu I kapbam, 
  Asuanghajiu bamme. 
  David nai rengdise nang nge. 
  He! dega bam milo.

V3: |
  3. Anah yo, wanglo chiu kubo; 
  Khuanse I chiu lujiu, 
  Natu maning bam chariujiu, 
  Aten aman ni ye.

Translation: "(Where art Thou Redeemer)"

Category: "Aspiration for Heaven "

