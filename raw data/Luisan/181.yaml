ID: "181"

Title: "KARINGBO TING CHARAPEN KUM"

Key: "G"

Time signature: "3/4"

V1: |
  1. Karingbo ting charapen kum, 
  Patingse tadsao makge. 
  Zimeng amang lam ngao lujiu, 
  Halan mibose kumme.

CH: |
  (Chorus)
  Ahiupuina Tinggen tadlo, 
  Kadih tu saodiak lujiu. 
  Tingtheng amanbo ram zuanlo.
  Tinggen masan maidung ram.

V2: |
  2. Kadih karingting hai delo? 
  Thiuniubo nai chariubo;
  Matha amanbo hinase, 
  Charapen kuibo kumme.

V3: |
  3. Tadraimai akahmai dungse, 
  Wangtang jiu aman mide 
  Chawang bam chap magui lujiu, 
  Tingwang tu thuanjiu bamme.

V4: |
  4. Paken dibo kabenbo se, 
  Naimik suangdi abenne.
  Siga paken dibo naise, 
  A Rapiu tu I ngaone.

V5: |
  5. Akhuan kawibo hinase, 
  Thuan bamne, I wangtang sai. 
  Thingna kumjiu lemsi saira, 
  Lemne lungsamai khulam. 
  Ahiupuina tuhoi lemlo;
  Kadih tu saodiak lujiu. 
  Tingtheng amanbo ram zuanlo.
  Tingwang lungbo namdih ga.

Translation: "(Life like a flower)"

Category: "Farewell"

