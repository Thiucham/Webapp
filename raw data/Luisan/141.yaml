ID: "141"

Title: "MAGENTHIUBO RAM SAODIAK JIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Magenthiubo bo ram saodiak jiu, 
  Tinggen Jerusalem gase, 
  Dedao suniu Wangtang ralo? 
  Tingtheng wibo ram gase.

CH: |
  (Chorus)
  He! maning saomak ramna makbo ram-tu. 
  Ringbo dui luang nge. 
  Rankhai maidung niu sakjiu, 
  Tingtheng Ringbo luye.

V2: |
  2. Milipoi niu benbo ramse, 
  Naimachang I maning tamak; 
  He! Tingjingpui nang niu wang-jiu, 
  Nang ramga juwang khailo.

V3: |
  3. Sigase a Rapiu bamme. 
  Palun naimik kum-jiu benne. 
  Atu benkhai sibo biuniu, 
  Tingtheng jeng ringbam raleng.

Translation: "(Leaving This World behind)"

Category: "Heaven nature"

