ID: "76"

Title: "PENTECOST NAI KUMJIU HE! A RAPIU"

Key: "F"

Time signature: "4/4"

V1: |
  1. Pentecost nai kumjiu, he! a Rapiu, 
  Malan wanglo zat hina rihga. 
  Tingtheng ringbo mpui silak bamme. 
  Jupad khai lanlo.

CH: |
  (Chorus)
  Tamiubo ramse thaoben khaira leng, 
  Pikhailo nalungsiat kawibo. 
  Chengsha hina hara chamipuang kum, 
  Hiupuina wanglo.

V2: |
  2. Magenthiubo khengh jiu shai mimai. 
  Kadih mathabo luni maidung. 
  Luangpad khailo, tingtheng benbo ram ga. 
  Hami ramai tu.

V3: |
  3. Masanbobo Hiupuina wangkiu lanlo. 
  Nanah pak maha mimai ringra. 
  Tingtheng ringbo npui tu simakjiu, 
  Hami ramai tu.

V4: |
  4. Mangai lakge, singchai rihga khenghbo; 
  Lung magenthiumai mathara leng. 
  Kam mahalo, kadih rapen tuse; 
  Nang niu luang ngut ra.

Translation: "(Oh Lord! Review as Pentecost)"

Category: "Melodious praises"

