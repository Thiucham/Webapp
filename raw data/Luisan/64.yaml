ID: "64"

Title: "TINGGEN RAM KAHABO THIUMAK"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tinggen ram kahabo thiumak, 
  Rapiu niu kasiam khaibo ram; 
  Nnien-nchun thiulan lakge. 
  Zion namdih wibo gase.

CH: |
  (Chorus)
  Tinggen Jerusalem gase, 
  Mariu charibo si bamlan lak ge. 
  Aliu di sibo ram ngao sune.
  Milipoi níu sega benjiu bamsune.

V2: |
  2. Rapiu naram kawibo ga, 
  Kapingbo tingthung bam lakge. 
  Nchungjiu ramnabo ha ye, 
  Kapbo di bamlak siram ga.

V3: |
  3. Chariubo kadihri mainiu, 
  Lungra tadpad bonai dasai, 
  Ten ngammak Rapiu suang gase. 
  Rapiu nang niu majang khailo.

V4: |
  4. Masanbo Hiuna dung siniu, 
  Majang khailo, nang ram gase. 
  Aliu lungga wangkiu khailo. 
  Satan dungtu hathon khai lo.

Translation: "(Riches of Heaven)"

Category: "Melodious praises"

