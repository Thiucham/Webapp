ID: "144"

Title: "TINGJINGPUI NIU MAJANGLO"

Key: "G"

Time signature: "2/4"

V1: |
  1. Kadihri ga chariu bamme,Tingpi Tingrun lamse. 
  Aruang bonai a Rapiu Jesu tu thuanne. 
  Tachun nchamjiu nalungsiat se thuankiura. 
  Kadih kapbo piha khailo.

CH: |
  (Chorus)
  Tingjingpui niu majang khailo, 
  Kadih chariubo ga. 
  Matha bamniye, he! nang lungsa maidung. 
  Mainiu mikre bamdi, he, nang kendibo thiumilo.

V2: |
  2. Tacham jaimak mainiu nangpen gasu ringbo lune. 
  Tazaigu duanse I din masan ngam lakdi: 
  Taning ramluang ga wang madui bam maidung tu. 
  He! pimatha khaira wanglo.

V3: |
  3. He! a Rapiu Lung chariubo pibam thengkhai dulo. 
  Chariubo niu lungsa maidung tu ramna ye. 
  Tingtheng jeng kadih Chariubo tu saodiakra. 
  Maihina lung ga wang khailo.

V4: |
  4. He! kadih chariu jiu kapbo hai pibamtheng dulo, 
  A Rapiu niu thoikhaibo kakungbo chamse. 
  Maihina lung matha kawibo thiura leng. 
  He! Tingjingpui nang lemwanglo.

Translation: "(Guide me oh! Jehovah)"

Category: "Heaven nature"

