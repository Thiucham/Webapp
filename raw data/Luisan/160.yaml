ID: "160"

Title: "NCHUN MANG KUMJIU"

Key: "A"

Time signature: "3/4"

V1: |
  1. Nchun mang kumjiu bam bo ringting hai. 
  Kuiwang nge, naikamachang ga. 
  Mathara ha ye, kadih ga hai; 
  Chariu magen thiubo dih ye.

CH: |
  (Chorus)
  I singbo chiukhailo, Rapiu; 
  I khengbo lungsa jiu lulo. 
  Ringting pilo, naten thiuraleng. 
  A Rapiu, a Rapiu khakhilo.

V2: |
  2. Chamai phuibamme, kadirih ga hai, 
  Tiuliu dih puiki meng kam de. 
  Majanglo, Rapiu nahiuna niu, 
  Chariu magenthiubo bam ga.

V3: |
  3. Chamai niu dinngam lakbo nuan bamme. 
  chiudih naram wiga lungra. 
  Maikhat leng karingting pi ngam ma; 
  Aki naih aluh saojiu tad.

V4: |
  4. A Rapiu kadih aringting loide.
  Nahiuna niu majang khailo. 
  Manasanbo ramga wang dasai. 
  Chaki chalu maning lakge.

Translation: "(Life like Dream)"

Category: "Heaven nature"

