ID: "167"

Title: "ALIU LUNGBO DIHAI"

Key: "G"

Time signature: "3/4"

V1: |
  1. Aliu lungbo dihai nuan niu chawang thiujiu; 
  Tamiubo niu gomjiu lung bamme. 
  A Rapiu nabiuse benkhailo aliu ga, 
  Alung chun tamiubo benkhailo.

CH: |
  (Chorus)
  A Rapiu makjiu mathara ha; 
  Matha chunwibose pikhailo... 
  Aliu ringting bamthen Rapiu tu thuan bamne, 
  Halleluyah chiujiu thuan bamne.

V2: |
  2. Kadih piri ga hai, Rapiu tu phut lujiu, 
  Shaibo pui lam zuantad jiu bamme. 
  He! Rapiu nang pumtan pikhailo, aliuga; 
  Harabo hiuna tu luang wangra.

V3: |
  3. Harabo hiuna dungtu ranpad ngamra leng. 
  He! apiu nang pumtan pikhailo.
  Apum, ahiuna pakhiangna pipad lujiu, 
  Shaimak then naten thiujiu bamne.

Translation: "(The world that we live in)"

Category: "Heaven nature"

