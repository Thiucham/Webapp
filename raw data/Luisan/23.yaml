ID: "23"

Title: "MAGENTHIUBO NAI NCHUN A RAPIU"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Magenthiubo nai nchun a Rapiu Jesu niu. 
  Pamise nai pajaise jan khailujiu, 
  Atu sibamra leng haise saklo tiu ye. 
  Kapjiu mikdui luang nge.

CH: |
  (Chorus)
  Pacheng leng riankhai ye. 
  Zion reng lung gase 
  Changlakbo ga machang khai, 
  Pah ladjan thiu majimak a Rapiu ri gase.

V2: |
  2. Karenglam tapadjiu charitu adaora, 
  Pahom mai lung magenthiu jiu jikam mide. 
  A Rapiu kasuangdui tajai kumjiu luang nge. 
  Chunding Papiu ga sing.

V3: |
  3. Roman ri maidung niu re, magenthiu bamme. 
  Phuilo, kareng gase tajai luang marenjiu. 
  Kiluang ju maronjiu re, magenthiu bamme, 
  A Rapiu Jesu tu.

Translation: "(Anguishness night of my Lord)"

Category: "Passion week/ Good friday"

