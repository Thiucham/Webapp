ID: "142"

Title: "ALUNG CHARIUBO GA"

Key: "E"

Time signature: "3/4"

V1: |
  1. Alung chariubo ga.
  A Rapiu kiukhailo, alung ga. 
  Magenthiu mai nahleng amanbose pine. 
  Thuanlo, pajan tuse; 
  Kadih chariubo ga bam liudi.

CH: |
  (Chorus)
  Paken dibo chamse, 
  I dinkam silakge. 
  Tinggen tara khuan wi; 
  Karingbo ting lungga thuan bamne.

V2: |
  2. Kadih Chariubo ga, 
  Achun sajiu I kap bam liudi, 
  Shaibo duise I kenpadsai Nagram wangra. 
  Atu sundao sune. 
  Chariubo mikdui luanglan lakge.

V3: |
  3. Sibo ramga bammai, 
  Ramna lanrabo cham din makge. 
  Masanbo Milipoi nadung tingtheng jiu bam. 
  Masanbo Seraphim, 
  Maidungse naih thuan kimlak bamne.

V4: |
  4. He! sebo ram wangra, 
  Kadih Chariubo niu Kham bamme. 
  I niu ngaotang lakbo naram pingao khailo. 
  Charih tu ngam khaira, 
  A Rapiu tu I niu khuan bamme.

Translation: "(When my heart weary)"

Category: "Heaven nature"

