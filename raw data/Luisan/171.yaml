ID: "171"

Title: "KALUNG SIJIU JENGSHAΒΟ ΝΑΙ"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Kalung sijiu jengshabo nai; 
  Alung, matha khairabo nang; 
  Chungsabo mikdui luang lujiu, 
  Naben jatlam I ngen wang nge 
  Ngen khai lo salam lungsamai. (2x)

V2: |
  2. Akahmai sailam hui bamme. 
  Patu maning jiu I kap bam. 
  Benhoi jiu mikdui luangbo se, 
  Dedao niu mangaimi ralo? 
  Kachakdui agikum bam ra. (2x)

V3: |
  3. Nalungchun ga I ten simak; 
  I niu kakungmai thiu bam di. 
  Tinggen puise zuantad mide. 
  Jesu khrista niu luang bamlo; 
  Ramna khaide akahmai tu. (2x)

V4: |
  4. Kadih chariubo bam ga hai, 
  Akahmai tu maning talak. 
  Tinggen ramse wangtang dasai, 
  Tadraimai lungsamai khuga; 
  Chariubo sao jiuwang bamne. (2x)

Translation: "(On that grieving day)"

Category: "Farewell"

