ID: "79"

Title: "ALIU KALUNGBO RAM SUANG KAWI HAYE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Aliu kalungbo ram suang kawi ha ye. 
  Akamai tu majang tachunwi ram. 
  Singnui-charapen nthingna khuan di wi; 
  Mangailak akamai aliu lungbo ramtu.

CH: |
  (Chorus)
  Wimanne, aliu lungbo dih hai, 
  Duigiu ka masanbo nam. 
  Ramluang hinadi charapen niu
  kamuang kem kakum. 
  Chamai hina akamai tu ngao dao we. 
  Wimanne, aliu dih Hamai kalungbo ram.

V2: |
  2. Aliu pui-piu wasi kamak dao tingga, 
  Chari ha kasimaidung tajan di; 
  Thaidao ken ga wakasimai racham hai, 
  Tara nai nthiam niu aliu ram tu thuanne.

V3: |
  3. Aliu kalungbo ram wadaodi kuimak. 
  Kaden lo, takum kaliwang kinne. 
  Tingwang thoi niu nchungbo di matha ne. 
  Wimanne, aliu kalungbo Hamai dih hai.

V4: |
  4. Aliu kalungbo ram charapen bangkum; 
  Nai machang nthingna kabuan kum bam. 
  Awanjeng mai tadui kum luangwang majeng; 
  Aliu lungbo kiluang tu maidi ken lak ge.

Translation: "(My land my pride)"

Category: "Melodious praises"

