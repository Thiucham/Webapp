ID: "73"

Title: "TASIBO LUNGSIATTU ALUI THIUJIU BAMNE."

Key: "EB"

Time signature: "6/6"

V1: |
  1. Tasibo lungsiat tu alui thiujiu bamne. 
  Palungsiat niu atu liu khai mide. 
  Dejiu wilo atu kungjiu Pah wangbo hai. 
  Amou hina kuak khaijiu jusu we.

CH: |
  (Chorus)
  Pawan machang Calvary tu I phui bamne. 
  Jesu aleng shai khaibo cross tuse. 
  Tasi ye, kaomibo ahiuna jusubo; 
  Amao hina kuak khaibo Jesu ye.

V2: |
  2. Dejiu wilo, Jesu atu lungsabo hai, 
  Aphian linjiu cross gase shai khai ye. 
  Apum taniabo kabun kum khiu masan khai. 
  Ringthuibose akhuga pikhaide.

V3: |
  3. Donwibo cross se ponjiu I pasai suine. 
  Degu wangbam liudi Pah gu thiune.
  Apum hai Tingwang niu maningbo thiu milo. 
  Pah niu masenbo ten I ten bamne.

Translation: "(Amazing Grace shall be my song)"

Category: "Melodious praises"

