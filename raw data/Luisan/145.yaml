ID: "145"

Title: "MANING NGE RAMNA MAKBO"

Key: "C"

Time signature: "4/4"

V1: |
  1. Maning nge ramna makbo, 
  Tingwang lungbo ramtu; 
  Naimik manuan padde. 
  Aliu ramna raleng. 
  Maning nge ramna makbo Zion ram.

CH: |
  (Chorus)
  Maning nge Tingwang lungbo, 
  Ramna makbo namdih. 
  A Rapiu nai ringbo singbang, 
  Saron wibo penbam.

V2: |
  2. Tinggen Jerusalem ga, 
  Ringbo dui luang bamme. 
  Mainiu ngaomakbo ram. 
  Ringbo singbang sung ga. 
  Salem namdih wibo ga luang ngutlo.

V3: |
  3. Dibo kareng lungga se, 
  Tinggen Milipoi bam. 
  Nchun Tamiubo nai,
  Kapbo guh bamlakge. 
  Luang ngut khailo, a Rapiu Salem ga.

V4: |
  4. Dibo namdih chamsera, 
  Din ngam ramai ha ye. 
  Tingwang lungbo ramga, 
  Masan maidung bamme. 
  A Rapiu ram Zion luang wibo ga.

Translation: "(A Hope For Eternal)"

Category: "Heaven nature"

