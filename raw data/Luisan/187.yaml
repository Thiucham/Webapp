ID: "187"

Title: "KADIH MATHABO PATING DUNNE"

Key: "G"

Time signature: "2/4"

V1: |
  1. Kadih mathabo rapen pating dunne, 
  Kuilan mide, penkhai nangmak gasu; 
  Ramna rabo leng naimik manuan wang mide.

CH: |
  (Chorus)
  Thiuniu makjiu ramna sukhe, asingnahmai; 
  Aliu agunbo ram lam zuantad sukhe, 
  A Rapiu Jesu niu majang khai bamlo, 
  Thiuniu makjiu ngao aruang lan raleng.

V2: |
  2. Kadih ga chariubo saorabo ting ha;
  Pawan tadmibo tu kulan silak, 
  Ramna makbo Salem namdih tu maning nge.

V3: |
  3. Daating kum jiu matha bamra hadama? 
  Ramna sukhe, a Rapiu ten thiura, 
  Malumbo niu Calvary ga ngao aruangne.

V4: |
  4. Tuhoi aliudung lungsa jiu ramnadi, 
  Kendibo tingmikse wang dasaira; 
  Kawibo namdih kasan ga matha bamne.

Translation: "(The short earthly days of happiness)"

Category: "Farewell"

