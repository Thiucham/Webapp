ID: "149"

Title: "PATING TADMIBO MAZUAN JIU"

Key: "F"

Time signature: "4/4"

V1: |
  1. Pating tadmibo mazuan jiu,
  Charapen kuimibo kumme. 
  Tinggen rapen matha saomakbo.
  Kuilanbo dih bamlakge.

CH: |
  (Chorus)
  I maning nge kuilan makbo ram. 
  Tingwang niu kaden khai bo ramga. 
  Rankhaimai nahdung bamsao makge. 
  Milipoi tu thuan bamlo.

V2: |
  2. Pakendibo ramtu phuisai, 
  Haibo di charapen kumme, 
  Tingtheng ringjiu kuimakbo ram se, 
  I maning nge, wangtang ra.

V3: |
  3. Kadih ga mathajiu bammai, 
  Magen thiulujiu kap bamme. 
  Piringsu lanlo, a piu Tingwang; 
  Matha saomakbo pilo.

V4: |
  4. Hiupuina masanbo pen mai, 
  Atu saodiak jiu matha bam. 
  He! a Rapiu langkiu khai lanlo. 
  Natu I thuanbam raleng.

Translation: "(Beholding the past)"

Category: "Heaven nature"

