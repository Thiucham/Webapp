ID: "138"

Title: "CHARIUBO KAMUANG HANGGA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Chariubo kamuang hangga, 
  I tad mariu bam. 
  Matha kawibo hajiu. 
  Alung ben makge.

CH: |
  (Chorus)
  He! kawi janbo tu maning nge. 
  Ariga ben khailo. 
  Tamiubo niu atu gom namme. 
  Wang ben khailo, tingtheng ringra, 
  Mathabo bam ga luang ngut khailo.

V2: |
  2. Adam raw tamiu lungga, 
  Benbo tu maning. 
  Rankhaibo tajai pen niu, 
  I natu zuan wang.

V3: |
  3. Kahuibo khuan niu phui ye.
  Zat hina gase. 
  He! Eden naimik kuijiu, 
  Maning saomak ge.

V4: |
  4. Pasai hiupuina dihga, 
  Ring nga bam dasai, 
  Kadih chariu rapen tu, 
  Maning lan lakge.

Translation: "(Under the cloud of weariness)"

Category: "Heaven nature"

