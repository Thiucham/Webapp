ID: "140"

Title: "LEMSI SAIRA"

Key: "C"

Time signature: "2/8"

V1: |
  1. Lemsi saira tingku genlam, 
  Kamuang nai ganbiu rilam; 
  Lemsi lusai tinggen ramlam, 
  Salem nam ga lemtadne.
  Pareng lung ga ringbo dui niu, 
  Luangchia bam Param gase. 
  Karingbo biuse niu benne, 
  Namsan kawibo gase.

CH: |
  (Chorus)
  I maning nge, amanbo ram masanbo apiu ram ga 
  {Paken dibo Charapen kum 
  Ringbo duise Luang bamme. (2x)}

V2: |
  2. Sibo ram ga bam maidung niu,
  Kadih ga shaibo loijiu.
  Mathiuna Tingwang ramgase, 
  Mikduise luanglan lakge.
  Kabun Kumjiu masan lujiu, 
  Kadih pon piulan lakge. 
  Chariubo se Khenglan makjiu. 
  Jesu naih Lungcham bamne.

V3: |
  3. Tingtheng ringiu Lungsamai nai, 
  Wibo ram ga bam chamne. 
  Kadih ga lungbo wan kum jiu. 
  Maninglak Tinggen ram ga. 
  Karaidao I kapbo guse, 
  Lungsamai nai ngao daone. 
  Tuh Kadihmai niu Khuan lulak.
  Ringbo Singbang hang gase.

Translation: "(If I could Fly)"

Category: "Heaven nature"

