ID: "130"

Title: "RINGBAM THEN MATHA ARUANGJIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Ringbam then matha aruangjiu, 
  Bamliudi tinggen wang dasai; 
  Kapjiu ramnabo bam lak ge. 
  Maning nge, ramna makbo ram.

CH: |
  (Chorus)
  Rankhaibo bam wangtang dasai, 
  Kadihga chariumai nahdung. 
  Tingtheng chawang bam tu khuanjiu: 
  He! dedao niu bam cham ralo?

V2: |
  2. Maning saomakge, Calvary; 
  Kenpad khe, ramna makbo ram. 
  Kadi ga ramna bam liudi, 
  Mathajiu aruanglan sune.

V3: |
  3. Maning saomakge, Rapiu tu, 
  Chariu khengh sijiu lung maidung. 
  Paliu ga njangbo niu phui. 
  Kuijiu sune, kadih rapen.

V4: |
  4. Kadih ga Rapiu lungsa niu; 
  Palungsa niu pakan sungga. 
  Matha aruangra jukhaine. 
  Thuankiubo lui thiu bamra leng.

Translation: "(As long as we live)"

Category: "Heaven nature"

