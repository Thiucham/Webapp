ID: "18"

Title: "PAWAN HAITHENG PUI TAD WANGJIU"

Key: "A"

Time signature: "6/4"

V1: |
  1. Pawan haitheng pui tad wangjiu, 
  Nuan nai tamiubo kadih ga. 
  Chariubo nai shaibo niu phui, 
  Juken khai de Palungsa niu, 
  Tingwang tu thuan ne, Halleluyah.

V2: |
  2. Rapiu Khrista tu kahumra, 
  Kasimaidung mania thonkhai. 
  Haise kumjiu thai aliu di. 
  Kabambo pakhu thonkhaijiu, 
  Kahumjiu thuan khe, Halleluyah.

V3: |
  3. Khrista gu agi-manaibo, 
  Mathiu ga piwang tang milo. 
  Tuhoi gasu tingtheng jengjiu, 
  Aliu niu maduibo haise, 
  Paken di milo, Halleluyah.

V4: |
  4. Thai aliu aruangbo kum, 
  Rapiu Jesu wanglanbo nai, 
  Salem kasan ga adaone. 
  Tinggen maza sang-kai mai nai, 
  Pahtu thuan bamne, Halleluyah.

Translation: "(A long way off)"

Category: "Christmas"

