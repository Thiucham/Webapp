ID: "135"

Title: "CANAN RAM KASAN ZUANRA LENG"

Key: "C"

Time signature: "4/2"

V1: |
  1. Canan ram kasan zuanra leng, 
  Tamiu ram ga mariu; 
  Tamiubo ga I bam liudi, 
  Chami puang thaokum khailo, 
  Aliu suangga thao ben khailo.

CH: |
  (Chorus)
  He! Rankhaibopiu atu daolo. 
  Canan ram wang makra manang. 
  Chariubo kamuang hangga. 
  Achunsajiu ahui bamme.

V2: |
  2. Chariubo ram tatu luangga, 
  Ringbo duipuak padlo. 
  Canan ram zuan mai sakra leng. 
  Rankhaibopiu tu ngaora; 
  Kadih ram tu maning lanlak.

V3: |
  3. Asuangga sang-kaimai ngut le. 
  Canan ram wibo ga. 
  Chariubo ram maning lan lak, 
  Shaibo ramse ken dasai; 
  Ringbo namdih lam zuan sune.

V4: |
  4. Tinggen ganbiu benbo ramga,
  Rankhaipiu tu thuanne. 
  Kadih magenthiubo halo; 
  Mathabo luisan thiura. 
  Siga bamra I ram gunne

Translation: "(Towards the new Canaan)"

Category: "Heaven nature"

