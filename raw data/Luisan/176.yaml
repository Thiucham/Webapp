ID: "176"

Title: "MIKDUI LUANGBO BAMLAKGE"

Key: "AB"

Time signature: "4/2"

V1: |
  1. Mikdui luangjiu ramnabo bamlakge, pasaira; 
  Tinggen ram ga aliudung ngaodaone pasaira;
  Tingwang dih wibo gasu aliudung matha bamne. 
  Tinggen ram kawibo ga Jesu nai bam chamne.

V2: |
  2. Miria niu benbo ram ga aruangne pasaira; 
  Lungsamai ramnami maidung naikhat pasaira. 
  Patu thuankiu aruang jiu siga mikdui bam lakge. 
  Magen thiujiu chunsabo bam lakge pasaira.

V3: |
  3. Ramna lanbo bam lakge tinggen dihga sira. 
  Kadih ga lung magenthiubo kum jiu bam lakge. 
  Lily rapen wibo ram ga tingtheng aliu bamne. 
  Mikdui luangjiu Chariubo bamlakge pasaira.

V4: |
  4. Mikdui nunjiu ramna mibo lungsa maidung nai, 
  Sibo giugen ramna makbo gase bam chamne. 
  Tingtheng jiu ramna makbo gase lung aruang bamne.
  Tinggen ram kawibo ga mathak jiu thuan bamne.

V5: |
  5. Haibo dihra chariubo nai kap bambo ramme. 
  Aruang bamga dih mikdui luangjiu kapsao makge. 
  Tinggen ram kawibo ga mathajiu wangbam sune. 
  Tinggen ganbiu rankhaipiu chawang thiubo ramga.

V6: |
  6. A-maningmai lungsamai maluang tadton makthen. 
  I phui bamne, akahmaidung tu ngao bam thenna. 
  Khrista niu majang bamlo, aliu ngaodao lanmak then, 
  Thiuniu makra Tingwang niu gu bamne, tadsulo.

Translation: "(No tears will be there)"

Category: "Farewell"

