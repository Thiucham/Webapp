ID: "192"

Title: "KENDIBO GA LUNGSA MAIDUNG"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kendibo ga lungsa maidung, 
  Tuhoi paliu matha bam; 
  Kadih tinglang loibo nai sai, 
  Paliu naih lungcham bamne.

CH: |
  (Chorus)
  Kikhun maitu adao lanne. 
  Pasai niu .... Pasai niu. 
  Withubo leng nkhuan bamme. 
  Tinggen ga, tinggen ga.

V2: |
  2. Nah dao tingwibo tinglang ga, 
  Kungbo cham paliu dinne. 
  Lungsasi piu Jesu racham, 
  Tu paliu dinjiu bamme.

V3: |
  3. Tinggen luise nang thiu sune. 
  Daating nang thiu bambo se. 
  Sibo luise mazadung nai; 
  Naikhat thiu cham bam sune.

V4: |
  4. Mathabo wan tu maningjiu. 
  Kikhun thiujiu lungbo se. 
  Mikdui nunjiu ramna liudi, 
  Pasai niu adao lanne.

V5: |
  5. Khat khat thiujiu tad kam mide. 
  Paliu bam aruang mide.
  Siga kikhun ramnabo se. 
  Naikhat aruang lan sune.

Translation: "(Dear ones in glory)"

Category: "Farewell"

