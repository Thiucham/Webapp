ID: "124"

Title: "SINGNAMAI NANG CHAP BAM PHUI MUILO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Singnahmai nang chap bam phui muilo. 
  Nagu malee dega sao ralo? 
  Make marajiu Masan mai madui dasai; 
  Singnahmai nang delam zuan ralo?

CH: |
  (Chorus)
  Ting-kadih hai hami dasaira; 
  Nang chap bam se maji lusu ma? 
  Tensi nai tathon nang ngao suma singnahmai?
  Rapiu chunwi nang ngaolu suma?

V2: |
  2. Khrista makjiu mathabo ha ye.
  Nagu wi se Rapiu leng pilo; 
  Kadihri lungwi niu Rapiu tu phiu dou lak. 
  Kadih gu wi niu mathabo ha.

V3: |
  3. Nang chap bamse phui masan lulo; 
  Naringting wibo wan ha misai. 
  Nagu wi se niu kaloibo thiumi sune. 
  Nang chap bam phui muilo, singnahmai.

Translation: "(Brethren, look carefully)"

Category: "Message"

