ID: "122"

Title: "HAIBO DIH TAMIUBO RONNA YE"

Key: "E"

Time signature: "4/2"

V1: |
  1. Haibo dih tamiubo ronna ye. 
  Kadih gara kawibo wadi ngaomak 
  He! a Rapiu nangbiu benbo se pikiu khailo.

CH: |
  (Chorus)
  Mathakrabo bam ha kadih ga. 
  Tinggen tu machunjiu, 
  Khuan bamkhe, lungsa maidung.

V2: |
  2. Kadih ten leng niu maran talo; 
  Hiuna ten ga lung ngut bam mai donwi ye. 
  Rapiu niu haibo ladrian hina 'liuga dinkhai.

V3: |
  3. Nuan gu potrit phungjiu bam maidung. 
  I niu mathak khaine, akhu wangmai tu. 
  Lungsa maidung Rapiu khuga wanglo, kha khaira,

V4: |
  4. Lungsa maidung jitheng bam talo; 
  Tuhoi naleng pawan wiga kadenlo. 
  Malan wanglo, Rapiu wangrabo wan naa mide.

Translation: "(This world is of darkness alone)"

Category: "Message"

