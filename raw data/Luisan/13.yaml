ID: "13"

Title: "MILIKHUAN MAI NIU CHUNDING GA"

Key: "C"

Time signature: "6/4"

V1: |
  1. Milikhuan mai niu chunding ga, 
  Milikhuan jiu bam ga, 
  Rankhaibo wibo cham wibo, 
  Phungjiu wang nge, dinne.

CH: |
  (Chorus)
  Mathajiu thuan sukhe, 
  Tinggen wang tu thuan lo. 
  Maidung niu ngaokhai lak bamdi, 
  Alengra widiang nge.

V2: |
  2. Thai nai Bethlehem ga liu leng, 
  Rankhaipiu manade. 
  Phainoi niu Patu majiu khai, 
  Khouring kuang ga jibam.

V3: |
  3. Joseph ga Tingwang hiuna niu, 
  Haiga bantheng talo,
  Sulujiu Egypt lam tadlo;
  Riphenmai nawang nge.

Translation: "(While shepherds watched by night)"

Category: "Christmas"

