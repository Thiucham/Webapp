ID: "156"

Title: "MAGEN THIUBO BAMLAN LAKGE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Magen thiubo bamlan lakge,
  Tinggen ram kawibo gase.
  Rankhai maidung bambo ramse,
  Aliu lungbo dih kum makge.

CH: |
  (Chorus)
  Lung magenthiubo niu gom namme. 
  Chariubo niu taduidi kumjiu. 
  Mathabolui thiune, Pasuang ga, 
  Mathajiu sibo ram wangtang sai.

V2: |
  2. Sibo ram kadih kum makge. 
  Magen thiubo bamlan lakge. 
  Juken khailo, sibo ramlam. 
  Kawibo hina lura leng.

V3: |
  3. Kadih ga ramnami maidung, 
  Atu kuwe, sibo ram lam. 
  Wibo ram ga wang majadlo. 
  Paliu benhuai jiu kubamme.

V4: |
  4. He! a Rapiu Zaise kung nge. 
  Chariu maidung nangpen gasu, 
  Wibo ram ga wangbam phuide. 
  Kadih chariubo saodiak jiu.

Translation: "(There shall be no fatigue)"

Category: "Heaven nature"

