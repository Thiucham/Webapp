ID: "194"

Title: "PAWAN HAI NAWANG SUDE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Pawan hai nawang sude, 
  Lungsamai ramna ra. 
  Kadih ga lungsa maidung yo; 
  Lungsa maidung mangai dulo. 
  Tingtheng ram wangtang lu dasai.

CH: |
  (Chorus)
  Lungsamai mathajiu tadlo; 
  Ramna sukhe salam. 
  Nasuang ga chamih nai muang niu; 
  Chawang Immanuel niu jukhailo.

V2: |
  2. Kadih chariubo niu phui; 
  Chariubo kadihga, 
  Lungsamai tu ramnabo bam, 
  Tingtheng ramwi wang tangbo ga, 
  Hai kadih maning lan lakge.

V3: |
  3. Kadih tamiubo ramga, 
  Mikdui luangbo siniu, 
  Npui ngaomakjiu bambo ga 
  Mikdui thudsang jiu dinkhailo;
  Tingtheng ringrabo npui se.

Translation: "(Time is approaching)"

Category: "Farewell"

