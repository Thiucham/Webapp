ID: "14"

Title: "KADIHGA MANAIBO WANG PONDE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga manaibo wang ponde; 
  Panahdung tu nuan gasu rankhaira, 
  Hamibo hiuna tu phiu raleng, 
  Bethlehem matomki ga mana.

CH: |
  (Chorus)
  Naliu leng David namdi gase, 
  Rankhaibopiu Tingwang manade. 
  Pahse agi-njangbo wang piu ye. 
  Immanuel wang kendi bamlo.

V2: |
  2. Tingwang niu kadih tu lungsajiu, 
  Panah khangkhat natu se pikhai ye. 
  Soukum mai di Patu malum mai, 
  Tingwang gu ringbo lutao sune.

V3: |
  3. Pou-pe Adam nai Eve hainia niu, 
  Kahiambo ga kumkhai mibo don niu, 
  Haibo chaken machang ga nuan niu, 
  Chawang thiujiu lungbam niu bo we.

V4: |
  4. Nuan niu chawang thiujiu lungbam mai, 
  Jesu jan ga malumjiu lunglilo. 
  Thai nai nalung ga Jesu tu, 
  Matha mathajiu Chawang thiu khai lo.

Translation: "(Prince of Peace is born)"

Category: "Christmas"

