ID: "163"

Title: "NAIMIK KIUMAKBO RAM GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naimik kiumakbo ram ga.
  Kisin kawibo gase.
  Pawandi tadlan lakge, 
  Wahina kuilan lakge.

CH: |
  (Chorus)
  Tinggen ga mikdui luang lakge.
  Kasai thiuniubo di haye: 
  Takum pariak chaklak ge, 
  Chun tamiubo di haye.

V2: |
  2. Kamun hina kachia ye. 
  Kisin kawibo gase; 
  Puiki dih kachia niu ben, 
  Chun tamiubo di haye.

V3: |
  3. Naimik biu pageng ha ye. 
  Kisin kawibo gase; 
  Milypoi niu benbamme, 
  Chun tamiubo di haye

Translation: "(In that land of ever bright)"

Category: "Heaven nature"

