ID: "57"

Title: "MASANBO HIUPUINA"

Key: "BB"

Time signature: "4/4"

V1: |
  1. Masanbo Hiupuina kamuang niu jubo piu; 
  Wang Immanuel Nah wang lanlo. 
  Manamhang tamiubo npui ga tad bam. 
  Benwang lanlo tinggen ganbiu wi kachangbo piuse.

CH: |
  (Chorus)
  Tinggen ganbiu tinggen ganbiu wibo, 
  Rankhaibopiu nai Chawang dibo se nang nge. 
  Chariubo niu chari kumjiu dibam liudi. 
  Ringbo Tingwang khuga tingtheng bamne.

V2: |
  2. Tinggen Jerusalem kamun le dasaira, 
  Kachia namdi wibo ga ngutne. 
  Nuan jeng gasu magenthiubo hina, 
  Paken dibo ram wang dasai charapen kum penne.

V3: |
  3. Milipoi dibo ram naimik kiumakbo ram 
  Tadrai mai kadih tu maning mak. 
  Milipoi tu thuanbo lui thiu bamme. 
  Saili singbang sungga masanbo phai maliang benne.

Translation: "(The Holy Spirit)"

Category: "Melodious praises"

