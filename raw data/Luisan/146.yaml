ID: "146"

Title: "LUNG MAGEN THIUBO BAMLAN LAKGE"

Key: "C"

Time signature: "4/4"

V1: |
  1. Lung magen thiubo bamlan lakge, 
  Tinggen ram ga wang dasai.
  Kapbo Mikduise thudsang khai sune. 
  kabenbo kamunse kuilan lakge, 
  Tinggen dih ga.

CH: |
  (Chorus)
  Ramnarabo leng kanui sukhe. 
  Chunsa jengsa jiu kapdulo;
  Kadih ga ramna bamliudi, 
  Tinggen ga aruangne.

V2: |
  2. Tinggen dih ga wangtang ludasai, 
  Nuan naih Satan bamlakge. 
  Aka maidung tu ramna bamliu dih, 
  Salem namdih gasu aruang lanne. 
  Kapbam dulo.

V3: |
  3. Jesu jan gasu ramna lujiu, 
  Detu chunsa bam ralo. 
  Lungrabo ram Tinggen namdih gase, 
  kabenbo sao mak jiu tingtheng lungra, 
  Ramna sukhe.

Translation: "(There will be no distressness)"

Category: "Heaven nature"

