ID: "143"

Title: "HE! EDEN KASAN TU MANING"

Key: "F"

Time signature: "4/4"

V1: |
  1. Kadih Eden ga I bamtheng raoye. 
  Nai machang suanglam I phui bam,
  Tamiubo Kamuang niu atu gom namh. 
  Kapbo niu I karingting thiu bamme.

CH: |
  (Chorus)
  He! Eden Kasan tu maning nge. 
  Tingmik machang malum jiu I phui bamme. 
  Dah dao aka maidung tadrai lumaise, 
  Pamna kum nuijiu chalui thiu we.

V2: |
  2. Chunsa kapbo nai I maning khaijiu,
  Chariubo genlam bam maise. 
  Dejiu wilo amaningmai lungbo. 
  Immanuel niu Chawang thiu bamme.

V3: |
  3. Ramgun khaira kadihri ga ha ye. 
  Mikdui luangjiu ramna khaiye. 
  Eden kasan ga lungbam maidungra. 
  Kapbo saojiu chalui thiujiu bamme.

V4: |
  4. Maning bamne, Nangram wangtang makthen. 
  Chariubo tingtheng jiu Khengbam.
  Kawibo ram ga atu luang ngutlo. 
  I kapbambo hai nuibo thiumilo.

Translation: "(Hoping for the new Eden)"

Category: "Heaven nature"

