ID: "172"

Title: "AKAHMAI DUNG TU RAMNA RABO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Akahmai dung tu ramna rabo leng; 
  Naimik manuan pad lande, 
  Thiuniu du: <Thiuniu du>.

V2: |
  2. Kadihri gara amanbo haye; 
  Nai machang kahiambo niu, 
  Kadenlo: <Kadenlo>.

V3: |
  3. Pawan khatna ga, chunwi lui thiudi; 
  Charapen kuibo kumjiu, 
  Kuimide: <Kuimide>.

V4: |
  4. Aliu ramnara kadih nchung nge; 
  Kadih tingjing kam mide, 
  Tadsulo: <Tadsulo>.

V5: |
  5. Tinggen dih gara ramnabo hade: 
  Siga aruang lanra leng.
  Ramna khe: <Ramna khe>.

Translation: "(Good bye friends)"

Category: "Farewell"

