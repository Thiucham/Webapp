ID: "36"

Title: "CHARAM SUM LADJAN PIU YE"

Key: "G"

Time signature: "2/4"

V1: |
  1. Charam sum ladjan Piu ye. 
  Tingwang Jesu Khrista se. 
  Ladjan thiubo bam gase, 
  Nnien nchun tamiubo haye.

CH: |
  (Chorus)
  I niu thuan ne, Jesu tu; 
  Naken nangam dibo hina. 
  Namaidung tu lungsalo; 
  Chariubo hina gase.

V2: |
  2. Tinggen kadih, tadui ram, 
  Pah niu ladjan thiu bamme. 
  Nang suang kadibo mai ha; 
  Tinggen nai kadih ga ngao lak ge.

V3: |
  3. Singchai ga maseng khai ye. 
  Rankhaipiu Jesu Khrista. 
  Maomeng khaibo gu ha ye, 
  Haijiu chariubo khengh bamra leng.

V4: |
  4. Rome riphen kasadung niu, 
  Kam chariujiu re bamme. 
  Pilate ra rankhai ni ye, 
  Tiudi ran ngam lakjiu ta mide.

V5: |
  5. Paliu bambo Galili ram. 
  Jesu tinggen wang mide. 
  Sibo nai se pakhommai. 
  Tinggen lam ngenjiu sui kap mide.

Translation: "(The judge of the tri-land)"

Category: "Passion week/ Good friday"

