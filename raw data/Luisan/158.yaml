ID: "158"

Title: "ZION NAMDIH ZUANTAD BAM GA"

Key: "C"

Time signature: "4/4"

V1: |
  1. Zion namdih zuantad bam ga, 
  Nuan ga kiukhai lujiu bamme. 
  Nang makjiu kadih gahai kap bamme, Rapiu. 
  Karaiting gu hiuna niu jukhai lanlo.

CH: |
  (Chorus)
  Ramna mibo lungsamai tu, 
  Maning nge kakung maidung tu. 
  Ramna makbo Immanuel. 
  Namdih tangra maning khailo.

V2: |
  2. Kapbo dihhai pawan thengde. 
  Kadih gahai ruanmeng tadbam.
  Immanuel, nuan pui ga atu rankhailo. 
  Hai kadih shai bowe, Jordan ken makthen.

V3: |
  3. Kadih gahai bamcham raleng, 
  Pawan haye, chariubo niu. 
  Debo nailo lungsa mainai matha raleng?
  Sibo luang riga matha aruang bamne.

Translation: "(On the way to Zion)"

Category: "Heaven nature"

