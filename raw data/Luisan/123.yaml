ID: "123"

Title: "NAIKHAT JESU NIU ZAT HINA TU KHOM WANGNE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Naikhat Jesu niu zat hina tu khom wangne. 
  Kawimai nai kasamai tu kada sune. 
  Khangsia maitu wide tiujiu dinpadbo ga; 
  Sebo dung ruang gase nangdi wangjao suma?

CH: |
  (Chorus)
  Masan maidung matha lui thiusai, 
  Mikdui luangjiu khangsia kap sune. 
  Malum maidung niu ringbo duise sak dasai, 
  Malum makmai charijiu tadui kheng sune.

V2: |
  2. Pawan tang dasai I, I di tadne, tinggen lam. 
  Kadih ga tenkhaibo tathonse lu sune. 
  Malum maidung niu ringbo pirun run dasai, 
  Malum maidung niu ringbo pirun rundasai, 
  Sibo dung ruang gase nangdi wangjao suma?

V3: |
  3. Rapiu gu ladjan tingmik naikhat wang sune. 
  Rankhaibo wan se tad duaklan ngamlak sune. 
  Khangsia mainiu chami zai ga tadbo wan ga, 
  Sibo dung ruang gase nangdi wang jao suma?

V4: |
  4. Pamou habo Tingwang Nah Jesu shaibo se, 
  Nuan phungbo aleng nge, chiujiu I lukhaide. 
  Gukhai maidung tu khom aruangne, tinggen ga. 
  Sibo dung ruang gase nangdi wangjao suma?

Translation: "(Jesus shall gather all nation)"

Category: "Message"

