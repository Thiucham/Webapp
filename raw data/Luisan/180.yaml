ID: "180"

Title: "HE! MATHABO TING LOIMIDE"

Key: "GB"

Time signature: "4/4"

V1: |
  1. He! mathabo ting loimide. 
  Aliu chamai karingbo ting. 
  Pating pawan wangngao mage. 
  I ra malan wang lulakge.

CH: |
  (Chorus)
  I maningnge, pating pawan. 
  Matha mala bambo tingdi. 
  Kalungsi ye, maning khaijiu; 
  Karingbo ting malan wanglo.

V2: |
  2. Pating pawan sai suilu jiu: 
  Lungni aluan niu suiwang nge. 
  Takum machang pating pawan. 
  Malan wangjiu kali makge.

V3: |
  3. Pating pawan sai suiwang jiu; 
  Kariabon kasan bonlande. 
  Charapen di kuiwang lande, 
  Karingtingra kuimid midle.

V4: |
  4. Pating pawan sai suiwang jiu; 
  Taten khou khuan di maralan, 
  Thingna hina machang lande, 
  Chamai tingra hamid midle.

Translation: "(Moments of joy is passing by)"

Category: "Farewell"

