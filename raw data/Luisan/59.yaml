ID: "59"

Title: "NAMDIH MATHA KAWIBO"

Key: "A"

Time signature: "4/2"

V1: |
  1. Namdih matha kawibo ram tu, 
  Kadih ganiu mazuan lujiu. 
  I bam ni ye, namdih gase. 
  Kadih magenthiubo kensai, 
  I bam mide, sibo ram gase.

CH: |
  (Chorus)
  He! ahiupuina magenthiu, 
  Rankhaibopiu Jehova sai I sui bamne. 
  Nang nuan karitbo kadih ga saokhai diak milo. 
  Namdih situ zuanjiu tadlo, tadlo.

V2: |
  2. I maning nge, kawibo ramtu, 
  Tinggen ramga chalui thiubam. 
  Lemsi saira thingna kumjiu. 
  Lemtad mine, amanbo lam, 
  Ringbo singbangtu I zuan mide.

V3: |
  3. Karingting tu I maning saira, 
  Kadih magenthiubo niu nam. 
  Namdih ga Hiupuina wanglo,
   Rankhai mainah bambo ram ga, 
  I bam niye, charam wibo lam.

Translation: "(The City of joy)"

Category: "Melodious praises"

