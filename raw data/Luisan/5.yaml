ID: "5"

Title: "MANAIBO WANG MANA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Manaibo wang mana Bethlehem ga,
  Haibo ram gang kachang kanan ram.
  Zat hina phi niu wangtang diubo ramme.
  Siga tingtheng ringbo ringlandui luang bam.

CH: |
  (Chorus)
  He! achunwijiu ngenah manabo nai,
  Mathajiu thiukhe achunwibo lui;
  Zat kathiu hina ringrabo leng nge. 
  Thuanjiu thiulo, Halleluyah chiujiu.

V2: |
  2. Tathe wan chun thengbo phuiriang jiu ga, 
  Mili khuan maidung mili khuan bam ga. 
  Chunding gasu niu Gabriel madu wangjiu.
  Ringbo cham I phungwang nge, chiujiu dinne.

V3: |
  3. Siga masanbo hiupuina siniu, 
  Tinggen lam chalui wibo wangthiu ye.
  Ku kachangbo lam Tingwang kendi bamlo. 
  Kadih riga mathajiu manai bamlo.

V4: |
  4. Milikhuan maidung namdi lam zuan jiu. 
  Naimik padlam kasimai thao phungwang.
  Lungsa maidung di wangjiu kahum bamme. 
  Chawang di maidung di palan phungwang nge.

V5: |
  5. Matha sukhe, Tingwang manabo nai, 
  Tinggen chom nai kadih chom biu chamlo. 
  Tinggen wang nai kadih wang nge, a Rapiu; 
  Karingbo tinglung ga thuankhe, Khrista tu.

Translation: "(The King of Peace)"

Category: "Christmas"

