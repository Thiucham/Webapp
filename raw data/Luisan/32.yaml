ID: "32"

Title: "LUNGPUBO CHUN ZION KICHEM LUNG GA"

Key: "F"

Time signature: "2/4"

V1: |
  1. Lungpubo chun Zion kichem lung ga. 
  A Rapiu niu pajai njan ne. 
  Siga chariubo kamuang tamiu ye. 
  A Rapiu lungsajiu kap bamme.

CH: |
  (Chorus)
  He! naliu Jerusalem maidung. 
  Pah lungsa hinase sibamlo; 
  Nang thiuniu hina wikhaibo don niu, 
  Pah chariubo si mangai mane.

V2: |
  2. Jerusalem nanmdih karenghang ga, 
  Phaimiu shaibo cheng makge chiujiu. 
  Phuikhai matailo, Calvary luanglam, 
  Maidung ruang ga a Rapiu tu ngao.

V3: |
  3. Phuilo, Calvary luang wangtang sude. 
  I niu detiubo gu thiu ralo? 
  He! a Rapiu nang wanglan lak dama? 
  Nangbam leng Calvary si dama?

V4: |
  4. I mangai lak ge, a Rapiu jesu; 
  Calvary lamse phuijiu bamne. 
  Aleng nangniu khengkhaibo alung ga. 
  I shaibo tangjiu mangai lak ge.

Translation: "(Anxiety eve at Zion)"

Category: "Passion week/ Good friday"

