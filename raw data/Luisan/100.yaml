ID: "100"

Title: "KADIHMAI DUNG RINGLAN RALENG"

Key: "E"

Time signature: "2/4"

V1: |
  1. Kadihmai dung ringlan raleng, 
  Singchai rihga Pah niu shaikhai. 
  Sao bidi Patu lumak maidung, 
  Kahuibo nai chariubo ramga bam sune.

CH: |
  (Chorus)
  Matha chunwibo ram
  Dedao su niu wangtang ralo?

V2: |
  2. Parim wibo rapen ramme, 
  Benjiu bamme, tinggen ramse. 
  Tinggen mazadung niu thuankiujiu. 
  Jehovah nai tingtheng tingtheng kui lan lakge.

V3: |
  3. Haijiu wibo ram ga ngutra,
  A Rapiu atu jukhailo. 
  Haibo dih ga chariu bam liudi, 
  Nalungsa niu chariubo hina I ngam ne.

V4: |
  4. Rapiu niu bambo wan gase, 
  Kati-kadi ladjan thiune.
  Taten samai nai maji makmai, 
  A Rapiu Jesu tu phui ngam lakjiu kapne.

Translation: "(Life to renew)"

Category: "Aspiration for Heaven "

