ID: "75"

Title: "HALLELUYAH KU KACHANGBO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Kung kachang nge, kata hina. 
  Pawan saisui kapjiu; 
  Chawang ju thiujiu kadih rihga. 
  Chawang dithubo janse thuanra.

CH: |
  (Chorus)
  Halleluyah, ku kachangbo. 
  Kadihpiri tamiubo ram tingjinging bo ga.
  Natu malumjiu maning bamme. 
  Wanglo, Rankhaipiu Chawang Jesu.

V2: |
  2. I ringbo ting tamiu ram ga, 
  Rankhaipiu tu kujiu, 
  Kuimakbo ram wangra khuan bamme. 
  Wangkiulo, kuilan makbo ramse.

V3: |
  3. Karingbo tingtheng bam liudi. 
  Khuan bamne, Canan ram; 
  Naimik kiu lan makbo ram tuse. 
  Chunwibo chawang pirun lura.

V4: |
  4. Chawang lungbambo Zion ram. 
  Ting-kadih ri Wanghpiu. 
  He! Halleluyah tiujiu senne. 
  Masan mai Chawang bam chap magui.

Translation: "(Halleluyah in the highest)"

Category: "Melodious praises"

