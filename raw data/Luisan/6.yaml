ID: "6"

Title: "PHAIMIUDUNG DINKHAIBO WANG"

Key: "C"

Time signature: "4/4"

V1: |
  1. Phaimiudung dinkhaibo wang Messiah, 
  Caeser ken ga sibo tingmik tangde. 
  Chawang masanbo tu thuanlo, thuanlo. (2x) 
  Tinggen lam mai nai mili gaomai.
  Kadiu lamsu wang kasimai, 
  Tinggen ganbiu nai masanmai. 
  Chawang kasan manabo dinkhai ye.

V2: |
  2. Chawang hina manabo kum mana;
  Bethlehem matomki ga manakhai, 
  Immanuel Wang tu thuanlo, thuanlo, (2x) 
  Masan maidung nai milli gaomai, 
  Kadiu lamsu wang kasimai 
  Tinggen ganbiu nai masan mai, 
  Chawang kasanbo manabo dinkhai ye.

V3: |
  3. Rankhaibo wang Jubilee bang khuanse 
  Kadih-tinggen ram kawan chia mide, 
  Chawang wibo haiye, thuanlo, thuanlo. (2x) 
  Masan maidung nai mili gaomai. 
  Kasimai wang maduibo si, 
  Tinggen ganbiu nai masanmai, 
  Ganbiu niu Chawang manabo dinkhai.

Translation: "(The forth told King)"

Category: "Christmas"

