ID: "184"

Title: "DETU HUIBAM RALO?"

Key: "D"

Time signature: "4/2"

V1: |
  1. Detu huibam ralo? Ringbo pui tadmai tu, 
  Chariubo saodiak jiu, Tingwang khulam bamme. 
  Pachunwi jiu tinggen wangde, 
  Jesu khuga mathak raleng.

V2: |
  2. Tad adiumi sune, siga chariubo ha; 
  Shai thiuniubo hade, kapbo di hasune. 
  Magenthiu mak sibo ki ga, 
  Jesu khuga aman bamne.

V3: |
  3. Kapjiu huibam dulo; nachun sabam dulo; 
  Lung magen thiubo hajiu tinggen wang mide. 
  Saodiak mide, malan makra; 
  Jesu khuga matha raleng.

V4: |
  4. Lung chariubo se nai, thiu kaniubo hajiu, 
  Tingtheng ringcham bamne, Rankhaibopiu senai; 
  Chariubo ten saodiak lujiu, 
  Jesu khuga aman bamne.

Translation: "(Why bereaved)"

Category: "Farewell"

