ID: "125"

Title: "TINGGEN GU ARIAK GASE"

Key: "E"

Time signature: "4/4"

V1: |
  1. He! lungsa maidung Hiuna khomlo; 
  Rapiu Khrista siniu thoidam pine.

CH: |
  (Chorus)
  Tinggen gu ariak gase, 
  Ajan raokhai mide. 
  Tinggen dih wi sera din ngam lakge.

V2: |
  2. He! Lungsa maidung Hiuna khomlo; 
  Hiuna khom mai sera sanwi mai ye.

V3: |
  3. Malum mai lengra npui di ye. 
  Malum makmai leng Khrista pui siam me.

V4: |
  4. Haibo kadih chariubo ramga.
  Matha-malabo gu I ngao makge.

Translation: "(In the book of Heaven)"

Category: "Message"

