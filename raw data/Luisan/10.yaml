ID: "10"

Title: "HE! ATU MALUANGLO, ARAPIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! atu maluanglo, a Rapiu tinggen wang; 
  Asanwibo niu, Bethlehem namdih ga, 
  Papui Mary niu mana khai ye.

CH: |
  (Chorus)
  He! achun wijiu I niu thuankiu sune. 
  Dinron tadne, a Rapiu manabo; 
  Nangsan wibo we. 
  Manabo se zat hina leng nge.

V2: |
  2. Thuanlo maihina niu Khrista manabo se. 
  Aliu ring raleng karingbo cham phungwang. 
  A Rapiu manabo kahumra, 
  Zat hina niu wang madui sukhe.

V3: |
  3. Thuanlo, maihina niu Rankhaibo piu wang nge. 
  Natu juringra mana Bethlehem ga. 
  Matha bamme, tinggen masan mai; 
  Milikhuan mai wang kahum bamme.

Translation: "(Be with me my Lord)"

Category: "Christmas"

