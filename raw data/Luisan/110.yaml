ID: "110"

Title: "PAPIU, PANAH, MASANBO HIUPUINA"

Key: "C"

Time signature: "4/4"

V1: |
  1. Pabam machang I mazuan khaijiu, 
  Tamiubo niu gomjiu chunsabo ramme.

CH: |
  (Chorus)
  Papiu, panah, masanbo hiupuina, 
  Jukhailo, nang niu lungsa khai mai nahtu, 
  Kahiambo bam gasu jupad khailo.

V2: |
  2. Nkhuan lulak akamai dungtu, 
  I maningjiu bamme, ngaodao lanra leng.

V3: |
  3. Tinggen namdih tu I mazuanjiu,
  Chalui khuan nai nchom khuan niu kangimme.

V4: |
  4. Maning soumak tinggen dih wi, 
  Thuanbo lui khuan wot niu I kalungsi ye.

V5: |
  5. Kadih ga magenthiubo saomak. 
  He! dedao niu magenthiubo ha ralo?

V6: |
  6. Chariu khengh ngam lakge, a Rapiu, 
  Atu nkha khailo, Nang niu lungsajiu.

V7: |
  7. Takum wangbo tu nkhuan lulak. 
  Takum wan wangtangjiu Khrista tu thuanra.

Translation: "(The Trinity)"

Category: "Aspiration for Heaven "

