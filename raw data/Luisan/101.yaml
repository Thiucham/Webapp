ID: "101"

Title: "NAIMIK KIUMAK ZION NAMDIH"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naimik kiumak Zion namdih, 
  Huijiu phuibam kapjiu tingmik machang. 
  Kungbo phai benjiu chawang niu rankhai; 
  Alengdi chabam seram ga bamme.

CH: |
  (Chorus)
  Maning bamme, maning bamme. 
  Pabam kawibo suangdi withubo. 
  Lungsakhai Piu Khrista lun wibose, 
  Ngai ni ye, alung chariubo saora.

V2: |
  2. Gukhaibo din ngamlakbo ram. 
  Tajai pen niu liukhaide, sibo ram; 
  Ahiuna niu charam wibo phuibam. 
  Kadih ram hai kui sangjing rabo we.

V3: |
  3. Kungbo rankhaimai lungbo ram. 
  Wangtang makra alung magenthiu we. 
  Atu piulo, Hiuna niu majanglo. 
  Chawang lung bambo ram tu maning nge.

Translation: "(Ever bright Zion)"

Category: "Aspiration for Heaven "

