ID: "44"

Title: "CALVARY CROSS GA SHAIBO SE"

Key: "F"

Time signature: "2/2"

V1: |
  1. Calvary Cross ga shaibo se, 
  Tingthengjiu ring bambo Tingwang Nah ye. 
  Maidung niu lukhai nimak Rapiu tu, 
  Tazai luangjiu cross ga shai khai ye.

CH: |
  (Chorus)
  He! Calvary, He! Calvary. 
  Lungsajiu ringbo dui luangkum khai ye. 
  Ahiuna charibo pikim khaijiu, 
  Tingtheng amanjiu lung bamne.

V2: |
  2. A Rapiu chari kimra leng, 
  Alungchun ga ringbo dui luang khai lo. 
  A Rapiu niu lungsajiu ku bamga, 
  Wangkhai sulo, ribam talo.

V3: |
  3. Sou bidi Patu malumsai, 
  Tingtheng ringbo dui pakhuga luang ne. 
  Sebo dui sak mimai hina siniu, 
  Tingtheng jengjiu ringbam sune.

V4: |
  4. Alungchun ga kidron duikum 
  Rapiu gu chariu tu sikhai makge. 
  Ahiupuina tu Paniu lungsajiu,
  Kidron dui tiujiu kukhai ye.

Translation: "(The Crucification)"

Category: "Passion week/ Good friday"

