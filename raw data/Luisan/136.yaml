ID: "136"

Title: "MAGENTHIUBO KHENGJIU"

Key: "A"

Time signature: "4/4"

V1: |
  1. Magenthiubo khengjiu, 
  I kapjiu magenthiubo ramga. 
  Dedao niu ha ralo? 
  I niu khuan ngam lak ge;
  Dedao niu chariubo haralo? 
  Rankhaimai wibo ram ga bamra.

CH: |
  (Chorus)
  He! tingtheng wibo ramga, 
  I bam ni ye, I bam ni ye, kawibo ramga. 
  Chariumai sulo, masan maidung bambo ramga. 
  Tinggen Milipoi nai bam chamne.

V2: |
  2. Kadih chariubo ram, 
  Satan ri tanjiu bambo ramga. 
  Lungbam leng chabam ha. 
  Achunsabo mikdui, 
  Luangjiu I maningbo ramwibo. 
  Masanbo Hiupuina jukhailo.

V3: |
  3. Mathabo lungsamai, 
  Tingtheng wibo ram wangtang wide. 
  Halleluyah Amen, 
  Ju ngut khailo, Tingwang: 
  Tinggen ramwibo gase bamra.
  Tinggen Milipoi nai bam chamra.

V4: |
  4. Kadih ga chariujiu, 
  Kapbo mikduise thud sang khai ne. 
  Tinggen miria siniu. 
  Pawan wangtang makga, 
  A Rapiu tu nkhuan lu lakge. 
  Shaijiu ringsu lanrabo ramga.

Translation: "(Enduring the pain)"

Category: "Heaven nature"

