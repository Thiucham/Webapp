ID: "49"

Title: "CALVARY GA LUNGSA KHAIBO SE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Calvary lunga khaibo se. 
  Pi sichia khailo, kadih riga hai, 
  Nang niu ranpad khai mainahdung. 
  Shaijiu chariubo ram ga bam.

CH: |
  (Chorus)
  He! a Rapiu namaken dibo lungsa se; 
  Madu khailo, zat hina ga. 
  Maihina chengsa kuak khaijiu, 
  Najan masanbo thuankiu bamne.

V2: |
  2. I niu magenthiujiu bambo ga. 
  Saolo, a Rapiu tu rankhaira leng? 
  Kadih ga najan dira leng. 
  Nkhakhai ramai leng ha ye.

V3: |
  3. Kadih ga kamuang tamiubo kum, 
  Tamiu wang nge, a Rapiu alung ga. 
  Piben khailo, nabiu seniu; 
  Alung charapen kum penra.

V4: |
  4. Nang tu maningjiu kap a Rapiu, 
  Lungsa maidung tingtheng jiu lung bamra; 
  Kap bambose dedao suniu, 
  Mathajiu mikdui sangralo.

Translation: "(The love on Calvary)"

Category: "Melodious praises"

