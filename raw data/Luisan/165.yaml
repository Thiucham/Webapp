ID: "165"

Title: "HAI KADIH RIGA CHARIUJIU LUNGBAM LIUDI"

Key: "A"

Time signature: "2/2"

V1: |
  1. Hai kadih riga chariujiu lungbam liudidu. 
  Pawan khat chunwi dam ngao sune. 
  Tinggen namdih ga aliu aruang bam jisune. 
  Kadihri hai kendasai.

CH: |
  (Chorus)
  Pawan khat aruangbo kum; 
  Chariubo kadihri hai kendasai, 
  Matha aruang bamne, Salem namdih gase; 
  Ramnabo bamlan lakge.

V2: |
  2. A Rapiu wang lanrabo tingmik nawang sude. 
  Pawan machang Rapiu ten thiubam khe. 
  Tuhoi aruangbo kum aruangjiu bamlan raleng. 
  Rapiu tu thuankiu bamkhe.

V3: |
  3. Tinggen Jerusalem namdih ga bammai sira, 
  Ramnabo mikdui luangbo ngao makge. 
  Paliu tingtheng Rapiu tu thuankiu jiu lungbamme. 
  Kingwibo lui thiubamme.

Translation: "(Though we live terribly)"

Category: "Heaven nature"

