ID: "197"

Title: "NTHAI TINGMIK PADBO HAI"

Key: "AB"

Time signature: "2/2"

V1: |
  1. Nthai tingmik padbo hai, 
  Aliu ramna rabo leng; 
  Maning ramna makbo ram, 
  Tingtheng lungrabo ramtu. 
  Delad niu kanui ralo; 
  Aliu ramna rabo ga, 
  Maning nge ramna makbo, 
  Tingthengjeng aman bamra.

V2: |
  2. Maning nge lungsa maitu, 
  Alung niu mangai ngam mak, 
  Detiu jiu ramna ralo? 
  Ram na rabo wan gahai. 
  Ramnane, tiubo sisai, 
  Lungsabo apui-apiu;
  Deleng atu pon gulo?
  Haibo kadih riga hai.

V3: |
  3. Tuhoi ramna rabowe, 
  I niu lungsa maidung tu; 
  Aliu niu tadbo bam ga, 
  Tingwang niu majang khailo. 
  Tuhoi ramna bam liudi; 
  Mangai dulo lungsamai, 
  Tingwang lungsa pen gasu, 
  Naikhat aruang lan sune.

V4: |
  4. Tadmide, lungsa maidung,
  Bamsulo, singnah maidung: 
  Mikdui luang jiu ram nade, 
  Saodiak jiu kemsu mide. 
  Tingwang jan ga ram nade, 
  Thiuniu dulo, lungsamai; 
  Lungsabo aphen maidung;
  Tingwang jan ga kheng bamlo.

V5: |
  5. Chawan ramliang wang dasai, 
  Maning nge lungsa mai tu. 
  Ngaodao lanra ramgunne. 
  I niu lungsa maidung tu. 
  He! Tingjingpui lem wanglo, 
  Alung chariubo gahai; 
  Pimathak khailo, alung;
  Lungsamaitu ngao makthen.

Translation: "(A day of farewell)"

Category: "Farewell"

