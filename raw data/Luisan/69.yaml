ID: "69"

Title: "HE! HALLELUYAH, TINGWANG KENDISE"

Key: "B"

Time signature: "4/4"

V1: |
  1. He! Halleluyah, Tingwang kendise. 
  Pabam machang patu thuanlo; 
  Pabam machang dibotu rao bamlo. 
  Maidung ga chalad wangdin khai lanlo.

CH: |
  (Chorus)
  Juwang khailanlo, tad maha mimai tu; 
  Jimi maitu makiang su lanlo. 
  Kadih paopiu ganbiu dibo se; 
  Lung magenthiubo ramtu thaoben khailo.

V2: |
  2. David wangh nai puiraibo Mosi se, 
  Tinggenki ga wangtang mide. 
  Tingwang Khrista Hiupuina Masanbo. 
  Phaimiu dibo nai mpui raibo piu.

V3: |
  3. Kadih nai duidi dam kamak gasu, 
  Sijiu bambo Tingwang nang nge. 
  Naimik, chahiu-chagan dung hinase 
  Napen gasu niu tadjiu ben bamne.

V4: |
  4. He! Tingwang kadibo rankhaibopiu, 
  Tingwang Khrista gu thoidam jan. 
  Kadih mai don niu kamshat Milipoi. 
  Pazai siniu kadih hai juring nge.

Translation: "(The Glory of God)"

Category: "Melodious praises"

