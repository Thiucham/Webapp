ID: "157"

Title: "CHARAPEN PENBO KUMJIU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Charapen penbo kumjiu, 
  Ringting di naikhat thiujiu, 
  Pakak khat penkhai lujiu halan nuangmi. 
  Rapiu niu pui thiukhai jiu; 
  Ringbo pui shaibo pui, 
  Oh! singna nang maning kada lulo.

CH: |
  (Chorus)
  Mainahpiu wang dasai, 
  Naimik, Chahiu, Chagan di, 
  Hakam mi sune, make mara dasai. 
  Ting kadih malai sune, zat hina niu ngaone. 
  Oh! singna nang maning kada lulo.

V2: |
  2. Mikkhip kak lung ga suniu, 
  Kadih hai kali mine. 
  Khangsia maira chunwi, khangsia chariu ne. 
  Khangsia niu taziga bam; khangsia niu chalu ga; 
  Khang khattu lu, khang khattu khaidiakne.

Translation: "(Like a Flower)"

Category: "Heaven nature"

