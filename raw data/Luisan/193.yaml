ID: "193"

Title: "I LUNGBO DIHTU I PHUTKHAI LUJIU"

Key: "G"

Time signature: "3/4"

V1: |
  1. I lungbo dih tu I phutkhai lujiu, 
  I zuan mide, tinggen ramtu. 
  Kadih ritu I ramna khailujiu. 
  Lemtad mide, tinggen ram lamse.

CH: |
  (Chorus)
  He! Tinggen rengmun gase, 
  Lungsa maidung niu khuan bamme. 
  Milipui niu benjiu bamme. 
  Tinggen khumkiibo, ringbo ngee di gase, 
  Lemtad mide, tinggen aleng nge.

V2: |
  2. Singnahmai tu I ramna khai lujiu, 
  Zuantad mide, tinggen dih lam; 
  Kadih mainah tu phutkhai lujiu, 
  Lemtad mide, tinggen ram lamse.

V3: |
  3. Kadihri wi tu soukhai diak lujiu; 
  Lungwi singkhiubo hinadi. 
  Senlan hinadi saokhai diak lujiu. 
  Lemtad mide, tinggen ram lamse.

V4: |
  4. Aringting hai ringbo ringting thiujiu;
  Ringbo singbang ga mathara, 
  Ringbo kikhun ga I wang lung raleng, 
  Lemtad mide, tinggen ram lamse.

Translation: "(I shall leave this world)"

Category: "Farewell"

