ID: "92"

Title: "NANG KENDIBO RAM I WANGSAI"

Key: "C"

Time signature: "4/4"

V1: |
  1. Nang kendibo ram, I wangsai, 
  Kamasan mai tinggen maidung se nai 
  Tacheng samai madui; 
  I di karingbo se lulu suma?

CH: |
  (Chorus)
  Tamiubo ga I bamme; 
  A Rapiu maluanglo. 
  Karingbo gu takhun gase, 
  I niu nang ram ga wangtang lu suma?

V2: |
  2. Nang kendibo ram, I wangsai, 
  Kadih ga magenthiubo naih kapbo, 
  I maninglan lakge. 
  Kawibo ram ga lung aruang bamne.

V3: |
  3. Kapbo kadih chariubo ga, 
  Matha-malabo gu I ngao makge. 
  A Rapiu se makjiu, 
  Alung chariubo kuak khaira ha ye.

V4: |
  4. Tinggen ram tu I maningjiu; 
  Kadih rihga achunka wangmak ge. 
  Amaningmai bam ga. 
  Wangra nkhuan lulak ge, a Rapiu.

Translation: "(When I reach your Glorious land)"

Category: "Aspiration for Heaven "

