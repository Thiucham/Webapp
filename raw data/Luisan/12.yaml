ID: "12"

Title: "KHRISTEN MAI MATHALO"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Khristen mai mathalo, Hiupuina nai nalung. 
  Kinglo acham kasan wibo we. 
  Thai nai Jesu mana ye. 
  Khouring dungdi mathalo, 
  Khouring kuang ga bambo wang se. 
  Khrista mana ye (2x)

V2: |
  2. Khristen mai mathalo, Hiupuina nai nalung, 
  Kinglo tingtheng ringjiu thuanbo lui.
  Thai nai Jesu mana ye.
  Lekhai de, tinggen kham se;
  Chamai hina ringrabo leng: 
  Khrista mana ye. (2x)

V3: |
  3. Khristen mai mathalo, Hiupuina nai nalung, 
  Naliu dung manaibam rabo leng, 
  Juringra Jesu mana. 
  Paniu mathiu tu ku ye. 
  Tinggen ramga ngutrabo leng. 
  Nangtu rankhai ye. (2x)

Translation: "(Christian be happy)"

Category: "Christmas"

