ID: "108"

Title: "HE! A RAPIU I LUNG MAGENTHIU"

Key: "BB"

Time signature: "2/4"

V1: |
  1. He! a Rapiu I lung magenthiu, 
  Kasabo niu kam mariu bam;
  Kapjiu hui tamiubo ram ga, 
  Kapbo mikdui luangjiu I phiuwang.

CH: |
  (Chorus)
  He! a Rapiu I chariubo hina, 
  Naben ga I pikhai kamde.
  Lung chariubo mathak khaipiu. 
  Atudi pi matha khai lanlo.

V2: |
  2. A Rapiu alung manon raleng.
  Nang makjiu mathara lengha. 
  Sao khuga I zuanwang ralo? 
  Nang nge, atu matha khairabo.

V3: |
  3. Chariubo niu kamuang kum tamiu. 
  David leng karingbo Nang nge. 
  Magenthiu mai atu lulo; 
  Nuan kaphung mainah I zuanwang nge.

V4: |
  4. Dadao Canan ramluang ga lungjiu, 
  Lung magenthiu mai nahdung niu 
  Natu thuanjiu matha bamra. 
  Achunwi kachangbo se Nang nge.

Translation: "(Oh! Lord I am in distress)"

Category: "Aspiration for Heaven "

