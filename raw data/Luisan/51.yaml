ID: "51"

Title: "RENGLINA KUM I LEMSI SAIRA"

Key: "DB"

Time signature: "4/4"

V1: |
  1. Renglina kum I lemsi saira.
  A Rapiu shaibo luangse phuine. 
  Siga atu rankhaibo bamme, 
  Pakhu ga luang padbo zai tuse; 
  Lungsabo phainoi niu thud sang ne.

CH: |
  (Chorus)
  He! Calvary, He! Calvary, 
  Nawangh tu genkhai mibose. 
  Sulujiu genkhaibo thad padlo; 
  Pajai masanbo tu thud sanglo.

V2: |
  2. Kidron giuki nangdi sulujiu, 
  A Rapiu charibo sak khailo. 
  Joukhiang seniu Pacharih kimlak, 
  Sulujiu pajan masanbo ga, 
  Tadui manonjiu luangwang khailo.

V3: |
  3. Atu maningjiu charih saira, 
  Kidron tiujiu atu ku bamlo. 
  Karai gase sakrabo gu ye. 
  Natu maningjiu charih saira, 
  Tadlujiu tadui pisak khai ne.

V4: |
  4. I tadliudi degu thiuralo, 
  A Rapiu chari kimkhai raleng, 
  Alungga wadi sibo ha ye. 
  Tadlujiu Calvary luang lamse, 
  Pazai masanbo tu thud sanglo.

V5: |
  5. Calvary naih he! Jerusalem 
  Mariabo a Rapiu tu phuilo. 
  Aliu chengsa donniu chariu ye. 
  Sulujiu genkhaibo thad padlo; 
  Tinggen Milipoi shaibo naise.

Translation: "(If I could fly like hornbill)"

Category: "Melodious praises"

