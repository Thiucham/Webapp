ID: "132"

Title: "TAMIU RAMGA LUNGSA MAINIU"

Key: "E"

Time signature: "2/4"

V1: |
  1. Tamiu ramga lungsa mainiu; 
  He! Jehovah jukhaipiu tu maning nge. 
  Tinggen pumtan niu chari thiune. 
  Tingjingpui niu kawi pikhaijiu. 
  Paken dibo lui thiu.

CH: |
  (Chorus)
  He! I bambo ramse tamiubo ramme. 
  Malan wanglo zat kathiu hina ga. 
  Chariubo kheng ngam maidungse. 
  Ringbo namdih tu wang ngoune.

V2: |
  2. Wangben khailo, chahiu-chagan: 
  Rankhaibo biuse niu benwang khai lanlo. 
  Dadao Canan ga jukhaibo kum, 
  Nang ringbo takhun wibo gase. 
  Chengsa khiu masanlo.

V3: |
  3. Nangniu lungsa khaibo don ga, 
  Kadih ringa lung magenthiu bam liudi, 
  Charipon piujiu chari thiune.
  Calvary lungsa tu malum mai, 
  Satan ritu ngamne.

Translation: "(Here by dear ones)"

Category: "Heaven nature"

