ID: "148"

Title: "TAKUM CHAHIU TAD BAMME"

Key: "E"

Time signature: "4/4"

V1: |
  1. Takum chahiu tad bamme. 
  Mathabambo tingmikdi, 
  Nabiu wibo Kadih rapen se. 
  Alung chariubo naih kapbo ronna ye.

CH: |
  (Chorus)
  He! atingtheng namdih amanbo ga,
  Rankhai mainah bambo ram tu maning nge. 
  Lung chariubo naih kapingbo, 
  Bamlan lakge, kabenbo ram gase.

V2: |
  2. Mathabo ting nawangde.
  Kadih rapen wibose, 
  Kadih ga mathabo kuimide. 
  Tingtheng rapen ram wibo tu maning nge.

V3: |
  3. Kadih magen thiubo nai, 
  Tamiubo niu deng namme. 
  Kadih ga kapbo nai ahuibo, 
  Thuandiak jiu Lungsamai naih bam aruangne.

V4: |
  4. Atu gulo a Rapiu; 
  Magen kathiubo I ye. 
  Pui ngut khailo, naram wibo ga. 
  Magen thiubo tu I maning lanlakge.

Translation: "(Going by and by)"

Category: "Heaven nature"

