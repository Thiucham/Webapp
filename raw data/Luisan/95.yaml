ID: "95"

Title: "NKHUAN BAMME, A RAPIU "

Key: "BB"

Time signature: "2/4"

V1: |
  1. Nkhuan bamme, a Rapiu, 
  Kadih tamiubo ramga. 
  Atu phiu ye, Salem ga, 
  I ra wangbam mide. 
  Kadih ga chariubo tamiubo ramga su niu, 
  Lungsajiu atu phiu we, 
  I maning talakge.

CH: |
  (Chorus)
  Tinggen Eden namsan wibo, 
  Lung magenthiu makbo ram ga;
  Dedou suniu wangtang ralo,
  Nang tingtheng benbo nai amanbo ramga.

V2: |
  2. Nawanglo, Rankhaibopiu, 
  Kadih ga chari tanne. 
  Nazai niu rankhai maidung, 
  Chariujiu kap bamme. 
  Kadih ga lungbam dao, 
  Nalung pubo Calvary;
  Nahri maidung nawang nge, 
  Nang tu aphen maidung.

V3: |
  3. He! degalo, Rankhaipiu? 
  Zion luangbut wibo ga. 
  Nuan hina khiu masanra, 
  Najai luangkiu khai ye. 
  Nuan masanbo ramme, 
  Tingtheng namdi wiboga.
  Nang rankhai mainah dungtu, 
  Napam gase bamne.

V4: |
  4. Kadih hai harabo we,
  Pakendibo hina se. 
  Rankhaipiu niu khom sune, 
  Chamai hina dungtu. 
  Khrista niu lungsamai, 
  Pakendibo lu sune. 
  Rankhai mai nahdung thuanjiu senlo, 
  Halleluyah.

Translation: "(Lord, I am waiting)"

Category: "Aspiration for Heaven "

