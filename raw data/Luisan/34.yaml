ID: "34"

Title: "A RAPIU KHENGHBO MANINGSAI"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu khenghbo maningsai, 
  I kapmak dao lakge.
  Paju kaphibo nai lek lujiu marubo, 
  Maning dao sai I kapjiu chalui thiu.

CH: |
  (Chorus)
  Dejiu thiulo, Rankhaipiu se (2x)
  Kadih tu rankhaipiu maluang lam ju tadde.
  A Rapiu mariaye, chariu liudi.

V2: |
  2. Judah mai kawi thiura ha;
  Maningjiu bamliu di; 
  I maning kam lak ge, a Rapiu maria se 
  Aliu chengsa don niu magenthiu we.

V3: |
  3. Rankhaipiu shai, maidung chunwi; 
  Chunsa maidi bamme. 
  Kapjiu papum tuse ponlujiu kareng lam, 
  Charaw ga phum khai de, a Rapiu tu.

V4: |
  4. Sulan mide, a Rapiu se;
  Amanbo ram zuanra.
  Olive luang rihgase kamuang niu puilujiu, 
  Amanbo ram zuan de, a Rapiu se.

V5: |
  5. Amanbo ram nang zuanbo nai, 
  Kadih tingjing mide. 
  Malan wanglan railo, kadih chariubo ga,
  Rankhaibo cham dinjiu matha bamra.

Translation: "(If the Lord's endureness be recalled)"

Category: "Passion week/ Good friday"

