ID: "35"

Title: "CALVARY LUANGGA A RAPIU TU"

Key: "EB"

Time signature: "2/3"

V1: |
  1. Calvary luangga a Rapiu tu, 
  Cross ga tathu pirun nai; 
  Maidung niu nuirabo leng, 
  Tasing rihga maseng khai.

CH: |
  (Chorus)
  He! dejiu thiulo, a Rapiu khengh bose, 
  Paphi-paben, papi phuilo; 
  Chengsa jeng gasu ka masanbo jai 
  Luangpad khai ye. 
  Lungsa thubo piu se.

V2: |
  2. Shaira leng chari bambo wan ga. 
  Maikhat di pini makge. 
  Pah rimaidung niu rejiu; 
  Chari lenghlak jiu shaide.

V3: |
  3. Chari ye, tiujiu khenghbo wan ga, 
  Khiangbo dui pisak khai ye. 
  Khiangbo dui niu kim lak ge, 
  Hiupuina leng charibo.

V4: |
  4. Hiupuina rankhaibopiu jaise, 
  I niu dinsi lulakge, 
  Tadlujiu Calvary ga, 
  A Rapiu ga maniulo.

Translation: "(It's the Lord on Calvary)"

Category: "Passion week/ Good friday"

