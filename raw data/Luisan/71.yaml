ID: "71"

Title: "PAJAN ZION "

Key: "E"

Time signature: "2/4"

V1: |
  1. Pajan Zion tiubo ram wibo, 
  Maningjiu naimachang I phui; 
  Siga lungra jukhailo. 
  Kawibo ram gase.

CH: |
  (Chorus)
  I maningnge Rankhaibopiu tu; 
  Lily rapen Immanuel. 
  Kawibo ringlandui luang. 
  Maning nge, Rankhaipiu tu.

V2: |
  2. Kasa kahiambo ri niu tanne. 
  Chariujiu aliu aphenra. 
  Tinggen Hiupuina kiulo; 
  Aliu tu gukhaira.

V3: |
  3. Magenthiubo saorabo bam ha; 
  Haibo dih chariubo ramme. 
  Jat hina wang maduine, 
  Tinggeng Canan ram ga.

V4: |
  4. Calvary luang singchai ringa se, 
  Kheng khai ye, a Rapiu Jesu. 
  Rankhaibo ten loi lujiu. 
  Halleluyah, Amen.

Translation: "(The Zion)"

Category: "Melodious praises"

