ID: "62"

Title: "I SULANJIU APIU KHULAM WANGLAN MIDE"

Key: "G"

Time signature: "4/4"

V1: |
  1. I sulanjiu a piu khulam wanglan mide, 
  Asuang ga kamuang tamiu ye. 
  Atu lungsa khaira maiha ye, kadih ga, 
  Apiu makbo dung arih ye.

CH: |
  (Chorus)
  I niu majomjiu maodi, 
  Pah chakhiuky limak. 
  Malanjiu phiuwang saira, 
  Pahsuang ga bam lanne.

V2: |
  2. Apiu khuga rangkang-chalan npi makge, 
  Lung chariumai tu lungsa bam. 
  Apum ruangjiu mariujiu I shaira kumme. 
  Dedon niu tadmariu bamlo?

V3: |
  3. Apiu khuga lungbambo wan dejiu wilo. 
  Kadih ga amanbo chang nge. 
  Tura a Piuki dihse I maning taojiu, 
  Alung lijiu wanglan mine.

V4: |
  4. I achengsa mailad piumak maitu raomak. 
  Aleng chabam daolu saira, 
  Kadih rapen tu I ra maninglan lakge. 
  Karingting hai dunju mi ye.

Translation: "(I'll arise and go to my Father)"

Category: "Melodious praises"

