ID: "96"

Title: "A RAPIU NIU LUNGSA MAIDUNGSE"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu niu lungsa maidungse, 
  Pawan machang nkhuan bamme. 
  Debo nai niu mathabo tingmik, 
  Wibo atu aliu wang ngao ralo.

CH: |
  (Chorus)
  He! a Rapiu tingtheng luang riga. 
  Sikam lakbo masan mai nai; 
  Ganbiu kumjiu wang sanben khai lujiu, 
  Sigasu kadih hai sao diak ne.

V2: |
  2. Nawang su dama, a Rapiu ram? 
  Rankhaipiu tu nkhuan lulak. 
  Patu thuanbo lui thiu raleng naih, 
  Pengphai ponra nkhuan lulakge.

V3: |
  3. Nah maidung bambo giugen lamse. 
  Ringbo singbang sungtu zuanjiu. 
  Akan bamjiu lemsi lusaira, 
  Kadih chariubo maning lakge.

V4: |
  4. Nawang bamlo, zat hina wangpiu. 
  Kawi janra leng phung lujiu, 
  Npui kawibo ga daora leng; 
  Jerusalem malan thuan bamlo.

Translation: "(Peoples of the Lord)"

Category: "Aspiration for Heaven "

