ID: "134"

Title: "I BAMBO RAM TU NING JIU CHUNSA YE"

Key: "G"

Time signature: "2/4"

V1: |
  1. I bambo ram tu ningjiu chunsa ye, 
  Lungni alon marabo ram, 
  Alung ga hai rankhaipiu lungsa tu. 
  Maning bamme, pabam machangna ga.

CH: |
  (Chorus)
  Malan wangne, Rankhaipiu nakhuga; 
  Lungsajiu athoi hina lukhailo. 
  Saomakjiu naten thiujiu lung bamne.

V2: |
  2. Ramnabo hai, Rapiu piha khailo. 
  Mangai lakge, kakungmai tu. 
  Aliu lungbo ram charapen kumjiu, 
  Kuikam mide, kadihri ringting hai,

V3: |
  3. Kapjiu hui ye, Rapiu nang ram tuse. 
  Lemsi saira I lem mine. 
  Tingkum sang sang I lem rontad lujiu, 
  Lemtad mine, Tingwang pam zuanra leng.

V4: |
  4. Malan wanglan lakge, haibo dih ga; 
  Rapiu tu zuanjiu tad mine. 
  Nthingna kum akan hai thiu lujiu; 
  Lemtad ne, tinggen Salem namdih ga.

Translation: "(Compassionate land of mine)"

Category: "Heaven nature"

