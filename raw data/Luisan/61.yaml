ID: "61"

Title: "CHARI THIURA KADEN KHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Chari thiura kaden khailo; 
  Tingwang Jesu, 
  Duidi genlam tamiubo ram, 
  Charui rimai tu ngamra.

CH: |
  (Chorus)
  Tazai gu pengphai chari suang lam ponlo. 
  Aliu chawang riphen sao mane, 
  Kasabo ri tan bam liudi.

V2: |
  2. Kahiambo charidung suang aliu kendi ye. 
  Tachengsa maidung ri madui. 
  Ngamne, Zion riphen niu.

V3: |
  3. Nuan gu chari hai tazai penniu ngam sune. 
  Kadih hai thaoben chia khaine. 
  Khrista khengkhaibo donniu.

V4: |
  4. Dibo pirun lu machang ne riphen dung niu. 
  Thuan ne, chom nai make thinjiu, 
  Tinggen Zion namdih ga.

Translation: "(Be prepared for the battle)"

Category: "Melodious praises"

