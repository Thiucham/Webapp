ID: "109"

Title: "KAPJIU KAHUIBO NAI LUNG CHARIUBO HA"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Kapjiu kahuibo nai lung chariubo hade: 
  Tinggen Salem namdih ga lung maidung. 
  Kasa ri tu ngamjiu shaibo bam lanlakge.
  He! thuanbo lui thiu bamne. Thuanbo lui thiu bamne. 
  Kasa ri tu ngamjiu, (2x)
  Shaibo bam lan lakge. He! thuanbo lui thiu bamne.

V2: |
  2. Haibo dih I phuijiu, chariubo niu gom bam. 
  Magenthiu mai nahdung huijiu bamme. 
  Mathabo tingmik se hawang kalang sude. 
  Amanbo ram tu maning. Manbo ram tu maning.
  Mathabo tingmik se, (2x)
  Hawang kalang sude. Amanbo ram tu maning,

V3: |
  3. He! Nazai pen niu tinggen ram ga I ngutne. 
  Duidi genlam kungmai machang bam. 
  Siga majang ngut khailo, masan maidungga. 
  He! I bam aruang ni ye, I bam aruang niye. 
  Siga majang khailo. (2x)
  Masan maidung khuga. He! I bam aruang niye.

V4: |
  4. Salem nam wibo ga, I wang kalang niye. 
  Tinggen masan mai nai rankhai maidung. 
  Chawang bamga kalen kin thiujiu chalui thiu. 
  He! Halleluyah tiujiu, Halleluyah tiujiu. 
  Chawang bam ga kalen, (2x)
  Kinthiujiu chalui thiu. He! Halleluyah tiujiu.

Translation: "(No more weeping and worry)"

Category: "Aspiration for Heaven "

