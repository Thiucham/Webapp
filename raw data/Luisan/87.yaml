ID: "87"

Title: "ALIU RAPIU TINGWANG KENDI THUANKIU LO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Aliu Rapiu Tingwang kendi thuankiu sukhe. 
  Pabam hina gasu wang aruangjiu. 
  Rankhai raleng wangkhai mi sukhe aliu dung; 
  Patu thuanlo, aliu Rapiu si de.

CH: |
  (Chorus)
  Matha sukhe, nacham chiulumai hina. 
  Calvary luang gasu niu ranpad khai mibo we. 
  Senjiu aliu Wangh thuan sukhe.

V2: |
  2. Kadih ram ga Tingwang lungsa simakmai niu. 
  Pabam machangna ga kengjiu bamme. 
  Thonpad milo, nagu kasabo hinase. 
  Aruang lujiu Patu kahum sukhe.

V3: |
  3. Nthai naleng nge, suan naira Tingwang gu we. 
  Chalung tanbam maidung thuanpad milo. 
  Wangkhai milo, Pagu lungsa renglung gase. 
  Tinggen ram tu mazuanjiu tad sukhe.

Translation: "(Praise the glory of God)"

Category: "Melodious praises"

