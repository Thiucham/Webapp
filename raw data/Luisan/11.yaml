ID: "11"

Title: "CHAWANG MATHABO TINGMIK GA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Chawang mathabo tingmik ga,
  Tuhoi I wang lanne. 
  Tadlu ye sai Bethlehem nam khen ga, 
  Tinggen mai lui thiu we.

CH: |
  (Chorus)
  He! nang Bethlehem I dejiu hui gulo.
  Naluang rihga puiraibo ganbiu se, 
  I niu kapjiu phiuwang nge, 
  A Rapiu manabo ram tuse.

V2: |
  2. Maning lakma sibo ram tu? 
  A wang manabo ram, 
  Caeser chawang thiu bambo wan gase, 
  A wang ngenah kum kap.

V3: |
  3. Wangphui khailo, masan maidung, 
  Nang masenbo Jesu. 
  Mana wang nge, magenthiu maidung leng.
  Siga lung aruang ne.

V4: |
  4. Manai bamlo milikhuan mai, 
  Lungsabo ga bamlo. 
  Lungpu makbo gu chagan rilam se, 
  Aliu lung aruang ne.

Translation: "(At His gladsome day)"

Category: "Christmas"

