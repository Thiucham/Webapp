ID: "128"

Title: "TINGWANG KATANA NGAMBO PIU"

Key: "Ab"

Time signature: "4/4"

V1: |
  1. Tingwang katana ngambo Piu, 
  Alung tamiubo pi benlo. 
  Hiuna Masanbo dui luangkhai: 
  Kapjiu kahui bambo ga hai.

CH: |
  (Chorus)
  Tinggen Hiuna Masanbo. 
  Malum makmai lungchun tu, 
  Nuan niu phuibo lungse, 
  Chami niu ru thon khailo.

V2: |
  2. Kadih gu cheng tu maninglak. 
  Rapiu shaibo tang lukhaijiu, 
  Karaidao ringbo maidung nai, 
  Tingthengjiu mathabo ngao ne.

V3: |
  3. Israel mai niu chalad thiu jiu, 
  Tenjiu bam a Rapiu rihga. 
  Egypt ga bambo maningsai, 
  Ramjing ga maihina shaine.

V4: |
  4. Lungsa khailo, Rapiu Jesu 
  Ringrabo npui pikhailo. 
  Rapiu ten maningjiu tenbam 
  He! lungsa khailo a Rapiu.

Translation: "(God of Almighty)"

Category: "Prayer"

