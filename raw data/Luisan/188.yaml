ID: "188"

Title: "MALUANG HINA RIM RIM MIDE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Maluang hina rim rim mide, 
  Wahina nchungjiu. 
  Lungsa simakbo pawan niu, 
  Ramna khai aliu tu.

CH: |
  (Chorus)
  Ramna khaijiu I kap bamme; 
  Atu soudiak khaijiu, 
  Pawan niu phungwang mi jengniu, 
  Khat khattu ramna ye.

V2: |
  2. Maning ngam mak singnah maidung 
  Kanui khai mikdui niu; 
  Tingna kum mariu singhang ga, 
  Lemtad jiu hamide.

V3: |
  3. Ramna khaide lungsamai tu; 
  Tad mide pawan hai; 
  Tadmibo tadui kum bamdi, 
  Naikhat luang aruang ne.

Translation: "(The mountains still)"

Category: "Farewell"

