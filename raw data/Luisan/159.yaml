Title: "A WANG LUNGBO RAM KAWIBO"

Key: "D"

Time signature: "4/2"

V1: |
  1. A wang lungbo ram kawibo. 
  Rankhai maidung matha bambo Salem renglung. 
  Tinggen mai naih masan maidung lungbamme.

CH: |
  (Chorus)
  He! {Halleluah (3x)}
  Tiujiu Thuanbolui thiu-e, 
  Tad rai maidung.

V2: |
  2. He! a Rapiu niu khengbo bam. 
  Calvary mana wang lanlo, hiupuina leng 
  Nawang lo, Calvary siangkhaibo bamse.

V3: |
  3. Ahiupuina sega tadlo. 
  Wang mathalo, a Rapiu niu damkhaibo ga; 
  Pamnah dung kumjiu kapbo bamlan lakge.

Translation: "(The Beautiful Kingdom)"

Category: "Heaven nature"

