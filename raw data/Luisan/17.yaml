ID: "17"

Title: "A RAPIU GUKHAIBO CHAWANG"

Key: "G"

Time signature: "4/4"

V1: |
  1. A Rapiu gukhaibo Chawang. 
  Mathiunah niu thuanjiu bamkhe, 
  Mathajiu bam aruang lanra, 
  Palungsiat niu aliu tu gukhai.

CH: |
  (Chorus)
  Aliu thuanjiu bamkhe, Chawang dibo tu, 
  Paniu gukhaibo jeng gasu. 
  Ramna mibo akamai naih 
  Mathajiu wang ngao aruang lande.

V2: |
  2. Khrista jan gasu singnahmai, 
  Naliu lun ngaora ramgun ne, 
  Aliu tu daobo welcome ga 
  Nchom khon niu aliu lung luanne.

V3: |
  3. Aliu tu daobo lui wise, 
  Tinggen lam kawan chia milo. 
  Kadih nai tinggen maidung niu. 
  A Rapiu tu thuanjiu thiu chamlo.

V4: |
  4. Loibo nai sedi haitiujiu,
  Tinggen masan mai niu daolo; 
  Tinggen maza lemkiu khai lo;
  Aliu lung kiu kam marak khailo.

V5: |
  5. Ngaotang makbo ramlam suniu,
  Amaning maitu ngao lan de. 
  Tingwang tu thuanbo lui thiulo;
  Pajan masan di bamlo, Amen.

Translation: "(My Lord, King of Redeemer)"

Category: "Christmas"

