ID: "31"

Title: "JERUSALEM WANJENG CALVARY LUANGGA"

Key: "DB"

Time signature: "4/4"

V1: |
  1. Jerusalem wanjeng Calvary luangga, 
  Rankhaipiu tu genkhaibo singchai bamga, 
  Masanbo Hiupuina niu luangkhailo.

CH: |
  (Chorus)
  I ngao ni ye, Rankhaibopiu tu, 
  Paphi-paben natari jam phungjiu. 
  I chengsa mai jeng gasu shai ye.

V2: |
  2. Judah maidung nai phaimiu kadimai niu, 
  Chamai thiumakjiu ju Zion renglung ga. 
  Siangkhaibo singchai rihga gianman khai.

V3: |
  3. Wang phuilo, atu Rankhaibopiu maria; 
  Chariu hina khengh nge, tinggen milipoi. 
  Shaibo ri niu kam mariujiu bamme.

V4: |
  4. Tinggen namdih ga masan maidung nchung. 
  Tingwang nah chariu khenghbo phui
  ngam mai ha; 
  A Rapiu shaibo nai kadih tamiu.

Translation: "(On Calvary at Jerusalem circle)"

Category: "Passion week/ Good friday"

