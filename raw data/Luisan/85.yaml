ID: "85"

Title: "HE! A RAPIU TINGWANG HE! JEHOVAH"

Key: "A"

Time signature: "6/6"

V1: |
  1. He! a Rapiu Tingwang, he! Jehovah. 
  Satan niu atu bangkhai bamga hai, 
  Nang lungsa khaibo nalad pen gasu. 
  Ranpad khaide, chiujiu wangdin khailo. 
  Nang niu lungsa khaibo lad hai 
  Alung niu mangailak a Rapiu. 
  Tinggen nai kadih maidung niu.

V2: |
  2. He! a Rapiu nang thoidam khaibo tu, 
  Zat hina niu kungjiu maning bamlo. 
  I nahmai kumjiu kapjiu huibam ga, 
  Naram wise akhu nawang khailo. 
  He! Jesu hai aleng nge sai; 
  Kaki masenra ha a Rapiu. 
  Naimachang Jesu aleng nge.

V3: |
  3. Tingkum sang sang ringabo phiu liudi, 
  Adao makge, tamiubo ronna ye. 
  Kadih mathabo nai pakendi bo, 
  Phiu dao liu di pawan tingtheng mak ge. 
  Alengra Jesu ronn ye. 
  Takum machang wi nkiu bibi. 
  Tingkadih ga kungthubo we.

Translation: "(Oh! Lord God, the Jehovah)"

Category: "Melodious praises"

