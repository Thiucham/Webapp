ID: "196"

Title: "LIU LUNG CHARIUBO THIUDU KHE"

Key: "DB"

Time signature: "4/4"

V1: |
  1. Liu lung chariubo thiudu khe, 
  Jesu tu malum maidung. 
  Naikhat ringbo dao lan lujiu, 
  Jesu khuga wangbam mine.

CH: |
  (Chorus)
  He! pawan khatna leng nge. 
  Aliu ramna mira leng; 
  Mailung makge, kakung maidung yo. 
  Tingwang jan ganiu wijiu tadlo.

V2: |
  2. Thainai tingmik ramna liudi, 
  Chunsha dulo kakungmai;
  Nachunwijiu naniam wijiu, 
  Tad khaisulo kakungmai yo.

V3: |
  3. Rapiu wangra tu khuan bamlo, 
  Tinggen wang nai kadih wang: 
  Rankhai maidung tu majang ra, 
  Kawangbo nainiu daolan ne.

Translation: "(Let's be not weary)"

Category: "Farewell"

