ID: "70"

Title: "HALLELUYAH, HE HALLELUYAH AMEN"

Key: "G"

Time signature: "4/4"

V1: |
  1. Halleluyah, he! Halleluyah Amen. 
  Calvary lungsabo pen ganiu. 
  Kapbo nai tamiu chariubo ramga. 
  Mathabo tinggen ram niu benwang.

CH: |
  (Chorus)
  Mathabo kuilakge, Halleluyah halleluyah.
  Thuanjiu bamne, Milipoina situ, 
  Palungsiat niu magenthiubo ha.

V2: |
  2. Tinggen masan mai nai mathabo wanglo. 
  Kadih tamiu ramga lung maidung. 
  A Rapiu tu thuanra Halleluyah.
  Nang bamse paliu tinggen thiune.

V3: |
  3. Tingthen chariubo ram halu dasaira, 
  Matha-kawibo, saronpen wi. 
  Tingthen jeng pen bamne kuilan makjiu; 
  Natu I maning nge, jukhailo.

V4: |
  4. Kadih mai niu silo, Tingwang ram tuse, 
  Tinggen masan maidung matha bam 
  Calvary Milipoi lungsa siniu, 
  Natu thuanjiu thiune, tingtheng jeng.

Translation: "(Halleluyah Amen)"

Category: "Melodious praises"

