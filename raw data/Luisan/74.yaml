ID: "74"

Title: "NKHAM LE BAMDE"

Key: "B"

Time signature: "2/2"

V1: |
  1. Nkham le bamde; 
  Lungsa maidung wanglo. 
  Sibo ramga wanglo.

CH: |
  (Chorus)
  He! lungsa maidung, 
  Napiu niu natu ku we, 
  Chiujiu lungsa maidung wanglo.

V2: |
  2. Jesu kiu sune; 
  Naliu leng kiu sune. 
  Ganbiu kum wang sune.

V3: |
  3. Kadih tamiude;
  Chariubo kuak sune.
  Kaden sijiu bamlo.

Translation: "(The door has opened)"

Category: "Melodious praises"

