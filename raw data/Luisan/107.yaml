ID: "107"

Title: "THUANBO LUI THIUNE, ATING LOIBO NΑΙ"

Key: "E"

Time signature: "2/4"

V1: |
  1. Thuanbo lui thiu ne, ating loibo nai; 
  Tangjiu naleng pakendibo.
  Sikamlak maileng kapbo niu. 
  Chariu bamdi khenghlo, Chawang suangga.

CH: |
  (Chorus)
  I ngao ne, ating loibo nai; 
  Palep machang raokhaibo nuan mai rihga. 
  Nalungsa niu alung chariu makge.

V2: |
  2. Eden tingjingbo ga nahmai kum kap. 
  Naram wibo I tang dasai, 
  A nuan hai kabun suang ka ne. 
  Chawang Immanuel lungbo ramga.

V3: |
  3. Lungsa gu kasanbo ramse phuilo. 
  Pating pawan naimik kasan. 
  Hiupuina lung pilon khailo. 
  Maisuang habo tingben patkhai lanlo.

Translation: "(I shall sing a song of prraise)"

Category: "Aspiration for Heaven "

