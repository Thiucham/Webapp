ID: "94"

Title: "LUNG KA MAGENTHIUBO RAM GANIU"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Lung ka magenthiubo ram ganiu, 
  Nkhuan bamme, I mikdui luangjiu. 
  Saomakjiu a Rapiu maluanglo. 
  Zat hina charapen kumjiu penra.

CH: |
  (Chorus)
  He! lem wanglo natu maning nge. 
  Calvary ga nang lungsa khaibo. 
  Pengphai kajitlo, aliu rihga, 
  Zat hina charapen kum penra leng.

V2: |
  2. Nang ramwibo I ngao bam liudi, 
  Nang makjiu I lung aman lakge. 
  Pamna kumjiu I niu kap bamme; 
  Maihina lungga nang wangben khailo.

V3: |
  3. Chengsha niu atu gomnam liudi, 
  Tamiujiu shaibo bam ga bamdi, 
  Karingbo Hiupuina pikhailo; 
  Nalungsa niu charapen kum penra.

V4: |
  4. Chengsha don gasu tinggen pirun; 
  Ka magenthiubo bamga wangjiu, 
  Ting-kadih ga nang chamlam khaibo,
  A Rapiu suangga charapen kum pen.

Translation: "(From the world of tribulation)"

Category: "Aspiration for Heaven "

