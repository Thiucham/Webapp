ID: "106"

Title: "RINGBO NPUI RAPIU KHUGA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Ringbo npui Rapiu khuga, 
  Lungsajiu natu khon bamme. 
  Natu kuwe, pawan hade; 
  Wang maidung tu lukhai sune.

CH: |
  (Chorus)
  He! delamlo tingggen ramse? 
  Lemsijiu I lemtad lusai. 
  I wadaodi malan lakge. 
  Naikhat I wangtang mi sune.

V2: |
  2. I maningbo ram wibo bam; 
  Debo nai niu wangtang ralo? 
  Tingtheng Zion ram wiboga,
  Thuanjiu bamne, tingtheng jengjiu.

V3: |
  3. Khrista lupuk min majin bam. 
  Gerabo leng Khrista wangne. 
  Pawan hade, kiuji sune. 
  Nang kadenlo, pawang hade.

V4: |
  4. Phuilo, Calvary singchai ga, 
  Papum tu se matha pikhai, 
  Nuan phungbo aleng jeng ganiu, 
  Chariu khenghjiu jai luang khai ye.

Translation: "(The way of life in the Lord)"

Category: "Aspiration for Heaven "

