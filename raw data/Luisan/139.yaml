ID: "139"

Title: "RINGNGA DE TUHOIRA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Lung magenthiubo niu atu gom bam.
  Shaibo puiga luang ngut. 
  Malummai karingbo lune; 
  Rankhaibopiu niu kubam.

CH: |
  (Chorus)
  Ringnga de, tuhoira aliu dung. 
  Rankhaipiu lungsa niu tacheng wibo, 
  Ahiupuina tu rankhai de.

V2: |
  2. Milipoi bambo ram wangtang dasai, 
  Mathajiu adaone. 
  Shaibo Jodan kenpad dasai, 
  Tinggen ga wang bam sune.

V3: |
  3. Mathabo lungchun wibo hinase, 
  Jesu niu pibo we. 
  Kadih ring ngabo suang di ye, 
  Tinggen mathabo dungse.

Translation: "(The joyful moment)"

Category: "Heaven nature"

