ID: "39"

Title: "MILIPOI CHENGSA PHUNG PIUTU"

Key: "BB"

Time signature: "4/4"

V1: |
  1. Milipoi chengsa phung Piu tu.
  Kam shatra leng maluang lam ju tad le. 
  Palung chariu tu khakhaira mai ha; 
  Kasa daopiu tu.

CH: |
  (Chorus)
  He! a Rapiu chariu khakhaira mai ha; 
  Calvary luanglam zuanjiu luang tad le. 
  Maipui-mainah lung magenthiu, 
  Kapjiu malan ne.

V2: |
  2. Kamshat rabo luang wang tang de. 
  Phuilo, a Rapiu tu detiu ralo; 
  Paphi-pabense singchai ga genkhai. 
  Pah rimai chunwi.

V3: |
  3. Phuijiu nuirabo leng ha ye. 
  Dejiu chariujiu shaikhai mi gulo; 
  Paju masanbo tajai niu luang namh; 
  Nangdi wang phuilo.

V4: |
  4. A Rapiu jai kiubo ganiu, 
  Maomeng mimai kadih mainahdung leng, 
  Karingbo kamunse lekhai mide. 
  Panah maidung leng.

Translation: "(The lamb with insolence)"

Category: "Passion week/ Good friday"

