ID: "63"

Title: "DIBO TINGMIK WANGRA NADE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Dibo tingmik wangra nade. 
  Khuan bambo Immanuel;
  Sabo charitu ngam dasai, 
  Ranpad mainah amanjiu lung bamne.

CH: |
  (Chorus)
  Sibo tang mathajiu aman bamne. 
  Tingwang niu kaden khaibo ram aliu lune. 
  He! dejiu amanralo, dejiu matha ralo? 
  Kuilan lakge, sibo ramse.

V2: |
  2. Ngambo tingmik I ngaora leng. 
  Dedao ralo a Rapiu? 
  Lemjiu Jordon kenlu saira, 
  Naleng tingtheng ganbiu si ben bamme.

V3: |
  3. Sitiu chang nge, tingtheng Rapiu. 
  Namdi kasan wibo ga. 
  Nazai niu ranpad mainah dung, 
  Wanglo, akhuga naliu dung tiu ye.

V4: |
  4. He! namdih kasan wichang nge. 
  Nalungga chari ngam mai, 
  Ngambo lui kasan thiura leng, 
  Kadih loibo nai thiura masek khai.

Translation: "(The great day is near)"

Category: "Melodious praises"

