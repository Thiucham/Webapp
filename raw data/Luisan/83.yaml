ID: "83"

Title: "ARINGTING WIBO GA"

Key: "C"

Time signature: "3/4"

V1: |
  1. Aringting wibo ga Tingwang tu thuanne. 
  Thin thiune alung, amun hina niudi.
  Patu thuanra leng nai palad palui thiu din raleng, 
  Thinthiu ne aringting wibo se.

CH: |
  (Chorus)
  Shaibo ram gasu atu ranpad khai mide. 
  Matha chunwibo ram ga majang khaijiu, 
  Anuan hina kuak khai kam mide, Rapiu Jesu niu;
  Calvary singchai rih gasu.

V2: |
  2. Matha chunwi ye, Rapiu cham din tadra: 
  Dinkhailo, tamiubo ram piben khaira. 
  Shaibo ram ga bam maidung leng. 
  Ringbo cham dinkhai ra.

V3: |
  3. Kadih gu mania hinase niudi du. 
  Na maken dibo hina tu madu ye. 
  Detiujiu meng bam gulo, Tingwang cham din makjiu. 
  Dinkhailo, Gospel simak mai ga. 
  Dinron raleng atu langkhailo,

V4: |
  4. Hiuna harabo kadih ramlung ga hai, 
  Chamai sang sang lung bamme, he! a Rapiu; 
  Rankhaibo lunijiu mikdui luangjiu khengh bam, Rapiu. 
  Majang khailo, a Rapiu nang niu.

Translation: "(In my blissful life)"

Category: "Melodious praises"

