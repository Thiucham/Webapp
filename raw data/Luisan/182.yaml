ID: "182"

Title: "KADIH TAMIU RAM GA I BAMJIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadih tamiu ram ga I bamjiu;
  Kawi ramtu maning. 
  Tadraimai akamai atu nkhuan bamme, 
  Duidi gen ka amanbo ram ga.

CH: |
  (Chorus)
  Amaningmai phuilo pengphai se. 
  Kubo khuan se kinglujiu zuan wanglo;
  Tad ngutlo, tinggen npui ga, 
  Nang maningmai khuan bamme.

V2: |
  2. Nasuang ga nangtu hiamkao raleng, 
  Kahiambo dui luangbam. 
  Kapingbo thiumak jiu Pengphai tu zuan wanglo; 
  Malan wanglan raleng daolakge.

V3: |
  3. Tinggen masanbo ramlam bammai, 
  Kapbo ramtu phuijiu. 
  Lung chariubo kheng maise amanbo ngaone; 
  I ngen wang nge aben jat lamsu.

V4: |
  4. Kakungmai tingtheng ram zuan mide, 
  Pasai lam maning mak; 
  Tadraimai akah maidung bam ga lungra leng, 
  Apiu Khrista niu majang khailo.

Translation: "(Living in this world of darkness)"

Category: "Farewell"

