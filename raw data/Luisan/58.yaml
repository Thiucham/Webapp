ID: "58"

Title: "KADIHGA CHARAWANG KENGDI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadihga charawang kengdi, 
  Kadampbopiu tinggen lam bamme. 
  Kuilan makjiu ring bambo Tingwang nge.

CH: |
  (Chorus)
  He! asingnahmai lungsa maidung; 
  Tingtheng karingbo lura leng. 
  Chalung lijiu Tingwang tu zuanlo.

V2: |
  2. Hiambo rawang ringbo thiumak. 
  I bamme, tiujiu luang maha ye. 
  Kapbo seniu paten palan thiu bam.

V3: |
  3. Kasa kadambo rapiu se, 
  Paten ga mathabo gu haye. 
  Hiupuina tu chariubo ga luangkhai.

V4: |
  4. Kinglo Dambopiu Tingwang niu, 
  Pamai hamimai tu phiuwangra,
  Panahpiu khangkhat tu langkiu khai ye.

Translation: "(Inspite of earthly kings)"

Category: "Melodious praises"

