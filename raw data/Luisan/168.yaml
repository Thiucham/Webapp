ID: "168"

Title: "NAMDIH BAMME, KASHAIBO GENLAM"

Key: "A"

Time signature: "4/4"

V1: |
  1. Namdih bamme, kashaibo genlam phuikhai sai. 
  Sibo namdihse din silakge. 
  Naimik di kiumak chapiuniu di kuimakge, 
  Sibo kachia namdi wibo ga.

CH: |
  (Chorus)
  Siga naimik kiumak, 
  Chapiuniu di kuimak; 
  Masan maidung niu ganbiu kumjiu ben bamme. 
  Sibo kachia namdi wibo ga.

V2: |
  2. Siga bambo aliu kungbo a Rapiu tu, 
  Malum lumai hina niu ngaone.
  Chagan kadibo kumjiu siga ben bamne. 
  Sibo kachia namdi wibo ga.

V3: |
  3. Cross ga aliu niu juwang khaimibo hiuna, 
  Mili ruangga jukhaimi maidung. 
  Pirun leng kabenbo kachia pirun lura, 
  Sibo kachia namdi wibo ga.

Translation: "(A city beyond the death)"

Category: "Heaven nature"

