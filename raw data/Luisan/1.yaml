ID: "1"

Title: "THUANLO RANKHAIBO PIU NGENA TU."

Key: "D"

Time signature: " 2/4"

V1: |
  1. Thuanlo Rankhaibo piu ngena thiujiu;
  Kadirih ga mana wang nge,
  Khristian mai mathajiu chuam nai bang biulo.
  Rankhaibo piutu thuanbo lui thiubamlo.
  (Repeat 1st & 2nd line).

V2: |
  2. Mathalo khristian mai karingbo cham;
  Aliu dungleng phungkiu khai ye.
  Ku-kachangbo Tingwang paken dibamlo;
  Kadih ga manaibo thiujiu bammilo.
  (Repeat 1st & 2nd line).

V3: |
  3. Rankhai piutu manabo nai;
  Mathabo lui thiulo ting-kadih mai,
  Ting-kadih mai maniu! Tingwang manase;
  Kadih chengsa duan niu mana kasanne.
  (Repeat 1st & 2nd line).

V4: |
  4. Thainai mathabo nai, zat hina leng,
  Tinggen khamse lekhai bamme;
  Na-hiupuina naih nalung niu mathalo;
  Matha nimak mai chamih kuang ga tadne.
  (Repeat 1st & 2nd line).

Translation: "(Praise ye the new born king)"

Category: "Christmas"

