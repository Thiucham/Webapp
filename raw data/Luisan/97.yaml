ID: "97"

Title: "PAKENDIBO NAI SAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Padendibo nai sai, I ringlujiu; 
  Chari khuan nai kapingbo hane. 
  Tamiubo ram ganiu ngaotang makge; 
  Sibo ram wangtangra masenne.

CH: |
  (Chorus)
  Mazuanjiu bamne, I wangtang makthen. 
  Lungsasibo nai amanbo ram. 
  Maidung niu sibo ram maning bamdi. 
  I dinsilak, Param kawibo.

V2: |
  2. Haitiubo wang dasai zat hina niu. 
  Pakendibo bam pen khen gase. 
  Rankhaipiu juwi nai Pakendi se,
  Ngaolu dasai malum misune.

V3: |
  3. Pahiupuina chariujiu ha mimai, 
  Lungsa khaibo Tingwang cham ringbo; 
  Aliu tu pisikhaibo jeng ganiu, 
  Halleluyah, Thuanbo kim lakge.

V4: |
  4. Kadih chariubo ram ga bamthen na, 
  Nai machang chariubo niu gom bam. 
  Rankhaipiu suangga I chapbo nai sai. 
  Chariubo se, I matha mine.

V5: |
  5. Sechiu jiu Tingwang nang lungsa mainai. 
  Tingtheng ganbiu chagan kabinbo; 
  Aleng jut le, kabambo hinase. 
  Tingtheng mathabo lui thiu bamne.

Translation: "(On that glorious day)"

Category: "Aspiration for Heaven "

