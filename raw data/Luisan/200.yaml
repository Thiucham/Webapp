ID: "200"

Title: "I NIU DE TENSAI TINGTHENG RINGBO NGAO RALO?"

Key: "AB"

Time signature: "2/2"

V1: |
  1. I niu de tensai tingtheng ringbo ngao ralo? 
  Kadih potniu atu ran ngam mak; 
  Chamai lungchun niu wangtang ngam mak. 
  Hamirabo ringting lamga.

V2: |
  2. Maikhang khat niu Jesu khu wangjiu maniu we. 
  Pahai lungwibo piu khang khatle. 
  Juringbo lamga paniu maniu; 
  Tiudi paniu ringbo ngaomak.

V3: |
  3. Liu ringtingga juringbo lutao makge sai, 
  Kadihgu ringting loibonai sai; 
  Shai rabo charaw ga bam nimak, 
  Detiujiu ring ralo, Rapiu?

V4: |
  4. Tuhoi suikhaibo wanne, juringbo lura. 
  Jesu niu singchai ga shaikhaibo. 
  Malum makmai ringbo lusu ma? 
  Thainai ringbo lukhai sulo.

V5: |
  5. Lungsamai dung lungli lo juringbo ngaora; 
  Lungwimai niu tinggen ngutra suang: 
  Utpui pinmi ga ngutra chiu we. 
  chiu jiu Rapiu Jesu dinne.

Translation: "(What shall I do to be save?)"

Category: "Special songs"

