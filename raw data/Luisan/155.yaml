ID: "155"

Title: "ALIU KARINGTING HAMI DASAI"

Key: "BB"

Time signature: "4/4"

V1: |
  1. Aliu karingting hami dasai, 
  Rankhaibo a Rapiu tu wang ngao sune. 
  Siga I mathabo kui lakge. 
  Palun Tinggen rapen kumjiu pen bamme.

CH: |
  (Chorus)
  Karingbo Singbang sung ga se, 
  Tinggen maidung matha bamme. 
  Amanjiu bamne, sigase; 
  Israel mai maluangbut ga.

V2: |
  2. Namdih genlam kapjiu hui bamdi. 
  Siga lung ka magenthiubo bamliudi; 
  Charao ga tazai niu lungsa khai. 
  Ramna rabo we, hai kadihri gara.

V3: |
  3. Tiujiu tadsu khe Zion nahmai. 
  Pamaken dibo ram wangtang ra nade. 
  Tuhoi kapjiu magen thiu bamdi. 
  Aleng tinggen rapen mathabo penne.

V4: |
  4. Aliu wihbo namdih tang dasai; 
  Kadih magen thiubo maning lan lakge. 
  Milypoi nai Chawang dibo ram. 
  Masenbo nai mathabo pikhai piuwe.

Translation: "(Life after death)"

Category: "Heaven nature"

