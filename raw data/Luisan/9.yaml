ID: "9"

Title: "HE! MATHABO CHRISTMAS"

Key: "F"

Time signature: "4/4"

V1: |
  1. He! mathabo Christmas patu thuanra leng, 
  Takum wangbo sai I suilujiu. 
  Paben tu gaijiu sailam mari lanra, 
  I maningjiu bam.

CH: |
  (Chorus)
  Benailo benailo maning nge, bennailo, 
  Karaidao chabuankin kasanbo kumjiu. 
  Mathabo Christmas.

V2: |
  2. Takum wangbo saisui makjiu daolak ge, 
  Naikhat nadi I bamjing lak ge. 
  Nang chunwibo tu phuijiu tadrabo de; 
  Thiuniu du salam.

V3: |
  3. Tingwang lungsabo pen niu ngao dao lanra, 
  Nang khuan bamlo takum wang lanra; 
  Tacheng kasan phunglujiu wanglan sune; 
  Thiuniu du salam.

V4: |
  4. Nang wanglan dasai ngao dao lan sangjingra, 
  Nang chunwi mathajiu wanglanlo: 
  Nachengwibo se phung lujiu wanglan lo; 
  Mathabo Christmas.

Translation: "(Merry Christmas)"

Category: "Christmas"

