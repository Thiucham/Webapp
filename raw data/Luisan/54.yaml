ID: "54"

Title: "THUANKHE ALIU TU JURINGBO PIU TU"

Key: "GB"

Time signature: "4/4"

V1: |
  1. Mathajiu thuankhe, a Rapiu kendisi. 
  Palungsiat niu aliutu gu. 
  Shaibo nai thiuniubo gasu juring nge. 
  Thiuniu makjiu aliu ngao dao lan ngamde.

CH: |
  (Chorus)
  Thuankhe aliu tu juringbo Piu tu: 
  Ari-ahang pak marenmi maitu. 
  Maomakjiu ngao dao we, a Rapiu pen gasu. 
  Thuanjiu chakhu senlo, Halleluyah.

V2: |
  2. Manaibo wang Rapiu mathabo hade. 
  Matha amanbo dih hade. 
  Aliu di pabam bam zuanra ramnajiu, 
  Maluang ram nai taningdi niu nam mide.

V3: |
  3. I wang adao we, haibo welcome bam ga, 
  Aben jatlamsu ngen wang nge. 
  Khrista manaibo nai amanbo lujiu 
  Mathabo tingmik ye, Khrista zan gasu.

V4: |
  4. Mathajiu chunwibo kasan lun lanlo; 
  Alung Hiupuina sulanjiu. 
  Aliu lungbo nai apum ribo sidi. 
  Chawang Khrista tu thuanra leng masenlo.

Translation: "(Let us praise our Saviour)"

Category: "Melodious praises"

