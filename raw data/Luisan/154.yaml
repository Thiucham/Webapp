ID: "154"

Title: "KADIH RINGBO DUIRIANG LUTTAD JIU"

Key: "AB"

Time signature: "4/4"

V1: |
  1. Kadih ringbo duiriang luitad bam liudi.
  Masuang lam namdih wibo Canan ram. 
  Aleng mathabo pirun se luwangde. 
  Kapjiu kadih ram ga hai bamtheng lakge.

CH: |
  (Chorus)
  Tingtheng lakge, kadih magen thiubo. 
  Kubo khuan tuse, I chiu lujiu. 
  Chawang bam ga nkhuan lulak jiu kubam, 
  Lungsamai kubo tingtheng lakge tiu we.

V2: |
  2. I bambo ram duiriang se thengbam liudi. 
  Jukhaibo Piu ganbiu tu mazuan jiu, 
  Tinggen masanbo ram wangtang khai sune. 
  Siga lungsa maidung ramna lan lakge.

V3: |
  3. I zuanwang mide, tingtheng wibo ram ga. 
  Milipoi naih tinggen rapen ram se. 
  Tinggen rapen kuimakjiu penbo ramme. 
  Tazai manniu I sibo ram ga gudne.

V4: |
  4. Tinggen ram wibo ga I wangtang dasai, 
  Sailam chariubo tu maning lakge. 
  Tingwang niu riatkhaibo ram mathabo ga, 
  Kuimak jiu tingtheng jeng benjiu bam sune.

Translation: "(Following the Streams of Life)"

Category: "Heaven nature"

