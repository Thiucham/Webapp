ID: "126"

Title: "KARINGTING TAMIU GA TADBAM GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Karingting tamiu ga tadbam ga, 
  Nai machang kahiambo wang saomak; 
  Mathajiu thuankiu jiu Tingwang tu maningjiu kap. 
  Tuhoira thoidam kheng loide. 
  {Matha ra suikhai lo. (2x)}
  Maningjiu Tingwang tu sen sukhe.

V2: |
  2. Babylon vang thiujiu bam maidung, 
  Kapjiu Zion tu phuijiu bamme. 
  Lungsa maidung tu saodiakjiu kapbam maidungtu, 
  Paliu tu Jehovah jukhai. 
  {Mathabo Zion lui. (2x)}
  Thiulo, Tingwang tu thuankiu sukhe.

V3: |
  3. Ahiupuina nalung kim makma? 
  Nuan phungjiu shairabo luang rihga; 
  Tingwang pumtan niu jukhai khelo; nalungsa niu, 
  Tamiubo ten tu saodiak ne. 
  {Tamiubo pi halo. (2x)}
  Tingwang tu aliu thuankiu sukhe.

Translation: "(While walking in the ways of darkness)"

Category: "Prayer"

