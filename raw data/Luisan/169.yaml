ID: "169"

Title: "KADIH RINGTIMG HAI TINGTHENG LAKGE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Kadih ringting hai tingtheng lakge. 
  Matha chunwibo wan tuan mide. 
  Kadih ga lungsabo singnah dung; 
  Hai kadih hai ramnabo bamme.

CH: |
  (Chorus)
  He! chunsaye.(2x) 
  Tamibo wan se, 
  Malan wang lakge.

V2: |
  2. Pawan hai katumjiu tad bamme. 
  Tu pawan hai naleng, aleng nge.
  Tadmibo wanse tadloi mide. 
  Wanglanbo wanse Tingwang guwe.

V3: |
  3. Lungsabo pui-piu niu saodiak jiu; 
  Withubo chabon ringting wan se, 
  Malan wanglanlo, I nahdao kum; 
  Huijiu bamdi malan wang lakge.

Translation: "(Life on earth is mortal)"

Category: "Heaven nature"

