ID: "37"

Title: "KADIHGA WIKACHANGBO PIU"

Key: "DB"

Time signature: "6"

V1: |
  1. Kadihga wikachangbo piu, 
  Dibo gasu di langbo piu. 
  Tingwang kendi niu phuibo piu, 
  Calvary ga tasihbo piu.

CH: |
  (Chorus)
  Calvary maipiu niu, 
  Alungchun tu ngam de.
  I duakra shaikhai ye,
  Lungsasibo Piu ye.

V2: |
  2. Nuanmai hina tu piring khai. 
  Bang bambo maitu khipad khai, 
  Aliu duakra Pazai luangkhai. 
  Calvary maipiu gu lungsa.

V3: |
  3. Chamai leng gengthubo kalen, 
  Pikhai din ngamlakbo kalen, 
  Pikhai masan diangbo lunlung. 
  Malaobo Calvary maipiu.

V4: |
  4. Pi matha khai Rapiu Jesu, 
  Withubo nai natu ngao ne. 
  Nang makeng dih tuse ngao ne. 
  Calvary ga tasihbo piu.

Translation: "(God of the Best)"

Category: "Passion week/ Good friday"

