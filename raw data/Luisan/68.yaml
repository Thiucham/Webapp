ID: "68"

Title: "HE! CHAWANG CHIUJIU NAJAN THUAN BAMNE"

Key: "E"

Time signature: "4/4"

V1: |
  1. He! Chawang David phiuga chahiu-chagan. 
  Naram masanbo ga nang niu kadenkhai. 
  I mathabo khuan tadui dibo khuan kum; 
  Shaibo genlam najan tu I thuan bamne.

CH: |
  (Chorus)
  He! Chawang chiujiu najan thuan bamne. 
  Zat hina tu nang niu damkhai ye. 
  A Rapiu tu thuanbo lui thiulo. 
  Kadih gase mathajiu bamlo.

V2: |
  2. Mai thiumakbo suang gasu Chawang Jesu; 
  Pazai luangkiu leng maja makjiu kiu khai. 
  I niu kapasijiu silu ye, saira; 
  Kadih ga manang makjiu I bam mine.

V3: |
  3. Chawang degalo chabam kaden khaibo? 
  Daniel kumjiu I di chap matip bamne. 
  Kachia wibo nai pajan dibo tuse. 
  Chariubo gadi malumjiu kahumne.

V4: |
  4. He! kadih kasan dambo Immanuel. 
  Pathen-padet lemron tadlu ye, saira. 
  Chariujiu ramna mimai akamai tu, 
  Pakendibo ram gasu ngaodao lanne.

Translation: "(Oh! Hail the King)"

Category: "Melodious praises"

