ID: "179"

Title: "KARINGBO TING CHARAPEN WIBOSE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Karingbo ting charapen wibose, 
  Kui maha jiju mijiu. 
  Wahina I maning taojiu achunsha ye.

CH: |
  (Chorus)
  Majaye, majaye, pawan tad maha wanglan; 
  Nang lungsa niu mathajiu bam maidung; 
  Aliu ring ngam bambo lungga.

V2: |
  2. Mathabo kui mahaye, mahina;
  Aliu karingting kuijiu, 
  Aliu ting hawang jiu mai maning kamlakge.

V3: |
  3. Daodiusai I niu apuan thiura leng, 
  Ngaodaolan lubuiye sai.
  Dadao tu maning jiu takum wangbo tu phiu.

V4: |
  4. Takum tu ramnade, kulan silak.
  Akahmai nai ramnabo;
  Pating loijiu takum kawang nai tadmide.

Translation: "(Flowerly Life)"

Category: "Farewell"

