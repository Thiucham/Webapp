ID: "52"

Title: "HALLELUYAH, MATHA JIU THUANKIULO"

Key: "C"

Time signature: "4/4"

V1: |
  1. Adam raw tamiubo niu namh. 
  Luangken padra leng sao wangralo; 
  Lung magenthiujiu bam maidung tu, 
  Paliu tu ranpadra.
  Tingwang Jesu mana.

CH: |
  (Chorus)
  Halleluyah, mathajiu thuankiulo, 
  Tingwang Jubilee tu. 
  Bethlehem nai Calvary luangrih ga, 
  Rankhaibo siam miu khuan.

V2: |
  2. Pasai lam kahiambo ri tan. 
  Nuan niu chariubo tu gom nam me. 
  Jeho Zereh maluang ga wangjiu, 
  Hossana sen wang nge, 
  Salem pengphai hang ga

V3: |
  3. Salem hangga Misor namdih, 
  Atu rankhaibo siammiu biujiu. 
  Naleng jeng gasu Jesu chariu, 
  Tazai khengpad khai ye, 
  Calvery luang gase.

V4: |
  4. Salem pengphai hangga ringbo. 
  Salem Tingwang niu kawi pikhai. 
  Jeho Zereh luangga bam maidung. 
  Niu sikam mi sune. 
  Halleluyah, Amen.

Translation: "(Halleluyah, praise the Lord)"

Category: "Melodious praises"

