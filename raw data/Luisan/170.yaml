ID: "170"

Title: "HAIBO DIHGA I LUNGBAM THEN"

Key: "E"

Time signature: "4/4"

V1: |
  1. Haibo dihga I lungbam then, 
  Chunsabo ronna ngaowe. 
  Shaibo Jordon giu I kenlu sai, 
  A Rapiu suangga I bammine.

CH: |
  (Chorus)
  Atu ngaokhailo, nagu Salem; 
  Akah maidung lungbo ram. 
  Ramna makbo ram. 
  Kadih chariubo saodiak jiu; 
  He! dedao niu I wangbam ralo?

V2: |
  2. Chariubo ga bam maidungdi. 
  Pabam dibo wangtang sai. 
  Tadrai lumai nai tinggen maidung: 
  Salem a Rapiu tu thuan bamne.

V3: |
  3. Tingtheng ringbo lui thiumai niu, 
  Atu kuye, tadrai mai. 
  Paliu dung khukhuan I chiu lujiu; 
  Sibo ram maning jiu I kapbam.

V4: |
  4. I maning nge, Immanuel; 
  Nagu Salem wibo se. 
  Chariubo bam ga lungbo I ye. 
  He! nang niu atu majang ngutlo.

Translation: "(As long as I live)"

Category: "Heaven nature"

