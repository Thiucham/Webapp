ID: "7"

Title: "TINGWANG, KADIBO CHAWANG"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kadih ga wang mana, Tingwang kadibo, 
  Masanbo hiupuina matha lui thiu ye. 
  Tingwang kense dijiu bamlo. 
  Kadih mai nadung manonjiu bamlo.

CH: |
  (Chorus)
  Tinggen masanbo Hiupuina dung. 
  Bethehem ga kubambo khuan, 
  Paliu ringabo lui khuanse. 
  Immanuel wang paken dijiu bamlo.

V2: |
  2. Manaibo Wang masanmai ga mana ye. 
  David kiphiu ga tingtheng benbo ganbiu, 
  Tingtheng wang thiujiu bam milo. 
  Pajan dibo tu tingthengjiu thuanne.

V3: |
  3. He! Masanbo hiupuina niu thiu lanne. 
  Bethlehem namdi ga I kap bambo wan. 
  Paliu khuan nai Paliu puanse, 
  Alung ga tingtheng jeng thuanjiu bamne.

Translation: "(God, the great King)"

Category: "Christmas"

