ID: "166"

Title: "HAIBO KADIH HAIRA AKI MAKGE"

Key: "A"

Time signature: "2/2"

V1: |
  1. Haibo kadih haira aki makge.
  Naikhatna leng nbin wangbo ki ye. 
  Tingtheng lungrabo ki makge.

CH: |
  (Chorus)
  He! tinggen ram Zion nam gase.
  I Tinggen ram lamse tadsu mirade. 
  I kemsu mide, lungsa maidungyo. 
  Bamdiak sulo, bamdiak sulo.

V2: |
  2. Matha, lungkimra ha hai kadih ga; 
  chiudi hiuna niu atu jukhai jiu, 
  Tuhoi I ringbo lutao de.

V3: |
  3. Lungsa maidung nuantu phutmi sulo.
  Nthainai Tingwang niu natu kuwe. 
  Nuan gasu malan wang milo.

V4: |
  4. Gukhaibopiu tu I tingtheng maning. 
  Hai kadih niu matha pikim ngam mak; 
  Hiuna masanbose makjiu.

V5: |
  5. Kanambo wan wangde, lungsa mai dung; 
  Lungsabo pui-piu, akah-phen maidung. 
  Pawan hade, lungli sulo.

Translation: "(This world is not my home)"

Category: "Heaven nature"

