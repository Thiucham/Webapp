ID: "56"

Title: "EDEN GU HIUPUINA WANGLO "

Key: "G"

Time signature: "2/4"

V1: |
  1. Hiupuina wanglo Eden gu mania, 
  Thuan lujiu nang ram kawi zuan sune. 
  Aliu ngao ne Pakendibo hina. 
  Thuanbo lui khuan niu tingkai kum hunne.

CH: |
  (Chorus)
  Immanuel nalungsa reng lungga. 
  Kahiambo ri tanne malan wanglo. 
  Malan wanglo I ringbo se nang nge, 
  Nalungsa reng lungga, 
  He! kahiambo rih tanne.

V2: |
  2. Kari-ngabo kawi pibo nai 
  Nang ringbo puiki ga atu luanglo. 
  Jordon giudui se kasuak bam liu di. 
  Canan ram gase atu luang khalo.

V3: |
  3. Lemsi jiu thingna kumjiu lemlusai 
  I ringbo Calvary luang tu zuanne. 
  Lung magen thiubo ramtu saodiakne. 
  Mathabo ram tuse I zuan mide.

V4: |
  4. He! I mathabo tingmik ha dasai. 
  Amanbo ram wibo ga I bamne. 
  Calvary luang ga shaibo lui thiu mai, 
  Mathabo kuimakjiu wang aruangne.

Translation: "(Come Eden's Holy Spirit)"

Category: "Melodious praises"

