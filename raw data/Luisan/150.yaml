ID: "150"

Title: "MANING JIU HUIBAM NARAM TU"

Key: "D"

Time signature: "2/2"

V1: |
  1. Maning jiu huibam naram tu;
  Ma nawanglo, Immanuel. 
  Hiupuina naih Tinggen ramga, 
  Mathajiu bam chamne.

CH: |
  (Chorus)
  He! Nangram wibo tuthuanne. 
  Maluang ram ga lungbam maidung chariu kheng nge 
  He! nang kendibo ram charapen wibo tu. 
  I maning nge naram kawi tuse.

V2: |
  2. He! kadih chariubo ram ga. 
  Charapen kuibo kumjiu kui. 
  Mathabo ram ga wangtang sai, 
  Bennai jiu bam mine.

V3: |
  3. Hami maidung Jesu jan ga, 
  Luangwanglo mathak khai sune. 
  Tinggen namdih Zion ramtu, 
  I phuibam ne, Tingwang.

Translation: "(Longing for the land above)"

Category: "Heaven nature"

