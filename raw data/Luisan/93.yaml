ID: "93"

Title: "ALUNG NIU TINGGEN MANINGSAI"

Key: "F"

Time signature: "4/4"

V1: |
  1. Alung niu tinggen maningsai;
  Kadih chariu kheng ngam lumai, 
  Matha-mala bambo tu ngao, 
  Mathabo lui khuan wibo se, 
  Nai machang I thiubam liudi, 
  Siram ga wangra khuan lulak.

CH: |
  (Chorus)
  Atu phiulo, tinggen Rapiu. 
  Chengsha riang niu atu bangjiu, 
  I lung magenthiujiu bamme. 
  Nang ram ga wangtang ni bamdi, 
  Shaibo nai chariubo siniu, 
  Nai machang atu gom.

V2: |
  2. Machunbo niu wang tang lulak, 
  Tiubo pisikhaibo jengniu, 
  Magenthiubo niu gom namme. 
  Wangtangra khuan lulakjiu bam, 
  Tingwang nang ram masanbo tu;
  Chalui thiujiu I hui bamme.

V3: |
  3. Wahina makum taolujiu, 
  A magenthiu tu silujiu, 
  I magenthiu thengra leng nge 
  Nahmai kapjiu nuilanbo kum. 
  Kadihriga I ngao makge;
  Nai machang I maning bamdi.

V4: |
  4. Nahmai kum kapjiu nuilanlak. 
  A Rapiu niu kiu luang makthen, 
  Alung pubo hai halakge, 
  Karingting hai saodiak makthen, 
  Tinggen wangra maning bamdi, 
  A Rapiu wangtang lulak.

V5: |
  5. Kadih chariubo bam gadi: 
  A Rapiu niu majang bamsai, 
  Detu alungchariu ralo: 
  Atu luang bambo si dasai, 
  Nahmai kum kaplu nuilan kum. 
  Kadih chariubo mangai ne.

Translation: "(When I think of heaven)"

Category: "Aspiration for Heaven "

