ID: "151"

Title: "KADIH RAM GA HE! RANKHAIBOPIU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Kadih ram ga he! Rankhaibopiu. 
  Alung magen thiujiu bamme. 
  Jukhailo, nangram wibo ga, 
  A Rapiu Jesu.

CH: |
  (Chorus)
  Shaibo giugen juken khailo, 
  Kapjiu kahui makbo lamse. 
  Lungsamai ramna mimai naih, 
  Mathajiu bam chamne.

V2: |
  2. Chunsabo nai mikdui luangbo niu, 
  Magenthiu khengjiu kapbo ram.
  Charapen kumme, kadih hai; 
  Mathajiu thiune.

V3: |
  3. He! lungsamai Rankhaipiu suangga.
  Dinlan lakge, ramnabo cham. 
  Milipoi niu kheng khaibo se, 
  Mathajiu thiune.

V4: |
  4. Ganbiu kumme, Rankhaipiu Jesu. 
  Nuan niu alung tamiu bamga, 
  Wangben khailo nabiu siniu; 
  I ngao si raleng.

Translation: "(In this world oh! Lord)"

Category: "Heaven nature"

