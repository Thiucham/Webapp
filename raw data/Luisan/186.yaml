ID: "186"

Title: "CHARIUBO KAMUANG NIU GOMBAM"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Chariubo kamuang niu gombam,
  Kadih riga hai; 
  A Rapiu jan ga lungsamai,
  Ramnabo wan wang nge.

CH: |
  (Chorus)
  He! ramna nimakge, (2x)
  I lungsa maidung tu. 
  A Rapiu hiupuina kiujiu, 
  Nai machang luang bamlo.

V2: |
  2. Nnen-nchun di thiumakge, 
  Nang tu thuan raleng.
  Aliu ramna jiu bamliudi, 
  Tingwang niu luang bamlo.

V3: |
  3. Alung niu mathajiu nangtu. 
  Thuankiu jiu bamne. 
  Nang niu lungsabo pen gasu, 
  Tinggen mainah thiune.

V4: |
  4. Aliu ramna jiu bamliudi; 
  Tingwang niu ngaowe. 
  Chariu kheng jiu I kap bamme, 
  Saron pen ben wanglo.

V5: |
  5. Akahmai nai ramna raleng, 
  Tingmik padlande. 
  Thiuniu makjiu ramna sukhe, 
  I lungsamai salam.

Translation: "(Under the cloud of troubles)"

Category: "Farewell"

