ID: "190"

Title: "ALIU CHAMAI RINGTING HAI"

Key: "A"

Time signature: "2/4"

V1: |
  1. Aliu chamai ringting hai; 
  Dega niu wang gulo? 
  Aliu delam tadlan ralo? 
  Singgiu dui sai suilujiu, 
  Duinai zuantad rama? 
  Tingkai sai suijiu tad ralo?

CH: |
  (Chorus)
  Aliu khuga dinkhailo:
  Aliu ringting haise;
  Dejiu kha dun gulo, ringting; 
  Din lo aliu ringting hai; 
  Dejiu kha dun gulo; 
  Siniu aliu ringting raoye.

V2: |
  2. Aliu maduibo haise, 
  Tingwang tu thuan raye 
  Aliu ramna bambo haise, 
  Tingwang kendi raleng nge.
  Maidi chunsha dulo; 
  Naikhat aliu adao lanne.

Translation: "(Our humanity life)"

Category: "Farewell"

