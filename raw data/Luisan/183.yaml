ID: "183"

Title: "PHUILO, TINGGEN NAMDIH SITU"

Key: "EB"

Time signature: "4/4"

V1: |
  1. Phuiuo, tinggen namdih situ,
  Siji ramna makbo ramme. 
  Aliu ramnabo ting wang nge. 
  Maning ramna makbo.

CH: |
  (Chorus)
  Pating dunne kamathabo;
  Charapen kumjiu kuinuang;
  Aliu ramna mak daolakge, 
  Aliu lungbo cheng mijiu.

V2: |
  2. Ramna makbo ram tu maning, 
  Aman jiu bamrabo ram tu; 
  Dedaoniu wang tang ralo? 
  Ramna makbo ram ga.

V3: |
  3. Chariu jiu ramna mibo sai,
  Dedao niu aruang lan ralo? 
  Kadih chariubo kendasai;
  Mathajiu aruangne.

V4: |
  4. Ramna makbo ram tu maning, 
  Kadih ga ramnabo siniu;
  Achun wirabo leng haye, 
  Kadih chariubo ga.

V5: |
  5. Ramna lujiu kap bambo ga, 
  Tinggen namdih tu mazuanne;
  Ramna lanlakbo ram ga se, 
  Wangra khuan ngam makge.

V6: |
  6. Tinggen mai naih akah maidung;
  Lungsajiu atu majanglo, 
  Chariubo kadih ga ramnade;
  Maningbo kim makge.

Translation: "(Behold, the Kingdom of God)"

Category: "Farewell"

