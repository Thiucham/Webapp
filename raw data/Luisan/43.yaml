ID: "43"

Title: "A RAPIU CALVARY GA NALUNG CHARIU"

Key: "EB"

Time signature: "4/4"

V1: |
  1. A Rapiu Calvary ga nalung chariu. 
  Chari sikamlak maidung madui bam. 
  Nalung chariu tu simai ha; 
  Tinggen kamuang niu gomnamme, 
  Calvary tu sungjiu.

CH: |
  (Chorus)
  Amen, Amen, halleluyah, Amen. 
  Tinggen lamdi Amen senlo; 
  Duidi nai kadih maidung di, Halleluyah senlo.

V2: |
  2. A Rapiu kashai tu ngamjiu su mide. 
  Tinggen namdih masan maidung madui. 
  Calvary pentu sundao leng. 
  Sulanbo nai se lung lon ne. 
  Tinggen lam kahim bam.

V3: |
  3. Kashaibo giugen lam Salem kasan se.
  Chawang ram charapen wibo ramme. 
  Machangjiu tarah ju bamme. 
  A Rapiu chari ngambo lui, 
  Thiujiu thuankiu bamme.

V4: |
  4. A hiupuina phui bamlo, namdih lamtu. 
  Rankhaipiu nai tinggen mai lungbo ram. 
  Chariu khenghjiu kasabo ha; 
  Karingbo rapen ram gase, 
  Kapbo bamlan lakge.

Translation: "(Lord's passion on Calvary)"

Category: "Passion week/ Good friday"

