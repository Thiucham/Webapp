ID: "121"

Title: "PAWAN NIU TADBAM GA"

Key: "E"

Time signature: "2/2"

V1: |
  1. Pawan niu tadui luangbo kum tadbam; 
  Naringting di duiluang kum tad bamme. 
  Pawan wibo naleng pikhaibo ga, 
  Narawang tu adaora kadenlo.

V2: |
  2. Pawan tu maidi kulan ngam lakge. 
  Suannai-naanai leng dak khai lan talo. 
  Tuhoi haise naleng pawan side. 
  Narawang tu adaora kadenlo.

V3: |
  3. Karaiting Noah niu kadenbo kum. 
  Nangdi kaden sijiu nkhuan bamlo. 
  Paniu natu nkhuanjiu kubam ga; 
  Narawang tu adaora kadenlo.

V4: |
  4. Kadih ga chara kakeng haisera, 
  Naikhat lungsa, naikhat shai mareng mi. 
  Tingwang lungsiat sera tingtheng jeng nge. 
  Narawang tu adaora kadenlo.

Translation: "(As the time flows)"

Category: "Message"

