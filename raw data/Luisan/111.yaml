ID: "111"

Title: "MANING NGE TINGTHENG RAM TU"

Key: " C"

Time signature: "2/4"

V1: |
  1. I maning nge, tingtheng ramtu: 
  Kuilan makbo kachia namdih wibose; 
  Naimikbiu suang tinggen dih benne. 
  I ngao ni ye, tinggen maidung, 
  Lungbo ram tuse.

V2: |
  2. Maidung tingen zuanbo pui se; 
  Suitad makrabo leng alung manang nge. 
  Nuan kaphungbo niu pumtan hajiu. 
  Tinggen Canan ram kendibo 
  Ngaomakra chariu.

V3: |
  3. A Rapiu Hiupuina makjiu, 
  Kadih gasu saoniu wangtang luralo? 
  Hiupuina hakhaibo kadihga, 
  A Rapiu malum maidungtu,
  Hiambo niu namme.

V4: |
  4. Malum maidung tinggen ramga, 
  Naimikbiu suangdi paliu ben bam sune. 
  Kadih ga chariubo saodiakjiu, 
  Mathabo charapen kumjiu, 
  Kui makjiu penne.

V5: |
  5. I wang lungne, tinggen ramga, 
  Tingtheng jeng kuilan makjiu mathak bamne. 
  Apiu niu damkhaibo Salem ga, 
  Aliu mathiuna lung bamne. 
  Chariubo hajiu.

Translation: "(Longing for eternal)"

Category: "Aspiration for Heaven "

