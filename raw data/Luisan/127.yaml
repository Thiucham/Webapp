ID: "127"

Title: "HIAMBO KARENG HANGGA I TAD BAM"

Key: "A "

Time signature: "4/4"

V1: |
  1. Hiambo kareng hangga I tadbam ga. 
  Sigase mathabo pui phiu bam ga. 
  Shaibo giugen gase Pakhuan chiujiu. 
  Pingbo niu alung chariu ye.

CH: |
  (Chorus)
  He! Jesu atu phuikiu khailo;
  A Rapiu, pui maojiu mengtad bamme.

V2: |
  2. Nuan tenbo gu sera shaibo haide. 
  I niu shaibo giugen kenpad ngam mak, 
  Tiudi pui kaki ha ye, a Rapiu; 
  Rankhaipiu natu maning nge.

V3: |
  3. Takum haitheng natu phut khai lujiu, 
  Pawan machang lungsajiu jukhailo. 
  Pabam machang naronna ye, Tingwang, 
  Kadih ga thuanbo thiu milo.

Translation: "(Traveling by the gate of temptation)"

Category: "Prayer"

