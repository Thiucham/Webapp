ID: "147"

Title: "KALUNG SIJIU I BAM ΒΟΝΑΙ"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kalung sijiu I bam bonai; 
  Haibo Kadih hai phutkhai jiu; 
  Chariubo kamuang niu gomkhai; 
  Ahiupuina magenthiu bam.

CH: |
  (Chorus)
  He! atu maluanglo, 
  Magen thiubo kamuang hang ga. 
  Rapiu atu maluang bam sai, 
  I kap malan lakge.

V2: |
  2. Matha bambo changan genlam, 
  Tinggen mai chunkhat thiu bamme.
  I magen thiujiu kap bamme. 
  Magen thiubo kamuang hang ga.

V3: |
  3. Ahiupuina magen thiubo, 
  Haibo kadih hai saodiak jiu 
  Takaina kum jiu lemtad sulo, 
  Amanbo namdih wibo ga.

V4: |
  4. Siga chariubo naih kapbo, 
  Bamlan lakge, Canan ram ga. 
  Rankhaibopiu majang khaine, 
  Amanbo namdi wibo ga.

Translation: "(Grievious day)"

Category: "Heaven nature"

