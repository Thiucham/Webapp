ID: "15"

Title: "WITHUBO TINGMIK"

Key: "A"

Time signature: "3/4"

V1: |
  1. Kadih riga withubo a Rapiu Jesu, 
  Tinggen chawang bam saodiak lujiu chariu khengh, 
  Chariubo sibam liudi, 
  Siga a Rapiu mana chamai lun thiujiu.

CH: |
  (Chorus)
  Wibo tingmik! wibo tingmik !
  Wibo tingmik ga Jesu ponne.

V2: |
  2. Kalek lungsabo puiga ponne Jesu se. 
  Kadihmai lun kumjiu ngenah thiujiu ponne. 
  Bethlehem namdi gase, 
  Siga a Rapiu ponne, kadihmai lengniu.

V3: |
  3. Tingwang panah pumlibo tu langkhaibo se, 
  Nuanvang dung seniu duak padbo bamlura leng, a  Rapiu.
  Hiuna Masan lura leng, 
  Kadihmai nuan phungkhai raleng langkiu mide.

V4: |
  4. Pawan machang rankhaibo lura leng jengniu, 
  Singchai ga chariu khengjiu pazai kiu khaide. 
  Charaw ga jengsum jijiu, 
  Rapiu pamlam bamlanra tinggen khang mide.

Translation: "(The best day)"

Category: "Christmas"

