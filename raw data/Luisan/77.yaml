ID: "77"

Title: "KADIHGA CHAWANG HINA HANE"

Key: "B"

Time signature: "4/4"

V1: |
  1. Kadihga chawang hina hane. 
  Kadih rapen wibo di kuine. 
  Aliu karingting di hawang majat sune. 
  Tiuliu di Jesu se agu ye.

CH: |
  (Chorus)
  Lily penkum Jesu agu we. 
  Penne aleng tinggen ram gase 
  Chariubo gadi Pah niu majang bamra. 
  Lily pen Jesu se agu we.

V2: |
  2. Atu lungsa khaibo ram gase;
  Pah se tingtheng benbo ganbiu we. 
  Haibo kadihriga chariu khengh bam liudi, 
  Param ga atu luang ngut khaine.

V3: |
  3. Tuhoi kapjiu chariu bam liudi, 
  Shaijiu amik ta-nguih kiu dasai;
  I ping lak ge, charaw gasu sulan liudi;
  Amikdui se thudsang khai sune.

V4: |
  4. Amaning mai niu haibo dih ga, 
  Atu saodiakjiu achunsa ye. 
  Tiuliu didu, I maningbo kumjiu bamne. 
  Lily pen Jesu se agu we.

V5: |
  5. Lung magenthiudi I ping lakge. 
  Alung nai Hiupuina chariudi, 
  Lung chariujiu aronna bambo wan gadi, 
  Pah niu atu majang jiu bamne.

Translation: "(Kings on earth shall perish)"

Category: "Melodious praises"

