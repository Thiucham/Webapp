ID: "191"

Title: "TAMIUBO BENLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tamiubo benlo aram zuan tadra. 
  Kadih gara maichun kawangbo ha. 
  A Rapiu Salem namdih tu zuanne.

CH: |
  (Chorus)
  Shai lujiu ringsu lan nai tingmik ga; 
  Wibo ram ga ju ngut khailo. 
  Duidi gen wibo ga. 
  Shaijiu tamiubo ngamjiu I thiune.

V2: |
  2. A Rapiu I kap nanglun ngoumak jiu. 
  Achunsha jiu I bamting ben lulak. 
  Zion rengse delam bam migulo?

V3: |
  3. Kabenbo ram bam, tamiubo genlam. 
  I pui mao de, Rapiu benwang khailo; 
  Chariubo nai charaw niu kham namme.

V4: |
  4. I karingting charaw tu marenne. 
  Rankhai maidung niu khuanbo lam zuanne. 
  Chariubo ram saodiak jiu mathak ne.

Translation: "(Brighten the darkness)"

Category: "Farewell"

