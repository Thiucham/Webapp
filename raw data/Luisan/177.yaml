ID: "177"

Title: "DEJIU KUIJI GULO, CHAMAI RINGBO TING"

Key: "A"

Time signature: "4/4"

V1: |
  1. Dejiu kuiji gulo, chamai ringbo ting; 
  I ringabo tingmik hawang jiu. 
  Naikamachang mathara ha; 
  Maningjiu huibam di.

CH: |
  (Chorus)
  Amaning kakungmai aliu ramna bamdi, 
  Mathajiu chalung khat thiukhe. 
  Aliu ringbo ting dung bamdi. 
  A Rapiu ten thiucham bam khe.

V2: |
  2. Chunding naih ramdak jing-jing jiu bamrabo ram; 
  Kadih tamiubo niu chariuwe 
  Magenthiubo mathara leng, 
  Kapbo gu hamilo.

V3: |
  3. Apiu atu majanglo, akahmai nai, 
  Nang lungbo ram I ngaora lengse. 
  Ramna lanrabo bam lakge, 
  Chariubo gen lam se.

V4: |
  4. Kadih ga kapbo niu ramnara ping mak; 
  Ganbui rilam lung maidung siniu, 
  Chalui thiuwe chakhu wi jiu; 
  Dibo tinggen ki ga.

Translation: "(How fast does life fades)"

Category: "Farewell"

