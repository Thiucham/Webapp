ID: "47"

Title: "PHUILO RINGBO NPUI"

Key: "E"

Time signature: "4/4"

V1: |
  1. Phuilo ringbo npui kasiam loide. 
  Kadih ga lungsabo nai ringbo. 
  I bambo dih paken dibo ha ye

CH: |
  (Chorus)
  He! Masanbo Hiupuina chawang bam kumjiu, 
  Thuanbo lui nai tara khuan wibo niu, 
  He! paken dibo thiu milo;
  Chawang lungsa niu Calvary ga khenghjiu ran khaide.

V2: |
  2. He! Tingwang Rankhaipiu tu maning. 
  Calvary siangkhaibo sing rih ga, 
  Anuan jeng gasu niu khengkhai mide.

V3: |
  3. Tinggen mai nai kadih mai silo;
  Pah niu chariujiu khengh khai mibo. 
  Calvary hai alungga wang khailo.

V4: |
  4. He! juwang khailo, sibo luangga: 
  Tingwang Milipoi chariu khaibo. 
  He! mana wanglo, tiujiu I kheng nge.

Translation: "(Look for the way of life)"

Category: "Melodious praises"

