ID: "195"

Title: "RAPIU LADREN PIUMAK JENGNIU"

Key: "A"

Time signature: "4/4"

V1: |
  1. Rapiu ladren piumak jengniu. 
  Chamai ga kashaibo wang nge. 
  Jesu niu shaibo ngam khaijiu 
  Shaimakbo ramse pi ngou khai.

CH: |
  (Chorus)
  He! kashaibo nangam se delo? 
  He! shaibo nathat se de galo?
  Ka ngambo niu shaibo tu mani;
  Shaibo loide, Shaibo loide, 
  Halleluyah ringbo, ringbo.

V2: |
  2. Maihina nuan ga ngut khai de. 
  Nuan jengphi se shaibo siye. 
  Jesu niu shaibo ngamkhai de. 
  Tingtheng ringbo ram pi ngut khai.

V3: |
  3. Ladren sibo ran ga hade, 
  Chengsha bodi bamlan lakge, 
  Tingwang lungsa niu ladjan thiu; 
  Chunrang thiubo ga pikhai.

V4: |
  4. Kashaibo tu ping lanlakge,
  Jesu niu cross ga gen mankhai; 
  Chengsha hina ngam khaide, 
  Chalungsabo pimachang khai.

V5: |
  5. Chengsha gu pumtanse hade, 
  Chengsha ladren piha khaiye; 
  Shaibo ladren gasu pi hakhai, 
  Ladren hade, Chengsha hade.

Translation: "(Consequences of disobedience)"

Category: "Farewell"

