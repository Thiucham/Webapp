ID: "161"

Title: "HE! TINGWANG JUKHAI LO"

Key: "G"

Time signature: "2/2"

V1: |
  1. He! Tingwang jukhai lo.
  Kadih tinglang loi makthen. 
  Kamuang kumjiu tamuibo dihga 
  Atu jukhailo.

CH: |
  (Chorus)
  Nang niu makjiu mathara ha ye. 
  Alungchun mathara hah; 
  Kadih ringting pawan loi wang de 
  Liu tu khuan mak ge.

V2: |
  2. Zuan tadkhe benbo lam. 
  Rankhaipiu phikem phui jiu. 
  Hiambo niu tadui kum wang liudi, 
  Ping mak jiu tadne.

V3: |
  3. Kadih aringting hai; 
  Charapen kum jiu kuine. 
  Pingbo niu phuibo kadih gahai, 
  Atu ju khailo.

V4: |
  4. Tinggen ram wangtang sai, 
  Chariu kapbo bam lan lak, 
  Siram ga mathabo niu phui ye 
  Tamiubo hade.

Translation: "(Guide me oh! God)"

Category: "Heaven nature"

