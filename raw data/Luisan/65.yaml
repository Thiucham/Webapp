ID: "65"

Title: "KINGLO NAPAOPIU KHUAN"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kinglo Napaopiu khuan wibo, 
  Kamuang rilamsu senwang nge. 
  Milipoi tu thuankiu sukhe, 
  Hosanna chiujiu sen bamlo.

CH: |
  (Chorus)
  I wanglan ne chiujiu, 
  A Rapiu niu dinkhai diak ge. 
  Kaden bamlo chamai zat hina niu, 
  I wangrabo ting nawang de.

V2: |
  2. Matha bo ting nawang de. 
  Nahmaidung niu nkhuan bamme. 
  Jengsa mikdui luangbam maitu, 
  Luang ngut khailo, Salem ram ga.

V3: |
  3. Mathabo ting nawangbo tu, 
  Nahmaidung niu khuan lulak. 
  Zat hina niu natu thuanne. 
  Halleluyah, chiujiu senlo.

V4: |
  4. Mathabo tingmik wang sude.
  I wang sune, chiujiu dinbo. 
  He! a Rapiu se Tingwang nge. 
  Natu thuanne, zat hina niu.

Translation: "(Hark the bridegroom's voice)"

Category: "Melodious praises"

