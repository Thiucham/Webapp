ID: "116"

Title: "ARINGTING RAPEN KUMBO LUNGGA"

Key: "E"

Time signature: "2/4"

V1: |
  1. Aringting rapen kumbo lungga. 
  I lungbo kadih ramwibo ga. 
  Gaomakbo milipoina kumjiu, 
  Ronmeng bamliu we, aringting hai.

CH: |
  (Chorus)
  Jesu niu lungsabo khuan siniu, 
  Akhuga wanglo, tiujiu ku bamme, 
  Kubo khuan I niu chiu lan gasu, 
  I ringbo ringting lutao lande.

V2: |
  2. I nahmai tiujiu lungbambo wan,
  Jesu niu maningbo ten thiumak, 
  Gaomakbo milipoina kumjiu, 
  Ronmeng bamliu we, aringting hai.

V3: |
  3. Matthew kariu khat makai tachat ga, 
  Jesu niu haitiu jiu dinkhai ye. 
  Puat rit phung maidung akhu wanglo; 
  I niu natu pi mathak khai ne.

Translation: "(Within the flowerly-like life)"

Category: "Message"

