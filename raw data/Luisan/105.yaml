ID: "105"

Title: "HAI KADIH CHARIUBO RAMGA HAI"

Key: "F"

Time signature: "3/4"

V1: |
  1. Hai kadih chariubo ramga hai, a Rapiu, 
  Chariu, chunsajiu bam. 
  Kahiambo muang tamiubo ga I bamniu we. 
  Npui tamiubo luthon khailo.

CH: |
  (Chorus)
  Kadih ramga hai kawibo bam suma? 
  Kadih ramga hai kawibo ha; 
  Rapiu khu matha kawibo bam. 
  Siram wibo ga I wangtang sune.

V2: |
  2. Kendibo tingmik wangtang raleng machunne. 
  Maning ngamlakjiu bam. 
  I tadrabo ramtu machunjiu I hui ye. 
  Maningjiu, machunjiu khuan lulak.

V3: |
  3. Kadih ringting hai loilujiu hami liudi. 
  Nalad ra halan lak 
  Achunsajiu tinggen tu maningjiu hui ye, 
  Luangwang khailo, chiubo atu.

V4: |
  4. Tinggen ram zuantad ne aringting loibo nai; 
  Lem tadne tinggen lam. 
  Sibo ramwibo ga I wangtangbo nai sai, 
  Matha lui thiu chamne siram ga.

Translation: "(In this land of troubles)"

Category: "Aspiration for Heaven "

