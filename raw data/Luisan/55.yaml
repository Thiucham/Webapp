ID: "55"

Title: "KAWI PIRA TINGGEN LAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kawi pira tinggen lam,
  Ladjan lan bamme.
  Eden Khamse lekhai lande.
  Ngutlo, Zion ram abenne.

CH: |
  (Chorus)
  Thuanlo, thuanlo, Rankhaipiu,
  Milipoi wang sune.
  Thuanlo, Halleluyah Amen.
  Halleluyah, juring rabo Piu wangnge.

V2: |
  2. Chunwi lui siniu, 
  Kadihri phuikam mide. 
  Eden ga kaomai sulan de. 
  Desilo nnen ganbiu se.

V3: |
  3. Chawang hina Chawang; 
  Zion ladjan piu ye. 
  Chamai niu kam maha lulak. 
  Pah niu lungsabo tasih ye.

V4: |
  4. Patu thuanbo lui thiu lo, 
  Masan mai hina. 
  Chuang-taning nai kadih piri. 
  Zion lulo, Halleluyah.

Translation: "(Heavenly wealth)"

Category: "Melodious praises"

