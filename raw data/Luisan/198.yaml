ID: "198"

Title: "DAA KARAIDAO I LUNGBO RAM"

Key: "F"

Time signature: "4/4"

V1: |
  1. Daa karaidao I lungbo ram wang ngaojiu; 
  Phui ping nge, aphenmai nai bambo ram, 
  Maning khailujiu nda tingtu maning nge. 
  Kapuak-tingrot kumjiu mikdui luang bamme.

V2: |
  2. Singpuan gen ga kalana chuncham kumjiu, 
  Lungsa maidung tu bam aruangbo ga. 
  Mathabo kuijiu pamna kumjiu kap bamme, 
  Daa karai tingse kuijiu kasan wanglo.

V3: |
  3. I ramgunbo aphenmai delam bamlo? 
  Achun wang mak ge, naju ngao makjiu, 
  Pamna kum nuijiu bambo ram wang ngao lujiu, 
  Ramnabo niu a maningtu ngao makge.

V4: |
  4. Karing tingga chunchamjiu bambo tingga; 
  Singpuan sung gase niangjai marajiu. 
  I lungsa maidungtu majangjiu bambo ram, 
  Nahdao ram bam se di manam kam mide.

V5: |
  5. He! apui ramna raleng din ngam lakge. 
  He! duidi kum I niu khengbo thiuwe. 
  Pating theng nge amikdui padjiu khengrabo, 
  I kheng leng chalang kumjiu manon khailo.

V6: |
  6. Kashaibo niu ramna khaiye apui yo. 
  Singpuan-singnu dung sira shai makge. 
  Charapen kui kumjiu tanungdui sakra leng. 
  Atu saodiakjiu charuipui tadra ma?

V7: |
  7. Puihang-puiri phiujiu I phiudao lulak; 
  Kadih ga alungchun wangrabo leng. 
  I lungbo kadih, pao-pe khunlung ram tuse. 
  I maning nge awan phuijiu bam niu lo.

V8: |
  8. Tingjing wang sude, marui wangkiu mide. 
  Delam bam milo; achun kazuanmai. 
  I mazuanjiu ania ram bam tu phui bamme. 
  Alung kimrabo leng I wang ngao suma?

V9: |
  9. Achunsha jiu marinting bamjing lak ge. 
  Naimik nai chahiu se benpad lanlo. 
  I lungsamai nai kapbo leng naimik padle. 
  Sao sulo, Immanuel atu luanglo.

V10: |
  10. Ramna khai de aphenmai lungsamai tu. 
  Kadih maihina ramna mi guwe. 
  Thiukaniu makjiu tad mari wanglan makjiu.
  Tinggen kamun ganiu atu khuan bamlo.

Translation: "(Place of my ancestors)"

Category: "Special songs"

