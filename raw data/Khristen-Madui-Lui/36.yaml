ID: "36"

Title: "JESU RACHAM I DINNE-E"

Key: "A"

Time signature: "4/4"

V1: |
  1. Jesu racham I dinni,
  Mainiu ngao tang makbo;
  Jesu kendibo racham,
  Jesu gu lungsiat lam;
  Jesu racham I dinni,
  Palingbo I se-e;
  Jesu kumjiu mai khatdi 
  Achun kawang bo ha.

CH: |
  (Chorus)
  Jesu racham I dinni,
  Haise alui thiu bamne;
  Jesu nai pagu lungsiat,
  Racham I dinni-e.

V2: |
  2. Jesu racham I dinni,
  Maisuang habo rachamse;
  Amang di mantang makbo,
  Kawibo rachamme;
  Aleng kawi kamkhaibo,
  Jesu racham dinni,
  Sibo chamse I tuhoi
  Naliu khu din khai-e.

V3: |
  3. Jesu racham I dinni,
  Siga chunwibo bam;
  Maisuang habo rachamme,
  Dinkhaijiu wibibi;
  Khangsia chiu matai makbo,
  Jesu racham dinni;
  Juringbo baibo racham,
  Tingwang chamniu din-e.

V4: |
  4. Jesu racham I dinni,
  Haitu silu maira;
  Mariu charimai kumjiu,
  Haitu chiukhaini-e;
  Paken kadibo gase.
  Chalui kasan thiune;
  Sise guangbo rachamme,
  I dinjiu bamni-e.

Translation: "(I Love to Tell the Story)"

Category: "Christ life & Love"

