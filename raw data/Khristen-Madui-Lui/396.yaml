ID: "396"

Title: "TINGGEN KYGA LUNGNE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Aliu singchai 'puiki zuan tadjiu,
  Tinggen dihga tadne;
  Chariu magenthiubo dao liudi;
  Tingwang niu gukhai ne.

CH: |
  (Chorus)
  Chaky lam Tinggen dih lam tadne,
  Aliu singchai 'puiki zuan tadjiu;
  Tinggen dihga lungne.

V2: |
  2. Aliu singchai 'puiki zuan tadne,
  Jesu phipa suijiu;
  Aliu Rapiu phipa sui tadjiu;
  Kachia namdi genlam.

V3: |
  3. Aliu singchai 'puiki zuan tadne,
  Chariu jiu bam liudi;
  Paben niu aliutu gukhai ne;
  Rapiu ramga lungra.

Translation: "(Home to the Land Above)"

Category: "Aspiration after Heaven"

