ID: "211"

Title: "CHALUNGSABO RIANGNIU"

Key: "F"

Time signature: "3/4"

V1: |
  1. Chalungsabo riang niu,
  Aliu Khristen maidung;
  Matha aruang bambo haise,
  Tinggen maidung kumme.

V2: |
  2. Rapiu Tingwang suangga,
  Wang chap jiu kheng sukhe;
  Pingbo nai manangbo hina,
  Aliu niu sao khaide.

V3: |
  3. Chariubo di phung cham,
  Karip bodi phung Cham;
  Khat niu khat tu kha sibo hai,
  Aliu Khristen cheng-e.

V4: |
  4. Aliu ramna lujiu,
  Achunsa jiu bamdi;
  Aruang lan raleng maning jiu,
  Chun khat thiu jiu bamkhe.

Translation: "(Blest be the Tied that Binds)"

Category: "Christian fellowship"

