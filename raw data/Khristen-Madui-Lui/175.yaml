ID: "175"

Title: "KARINGBO BANG BIU-E"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kinglo karingbo bang biu-e,
  Chunwibo khuan niu phuibam;
  Chunsa jengsa maitu ku-e,
  Sibo bamga wang raleng.

CH: |
  (Chorus)
  Karingbo bang biu-e,
  Mathabo luise thiulo;
  Chunwibo bang khuanse,
  Senjiu thiulo Jubilee.

V2: |
  2. Kamchariu khaimi maidung tu,
  Paniu lungsa khai lanne;
  Kasabo pumtan se hade,
  Pawang dihse kaomide.

V3: |
  3. Wanglo chari aphen raleng,
  Wanglo naliu men jijiu;
  Tingmik kasanbo se kumjiu,
  Widiangbo tingmik nawang.

Translation: "(Temperance Bell)"

Category: "Invitation & Baptism"

