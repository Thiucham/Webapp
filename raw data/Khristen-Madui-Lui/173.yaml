ID: "173"

Title: "NANG DEGA TINGTHENG LUNGRALO?"

Key: "F"

Time signature: "4/4"

V1: |
  1. Nang dega tingtheng lung ralo?
  Mathiu khuga maniu bamme;
  Dinlo nang dechiu kak ralo,
  Nang dega tingtheng lung ralo?

CH: |
  (Chorus)
  Tingtheng jeng jiu, (2x)
  Nang dega tingtheng lung ralo?
  (For last verse 4)
  Tingtheng jeng jiu, (2x)
  Tingtheng nang tu rankhai sune.

V2: |
  2. Maikakeng Khrista tu silu,
  Paliu lung kali kamlude;
  Tingtheng kadihga lung mide,
  Nang dega tingtheng lung ralo?

V3: |
  3. 'Puiki marumbo tad makjiu, 
  'Puiki kadi ga tad bamsai; 
  Pamalan ga dechiu ralo? 
  Nang dega tingtheng lung ralo?

V4: |
  4. Tuhoi ganiu malan lulo, 
  Rankhaipiu pumtan malumjiu; 
  Chiulusai nachunwi pine,
  Tingtheng karingbose lulo.

Translation: "(Where Will You Spend Eternity)"

Category: "Invitation & Baptism"

