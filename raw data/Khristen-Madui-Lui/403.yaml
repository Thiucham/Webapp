ID: "403"

Title: "DUIPUI BUINIANG SIKAM LAKBO KUM"

Key: "A"

Time signature: "4/4"

V1: |
  1. Jordan genlam aliu aruang saira,
  Rankhai mainah dungtu ngao sune;
  Duipui buiniang sikam lakbo kumjiu,
  Dejiu ga tasibo ngaoralo.

CH: |
  (Chorus)
  Duipui tabuiniang sikam lakbo kum, (2x)
  Sigasu rankhai mainah dungtu wang ngao sune,
  Duipui tabuiniang sikam lakbo kumme.

V2: |
  2. Karaidao rankhai mimai tu ngao jiu,
  Chariubo nai kahiambo hade;
  Tinggen lam aruang jiu matha bamne,
  Dejiu ga tasibo ngaoralo.

V3: |
  3. Kawibo singgiu genlamse phuijiu, 
  Shaili singbang hang ga wang chapne; 
  Ladriat khaibo ram situ phui bamne, 
  Dejiu ga tasibo ngaoralo.

V4: |
  4. Naikhat aliu rankhaipiu Jesu tu, 
  Paken dijiu wangbo ngao saira; 
  Paniu chawang thiujiu kiubo naisai, 
  Dejiu ga tasibo ngaoralo.

Translation: "(Numberless as the Stands of the Sea)"

Category: "Aspiration after Heaven"

