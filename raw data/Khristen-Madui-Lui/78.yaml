ID: "78"

Title: "SINGCHAI RIGA MASENGSHAT MIDE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Ajeng gasu Rankhaipiu singchai ga shaikhai,
  Ringra bui makbo atu rankhai;
  Akhui amao hina kuak khaira shaikhai-e,
  Pah singchai phungjiu shaikhai mide.

CH: |
  (Chorus)
  Nuan dungse singchai riga maseng shat mide,
  Paniu dejiu ga chariu khailo!
  Palung chariu jiu singchai riga shaikhaide,
  A nuan hinase kuak khai mide!

V2: |
  2. Paniu atu lungsabo hai dinse lakge,
  Alungchun se khiu masan khaide;
  I khenrang thiu mide, ladzan thiura hade,
  A nuan hina maseng shat mide.

V3: |
  3. A Rapiu tu wadao di I phut lak mide,
  Naimachang I pasai sui bamne;
  Chalui kawise thiujiu patu thuan bamne,
  A nuan hinase kuak khai mide.

Translation: "(Nailed to the Cross)"

Category: "Humiliation, Resurrection & Glory"

