ID: "205"

Title: "ATU SAODIAK TULO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Atu saodiak tulo Jesu,
  Athoi hai lulo;
  Nangniu kaki maitu kusai,
  Atu di lulo.

CH: |
  (Chorus)
  Rankhaibopiu,
  Athoi hai lulo,
  Nangniu kaki maitu kusai,
  Atu di lulo.

V2: |
  2. Lungsabo nawang bam gase,
  Atu ku khailo;
  Siga I natu kahumne,
  Nangniu gukhailo.

V3: |
  3. Nalungsiat tu I malumme, 
  Nazu phui bamme; 
  Ahiupuina magenthiu-e, 
  Nangniu gukhailo.

V4: |
  4. Alungchun matha khai raleng, 
  A Rapiu nang-e;
  A Rapiu kumbo maidi ha, 
  Ting nai kadih ga.

Translation: "(Pass Me Not)"

Category: "Response & Repentance"

