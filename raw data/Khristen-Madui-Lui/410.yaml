ID: "410"

Title: "SANG SANG MOI MOI"

Key: "C"

Time signature: "4/4"

V1: |
  1. Ranlumai masan maidung sang sang moi moi seniu,
  Ranlubo riphen dung niu kabenbo puan piulujiu;
  Kashaibo tu ngam lujiu chari thiulan lakge,
  Kachia rengmun se lekhai jiu ch'ri ngambo lui thiune.

CH: |
  (Chorus)
  Halleluyah! halleluyah!
  Kamshat mibo Milypoi;
  Halleluyah! halleluyah! halleluyah! Rapiu.

V2: |
  2. Halleluyah! shenbo khuan niu tingkadih fui-e,
  Chari ngambo luise tarah sang khuan niu thuan bamme;
  Chamai zat hina damkhaibo racham dinronlo,
  Chari ngam lujiu wangsai chaphijeng pikhai sune.

V3: |
  3. Canaan ram wangsai dejiu chunwi matha ralo!
  Siga chariu magenthiubo kapbo bamlan lakge;
  Padlak ngutlak bo kami magennah bamlan lak,
  Kapbo bamlan lakge matha amanjiu bam mine.

Translation: "(Ten Thousand Times Ten Thousand)"

Category: "Aspiration after Heaven"

