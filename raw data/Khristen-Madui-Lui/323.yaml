ID: "323"

Title: "TINGGEN WANG NAHMAI DUNG"

Key: "A"

Time signature: "3/4"

V1: |
  1. Tinggen wang nah dung kumjiu,
  Tadjiu chalui thiu bamkhe;
  Rankhaipiu tu thuanbo lui,
  Paken pa ngam dibo tu.

CH: |
  (Chorus)
  Tingwang khu lam zuan maidung,
  Puipiu mai tadbo 'puiga;
  Paliu mathajiu bamme,
  Aliudi ngao ji sune.

V2: |
  2. Kabenbo nah dung bambo,
  Zion namdi situ ngao-e;
  Tingtheng lung rabo kyga,
  A Rapiu tu ngao sune.

V3: |
  3. Chap matiplo ping mane, 
  Singnah maidung mathalo; 
  Tingwang nah Jesu niu din, 
  Pingbo thiu makjiu tadlo.

V4: |
  4. Pahniu dinbo cham phungjiu, 
  Kadih mania thuan mine; 
  Aliu tu jupao nang-e, 
  Nasai sui tadne aliu.

Translation: "(Children of the Heavenly King)"

Category: "Songs of pilgrimage"

