ID: "283"

Title: "I SINGCHAI RIPHEN MA?"

Key: "G"

Time signature: "4/4"

V1: |
  1. I singchai riphen khat thiujiu,
  Milypoi saisui jiu?
  Pazengdin thiurabo jengniu,
  I niu ping mi rama?

CH: |
  (Chorus)
  {Tingthung tu ngamne, 
   Aliu niu matan bamsai. (2x)}

V2: |
  2. Tingpuk tang atu phung sune,
  Charapen wibo dih;
  Mainiu ngamra matan bamdi,
  Shai makthen aphen ne.

V3: |
  3. Atu aphen ramai hahma? 
  Duidih niu kham bamdi; 
  Sabo nuan gu kadih seniu, 
  Tingwang khu wang luma?

V4: |
  4. I mawang raleng aphenne, 
  Rapiu atu juaklo; 
  Kasa kathiubo I khengh ne, 
  Rapiu adon ponlo.

Translation: "(Am I a Soldiers of the Cross?)"

Category: "Conflict & Victory"

