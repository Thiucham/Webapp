ID: "374"

Title: "GUKHAIBO LUNGSIAT"

Key: "F"

Time signature: "3/4"

V1: |
  1. Kadihri ating loi saira,
  Thai thiubo lui thiulan lakge;
  Tingwang ky kadibo gase,
  I wangtang sai matha bamne.

CH: |
  (Chorus)
  {I wang ngao ne a Rapiu zu,
  Gukhaibo ladse I dinne. (2x)}

V2: |
  2. Naikhat kadih aky hane,
  Sibo tingse I din silak;
  Chiudi I malumjiu bamne,
  Tinggen lam abam leng bamme.

V3: |
  3. Benbo tingmik hai hawang sai, 
  Charapen wibo kui dasai; 
  Rapiu niu kamdaode chiune, 
  Mathakbo bam ga I wangne.

V4: |
  4. I niu kadenbo loi dasai, 
  Amibung matao benlujiu,
  Rankhaipiu rengmun lekhai sai;
  Ahiuna pasai suimine.

Translation: "(Save By Grace)"

Category: "Aspiration after Heaven"

