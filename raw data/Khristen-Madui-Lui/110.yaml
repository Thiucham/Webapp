ID: "110"

Title: "WANGLO CHUNWI BAMMAI "

Key: "B"

Time signature: "4/4"

V1: |
  1. Wanglo chunwi bammai, 
  Rapiu zan ga wanglo;
  Chawang tan kachangbo,
  Pakendi jiu bamme;
  Ku kachangbo Tinggen gadi, 
  Nathubo kadihri gadi;
  Natu lungsa jiu shaikhai-e.

V2: |
  2. Pawangbam phut lujiu,
  Paphai gao khai lujiu;
  Lungsabo niu phuijiu,
  Tazai luang jiu shaikhai;
  {Palungsiat se dinse lulak, (2x)}
  Chamikuang gasu ranpad khai.

V3: |
  3. Charau ganiu sude, 
  Charuiram gasu niu; 
  Pamikre tu ngamjiu 
  Paken dibam mide;
  {Chari ngam maitu maluang lujiu, (2x)}
  Rankhaipiu Jesu mawangne.

V4: |
  4. Tingku lamsu kiune, 
  Khommai dungdi wangne;
  Aliu tu majanglu, 
  Tingthengjiu lung mira;
  {Siga aliu pazu ngaone, (2x)}
  Tingtheng patu maluang bamne.

Translation: "(Come Every Joyful Heart)"

Category: "Praise & Opening"

