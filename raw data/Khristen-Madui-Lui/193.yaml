ID: "193"

Title: "NANGKHU JESU BAMLENG BAMMA?"

Key: "C"

Time signature: "4/4"

V1: |
  1. Nang khu Jesu bamleng bamma?
  Na nuan kuak khaibo piu leng;
  Nkham maganjiu khuan bamme,
  Patu pi ngut khaira ma?

CH: |
  (Chorus)
  Kendibo wang Jesu bamleng,
  Majat jiu palad piulo;
  Nalung khamle ma nga khailo,
  Jesu nalungga ngut ra.

V2: |
  2. Tenbo thiubo senlan hina,
  Alungga maning khai jiu;
  Jesu singchai ga shaikhai-e,
  Jesu tu lukhai lakma?

V3: |
  3. Nangkhu Jesu bamleng bamma?
  Lungsajiu pah kubamme;
  Pawan wibose thainai-e,
  'Suan naira riju mine.

V4: |
  4. Naringting Jesu leng pilo, 
  Pagu lungsabo daora; 
  Nalung manang makjiu bamlo, 
  Rankhaipiu natu ku bam.

Translation: "(Have You any Room for Jesus)"

Category: "Warning & Entreaty"

