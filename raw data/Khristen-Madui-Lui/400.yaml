ID: "400"

Title: "KHAM LE BAM GA"

Key: "A"

Time signature: "4/4"

V1: |
  1. Chunwibo lui thiura nawang mide,
  Kawibo rachamse dinra;
  Rankhaipiu niu atu kuwang saira,
  Kendibo ga I bam mine.

CH: |
  (Chorus)
  Singchai sung kachia pirun pikhai ne,
  Khamse le khai lanlak mide;
  Apot ripbo pakhu ga saokhai sai,
  Jesu nai tingtheng lung mine.

V2: |
  2. Chunsabo mikdui luang lanlak mide,
  Aliu tabin ting loi dasai;
  Tingtheng jiu patu maluang lung mine,
  Tingtheng ringbo Tinggen ramga.

V3: |
  3. 'Puikise palong pabek thiu bamdi, 
  Chunwibo leng hahjiu bamdi; 
  Mathak khaira pabam hahjiu bamdi,
  Matha ri ngabo aleng-e.

V4: |
  4. Pazu wang ngaosai dejiu mathara, 
  Alungchun dejiu kimralo! 
  Wadaodi shai thiu niubo bam lanlak,
  Ramgun bamme sibo tingmik.

Translation: "(Where the Gate Swings)"

Category: "Aspiration after Heaven"

