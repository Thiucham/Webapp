ID: "58"

Title: "DIHJU-E JESU ZAI LUANGBO"

Key: "A"

Time signature: "3/4"

V1: |
  1. Di ju-e Jesu zai luangbo,
  Rapiu chawang shaibo;
  Chariu khaibo I kummai leng,
  Shaikhai bibo guhai.

CH: |
  (Chorus)
  Kungbo ranpao atu khalo,
  Atu nagu thiulo;
  Nagu chawang bam wangbo ga,
  Atu 'ning tao khailo.

V2: |
  2. Kamaobo adon jeng niu ma?
  Singchai ga shaikhaibo;
  Maisuang ha-e lungsa khaibo,
  Aleng paniu shaikhai.

V3: |
  3. Pumtan bambo Dampao Khrista, 
  Pahniu shaibo wan ga; 
  Tingkadih se tamiu wang-e,
  Nuan mai aliu leng shai.

V4: |
  4. Pah kungbo singchai ngaobo ga,
  I ma ngambo baikhai; 
  Thuankiujiu alung pangpadle,
  Siga amikdui luang.

V5: |
  5. Chariubo pao ruingam lakde, 
  Lungsa pao I phungbam; 
  Rapiu aringting pikhaide,
  Atu nachun thiulo.

Translation: "(Alas! and did My Saviour Bleed)"

Category: "Christ life & Love"

