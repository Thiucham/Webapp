ID: "8"

Title: "A RAPIU NANG DEJIU DILO!"

Key: "B"

Time signature: "4/4"

V1: |
  1. A Rapiu I na pumtan maning khai jiu, 
  Nakendibo tu I maning kamlak; 
  Chahiu chagan tingku genga ben bam jiu,
  Tamiubo hina thaoben khai bamme.

CH: |
  (Chorus)
  Ahiupuinah di natu thuan bamme,
  A Rapiu nang dejiu dilo,
  Ahiupuinah di natu thuan bamne
  A Rapiu nang dejiu dilo!

V2: |
  2. Maisuang habo mariu kajing ram luangga,
  Thing nadung chun wijiu chalui thiu bam;
  Ramluang hina se I niu a wangjiu phui,
  Singgiu hina luang saomak jiu bamme.

V3: |
  3. Jehovah panah pumli tu maja mak,
  Patu langkiu aliu din thiujiu shai;
  Nuan phungmai dung tu kuak jiu lukhai raleng,
  Pah niu singchai riga pazai luang khai.

V4: |
  4. Jesu naikhat chawang kadibo thiujiu, 
  Paken dijiu Hozam senkiu saira; 
  I niu khudung kiujiu patu kahumne, 
  Chunwibo lui thiujiu patu thuanne.

Translation: "(How Great Thou Art?)"

Category: "Grace, Redemption & Love"

