ID: "61"

Title: "CALVARY LUANGGA"

Key: "E"

Time signature: "9/8"

V1: |
  1. Calvary luangga magenthiu jiu,
  Rankhaipiu khrista chariu kheng-e;
  Nuan maitu ranra, singchai ga shai,
  Hamibo gasu kalan khai-e.

CH: |
  (Chorus)
  Rankhaipiu lungsiat dejiu ga dilo,
  Sesi I tuhoi Calvary ga ngao;
  Kadih nuan jeng niu mily zai luang khai,
  Nuan mai tu ranra pah shaikhai-e.

V2: |
  2. Jesu lungsiat suang kadih ha-e,
  Magenthiu chariubo hamine;
  Lungpubo hina mathak khaiye,
  Jesu zai niu a nuan masande.

V3: |
  3. Chakah wibo Jesu I ngaode,
  Patu thuanbo lui I thiu sune;
  Singgiu gen kawi ga mathak ra,
  Patu thuanbo lui I thiu bamne.

Translation: "(Up Calvary's Mountain)"

Category: "Christ life & Love"

