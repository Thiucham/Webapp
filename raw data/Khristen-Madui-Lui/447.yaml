ID: "447"

Title: "AGIMANAIBO KYKHUN"

Key: "⚪"

Time signature: "⚪"

CH-: |
  (Chorus)
  Chun chambo kykhun Tinggen dih leng-e,
  Apiu maileng chawang bamse;
  Apui maileng paken kadi bose,
  Nahmai lungchun Tinggen kumme.

V1-: |
  1. Khat khat ken tiabo kykhun tu phuisai,
  Agimanaibo khatdi hah;
  Khat khat ken tiak bam jiu lungbo kykhun
  Tamiubo niu gom jiu bamme.

V2-: |
  2. Chun cham jiu lungbam bo kykhun hina,
  Tinggen dih kumjiu lung bamne;
  Chun cham makjiu bambo kykhun hina,
  Chariu dih kumjiu lung bamne.

V3-: |
  3. Kykhun ga chun cham jiu lungbam lengra,
  Kadih mania niu pi ngamlak;
  Khrista gu lungchun bambo kykhun ra,
  Agimanai jiu lung bamne.

V4-: |
  4. Thai su aliu kykhun hina dungdi,
  Tingwang tu pi ngut khai sukhe;
  Tamiubo lungchun se phutmi sukhe,
  Khrista gu 'biuse ben bamra.

Translation: "(Family of Peace)"

Category: "Special songs"

