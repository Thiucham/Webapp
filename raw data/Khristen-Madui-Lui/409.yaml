ID: "409"

Title: "MILYPOI ZAI GA KHIULO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kashaibo kumjiu bambo sao saolo?
  Kating jingbo charaw mung khen gase;
  Shenlo paniu rankhai ra,
  Milypoi zaiga khiulo.

CH: |
  (Chorus)
  Jerusalem kasanbo rengmun ga ngut ra,
  Milypoi zaiga khiulo;
  Kasanbo Jerusalem rengmun ga ngut ra,
  Milypoi zaiga khiulo.

V2: |
  2. Nahdao tingga kawimai thiu lusai,
  Ningtingbo pui nai Jesu tu dao jiu;
  Pagu lungsiat niu fui ne,
  Milypoi zaiga khiulo.

V3: |
  3. Maidung se chariu magenthiu bamme,
  Jesu niu kubo khuan chiu makjiu ma?
  Lungchun masan jiu wanglo,
  Milypoi zaiga khiulo.

V4: |
  4. Chariu magenthiu jiu khengh bam maise, 
  Kathiubo miga chap ngamlu maitu; 
  Jesu din Kulam khanglo, 
  Milypoi zaiga khiulo.

V5: |
  5. Kabenbo genlam wangtang lu dasai, 
  Thiuniubo kashaibo nuan di hah-e; 
  Tingtheng tachunwi bamne, 
  Milypoi zaiga khiulo.

Translation: "(Washed in the Blood of the Lamb)"

Category: "Aspiration after Heaven"

