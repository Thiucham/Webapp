ID: "371"

Title: "I NIU PATU SINE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kadih ga ating loijiu tanung dui kenpad dasai,
  Pakendibo benbo ram I wang ngao ne;
  Gukhaibopiu tu I ngaone singgiu I ken lusai,
  Pachun wijiu atu sun adao sune.

CH: |
  (Chorus)
  I niu sine patu sine,
  Ranlu mai thiujiu pakhu chapne;
  I niu sine patu sine,
  Paben ga natri genbo zamse.

V2: |
  2. Dejiu matha ralo I niu pazu ngaobo naisai,
  Chalungsabo mikphui wang ngaobo naisai;
  I niu thuanjiu bamne paniu lungsa khaibo donniu,
  Tinggen lam aleng chabam kaden khaibam.

V3: |
  3. Lungsa mainiu atu wanglo chiujiu benjia bamme, 
  Singgiu genlam ramna mibotu maning; 
  Taning Eden ga paliu chalui thiu adao sune, 
  Chiudi I ra Jesu tu daorai ni-e.

V4: |
  4. Param namdi kawibo puanse piujiu I ngutne, 
  Mikdui luanglan makbo ramga jukhaine; 
  Tingtheng mathabo luiniu patu I thuanjiu bamne, 
  Chiudi I ra Jesu tu daorai ni-e.

Translation: "(I Shall Know Him)"

Category: "Aspiration after Heaven"

