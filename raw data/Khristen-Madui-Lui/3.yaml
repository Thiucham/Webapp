ID: "3"

Title: "PHUILO HAIJIU LUNGSABO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Phuilo Tingwang niu lungsabo,
  Mai dinsi lulak ge;
  Nuan phungjiu hami maidungtu,
  Panah chiujiu kukhai.

CH: |
  (Chorus)
  Phuilo haijiu lungsabo,
  Haijiu lungsabo Apiu niu pikhaibo gu hai-e.
  Aliu Rapiu Tingwang niu,
  Panah mai ku khai bide.

V2: |
  2. Aliu diuta de tuhoira,
  Aruang khai pazai niu;
  Lungsa bose ngao lu saira.
  A Rapiu khu bamne.

V3: |
  3. Paken dibotu lura leng, 
  Aliu mana wang-e; 
  A Rapiu lun ngaolu saira,
  A Rapiu khu bamne.

V4: |
  4. Pathoi kawibo lura leng,
  Aliu lung masankhe;
  Pakendibo a Rapiu tu,
  Aliu ngaoji sune.

Translation: "(Behold, What Love?)"

Category: "Grace, Redemption & Love"

