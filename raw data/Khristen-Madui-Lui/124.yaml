ID: "124"

Title: "RINGBO TARUAKSE THENPANG KHAILO"

Key: "E"

Time signature: "2/4"

V1: |
  1. Nang niu pikhaibo ringbo taruak se,
  Nang niu then pang khaibo taruak kumjiu;
  Masanbo bam ga I natu phiu-e,
  Ahiupuinah niu natu masenne.

V2: |
  2. Nang hai aleng ringbo taruak se-e,
  Masanbo ladkeng seniu atu gu;
  Tiulujiu ring ra aleng pikhailo,
  Majibose atu kati khailo.

V3: |
  3. Nagu Hiunase aleng pikhailo, 
  Atu dikhaijiu amik ngao khailo; 
  Akhu dinlan khailo karingbo cham, 
  Ariak khuangse len khailo I kheng-e.

V4: |
  4. Rapiu atu lungsajiu thoi khailo, 
  Galilee mung ga thoi khaibo kumjiu; 
  Nuan ga bangbo riangse kamtap khailo, 
  Agimanai bose I niu daone.

Translation: "(Break Thou the Bread of Life)"

Category: "Lord supper"

