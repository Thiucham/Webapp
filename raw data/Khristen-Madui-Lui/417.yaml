ID: "417"

Title: "GREENLAND KABUN LUANG GANIU"

Key: "F"

Time signature: "4/4"

V1: |
  1. Greenland kabun long lamsu India buiniang jiuga,
  Africa duipuak lamsu kachia buiniang luangkiu;
  Ndagu singgiu dung nai tadanli ning lamsu,
  Kamaobo gasu aliutu rankhai ra kubam.

V2: |
  2. Ceylon ram longga tingkai manuan riri hunbam,
  Wahina wibam tadi chamainah sa sujiu;
  Rapiu lungsa khaibo tu wajeng chak khai makge,
  Chara tu simak mainiu 'singtatu tu kahum.

V3: |
  3. Kulamgu tasi ningting aliu daolu maidung, 
  Wadi dinsuan makjiu maniu mak bamra jiuma? 
  Juringbo gu chunwibo mathiu khu dinbilo,
  Kadihri pakhiangna niu Messiah zan sichiane.

V4: |
  4. Tingkai nang gukhaibo racham phung tad khaibilo, 
  Kasuak bambo duidi hina ga dinron khailo; 
  Nuanmai leng papum pijiu shaikhaibo Milypoi, 
  Rankhaipiu dampao chawang thiujiu wanglan mak then.

Translation: "(From Greenland Icy Mountain)"

Category: "Death & Rise"

