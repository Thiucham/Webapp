ID: "361"

Title: "NAIKHAT TINGMIK WIBO THIUNE"

Key: "D"

Time signature: "3/3"

V1: |
  1. I chiu-e chalui kawi khuan,
  Sibo luise I maniu-e;
  Tarah khuan-e I malumme,
  A Rapiu chun sai I thiune.

CH: |
  (Chorus)
  Naikhat tingmik wibo thiune,
  Akhuan di tarah khuan kumjiu;
  I thiubam ne chalui kawi,
  Jesu khuga wang mathak sai.

V2: |
  2. I niu nbin bo ting loisai,
  Tinggen ram wibo I lune;
  Magenthiubo tonlu saira,
  A Rapiu tu I wang ngao ne.

V3: |
  3. Naikhat tingmik khuanjiu bamme, 
  Kachia rengmun lekhai raleng;
  Majadlo pating nawang-e,
  Siga tingtheng I lung mine.

V4: |
  4. I tadrabo ting wangtang sai,
  Tinggen puiki I simakdi;
  Tingwang benniu atu jujiu,
  Naikhat atu juwang khaine.

Translation: "(Some Happy Day)"

Category: "Aspiration after Heaven"

