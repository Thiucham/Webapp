ID: "33"

Title: "JESU LUNGSIAT "

Key: "G"

Time signature: "4/8"

V1: |
  1. Jesu akhu wangbonai, kadih kasan khat I ngao-e,
  Dahra I haikumbo lunlungga bam mak;
  Jesu niu makjiu saoniu chunwi haisi pin ngam ralo?
  Jesu aliutu lungsabo dejiu dilo?

CH: |
  (Chorus)
  Nachun wi kachangbo, luni kachang saira,
  Jesu khu wang lulo, natu khuanjiu bamme;
  Jesu tu malumsai, wahina nagu-e.

V2: |
  2. Mariu hangga charapen, penjiu phungben pad bambo hai,
  Palun kawibo niu Tingwang jan din-e;
  Thingna dungniu mara bambo hai, ramzing tu phungben-e,
  Chiudi chamaina dung ra chunwibo ha-e.

V3: |
  3. Kadihri gu mania dung hinase nagu thiu nima? 
  Nagu thiudi, Jesu tu lukhai maksai; 
  Nating loibo nai, chakhiu thinjiu, tinggen khang lubuima? 
  Asingnah yo, tuhoi natu maniu lulo.

V4: |
  4. Palunwibo kadih khat, dam lujiu aliutu khuan bam, 
  Rankhaipiu siga aliutu khuan bamme; 
  Aliudi tu siga lungra leng, chunwijiu khuan bamme, 
  Nangdi siga wang lungni sai kadenlulo.

Translation: "(Jesus Loves)"

Category: "Christ life & Love"

