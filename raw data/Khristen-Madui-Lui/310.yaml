ID: "310"

Title: "CHALU ATIAT SE DEKUM RALO?"

Key: "C"

Time signature: "3/6"

V1: |
  1. Nsuan tingga chalin marukbo, 
  Marin tingga chalin marukbo;
  Chawan liangdi chalin marukbo, 
  Chunding wan ga chalin marukbo.

CH: |
  (Chorus) 
  Atiatse dekum ralo? (2x)
  Tamiu kaben ga chalin maruklo,
  Suanbo nai tanbo gadi maruklo,
  Tingtheng leng pawan ga maruklo;
  Kengjiu pasy khom wang sune.

V2: |
  2. Mpui mungga chalin marukbo,
  Tuleng riga chalin marukbo;
  Tathu jiuga chalin marukbo,
  Kadih tamga chalin marukbo.

V3: |
  3. Chariu khengjiu chalin maruklo, 
  Chunsa jengsa bamdi maruklo; 
  Mainiu dinmasadi maruklo, 
  Ma ngam bamdi chalin maruklo.

V4: |
  4. Ma nangbo lung phungjiu maruklo, 
  Mikdui luangdi chalin maruklo; 
  Geramai wang makthen maruklo, 
  Chunwijiu chaky ga khom wangra.

Translation: "(What Shall be the Harvest Be?)"

Category: "Christian service & Reward"

