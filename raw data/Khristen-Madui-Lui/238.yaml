ID: "238"

Title: "NAKHU NAWANG-E"

Key: "G"

Time signature: "3/4"

V1: |
  1. Tingtheng ringbo nang agu-e,
  Kung thubo chaka nang-e;
  Kadih ga tabin tadbam then,
  Nasai suijiu I tadne.

CH: |
  (Chorus)
  Nakhuga nawang-e, (2x)
  Kadih ga tabin tadbam then,
  Nasai suijiu I tadne.

V2: |
  2. Kadih gu mathabo leng mak,
  Changeng leng I kheng makge;
  Wakhat niu di achun wijiu,
  Nasai suijiu I tadne.

V3: |
  3. Kashaibo dih I ken makthen,
  Duidi gen juken khailo;
  Ringbo rengmun wangtang makthen,
  Nasai suijiu I tadne.

Translation: "(Close to Thee)"

Category: "Desire after holiness"

