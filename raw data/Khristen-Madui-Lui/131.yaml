ID: "131"

Title: "TINGWANG NIU MAJANG BAMLO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Tingwang niu natu majang bamlo,
  Pahniu natu jukhai bijiu;
  Pagu mily tu ribo kum,
  Tingwang niu natu majang bamlo.

CH: |
  (Chorus)
  Ngao daolan makthen na,
  Jesu suang ga dao makthen;
  Ngao daolan makthen na,
  Tingwang niu natu majang bamlo.

V2: |
  2. Tingwang niu natu majang bamlo,
  Pahkan sungga jukhai lujiu;
  Nai machang na rikhai bine,
  Tingwang niu natu majang bamlo.

V3: |
  3. Tingwang niu natu majang bamlo,
  Kapingbo niutan wang bamdi;
  Paben niu natu pam lujiu,
  Tingwang niu natu majang bamlo.

V4: |
  4. Tingwang niu natu majang bamlo,
  Nari ga pengphai kajit jiu;
  Kashaibo niu ngam lanlakge,
  Tingwang niu natu majang bamlo.

Translation: "(God Be With You)"

Category: "Evening closing"

