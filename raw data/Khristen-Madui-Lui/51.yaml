ID: "51"

Title: "PAZAN MASAN BOSE"

Key: "A"

Time signature: "4/4"

V1: |
  1. He! magenthiu jiu bam maidung,
  Jesu zan hai maning lo;
  Chalungsa jiu gukhai bine,
  Nang tad khaibo bam machang.

CH: |
  (Chorus)
  {Pazan masanbo se,
  Nalung ga maning bamlo. (2x)}

V2: |
  2. He! magenthiu jiu bam maidung,
  Kahiambo tan wangsai ra;
  Kasa daosai chari thiura,
  Jesu zanse maning lo.

V3: |
  3. Jesu zan hai dejiu wilo!
  Achunwi jiu thuan bam khe;
  Chalungsabo benniu jukhai,
  Chunwibo lui se thiu khe.

V4: |
  4. Jesu zan masanbo situ,
  Khudung kiujiu kahum ne;
  Aliu tabin tadloi dasai,
  Patu pirun run khai ne.

Translation: "(The Precious Name)"

Category: "Christ life & Love"

