ID: "69"

Title: "TAZAI DUIPOK KHAT LUANG BAMME "

Key: "C"

Time signature: "4/4"

V1: |
  1. Tazai duipok khat luang bamme.
  Immanuel gasu;
  Nuan kaphungmai sibo zaiga, 
  Pachengsa khiu bamme.

CH: |
  (Chorus) 
  Pachengsa masan ne; (2x)
  Nuan kaphungmai sibo zaiga, 
  Chengsa khiu masan ne.

V2: |
  2. Ka agamai singchai ga shai, 
  Tazai duipok ngaolu;
  Sise I niu se masan lu, 
  I di masan lubui.

V3: |
  3. Sibo zaipok I ngaolujiu, 
  Achengsa khiu masan; 
  Rankhaibo racham din bamne, 
  Shai makthen din bamne.

V4: |
  4. Palungsiat kawibo situ, 
  I niu thuanjiu bamne; 
  Aringting loi jiu shai midi, 
  Ahiuna niu thuanne.

Translation: "(There is a Fountain)"

Category: "Humiliation, Resurrection & Glory"

