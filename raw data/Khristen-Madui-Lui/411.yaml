ID: "411"

Title: "WIBO RAM GASE WANG BAM MINE"

Key: "B"

Time signature: "4/4"

V1: |
  1. Kadiubo lam niu chariubo lad akon ga chiu-e, 
  Nuan niu kadihri fui jiu maihina tu jinde;
  Pingbo manangbo seniu atu kam chariu lanlak, 
  Wiboram gase I wang bam mine.

CH: |
  (Chorus) 
  I lung bambo long riga, 
  Wadao di kamuang gomlak;
  Wadao di luang saomak bo, 
  Singgiu duise sakbam;
  Pama lan habo man na tiujiu;
  Chunwi jiu patu thuanne,
  Wibo ramga I wang bam mine.

V2: |
  2. Kapingbo tingthung kadihpiri ga hunjiu bamme, 
  Chari thiura maidung se wang madui bam mine;
  Tingwang lungsiat gasu atu rankhai bide thainai, 
  Wiboram gase I wang bam mine.

V3: |
  3. Tingthung tingkai tanwang bamdi atu kam chariu lak, 
  Pawan machang Tingwang benniu atu jukhai bam; 
  Naimik wadaodi kui mak wadaodi tamiu lanmak, 
  Wiboram gase wadi manang mak.

V4: |
  4. Wiboram wangsai Tingwang bensiam ngaojiu chun wine, 
  Pakhuan wibose kingjiu thoidamse I lune; 
  Ahiupuina juring bose masanjiu daolude, 
  Wiboram gase I wang bam mine.

Translation: "(Dwelling in Beulahland)"

Category: "Aspiration after Heaven"

