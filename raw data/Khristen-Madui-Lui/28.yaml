ID: "28"

Title: "MATOMKY GA NGENAH JIKHAI RADI HA"

Key: "F"

Time signature: "3/4"

V1: |
  1. Matomky ga ngena si jikhai raha,
  Ngena Jesu mathak bamme chunwi jiu;
  Tinggen lamsu chagan thao kiujiu phui bam,
  Ngenah Jesu khaoring kuangga ji bam-e.

V2: |
  2. Khaoring kuang niu ngena tu kam marak khai,
  Chiudi ngenah Jesu kiam jiu kap makge;
  Jesu I natu lungsa-e chiudin bam,
  Tingben pat makthen atu maluang khailo.

V3: |
  3. Rapiu Jesu yo atu majang khailo,
  Pawan machang atu lungsa khai khelo;
  Nahmai hinatu wangjiu thoi khai khelo,
  Aliu tu tinggen tang jiu jukhai khelo.

Translation: "(Away in a Manger, no Crib for His Bed)"

Category: "Christmas"

