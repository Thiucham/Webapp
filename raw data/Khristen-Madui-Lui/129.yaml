ID: "129"

Title: "THOIKHAIJIU PI RAMNA KHAILO "

Key: "A"

Time signature: "4/4"

V1: |
  1. Thoikhai jiu piramna khailo,
  Pi agaimanai khailo;
  Nalungsiat 'liu khu pikhailo,
  Chari ngambo pirun lura;
  Aliu chun kasan pikhailo,
  Chabin tadron jiu bamga.

V2: |
  2. Matha jiu aliu thuan bamne,
  Tacham kawi pikhailo;
  Nagu juringbo kendi se,
  Tingtheng aliu thuan bamra;
  Malumbo rasy pikhailo,
  Natu mangaimak raleng.

V3: |
  3. Tinggen lam niu pise khai jiu,
  Aliutu kuda sai ra;
  Tinggen maza niu jukhai ne,
  Chunwi jiu pasai suine;
  Khrista nai tingtheng lung chamne,
  Tingtheng matha bam mine.

Translation: "(Lord Dismiss Us With Thy Blessing)"

Category: "Evening closing"

