ID: "288"

Title: "KHAT KHAT CHUN PHUI KHAILO "

Key: "A"

Time signature: "6/8"

V1: |
  1. Naliu lung kabuak tulo,
  Rapiu khuga bamlo;
  Malum makjiu kap tulo,
  Khrista ga jibam maitu;
  Paniu pui wang lanne.

CH: |
  (Chorus)
  {Khristen maihina,
  Khat khat chun piwi khailo;
  Karingbo wibo cham dinjiu ri nga bamlo. (2x)}

V2: |
  2. Naliu lung kabuak tulo, 
  Khrista tu malumlo;
  Chunsa zengsabo suangra,
  Chunwi ri nga jiu bamlo;
  Paniu pui wang lanne.

V3: |
  3. Rapiu wangra tu khuan lo,
  Pah wanglan ji sune;
  Tinggen khang mibo piuniu,
  Masanmai dungtu majang;
  Kiulan sangjing ra-e.

Translation: "(Comfort Ye One Another)"

Category: "Comfort in sorrow"

