ID: "185"

Title: "THAICHUN MALUMBO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Nang kabenbo tu sao lujiu,
  Kadihri tu ramna suma?
  A singnah nalung tan talo,
  'Thaichun malumlo.

CH: |
  (Chorus)
  'Thaichun malumlo, (2x)
  Ranlu nisai 'Thaichun malumlo.

V2: |
  2. 'Suannai naimik patlan maksai,
  Thoidam kawi ngao laksune;
  Kawibo tingga mazadlo,
  'Thaichun malumlo.

V3: |
  3. Rapiu nang wangra khuan bamme, 
  Kakungbo nang luni makma? 
  Nalung tanbo tu thonlujiu, 
  'Thaichun malumlo.

V4: |
  4. Rapiu ra maitu phutlakge, 
  Patu nang majang lungni sai; 
  Malumlo pachamse jaijiu, 
  'Thaichun malumlo.

Translation: "(Oh! Why not Tonight)"

Category: "Invitation & Baptism"

