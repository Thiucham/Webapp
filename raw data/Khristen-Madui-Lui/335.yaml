ID: "335"

Title: "RAPIU TINGWANG LAD GANIU CHAPLO "

Key: "B"

Time signature: "4/4"

V1: |
  1. Chaplo Khrista chawang ladren saisuiju,
  Kui kalakbo patu thuan jiu bam raleng;
  Achunwi jiu mathajiu chalui thiulo,
  Rapiu Tingwang lad ganiu chaplo.

CH: |
  (Chorus)
  Chaplo chaplo, 
  Rapiu Jesu ga chapjiu paladren suilo;
  Chaplo chaplo,
  A Rapiu ladren suijiu I chapne.

V2: |
  2. Rapiu ladren sai suijiu I kao lakge,
  Tingkai tingriu se tanjiu hun wang bamdi;
  Ringbo Tingwang lad ganiu I chap bamne,
  Rapiu Tingwang lad ganiu chaplo.

V3: |
  3. Rapiu ladren sai suijiu tuhoi ngao-e,
  Pazai seniu achengsa khiu masan khai;
  Khrista Jesu niu maihina tu rankhai,
  Rapiu Tingwang ladriat ga chaplo.

V4: |
  4. Chaplo Khrista chawang ladren saisuiju, 
  Wadao khatdi halakbo ladren hai-e; 
  Hiuna heng seniu nai machang ngam khaine, 
  Rapiu Tingwang ladriat ga chaplo.

V5: |
  5. Ladriat gase chap matip bamsai kaolak, 
  Kinglo hiuna niu kubo pawan machang; 
  Atu rankhaipiu khuga mathak bamne, 
  Rapiu Tingwang ladriat ga chaplo.

Translation: "(Standing on the Promises of God)"

Category: "Assurance & Testimony"

