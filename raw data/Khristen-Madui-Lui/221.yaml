ID: "221"

Title: "HE! MASANBO HIUPUINA"

Key: "G"

Time signature: "3/4"

V1: |
  1. He! masanbo hiupuina,
  Pawan machang majanglo;
  Aliu chabin tadkin ga,
  Nang aliutu jukhailo;
  Chungsa mai ri nga lulo,
  Pa khuan manuan jiu ku-e;
  Ronmeng kin maidung wanglo,
  Chaky tangbo jukhai ne.

V2: |
  2. Withubo chaka seniu,
  Natu majang jiu bamme;
  Chariu magenthiubo ga,
  Phut khai tulo aliutu;
  Tingthung tanjiu wang liudi,
  Lungchun chariu jiu bamdi;
  Ronmeng kin maidung wanglo,
  Chaky tangbo jukhai ne.

V3: |
  3. Aliu ten hai loi dasai,
  Aliu chunwi jiu bamne;
  Aliu zan raokhai khera,
  Malumjiu aliu kheng-e;
  Jesu zai ronna seniu,
  'Liutu khiu masan ngamme;
  Ronmeng kin maidung wanglo,
  Chaky tangbo jukhai ne.

Translation: "(Holy Spirit Faithful Guide)"

Category: "Driving guidance & Protection"

