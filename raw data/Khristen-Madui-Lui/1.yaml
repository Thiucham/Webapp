ID: "1"

Title: "CHALUNGSABO KHUANSE"

Key: "D"

Time signature: "3/2"

V1: |
  1. Chalungsabo khuanse, 
  Nking wibo khuanne;
  Tinggen lamniu senkiubo khuan,
  Kadih mai chiu chia ne.

CH: |
  (Chorus)
  Lungsa jiu rankhai,
  Hai-e, alad le; 
  Chamai leng Jesu shaikhai, 
  Jesu aleng shai khai.

V2: |
  2. Azan raokhai mide, 
  Karingbo ariak ga: 
  Milypoi atu lungsa khai,
  Chariu hina phung khai.

V3: |
  3. Lungsajiu kati khai, 
  Tinggen npui tad raleng; 
  Lungsa khaibosi ngao lude,
  Tingwang niu pikhai-e.

V4: |
  4. Lungsajiu kati khai, 
  I khenghsi lura leng; 
  Lungsajiu guwang khai bide, 
  Atu phutmi lakge.

V5: |
  5. Tingwang niu lungsajiu, 
  Ahiupuina rankhai 
  Apumtan bambo hinasi, 
  Nagu thiu khaimilo.

Translation: "(Grace! it's a Charming Sound)"

Category: "Grace, Redemption & Love"

