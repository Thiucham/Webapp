ID: "364"

Title: "HE! WIBO RAM"

Key: "G"

Time signature: "3/4"

V1: |
  1. I wang-e lungwibo ramga,
  Pakhiu hinase aleng-e;
  Param kabenbo wibo ram,
  Tamiubo hina ken lude.

CH: |
  (Chorus)
  He! wibo ram wichangbo ram,
  Maluang kubo ga I chap jiu,
  Duidi genlam I phui bamme;
  Aleng kaden khaibo kyga,
  Kendibo tu phuijiu bamne,
  Tingtheng aleng-e Tinggen ky.

V2: |
  2. Rankhaipiu nai I tad bamne,
  Patu maluang jiu I bamne;
  Lungsajiu paben niu jukhai,
  Tinggen dih wibo namdih ga.

V3: |
  3. Patingkai rim manam wibo, 
  Pasingniubon madia riri; 
  Charapen di kui makbo ram, 
  Tingtheng ringbo dui luang bamme.

V4: |
  4. Chapuan kawibo piulujiu, 
  Tinggen mai chalui thiu bamme; 
  Tinggen maza sangkai mainiu, 
  Rankhaibo lui thiu mathane.

Translation: "(Beulah Land)"

Category: "Aspiration after Heaven"

