ID: "250"

Title: "NAWANG-E A RAPIU "

Key: "G"

Time signature: "4/4"

V1: |
  1. He! Tingwang I na wang-e, 
  Napam wibo ga, 
  Nakan sung ga I baine, 
  I tingtheng bamra;
  Kasabo niu tan wangjiu, 
  Asai asuang gom bamdi, 
  Rapiu nang niu gukhailo, 
  Na wang-e a Rapiu.

V2: |
  2. Tudi ga I na wang-e, 
  Ahiuna baira, 
  Kapingbo duidet situ, 
  I ping ra ha-e;
  Tingthung tu I ping lakge, 
  Kasabo niu ngam lulak, 
  Nakan sungga se baine, 
  Na wang-e a Rapiu.

V3: |
  3. Na wang-e Gukhaipiu khu, 
  I mana wang-e, 
  Atu nachunbo thiulo, 
  A Rapiu nang niu; 
  Magen thiubo wang bamdi, 
  Chun saboniu phui bamdi, 
  Nagu lungsabo jeng niu, 
  Chunsabo bamlak.

V4: |
  4. Na wang-e Rapiu nakhu,
  kabenbo biuga, 
  Sanwibo nanah piuse, 
  Ri ngabo leng-e; 
  I bamne nalungsiat ga,
  Napam ga pibam khailo,
  Tingtheng tudi ga wang-e, 
  Na wang-e Rapiu.

Translation: "(Closer Lord to Thee)"

Category: "Consecration"

