ID: "75"

Title: "HALLELUYAH CROSS JENGNIU "

Key: "B"

Time signature: "4/4"

V1: |
  1. Singchai somkhai bamme,
  {Halleluyah; (2x)}
  Nuan hina kuak khai-e,
  {Halleluyah; (2x)}
  Kapingbo tingthung se, 
  kadihmai niu mani,
  Haise loisui makge, 
  Halleluyah Cross jeng niu!

CH: |
  (Chorus)
  Halleluyah, (3x)
  Cross jeng niu;
  {Halleluyah, (2x)}
  Wadao khatdi ha lakge! 
  (Repeat chorus)

V2: |
  2. Pakendibo singchai,
  {Halleluyah; (2x)}
  Hai niu chari ngamde,
  {Halleluyah; (2x)}
  Tingwang niu lungsa jiu, 
  Khrista tu lang kiu-e,
  Aliu nuan kuak khai ra,
  Halleluyah Cross jeng niu!

V3: |
  3. Chapaw hina ruikhai,
  {Halleluyah; (2x)}
  Lui nuan hina kuak khai,
  {Halleluyah; (2x)}
  Singchai tu zuan wanglo,
  Khrista liu leng shai khai,
  Ringbo chawang khrista,
  Halleluyah Cross jeng niu!

Translation: "(Halleluyah for the Cross)"

Category: "Humiliation, Resurrection & Glory"

