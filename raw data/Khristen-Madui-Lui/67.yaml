ID: "67"

Title: "SUANG HABO SINGCHAI TU I PHUI"

Key: "E"

Time signature: "3/4"

V1: |
  1. Suang habo singchai tu I phui, 
  Kendibo wang nah shaikhai bo;
  Agu khiulan hai matha-e, 
  Agenthiubo hai mareng de.

V2: |
  2. A sao thiumak ra a Rapiu, 
  Nang shaibo niu atu rankhai;
  Pageng habo dih maning dung, 
  Pazai ga katpad khai mide.

V3: |
  3. Phuilo papi paben paphi, 
  Chariubo lungsabo luang kiu;
  Tathu pirun di runkhaibo, 
  Dejiu ga lungsabo gulo.

V4: |
  4. Kadihri hai agu thiu lu, 
  Paleng pi di pagu suang habo;
  Lungsa nai kada silak, 
  Apum ahiuna pagu ne.

Translation: "(When I Survey the Wondrous Cross)"

Category: "Humiliation, Resurrection & Glory"

