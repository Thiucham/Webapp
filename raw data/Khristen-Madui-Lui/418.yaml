ID: "418"

Title: "JESU NIU KABENBO THAOLO CHIU DIN"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jesu niu kabenbo thaolo chiudin,
  Chun tamiubo ga kahiu biuse kumjiu;
  Kadih tamiubo thaoben khaira,
  Nang niu nakhu lam I niu akhu lam.

V2: |
  2. Aliutu Jesu leng ben bamlo chiu,
  Aliu biuse ben makbo paniu se-e;
  Tinggen lamsu aliutu phui kiu,
  Nang niu nakhu lam I niu akhu lam.

V3: |
  3. Jesu niu pabam machang benra thao,
  Tamiubo niu gombo kadih maidung tu;
  Paliu cheng kasa hina thon ra,
  Nang niu nakhu lam I niu akhu lam.

Translation: "(Jesus Bids us Shine)"

Category: "Death & Rise"

