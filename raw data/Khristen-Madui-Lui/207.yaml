ID: "207"

Title: "NAMDULO NACHUN"

Key: "A"

Time signature: "3/4"

V1: |
  1. Magenthiu mai nuan kuak raleng,
  Namdulo nachun;
  Namang wijiu jikiang susai,
  Kham le ma ngalo.

CH: |
  (Chorus)
  Karingting mibung ben bamga,
  Tingwang lungchun masen bamga;
  Malan wanglo lungsabo ga,
  Nang ronmeng talo.

V2: |
  2. Rankhaipiu lungsajiu ku-e,
  Namdulo nachun;
  Lungsajiu kubo khuan kinglo,
  Kham le ma ngalo.

V3: |
  3. Champao kawiniu ku bamga,
  Namdulo nachun;
  Juringbo se daolu raleng,
  Kham le ma ngalo.

V4: |
  4. Kuilan makbo mathabo ga, 
  Namdulo nachun;
  Tingtheng jeng manaijiu bamra,
  Kham le ma ngalo.

Translation: "(Close Thy Heart no More)"

Category: "Response & Repentance"

