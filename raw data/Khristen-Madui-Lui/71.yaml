ID: "71"

Title: "JESU RINGSU MIDE"

Key: "C"

Time signature: "4/4"

V1: |
  1. Phuilo Easter gu tingmik hai, 
  Ka mathabo Easter;
  Phuilo raukhamse lemide, 
  Kashai tu ngam lujiu.

CH: |
  (Chorus) 
  Pah dinbo kum Jesu sude, 
  Charau ganiu ringsu mide;
  Matha jiu thuanlo Easter ting-e, 
  Gukhaira Jesu ringsu mide.

V2: |
  2. Phuilo kashaibo pumtan tu, 
  Chaphai niu majiu khai;
  Phuilo charau marong mide, 
  Jesu hai ga hade.

V3: |
  3. Phuilo kadiga bam lanne, 
  Palungsiat dinronlo; 
  Pakendibo luntu phuilo,
  Tinggen lun thiu mide.

V4: |
  4. Phuilo Easter gu tingmik hai,
  Easter lad lui thiulo; 
  Phuilo Easter gu kalen hai,
  Rapiu gu ka ngambo.

Translation: "(Jesus is Risen)"

Category: "Humiliation, Resurrection & Glory"

