ID: "187"

Title: "NAOPAOPIU NIU WANGLO CHIU KUBAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tinggen lam naopaopiu khuanse kinglo,
  Khumkibo ga wang raleng kubamme;
  Chiulu maihina niu chunwi jiu wanglo,
  Paman hajiu ringra duipin pikhaine.

CH: |
  (Chorus)
  Naopaopiu khuan kinglo,
  Kaden bamlo namen jijiu wangra;
  Nachun wijiu khumkibo ga wang khailo,
  Tingtheng jiu halan makjiu ringbo pine.

V2: |
  2. Mariu chari jiu bammai tu ku-e,
  Wangjiu tiululo karingbo taruak;
  Natu khuan bamme naopaopiu Jesu niu,
  Kawang maihina sanwibo thiu sune.

V3: |
  3. Ronjiu meng mimai wanglo chiu ku-e,
  Malan wangjiu ringbo duisak lulo;
  Chari jiu bammai dungtu kim khai sune,
  Naopaopiu Jesu niu natu kubamme.

Translation: "(The spirit and Bridegroom say Come)"

Category: "Invitation & Baptism"

