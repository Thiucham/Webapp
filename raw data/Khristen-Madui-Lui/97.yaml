ID: "97"

Title: "TINGTHENG TUDI"

Key: "B"

Time signature: "3/4"

V1: |
  1. Tingtheng tudi aleng-e,
  I baine nasung ganiu;
  A Rapiu pum gen ganiu,
  Tazai nai duiking luang khai;
  A nuan hina masanlo,
  Atu rankhailo nang niu.

V2: |
  2. Aben nianiu ten lujiu,
  Napum ga masan ngam lak;
  Alungchun I machun jiu,
  Mikdui luang jiu bam liudi;
  A nuan hina masan ra,
  Nang atu lungsa khailo.

V3: |
  3. I wadi phung wangmak ge,
  I zuan wang-e singchai ga;
  Apum ruang natu zuan wang,
  Nang niu apuan thiu khai ra;
  Nazai niu masan khailo,
  Atu gukhailo nang niu.

V4: |
  4. I magenthiu bamlu jiu,
  Shai jiu amik ngui kiu sai;
  Haibo dih tu phut lujiu,
  Na ladzan I wang ngao ne;
  Tingtheng tudi ha lakbo,
  Atu bai khailo nang niu.

Translation: "(Rock of Ages)"

Category: "Praise & Opening"

