ID: "74"

Title: "HALLELUYAH RINGSU MIDE"

Key: "G"

Time signature: "3/4"

V1: |
  1. Halleluyah ringsu mide,
  Jesu Tinggen wang mide;
  Shaibo rawkham phungra lujiu,
  Tinggen mai hozam sen-e;
  {Ringsu mide, ringsu mide,
  Ringde shailan bi lakge. (2x)}

V2: |
  2. Halleluyah pah ring sude,
  Aliu Rapiu thiu bamne;
  Masanbo hiupuina kiujiu,
  Aliutu kha khai bine;
  {Ringsu mide, ringsu mide,
  Aliu nuan phung maha khai. (2x)}

V3: |
  3. Halleluyah pah ring sude,
  Kashaibo niu ngam lakge;
  Khrista ga sulanra bamme,
  Malum maidi sulanne;
  {Ringsu mide, ringsu mide,
  Ring bambo a Rapiu-e. (2x)}

Translation: "(Halleluyah He is Risen)"

Category: "Humiliation, Resurrection & Glory"

