ID: "380"

Title: "ADAO SUMA SINGGIU GENLAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Adao suma singgiu genlam?
  Benbo maza bambo ga;
  Masingbo singgiu luang jiu bam,
  Ch'wang bam ganiu luang kiu-e.

CH: |
  (Chorus)
  Adao suma singgiu genlam?
  Palun matai wibo singgiu genga;
  Masan maidung tu wang adao ne,
  Chawang bam suang ga seniu.

V2: |
  2. Duipin padbo singgiu gase,
  Masan khaine aliutu;
  Tingtheng jeng patu kahum ne,
  Chunwi matha tingmik ge.

V3: |
  3. Benbo singgiu wang tang dasai, 
  Magenthiu chariubo hah; 
  Hiupuina tu juring khaine, 
  Siga wang pirun lune.

V4: |
  4. Chunwibo singgiu genlam se,
  Rankhaipiu zu wang ngaone; 
  Masan maidung ramna lanlak, 
  Ranlubo luise thiune.

V5: |
  5. Adao sune singgiu genlam,
  Aliu ringting loi dasai; 
  Aliu chunwi matha bamne,
  Kingwibo lui thiu bamne.

Translation: "(Shall We Gather at the River)"

Category: "Aspiration after Heaven"

