ID: "406"

Title: "CHUN TAMIUBO HA-E"

Key: "E"

Time signature: "3/4"

V1: |
  1. Naimik kiu makbo ramga,
  Namdi wibo bamme;
  Wadao di kuilan lakge,
  'Chun tamiubo hah-e.

CH: |
  (Chorus)
  Mikdui di luanglan lakge,
  Kashai thiuniu bo di hah;
  Takum pariak silakge,
  'Chun tamiubo hah-e.

V2: |
  2. Rengmun hina kachia-e,
  Namdi wibo gase;
  Puiki di kachia niu ben,
  'Chun tamiubo hah-e.

V3: |
  3. Rengmun hina lesao mak, 
  Namdi wibo gase; 
  Siga ringlan dui luangbam, 
  'Chun tamiubo hah-e.

V4: |
  4. Siga naimik pageng hah, 
  Namdi wibo gase; 
  Milypoi niu ben bamme, 
  'Chun tamiubo hah-e.

Translation: "(No Night There)"

Category: "Aspiration after Heaven"

