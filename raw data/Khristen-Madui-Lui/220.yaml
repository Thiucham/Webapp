ID: "220"

Title: "JEHOVAH ATU JULO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Jehovah nang atu julo,
  Agu tabin mpui tadga;
  I ra suan di nangra tanne,
  Naben tanniu jukhailo;
  Tinggen manna ringbo taruak,
  {Atu pi kimkhai khelo. (2x)}

V2: |
  2. Karingbo duipin lekhailo,
  Wikhaibo duipin gasu;
  Benbo mipuong se thaokhai lo,
  Na pumtan seniu gulo;
  Nang niu agu chagee thiulo,
  {Atu gukhai jiu bamlo. (2x)}

V3: |
  3. Jordan giuki I kenpad sai,
  Kapingbo hathon khailo;
  Katanbo duiliu gasu di,
  Cannan tangbo jukhailo;
  Siga natu I thuan bamne,
  {Tingtheng natu thuan bamne. (2x)}

Translation: "(Guide Me Oh! thou Great Jehovah)"

Category: "Driving guidance & Protection"

