ID: "89"

Title: "KIULO HIUPUINA MAKHAONA"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. Kiulo hiupuina makhaona,
  Aliu lungsu khailo;
  Phaimiu kakung chamse dinra,
  Chamipong tao khailo.

V2: |
  2. Kiulo masanbo hiupuina,
  Phaimiu cham dinkhailo;
  Masanbo chamse dinkhailo,
  Naron na dinkhailo.

V3: |
  3. Nakanse kaphing pat lujiiu,
  Aliu riga kiulo;
  Aliu lungchun tamiubose,
  Thaoben khailo tuhoi.

V4: |
  4. Tingwang papum siakniu thaokhai,
  Aliu lung chun benra;
  Lungsiat chamse mai hina ga,
  Thao khailo 'liu khuga.

Translation: "(Come Holy Spirit Heavenly Dove)"

Category: "Holy spirit"

