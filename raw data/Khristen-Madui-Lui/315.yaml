ID: "315"

Title: "MALEE SE RANKHAI SULO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Tadui dijiu kasuak bamdi, 
  Tingtheng ringra ramkhai sulo;
  Jupao seniu tadrai bamsai, 
  Malee ramkhai sulo.

CH: |
  (Chorus) 
  Ramkhai sulo tingthung se ha wang-e,
  Tamiubo se tingtheng lakge;
  Ramkhai sulo! 
  Tingwang niu chaky lam majang khaine.

V2: |
  2. Puiki se theng jiu bam liudi, 
  Paniu natu jukhai bine;
  Tingkai tingriu tanbam bidi, 
  Malee ramkhai sulo.

V3: |
  3. Tingthung tingkai se tanbam di, 
  Nsuan ting se nawang bibi;
  Chawan di nawang bibi-e, 
  Malee ramkhai sulo.

V4: |
  4. Mathak bamse na wang kinne, 
  Pengphaise kajit jiu bamlo; 
  Tingmik machang patu phuilo, 
  Malee ramkhai sulo.

V5: |
  5. Duiliu kasuak matan wangjiu, 
  Nalung chun kam chariu bamdi;
  Hujiu bamlo Tingwang lad ga, 
  Malee ramkhai sulo.

Translation: "(Sail On Sail Home)"

Category: "Christian service & Reward"

