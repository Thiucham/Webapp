ID: "378"

Title: "MIKDUI LUANGBO SAI ARUANGBO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Rankhaibo malee ga tong lujiu,
  Tingwang lad wibo dinron khe;
  Hami maidung tu ringlan raleng,
  Tinggen ram wibo ga lung raleng.

CH: |
  (Chorus)
  Tinggen ramga mikdui kiu lan lakge,
  Kapbo mikdui sang lusai matha ne;
  Tinggen mai nai thuanbo lui thiucham jiu bamne,
  Rankhaibo ramga niu wang madui ne.

V2: |
  2. Rankhaibo malee ga tong lujiu,
  Wa manang makjiu tad sukhe;
  Manaibo rengmun nawang saira,
  Mathabo kabenbo ngao sune.

V3: |
  3. Masanbo benbo chaky wibo, 
  Param wibo ga wangtang sai;
  Chalungsabo rankhaibopiu tu, 
  Mathabo lui thiujiu thuan bamne.

V4: |
  4. Siboram tingkai di manuan ne,
  Chahiu naimik kuilan makge;
  Siga amaning mai maduine,
  Ramna lan makjiu matha bamne.

Translation: "(Gathering After Tear)"

Category: "Aspiration after Heaven"

