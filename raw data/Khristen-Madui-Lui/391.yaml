ID: "391"

Title: "JESU NIU SUNDAO SUNE"

Key: "F"

Time signature: "6/4"

V1: |
  1. Singgiu genlam niu kubamme,
  I niu kungbo akamai;
  Paliutu I niu ngao daone,
  Siga ramna lan lakge.

CH: |
  (Chorus)
  Singgiu gen amanbo Eden,
  Chaky wibo dihbo ga;
  Tinggen mai atu luang kiune,
  Jesu niu sun dao sune.

V2: |
  2. Singgiu genlam atu ku-e,
  Paliu khuan tu I chiu-e;
  Chawan tingkai sai sui wang ne,
  Chiuta midmid jiu chiu-e.

V3: |
  3. Singgiu genlam akamai niu,
  Atu phuijiu kubamme;
  Jesu nai paliu bam cham jiu,
  I wangra tu khuan bamme.

Translation: "(Jesus Will Welcome)"

Category: "Aspiration after Heaven"

