ID: "248"

Title: "KABEN GA TAD KHE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kabenbo sanwibo 'biu bam, 
  Tingwang gasu wangbo;
  A Rapiu Khrista zu gasu, 
  Papiu lungsiat ngao ne.

CH: |
  (Chorus) 
  {Kabenbo ga tadkhe, 
  Tingwang gu kabenbo gase. (2x)}

V2: |
  2. Pakendibo kabenbo bam, 
  Aliu 'puiki gase;
  Kabenbo se halan lakge, 
  Ting kadih ha makthen.

V3: |
  3. Masanbo gu kabenbo bam, 
  Tuhoi aliu ngao-e; 
  Kawibo ky nai kamunse, 
  Kachia niu ben bamme.

V4: |
  4. Masanbo kabenbo bamme, 
  Paman hajiu pibo; 
  Thaoben khai karingbo biuniu, 
  Tinggen juwang tang ra.

Translation: "(Let Us Walk in the Light)"

Category: "Consecration"

