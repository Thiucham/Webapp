ID: "18"

Title: "HE! MALUM BUIMAI HINA WANGLO "

Key: "A"

Time signature: "2/4"

V1: |
  1. Wanglo malum maidung,
  Chun wijiu wang khailo majat jiu 
  Bethlehem lam zuan tad sukhe,
  Phuilo ngenah wang khaoring kuang ga jibam.

CH: |
  (Chorus)
  Wangjiu patu kahum khe. (3x)
  Khrista tu!

V2: |
  2. Thiulo mazadung nai,
  Kangambo lui shen lo
  Thuanbo lui khuan niu tinggen ka ngin chia-e,
  Ku kachangbo ga Tingwang kendi bamlo.

V3: |
  3. Amen patu thuanlo,
  Manade rankhaipiu Jesu zan se
  Tingtheng jeng kahum milo,
  Ladkeng niu chamai lun thiu wangbo piutu.

Translation: "(Oh! Come All ye Faithful)"

Category: "Christmas"

