ID: "132"

Title: "ALIU ADAO LANRA RAM GUN-E"

Key: "A"

Time signature: "4/4"

V1: |
  1. Aliu adao lanra ramgun ne,
  kadihri ting loi bonai;
  Dacham kawibo wangra sune,
  Tinggen ram kawibo ga.

CH: |
  (Chorus)
  Kabenbo namdi kachia namdi ga,
  Tingwang lungbo ram kawibo ganiu;
  {Aliu adao lanne, (2x)}
  Chari ngambo pirun lu raleng.

V2: |
  2. Aliu adao lanra ramgun ne,
  Shaili singbang sung gase;
  Rankhaibo piutu thuan bam sune,
  Paniu lungsa khaibo ga.

V3: |
  3. Aliu adao lanra ramgun ne,
  Rankhaibo piu suang gase;
  Ranlu mai nahdung wang aruangne,
  Patu thuanbo lui thiura.

V4: |
  4. Aliu adao lanra ramgun ne,
  Kadihri ten loi dasai;
  Achunwi jiu benthiu bam sune,
  Tingtheng benbo Tinggen ga.

Translation: "(I Hope to Meet You All)"

Category: "Evening closing"

