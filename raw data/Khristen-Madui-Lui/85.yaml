ID: "85"

Title: "NAOPAO WANG DASAI"

Key: "E"

Time signature: "⚪"

V1: |
  1. Aliu mibung fui bam suma?
  Naopao wang dasai;
  Aliu mibung benbam suma?
  Naopao wang dasai,

CH: |
  (Chorus)
  Masanbo chunding tingga,
  Aliu mibung benbam suma?
  Naopao wang dasai.
  {He! Kadenlo, (3x)}
  Naopao wang saira.

V2: |
  2. Sundaobo khuanse chiu suma?
  Naopao wang saira;
  Mathabo khuanse chiu suma?
  Naopao wang saira,

V3: |
  3. Naopao piuse wang makthen na,
  Kaden jiu bamlo;
  Naopao piu wangbo ga,
  Ramna bose bammak ra,

V4: |
  4. Chariubo bamga bam suma? 
  Naopao wang dasai; 
  Aliu mibung maruang bamga, 
  Naopao wang dasai,

V5: |
  5. Aliu matha aruang bamne, 
  Naopao wangbo ga; 
  Halleluyah kahum sune,
  Naopao wangbo ga,

Translation: "(When the Bridegroom Comes)"

Category: "Second coming"

