ID: "194"

Title: "JESU KHU MAZUAN WANG"

Key: "A"

Time signature: "6/9"

V1: |
  1. Jesu khu mazuan wanglo,
  Dekam wangmak jiulo?
  Kamaobo hina dinlo,
  Khudung jiu kahumlo.

CH: |
  (Chorus)
  Mazuan wanglo, (2x)
  Natu kubamme;
  Namao hina dinpadlo,
  Thoidam nang lutao sune;
  Naleng lungsiat pibose,
  Nang lurao mitulo.

V2: |
  2. Jesu khu mazuan wanglo,
  Nang ringne malumlo;
  Lungsa jiu pah khuan bamme,
  Na nuan kuak khai raleng.

V3: |
  3. Jesu khu mazuan wanglo, 
  Nuan gasu lungsa ga; 
  Nalung degu maninglo? 
  Pawan tonmi bine.

V4: |
  4. Jesu khu majuan wanglo, 
  Dekamjiu wang maklo? 
  Rankhaipiu khu chun wijiu, 
  Apum pakhiang pikhai.

Translation: "(Only a Step to Jesus)"

Category: "Warning & Entreaty"

