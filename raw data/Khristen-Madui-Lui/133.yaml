ID: "133"

Title: "KAHUMRABO WAN WIBO"

Key: "E"

Time signature: "3/4"

V1: |
  1. Kahum rabo wan wibo, 
  Lungchun manuan lujiu,
  Ranpao Jesu ga aliu wang madui lujiu;
  Patu malum jiu wangsai, paniu gukhai sune,

CH: |
  (Chorus)
  Suan maileng chapiu wibo, 
  Siga dejiu wira.
  {Kahumbo wang ga! (2x)}
  Suan maileng chapiu wibo!
  Siga dejiu wira!

V2: |
  2. Kahum rabo wan wibo, 
  Ranpao ga na wangsai,
  Panah dung niu khengbo lungsa jiu chiukhaine;
  Chariubo pakhu thon khailo, chiu pah dinbo ga,

V3: |
  3. Kahum rabo wan wibo, 
  Kahiambo tan wangsai,
  Gukhaibopiu khuga paliu chariu sao khai;
  Lungsa jiu paniu chariubo, hina luthon khai,

V4: |
  4. Kahum rabo wan wibo, 
  Malum matip lusai,
  Aliu niu lunibo thoidam hina daone;
  Chunwibo niu fui lujiu, chariubo hamine,

Translation: "(It's the Blessed Hour of Prayer)"

Category: "Prayer meeting & Revival"

