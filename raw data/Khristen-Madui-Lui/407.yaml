ID: "407"

Title: "LUNGSAMAI BENJIA KUBAM"

Key: "D"

Time signature: "6/4"

V1: |
  1. Benjia jiu atu ku-e thai nchun,
  Paliu zuse naimik 'biu kum ben-e;
  Tinggen lamsu paliu niu phui kiu-e,
  Paliu niu benjai jiu ku-e wanglo.

CH: |
  (Chorus)
  Lungsa mainiu benjia jiu bam,
  Tinggen wang raleng aliutu ku-e;
  Lungsa mainiu benjia jiu bam,
  Lungsa mainiu benjia jiu kubamme.

V2: |
  2. Benjia jiu atu ku-e apui niu,
  Lungsa jiu paniu aleng kheng khai-e;
  Apiu lungsiat situ maning tao-e,
  Lungsa mai wanglo chiu benjia bamme.

V3: |
  3. Benjiajiu atu ku-e lungsamai, 
  Ngenah niu kubamme apui Wanglo;
  Paliu zu benbo lungsa maidung-e, 
  Nsuan su benjiajiu ku-e wanglo.

V4: |
  4. Pakina niu panao tu benjia bam, 
  Lungsamai tu liangrijiu khuan bamme; 
  Singnah chaka kungmai tanpui maidung, 
  Paliu ben henpad benjiajiu bamme.

V5: |
  5. Kendibo chawangbam ganiu kubam, 
  Aliu wangra khuan bam rankhaipiu niu; 
  Chunwibo lui thiujiu 'liutu khuan bam, 
  Lungsamai wanglo chiu benjia bamme.

Translation: "(Beautiful Beckoning Hands)"

Category: "Aspiration after Heaven"

