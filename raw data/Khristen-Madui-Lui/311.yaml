ID: "311"

Title: "PALIUTU KUWANGLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kinglo mily khuan piu kubo, 
  Mily dungtu kujiu bamme;
  Tad maren mibo mily tu, 
  Jesu niu khom madui bamme.

CH: |
  (Chorus) 
  Paliutu ku wanglo, 
  Paliu nuan gasu ku wanglo;
  Paliutu ku wanglo, 
  'Liutu Jesu khu ku wanglo.

V2: |
  2. Saoniu tadjiu khakhai ralo? 
  Hamibo mily tu phiura;
  Saoniu tadjiu phiu wang ralo? 
  Paliu aman jiu bam mira.

V3: |
  3. Tadlu jiu paliu khuan 'kinglo, 
  Pabam hina tadjiu phiulo;
  Papao niu natu kubamme, 
  Tad'jiu mily tu luang wanglo.

Translation: "(Bring Them In)"

Category: "Christian service & Reward"

