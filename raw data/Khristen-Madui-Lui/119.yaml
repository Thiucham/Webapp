ID: "119"

Title: "BIBLE PHUT MANE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Bible phut mane kakibo hamidi,
  Kam mahatu karingbo wibo cham;
  Ji bambo hiupuina tudi makiang khai,
  Shaimai tudi paladren niu piring.

CH: |
  (Chorus)
  Bible phut mane, (2x)
  Bible aliu mibung nai ben gai-e.

V2: |
  2. Bible phut mane ringkui kamak bo-e,
  Kaobam maileng karingbo cham phungwang;
  Pamanse maikhat nadi sikam lakge,
  Phuilo ahiupuinah nang ngam diu then.

V3: |
  3. Piuki tad mao maileng kahiu ben bo-e,
  Chaken kasan maileng di ben gai-e;
  Kating maileng ditu tathun wibo-e,
  Bible suang tasi kawi khatdi ha.

Translation: "(Cling to the Bible)"

Category: "Bible"

