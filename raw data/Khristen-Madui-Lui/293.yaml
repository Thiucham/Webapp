ID: "293"

Title: "TEN SUKHE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Tingwang ten ten sukhe aliu Tingwang vangmai,
  Aliu Rapiu phipa saisui jiu ten sukhe;
  Aliu pumtan bambo hina niu ten sukhe,
  Pagu pumtan seniu aliu tu khakhai ne.

CH: |
  (Chorus)
  Ten sukhe ten sukhe, (2x)
  Ramgunjiu khuan bamkhe,
  Ten bamkhe Jesu wang makthen.

V2: |
  2. Taten tensulo mariu charimai tiura,
  Karingbo duipin ga charimai wang saklo;
  Pengphai nai singchai niu aliu kendi thiune,
  Juringbo matha pikhai kawibo chamme.

V3: |
  3. Taten tenlo maihina leng taten bamme, 
  Tamiubo chawangdih hina hakam mine; 
  Masanbo Tingwang Jehovah ken dibamlo, 
  Juringbo matha pikhai-e chiu shen sukhe.

V4: |
  4. Taten tenlo a Rapiu pumtan pen ganiu, 
  Aliu ten phizeng pirun nai kawi lune; 
  Aliuniu malumbo kyga wangtang dasai, 
  Juringbo matha pikhai-e chiu shen sukhe.

Translation: "(To the Work)"

Category: "Christian service & Reward"

