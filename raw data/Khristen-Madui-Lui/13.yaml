ID: "13"

Title: "KACHANG-E APIU TINGWANG "

Key: "A"

Time signature: "6/3"

V1: |
  1. Tingwang cham I simakbo bam,
  Pabam machang I tad ngammak;
  Chiudi I wakhat silude,
  Apiu Tingwang atu kungbo I silude.

CH: |
  (Chorus)
  Rapiu alung ga bammine,
  A nuan hina paniu khiu masan khai kamde;
  Pah atu kungbo din ngamlak,
  Apiu Tingwang atu kungbo I silude.

V2: |
  2. Khangsia mai nuijiu kagadi,
  Atu ronna saodiak liudi;
  Tingwang sai suimine I ra,
  Tingwang masanbo hiupuina I ngao lude.

V3: |
  3. Nang lungchun I sitang makdi,
  Jesu niu atu rankhaide;
  Atu rankhaibo nai gasu,
  Tingwang pumtan, chamchangbo aleng pikhai-e.

Translation: "(My God is Real)"

Category: "Grace, Redemption & Love"

