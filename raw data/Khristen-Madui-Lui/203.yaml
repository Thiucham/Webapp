ID: "203"

Title: "ATU KUBO CHIUYE"

Key: "E"

Time signature: "3/4"

V1: |
  1. Atu kubo chiuye,
  A Rapiu niu kubo;
  Calvary ga luangbo zainiu,
  Atu khiu masan khai.

CH: |
  (Chorus)
  Rapiu I wang-e,
  Natu zuan wang-e;
  Nazai niu atu khiulo,
  Calvary ga zainiu.

V2: |
  2. Pumtan hah jiu I wang,
  Azeng tanra pilo;
  A nuan kasabo hinase,
  Nazai niu khiu khailo.

V3: |
  3. Jesu niu kubamme, 
  Paling jiu malumra; 
  Malumjiu manai bam raleng, 
  Kadih nai Tinggen ga.

V4: |
  4. Nuan phungmai hinatu, 
  Jesu niu rankhaide; 
  Lungsa riga lungsa diang-e, 
  Nuan gu pumtan riga.

V5: |
  5. Lamchap thiura pikhai,
  Malummai khu pikhai; 
  Ladren hina wangtang khaine, 
  Malumjiu kheng maileng.

V6: |
  6. Thuan kiulo pazaise, 
  Thuan kiulo palungsiat; 
  Khrista aliu leng shaikhai-e, 
  Mai hina niu thuanlo.

Translation: "(I Hear Thy Welcome Voice)"

Category: "Response & Repentance"

