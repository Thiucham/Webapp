ID: "227"

Title: "ATU JUKHAI "

Key: "D"

Time signature: "4/4"

V1: |
  1. Jesu niu atu majang khai,
  Chunwibo Tinggen lad niu phui;
  Alungchun aten hina ga,
  Tingwang benniu atu jukhai.

CH: |
  (Chorus)
  Atu jukhai! (2x)
  Paben niu atu ju bamme;
  Pakhom mai paling I thiune,
  Paniu jukhaibo jeng ganiu.

V2: |
  2. Chariubo niu tamiu bamdi,
  Lung aman jiu lungbo gadi;
  Duidi kasuakbo bamga di,
  Tingwang benniu atu jukhai.

V3: |
  3. Rapiu naben I jubamne, 
  Naken tiajiu raobo bamlak; 
  Kawi kasa I dao bamdi, 
  Tingwang niu atu ju bamme.

V4: |
  4. Kadih aten dung loi dasai, 
  Nalung saniu ch'ri ngam dasai; 
  Kashaibo tudi I pinglak, 
  Jordan kenra nang niu julo.

Translation: "(He Leadeth Me)"

Category: "Driving guidance & Protection"

