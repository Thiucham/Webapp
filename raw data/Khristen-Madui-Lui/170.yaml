ID: "170"

Title: "NALENG ALENG "

Key: "A"

Time signature: "6/2"

V1: |
  1. Jesu niu pakhuan manuan jiu kubamme,
  Natu atu kubamme;
  Jesu niu ku bamga dejiu ribamra?
  Natu atu kubamme.

CH: |
  (Chorus)
  Wanglo, (2x)
  Chariu magenthiu bammai;
  Jesu niu natu manuan jiu kubamme,
  Wanglo nuan phungmai wanglo.

V2: |
  2. Jesu niu kubam ga dejiu ribamra?
  Natu atu kubamme;
  Palungsiat tu dekam jiu mari ralo?
  Natu atu lungsa-e.

V3: |
  3. Pawan hai sitang makjiu pakkin gu-e, 
  Nakhu akhu ga pakkin;
  Tamiubo nai kashai bose nawang-e, 
  Naleng aleng nawang-e.

V4: |
  4. Tasibo lungsiat se paniu ladriat khai, 
  Naleng aleng ladriat khai; 
  Nuan ten midi para kuak khaijiu bamme, 
  Natu atu kuak khai-e.

Translation: "(For You and for Me)"

Category: "Invitation & Baptism"

