ID: "338"

Title: "DEJIU WILO JESU AGU-E"

Key: "D"

Time signature: "9/8"

V1: |
  1. Dejiu wilo a Rapiu Jesu!
  Pakendibo atu lenkhai bi-e,
  Ranlumai thiura liulu mide,
  Pazai niu mana kasan lude.

CH: |
  (Chorus)
  {Hai-e a racham hai alui-e,
  Nai machang Rankhaipiu tu thuanbo. (2x)}

V2: |
  2. Patu malumne achunwi jiu,
  Tinggen khang mibo amik niu ngao-e,
  Tinggen mazadung siga niu kiu,
  Lungsabo chamse aliu khu din.

V3: |
  3. Palad malumjiu achunwi-e,
  I a Rapiu ga matha bam mine,
  Kaden lujiu phuijiu khuan bamme,
  Palungsiat ga tingtheng bam mine.

Translation: "(Blessed Assurance)"

Category: "Assurance & Testimony"

