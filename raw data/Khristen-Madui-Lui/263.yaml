ID: "263"

Title: "CHARI RENG KHUANLO"

Key: "D"

Time signature: "2/4"

V1: |
  1. Singnah mai phuilo Tinggen lam,
  Pengphai kajit bam;
  Tan kahu maidung tu ngao-e,
  Chari ngam sune.

CH: |
  (Chorus)
  Charireng khuanlo I wang-e,
  Jesu niu din-e;
  Nalungsiat penniu khuan bamme,
  Chiujiu pao khailo.

V2: |
  2. Satan niu majang wang kinbo,
  Charikang dung se;
  Khrista riphen kangtu ngao jiu,
  Paliu hot hade.

V3: |
  3. Kangambo pengphai se phuilo, 
  Kinglo make khuan; 
  A Rapiu zan gasu ngamne, 
  Mikre maidung tu.

V4: |
  4. Charise tanjiu bam liudi, 
  Hujiu chap bamsai; 
  Charipi Jesu lad phungjiu, 
  Aliu niu ngamne.

Translation: "(Hold the Fort)"

Category: "Conflict & Victory"

