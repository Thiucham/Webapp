ID: "352"

Title: "I JESU KHU DINNE "

Key: "E"

Time signature: "2/2"

V1: |
  1. I wa pakhiangna Jesu khu dinne,
  Pa adon ponjiu atu miubam;
  Chunsabo wangdi I ping lan lakge,
  Panah maidung tu mangai makge.

CH: |
  (Chorus)
  I wa pakhiangna Jesu khu dinne,
  Pa aka kachangbo thiu lune;
  I wa pakhiangna Jesu khu dinne,
  Jesu paniu atu miu khaine.

V2: |
  2. I wa pakhiangna Jesu khu dinne,
  Pajai widi pah atu kung-e;
  I pakhu kheng sai paniu thoikhai ne,
  Pa achariu hina ha khaine.

V3: |
  3. I wa pakhiang na Jesu khu dinne, 
  Kahiambo wangsai paniu kha'ne; 
  Agu chariubo pakhu ga paosai, 
  Pakhiangna paniu wikhai bine.

V4: |
  4. I wa pakhiang na Jesu khu dinne.
  Kadihri gu sansabo seniu; 
  Nuan ga jukhaira hiam saomak bamme, 
  Ch'ri ngambo sira Rapiu gu-e.

Translation: "(I must Tell Jesus)"

Category: "Assurance & Testimony"

