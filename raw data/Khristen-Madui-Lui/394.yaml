ID: "394"

Title: "PABAM KENGJIU BAMBO KYSE"

Key: "F"

Time signature: "3/4"

V1: |
  1. Pabam kengjiu bambo kyse naleng lekhai bam,
  Singgiu genlam se lungsa maidung khuan jiu bamme;
  Sibo kachia namdi ga ngut ra khuan jiu bamme,
  Siga chariu magenthiubo kapbo di ha-e.

CH: |
  (Chorus)
  Pabam kengjiu bambo kyse naleng lekhai bam,
  Singgiu genlam se lungsa maidung niu khuan bamme.

V2: |
  2. Pabam kengjiu bambo ky situ I niu masen,
  Ranlu maidung situ kachia rengmun ga daone;
  Rengmun gase sanwi maitu maluang lu ngut ne,
  Chariu magenthiu mai wanglo mathak khai bine.

V3: |
  3. Chaben niu thiumak bo ky pabam kengjiu bamme,
  Sibo kyga I wangra khuan bam nai machang na;
  Shaibo singgiu se ken dasai nang wang ngao sune,
  Siga chariu magenthiubo bam lanlak mide.

Translation: "(A House of Many Mansions)"

Category: "Aspiration after Heaven"

