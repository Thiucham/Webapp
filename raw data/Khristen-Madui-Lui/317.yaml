ID: "317"

Title: "JESU TEN CHUN WIJIU TENLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Jesu ten chunwi jiu tenlo, 
  Tinggen 'puitu zuan wanglo;
  Thuanbo lui thiujiu mathane, 
  Nai machang pawan machang.

CH: |
  (Chorus) 
  Jesu ten chunwi jiu ten bamlo, 
  Paniu alung thao ben khaine;
  Nai machang pawan machang, 
  Tingwang ky wangbo naisai;
  Mathabo lui thiujiu ramna lan lakge.

V2: |
  2. Jesu ten chunwi jiu tenlo, 
  Chengsa hina saodiak ne;
  Masanbo Tinggen lui thiune, 
  Tinggen ky wangtang makthen.

V3: |
  3. Jesu ten chunwijiu tenlo, 
  I aronna bam liudi; 
  Tingwang nahpiu ranpao Khrista, 
  Aliu din thiujiu shai-e.

V4: |
  4. Jesu ten chunwijiu tenne, 
  Tamiu ga bamdi benne; 
  Pakendi masanbo se-e, 
  Kabenbo ga bam mine.

Translation: "(Joy in Serving Jesus)"

Category: "Christian service & Reward"

