ID: "247"

Title: "PABAM MACHANG JESU NAI"

Key: "D"

Time signature: "6/8"

V1: |
  1. Pabam machang Jesu nai I tad ngamme,
  Pah atu majang khaibo bam hina ga;
  Jesu bam makbo bamga mathabo ha,
  Jesu tu majang sai I waping lakge.

CH: |
  (Chorus)
  Pinglakge, (2x) 
  Pabam hina ga;
  Jesu tu majang sai kasa dao lakge.

V2: |
  2. Jesu tu majang bam aronna makge,
  Akamai tadkam midi Jesu agu;
  Mainiu kasa ga atu majang khaidi,
  Jesu atu majang sai I matha bamne.

V3: |
  3. Jesu nai majang sai I sundao diu-e,
  Tamiubo niu atu gom jiu bam liudi;
  Chariu makjiu I sulan rabo se-e,
  Jesu nai bam cham bora wibo ky-e.

Translation: "(Anywhere With Jesus)"

Category: "Consecration"

