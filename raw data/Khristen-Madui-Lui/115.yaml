ID: "115"

Title: "SULO SULO"

Key: "C"

Time signature: "2/6"

V1: |
  1. Sulo sulo chunwibo lui thiu ronlo,
  Sulo sulo chalui niu thiujiu senkhailo,
  Sulo sulo pakendi niu kadih ga;
  Thaoben khaine Tinggen biu kawi niu.

CH: |
  (Chorus)
  Tasing tatu wahina niudi matha bamne,
  Chamai hina ngambo lui thiu chamne.
  Tingwang namdih ga ra kamao mai bam lakge,
  Tachun wijiu matha bamne Tingwang ramga.
  Jesu niu kadihri chawang dine,
  Pakhommai niu kadihri ga phuine,
  Tingwang ramga tachun wijiu matha Tingwang ramga.

V2: |
  2. Biulo biulo tachun wibo bang biulo,
  Shenlo shenlo ringbo racham dinlan lanlo,
  Kadihpiri kamao mai ha makthen na;
  Dinlo pakendibo cham kawibo.

Translation: "(Awakening Chorus)"

Category: "Praise & Opening"

