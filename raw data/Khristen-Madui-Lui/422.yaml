ID: "422"

Title: "JESU NIU MAWANGNE"

Key: "E"

Time signature: "2/4"

V1: |
  1. Jesu tingkadih wang thiune,
  Paniu tadbo bam hina ga;
  Chahiu naimik hami liudi,
  Pabam hina paniu m'wang ne.

V2: |
  2. Jat hina chakhuan hina niu,
  Palungsiat luise thiu bamne;
  Ngenah dungniu di thuan bamne,
  Pazan gasu thoidam dao ne.

V3: |
  3. Tingtheng jiu patu kahum ne,
  Thuan saomak bo pirun pine;
  Nsuan rathak mikhut kumjiu,
  Parim wibo zanse thuan ne.

V4: |
  4. Kadih chawang hina wangjiu,
  Suang habo kendi madune;
  Mazadung wang kiujiu thiune,
  Kadihmai di thuan ne Amen.

Translation: "(Jesus Shall Reign)"

Category: "Christian mission"

