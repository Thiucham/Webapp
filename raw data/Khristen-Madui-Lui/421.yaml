ID: "421"

Title: "THAOKHAILO KABENBO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Duidi genlam bam maidung niu kubamme,
  Thaokhailo kabenbo.
  Pahiupuina ring kani mai keng bamme,
  Thaokhailo kabenbo.

CH: |
  (Chorus)
  Kawibo karingbo cham benbo,
  Pabam machang ben khailo.
  Kawibo karingbo cham benbo,
  Tingtheng jeng benjiu bamlo.

V2: |
  2. Mecedonia mainiu kubo khuan chiu-e,
  Thaokhailo kabenbo.
  Singchai gase aliu rathak pot phungwang,
  Thaokhailo kabenbo.

V3: |
  3. Karingbo cham wibo maihina ngaora, 
  Thaokhailo kabenbo.
  Nalad wibose kadihri sichiara, 
  Thaokhailo kabenbo.

V4: |
  4. Lungsabo chamga chariu khai ping tulo, 
  Thaokhailo kabenbo.
  Tinggen lam aliu chawang pirun lura, 
  Thaokhailo kabenbo.

Translation: "(Send the Light)"

Category: "Christian mission"

