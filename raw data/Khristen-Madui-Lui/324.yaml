ID: "324"

Title: "AKHUGA BENBO WANG-E"

Key: "A"

Time signature: "4/4"

V1: |
  1. Thainai benbo akhu wang-e;
  Pabiuse ben diang-e;
  Kadih ga benbo suang ben diang,
  Jesu agu benbo.

CH: |
  (Chorus)
  Pabiu wibo ahiuna leng,
  Agimanaibo akhu wang-e;
  Jesu niu nuirim rim jiu wang,
  Akhuga benbo wang-e.

V2: |
  2. Thainai chunwi kingwibo lui,
  A wangtu thuanbo lui;
  I niu chiubo chalui khuan se,
  I niu thiuse lakge.

V3: |
  3. Thainai achun wibo tingmik, 
  Rapiu nawang bijiu;
  Ahiuna chun wibo lui thiu,
  Lungsiat rapen ngao-e.

V4: |
  4. Thainai achun wibo tingmik, 
  Thuanbo nai lungsabo;
  Aleng thoidam se pikhai-e,
  Kulam matha bamne.

Translation: "(Sunshine in My Soul)"

Category: "Assurance & Testimony"

