ID: "261"

Title: "SINGCHAI GU JUDENG PHAI"

Key: "B"

Time signature: "4/4"

V1: |
  1. Tinggen lam niu pengphai pikiu khai sune,
  Chawang riphen maileng se;
  Aliu thainai pengphai wibo ju sukhe,
  Mathabo lui thiu bamga.

CH: |
  (Chorus)
  Tad sukhe tadron khe, 
  Khrista lengse hah liudi tu;
  Runkhailo pirun wibo se,
  Singchai judeng phai hangga.

V2: |
  2. Mikre maidung tadui kadi kum wangdi,
  Riphen kum chap matip lo;
  Pengphai hangga bamlo riphenmai kumjiu,
  Maji raleng chap bamlo.

V3: |
  3. Duipui nai kadih piri pabam hina, 
  Pise khailo kendibo; 
  Dinkhai bilo kendibo pengphai racham,
  A Rapiu niu kubam ga.

V4: |
  4. Kendi bose ngaora pating nawang-e, 
  Tingmik machang nawang-e; 
  Chawang suang gase mikremai hahmine, 
  Singchai pengphai niu m'wangne.

Translation: "(The Banner of the Cross)"

Category: "Love, Joy & Peace"

