ID: "83"

Title: "KHRISTA MALAN WANGNE"

Key: "D"

Time signature: "3/4"

V1: |
  1. Nsuan ting benpad karaibo tingga wang rama?
  Naimik biu thaopad karai ga wangsu rama?
  Siga Jesu niu pakendi jiu wang sune,
  Pamai dungtu lu raleng.

CH: |
  (Chorus)
  He! Jesu de theng ga,
  Mathabo lui thiubam ralo?
  Khrista wang-e halleluyah;
  {Halleluyah amen! (2x)}

V2: |
  2. Naimik pa ran ga suma, chunding ga suma?
  Nchun tamiu jiu zitjing bambo ga suma?
  Pakendibo nbiu seniu fuijiu wangne,
  Pamai dungtu la raleng.

V3: |
  3. Masan maidung niu Hosanna senjiu wangne, 
  Siga mazadung di pasai shuilu wangne;
  Pakendi boniu patu hom magui lujiu, 
  Pamai dungtu lu suma.

V4: |
  4. Magenthiubo kapingbo kapbo thiu makjiu, 
  Thiuniu makjiu chunwijiu patu zudaone; 
  Kamuang niu pui tadne Rapiu gu kendiga,
  Jesu niu pamai dungtu.

Translation: "(Christ Returneth)"

Category: "Second coming"

