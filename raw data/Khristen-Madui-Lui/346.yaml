ID: "346"

Title: "TINGWANG LUNGSABO BEN-E"

Key: "E"

Time signature: "3/4"

V1: |
  1. Tingwang lungsabo benbo-e,
  Tad khaibo 'pui hina ga;
  Paniu thoikhai gukhai kamme,
  Tingwang lungsabo benne.

CH: |
  (Chorus)
  Tingwang lungsabo benbo,
  Tingwang lungsabo benne.

V2: |
  2. Pawan kali jiu tad saomak,
  Chamai tingdi ha nuang-e;
  Chiudi palungsiat ra limak,
  Tingwang lungsabo benne.

V3: |
  3. Tamiubo wangjiu bam liudi,
  Pawat sira limakge;
  Tamiubo tu piben khai-e,
  Tingwang lungsabo benne.

Translation: "(God is Love)"

Category: "Assurance & Testimony"

