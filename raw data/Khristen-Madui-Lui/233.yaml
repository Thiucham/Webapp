ID: "233"

Title: "A MPUI SIOLO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kabenbo ga juken pad khai khelo chalungsa jiu, 
  Aky gasu I tad madiu mide jukhai khelo;
  Wang tang lura aphi pa jukhailo,
  Phiken khat niu alengra bui mide.

V2: |
  2. Jukhai raleng I kheng khai lu makge sing lu makge,
  Chunrangthiu jiu I tad khai bam niu-e jukhai khelo;
  Wasao thiu kajit jiu lung bam niu-e,
  Tad mibo tu maning khai tulo.

V3: |
  3. Nagu pumtan seniu jukhai khelo lungsa khailo,
  Lung jin ja jiu lung khai mide I hai riju mide;
  Mazadung niu nui rimrim jiu khuan bam,
  Sise I niu machunbo luni-e.

Translation: "(Lead Kindly Light)"

Category: "Driving guidance & Protection"

