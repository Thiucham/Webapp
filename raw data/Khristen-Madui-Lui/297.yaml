ID: "297"

Title: "TENLO TING TAMIU WANGJIU SUNE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Ting tamiu wang jisune,
  Tenlo nsuan sujiu;
  Kajik dui bamga tenlo,
  Chunwi jiu bamga;
  Tingben bamga ten lulo,
  Naimik bamga tenlo;
  Ting tamiu wang jisune,
  Taten loi misai.

V2: |
  2. Ting tamiu wang jisune,
  Tenlo marin puiting;
  Nalai khai jiu ten bamlo,
  Mathak jisune;
  Pawan bamga ten lulo,
  Kawibo dao jine;
  Ting tamiu wang jisune,
  Tenra hamine.

V3: |
  3. Ting tamiu wang jisune,
  Naimik kiu misune;
  Pabiu kawi thao bamga,
  Haise pak jiu bam;
  Tamiubo se wang makga,
  Ben bose bam khaga;
  Tenlo tamiu wang makga,
  Pating ton makga.

Translation: "(Work for the Night is Coming)"

Category: "Christian service & Reward"

