ID: "161"

Title: "PATU ZUANMAI"

Key: "A"

Time signature: "3/4"

V1: |
  1. Rankhaibopiu niu kubamme,
  Wang phuilo kawibo bamme;
  Ringbo lungsabo mathabo,
  Phungwang-e Khrista niu naleng.

CH: |
  (Chorus)
  {Atu zuanmai (3x)} dungtu,
  {Phut khai lanlakge, (3x)} I niu, 
  (Repeat chorus)

V2: |
  2. Rankhaipiu niu kubamme,
  Pakhuan se nang lungsa makma?
  Nang mari wang lanlak dama?
  Palungsiat se maning lakma?

V3: |
  3. Rankhaipiu kubamme,
  Na nuanse paniu se bamme;
  Na nuan hina masan khaine,
  Wahina naleng pikhai ne.

Translation: "(Him that Cometh!)"

Category: "Invitation & Baptism"

