ID: "314"

Title: "ATU RANKHAI GANIU"

Key: "C"

Time signature: "4/4"

V1: |
  1. I niu thiunibo lui bamme, 
  Atu rankhai ganiu.
  Rankhaibo chawang dibo tu, 
  Atu rankhai ganiu.

CH: |
  (Chorus) 
  Atu rankhai ganiu, (2x)
  Pazan maning madi jiu, 
  Atu rankhai ganiu, 
  Rankhaipiu zantu thuan jiu bamne.

V2: |
  2. Khrista ga achun ka wang-e, 
  Atu rankhai ganiu.
  Pa maning ngam I kam bamne, 
  Atu rankhai ganiu.

V3: |
  3. Aleng kadih wibo bamme, 
  Atu rankhai ganiu.
  Pingbo nai ma ngambo ha khai, 
  Atu rankhai ganiu.

V4: |
  4. Aleng chunwi mathabo bam, 
  Atu rankhai ganiu.
  Pazai seniu kam maji khai, 
  Atu rankhai ganiu.

V5: |
  5. Aleng chaky kaden khai bam, 
  Atu rankhai ganiu.
  I tingtheng wang lung rabo bam, 
  Atu rankhai ganiu.

Translation: "(Since I Have Been Redeem)"

Category: "Christian service & Reward"

