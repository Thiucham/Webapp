ID: "198"

Title: "WIJIU ATU ADAO-E"

Key: "B"

Time signature: "6/8"

V1: |
  1. Thingna pasip gasu lemtad mibo kumjiu, 
  Rapiu gasu I mari mide;
  Nalungsiat niu nakhuga piwang lan khaide, 
  Nang niu atu wijiu adao-e.

CH: |
  (Chorus) 
  Wijiu dao-e rankhaipiu ga, 
  Chunwi jiu atu adao-e! 
  Makhao kumjiu napam zuan wang-e, 
  Nakhu tingtheng mathak raleng.

V2: |
  2. Nagu malee gase I akan juilujiu, 
  Nagu lungsiat ga bamra wang-e;
  Pagu pabiu kabenbo ga achunwi-e, 
  Tingtheng jiu I niu matha bamne.

V3: |
  3. Jesu zan gasu kahiambo tu ping lakge,
  Duidi kasuakbo kumjiu bamdi; 
  Tinggen dih Naimik kiu makbo ramtu phuijiu,
  Mathabo luise I thiu bamne.

Translation: "(Welcome for Me)"

Category: "Response & Repentance"

