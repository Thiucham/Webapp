ID: "206"

Title: "JESU I ZUAN WANG-E"

Key: "A"

Time signature: "6/8"

V1: |
  1. Chariubo chun tamiubo gasu,
  I zuan wang-e I zuan wang-e;
  Nagu mathabo kabenbo ga,
  Zuan wang-e he! Jesu;
  Thiukaniubo gasu nakhu lam,
  Chang kalakbo I niu na khulam;
  A nuan gasu I niu na khulam,
  Zuan wang-e he! Jesu.

V2: |
  2. I ka mangambo hina thuanjiu,
  I zuan wang-e I zuan wang-e;
  Pakendibo daora singchai ga,
  Zuan wang-e he! Jesu;
  Kadih chariubo gasu wira,
  Tingthung katanbo gasu saora;
  Ka amanbo lui thiurabo leng,
  Zuan wang-e he! Jesu.

V3: |
  3. Chariu sao kamakbo bam gasu, 
  I zuan wang-e I zuan wang-e;
  Nang niu atu maluang bam raleng, 
  Zuan wang-e he! Jesu;
  Nang niu chalungsabo ga lungra, 
  Kasabo gasu Tinggen kiura;
  Makhaona kumjiu I lenkhangne, 
  Zuan wang-e he! Jesu.

V4: |
  4. Kashaibo kapingbo bam gasu,
  I  zuan wang-e I zuan wang-e;
  Naky matha chunwibo gase,
  Zuanwang-e he! Jesu;
  Kashaibo nai kapingbo gasu,
  Nagu amanbo ga mathakra;
  Pakendibo nazu wang ngaora,
  Zuan wang-e he! Jesu.

Translation: "(Jesus I Come to Thee)"

Category: "Response & Repentance"

