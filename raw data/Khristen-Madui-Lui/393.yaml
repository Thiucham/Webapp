ID: "393"

Title: "I CHAWANG GU THIUNE"

Key: "A"

Time signature: "⚪"

V1: |
  1. I chawang gu thiune palungsiat don ganiu,
  Pawang bamga naikhat I lungne;
  Tinggen racham kawi paniu akhu dinkhai,
  Pakendibo gase I bamne.

CH: |
  (Chorus)
  I chawang gu thiune palungsiat don ganiu,
  Panah maitu wadao di thuan lak;
  Naikhat ra atu kuwang sune papamga,
  Siga tingtheng I lung bam mine.

V2: |
  2. I chawang gu thiune palungsiat don ganiu,
  Palungsiat haira pamalan ha;
  I niu tad khaibo bam hina ga pingra ha,
  Tingtheng paniu atu gukhaine.

V3: |
  3. I chawang gu thiune pagu ladriat gasu,
  Aliu mathiuna wang madui ne;
  Karingbo duise luang bamme pawang bamga,
  Siga tingtheng I lung bam mine.

Translation: "(I Belong to the King)"

Category: "Aspiration after Heaven"

