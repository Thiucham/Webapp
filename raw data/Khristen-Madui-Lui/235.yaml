ID: "235"

Title: "RAPIU ATU GUKHAI PIU-E"

Key: "G"

Time signature: "3/4"

V1: |
  1. Rapiu atu gukhaipiu-e,
  I niu pingra ha-e;
  Madiabo piu bon ga jukhai,
  Ringbo duipin munga.

V2: |
  2. Ahiuna paniu gukhai-e,
  Majibo 'puiki ga;
  Nai machang paniu gukhai-e,
  Pazan kendi bamra.

V3: |
  3. Kashaibo bam ga tad bamdi,
  I wadi ping lakge;
  Naben niu atu jukhai-e,
  Ajeng tan pikhai-e.

V4: |
  4. Amikre maidung masuang ga, 
  Akuang kaden khaibi; 
  Api ga wasa manuk khai, 
  Apiang khai maliambi.

V5: |
  5. Kawibo nai majibo niu, 
  Aringting gom khai-e; 
  Hahlan makbo Tingwang kyga, 
  Tingtheng I lung bamne.

Translation: "(The Lord is My Shepherd)"

Category: "Driving guidance & Protection"

