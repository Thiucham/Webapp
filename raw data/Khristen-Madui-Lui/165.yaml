ID: "165"

Title: "JESU ZAI NIU NATU KHIU LU DAMA?"

Key: "A"

Time signature: "4/4"

V1: |
  1. Jesu zainiu nang khiu masan lu dama?
  Mily zainiu nang khiu lu dama?
  Nangtu lungsabo chamse malum dama?
  Mily zainiu nang khiu lu dama?

CH: |
  (Chorus)
  Pazai niu khiu dama?
  Mily zainiu khiu masan dama?
  Nangma nia kabun kum masan lu dama?
  Mily zainiu khiu masan dama?

V2: |
  2. Tingmik machang nang Jesu khu tad bamma?
  Mily zainiu nang khiu lu dama?
  Paniu lungsa khaibo ga wang mathak ma?
  Mily zainiu nang khiu lu dama?

V3: |
  3. Jesu kiu saira na phai masan diuma?
  Mily zainiu nang khiu lu dama?
  Nahiuna Tinggen wangra kaden dama?
  Mily zainiu nang khiu lu dama?

V4: |
  4. Khuimaobo phaini hinase thuanlu jiu,
  Jesu zainiu khiu masan luma?
  Hiupuina khiu masan ra duipok Jesu,
  Siga niu napum khiu masan lo.

Translation: "(Have You Been to Jesus)"

Category: "Invitation & Baptism"

