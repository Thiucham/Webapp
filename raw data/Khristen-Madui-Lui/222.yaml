ID: "222"

Title: "NANG AGU TUDI-E"

Key: "B"

Time signature: "9/8"

V1: |
  1. Rankhaibopiu nang agu tudi-e,
  I niu bairabo bam se nang-e;
  I niu lung rabo tudi se nang-e,
  Tingtheng jiu I nakhuga bamne.

CH: |
  (Chorus)
  Rankhaipiu nang agu tudi se-e,
  Nang aka nang agu jupao-e;
  Nang agu machunbo rankhaipiu-e,
  Nangtu malum na khuga baine.

V2: |
  2. Nuan niu kuwang di nang agu tudi,
  Madiu wangdi nang agu tudi;
  Chariubo wangdi nang agu tudi,
  I de pingra nang a tudi-e.

V3: |
  3. Kahiambo wangdi nang agu tudi,
  Lilan lakbo aguse nang-e;
  Ahiuna ma ngiu khaine nakhu ga,
  Tingtheng atu pi masan khailo.

V4: |
  4. Zat hina riga nang agu tudi, 
  Kadih chawang pirun hamidi; 
  Nangra juringbo tudi agu-e, 
  Tingtheng tudi natu malumne.

Translation: "(Thou Art My Rock)"

Category: "Driving guidance & Protection"

