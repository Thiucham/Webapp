ID: "246"

Title: "KHRISTEN WA PING SILO"

Key: "G"

Time signature: "3/4"

V1: |
  1. Khristen waping silo kapingbo bam,
  Tad mariubo bam machang ping silo;
  Kenglam tathak kalunglam kahiambo,
  Natu nuan ga jukhai ra phiu bamme.
  {Khristen waping silo, (3x)}
  Kapingbo bam.

V2: |
  2. Khristen mai mathalo magenthiu di,
  Kahiambo niu tanjiu wang bam liudi;
  Tamiubo nai kahiambo hamine,
  Siga a Rapiu khu mathak bamne.
  {Khristen mai mathalo, (3x)}
  Magenthiu di.

V3: |
  3. Khristen mai singbamlo nang kao makra,
  A Rapiu tu ku ma ngai mak bamsai;
  Pawan machang singbo tan bam bisai, 
  Natu gukhai sune a Rapiu niu.
  {Khristen mai sing bamlo, (3x)} 
  Nang kao makra.

V4: |
  4. Khristen mai malumlo chariu bamdi, 
  Tinggen kadih ga nang mathak sune; 
  Ladzan ga kawibo pikhai saira, 
  A Rapiu mathabo bamga ngutne. 
  {Khristen mai malumlo, (3x)} 
  Mathak sune.

Translation: "(Christian Walk Carefully)"

Category: "Consecration"

