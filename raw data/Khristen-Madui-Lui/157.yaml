ID: "157"

Title: "NANG DETU KHUAN BAMLO?"

Key: "A"

Time signature: "6/8"

V1: |
  1. Nang detu khuanjiu bamlo?
  Nang dejiu namen rigu lo?
  Rankhaipiu natu khuan jiu bamga,
  Masanmai dung ruangga wanglo.

CH: |
  (Chorus)
  Nang de kamjiu pakhu wang mak gulo? (2x)

V2: |
  2. Nang detu machun bamlo?
  Wang ribo niu geng lurama?
  Jesu makjiu mai khatdi ranlak,
  Jesu makjiu kaki ha-e.

V3: |
  3. Nang degu maning bamlo?
  Hiupuina seniu din bamme;
  Dekamjiu pakhu wang makjiu lo?
  Nuan bangse thuan lujiu wanglo.

V4: |
  4. Nang detu khuan jiu bamlo?
  Ageting se loi wang kinne;
  Ri miboga kapingbo bamme,
  Pagu juringbo ga wanglo.

Translation: "(Why do You Wait)"

Category: "Message"

