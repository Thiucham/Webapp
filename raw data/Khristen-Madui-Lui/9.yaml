ID: "9"

Title: "SHAIMAKBO NGAOMAKBO"

Key: "A"

Time signature: "3/2"

V1: |
  1. Shaimakbo ngaomakbo ningtingbo Tingwang,
  Benbambo taobambo ngao bo ga baikhai;
  Withubo dithubo malan thiumakbo,
  Ngamkambo tanhubo nazantu aliu thuanne.

V2: |
  2. Mathakmak kalonmak jing najiu benne,
  Naladzan mao makge wi tathiubo-e;
  Rapiu zan majibo luang ku kum ku-e,
  Kaku bo kamuang kum ken duipin kawi padle.

V3: |
  3. Dibomai, siamthumai, leng ringbo pi-e, 
  Ring raleng nang niu ringting leng pikhai-e; 
  Charapen penbokum ting khatna penne, 
  Oh! Rapiu nangra tingtheng tingtheng di limakge.

V4: |
  4. Kendibo kabenbo mathabo Rapiu, 
  Mazadung kinkiuju natu thuan bamme; 
  Aliu mathiu thuanne natu ngao khailo, 
  Nabiu ben kawibo ben seniu nbai khailo.

Translation: "(Immortal Invisible)"

Category: "Grace, Redemption & Love"

