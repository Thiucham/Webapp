ID: "81"

Title: "CALVARY "

Key: "B"

Time signature: "4/4"

V1: |
  1. Rankhaipiu tu Calvary ga,
  Singchai riga genshat mide;
  Singchai riga luangbo zainiu,
  A nuan hina masan khaide.

CH: |
  (Chorus)
  He! Calvary (2x)
  Jesu zai luang kiu khaibo bam
  {He! Calvary (2x)}
  Siga Rankhaipiu shaikhai-e.

V2: |
  2. A Rapiu niu shai kiubo ga,
  Kathi malai ting tamiu-e;
  Jusung phai se dikek mide,
  Tinggen dihga ngut rabo leng.

V3: |
  3. Maisuang ha-e a Rapiu niu,
  A don jengniu shaikhaibo hai;
  Chariu magenthiubo kheng khai,
  Calvary ga shaikhai mide.

Translation: "(Calvary)"

Category: "Humiliation, Resurrection & Glory"

