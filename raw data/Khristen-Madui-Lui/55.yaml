ID: "55"

Title: "SINGCHAI GA 'LUANG WANGLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. A suang ga nang chawang dibo,
  Kendibo thiu lulo;
  Aleng tathu pirun khaibo,
  Atu maning khailo.

CH: |
  (Chorus)
  Gethsemane tu maning jiu,
  Azeng niu chariu kheng khiabo;
  I niu maning khai bam raleng,
  Singchai ga 'luang wang lo.

V2: |
  2. Pabam atu dinlen khailo,
  Patu maniu lakbo;
  Tinggen masan mai khuan bambo,
  Nang zitjing bambo lon.

V3: |
  3. Atudi Mary lung kumjiu, 
  Wathin natu pira; 
  Parao maruang jiu bam mibo, 
  Sise atu dinlo.

V4: |
  4. Nai machang di naleng atu, 
  A gu singchai ponlo; 
  Chariubo Nagu chapiang se,
  Atupi shak khailo.

Translation: "(Lead Me to Calvary)"

Category: "Christ life & Love"

