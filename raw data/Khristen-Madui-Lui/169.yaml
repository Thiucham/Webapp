ID: "169"

Title: "PHIULO RING NE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Akhuga Rapiu cham bam halleluyah!
  Sibo chamse naleng pine;
  Haise palad ga bamme halleluyah!
  Nang ringrabo cham sira hai-e.

CH: |
  (Chorus)
  Singnahmai phuilo ring ne,
  Jesu tu phuilo ringra;
  Haise palad ga bamme halleluyah!
  Nang ringrabo cham sira hai-e.

V2: |
  2. Lungsabo cham akhu bam halleluyah!
  Haise naleng wibo chamme;
  Haise Tinggen lam chamme halleluyah!
  Jesu dinbo chamse maji-e.

V3: |
  3. Tingtheng ringra pikhai-e halleluyah!
  Na hiupuina ringra leng-e;
  Nangniu patu phuikhai sai halleluyah!
  Jesu ronna rankhaibo piu-e.

Translation: "(Look and Live)"

Category: "Invitation & Baptism"

