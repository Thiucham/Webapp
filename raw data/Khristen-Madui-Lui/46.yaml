ID: "46"

Title: "DEJIU GA JESU TU I LUNGSALO"

Key: "A"

Time signature: "6/8"

V1: |
  1. I niu lungsabo zan bamme,
  Haise thuan jiu thiu bui,
  Kingwibo lui akhuga wang,
  Withubo zan si-e.

CH: |
  (Chorus)
  Jesu tu dejiu ga,
  I niu lungsa gulo;
  I niu patu lungsa, 
  Paniu lungsa raijiu.

V2: |
  2. Rankhaipiu lungsiat racham hai,
  Atu khen rang thiukhai;
  Nuan mai tu rankhaibo zai se,
  Dejiu ga wigulo.

V3: |
  3. Aringting leng kaden khaibo, 
  Rachamse din khai-e;
  Tamiubo ga I tad bamdi, 
  Pahniu thaoben khai-e.

V4: |
  4. Chariubo alungchun gase. 
  Lungsabo cham din khai;
  Maikhat nadi ngam lakbo ga,
  Pahniu gukhai jukhai.

Translation: "(Oh! How I Love Jesus)"

Category: "Christ life & Love"

