ID: "63"

Title: "ATU RANPAO RINGBAMBO I SE-E"

Key: "D"

Time signature: "4/4"

V1: |
  1. A Rapiu ringbam bo I se-e,
  Haibo dihga pah kiulan ne;
  Paniu tingtheng ringbose pine, 
  Lungsiat nai pumtan pakhu bam.

CH: |
  (Chorus)
  I niu se-e pahai ring bamme,
  Haibo dihga pah kiulan ne;
  I niu se-e, paniu pikhai-e,
  Lungsiat nai pumtan pakhu bam.

V2: |
  2. Jesu cham wadaodi li lakge,
  Paniu dinbo ladkeng hina;
  Patu malum jiu shaimi liudi,
  Paniu atu piring khaine.

V3: |
  3. Jesu aleng chabam kaden khai,
  Sibo ramga wanglung sune;
  Oh! paniu atu manang khai bam,
  Atu lura wanglan sune.

Translation: "(I know that My Redeemer Liveth)"

Category: "Humiliation, Resurrection & Glory"

