ID: "330"

Title: "MATHABO TINGMIK-E"

Key: "G"

Time signature: "3/2"

V1: |
  1. Mathabo tingmik wangtang-e,
  Jesu niu atu rankhai-e;
  Alungga mathabo niu ben,
  Kadihri ga dinron sukhe.

CH: |
  (Chorus)
  Mathabo tingmik ge,
  Jesu niu nuan hina kuak khai;
  Tingwang tu kahum rabo leng,
  A Rapiu niu atu dinkhai.
  (Repeat 1st and 2nd lines)

V2: |
  2. Taten dibo tenloi dasai,
  I a Rapiu gu pah agu;
  Jesu niu atu jukhai jiu,
  Alungli jiu I suitad le.

V3: |
  3. Ahiupuina nang sao sulo, 
  Pabam wibo ga mathaklo; 
  Na Rapiu tu phutkhai mane, 
  Pakhu ganiu thoidam daone.

V4: |
  4. Ting kaku ga alad chiu-e, 
  Tingmik machang chiukhai bine; 
  Ating loijiu shaikiu dasai, 
  Khudungjiu patu I thuanne.

Translation: "(Oh! Happy Day)"

Category: "Assurance & Testimony"

