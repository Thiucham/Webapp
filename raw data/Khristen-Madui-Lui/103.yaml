ID: "103"

Title: "TAD SUKHE ZION LAM"

Key: "G"

Time signature: "6/8"

V1: |
  1. Rapiu tu lungsamai chunwi ringa lulo,
  {Lungsabo lui thiucham bamlo; (2x)}
  Chawang bam chap magui jiu,
  Chalui se thiu sukhe.

CH: |
  (Chorus)
  Tad sukhe Zion lam, 
  Kawibo kawibo Zion;
  Tad sukhe Zion genlam,
  Kawibo Zion Tingwang kyga.

V2: |
  2. Suini makmai dungra Tingwang tu silakge,
  {Chiudi Tinggen maidung sira; (2x)}
  Matha chunwi bamme, 
  Matha chunwi bamme.

V3: |
  3. Zion luang rigase, parim wibo fui bam, 
  {Chunwi mathabo tinggen lam; (2x)}
  Kachia niu benbo 'pui, 
  Aliu tadmak thenna.

V4: |
  4. Aliu lui wiboniu mikdui pisang khai ne, 
  {Aliu tadne Immanuel; (2x)}
  Widiangbo tinggen ram, 
  Widiangbo tinggen ram.

Translation: "(we're Marching to Zion)"

Category: "Praise & Opening"

