ID: "196"

Title: "SUI MID MID WANG SUDE"

Key: "G"

Time signature: "6/3"

V1: |
  1. Suimid mid sude malum raleng;
  Suimid mid sude Khrista lura;
  Khangsia ra dinbam kum 'hiuna nang tad sulo;
  Pawan wibo nainiu I kulanne.

V2: |
  2. Suimid mid sude thainai wanglo;
  Suimid mid sude malan talo;
  Jesu ni kubamme mazadung di khuan bam;
  Lungchun ganiu kheng bam nuanmai wanglo.

V3: |
  3. Suimid mid sude atiat loide;
  Suimid mid sude loimi rade;
  Suimid midbo seniu wangtang lak mi sude;
  Achungjiu kap bamdi ranlu lakge.

Translation: "(Almost Persuaded)"

Category: "Response & Repentance"

