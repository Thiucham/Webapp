ID: "327"

Title: "APAO PHUNG HINA JESU NIU RUIKHAI"

Key: "E"

Time signature: "3/4"

V1: |
  1. Jesu dinbo chiu-e,
  Najeng sajiu bammai;
  Malumjiu kahumlo,
  I niu pikhai bine.

CH: |
  (Chorus)
  Apaw phung hina,
  Jesu niu ruikhai;
  Paniu achengsa hina,
  Kabun kum masan khai.

V2: |
  2. A Rapiu I ngaode,
  Napumtan gu seniu;
  Ka'phen maitu wikhai,
  Katanbo manuan khai.

V3: |
  3. Akhu kawibo ha,
  Nagu lungsiat daora;
  Calvary gu zainiu,
  Apum khiu masan ne.

V4: |
  4. I kashaibo naisai, 
  Ahiupuina sune; 
  Jesu niu lungsa khai, 
  Kapbo bamlan lakge.

V5: |
  5. Chawang bam suang gase, 
  I wang chap dasaira;
  Aripon wang saone, 
  Jesu phibang gase.

Translation: "(All to Christ in Owe)"

Category: "Assurance & Testimony"

