ID: "141"

Title: "THUANKIU JIU KAHUM KHE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Tingwang lungsiat tasibo aliu thuan bamkhe,
  Paniu gukhai bibo jeng ganiu;
  Sulo aliu Tingwang tu wang kahum sukhe,
  Aliu pah suangga arong dasai.

CH: |
  (Chorus)
  Thuankiu jiu kahum khe mathiu leng kheng khaibo,
  Pah racham kawibo din ronkhe;
  Sulo aliudung Tingwang tu kahum sukhe,
  Aliu pah suangga arong dasai.

V2: |
  2. Palungsiat gu tasibo luise thiu sukhe,
  Paniu aliu suangga lenkhai jiu;
  Panah piu Jesu tu majang thoikhai lujiu,
  Pawangbam ga aliutu jukhai.

V3: |
  3. Kheng bamkhe aliu leng kawibo pikhaira,
  Aliu puiki thaoben khai raleng;
  Aliu hiupuina pah khuga matha raleng,
  Aliu Tinggen kalek lu raleng.

Translation: "(Let Us Praise and Adore)"

Category: "Prayer meeting & Revival"

