ID: "282"

Title: "RIPHENMAI THIURA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jesu riphenmai thiura paniu kubamme,
  Pacham phung jiu tadlo paniu natu ku;
  Nang patu malumjiu pacham majailo,
  Nangdi Jesu riphenmai thiura tadlo.

CH: |
  (Chorus)
  Jesu riphenmai thiujiu pacham jailo,
  I niu pari phenthiu nang dilo;
  Jesu 'liutu khuan bam wa manang lakge,
  Nangdi tadlo Jesu riphenmai thiura.

V2: |
  2. Chabonkin hina pagu riphen thiu tadlo,
  Nai machang tadjiu paten thiujiu bamlo;
  Pa aliutu phut lak gom jiu bam sune,
  Nangdi Jesu riphenmai thiura tadlo.

V3: |
  3. Jesu niu lungsajiu ailutu kubamme, 
  Maobo pot phungjiu chunsajiu bam maitu; 
  Jesu khu mazat jiu wanglo kubamme, 
  Nangdi Jesu riphenmai thiura tadlo.

V4: |
  4. Chari thiubo ngamlu dasai simai dungtu, 
  Jesu niu riphen maitu khom maduine; 
  Ngambo pirunse paliu leng pisune, 
  Nangdi Jesu riphenmai thiura tadlo.

Translation: "(As a Volunteer)"

Category: "Conflict & Victory"

