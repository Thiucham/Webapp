ID: "98"

Title: "PATU THUANLO!"

Key: "A"

Time signature: "6/8"

V1: |
  1. Jesu tu thuanlo, pah aliutu rankhai-e;
  Liutu kungbo dinronlo kadih ga;
  Kahum bamlo tingku genlam di kahumme,
  Pumtan chakhuang se pazan ga pilo,
  Jesu niu panah maitu gukhai bine,
  Paben niu paliutu pamjiu bamne.

CH: |
  (Chorus)
  Patu thuanlo maihina niu 
  Chawang dibo mathabo lui niu 
  Patu thuan kiulo.

V2: |
  2. Jesu tu thuanlo, pah aliutu rankhai-e;
  Aliu nuan jeng niu chariu jiu shaikhai;
  Pahai aliu gu juringbo nbai bamme,
  Kahum bamlo paniu shaikhai mide,
  Pahniu 'liugu chariubo hina phung khai,
  Pagu lungsabo hai maisuang ha-e.

V3: |
  3. Jesu tu thuanlo, pah aliutu rankhai-e;
  Tinggen mainiu di pazan thuan bamme;
  Jesu Khrista tingtheng jiu chawang thiu bamne,
  Chawang pirun se papi ga runlo,
  Khrista chawang thiujiu kadih ga wangne,
  Pumtan kendi hina pagu thiulo.

Translation: "(Praise Him)"

Category: "Praise & Opening"

