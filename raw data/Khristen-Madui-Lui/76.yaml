ID: "76"

Title: "SHAIKHAIBO HAI MATHA MAKGE"

Key: "E"

Time signature: "3/4"

V1: |
  1. Rapiu niu singchai ga shaikhai,
  Siga chunsa tamiubo wang;
  Tachun chara thiuse lak mi,
  Jesu ringsulan makthe na.

CH: |
  (Chorus)
  Rapiu ringlan mibo racham,
  Chun wijiu din ronlo;
  Shaikhai bose matha makge,
  Pumtan bambo Rapiu ringde.

V2: |
  2. Pagu juring bose nawang,
  Palungsiat niu 'liutu ku bam;
  Pazai niu 'liutu liu lude,
  Shaikhai bose matha makge.

V3: |
  3. Oh! suang habo ringbo chamme,
  Jesu Tinggen ga mawang bam;
  Paniu mpui kaden khai-e,
  Shaikhai bose matha makge.

Translation: "(He did not Die in Vain)"

Category: "Humiliation, Resurrection & Glory"

