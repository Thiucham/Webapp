ID: "271"

Title: "KAHIAMBO GA NGUT TULO"

Key: "B"

Time signature: "6/8"

V1: |
  1. Kahiambo ga ngut tu nang mao misune,
  Gukhaipiu niu natu majang jiu bamme;
  Tamiu ga bamdi ngam raleng matan lo,
  Jesu tu malumlo natu gukhaine.

CH: |
  (Chorus) 
  Gukhaipiu khuga khenglo, 
  Paniu pumtan pikhai ra;
  Paniu natu gukhai ne, 
  Patu malum bamlo.

V2: |
  2. Kasabo nakamai nai sabo cham thonlo,
  A Rapiu zan se kungjiu maning bamlo;
  Majibo lungchun seniu maitu kunglo, 
  Jesu tu malumlo natu gukhaine.

V3: |
  3. Malum jiu ngam maileng Tingwang niu ringbo,
  Pirun run runkhai bine malum jiu bamlo;
  Ringbo pumtan sidi paniu pikhai ne, 
  Jesu tu malumlo natu gukhaine.

Translation: "(Yield Not to Temptation)"

Category: "Conflict & Victory"

