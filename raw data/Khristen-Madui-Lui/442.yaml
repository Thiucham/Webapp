ID: "442"

Title: "MASANBO GA LUNGLO"

Key: "F"

Time signature: "6/8"

V1: |
  1. Masanbo ga lunglo Rapiu niu dinne,
  Pakhu bam tantan lo palad ga lunglo,
  Suan maidung tu Tingwang nah thiura tenlo,
  Mangai jadjad dulo pah lungsa phiura.

V2: |
  2. Masanbo ga lunglo kadih hai sa-e,
  Pawan piu keng bamlo Jesu nai naleng,
  Jesu tu phui bamsai patu lui sune,
  Jesu tu nang luibo na'khai ga ngaone.

V3: |
  3. Masanbo ga lunglo pah nkha khaine,
  Pakhu su pak dulo kahiambo daodi,
  Chunwi ga chariu ga Rapiu sai suilo,
  Jesu tu nang phuilo palad malumlo.

V4: |
  4. Masanbo ga lunglo nalung agine,
  Paniu pui khaibo ga nachun se bamlo,
  Lungsabo duipin ga natu pui khaine,
  Rapiu gu ten kam leng nangtu piu khaine.

Translation: "(Take Time to be Holy)"

Category: "Special songs"

