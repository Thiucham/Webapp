ID: "258"

Title: "TINGGEN BANG SE BIULO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Tinggen bang se biulo thainai chunwi jiu,
  Hamibo hiupuina wang bamme;
  Phuilo papiu niu puiki ga sundao-e,
  Ronmeng mibo panah tu sundao.

CH: |
  (Chorus)
  Pakendi-e Tinggen mai luise,
  Dejiu wigulo tara khuanse;
  Rankhai maidung seniu duipui khuan kumjiu,
  Ranlubo luise thiu bamme.

V2: |
  2. Tinggen bang se biulo thainai chunwi jiu,
  Ronmeng mimai wang lanbo donniu;
  Nuan phungbo hiupuina situ gukhai-e,
  Seniu mana kasan lanlude.

V3: |
  3. Tinggen bang se biulo thainai changee jiu,
  Matha malabo luise thiulo;
  Chunwibo cham dinlo pabam machang ga,
  Hiupuina mana kasan lude.

Translation: "(Ring the Bell of Heaven)"

Category: "Love, Joy & Peace"

