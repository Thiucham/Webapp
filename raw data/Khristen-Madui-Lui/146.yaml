ID: "146"

Title: "NUAN PHUNGMAI WANGLO"

Key: "F"

Time signature: "6/4"

V1: |
  1. Jesu niu nuan phungmai tu ku-e, wanglo
  Aliu naleng kheng bamga, 
  Nuan mai wanglo;
  Pakhu wangra wibo wan,
  Nuan mai wanglo;
  Pahtu sirabo wan ga,
  Nuan mai wanglo;

V2: |
  2. Nabang ripbo phung bamme,
  Nuan mai wanglo;
  Jesu niu mathak khaine,
  Nuan mai wanglo;
  Jesu cham arat makge,
  Nuan mai wanglo;
  Jesu natu lukhai ne,
  Nuan mai wanglo.

V3: |
  3. Palungsiat chamse kingjiu,
  Nuan mai wanglo;
  Nang wangjiu thoidam lulo,
  Nuan mai wanglo;
  Jesu niu natu kuga,
  Nuan mai wanglo;
  Aliu naleng kheng bamga,
  Nuan mai wanglo.

Translation: "(Come Sinner, Come)"

Category: "Prayer meeting & Revival"

