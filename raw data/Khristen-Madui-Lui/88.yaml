ID: "88"

Title: "KADIBO TATHU TIABO NSUAN"

Key: "C"

Time signature: "6/9"

V1: |
  1. Tinggen chawang bam khat I ngao-e,
  Jehovah sibo riga bam;
  Chamai hina siga wang chap fui,
  Paliu thu tiara wang chab-e;
  Tinggen hom maidung siga pat jiu,
  Kadih di tadui riga chablu;
  Paben khengsu maitu ku shenjiu,
  Pating ha mine chiujiu din.

CH: |
  (Chorus)
  Chamai sazai ngaora maihina,
  Ping suijiu kap kam mibo ngao;
  Chiujiu paliu maginmarao pao,
  Chiudi paliu rizu mine.

V2: |
  2. Kakhiu maidi siga wang chap bam,
  'Di paliu khiuniu ranlu mak;
  Kasa kaha maidi siga chap,
  Chiudi lungsa silak mine;
  Kadih maidung di siga chap bamme,
  Chiudi paliu chamtan hamine;
  Karingbo ariak ga phui dasai,
  Paliu zan raokhai mak di-e.

V3: |
  3. Paliu jai kawi maidi wang chap,
  Chiudi seniu wilu mak mi;
  Kazit maniu tasi thuan mai chap,
  Paliu Tingwang lungpom phungmi;
  Jesu tu kalan mi maidung sidi,
  Paliu niu Jesu tu malum mak;
  Paliu nda Jesu tu luni mak,
  Siniu tuhoi paliu shaine.

Translation: "(The Great Judgement Morning)"

Category: "Second coming"

