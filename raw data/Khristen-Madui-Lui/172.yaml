ID: "172"

Title: "WANGLO RONMENG KINMAI"

Key: "A"

Time signature: "6/8"

V1: |
  1. Dejeng niu mariu chari bamra?
  Maihina tiusak kamlak bam,
  Napiu ky kawibo gase ra,
  Agunjiu bam nang wangra tu.

CH: |
  (Chorus)
  Wanglo ronmeng kinmai,
  Napiu kyga naleng wahina bam,
  Wanglo ronmeng kinmai,
  Nang wanglan ra tu napiu agun bam.

V2: |
  2. Ronmeng mai wang napiu ga dinlo,
  I maode atu kuak khailo,
  Nanahmai chiujiu kubui tane,
  Navang lengdi suisai wine.

V3: |
  3. Napiu natu agunjiu khuan bam,
  Nang malan wangra tu khuan bam,
  Natu para lungsa jut jiu bam,
  Oh! kazitmai wanglan lakma?

Translation: "(Come Wanderers Come)"

Category: "Invitation & Baptism"

