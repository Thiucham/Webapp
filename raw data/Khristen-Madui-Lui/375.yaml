ID: "375"

Title: "WIBIBO DIH"

Key: "F"

Time signature: "3/4"

V1: |
  1. Amik niu ngaobo dih khat bam,
  Amang lam ngaobo suangdi wi;
  Maisuang habo nbiu benbam,
  Pakendibo madu khai-e.

CH: |
  (Chorus)
  Kadih wibo mathabo ram,
  Kadih tamiu ramben khailo;
  Naram wibo aliu ngaone,
  Aliu ting hai tonda saira.

V2: |
  2. Sibo ram wibo genlam ra,
  Siga sabo bamlan lakge;
  Da ram nami maitu daone,
  Siga ramnabo bamlan lak.

V3: |
  3. Sibo bamra kadih kummak, 
  Naimik biuse pageng ha-e; 
  Kadih ga benbo suang benne,
  Chun tamiubo bam lanlakge.

V4: |
  4. Siga sabo tingkai ha-e, 
  Masim rim rimjiu lung mine; 
  Wang maihina leng chaky bam, 
  Tingwang ram mathabo ramga.

Translation: "(Better Land)"

Category: "Aspiration after Heaven"

