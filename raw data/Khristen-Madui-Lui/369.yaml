ID: "369"

Title: "ADAONE NAIKHATRA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naimik suang benbo dihkhat bamme,
  Malummai mikniu phui meng ngao-e;
  Apiu niu Tinggen lam khuan bamme,
  Kaden khaibo ramga adao ne.

CH: |
  (Chorus)
  {Adao ne naikhat ra,
  Aliu dung Tinggen lamsu daone. (2x)}

V2: |
  2. Pabam wibo singgiu gen gase,
  Lungsa khaibo luise thiu bamne;
  Aliu hiuna hai chunsa lakge,
  Chariubo hinase bam lakge.

V3: |
  3. Tinggen lam bambo apiu kyga,
  Patu thuanbo lui thiujiu bamne;
  Paken kadibo lungsiat jengniu,
  Nai machang aliutu masan khai.

Translation: "(sweet By and By)"

Category: "Aspiration after Heaven"

