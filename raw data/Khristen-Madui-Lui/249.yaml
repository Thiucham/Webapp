ID: "249"

Title: "KHRISTA TU KUNG SANNE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Khrista tu kung sanne lungsa diang-e, 
  Khudung jiu kahumbo lusu khailo;
  I machunbo siakge.

CH: |
  (Chorus) 
  Khrista tu kung sanne; 
  {Lungsa diangne. (2x)}

V2: |
  2. Kadih chunwibo tu phiu bam liudi, 
  Tuhoi natu phiu wang lusu khailo;
  Haise arathoi-e.

V3: |
  3. Chariu magenthiubo seniu gomdi, 
  Nacham wibo seniu achun kimkhai; 
  I niu thuanjiu bamne.

V4: |
  4. Shai thiuniu jiu bamdi Natu thuanne, 
  Haise alui thiujiu thuansao lakge; 
  Haise arathoi-e.

Translation: "(More Love to thee, Oh Christ!)"

Category: "Consecration"

