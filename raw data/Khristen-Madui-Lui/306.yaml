ID: "306"

Title: "KARINGTING TAD BAMME "

Key: "A"

Time signature: "4/4"

V1: |
  1. Chunsa jengsa mai keng bamme,
  Chamai karingbo tingga;
  Hiupuina haramai keng-e,
  Karingting tadbo lungga;
  Aliu chunwi jiu bamkhe,
  Aliu ten raleng bamme;
  Ten kawi tenlu bui-e,
  Chamai karingbo tingga.

CH: |
  (Chorus)
  Karingting tad bamme, (2x)
  Ten kawi tenlu bui-e,
  Chamai karingbo tingga.

V2: |
  2. Pawan ha-e make maileng,
  Chamai karingbo tingga;
  Na zu nsuan naimik kum bamlo,
  Chamai karingbo tingga;
  Chariumai nai hamimai,
  Kadihga hai keng bamme;
  Nasingnah tu jusulo,
  Karingting tadbo lungga.

V3: |
  3. Lungsabo riang niu bang bamme,
  Aliu karingbo tingga;
  Khat khattu saodiak mid midle,
  Chamai karingbo tingga;
  Maruklo chalin wibo,
  Pasy wijiu su raleng;
  Aliu chun ri nga bamkhe,
  Chamai karingbo tingga.

Translation: "(While the Days are Going By)"

Category: "Christian service & Reward"

