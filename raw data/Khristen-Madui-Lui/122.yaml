ID: "122"

Title: "WANGLO NABANG SE SAOKHAIDIA LUJIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Wanglo nabangse saokhaidia lujiu,
  I niu se-e nang niu chariubo se;
  Nang chariu kasuang duise nunshang ne,
  Nang tanlanra pumtan pikhai bine.

V2: |
  2. Kadih mania saokhaidia jiu wanglo,
  Kadih mainiu sitang kamak bose;
  Majibo masanbo mpui wibo,
  Apiu nai akhuga ronna bamme.

V3: |
  3. Nang niu kadinbo tenbo tadboga,
  Nang niu ngambo nang niu pingbo dinlo;
  Nahiupuina chariu se I se-e,
  Sidung se mikdui niu kuak khai bine.

V4: |
  4. Wang jiu mathaklo tabin 'pui theng-e, 
  Puiki ga tadlakjiu kaokhai lune; 
  Ringbo taruak naleng tiura bamme, 
  Karingbo duise bamme wang shaklo.

V5: |
  5. A Rapiu ga wang sao aruang lujiu, 
  Tamiujiu malan makthen tenbamlo; 
  Tuhoi pawan dunbo ken dasaira; 
  Na Rapiu ky tinggen lam wang saone.

Translation: "(Come Ye Yourself Apart)"

Category: "Lord supper"

