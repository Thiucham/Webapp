ID: "105"

Title: "SULO SULO AHIUPUINA"

Key: "E"

Time signature: "9/3"

V1: |
  1. Sulo sulo ahiupuina, 
  Tingwang tu thuan sukhe;
  Kui kamakbo luise thiulo,
  Ranka lubo luise;
  Jesu singchai ga shai khaijiu,
  A nuan se masan khai;
  Pazai niu liu lujiu rankhai,
  Kiam hina masan khai.

CH: |
  (Chorus)
  Sulo sulo ahiupuina,
  Thiulo thiulo Tingwang kendi;
  Kuikamakbo luise thiulo,
  Chalui se thiu sulo.

V2: |
  2. Rapiu chawang niu rankhai-e,
  Tingmik machang gukhai;
  Ahiupuinah rankhaibo tu,
  Wadao di rui ngamlak;
  A Rapiu niu lungsa khaijiu,
  Kawibo lu khai ra;
  Palungsiat nai palek wat niu, 
  Atu majang wang khai.

V3: |
  3. Kali makbo lungsa haise,
  Tinggen lungsiat se-e;
  Tingwang lungsiat haise di-e,
  Haise tingtheng lilak;
  Lungsiat hai niu kadihri,
  Pakhiangna phui jiu bamme;
  Din ngam lakbo lungsiat seniu,
  Tingwang tu madu khai.

Translation: "(Awake, Awake Oh! Heart of Mine)"

Category: "Praise & Opening"

