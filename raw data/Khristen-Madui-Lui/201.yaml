ID: "201"

Title: "I KUMBO NIU"

Key: "E"

Time signature: "6/8"

V1: |
  1. I kumbo niu kheng mak liudi, 
  Nazai kiukhai aleng jeng niu;
  Nakhu wangra ku-e nang niu, 
  I wang-e Tingwang milypoi.

V2: |
  2. Lunglak miktiat maikum bo,
  I ngao ra wira lungwi khaira;
  Nakhuga wa hina daora,
  I wang-e Tingwang milypoi.

V3: |
  3. I kum maitu nang niu lukhai, 
  Kuak khai kam masanra dao-e; 
  Nalad ren tu I malumjiu, 
  I wang-e Tingwang milypoi.

V4: |
  4. I kummai tu nalungsiat niu, 
  Kampang khaide khambo hina; 
  Tuhoira I nagu thiura, 
  I wang-e Tingwang milypoi.

Translation: "(Just as I am)"

Category: "Response & Repentance"

