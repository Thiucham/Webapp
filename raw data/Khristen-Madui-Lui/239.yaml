ID: "239"

Title: "I NATU LUNI PAWAN MACHANG "

Key: "A"

Time signature: "3/4"

V1: |
  1. I natu luni-e pawan machang;
  Nang niu lungsa khaijiu achunwi-e.

CH: |
  (Chorus)
  Maning-e he! maning-e;
  Pawan machang maning,
  Nang niu kawi pilo;
  Rapiu I wang-e.

V2: |
  2. I natu luni-e akhu bamlo;
  Kahiambo hathonlo naben tanniu.

V3: |
  3. I natu luni-e pawan machang; 
  A Rapiu niu wangjiu majang khailo.

V4: |
  4. I natu luni-e pawan machang; 
  Naladriat aliu ga wangtang khailo.

V5: |
  5. I natu luni-e kamasanbo; 
  Kawibo pikhaijiu machang khailo.

Translation: "(I Need Thee Every Hour)"

Category: "Desire after holiness"

