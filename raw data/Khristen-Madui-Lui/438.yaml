ID: "438"

Title: "TAKUM KASAN"

Key: "A"

Time signature: "⚪"

V1: |
  1. Takum wan wang chahiu tingnai kalijiu, 
  Thaisu takum kasan lan mide;
  Naji gasu niu nangchun wijiu sulo,
  Mathajiu thuan sukhe takum kasan tu.

CH: |
  (Chorus)
  Wanglo wanglo Tingwang tu thuan sukhe,
  Lungsa khaibo mangai ra saolo? 
  Takum wan wangjiu chalungsa khaibo se,
  Tingtheng tingtheng paken se dibam milo.

V2: |
  2. Takum changjiu tadrai lu maitu makjiu, 
  Aten hai tatun chaken di du;
  Lungka magenthiu lujiu bambo gasu, 
  Takum wan wangjiu nachengsa saodiaklo.

V3: |
  3. Takum wan loijiu kasan lui thiu sukhe,
  Naliu mathiuna se sui wanglo;
  A Rapiu niu natu matha khai sune,
  Kasabo ten thonlujiu chalung lilo.

V4: |
  4. Mathajiu naten wibo se phungwanglo,
  A Rapiu kawi janra wang nge;
  Rankhaibopiu niu 'cheng wi pah maning-e,
  Mathajiu thuankhe a Rapiu Jesu tu.

Translation: "(New Year)"

Category: "Special songs"

