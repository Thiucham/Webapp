ID: "224"

Title: "TINGWANG BEN PASHUNG GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rankhaipiu atu majang jiu bamme,
  Kasabo wangdi atu gukhai ne;
  Tingthung tan wangdi paniu baikhai ne,
  Tingwang bendi wibo niu.

CH: |
  (Chorus)
  Tingwang bendi wibo niu, (2x)
  Kasabo wan ga atu gukhaine,
  Tingwang bendi wibo niu.

V2: |
  2. Lungsabo paben niu atu pamme,
  Manaibo cham paniu akhu dinne;
  Tingwang niu atu pamjiu rankhai-e,
  Tingwang bendi wibo niu.

V3: |
  3. Paniu atu wadaodi phut lakge,
  Palungsiat tu waniu di kampang lak;
  Paniu tingtheng atu maluang bamne,
  Tingwang bendi wibo niu.

Translation: "(The Hollow of God's Hand)"

Category: "Driving guidance & Protection"

