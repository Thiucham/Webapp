ID: "17"

Title: "KINGLO TINGGEN KHOMMAI LUI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kinglo tinggen khommai lui, 
  Ngenah wang kendi bamlo,
  Kadih ga manai bamlo, 
  Tingwang nai nuan phung maidung;
  Kawi thiura wang bamme 
  Tinggen mai chalui thiu-e;
  Sui thiulo tinggen mai lui,
  Jesu Bethlehem ga pon.

CH: |
  (Chorus)
  Kinglo tinggen khommai lui,
  Ngenah wang kendi bamlo.

V2: |
  2. Dikachangbo wang khrista,
  Tingtheng karingbo khrista,
  Pahniu wang bo tu phuilo,
  Masanbo riliu khu ga,
  Tingwang niu mailun thiuwang
  Chamainah mawui wang-e,
  Maidung tu maluang bamra,
  Immanuel Jesu-e.

V3: |
  3. Agimanaibo wang nah,
  Majibo situ thuanlo,
  Kabenbo nai karingbo,
  Pahniu phung wang aliu khu,
  Pakendi bose phung wang,
  Chamai shailan mak raleng,
  Kadih maitu lungsa ra,
  Mana lonra pikhai-e.

Translation: "(Hark the Herald Angels)"

Category: "Christmas"

