ID: "163"

Title: "JESU TADKIN WANG-E"

Key: "D"

Time signature: "6/8"

V1: |
  1. Chariumai wang mathak lulo,
  Jesu tadken wang nge;
  Agunjiu wang maitu thoikhai,
  Palad malum lulo.

CH: |
  (Chorus)
  Wangkin-e! (2x)
  Mazadjiu patu adaolo;
  Jesu thainai tadken wang-e, 
  {Wangkin-e! (2x)}

V2: |
  2. Bangrit phungmai mathak lulo,
  Jesu taken wang nge;
  Nang khengbo Rapiu chiu khaine,
  Wa kasa ha sune.

V3: |
  3. Mariu charimai wang paolo, 
  Jesu tadken wang-e;
  Ringbo taruak nahiuna leng, 
  Pitiu magiu khaine.

V4: |
  4. Nuan mai kuak khaira kheng lulo, 
  Jesu tadken wang-e; 
  Lungsa khaibo zuwang phuilo, 
  Naimik biu suang benne.

Translation: "(Jesus is Passing By)"

Category: "Invitation & Baptism"

