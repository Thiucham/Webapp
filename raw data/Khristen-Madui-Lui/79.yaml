ID: "79"

Title: "TAZAI PUMTAN BAMME"

Key: "B"

Time signature: "4/4"

V1: |
  1. Nang maojiu bambo puad luaklu suma?
  Milypoi zai ga pumtan bamme;
  Shaibo hina nang niu ngamlu suma?
  Milypoi zai ga pumtan bam.

CH: |
  (Chorus)
  Pumtan bamme, tasibo tenra,
  Milypoi zai ga bam;
  Pumtan bamme tasibo tenra,
  Kung kachangbo milypoi zai.

V2: |
  2. Chaliangbo lunibo saolu suma?
  Milypoi zai ga pumtan bamme;
  Wanglo Calvary zai niu khiu raleng,
  Milypoi zai ga pumtan bam.

V3: |
  3. Napumdi kabun suang kabam suma?
  Milypoi zaiga pumtan bamme;
  Na nuan hina masanne tazai niu, 
  Milypoi zaiga pumtan bam.

V4: |
  4. Chawang Jesu leng nang tenjiu bamma? 
  Milypoi zaiga pumtan bamme; 
  Nang tingmik machang thuanbo lui thiuma? 
  Milypoi zaiga pumtan bam.

Translation: "(There is Power in the Blood)"

Category: "Humiliation, Resurrection & Glory"

