ID: "307"

Title: "NABIUSE PI THAO KHAILO "

Key: "B"

Time signature: "3/4"

V1: |
  1. Aliu piu gu lungsiat benbo,
  Tingtheng pabiu ben bamme,
  Kabenbo singgiu gen lamsu, 
  Aliutu paniu pi-e.

CH: |
  (Chorus) 
  Namibung se pi tao khailo, 
  Duidi genlam tao khailo, 
  Duipui ga chariu bam maitu, 
  Nang niu rankhai lubui-e.

V2: |
  2. Nuan gu tamiubo hamine,
  Tanjiu shen bambo khuan hai! 
  Taphuga shenbam bo khuan tu, 
  Masen jiu nkhuan bam-e.

V3: |
  3. Singnah namibung pi tao lo,
  Duipui ga chariu bammai! 
  Kenpad lura phiujiu bamme, 
  Tamiubo ga ha lune.

Translation: "(Let the Lower Light be Burning)"

Category: "Christian service & Reward"

