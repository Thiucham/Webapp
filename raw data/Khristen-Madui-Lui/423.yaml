ID: "423"

Title: "KABENBO PIKIULO"

Key: "G"

Time signature: "3/4"

V1: |
  1. Kabenbo pikiu mazatlo,
  Nabiuse piben khailo;
  Rankhaibo cham dinron bamlo,
  Rankhaibopiu pen ganiu.

CH: |
  (Chorus)
  Kabenbo pikiu mazatlo,
  Duidi gen tamiubo ga;
  Pi chiu khailo tasibo cham,
  Paman hajiu pikhaibo.

V2: |
  2. Chariu maileng thaoben khailo,
  'Chun katamiubo bamga;
  Tingmik tang makga mazatlo,
  Pawan tad saomak bamme.

V3: |
  3. Thaoben lo Tingwang ladling-e,
  Paladriat sui matib jiu;
  Ringbo wibo cham dinronlo,
  Loibo tangjiu majang ne.

Translation: "(Send the Gospel Light)"

Category: "Christian mission"

