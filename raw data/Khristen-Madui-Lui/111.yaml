ID: "111"

Title: "ALIU WANGTU THUANLO "

Key: "C"

Time signature: "4/4"

V1: |
  1. Kadih chawang hina wang a Rapiu,
  {Thuankiu sukhe; (2x)}
  Makhum jiu a Rapiu tu kahum khe,
  Sen matan jiu thuankiu khe.

CH: |
  (Chorus)
  Gukhaimai hina niu chalungsabo khuan niu
  {Chawang tu thuan khe; (2x)}
  A Rapiu zan hai mathajiu thuan kiu sukhe,
  Chawang dung wang a Rapiu.

V2: |
  2. Di kachangbo wang dam khaibo piutu,
  {Thuankiu sukhe; (2x)}
  Kendibo nai pumtan se pagu-e,
  Sen matan jiu thuankiu khe.

V3: |
  3. Di kachangbo wang tu thuanra wanglo,
  {Thuankiu sukhe; (2x)}
  Kadihga zat hina wang mathalo,
  Sen matan jiu thuankiu khe.

V4: |
  4. Dikachangbo wang zan masan bamlo, 
  {Thuankiu sukhe; (2x)}
  Tinggen maza dungnai chamai dung niu, 
  Pakendibo sen ronlo.

Translation: "(Praise and Magnify our King)"

Category: "Praise & Opening"

