ID: "56"

Title: "ATU MAIDI KUNGMAK"

Key: "B"

Time signature: "4/4"

V1: |
  1. Jesu atu kungbo cham I dinni bamme,
  Pase chaka withubo kung thubo-e;
  Jesu niu a lungchun kamkali kam khai-e,
  Mai khatdi arihga sikumbo kamlak!

CH: |
  (Chorus)
  Mai khatdi Jesu Kum atu kungmak,
  Mai khatdi pakum lungsabo ha;
  Mai kaki khatdi I maobo puad luak bilak,
  Pa atu dejiu kunglo.

V2: |
  2. Jesu atu phuilu dao I ronmeng jiu bam,
  Alungdi magenthiu jiu I lungwang-e;
  Jesu niu paben khengsu atu jusu khai,
  Majibo 'puiga pa atu juwang-e.

V3: |
  3. Naimachang Jesu niu a npuiki thao benne, 
  Pa atu kungbo cham I se mid midle;
  Naikhat I khang tinggen ga patu ngao bonai,
  Atu ranra kiubo se I silune.

Translation: "(No One ever Cared for Me)"

Category: "Christ life & Love"

