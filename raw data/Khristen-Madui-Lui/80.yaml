ID: "80"

Title: "THAINAI RAPIU KHRISTA SUDE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Thai Rapiu Khrista sude, halleluyah;
  Maidung nai maza senne, halleluyah;
  Chunwibo khuan kujiu senlo, halleluyah;
  Ting kadihmai niu thiulo, halleluyah.

V2: |
  2. Lungsa jiu rankhai bide, halleluyah;
  Chari se ngamlu mide, halleluyah;
  Phuilo naimik padlan de, halleluyah;
  Tazai se luang lan lakde, halleluyah.

V3: |
  3. Raw kham khuanmai matha-e, halleluyah;
  Mizai rengmun se pangde, halleluyah;
  Kashaibo niu ngamlak de, halleluyah;
  Khrista niu Tinggen le khai, halleluyah.

V4: |
  4. Kendibo wang ringlande, halleluyah; 
  Kashaibo thad degalo? halleluyah; 
  'Liuhiuna ranra shaikhai, halleluyah; 
  Charaw niu ngambo delo? halleluyah.

V5: |
  5. Pakendibo wangpiu-e, halleluyah; 
  Tingtheng ringrabo hai-e, halleluyah;
  Napum tan niu madukhai, halleluyah;
  Lungsara chalui thiura, halleluyah.

Translation: "(Christ the Lord is Risen Today)"

Category: "Humiliation, Resurrection & Glory"

