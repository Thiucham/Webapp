ID: "11"

Title: "HE! DITHUBO RAPIU"

Key: "B"

Time signature: "4/4"

V1: |
  1. He! dithubo Rapiu Tingwang tu thuan ne.
  Dambo nai ringbo 'paose nang-e Rapiu;
  Nuanmai suanmai pajeng samai chaka-e,
  {Chariu magenthiubo (3x)} kheng khaibo nang-e.

V2: |
  2. Shingbo khengbo pikhaibo Rapiu nang-e.
  Aliu niu khengbo hina nang pikhai-e;
  Aliu kapboga nangniu chunwi pikhai,
  {Majibo nai wibo (3x)} nang-e majibo.

V3: |
  3. Kati kadi hinalung pikim khailo, 
  Namaidung nai natu mikre maidung khu; 
  Tuhoi gukhaibo paliu lumira leng,
  {Dechiu ralo chiujiu. (3x)} phiumilo Amen.

V4: |
  4. Tamiu ramtu phud mimai duanwi milo. 
  Dithubo Tingwang nakendibo thiulo; 
  Tinggen dih ga kawidam lumai hina,
  {Hosanna! Hosanna! (3x)} Rapiu tu thuanlo.

Translation: "(Oh! Great Jehovah)"

Category: "Grace, Redemption & Love"

