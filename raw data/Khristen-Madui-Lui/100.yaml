ID: "100"

Title: "PAZANSE THUANLO"

Key: "E"

Time signature: "6/8"

V1: |
  1. Rapiu niu atu jukhai bamme,
  Pazan situ thuanlo;
  Pagu  mana se aleng pikhai,
  Pazanse thuanlo!

CH: |
  (Chorus)
  Halleluyah! hai aliu-e,
  Jesu tu marinting thuanne;
  Chalui kawibose thiujiu,
  Pazan tu thuanlo!

V2: |
  2. I azeng sa miboga jukhai,
  Pazan situ thuanlo;
  I niu pingbo ga pahniu gukhai,
  Pazanse thuanlo!

V3: |
  3. A ringting pahniu lungsa khai-e,
  Pazan situ thuanlo;
  Wadao di atu, pah phut lakge,
  Pazanse thuanlo!

Translation: "(Praise His Name)"

Category: "Praise & Opening"

