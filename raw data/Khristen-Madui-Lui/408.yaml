ID: "408"

Title: "PALIU CHALUI KASAN THIU-E"

Key: "C"

Time signature: "4/4"

V1: |
  1. Tinggen ga rankhai maidung chalui thiu-e,
  Kachia pirun chawang suangga khai bamme;
  Kadihri cheng kasa hina saodiak jiu,
  Masanmai hina mathabo lui thiu-e.

CH: |
  (Chorus)
  Jesu tu thuanlo,
  Calvary ga shaikhaibo piu;
  Jesu tu thuanlo,
  Tingtheng ringjiu bambo piutu.

V2: |
  2. Maisuang habo lungsiat luise machangde,
  Kachia piangga parim wibo fui bamme;
  Ringsu lan mibo Jesu niu nuan kuak khai,
  Aliu chawang kumjiu tingtheng mawang ne.

V3: |
  3. Masanbo puanpiu maidung ronna thiune,
  Paniu chalungsa khaibo lui thiu bamne;
  Rankhaipiu niu aliu nuan kuak khai bijiu,
  Pakendibo rankhaibo lui thiu bamne.

Translation: "(They Sing a New Song)"

Category: "Aspiration after Heaven"

