ID: "245"

Title: "HAIBO HINASE ALENG-E"

Key: "C"

Time signature: "3/4"

V1: |
  1. He! Rankhaipiu dejiu benlo,
  Lungsabo niu nang karingting;
  Tasi-e atu lungsabo,
  Haibo hinase aleng-e.

CH: |
  (Chorus)
  Ranlubo mai I thiune,
  Maring gebo khaoring kumjiu;
  Tuhoi lengdi tingtheng lengdi,
  Haibo hinase aleng-e.

V2: |
  2. Nangniu lungsa khaibo ganiu,
  Nang chariu jiu napum pikhai;
  Gethsemane ga kheng khaibo,
  Haibo hinase aleng-e.

V3: |
  3. Tathu pirun Natu runkhai, 
  Nazai seniu atu rankhai; 
  Calvary singchai ga kheng khai, 
  Haibo hinase aleng-e.

V4: |
  4. Chakhiu chalan suangdi wijiu, 
  Agimanaibo niu kendi; 
  Tinggen dih ga rankhai maidung, 
  Haibo hinase aleng-e.

Translation: "(All This For Me)"

Category: "Consecration"

