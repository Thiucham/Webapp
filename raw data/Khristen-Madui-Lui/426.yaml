ID: "426"

Title: "KHRISTA PHUMLING LENG"

Key: "D"

Time signature: "4/4"

V1: |
  1. Khrista phumling leng mai hina shenkhe,
  Aliu chawang dibo zantu thuanjiu bamkhe;
  Aliu pumtan bamga ngamdiu then tenkhe,
  Tingwang dih leng aliu matip jiu chapkhe.

CH: |
  (Chorus)
  Khrista lungsa jiu rankhai,
  Khrista niu gukhai-e;
  Pazai niu liu khai maidung leng,
  Tan hubo pikhailo.

V2: |
  2. Khrista phumling leng mai hina kheng khe,
  Nai machang singchai phungjiu pasai sui bamkhe;
  Masanbo hiupuina pumtan pen ganiu,
  Karingting wibo ga Tingwang ten thiukhe.

V3: |
  3. Khrista phumling leng mai hina pikhe, 
  A Rapiu leng pawan nai kachia thon khaijiu; 
  Aliu kawibo pakhuga phungwang sai, 
  Kungbo wibo wadaodi kuilan lakge.

V4: |
  4. Khrista phumling leng mai hina phutkhe, 
  Kadih lungchun niu lukanibo thon mikhe; 
  Aliu niu kawibo situ ramgunjiu, 
  Rankhaipiu ben jatlam wang matha bamne.

Translation: "(For Christ and the Church)"

Category: "Christian mission"

