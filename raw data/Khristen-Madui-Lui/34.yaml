ID: "34"

Title: "JESU NIU ATU LUNGSA"

Key: "E"

Time signature: "2/4"

V1: |
  1. Jesu niu atu lungsa,
  Bible niu hai chiu dinkhai;
  Nahmai hina pagu-e,
  Paniu paliutu gukhai.

CH: |
  (Chorus)
  Jesu atu kung; (3x)
  Bible niu dinkhai-e.

V2: |
  2. Lungsajiu aleng shaikhai,
  Tinggen khamsi lekhai-e;
  A nuan hina masan khai,
  Panahmai pithiu khai-e.

V3: |
  3. Lungsajiu maluang khailo,
  Pui machang maluang khailo;
  Malumjiu I shai kiu sai,
  Atu luang khangne tinggen.

Translation: "(Jesus Loves Me)"

Category: "Christ life & Love"

