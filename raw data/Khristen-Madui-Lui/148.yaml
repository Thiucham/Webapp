ID: "148"

Title: "TINGWANG KU BAMME "

Key: "A"

Time signature: "4/4"

V1: |
  1. Tingwang kubo I chiu lakma?
  Kadih mania masen rama?
  Ka ringting tadjiu bambo ga,
  Ahiupuinah jibam rama?

CH: |
  (Chorus)
  Kubamme chiu khailo, (2x)
  Tingwang kubamme,
  Chiu khailo kujiu bamme, 
  {Kubamme chiu khailo, (2x)}
  Tingwang kubamme,
  Chiu khailo ku bamme.

V2: |
  2. Tingwang kusai I sulakma?
  Palungsiat khuan I chiu lakma?
  Palungsiat I rui ngam suma?
  Pakhuga amenri rama?

V3: |
  3. Tingwang kusai I silakma? 
  Ahiuna mana wang suma? 
  Atu lu khaira khuan bamme,
  Hiuna tu kam chariu rama?

V4: |
  4. Tingwang kusai I suitadne,
  Pacham jaimakjiu bam rama? 
  Khuanjiu bamme phutkhai lakge, 
  Ku bamme ahiuna sulo.

V5: |
  5. Tingwang kubo I sui khaine, 
  Ahiupuina khuan ngam lakge; 
  Tingwang khuan situ chiu lujiu, 
  Kadihri tu ramna khaide.

Translation: "(God is Calling Yet)"

Category: "Prayer meeting & Revival"

