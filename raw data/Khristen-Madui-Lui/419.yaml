ID: "419"

Title: "JESU NIU RANKHAI"

Key: "G"

Time signature: "3/4"

V1: |
  1. Mathabo khuan I chiu-e,
  Jesu niu rankhai-e; 
  Pabam machang dinkhai-e,
  Jesu niu rankhai-e; 
  Pabam machang dinronlo,
  Tadui kenjiu dinronlo;
  A Rapiu niu dinkhai-e,
  Jesu niu rankhai-e.

V2: |
  2. Tadui luangbo sai suijiu,
  Jesu niu rankhai-e; 
  Nuan phungmai khuga dinlo,
  Jesu niu rankhai-e; 
  Phuilo kadihga lungmai,
  Dinronlo kadihri ga;
  Kadih ga matha bamlo,
  Jesu niu rankhai-e.

V3: |
  3. Thiulo magenthiu bamdi, 
  Jesu niu rankhai-e; 
  Jesu niu shai khaiboga 
  Aliu tu rankhai-e; 
  Tamiubo gadi thiulo,
  Hiupuina tu lungsa sai; 
  Mathiuna chalui thiulo, 
  Jesu niu rankhai-e.

V4: |
  4. Chakhuan madujiu dinlo,
  Jesu niu rankhai-e; 
  Zat hina matha bamlo, 
  Jesu niu rankhai-e; 
  Rankhaibo chamse shenlo, 
  Duidi genlam bammai ga;
  Hai-e chari ngambo lui, 
  Jesu niu rankhai-e.

Translation: "(Jesus Saves)"

Category: "Christian mission"

