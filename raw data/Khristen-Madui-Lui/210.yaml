ID: "210"

Title: "JESU WANGJIU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Pa miktiatbo maikhat 'pui di ga wangjiu,
  Wa ngao makjiu wakheng tiujiu bamme;
  Kamaobo niu atu bang man bam niu-e,
  Chiudi Jesu niu amik pi ngao khai.

CH: |
  (Chorus)
  Jesu wang jiu kahiambo tu ha thonde,
  Jesu wang jiu amiktiatbo ngao khai;
  Achun tamiu bambo se piben khai-e,
  Jesu wang jiu wahina limide.

V2: |
  2. Chara kasabo mahiuniu majang jiu,
  Kamaobo niu achun kam masan khai;
  Satan atu kammeng pachun ning kamjiu,
  Jesu wang jiu atu rankhai mide.

V3: |
  3. Maihina tu Jesu niu kujiu bamme,
  Kawang maileng mathakbo pikhaine;
  Thiuniu chariu maidung Jesu khu wanglo,
  Rankhaibopiu akhuga bam mide.

Translation: "(Then Jesus Came)"

Category: "Response & Repentance"

