ID: "416"

Title: "JESU AGU"

Key: "E"

Time signature: "6/2"

V1: |
  1. Kadih chunwi kuidi Jesu agu;
  Kakungmai hamidi Jesu agu;
  Tamiubo mariuga mathakbo bam ha-e, 
  Jesu niu thoikhai ngam Jesu agu.

V2: |
  2. Hiam dulo ahiuna Jesu agu,
  Haiga I bam thengde Jesu agu;
  Hami rabo mania pawan khatna leng-e, 
  Alung niu phut khaide Jesu agu.

V3: |
  3. Mangambo hamide Jesu agu, 
  Hahmilo benbo ga Jesu agu; 
  Abenniu ten khaibo kasabo sao mine, 
  Jesu niu kim khai-e Jesu agu.

V4: |
  4. Kashai kanui bamdi Jesu agu;
  Adaone tingthengjiu Jesu agu; 
  Adao-e kakungbo adao-e mathakbo, 
  Adao-e rankhaipiu Jesu agu.

Translation: "(Jesus is Mine)"

Category: "Death & Rise"

