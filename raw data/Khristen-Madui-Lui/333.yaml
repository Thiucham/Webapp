ID: "333"

Title: "JESU ZAI MAKJIU KAKIHA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Deniu khiu masan ralo?
  Jesu zai makjiu kaki ha.
  Deniu I masan ralo?
  Jesu zai makjiu kaki ha.

CH: |
  (Chorus)
  He! kungbo zai luang khai,
  Kabun kum masan khai;
  I masan rabo leng,
  Jesu zai makjiu kaki ha.

V2: |
  2. Achengsa masan khaira,
  Jesu zai makjiu kaki ha.
  Atu kuak khaira kheng-e,
  Jesu zai makjiu kaki ha.

V3: |
  3. Nuan kuak khai raleng ha-e,
  Jesu zai makjiu kaki ha.
  Aronna masan ngamlak,
  Jesu zai makjiu kaki ha.

V4: |
  4. Manai agi bam raleng, 
  Jesu zai makjiu kaki ha.
  Acheng matiplu raleng, 
  Jesu zai makjiu kaki ha.

Translation: "(Nothing But the Blood of Jesus)"

Category: "Assurance & Testimony"

