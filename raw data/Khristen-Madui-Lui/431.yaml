ID: "431"

Title: "ALIU KHRISTEN MAI"

Key: "E"

Time signature: "12/8"

V1: |
  1. Thuanbo lui nai chunwi lui niu,
  Tachun nga jiu patu thuan khe;
  Paben niu aliutu jukhai,
  Aliu Khristen maitu lungsa.

CH: |
  (Chorus)
  Chap bamkhe mathajiu,
  Tenkhe chun khat thiujiu;
  Hami maitu phiukhe,
  Chariubo nuan gasu;
  Haise aliu ngamme,
  Pazan dinron sukhe;
  Jesu rankhaibopiu nai,
  Pagu lungsiat tu dinkhe.

V2: |
  2. Aliu haiga aruang bamga,
  Lungsamai akamai rongga;
  Aliu niu khengbo lukhai jiu,
  Palungsiat niu pikhai sune.

V3: |
  3. Nahmai dung gu chaka nang-e,
  Aliu phiken padbo hina;
  Ngambo naben niu sio khailo,
  Gulo aliu Khristen dungtu.

Translation: "(Our Christian Bond)"

Category: "Christian mission"

