ID: "155"

Title: "WIBO CHAM MAKMA?"

Key: "F"

Time signature: "6/9"

V1: |
  1. Naleng aleng Jesu shai,
  Wibo cham makma?
  Matha rankhaide natu,
  Wibo cham makma?
  Singchai ga 'liu nuan phungkhai,
  Tinggen ga aliu lungne;
  Lungne tingtheng jiu siga,
  Wibo cham makma?

CH: |
  (Chorus)
  Wibo cham makma? (2x)
  Singchai ga 'liu nuan phungkhai,
  He! wibo cham makma?

V2: |
  2. Jesu din haise loide,
  Wibo cham makma?
  Nuan nai shaibo tu ngamde,
  Wibo cham makma?
  Rapiu aliu leng shaikhai,
  Kanambo rathak thiujiu;
  Paniu matha pikhai-e,
  Wibo cham makma?

V3: |
  3. Ranpaose ringsumide, 
  Wibo cham makma? 
  Mikre piutu ngamlude, 
  Wibo cham makma? 
  Khrista niu ngam kamlude, 
  Khrista kulam khang mide;
  Aliu patu wang daone, 
  Wibo cham makma?

V4: |
  4. Pah aliu sung niu kheng bam, 
  Wibo cham makma? 
  Aliu shai makra khengbam, 
  Wibo cham makma? 
  Pah wangkiu lanji sune, 
  Aliutu pagu thiura; 
  Aliutu khom arongne, 
  Wibo cham makma?

Translation: "(The Good News)"

Category: "Message"

