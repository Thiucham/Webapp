ID: "292"

Title: "TADJIU TENLO"

Key: "G"

Time signature: "3/4"

V1: |
  1. Khristen sulo jitalo,
  Kap bammai haijiu bamga;
  Aman jiu taobam rama?
  A Rapiu niu thao bamga.

CH: |
  (Chorus)
  Tad lujiu naten sulo,
  Hami maitu phiu wanglo;
  Tamiubo nuan phung maidung,
  Khum kibo ga luang wanglo.

V2: |
  2. A Rapiu tu lungsa ma?
  Palad ren malum bamma?
  Aliu ga bambo pima?
  Palad phung lakge chiuma?

V3: |
  3. Patu malumjiu bamma? 
  Palad piujiu lung bamma? 
  Aliu hai pagu makma?
  Taten niu madu patkhe.

V4: |
  4. Aliu Singchai phungra bam, 
  Pirun lura maningsai; 
  Pumtan kasan phung padkhe, 
  Pating hai nawang sude.

Translation: "(Go and Work)"

Category: "Christian service & Reward"

