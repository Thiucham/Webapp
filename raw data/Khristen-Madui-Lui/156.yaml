ID: "156"

Title: "NANG MANA KASANLAN RABO-E"

Key: "E"

Time signature: "6/9"

V1: |
  1. Naikhat nchun ju pao Jesu khu wang,
  Juringbo nai kabenbo lamga maniu;
  Kati pao niu palingna pakhu dinkhai.

CH: |
  (Chorus)
  Mana kasan lanlo! (3x)
  I niu nakhu pachang paling dinbo-e,
  Mana kasan lanlo!

V2: |
  2. Chamai hina pacham tu nkinglo,
  Rapiu Jesu niu paling jiu dinbo cham;
  Pachamse mathakam maha mitulo.

V3: |
  3. Kendibo ramga wang ni maihina,
  Chunwi mathabo lui thiuni maihina;
  Tingtheng ringbo se ngaolu kani hina.

V4: |
  4. Tinggen ga lungsa mai natu khuanbam,
  Kawibo rengmun gase wangra khuan bam;
  Naleng kaden khaibo bamga wang raleng.

Translation: "(Ye Must be Born Again)"

Category: "Message"

