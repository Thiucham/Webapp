ID: "285"

Title: "JESU RONNA"

Key: "A"

Time signature: "3/4"

V1: |
  1. Ariga kamuang gom bamdi,
  Aronna mariu bamdi;
  Achariu chami kum bamdi,
  Mathabo hami liudi;
  Jesu tu I niu lukhai sai,
  Tinggen se aleng lune;
  Benthuibo naimik Jesu-e,
  Bethlehem gu ganbiu-e.

V2: |
  2. Kadih ga tad mariu bamga,
  Chariubo dao bam liudi;
  Charapen wibo phiu bamga,
  Tathu ronna dao liudi;
  Jesu tu I niu lukhai sai,
  Parim wibo aleng-e;
  Taning gu Lily rapen se,
  Sharon rapen se nang-e.

V3: |
  3. Lungchun niu masenbo hina, 
  Karai ga masen bose; 
  Chunsabo chariubo kapbo, 
  Kapingbo daobam liudi; 
  Jesu tu I niu lukhai sai, 
  Loibo tang tathui lune; 
  Amik niu ngaotang makbo ga 
  Maza niu jukhai bine.

V4: |
  4. Kendibo situ ramgunjiu, 
  I wangra khuan lulak bam;
  Jesu tu I niu lukhai sai, 
  Kachia rengmun ga ngut ne; 
  Tinggen lui wibose thiune, 
  Maza tu maluang thiune; 
  Withubo Jesu se agu, 
  Haise niu alui thiune.

Translation: "(Jesus Only)"

Category: "Comfort in sorrow"

