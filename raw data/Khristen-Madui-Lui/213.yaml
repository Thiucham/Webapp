ID: "213"

Title: "TINGMIK MACHANG WIBI BI"

Key: "D"

Time signature: "4/4"

V1: |
  1. Gukhaibopiu lungsiat kakungbo chamse,
  Tingmik machang wibi bide;
  Kulam kyse malum mwibi jiu,
  Tingmik machang wibibi sude.

CH: |
  (Chorus)
  Chunwi ri ngabo lui thiujiu,
  Sibo naise patu thuan jiu;
  Patu lungsabo lui thiujiu,
  Nai machang wibibi khangde.

V2: |
  2. 'Nabiuse karingbo gasu thao wang-e,
  Tingmik machang benbi bide;
  Tamiubo nchun ga chagan mathajiu,
  Pabiu winiu piri nga khai.

V3: |
  3. Malumbo niu tingthung ga khengh bambo, 
  Tingmik machang tanbi bide; 
  Tingtheng ring rabo leng ten bam bose, 
  Tingmik machang tanbi bide.

V4: |
  4. Jesu niu pibo manaibo chamse,
  Tingmik machang sukbi bide; 
  Khristen mai niu madan bambo guse, 
  Tingmik machang sukbi bi-e.

Translation: "(Sweeter as Days Go By)"

Category: "Christian fellowship"

