ID: "276"

Title: "KHRISTEN RIPHEN TADLO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Khristen riphen tadlo chari thiu raleng, 
  Phuilo Jesu khulam paniu raimine;
  Khrista saisui lujiu satan tu sunra, 
  Masuang lam ha ngutlo pengphai tu phuijiu.

CH: |
  (Chorus) 
  Khristen riphen tadlo, 
  Chari thiu raleng;
  Jesu khulam phuilo, 
  Paniu rai mide.

V2: |
  2. Jesu zan gasu niu satan pak mide, 
  Sulo khristen riphen tadjiu ngam sulo;
  Charuidih gu rengmun hina malai ne,
  Singnah mai thuanbo khuan niu thiujiu shenlo.

V3: |
  3. Pirun nai chawangbam charamdi hane, 
  Jesu gu phumling ra halanbi lakge;
  Charuidih gu rengmun niu ngamlu lakge, 
  Khrista ladren sira maolanbi lakge.

V4: |
  4. Singnahmai khat thiujiu chun wijiu tadlo, 
  Nakhuan tanjiu senlo ka ngambo luise; 
  Paken dibo thuanlo chawang Khrista tu, 
  Pakumbo maidi ha tingkadih riga.

Translation: "(Christian Soldiers)"

Category: "Conflict & Victory"

