ID: "44"

Title: "PAH DEGU KAMLO?"

Key: "D"

Time signature: "4/4"

V1: |
  1. Pakendibo rachamse kinglo,
  Nuan phungmai rong ga bammai;
  Jesu Tinggen lamsu niu kiu-e,
  Aliu tu rankhai raleng.

CH: |
  (Chorus)
  Saoniu aliutu rankhai lo?
  <Singchai ga shaibo Tingwang nah>
  Degu kamlo? 
  <Naleng shaikhai,>
  Dega bamlo Sao niu liutu rankhailo? 
  <Malum lulo Pah Tinggen lamsu niu kiu-e.>

V2: |
  2. Tinggen maza seniu shaikhai mak,
  Haise maisuang habo-e;
  Kuthubo Tingwang nah piutu se,
  Singchai riga maseng shat.

V3: |
  3. Rapiu ga nang pikhai kamda ma?
  Pa suangga makhum kiulo;
  Paniu lungsabo mangai mane,
  Paniu natu gukhai-e.

Translation: "(What did He Do?)"

Category: "Christ life & Love"

