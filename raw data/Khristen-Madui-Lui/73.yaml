ID: "73"

Title: "KHRISTA SUMIDE!"

Key: "C"

Time signature: "4/4"

V1: |
  1. Charaw ga zibambo, Rankhaipiu Jesu;
  Pating tang ra khuanbam, Rapiu Jesu.

CH: |
  (Chorus)
  Charaw gasu sumide, 
  Pa pumtan niu pari tu ngam jiu;
  Kashai tamiubo ngamjiu sulan mide,
  Dibo chawang bamga tingtheng jiu bamra su mide, su mide 
  Halleluyah su mide!

V2: |
  2. Rankhaipiu zibamtu, khuanmai matha-e;
  Paraw sintu sidi, Matha gu-e.

V3: |
  3. Shaibo niu ngam lakge, Rankhaipiu Jesu;
  Paraw kham tu ngamde, Rapiu Jesu!

Translation: "(Christ Arose!)"

Category: "Humiliation, Resurrection & Glory"

