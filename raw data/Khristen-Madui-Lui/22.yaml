ID: "22"

Title: "SAOLO MATOMKY GA"

Key: "A"

Time signature: "3/4"

V1: |
  1. Saolo matomky gase;
  Mily khuan mai kahumbo?

CH: |
  (Chorus)
  A Rapiu tasibo piu-e,
  Pakendibo wang a Rapiu;
  Makhumkiu jiu kahumkhe,
  Chawang pirun run khaijiu.

V2: |
  2. Ramjingga mariu chari;
  Magenthiu bose saolo?

V3: |
  3. Palad wibo jeng gasu; 
  Maithuan phungbose saolo?

V4: |
  4. Thiuniu jiu chariu maitu;
  Sao khuga luang wang khailo?

V5: |
  5. Lazarus shaimibo ga; 
  Charao ga kabbo saolo?

V6: |
  6. Chamai wang maduilujiu;
  Thuanbo lui thiu, saotulo?

V7: |
  7. Gethsemane reng lungga; 
  Chunding shingbose saolo?

V8: |
  8. Singchai ga chariu khenghjiu, 
  Shai khaibo piuse saolo?

V9: |
  9. Charao gasu ringsujiu; 
  Rankhaibo piuse saolo ?

V10: |
  10. Saolo paronna dijiu;
  Tingkadih ladzan thiubo?

Translation: "(Who is on the Yonder Stall)"

Category: "Christmas"

