ID: "167"

Title: "PATU MALUMLO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Wanglo nuan phungjiu chariumai,
  A Rapiu ga saora;
  Naleng amanbo pi sune,
  Palad malum saira.

CH: |
  (Chorus)
  Malum bamlo; (3x)
  Paniu natu gukhai ne,
  Tuhoi gukhai sune.

V2: |
  2. Jesu zai kamasanbo niu,
  Ringrabo leng pikhai;
  Pazai giu dui gase phumlo,
  Kabun kum masan ne.

V3: |
  3. Jesu ra 'pui majibo-e, 
  Siniu ring ra jukhai;
  Majatjiu patu malumlo,
  Siga nang mathak ne.

V4: |
  4. Kamasan mai ruang ga wanglo,
  Paken dimai thiura;
  Charam wibo ga lung raleng,
  Tinggen ram wibo ga.

Translation: "(Only Trust Him)"

Category: "Invitation & Baptism"

