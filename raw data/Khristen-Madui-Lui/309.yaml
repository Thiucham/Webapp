ID: "309"

Title: "TEN SULO"

Key: "E"

Time signature: "3/4"

V1: |
  1. Nang tadjiu pawan ga tenlo, 
  Chunwi jiu Tingwang ten tenlo;
  A Rapiu tadbo 'puiki-e, 
  {Pavang nang tuhoi tad lakma? (2x}

V2: |
  2. Tadjiu tenlo bui makha-e, 
  Naphijeng Tinggen lam bamme;
  A Rapiu niu thuanbo makjiu,
  {Mainiu thuanbo masen dulo. (2x)}

V3: |
  3. Tadjiu tenlo ngamdiu thenna, 
  Paniu na ngam wide chiusai; 
  Nachun wikachangbo thiune, 
  {Naphijeng se daosiak lune. (2x)}

V4: |
  4. Tenlo mathajiu tenbamlo, 
  Tenloi sai chaky ga saone; 
  Naopaopiu khuan chiu jisune, 
  {Kinglo I kiude chiubo khuan. (2x)}

Translation: "(Go Labour On)"

Category: "Christian service & Reward"

