ID: "381"

Title: "CHARI NGAMNE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Chari ngambo tathuan se,
  Aliu suangga khai bamme;
  A Rapiu Tinggen lamsu phui bamme,
  Nuan seniu tamiu jiu bamga;
  A Rapiu niu wang jiu,
  Njang jiu ku-e benbo ga bamra.

CH: |
  (Chorus)
  Aliu patu wang ngao ne,
  Patu wang kahum bamne;
  Pakendi jiu Jesu nai lungcham bamne,
  Aliu pazu wang ngao ne;
  Patu wang kahum bamne,
  Pakendi jiu Jesu nai lungcham bamne.

V2: |
  2. Pacham majai jiu tadne,
  Aliu pasai sui lujiu;
  Kulam bambo Rapiu lad 'liu phungne,
  Wa khat niu di pakhu gasu;
  Kam phek lanlu lakge,
  Aliu Rapiu ra malum buibo-e.

V3: |
  3. Tinggen lam aliu ky benbam,
  Tamiubo bam lakge;
  Tinggen lamsu niu lungsa khai sune,
  Aliu maran jiu pazan tu;
  Tingtheng thuanjiu bamne,
  Palad masanbo se halan lakge.

Translation: "(Triumph By and By)"

Category: "Aspiration after Heaven"

