ID: "336"

Title: "NALUNG CHUN CHARIUBO HINA"

Key: "A"

Time signature: "6/8"

V1: |
  1. Dejiu wilo he! a Rapiu,
  Nuan phung maha khaibo;
  Gukhailo naben tan seniu,
  Chariubo wan machang.

CH: |
  (Chorus)
  Na lungchun chariubo hina,
  Thuan khailo a Rapiu suang ga;
  Na lungchun chariubo hina,
  Paniu nangtu gukhai bi sune.

V2: |
  2. Alungchun chariubo hina,
  Sao khaira nachun ne;
  Chariubo wan machang I niu,
  Malumjiu khuan bamme.

V3: |
  3. Nalungsiat tu I malumme,
  Natu ronna ngen ne;
  Chariubo ga mathak raleng,
  Malumjiu khon bamme.

V4: |
  4. Detu alung chariu ralo?
  Pasai leng maning jiu;
  Detu malum makjiu pingra,
  Alung chariu ralo?

Translation: "(Casting All Your Care upon Him)"

Category: "Assurance & Testimony"

