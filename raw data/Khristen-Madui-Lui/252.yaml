ID: "252"

Title: "MALUMJIU PIULO"

Key: "F"

Time signature: "3/4"

V1: |
  1. A Rapiu niu majang palad kabenbo ga, 
  Aliu 'puiki paniu ben khaine;
  A Rapiu chun tensai paniu majang khaine, 
  Pachun sijiu palad malumkhe.

CH: |
  (Chorus) 
  Malumjiu piulo Jesu chunwi ra, 
  Malumjiu palad phungbo makjiu kaki ha-e.

V2: |
  2. Tamiubo bam lakge chunsabo di bam lak, 
  Paniu aliutu phui khai bamsai;
  Kapingbo bam lakge mikdui di luanglan lak, 
  Aliu patu malumjiu bamsai.

V3: |
  3. Chabang ripbo phungjiu magenthiu bam liudi, 
  Jesu niu aliu phijeng pine; 
  Singchai phungbo jeng niu chunsajiu bam midu, 
  Malumjiu bamsai thoikhai bine.

V4: |
  4. Pagu lungsiat dibo situ kada silak, 
  Aliu niu pakhu wangtang makthen; 
  Paniu pikhai rabo matha chun wibose, 
  Aliu malumjiu chunwi bamkhe.

V5: |
  5. A Rapiu niu majang pazu wang ngao sune, 
  Aliu patu manajiu bamne; 
  Paniu dinbo phungjiu langkhaibo ga tadne, 
  Pingmakjiu malumjiu piu bamlo.

Translation: "(Trust and Obey)"

Category: "Consecration"

