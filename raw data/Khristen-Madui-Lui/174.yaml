ID: "174"

Title: "LUNGSABO KHUANNIU KUBAM"

Key: "G"

Time signature: "9/8"

V1: |
  1. Mari wanglan lo he! hami maidung,
  Phuilo mily khuanpiu niu kubamme;
  Natu phiu bamme natu gukhai ra,
  Patu malumlo namen ritalo.

CH: |
  (Chorus)
  Lungsabo khuan niu kubamme natu,
  Mily khuanpiu niu kubo kinglo;
  Lungsabo khuan niu kubamme natu,
  Wanglo chiujiu lungsa jiu ku-e.

V2: |
  2. Natu khuan bamme nang halan lakge,
  Hai theng nang niu pui tadmeng bam liudi;
  Natu ran raleng pazai kiu khai-e,
  Palungsiat tasi-e dinse lakge.

V3: |
  3. Palad tu kingjiu palungsiat silo, 
  Na nuan phungjiu singchaiga shaikhai-e; 
  Nachengsa hina khiu masan khai-e,
  Halan lakbo hiupuina pikhai-e.

V4: |
  4. Wanglo kamajibo 'pui zuan wanglo, 
  Jesu Khrista majibo kamun-e; 
  Pachun wijiu natu kujiu bamme, 
  Chariu liudi wanglo pui mao lakge.

Translation: "(Tenderly Pleading)"

Category: "Invitation & Baptism"

