ID: "10"

Title: "NAGU MADUI LONSU KHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingwang niu madui pikhaibo. Tuhoi aliu ngao lumine.
  Aliu mathiu tu kam masan khaira. Kabenbo kiu bamme 
  Tamiubo ganiu jupad khaira. Aliu mao kuak khaira leng
  Tingtheng ringbo cham pikhailo.  Aliu lungli lura.

V2: |
  2. Karing bo cham nangniu dinlen khailo. Aliu npui benlura.
  Masanbo chalungsabo hiupuina. Mathiu ga pibenlo.
  Nang niu kungbo gasu Tingwang nah chamai tu ranra kiu-e.
  Oh! aliu lungga bam khailo. Rapiu nang kha khailo

V3: |
  3. Aliu khengra nangniu kati khailo. Nakhuan pichiu khailo. 
  Aliu hiuna mathak khaira haye. Nakhuga ronna-e. 
  Aliu lungga Nangniu kakungbo, thoidam lura pikhailo;
  Nang niu gukhailo naimachang, kati khailo khengra.

V4: |
  4. Aliu lunlung hina ma ngaimi dulo. Nasai sui tadne. 
  Nang damkhaibo kungbo ringting haise, aliutu phud dulo;
  Nang lungsabo tinggen gasu, thoidam maihina leng pilo. 
  Naimachang Naten thiubamra kati khailo. Rapiu.

Translation: "(Renew Thy Church)"

Category: "Grace, Redemption & Love"

