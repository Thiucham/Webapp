ID: "216"

Title: "JESU TU MALUMBO WIDIANG"

Key: "A"

Time signature: "4/4"

V1: |
  1. Jesu tu malumbo widiang, 
  Tingtheng I niu thuan bamne;
  Palad ga ma ngiu jiu bamkhe, 
  Rapiu niu dinbo phungkhe.

CH: |
  (Chorus) 
  Jesu Jesu tu malumme, 
  Tingtheng I niu thuan bamne;
  Jesu Jesu rankhaibopiu, 
  I malum jiu lung bamne.

V2: |
  2. Jesu tu malumbo wimon, 
  Pazai tu malum bui-e;
  Patu I niu malum gapsai, 
  Kasa hinase kuak ne.

V3: |
  3. Jesu tu malumbo widiang, 
  Nuan hina khiu masan khai;
  Jesu tu lukhaibo jengniu, 
  Wahina aleng buide.

V4: |
  4. Patu malum jiu achunwi, 
  Rankhaipiu akamai-e;
  Paniu atu maluang khaine, 
  Tingtheng atu gukhai ne.

Translation: "(It's So Sweet to Trust in Jesus)"

Category: "Christian fellowship"

