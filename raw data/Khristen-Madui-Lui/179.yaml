ID: "179"

Title: "CHAWANG GU TENTHIU"

Key: "E"

Time signature: "4/4"

V1: |
  1. I hai zu simakmai thiubam sangmai dihga,
  Kachia niu ben boga aleng chaky khat bam;
  A wangpiu tenthiu gu dithinpao I thiujiu,
  Siga I tadra kaden bam.

CH: |
  (Chorus)
  Haibo chamse I phung wang-e,
  Mazadung niu thiurabo lui;
  Rapiu a wangpiu niu hai chiujiu din bamme,
  Naliu Tingwang khu wang lulo.

V2: |
  2. Haise chawang gu chamtan ne pabam hina,
  Lungli lulo nuan ga sansabo gasu niu;
  Patu majang mawangne pacham jai maidung,
  Haise I awang ten thiubam.

V3: |
  3. Aky sira sharon rapen suang ben diang-e,
  Siga tingtheng matha ringabo niu phui-e;
  Rapiu niu akhu din siga tingtheng lungne,
  Haise I awang ten thiubam.

Translation: "(The King's Business)"

Category: "Invitation & Baptism"

