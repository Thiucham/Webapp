ID: "304"

Title: "SAONIU RAPIU LAM LIANGRALO?"

Key: "C"

Time signature: "4/4"

V1: |
  1. Saoniu Rapiu lam liangjiu paten thiura? 
  Saoniu patu khajiu maitu puiwang ra? 
  Saoniu kadih tu phut saoniu aphenra? 
  Saoniu Rapiu lam liangjiu paleng tadra?

CH: |
  (Chorus) 
  Saoniu Rapiu lam liangjiu paten thiura? 
  Saoniu patu khajiu maitu puiwang ra?
  Palungsiat kadibo rankhaibo jeng niu, 
  Aliu Rapiu lam liangjiu pagu thiune.

V2: |
  2. Pakendi lengdi mak pirun lengdi mak, 
  Aliu riphen ga ngut riphen lui thiujiu;
  Lungsa jiu aliu leng paniu shaikhai-e, 
  Jesu niu kupad mimai palam liangne.

V3: |
  3. Jesu nang niu rankhai kachianiu liumak, 
  Nazai niu pirun kadibo lengdi luang; 
  Nakhu wangmai hina leng nang thoi khai-e, 
  Nang niu aliutu kung nang niu rankhai-e.

V4: |
  4. Chari tan bamdi mikremai tan bamdi, 
  Chawang riphen tura maidi ngam lakge; 
  Pagu pumtan niu aliu chari ngamne, 
  Pagu majibo seniu chari ngamne.

Translation: "(Who is on the Lord's Side)"

Category: "Christian service & Reward"

