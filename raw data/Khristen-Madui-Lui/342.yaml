ID: "342"

Title: "DEJIU WILO LUNGSABO KHUAN "

Key: "G"

Time signature: "3/4"

V1: |
  1. Tasibo lungsa dejiu wi,
  Akummai tu rankhai;
  Hamibo atu dao lande,
  Miktiatbo ngao lande.

V2: |
  2. Lungsiat niu pingra kati khai,
  Seniu pingbo hah khai;
  Palungsiat hai dejiu dilo!
  I malum gap gasu.

V3: |
  3. Pingbo manangbo ga suniu, 
  I tadton padmide; 
  Lungsiat seniu atu rankhai, 
  Tinggen ga'luang wang khai.

V4: |
  4. Kadih ringting hai loi dasai, 
  Kabenbo ram wangne; 
  Tingwang tu thuan saomak bamne, 
  Tuhoi suang thuan monne.

Translation: "(Amazing Grace How Sweet the Sweet)"

Category: "Assurance & Testimony"

