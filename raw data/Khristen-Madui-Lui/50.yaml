ID: "50"

Title: "PHAIMIU DIBO AKHUGA BAM"

Key: "E"

Time signature: "6/8"

V1: |
  1. Phaimiu dibo akhuga bam,
  Lungsa sibo Jesu-e;
  Chariubo lungchun aman khai, 
  Seniu Jesu lad phunglo.

CH: |
  (Chorus)
  Seraph lui wi kachangbo,
  Lungsa diangbo rachamme;
  Tingtheng ring rabo lui-e,
  Jesu rankhaibo piu.

V2: |
  2. Na nuan hina masan khai-e,
  Seniu Jesu cham phunglo;
  Na chunwi jiu tinggen zuan lo,
  Jesu pirun se lura.

V3: |
  3. Kendi hina Milypoi gu, 
  Jesu tu I malumme;
  Rankhaipiu tu I niu lungsa, 
  Jesu zantu lungsa-e.

V4: |
  4. Pazan niu kapingbo hah khai, 
  Jesu makjiu kaki hah; 
  Jesu zantu chiukhai lujiu, 
  Ahiupuinah matha-e.

Translation: "(The Greatest Physician)"

Category: "Christ life & Love"

