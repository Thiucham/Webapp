ID: "365"

Title: "MAJATJIU TAD BAMME"

Key: "E"

Time signature: "6/2"

V1: |
  1. Singgiu genlam wanglo majad sulo,
  Tingtheng ring raleng bangse biu bamme;
  Eden ga lung raleng majad sulo,
  Chunwibo niu fuibo genlam lungra.

CH: |
  (Chorus)
  Kawibo ram, (2x)
  Lung chariumai hina siga saone;
  {Kawibo ram, (2x)}
  Kendi mi maiky donwi mai ky-e.

V2: |
  2. Taning lam chalui thiura majadlo,
  Pakendi mainiu bambo genlam se;
  King wibo tarah nai chalui khuan chiu,
  Ranpao aliu wang Jesu kendi-e.

V3: |
  3. Chariu lan mak raleng majad sulo,
  Kuilan makbo genlam majad sulo;
  Kawibo puan piu jiu matha bamme,
  Kuilan makbo rapen se pen bamme.

Translation: "(Speeding Away)"

Category: "Aspiration after Heaven"

