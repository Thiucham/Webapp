ID: "437"

Title: "PAWAN TADBO KUM ALIU TAD"

Key: "A"

Time signature: "4/4"

V1: |
  1. Pawan tadbo kum aliu tad,
  Tad bamme nai machang na;
  Haibo dih hai phut khai lujiu,
  Aliu Tinggen lam tadne.

CH: |
  (Chorus)
  Pawan tadbo kum aliu di tadbam,
  Pating pawan sai suijiu tad bamme;
  Widiangbo aliu ky Tinggen lamse,
  Pawan tadbo kum aliudi tad bam.

V2: |
  2. Takum pariak sai sui tadbam,
  Damkhaibo mania hina;
  Magenthiu mathabo daone,
  Kapgui nuigui jiu lungne.

V3: |
  3. Nai machang Rapiu tu thuanlo,
  Majibo ga jukhai ne;
  Aliu 'puiki tad maomak jiu,
  Nuan nai tamiubo 'puiga.

V4: |
  4. Kadih pasao tadbo kumjiu,
  Pachen khat khat tad ton jiu;
  Aliu tabin tadloi misai,
  Hiuna lungbo ram wangne.

Translation: "(Rolling on the Wheels of Time)"

Category: "Special songs"

