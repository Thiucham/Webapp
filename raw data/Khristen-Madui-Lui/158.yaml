ID: "158"

Title: "KARINGBO BANG BIU BAMME"

Key: "F"

Time signature: "4/4"

V1: |
  1. Karingbo bangbiu bamme,
  Duidi nai kadih riga;
  Rankhaibo kawibo racham,
  Aliu leng matha pi-e;
  Tingwang kadih maitu,
  Lungsa jubo don jeng niu;
  Panah khatnatu pikhai-e,
  Patu malummai ringra.

CH: |
  (Chorus)
  Karingbo bangbiu-e,
  Duidi nai kadih riga;
  Karingbo pikhai-e,
  Aliu leng kawi pi-e.

V2: |
  2. Karingbo bangse biu-e,
  Khumkibo ga wang khaira;
  Kubo ga bai khaimi mane,
  Wangdi wang khaimak mane;
  I ringbo taruak-e,
  Mariu charimai tiulo;
  Nuan niu tania bam liudi tu,
  Kabun kumjiu kamine.

V3: |
  3. Karingbo bangniu ku-e, 
  Tingmik machang sen bamme; 
  Kadenlujiu khuan bam mine,
  Rimira tu manang-e;
  Ringraleng pak sulo, 
  Paksulo namen jijiu; 
  Nasai lam mari phui mane, 
  Shaibo bamga ngut lune.

V4: |
  4. Karingbo bang mathajiu, 
  Pabam machang sen ronne;
  Kamaobo hina kuak khaine, 
  Gukhaipiu shaibo donniu; 
  Haijiu mathabo cham, 
  Maihina leng phung kiu-e; 
  Naleng rankhaipiu manade, 
  A Rapiu Khrista chawang.

Translation: "(The Gospel Bells are Ringing)"

Category: "Message"

