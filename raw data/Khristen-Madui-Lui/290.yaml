ID: "290"

Title: "NAGU THOIDAM SE PARIAK CHAKLO "

Key: "E"

Time signature: "2/4"

V1: |
  1. Nakhu kahiambo wangjiu chunsabo ga,
  Na lungchun se khinjiu kahiambo daosai;
  Nang niu daolubo thoidam se chak lulo,
  Rapiu niu ten khaibo hai nasuang hane.

CH: |
  (Chorus)
  Nang daolubo thoidam se chaklo,
  Tingwang niu ten khaibo se chaklo;
  Nang daolubo thoidam se chaklo,
  Rapiu niu ten khaibo hai nasuang hane.

V2: |
  2. Nang wadao ga chariuju mibo bamma?
  Singchai phung rabo hai naleng kung juma?
  Nang niu daolubo thoidam pariak chaklo,
  Nai machang chalui thiujiu patu thuanlo.

V3: |
  3. Maigu kachia rangkang situ ngen tulo, 
  Khrista niu pibo chakhiu chalan sira; 
  Kadih gu kachia rangkang niu liu ngamlak, 
  Naphijeng sira Tinggen lungra leng-e.

V4: |
  4. Chariu magen thiubo hai kengjiu bamdi, 
  Nachun sami tulo Tingwang niu se-e; 
  Nang niu daolubo thoidam pariak chaklo, 
  Kha khaijiu juringbo hai naleng pine.

Translation: "(Count Your Blessing)"

Category: "Christian service & Reward"

