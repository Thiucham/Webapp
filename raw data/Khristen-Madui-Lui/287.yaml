ID: "287"

Title: "LUNGMAGEN THIU BAMMAI WANGLO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Lung magenthiu bammai Jesu khu wanglo,
  Lungsiat bamga wangjiu khudung kiulo;
  Nagu chunsa jengsabo hina paolo,
  Tinggen seniu ngam lakbo wadi ha.

V2: |
  2. Chunsa jengsabo hina ri nga lulo,
  Lungliwang mai hina tu lakhai ne;
  Gukhaipiu seniu manuan jiu kubamme,
  Tinggen seniu ngam lakbo wadi ha.

V3: |
  3. Ringbo taruak nai tadui se haiga bam,
  Tingwang suang ga luang bambo singgiu ga;
  Lungsabo maluat tiura wangmai hina,
  Tinggen seniu ngam lakbo wadi ha.

Translation: "(Come Ye Disconsolate)"

Category: "Comfort in sorrow"

