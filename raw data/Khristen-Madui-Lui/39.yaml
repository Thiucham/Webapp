ID: "39"

Title: "AZENG GANIU CLAVARY LAM ZUANTAD"

Key: "G"

Time signature: "4/4"

V1: |
  1. Alung hai dejiu ga magenthiu gulo!
  A Rapiu niu chariubo kheng khai;
  Palungsiat niu atu rankhai jiu bamme,
  Achengsa hina khiu masan khai.

CH: |
  (Chorus)
  Ajeng ganiu Calvary lam zuan tadle,
  {Ajeng ganiu; (2x)}
  Ajeng ganiu Calvary lam zuan tadle,
  Ajeng ganiu shai-e.

V2: |
  2. Nuan phungmai niu a Rapiu tu wang kahum,
  Pah lungsiat niu a nuan masan khai;
  Achengsa masan raleng kheng khai mide,
  Chiujiu lungsabo khuan niu shen ne.

V3: |
  3. A Rapiu lungsa khaibo dejiu dilo!
  Chawang bamdi bo saodiak lujiu;
  I ring rabo leng Calvary ga shaikhai,
  Pazan masanbo tu thuan bamlo.

Translation: "(All the Way to Calvary)"

Category: "Christ life & Love"

