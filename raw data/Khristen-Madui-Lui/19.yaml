ID: "19"

Title: "DAA DAVID CHAWANG NAMGA "

Key: "G"

Time signature: "4/4"

V1: |
  1. Nda David chawang namga,
  Matomki hiuga chap bam,
  Ngena situ papui niu, 
  khao ring kuangga maji khai bam;
  Ngena se Jesu khrista, ngena pui se Mary-e.

V2: |
  2. Tinggen lamsu pah wang kiu-e, 
  Mathiu nagu Rapiu-e,
  Matomki se pah bekhai bo ki,
  Khao ring kuangga ji khai;
  Magenthiu jiu lungwang-e,
  Chamianah tu rankhaipiu.

V3: |
  3. Pa nah ting gasu suang habo,
  Kadinpiu jiu chakhuang thiu,
  Lungsa jiu phuikhang papui zu,
  Papui pam ga ji bamme;
  Nahmai hina pakum jiu,
  Manuan maji jiu lung lo.

V4: |
  4. Pahdi aliu kumjiu lungwang, 
  Tingmik machang mawikhang 
  Pumtan hah jengtan hah, suanne kap, nuibo, macham kamme, 
  Aliu chariu tudi si, 
  Aliu chunwi tudi si.

V5: |
  5. Aliu niu Patu ngao sune, 
  Pagu lungsabo jengniu,
  Lungsabo ngena Jesu se, 
  Tinggen gu Rapiu si-e; 
  Pamai dungtu jukhaine, 
  Pawangbam ga lung raleng.

V6: |
  6. Matomki gasu niu lakge, 
  Khaoring kuang ganiu lakge, 
  Tinggen lamsu patu ngaone, 
  Tingwang benjat lam bamme;
  Chagan pirunsi runjiu,
  Patu wang kahum bamne.

Translation: "(Once in Royal David's City)"

Category: "Christmas"

