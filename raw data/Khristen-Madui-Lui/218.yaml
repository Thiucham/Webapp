ID: "218"

Title: "AGU ALIAMSAO MATIP BAM"

Key: "D"

Time signature: "4/4"

V1: |
  1. Tasan sabo gu daojiu, 
  Duidi malai wang liudi;
  Alung chariu mak bamne,
  Tingthung niu tan wang liudi;
  Aliam saobo bam bamme,
  Tingtheng jeng halan lakge.

CH: |
  (Chorus)
  Aliam sao matib bamme,
  Tingthung niu hunwang liudi;
  Saokhai bo bam siam liudi,
  I tang makbo thiu lakge;
  Matib-e aliam sao bo bam hai.

V2: |
  2. Akhuga duidi kasuak,
  Sansabo wang bam liudi;
  Ariga kamuang tamiu,
  Tingthung se tan khang bamme;
  Tingthung ga I chap bamme,
  Aliam tai matib bamme.

V3: |
  3. Magen kathiubo bam ga,
  Chariubo niu gom liamdi;
  Sabo niu jumao ra phiu,
  Tingthung niu tamiu bamdi;
  I niu adao ping lakge,
  Aliam tai matib bamme.

Translation: "(My Anchor Holds)"

Category: "Driving guidance & Protection"

