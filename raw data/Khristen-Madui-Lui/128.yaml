ID: "128"

Title: "RANKHAIBOPIU NAZAN ALIU THUANNE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Rankhaipiu nazan tu aliu thuanne,
  Aliu thuan jiu ramnabonlui thiu-e;
  Aliu ramna ra chapjiu natu thuan,
  Tuhoi nagu thoidam tu khuan bamme.

V2: |
  2. Nagu agimanaibo pikhailo,
  Nang niu 'lui 'puiki ramraidi dinlo;
  Aliu kamao kam lan makra gukhailo,
  Haibo kyga aliu nazan ku-e.

V3: |
  3. Tachun agimanaibo pikhailo,
  Tamiubo gasu piben khailanlo;
  Kashai thiuniubo gasu gukhailo, 
  Tamiu kaben ga bamdi phui khailo.

V4: |
  4. 'Liutu nagu manaibo pikhailo, 
  Chariubo wikhaibo piuse nang-e; 
  Nakhuan seniu chariubo mathak khai, 
  Tingtheng manaibo gase ku khailo.

Translation: "(Saviour Again to Thy Dear Name!)"

Category: "Evening closing"

