ID: "90"

Title: "GUKHAIBOPIU WANG-E"

Key: "C"

Time signature: "3/4"

V1: |
  1. Dinronlo wibo cham, 
  Kadao maiga dinlo;
  Chunsa jiu bam maidung, 
  Chun kam nga jiu bamlo;
  Khristen mai hina niu,
  Mathajiu sen bamlo;
  Gukhaibopiu wang-e.

CH: |
  (Chorus)
  Gukhaibopiu wang-e, (2x)
  Tingwang niu dinkhaibo,
  Masanbo hiupuina;
  Dinronlo wibo cham,
  Kadao maiga dinlo;
  Gukhaibopiu wang-e.

V2: |
  2. Tamiubo tad kende,
  Kabenbo pad lande;
  Chunsa jiu lungpubo,
  Hina kamma ha khai;
  Kachia ramluang riga,
  Naimik pad lan sude;
  Gukhaibopiu wang-e.

V3: |
  3. Chawang hina chawang,
  Wikhaibo pumtan niu;
  Vang bambo hiuna tu,
  Juringbo pikhai-e;
  Pabam machang naga,
  Ngambo lui thiu sune;
  Gukhaibopiu wang-e.

V4: |
  4. Nangniu chalungsabo, 
  I dinkam silakge; 
  Tingkadih pakhiangna, 
  Ngaochia jiu thuan bamme; 
  Charuidih ga bambo, 
  Hina niu thuan bamme; 
  Gukhaibopiu wang-e.

V5: |
  5. Tinggen mai lui khuanse, 
  kadihga chiu chiade; 
  Kamasan maidung nai, 
  Aliu thiucham bamne; 
  Pamalan thiu makbo,
  Luise tingtheng thiune; 
  Gukhaibopiu wang-e.

Translation: "(The Comforter has Come)"

Category: "Holy spirit"

