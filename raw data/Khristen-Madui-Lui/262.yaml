ID: "262"

Title: "JESU ALUNGGA WANG GANIU"

Key: "A"

Time signature: "4/4"

V1: |
  1. Agu ringting se tamsin jiu kali mide,
  Jesu alung ga wang ganiu;
  Hai theng I niu phiu bambo hiupuina ngaode,
  Jesu alung ga wang ganiu.

CH: |
  (Chorus)
  Jesu alung ga wang ganiu; (2x) 
  Chunwi ringabo se singgiu kumjiu luang bam,
  Jesu alungga wang ganiu.

V2: |
  2. Atu jumaojiu bambo hina hamide,
  Jesu alungga wang ganiu;
  Amao ameng hinase khiu masan mide,
  Jesu alungga wang ganiu.

V3: |
  3. Maolan lakbo malumse akhu bam mide,
  Jesu alungga wang ganiu;
  Tuhoi ra tamiubo lungchun se hamide,
  Jesu alungga wang ganiu.

V4: |
  4. Kashaibo genlamse kabenbo bammide, 
  Jesu alung ga wang ganiu; 
  Namdigu rengmun lekhai bose ngao lude, 
  Jesu alung ga wang ganiu.

V5: |
  5. I niu sibo namdi gase lungra tadne, 
  Jesu alung ga wang ganiu; 
  Siga tadra dejiu achunwi mathalo, 
  Jesu alung ga wang ganiu.

Translation: "(Since Jesus Came Into My Heart)"

Category: "Love, Joy & Peace"

