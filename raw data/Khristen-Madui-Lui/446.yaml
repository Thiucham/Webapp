ID: "446"

Title: "KARINGBO KALEN"

Key: "⚪"

Time signature: "⚪"

V1: |
  1. I ring leng shaikhaibo Khrista,
  Tingwang natu kungne;
  Aphi jeng niu len jiu I niu,
  Kalen paleng phungwang.

CH: |
  (Chorus)
  Akalen siam liudi Rapiu,
  Lukhailo I sing-e;
  Aphen Khrista lunglin milo,
  Alungga tingtheng jeng.

V2: |
  2. Buibo kalen pipad ra hah,
  A Rapiu leng pira;
  'Dih mania niura bui lulak,
  Rapiu leng kad khaira.

V3: |
  3. Wa kalen kad pad bam tadi,
  Apao rui kam lulak;
  Apum amania hai phungwang,
  Maring kalen thiujiu.

V4: |
  4. Amania hina pipad de,
  Rapiu naten tenra;
  Kawicham hai phung ben tadne,
  Mainiu Khrista ngaora.

Translation: "(A Living Sacrifice)"

Category: "Special songs"

