ID: "65"

Title: "PHUILO NANG RINGRA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Phiulo nang ringra singchai ga shai piutu, 
  Nahiupiunah ring rabo leng-e;
  Phuilo tacheng samai masan raleng-e, 
  Azeng ganiu singchai ga shaikhai.

CH: |
  (Chorus) 
  Phuilo nang ringra, 
  Cross ga shaibo piuse nang ring rabo leng-e;
  Tingtheng ringra leng-e wang phuilo.

V2: |
  2. Dejeng niu pah singchai riga shaikhai gulo? 
  Jesu na nuan kuak khai maksai;
  Dedon niu nuan kuak khai rabo zai luang ra? 
  Pahzai makjiu na nuan kuak lakge.

V3: |
  3. Nalung libo seniu mikdui kiura ha-e, 
  Hiuna ringra luang bo zai niu;
  Tacheng sabo hina se masan khaide, 
  Rapiu niu lungsa khaibo jeng niu.

V4: |
  4. Natu lukhai rabo donniu manang tulo, 
  Paniu wahina loi khaimide; 
  Kadihri ting loibo nai Pah wang lanne, 
  Siga Pa ngam hina loi khaine.

V5: |
  5. Jesu Khrista gasu chunwi bose daone, 
  Tingtheng ringbose pikhai bine; 
  Siga wadaodi shai thiu niubo thiulak, 
  Jesu tingtheng ring bambo jengniu.

Translation: "(There is a Life for a look)"

Category: "Humiliation, Resurrection & Glory"

