ID: "435"

Title: "APUI KHUGA PAOTANG KHAILO"

Key: "A"

Time signature: "4/4"

V1: |
  1. I nadao gu rili tu maning taojiu alung mak,
  Apui niu kungbo simak jiu I palung kam chariu;
  Tuhoira atu phut lujiu Rapiu khu tad mide,
  Rapiu yo I wangne chiu paokhailo.

CH: |
  (Chorus)
  Apui khu wangne chiujiu paotang khaibilo,
  Tacham hai paokhai khelo Rapiu yo;
  Tingtheng mathabo ga patu wang zudao ne,
  Siga niu natu daone apui yo.

V2: |
  2. I kajit jiu tad midi para manang jiu khuan bam,
  Paniu atu lungsajiu manang khaibo maisuang ha;
  Achunsa jiu kap bamdi pachun wijiu phung khai-e,
  Rapiu yo I wangne chiu paokhailo.

V3: |
  3. I kajit jiu ronmeng midi para liangri jiu bam, 
  Adon jengniu palung chariu jiu kap ahikjiu bam; 
  Nchun nnien saomakjiu Tingwang ga pah kheng bamme, 
  Rapiu yo apui khu wangne dinlo.

V4: |
  4. Apui shai suraga naikhat akhu chamlen wang-e, 
  Paokhai nisai wanglo chiujiu apui atu ku-e; 
  Abam lengdi kaden bamniulo chiujiu kanui khai, 
  Rapiu yo I wangne chiu paokhailo.

Translation: "(Tell Mother I Will be There)"

Category: "Special songs"

