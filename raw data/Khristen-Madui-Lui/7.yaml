ID: "7"

Title: "TINGTHENG RINGBAMBO TINGWANG "

Key: "G"

Time signature: "2/4"

V1: |
  1. Tingtheng ringbambo Tingwang tu I phiu-e,
  Kadih dam kamak gasu niu bambo-e;
  Nathen nadet dinsi lura sao bamlo?
  Nalung chun lad sikam raleng sao bamlo?

V2: |
  2. Takum sang khat se nalengra naikhat jiu,
  Tingtheng jiu ringbambo Tingwang-e nangra;
  I karingting ra ji bambo mang kumme.
  Tingmik machangna kuimaha kamra-e.

V3: |
  3. Tingkai hunsu sai chapiu niu tang kumjiu
  Nalung pomsu sai chamainah shai kamne;
  Tingwang napen gasu aliura ring-e.
  Nalung maksai aliu ra ringsi lakge.

V4: |
  4. Nalung pomsu sai aliu ringlu lakge, 
  Natu pingjiu I delam baikhai ralo? 
  Lemsijiu duidi genlam lemron bamdi.
  Sigadi nangra ngao makbo leng ha-e.

V5: |
  5. Kata hina nang si kamakbo haye. 
  I baikuak lurabo leng hah nasuangga; 
  Nadet dise dinsi lura sao bamlo? 
  Nalungchun sikam lurabo sao bamlo?

Translation: "(God Eternal)"

Category: "Grace, Redemption & Love"

