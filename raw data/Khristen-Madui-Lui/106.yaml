ID: "106"

Title: "THUANBO LUI"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu niu lungsa khaibo,
  Maihina dinronlo;
  Chalungsabo tense loide,
  Suang habo rise ngamlude;
  Pazantu thuan bamlo.

CH: |
  (Chorus)
  Hiuna leng aliu kheng-e,
  Pakendi jiu wang-e;
  Tingriu leng kheng khai bijiu,
  Tingriu pikiu khai-e.

V2: |
  2. A Rapiu tu thuan jiu bamlo,
  Pabam machang thuanlo;
  Rankhaibo cham dinron tadlo,
  Hosanna shenjiu thiu bamlo;
  Rapiu athoi chiukhai.

V3: |
  3. Jesu zan dibo thuan bamlo,
  Pazai luang khaibo se;
  Wadao di kalilan lakge,
  Nuan phungmai malan wang lulo;
  Jesu niu kuak khai ne.

V4: |
  4. Zat hina lungchun nai chakhuan,
  Khat thiujiu aronglo;
  Tingwang niu gukhaibo thuanlo,
  Papiu panah 'sanbo hiuna;
  Zan kujiu thuan bamlo.

Translation: "(A Song of Praise)"

Category: "Praise & Opening"

