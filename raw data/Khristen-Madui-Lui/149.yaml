ID: "149"

Title: "I NALENG KHENG BAMME "

Key: "G"

Time signature: "4/4"

V1: |
  1. Rankhaipiu niu Tinggen lam kheng jiu bamme,
  Kadihri ga paka keng mak bam liudi;
  Tuhoira pah khuan bamme natu rankhai ra,
  Atu rankhaibopiu niu nagu thiulo.

CH: |
  (Chorus)
  I naleng kheng bamme,
  Naleng I kheng bamme;
  I naleng kheng bamme,
  A Rapiu khuga.

V2: |
  2. Tinggen lam bambo apiu niu pikhai-e,
  Sanwibo majibo tingtheng ringbose;
  Paniu kubamme Tinggen lam patu daora,
  Nang di atu maluang tadra kubamme.

V3: |
  3. Masanbo phaise aleng kaden khaibam,
  Maisuang habo kendibo guse ngao ne;
  He! I niu sibo ponse aleng daobo ga,
  Singnah yo nang di sise dao lu suma?

V4: |
  4. Agimanaibo se singgiu kum luangbam, 
  Sise kadihmai nahniu sitang makge; 
  Rankhaipiu Jesu ga ronna sise bamme, 
  Haise nalengdi pikhaira ngao suma?

V5: |
  5. Natu ranlubo chamse maikhu dinlo, 
  Sai agu Ranpao se nagu Ranpao-e;
  Paliu tudi paniu rankhai binne chiu-e, 
  Narathoise chiu khaijiu thoi khaibine.

Translation: "(I am Praying for You)"

Category: "Prayer meeting & Revival"

