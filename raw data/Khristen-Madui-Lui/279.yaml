ID: "279"

Title: "CHARI THIU BAMME"

Key: "C"

Time signature: "4/4"

V1: |
  1. Chari wangsai make khuanse shen wang sune,
  Pabam hina ga kujiu shen bamme;
  Chari ngambo Rapiu seniu ronjiu bamme,
  Khrista niu charise ngam wang sune.

CH: |
  (Chorus)
  Khristen mai ch'ri thiura wanglo,
  Hujiu chaplo masai khin makjiu;
  Chaheng chagiu se kathon khang sulo,
  Kawi kasa sira thainai.
  Chari se tandi ping tulo,
  Tingwang zan ga hujiu chaplo;
  Pengphai kazitlo khristen riphenmai,
  Aliu kangambo lui thiune.

V2: |
  2. Chari wangsai khristen maidung hujiu bamlo,
  Jehovah niu jujiu aliu ngamne;
  Tad lujiu Tingwang gu hengrise pon sulo,
  Kaloibo tangjiu paniu jukhai ne.

V3: |
  3. Chari se ngamra Rapiu niu jukhai bamne,
  Ladriat khaibo heng ngiu se khai bamde;
  Pabam hina ga pazan tu chakhuang thiune,
  Agimanai jiu patu thuan bamlo.

Translation: "(The Fight is On)"

Category: "Conflict & Victory"

