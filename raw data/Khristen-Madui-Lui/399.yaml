ID: "399"

Title: "TINGGEN KABENBO"

Key: "C"

Time signature: "9/8"

V1: |
  1. Kaben ga tadjiu Tinggen ky zuanlo,
  Ramlong tonjiu singgiu liap wangdi;
  Jesu niu nang 'puiki dinjiu bamne,
  Masanbo chamse hami lakge.

CH: |
  (Chorus)
  Tinggen kabenbo, (2x)
  Masanbo pakendi jiu bam sune;
  Halleluyah! mathabo lui thiu,
  Thuanbo lui thiune Jesu agu.

V2: |
  2. Kasabo niu atu gom jiu bamdi,
  Rankhaipiu suangga bailu lakge;
  Pabiu wijiu tamiuga san khaine,
  Tinggen kytu zuanjiu wang kinne.

V3: |
  3. Kaben ga tadsai chunwi jiu lungne,
  Tingwang kyga chabam keng bamme;
  Chalui thiu matha jiu tadpad sukhe,
  Kabenbo 'puitu zuan jiu tadkhe.

Translation: "(Heavenly Sunlight)"

Category: "Aspiration after Heaven"

