ID: "127"

Title: "JESU GU KANAMBO MALUAD"

Key: "C"

Time signature: "⚪"

V1: |
  1. Rapiu niu pahommai nai,
  Jerusalem ky kuthubo lungga;
  Palung chariu mikdui luang,
  Kanui jiu maluad tiu aruang-e.

CH: |
  (Chorus)
  Haise ami sede, haise azai sede,
  Tiulujiu chunwi jiu sak chamlo,
  Apiu ram wangtang makthen;
  Wadao di tiusak lanlak mide.

V2: |
  2. Mily gaopiu kao mide,
  Mily dung pak maren kam mirade;
  Pasai sui bam maidung se,
  Lungpu bo niu chariu pasao ha.

V3: |
  3. Patiu aruang maidung di,
  Pathiupari kammi Rapiu riga;
  He! a Rapiu riga se,
  Ladzan majijiu thiukhai makge.

Translation: "(The Last Supper of Jesus)"

Category: "Lord supper"

