ID: "134"

Title: "DANAI THAINAI TINGTHENG DI"

Key: "B"

Time signature: "6/6"

V1: |
  1. Jesu niu aliutu kungbo hai dejiu dilo!
  Danai thainai tingtheng di Jesu ra limakge;
  Nuan phungmai tu rankhai thiuniu maitudi wikhai,
  Tingthung saokhai jiu maitu kimkhai kendi bamlo.

CH: |
  (Chorus)
  Danai thainai tingtheng di Jesu ra limakge,
  Wahina libamdi Jesu ra lilan lakge;
  {Jesu tu thuanlo, (2x)}
  Wahina libamdi Jesu ra lilan lakge.

V2: |
  2. Para nuan phungmai kaa tuhoidi natu kubam,
  Lungliwang maitu kuakkhai bine chiu sen bamme;
  Na nuanse kuakkhai mide nuan tenlan talo chiu,
  Nalung manuan jiu khenglo na nuanse kuak khaine.

V3: |
  3. Pahniu Peter tu kubo kum natudi kubam, 
  Thomas kumjiu malum masa maitu ku bamme; 
  Patu lungsamai seniu pakhuga mangiu bam, 
  Pakhuan manuan jiu kubam tuhoidi wang khaira.

V4: |
  4. Kasuakbo duiliu riga pah rontad bam gase, 
  Galilee duiliu situ paniu rukhaibi-e; 
  Gethsamane rengga pah kapjiu kheng khai mide, 
  Chunsa jengsabo piangse paniu sakkhai mide.

V5: |
  5. Emmaus puiga baijiu tad bamga pah niu jukhai, 
  Aliu ringting haidi paniu jukhaijiu bamme; 
  Aliu patu zu ngao jisune thuan bam raleng, 
  Paniu lungkhai mibo kum aliuniu dao sune.

Translation: "(Yesterday, Today, Forever)"

Category: "Prayer meeting & Revival"

