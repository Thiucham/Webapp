ID: "401"

Title: "CHAKY LAM WANGBO GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kadihri ringting dunbo hai loiwang susai,
  Tamiubo duidih kenpat mine;
  Amanbo Tinggen ga lung chariubo ha-e,
  Siga ahiuna mathak mine.

CH: |
  (Chorus)
  Nangdi tu zuan tadne,
  Masanmai lungbo ga;
  Tingkum pariak silak,
  Tinggen ky wiga wang bonai.

V2: |
  2. Hiuna kyga chunwibo dinkam silakge,
  Lungsa kakungbo hun ri rijiu;
  Lilakge karingbo duipin sibo ramga,
  Lungpubo lungchun siga ha-e.

V3: |
  3. Dejiu aman ralo duidih gen kenpad sai,
  Benbo Tinggen ga wi tathui jiu;
  Kulam kingwi lui thiu mine namdi siga,
  Tinggen mazadung nai lung mine.

Translation: "(When I Walk up the Street of Home)"

Category: "Aspiration after Heaven"

