ID: "296"

Title: "MARUKLO HIUPUINA "

Key: "A"

Time signature: "4/4"

V1: |
  1. Maruklo hiupuina Tingmik machang na,
  Lungsa khaibo lin linglo 'pui machang ga;
  Maruklo hiupuina Rapiu tu malum,
  Aliu phijeng kawi thoidam pikhai ne.

CH: |
  (Chorus)
  Wibo ting maruklo,
  Naimik kiu makga;
  Chariu manang mane,
  Taten loi makthen.

V2: |
  2. Maruklo hiupuina aliu tadbo kum,
  Aliu niu ling khaibo dikhang jisune;
  Malumjiu maruklo Tingwang niu pine,
  Aliu niu ngao sune kachia lujamse.

V3: |
  3. Maruklo hiupuina aliu suan bamdi, 
  Aliu kasuan jeng niu mikdui luang bamdi;
  Jidi ridi linglo taten loi makthen,
  Ated loisai tingtheng chunwi bam mine.

Translation: "(Sowing to the Spirit)"

Category: "Christian service & Reward"

