ID: "48"

Title: "KATINGMAI RACHAMSI AKHU DINKHAILO "

Key: "C"

Time signature: "4/4"

V1: |
  1. Nda racham din khailo, 
  Ngao makbo kulam cham,
  Jesu nai kendi cham se, 
  Pagu lungsiat cham se;
  Chiubo jaiga dinkhailo, 
  Nahmai khat khuga kumjiu,
  I suanmai lakmai-e, 
  Khakhai ra hamai-e.

CH: |
  (Chorus)
  Nda rachamse akhu, 
  Koina dinkhailo akhu;
  Jesu nai palungsiat chamse 
  Akhuga dinkhailo.

V2: |
  2. Koina akhu dinkhailo, 
  I niu lukhai raleng,
  Tingwang niu nuan kuak raleng, 
  Pikhaibo lungsiat se;
  Nsuan gu kajik duiniu, 
  Nnian sanglan mibo kumjiu,
  Dinlo dinkatup jiu, 
  I ra mangai tanne.

V3: |
  3. Dinlo manuanbo khuan niu, 
  Lungchun masanbo khuanniu,
  Jesu gukhaira kiubo, 
  Nuan phungmai se I -e;
  I chariubo wan machang, 
  Alung aman khai raleng,
  Saomakjiu sibo cham, 
  Akhuga dinkhailo.

V4: |
  4. Dinkhailo sibo racham, 
  I niu pingbo wan gadi, 
  Kadih gu racham sira, 
  Sikum kakungbo ha; 
  Kadihgu kendibo niu, 
  Atu kam mahah bamme, 
  Jesu wikhaibo cham, 
  Akhuga dinkhailo.

Translation: "(Tell Me the Old Old Story)"

Category: "Christ life & Love"

