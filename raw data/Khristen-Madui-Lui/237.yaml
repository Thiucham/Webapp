ID: "237"

Title: "JESU RACHAM SISAN NI-E"

Key: "A"

Time signature: "6/8"

V1: |
  1. Jesu racham sisan ni-e,
  Palungsiat se madu khai ne;
  Rankalubo se ngao sune,
  Chalungsa jiu aleng shaikhai.

CH: |
  (Chorus)
  Sanne Jesu racham, (2x)
  Rankalubo se ngao sune,
  Chalungsa jiu aleng shaikhai.

V2: |
  2. Jesu racham I katine,
  Pagu masanbo I lune;
  Pakhuan kinglo pabam machang,
  Malumjiu palad din ronne.

V3: |
  3. Jesu racham palad gasu, 
  A Rapiu niu majang khaine;
  Pakhuan kinglo pabam machang, 
  Malumjiu palad din ronne.

V4: |
  4. Jesu racham chawang bam ga, 
  Lungwibo hina pagu-e;
  Pawang bamse didiang sune, 
  Manaibo wang kiurabo cham.

Translation: "(More About Jesus)"

Category: "Desire after holiness"

