ID: "387"

Title: "KARIAK TINGKAI WIBO RAMGA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Singgiu genlam mazadung niu,
  Chalui thiubo khuan chiu-e,
  Chawang situ thuan jiu halleluyah! hosanna senbam;
  Paniu jukhaibo jeng ganiu aliu suang lam zuan tadkhe,
  Nuan nai chariubo dih gasu Tinggen lam zuan tad sukhe.

CH: |
  (Chorus)
  He! sibo ram wangtang sai,
  Kachia pirun I run ne;
  Sibo ram kawibo ga,
  Kariak tingkai wibo ramga.

V2: |
  2. Singgiu genlam se khangsia mai,
  Nai machang tadsao makge,
  Sibo ramga aliudi tadra nai machang nawang-e;
  Aliu Jesu khu wangsai thuanjiu chalui thiu aruangne,
  Sibo ramga wangtang sai tingtheng patu thuanjiu bamne.

V3: |
  3. Sibo ramga maihina leng,
  Chabam kaden khai bamme,
  Rankhaibopiu tu malum maidung niu kubo khuan chiune;
  Rapiu niu chamtan pikhai sai tingtheng patu thuan bamne,
  Siga kadih tu saodiak jiu wibo ramga lung mine.

Translation: "(The Summer Land)"

Category: "Aspiration after Heaven"

