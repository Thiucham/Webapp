ID: "152"

Title: "DIBO REVIVAL LANG KHAILO "

Key: "F"

Time signature: "4/4"

V1: |
  1. Tingwang aliu khu wang khailo,
  Karaidao kumjiu;
  Kadihri maina lungli ra,
  Kheng jiu khuan bamme.

CH: |
  (Chorus)
  Tingwang revival lang khailo,
  {Revival lang khailo, (2x)}
  Tingwang revival lang khailo,
  Akhu gasu len khailo.

V2: |
  2. Majangsa ngaorao lungchun dung,
  Hathon kam milo;
  Napumtan siuse pikhailo,
  Zengsa mai riga.

V3: |
  3. Kasa hina hathon khailo, 
  Aliu nuan kuakra; 
  Lungchang phung malumjiu bamra, 
  Pikhailo thainai.

V4: |
  4. Kadih hiambo nai chariubo,
  Ngamra kha khailo; 
  Miusy minjiu gewang susai, 
  Khai madui lura.

Translation: "(Send a Great Revival)"

Category: "Prayer meeting & Revival"

