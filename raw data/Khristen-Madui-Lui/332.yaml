ID: "332"

Title: "I JESU TU CHAKA THIULU"

Key: "A"

Time signature: "3/4"

V1: |
  1. I Jesu tu chaka thiulu,
  Pah atu kungbo donniu;
  Palungsiat niu atu kubo,
  Seniu I pasai suine;
  Pah atu phut lan bi lakge,
  Paniu atu gukhai ne;
  I di pagu padi agu,
  Tingtheng jiu lung bam mine.

V2: |
  2. I Jesu tu chaka thiulu,
  Paniu atu rankhai-e;
  Juringbo kalen ronna mak,
  Papum siak aleng pikhai;
  A gukara bo wadi ha,
  Pakhiang na se pagu-e;
  Agu bambo hina pagu,
  Tingtheng jiu pagu thiulo.

V3: |
  3. I Jesu tu chaka thiulu, 
  Pumtan hina pagu-e; 
  Agu tabin tad loi makthen, 
  Tinggen tangbo jukhaine;
  Tuhoi azeng hahjiu bamdi, 
  Kabenbo ram wangtang sai; 
  Wahina leng kaden lujiu, 
  Tingtheng mathak bam mine.

V4: |
  4. I Jesu tu chaka thiulu, 
  Pah kumbo mai khatdi ha; 
  Pasuang kase kangao mai hah, 
  Pasuang katan maidi hah; 
  Pagu lungsiat ganiu maidi, 
  Atu sut tadmi lakge; 
  I ring bamdi shaidi pagu, 
  Tingthengjiu pagu thiune.

Translation: "(I Have Found a Friend)"

Category: "Assurance & Testimony"

