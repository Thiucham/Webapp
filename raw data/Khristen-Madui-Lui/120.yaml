ID: "120"

Title: "HAISE KACHANGBO MA?"

Key: "G"

Time signature: "6/4"

V1: |
  1. Atu Rankhaipiu racham,
  Chiurai thubo tingga;
  Atu ranpao rachamse,
  Haise kachangbo ma?
  Alungchun niu paokhaini,
  I niu sibam liusai;
  Cross ga kheng khaibo racham,
  Masan jiu silude.

CH: |
  (Chorus)
  Dinkhai ni-e pah racham,
  I niu dinkhai ni-e;
  Ladkeng seniu paokak lo,
  Haise kachangbo-e.

V2: |
  2. I chiulubo rachamse,
  Akhu dinkhai lanlo;
  Jesu pakendi bamme,
  Maidung nai tad chambam;
  Chunwibo niu phuilu jiu,
  Naimik biu thao chia bam;
  Alungchun niu sini bam,
  Majibo rachamse.

V3: |
  3. Chakhuan manuanbo niu din,
  Akhu wangjiu paolo;
  Chunsa jengsa bam maidung, 
  I niu wikhai bine; 
  Aronna achunsa jiu, 
  Pakhu mana wang-e;
  'Rapiu nachunbo thiulo', 
  Haise kachangbo-e.

V4: |
  4. Manuanbo khuanniu din-e, 
  Siga achun kimme;
  Alungchun hina saokhai, 
  Rapiu I silude;
  Nda rachamse dinkhai, 
  Rankhaipiu niu kubam;
  Nangniu aleng kaden khai, 
  Haise kachangbo-e.

Translation: "(Is it True?)"

Category: "Bible"

