ID: "84"

Title: "TINGWANG KADIH KIURA"

Key: "B"

Time signature: "4/4"

V1: |
  1. Tingwang kadih kiu ra khuanbam bose,
  Tinggen lam bamme;
  Takum machang kamasan mai keng padle,
  Tingmik machang sibo ram ga;
  Wangtang ra namid midle,
  Tingwang kadih kiu raleng pating nade.

CH: |
  (Chorus)
  He! Tingwang kadih kiu raleng nawang nge,
  Tingwang kadih kiu raleng pating nade;
  Kaden jiu mathing bamlo 
  Make niu kukiu sune Rapiu niu
  Pakendi jiu kiu sune.

V2: |
  2. Tingwang kadih kiu rabo tuse,
  Ramgun jiu khuan bam khe;
  A Rapiu kiu rabo tuse phui bam khe,
  Kadih ga nuan phung jiu bam mai;
  Tuse khipad khai sune,
  Tingwang kadih kiu raleng pating nade.

V3: |
  3. Tingwang kadih kiu rabo nai se,
  A Rapiu lun ngao sune;
  Chawang gu chawang se mao makjiu wang ne,
  Halleluyah pazai niu;
  Kadihpiri tu rankhai-e,
  Tingwang kadih kiu raleng pating nade.

V4: |
  4. Tingwang kadih kiurabo tuse, 
  Ramgunjiu khuan bamme;
  Pingjiu chamai hina magen thiu bamme,
  Tingwang kadih wibo cham;
  Dinjiu maitu kam marak khe,
  Tingwang kadih kiura leng pating nade.

Translation: "(The Coming of the Kingdom)"

Category: "Second coming"

