ID: "192"

Title: "SINGBENG GA RAOKHAI-E"

Key: "F"

Time signature: "4/4"

V1: |
  1. Belshazzar niu chawang mai sang khattu khumkibo nai,
  Chawang ky ganiu kachiapiang ponpad jaw sak chunwi bam;
  Siga kapingbo niu phuibo ariakse raokhai-e,
  Majibo chamse Tingwang niu singbeng gase raokhai-e.

CH: |
  (Chorus)
  Tingwang benniu raokhaibo-e, (2x)
  Nang ngam lakde chiujiu raokhai,
  Chawangdih hina hade;
  Singbeng ga Tingwang benniu raokhai.

V2: |
  2. Phuilo Daniel niu chawang dibo suangga chap lujiu,
  Chawang niu kamaobo hina ping makjiu dinkhai bide;
  Singbeng ga raokhaibo ariakse paramba dinjiu,
  Chawang kadih hinase hade chiujiu dinkhai bide.

V3: |
  3. Phuilo malumbo majibo hubo Daniel khuga, 
  Tingwang Hiupuina seniu mahimbo lad dinkhai bide; 
  Paniu Judea ga bamdi kavang kyga bambidi, 
  Singbeng ga raokhaibo chamse paniu se masan lude.

V4: |
  4. Phuilo kamaobo hina Tingwang niu raokhai bide, 
  Nuan phungmai hina Jesu ga ngutlo chiu paniu kubam; 
  Pawan hai nawang-e mai hina leng nai machangna, 
  Mai hinagu kamaobo singbengga raolen khai bine.

Translation: "(The Handwriting on the Wall)"

Category: "Warning & Entreaty"

