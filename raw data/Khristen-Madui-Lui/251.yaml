ID: "251"

Title: "CHUNWIJIU PIMAITU"

Key: "D"

Time signature: "4/4"

V1: |
  1. He! malum lu maidung Tingwang lad piulo,
  Korinthmai ariak niabo ga;
  Padum chakiu paren charuk chenia ga,
  Aliu lunlung leng dinkhai-e.

CH: |
  (Chorus) 
  Chunwi jiu pimaitu Tingwang masenne, 
  Kengjiu marukmai atiat kengne;
  Maja makjiu pipad lu raleng, 
  Tacheng ganiu pibo makjiu;
  Chalung niubo thiu makjiu pi padlo, 
  Dijiu chunwi jiu pi padlo.

V2: |
  2. Naky nalu nakhaorui wibam bo hai, 
  Damkhaibo pao niu pibo-e;
  Nang pi padbo suang keng jiu daolan ra-e, 
  Dijiu chunwi jiu pi padlo.

V3: |
  3. Tenbam di daogap makge najeng phi hai, 
  Lingkhai bamdi daorap makge;
  Rapiu niu thoikhai maksai gelan makge, 
  Rapiu niu thoikhai ra khenglo.

Translation: "(A Cheerful Giver)"

Category: "Consecration"

