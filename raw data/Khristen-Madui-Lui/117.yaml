ID: "117"

Title: "PAJENGNIU CHALUI THIUBAM"

Key: "A"

Time signature: "4/4"

V1: |
  1. Achunga chalui khat thiu bamme,
  Jesu niu akhuga din;
  Pah akhu bamsai I wa pinglak,
  Pa atu majang bamme.

CH: |
  (Chorus)
  Jesu; (3x)
  Pazantu masen, I luni thubo-e, 
  Pajeng niu chalui thiubam.

V2: |
  2. Wadao ga I achunsa bamdi,
  Kahiambo akhu wangdi;
  'Puiki kasa sansa jiu daodi,
  Jesu tu I phui bamne.

V3: |
  3. Pah wangjiu atu kulu sune,
  Khang tingku chagan riga;
  I lenjiu pabam ga wang sune,
  I siga chawang thiune.

Translation: "(He Keeps Me Singing)"

Category: "Praise & Opening"

