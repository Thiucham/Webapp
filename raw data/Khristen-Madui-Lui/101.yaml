ID: "101"

Title: "ALIU TU PISU KHAILO "

Key: "G"

Time signature: "3/6"

V1: |
  1. Tingwang tu thuanne,
  Nang kungbo nanah piu;
  Jesu shaikhai lujiu,
  Tinggen wang mide.

CH: |
  (Chorus)
  Halleluyah nakendibo halleluyah Amen!
  Halleluyah nakendibo 'luitu sukhailo.

V2: |
  2. Tingwang tu thuanne, 
  Benbo hiuna pikhai;
  Jesu niu tamiubo,
  Kam maha khai-e.

V3: |
  3. Kendibo thuanlo,
  Shaikhai-e milypoi;
  Aliu nuan hinase,
  Khiu masan khai de.

V4: |
  4. Kendibo thuanlo,
  Lungsa sibo Tingwang;
  'Liutu liulu phiulu, 
  Aliu mpui dinkhai.

V5: |
  5. 'Liutu juringlo, 
  Nalungsa dibo niu; 
  Maihina Hiupuina, 
  Chami kum taolo.

Translation: "(Revive Us Again)"

Category: "Praise & Opening"

