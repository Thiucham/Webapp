ID: "195"

Title: "NANG JESU NAI DEKAM RALO?"

Key: "E"

Time signature: "6/8"

V1: |
  1. Nang Jesu nai dekam ralo?
  Ma nuan jiu kuwang-e;
  Napot ripbo luakra,
  Paniu natu rankhai ra;
  Hiuna chunsa chariumai,
  Nakhuga dinbo-e.

CH: |
  (Chorus)
  Nang Jesu nai dekam ralo?
  He! deniu ken suralo?
  {De niu ken suralo? (2x)}
  Jesu 'nai dekam ralo?
  He! dedao niu ken ralo?

V2: |
  2. Nang Jesu nai dekam ralo?
  Kingjiu bammai khuga;
  Kungbo khuan shen wang-e,
  Masan jiu kuwang bamme;
  Shaimi rabo ringting ga,
  Tingtheng matha wang-e.

V3: |
  3. Tinggen lamsu wang kiubo hai,
  Kendibo wang chunne;
  Paringting masan jiu,
  Singchai riga shai khaiye;
  Palungsiat kadibose,
  Nangleng kadkhai bo-e.

Translation: "(What will you do with Jesus?)"

Category: "Response & Repentance"

