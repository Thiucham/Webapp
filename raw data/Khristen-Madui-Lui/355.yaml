ID: "355"

Title: "I SUDASAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Kawibo nsuan tingga I su dasai,
  Tamiubo nchun se bamlan lakge;
  Pakendibo kabenbo bam gase,
  I tadne siga achunka wangjiu!

CH: |
  (Chorus)
  I achunka wang-e, (2x)
  Paka kendibo ting I wang dasai,
  {I achunka wang-e, (2x)}
  Kawibo nsuan ting I su dasai.

V2: |
  2. Nakendiga I natu zudao sai,
  Nanah maitu nang niu pam khaibo ga;
  Nalungsiat khamse le khai bi dasai,
  I bamne siga achunka wangjiu!

V3: |
  3. Amaning mai tu I wang ngao dasai, 
  Tingtheng ramna mimaitu pam lujiu; 
  Natu malum buibose masan jiu, 
  I bamne siga achunka wangjiu!

V4: |
  4. Jesu Khrista lun I wang ngao dasai, 
  Ajeng gasu shaibopiu lun tuse; 
  Saomakjiu I patu thuanjiu bamne, 
  I bamne siga achunka wangjiu!

Translation: "(Where I shall Wake)"

Category: "Assurance & Testimony"

