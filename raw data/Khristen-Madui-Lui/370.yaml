ID: "370"

Title: "CHAWANG SUANGGA WANG CHAPNE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Chawang suangga wang chapne,
  Mazadung nai thiucham ne;
  Tinggen ram wibo ga,
  Kachia ramga I bamne;
  Tingtheng jiu patu thuanne,
  Tinggen ram wibo ga.

CH: |
  (Chorus)
  Chawang suangga wang chapne,
  Mazadung nai thiucham ne;
  Aliu wang kendi bamlo halleluyah!
  Halleluyah! wang chapne chawang suangga.

V2: |
  2. Tinggen bangse biu bamlo,
  Chawang suangga wang chapne;
  Tinggen ram wibo ga,
  Siga chunsabo hane;
  Pazan tu aliu thuanne,
  Tinggen ram wibo ga.

V3: |
  3. Ahiupuina nang sulo,
  Chawang suangga wang chapne;
  Tinggen ram wibo ga,
  Tathuan pakhu phungwang sai;
  Jesu kumjiu lung mine,
  Tinggen ram wibo ga.

Translation: "(We Shall Stand Before the King)"

Category: "Aspiration after Heaven"

