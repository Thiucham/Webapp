ID: "436"

Title: "ALIU PUI PIU GU MALUMDI"

Key: "A"

Time signature: "3/4"

V1: |
  1. Aliu puipiu malum di-e,
  Chaheng changiu tudi pingmak;
  Dejiu ga aliu chunwilo!
  Kendibo khuan chiumai hina.

CH: |
  (Chorus)
  Aliu puipiu malum di-e,
  Shaibo tangjiu malum bamne.

V2: |
  2. Aliu puipiu malum situ,
  Zat hina khu pise khaine;
  Tingwang khuga su wangbo cham,
  Maihina khen rang thiu lura.

V3: |
  3. Aliu puipiu malum situ,
  Pawan machang lung cham bamne;
  Lungsabo chamse dinron ne,
  Majibo nai lungsabo cham.

Translation: "(Faith of Our Fathers)"

Category: "Special songs"

