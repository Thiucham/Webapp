ID: "145"

Title: "JESU ALIU KAA KACHANG-E"

Key: "F"

Time signature: "4/4"

V1: |
  1. Jesu aliu ka kachang-e,
  Paniu aliu mao phung khai;
  Kata hina phung maha ra,
  Tingwang khuga singbam lo;
  Manaibo piha khai lujiu,
  Matha de jiu chariu ra;
  Kata hinase Tingwang ga,
  Phungwang makbo donniu-e.

V2: |
  2. Aliu ga kahiambo bamma?
  Magenthiubo di bamma?
  Malum masabo thiu makjiu,
  A Rapiu ga phungwang lo;
  Dejiu ga wibo chakalo?
  Aliu chariu phung khaibo;
  Aliu suanbo Jesu se-e,
  A Rapiu ga phungwang lo.

V3: |
  3. Aliu leng karip bo bamma?
  Magenthiubo bang phungjiu;
  Sao khai rabo bam Jesu-e,
  A Rapiu ga phungwang lo;
  Nakamai niu phutkhai bisai,
  A Rapiu ga phungwang lo;
  Paben niu natu gukhaine,
  Nachun pi mathak khaine.

Translation: "(What a Friend We Have in Jesus)"

Category: "Prayer meeting & Revival"

