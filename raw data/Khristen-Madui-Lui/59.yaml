ID: "59"

Title: "KHUDUNG KIULO CROSS GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. Khudung kiulo cross ga khrista bam,
  Khuanjiu bamga wanglo;
  Pakhon kinglo wama nang makjiu,
  Tinglang sanjiu lunglo.

CH: |
  (Chorus)
  Khudung kiujiu kahum bamlo,
  Khudung kiulo Jesu niu shundao ne.

V2: |
  2. Khudung kiulo cross ga chabam bam,
  Saoniu thoidam lura;
  Thoidam bamme sabo niu ngamlak,
  Siga ma ngiu maileng.

V3: |
  3. Khudung kiulo kahumjiu thuanlo,
  Tinggen lamtu phuilo;
  Kadih gutu saokam misulo, 
  Pahtu kahum bamlo.

Translation: "(Kneel at the Cross)"

Category: "Christ life & Love"

