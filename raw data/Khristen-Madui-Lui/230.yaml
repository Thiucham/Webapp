ID: "230"

Title: "KABENBO GA TADNE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Aliu matanjiu Rapiu saisui tadne,
  Rankhaipiu chawang sai suijiu tadne;
  Pagu lunlung kumjiu aliudi lung ne,
  Achunwi jiu mathabo lui thiune.

CH: |
  (Chorus)
  Rankhaipiu sai suira, 
  Dejiu ga achunwi lo;
  Jesu sai suijiu benbo ga tadne,
  Rankhaipiu sai suira, 
  Dejiu ga achunwi lo;
  Benbo ga tadne.

V2: |
  2. Puiki ga aliu niu kahiambo daodi,
  Rankhaipiu tu aliu mazuan bamne;
  Jesu pumtan tu aliu malum bamne,
  Aliu chunwi jiu patu thuan bamne.

V3: |
  3. Malumjiu Jesu phipa saisui tadne,
  Patu phuijiu aliu masuang zuan ne;
  Pagu kendibo ga wang zu ngao dasai,
  Aliu dejiu ga chunwi bam ralo.

Translation: "(Walking in the Light)"

Category: "Driving guidance & Protection"

