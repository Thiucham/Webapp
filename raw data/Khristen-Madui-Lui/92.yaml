ID: "92"

Title: "MAIHINA IMMANUEL TU THUANLO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Mathiu thuanlo Immanuel,
  Pirun luak kumjiu kahum;
  Maihina nacham piu milo,
  Maihina natu thuanne;
  Atu Ranpao chawang chiujiu, 
  Chunwibo tinggen tara khuan;
  Kendibo lui ka ngin wang-e.

CH: |
  (Chorus)
  {Thuanlo (4x)} Immanuel.
  {Thuan Immanuel, (2x)}
  Immanuel kendi chakhuang khatdi wibo,
  Ningting nai pumtan pakhuga bam-e;
  Tingtheng tingtheng jiu.
  {Thuan Immanuel! Immanuel (2x)}
  Chawang ruangga chawang Rapiu-e,
  Thuan Immanuel!

V2: |
  2. Mathiu thuanlo Immanuel,
  Ranlumai natu hom jiu;
  Kadihmai wang niu suimak jiu,
  Wangdi natu kahum ra;
  Karai ga ranlu maidung niu,
  Dibo chawang bam ga magui jiu;
  Tingtheng ringbo luise thiu-e.

V3: |
  3. Mathiu thuanlo Immanuel,
  Ringsu mibo Rapiu tu;
  Namikre maitu ngam khaide,
  Nangra tingtheng ngam kamme;
  Shaibo nai nuan niu ngam lanlak,
  Satan pumtan se hamide;
  Tingtheng nazan kendi bamlo.

Translation: "(All Hail Immanuel)"

Category: "Praise & Opening"

