ID: "25"

Title: "KULAM MAZA DUNG KHUAN"

Key: "F"

Time signature: "4/4"

V1: |
  1. Kulam mazadung khuan chiu,
  Chunwi jiu chalui thiubam;
  Paliu kavai khuan haise,
  Maluang dung riga chiu-e.

CH: |
  (Chorus)
  Pa kendi, Tingwang kendi bamlo. (2x)

V2: |
  2. Dejiu chunwibo gulo?
  Mily khuanmai cham pao se;
  Tinggen mailui khuan chiu-e,
  Kawibo ri nga bo-e.

V3: |
  3. Mazadung niu thiubo lui,
  Wangphuilo Bethlehem ga;
  Chawang nahpiu se lungwang,
  Khudung jiu wang kahumlo.

V4: |
  4. Khaoring kuangga majikhai,
  Mazadung niu thuan jiu bam;
  Mary nai Joseph khuan bam,
  Lungsabo se lukhaira.

Translation: "(Angel We Have Heard)"

Category: "Christmas"

