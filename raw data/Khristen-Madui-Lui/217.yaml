ID: "217"

Title: "TINGWANG NIU GUKHAINE"

Key: "D"

Time signature: "3/4"

V1: |
  1. Tingwang niu gukhaine wa ping mane, 
  Tamiu kaben natu gukhai bine;
  Natu pagu thiura akhi bine, 
  Paniu natu ronna phut khai lakge.

CH: |
  (Chorus) 
  Tingwang niu gukhai ne loibo tangjiu, 
  Rankhaipiu akamai apiu nang-e;
  Nang khengbo hina Jesu niu pine, 
  Patu malumlo natu gukhai ne.

V2: |
  2. Tingwang niu gukhai ne nai machang na,
  Nang tadrabo 'puiki dinlen bine;
  Natu gukhai jiu juringbo piu-e, 
  Karingbo bamga natu jukhai ne.

V3: |
  3. Tingwang niu gukhai ne na ringthen na, 
  Mainiu pingam lakbo thoidam pine;
  Pating tang makthen natu akhine, 
  Pawangdih ga natu phung wang khaine.

Translation: "(God Will Take Care of You)"

Category: "Driving guidance & Protection"

