ID: "350"

Title: "NUANMAI ATU RANLUDE "

Key: "C"

Time signature: "4/6"

V1: |
  1. I pakhu wangjiu degu ngao lulo?
  Lungsa khaibo situ I malumjiu;
  Wasao thiujiu chaliangbo hina,
  Nuanmai atu ranlu lungsiat niu!

CH: |
  (Chorus)
  Nuanmai atu ranlu lungsiat niu! (2x)
  Haise alui-e Tingwang kendi bamlo!
  Nuanmai atu ranlu lungsiat niu!

V2: |
  2. Kamengbo lunlung ga I lung bamniu,
  Tingwang gasu tad madiu bam niu-e;
  Jesu niu atu dao lubo ga,
  Nuanmai atu ranlu lungsiat niu!

V3: |
  3. Amikdui kiubo seniu pageng ha, 
  Lungsiat seniu atu rankhai bide; 
  Nuan seniu Tingwang zu ngaora ping, 
  Nuanmai atu ranlu lungsiat niu!

V4: |
  4. Tuhoi kamaobo ga sao bam khalo? 
  Lungsa sibo Tingwang khu wang paolo; 
  Nanuan hina Tingwang khu paolo,
  Nuanmai atu ranlu lungsiat niu!

Translation: "(Only a Sinner)"

Category: "Assurance & Testimony"

