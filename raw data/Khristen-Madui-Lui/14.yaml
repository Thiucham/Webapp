ID: "14"

Title: "TINGWANG TINGTHENG ALIU RAPIU "

Key: "C"

Time signature: "4/4"

V1: |
  1. Tingwang aliutu nkha pao,
  Aliu gu machunbo;
  Tingthung wangbo ga baibam nang,
  Tingtheng aliu ki-e.

V2: |
  2. Nanggu chawang bam hang gase,
  Namaidung lungjiu bam;
  Nabenpom ronna di bui-e,
  Aliu tu gukhai ra.

V3: |
  3. Kadih dam makhabo suangga, 
  Kadih dam makha ga;
  Tingtheng ringbo Tingwang nang-e,
  Malan hajiu bamme.

V4: |
  4. Takum sang hai namik phuiga,
  Chawan tonmibo kum;
  Dunbo nchun ting loimikum,
  Naimik pad makbo suang.

V5: |
  5. Tadui luangsao makbo wan kum,
  Chaimai tu phungtad le;
  Manglam ngaolu halanmi kum,
  Tingben patbo tingga.

Translation: "(Oh! God Our Help in Ages Past)"

Category: "Grace, Redemption & Love"

