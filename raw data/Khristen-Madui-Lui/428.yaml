ID: "428"

Title: "MASUANG ZUANKHE CHARIPI LAD PHUNGJIU"

Key: "A"

Time signature: "4/4"

V1: |
  1. Khristen mai kinglo Jesu niu ku-e,
  Chawang paniu dinbo lad phungjiu;
  Matip jiu chapkhe chari ngam raleng,
  Masuang zuan khe chari ngam raleng.

CH: |
  (Chorus)
  Masuang zuan khe charipi lad phungjiu,
  Sulo sulo nari puan piujiu;
  Tad sukhe kadinbo chamse suijiu,
  Tachun wijiu chari bam gase.

V2: |
  2. Kinglo chari make mud bambo khuan,
  Jehovah zan niu aliu ngamne;
  Rankhaibo ramlam paben tan seniu,
  Paniu aliutu majang khaine.

V3: |
  3. Aliu dihtu gura hujiu chapkhe, 
  Aliu mikre maitu sun raleng; 
  Ron sukhe kangambo khuanse shenjiu, 
  Tachun wijiu pengphai kajitlo.

V4: |
  4. Aliu ten loijiu chari ngam saira, 
  Jesu tu adaone tinggen lam; 
  Wang zudao saira dejiu wiralo! 
  Lungsajiu tingtheng lungbam mine.

Translation: "(Endeavour's Marching Song)"

Category: "Christian mission"

