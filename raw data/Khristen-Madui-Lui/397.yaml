ID: "397"

Title: "SIGA RAMNA LANLAK SUMA?"

Key: "A"

Time signature: "4/4"

V1: |
  1. Lungsa maidung kendibo ga,
  Khuan bamme natu daora;
  Kadih piri ten loi lujiu,
  Siga nang wang mak rama?

CH: |
  (Chorus)
  Siga ramna lanlak suma?
  Aliu aruang lan sai;
  Widiangbo kyga aruangne,
  Tinggen ky wibo ga.

V2: |
  2. Nahdao tingga chunwi boniu,
  Lungsa bo racham dinne;
  Rapiu shaibo racham situ,
  Paliu chunwi jiu dinbam.

V3: |
  3. Tinggen luise maning taojiu, 
  Nangniu thiu khai mibose; 
  Paliu thiubo luise wi-e, 
  Kadih mainiu thiubo suang.

V4: |
  4. Matha aruang khai mibose, 
  Maning tao lan dasaira; 
  Mikdui luangjiu ramna mibo, 
  Lunlungse maning tao-e.

V5: |
  5. Paliu bamse maruang mide,
  Khat khat thiujiu tad mide; 
  Siga aliu ramna mide, 
  Naikhatra wang lan suma?

Translation: "(Will the circle be Unbroken)"

Category: "Aspiration after Heaven"

