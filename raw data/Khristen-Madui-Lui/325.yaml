ID: "325"

Title: "TINGWANG LADRIAT SE PACHANG-E"

Key: "B"

Time signature: "6/8"

V1: |
  1. Tingwang niu kadih maitu kung,
  Panah tu pikhai de;
  Patu malum lu maihina,
  Tingtheng ringbo daone.

CH: |
  (Chorus)
  Haise pachang paling,
  Tingwang gu ladriat maji-e;
  Palingjiu haise I niu malumme,
  Tingwang ladriat se pachang-e.

V2: |
  2. I nahdao ting kajit jiu lung,
  Nuan vang thiujiu bam niu;
  Ladriat kawi se chiu lujiu,
  Wang panah thiu lude.

V3: |
  3. Rapiu gu lungsiat cham situ,
  I ra malum bamme; 
  Palad malumbo jeng ganiu, 
  A nuanse kuak khaide.

V4: |
  4. Tingtheng ringbo ringting seniu, 
  Alung chun fui mide;
  Ahiupuina Rankhaipiu tu, 
  Tingtheng I thuan bamne.

Translation: "(I know God's Promise is True)"

Category: "Assurance & Testimony"

