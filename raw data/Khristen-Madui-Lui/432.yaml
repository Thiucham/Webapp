ID: "432"

Title: "KABENBO NAH DUNG KUMJIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Tingmik machang kabenbo nah dung kumjiu 'liu tad bamma?
  Kadih tamiubo ten hinase saokhai kam ludama?
  Tingtheng kabenbo niu thaokhai raleng khen rang thiu dama?
  Gukhaibopiu lungsiat se nai machang malumjiu bamma?

CH: |
  (Chorus)
  Tad bamma pa suangga se,
  Kabenbo nah dung kumjiu?
  Jesu zai seniu aliu phaini khiu masanlu dama?
  Kabenbo nah dung kumjiu aliu Tinggen 'pui tad bamma?

V2: |
  2. Kabenbo nah dung kumjiu aliu masan jiu tad bamma?
  Magenkathiubo thiukaniubo nuan phungbo pumtan ga;
  Tamiubo 'puikiga tad mahami maitu phiu bamma?
  Tingtheng karingbo bam gase maluang ngutra phiu bamma?

V3: |
  3. Kabenbo nah dung kumjiu aliu thiu sukhe mathajiu,
  Pahniu rankhai bibo ganiu aliu lung masan lujiu;
  Tacheng kasamai niu aliu lui thiutu nking sune,
  Tingwang namdi kawibo ga Jesu sai sui tad mine.

Translation: "(Children of the Light)"

Category: "Christian mission"

