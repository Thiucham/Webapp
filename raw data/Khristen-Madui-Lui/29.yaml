ID: "29"

Title: "CHRISTMAS GA KILUANG MARONBO"

Key: "C"

Time signature: "4/4"

V1: |
  1. Tingkumai dibo bamga niu,
  Lemjiu kadih ga kiulo;
  Damkhaibo lui kathiu hina,
  Massiah situ thuan lulo.

CH: |
  (Chorus)
  Wang kahum lulo, tachun wijiu;
  Khrista tu kahumlo.

V2: |
  2. Mily khuanmai dung chalu ga,
  Mily khuanjiu bambo lon;
  Tingwang niu majang jiu bamme,
  Ngenah biu niu sanben bam.

V3: |
  3. Kadirih tasi tu saojiu, 
  Kawi maning khai sulo; 
  Mathiuna chunwira phiulo, 
  Naliu chagan tu phuilo.

V4: |
  4. Masan maidung kheng jiu bamme, 
  Paliu niu khuan jiu bamme; 
  Sibo wan ga Rapiu sumi, 
  Paki ga niu ngao sune.

Translation: "(Christmas Carol)"

Category: "Christmas"

