ID: "386"

Title: "NANG AKA KUNGBO"

Key: "E"

Time signature: "3/4"

V1: |
  1. He! Gukhaibopiu nang aka kungbo se-e,
  I niu 'bai khai rabo bamse nang-e;
  I alung chariu jiu magenthiu bamliu tadi,
  Nang niu kubo khuan chiusai achun wi-e.

CH: |
  (Chorus)
  I niu zuan wang-e,
  Alung saokhai mathen na;
  I niu zuan wang-e,
  Atu thoikhailo.

V2: |
  2. A Rapiu Jesu ra naimik 'biu suang benne,
  Tamiubo hinaga nang niu ben khai-e;
  Lungsa mai tadrai mi maidung luise thiu khailo,
  Tingtheng jeng natu thuanbo lui thiu bamne.

V3: |
  3. A Rapiu Jesu ringting mibung kui dasai,
  Nang niu kubo khuan I niu silune;
  Nang pamga ahiuna saokhai raleng I wang-e,
  Chari ngambo tingmik chunwi misune.

Translation: "(What a Friend Thou Art to Me)"

Category: "Aspiration after Heaven"

