ID: "4"

Title: "TINGWANG KEN DIBAMLO"

Key: "A"

Time signature: "3/4"

V1: |
  1. Tingwang ken di bamlo, paten kam jeng niu,
  Kadihtu lungsa jiu panah tu lang kiu;
  Nuan jeng niu Paring ting pi khaibo piu-e,
  Mai hi naleng ringbo rengmun le khai-e.

CH: |
  (Chorus)
  Rapiu tu thuan bamlo pakhuan king lo naliu 
  Rapiu tu thuan bamlo chamai nah chun wijiu 
  Jesu pen niu Tingwang khu wanglu bui-e
  Patu pi paken kadibo thiumilo

V2: |
  2.Tazai niu liu khai jiu rankhai bo ngao de,
  Tingwang lad riad tu malum mai hina niu;
  Kasa ka mao bo hina sao khai bi jiu,
  Jesu niu lungsa khaibi bo ngao lude.

V3: |
  3.Pakendibo ngam kam khai jiu kati khai,
  Panah piu Jesu jeng niu aliu chunwi;
  Siga masan bi ku bidi diang sune,
  Jesu tu ngao sai pakendibo thiune.

Translation: "(To God be the Glory)"

Category: "Grace, Redemption & Love"

