ID: "53"

Title: "NSUAN NAIMIK SUANG NANG BEN-E"

Key: "A"

Time signature: "4/4"

V1: |
  1. Nsuan naimik suang nang ben-e,
  He! a Rapiu nai a wang;
  Nabiu kabenbo ga bamjiu,
  Natu thuanbo lui thiune.

CH: |
  (Chorus)
  Nsuan naimik suang di nang ben-e,
  A Rapiu nnian suangdi nang ben-e;
  Na makendibo pumtan niu
  Tamiubo tu ha thuan khai.

V2: |
  2. kabenbo phaini piu lujiu,
  Nakendibo niu ben-e;
  Na tinggen ram wangtang khialo,
  Tu'di tinggen dih Tingwang.

V3: |
  3. Lungsa sibo piuse nang-e,
  Lungsa khaibo wibo nang;
  Tingthengdi nang niu lungsajiu, 
  Aleng chabam kadenkhai.

V4: |
  4. Aliu tinglang hai chang lujiu,
  Kadih hai saodiak dasai; 
  Sang kariu sang kariu tangjiu,
  Natu thuanbo lui thiune.

Translation: "(Fairer than the Morning)"

Category: "Christ life & Love"

