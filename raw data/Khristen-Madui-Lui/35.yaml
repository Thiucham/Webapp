ID: "35"

Title: "JESU RACHAM AKHUDINLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jesu racham akhu dinlo,
  Alungga pibam raleng;
  Dinlenlo kakungbo racham,
  Wi kachangbo rachamme;
  Maza niudi patu thuan bam,
  Chunwibo luise thiujiu,
  Ku kachangbo kendi bamlo,
  Kadih ga manai bamlo.

CH: |
  (Chorus)
  Jesu racham akhu dinlo,
  Alungga pibam raleng;
  Dinlenlo kakungbo racham,
  Wi kachangbo rachamme,

V2: |
  2. Ramzingga paronna bamkhai,
  Kalumri jiu kheng khai-e;
  Kahiambo wang 'liu nuan jeng niu,
  Chiudi paniu ngam lude;
  Paniu chariu kheng khai bose,
  Maihina khu dinron lo;
  Paken tiakkhai mathad khai-e,
  Paki hajiu lung khai-e.

V3: |
  3. Paliu niu singchai ga genkhai,
  Pathad se mai din ngamlak;
  Paliu niu charaw ga phum khai,
  Di pah ringsu lan mide;
  Pa lungsiat hai dejiu dilo,
  I niu ngaobo suang di-e!
  Haijiu wibo racham sira,
  Naleng aleng shai khaide!

Translation: "(Tell me the Story of Jesus)"

Category: "Christ life & Love"

