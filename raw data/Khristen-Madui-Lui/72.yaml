ID: "72"

Title: "THOIKHAIBO ZAIPOK LUANG BAMME"

Key: "D"

Time signature: "4/4"

V1: |
  1. Thoikhaibo zaipok luang bamme, 
  Nuan phungbo dihga madu khai;
  Tingwang nah zai luangbo ganiu, 
  Paniu aliutu wikhai-e;
  Apiu khuga su I tad jiu, 
  Alung chariubo dao liudi;
  Pazai niu atu khiulu sai, 
  I kabun suang kami sune.

CH: |
  (Chorus) 
  I kabun suangdi kabam mi sune, 
  Pazai niu atu khiu lusai, 
  I kabun suangdi kami sune.

V2: |
  2. Azeng niu tathu pirun run, 
  Patu singchai ga maseng khai;
  Chunsabo hina pah dao jiu, 
  Magenthiubo kheng khai paniu;
  Pazai luang khai mibo seniu, 
  Atu khiu masan khai bi-e;
  Pazai niu atu khiu lusai, 
  I kabun suang kami sune.

V3: |
  3. I na khuga niu tad mijiu, 
  Alung chun haidi mao mide;
  Akhiu amao kengju mijiu, 
  Tadui niura masan ngamlak;
  Jesu zainiu khiu ngam diu-e, 
  I niu pacham phungbi saira;
  Pah atu khiu masan bisai, 
  I kabun suang kami sune.

Translation: "(Blessed be the Fountain)"

Category: "Humiliation, Resurrection & Glory"

