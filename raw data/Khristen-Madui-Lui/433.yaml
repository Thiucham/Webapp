ID: "433"

Title: "APUI GU BIBLE "

Key: "B"

Time signature: "4/4"

V1: |
  1. Kakungbo ariak khuangse,
  Guangjiu kekmi bam liudi,
  Karaidao chunwatse pi maning taokhai,
  I apui phibang ga chap,
  Paben niu api kaba,
  Pakhuan manuan jiu akhu dinbo chiu-e.

CH: |
  (Chorus)
  Ariak khuang kungbo-e,
  Nalungsiat ga bamsai I achunwi-e,
  I niu haise kenbo ga,
  Nai machang wibibi-e,
  Haise niu atu Tinggen lam jukhai ne.

V2: |
  2. Jesu niu nah maidung tu,
  Lungsa jiu thoikhai gukhai,
  Paliu leng singchai riga shaikhai mide,
  He! dejiu ga lungsa lo,
  Paniu amikdui nun sang,
  Haise naleng-e chiujiu biang hiu khai-e.

V3: |
  3. Tura pawan ton mide,
  Chiudi maning tao bamme,
  Sibo ariak khuangse aleng-e tingtheng,
  Apui niu dinkhaibo kum,
  Pachunbo ten I thiune,
  Pacham hai tingtheng jiu alungga bamme.

Translation: "(My Mother's Bible)"

Category: "Special songs"

