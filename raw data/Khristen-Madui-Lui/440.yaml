ID: "440"

Title: "CHAKEN HINAGU AGUN KHRISTA "

Key: "E"

Time signature: "3/4"

V1: |
  1. Karai ga Khrista jao makjiu,
  Hiuna kakeng hamide;
  Chiudi Tingwang lungsiat penniu,
  'Liutu kabenga jukhai.

CH: |
  (Chorus)
  Khrista hai chaken hina gu agun,
  Aliu malum thiukhang;
  Malun matiplu hujiu,
  Aliu masuang zuan sukhe,
  Patu aliu judao makthen;
  Khrista 'luigu agun.

V2: |
  2. Takum wajiu tad ton mide,
  Khrista tu sikhai makjiu;
  Agunbo hajiu lungbam niu,
  Khrista niu agun pikhai.

V3: |
  3. Aliu puipiu gu malum niu,
  Kasa kathiu tu ngam khai;
  Khrista ringsu mibo jeng niu,
  Halleluyah! pa m'wang bam.

Translation: "(Christ the Hope of Ages)"

Category: "Special songs"

