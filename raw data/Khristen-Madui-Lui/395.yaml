ID: "395"

Title: "SINGCHAI MPUI NIU TINGGEN JUKHAI "

Key: "A"

Time signature: "4/4"

V1: |
  1. Tinggen wangra singchai 'puiki tad ra-e,
  Simak jiu kaki ha-e;
  Kabenbo Tinggen rengmun ngao lakge,
  Cross 'puiki se zuan wang maksai.

CH: |
  (Chorus)
  Cross 'pui niu Tinggen jukhai,
  Cross 'pui niu Tinggen tadne;
  Tinggen tabin tadga achunwi-e,
  Cross 'pui niu Tinggen tadne.

V2: |
  2. Tazai luang khaibo 'pui gase I tadne,
  Rankhaipiu tadbo 'puiki;
  Tingtheng kabenbo kyga wang lusai,
  Tingwang tu maluang bam mine.

V3: |
  3. Kadihri haitu I niu ramna khai-e,
  Sibo 'puiga tadlan lak;
  Rapiu niu kubamme wanglo chiujiu,
  Khamle lujiu pah khuan bamme.

Translation: "(The Way of the Cross Leads Home)"

Category: "Aspiration after Heaven"

