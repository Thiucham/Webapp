ID: "42"

Title: "RANLUBO RIPHEN MAILUI"

Key: "G"

Time signature: "6/9"

V1: |
  1. Tazai duipok khat luang bamme, (3x)
  Calvary ga padbo;
  {Tazai giudui nuan phungmai leng (3x)}
  Siga niu masanne.

CH: |
  (Chorus)
  He! Calvary zai wibo, (3x)
  Aleng luang khai bo-e.

V2: |
  2. Nuan phungmai leng pah shai khai-e, (3x)
  Masanne pazai niu;
  {Nuan phungbo I masan lude, (3x)}
  Kabun kum masanne.

V3: |
  3. Rapiu pazai kungbo luang khai, (3x)
  Mainiu dinsi lakge;
  {Ranlu mainiu sise ngao-e, (3x)}
  Kawibo ramtuse.

V4: |
  4. Malum mainiu kawi ngao-e, (3x)
  I di kawi ngao-e;
  {Ladren sise lungsa kungbo, (3x)}
  I niu din ngam lakge.

Translation: "(Salvation Army Song)"

Category: "Christ life & Love"

