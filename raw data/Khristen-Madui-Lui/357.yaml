ID: "357"

Title: "DUIDISE MALAN MIDE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Karaidao Israel mai tamiubo,
  'Vang thiujiu bamga;
  Tingwang pumtan madu khaijiu,
  Duipui se malan mi.

CH: |
  (Chorus)
  Duipui se malan mi, (2x)
  Jesu tu majang sai, 
  I wa pingra ha-e,
  Duipui se malan mi.

V2: |
  2. Kahiambo nai nuan seniu,
  Ariga tanwang bamdi;
  Rapiu niu atu lungsa jiu,
  Duipui se malan mi.

V3: |
  3. A mpui kiga kapingbo daodi,
  Jesu nai tadne;
  Paniu atu kungjiu pambi,
  Duipui se malan mi.

V4: |
  4. Rapiu Jesu ating tang sai,
  Dibo tingmik ngao ne;
  Nang niu atu jukhai bijiu,
  Duipui se malan mi.

Translation: "(He Rolls the Sea Away)"

Category: "Aspiration after Heaven"

