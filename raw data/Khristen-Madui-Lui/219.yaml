ID: "219"

Title: "JESU GU SINGCHAI HANGGA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Jesu gu singchai hangga,
  Siga I chap bamme;
  Tudi kadibo hiu gase,
  Alung chariu ra ha;
  Ramjing ga I ronjiu bamme,
  Mathak khai rabo bam;
  Tingphu tingnai gase tad bam,
  Atu mathak khailo.

V2: |
  2. Jesu gu singchai situ,
  Amik niu phui meng ngao;
  Azeng gasu shaikhaibo piu,
  Patu I niu ngao-e;
  Alung chariu jiu I mikdui luang,
  Akiam pao khai-e;
  Bui makbo atu rankhai-e,
  Suang habo lungsiat niu.

V3: |
  3. Singchai hiu gase I chap,
  Siga I lung bamne;
  Naimik 'biuse pageng ha-e,
  Pazu 'biuniu bendiang;
  Kadihga kachia rangkang niu,
  Alung kim ra ha-e;
  Achengsa niu mangam bose,
  Singchai niu kuak khai-e.

Translation: "(Beneath the Cross of Jesus)"

Category: "Driving guidance & Protection"

