ID: "112"

Title: "NAWANGDIH TU I MASEN"

Key: "G"

Time signature: "2/2"

V1: |
  1. Nawang dihtu I kung,
  He! Rapiu naky se;
  Kungbo Rankhaipiu zai seniu,
  Phumling tu rankhai-e.

V2: |
  2. Agu church tu I kung,
  Nama suangga chapbam;
  Nang niu kungbo nanah kumjiu,
  Naben ga rankhai-de.

V3: |
  3. Paleng amikdui luang,
  Paleng I niu kheng-e;
  A chariu pakhuga pikhai,
  Chariubo loi makthen.

V4: |
  4. Achunwibo gen lam,
  Tinggen 'puitu I se;
  Paniu kungjiu maluang khaibam,
  Palungsa lui thiune.

V5: |
  5. Nang ra tingtheng ring-e,
  Phumling di se kumme;
  Kadih niu pibo kendi suang,
  Tinggen dih ra bendiang.

Translation: "(I Love Thy Kingdom)"

Category: "Praise & Opening"

