ID: "299"

Title: "ANA YOH NANG DELAM BAMLO?"

Key: "G"

Time signature: "6/8"

V1: |
  1. Hamibo nah yoh delam lo?
  I niu kung thubo anah yoh,
  Nang hai agu chunwat thiubam jiu,
  Athoi nai lungsa di nang.

CH: |
  (Chorus)
  Anah yoh delam bamlo?
  Tuhoi delam bam milo,
  I natu lungsabo nang se bamme,
  Anah yoh delam bamlo?

V2: |
  2. Pahai kajik dui kumjiu bam,
  Papui pamga bambo tingra,
  Pazu palun wet kumbo ha-e,
  Pa kumbo maidi ha-e.

V3: |
  3. Natu zudao lanlu buima?
  Daa karaidao tingga kumjiu,
  Lungchun masan jiu nui rim khailo,
  Ringting ga benbo mibung.

V4: |
  4. Hamibo nah situ phiulo,
  Patu delam su dao ralo!
  Pa magenthak gasu pui wanglo,
  I patu lungsa bamme.

Translation: "(Where is My Boy Tonight?)"

Category: "Christian service & Reward"

