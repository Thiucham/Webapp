  Lungchun masanjiu maruklo;
  Kungbo lin maruklo, 
  Kachia lin wibo;
  Kungbo lin maruklo, 
  Chaben kajitbo saomakjiu;
  Tingriu tingwi khaira, 
  Tingwang ga kheng lo.

