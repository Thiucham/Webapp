ID: "5"

Title: "TINGGEN LAM BAMBO APIU"

Key: "G"

Time signature: "2/4"

V1: |
  1. Tinggen lam bambo a Rapiu,
  Nang niu pibo katiu kasak
  Aliu tiu raleng wangbamga,
  Chalui thiujiu nakhu kheng-e

V2: |
  2. Katiu kasak pibo kumjiu,
  Napumtan niu aliu ringra,
  Pikhailo aliu dung khuga,
  Nakhuga aliu wangtang ra,

Translation: "(My Heavenly Father)"

Category: "Grace, Redemption & Love"

