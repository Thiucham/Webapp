ID: "308"

Title: "SHAIRAMAI TU GUKHAILO "

Key: "B"

Time signature: "4/4"

V1: |
  1. Chariu khengjiu shaira maitu gukhailo, 
  Nuan phungjiu chariu maitu gukhailo;
  Paten maojiu kaobam maitu jusulo, 
  Ring raleng Jesu chamse dinkhailo.

CH: |
  (Chorus) 
  Chariu khengjiu shaira maitu gukhailo, 
  Lungsa sibo Jesu niu rankhai-e.

V2: |
  2. Mainiu mala bamdi para khuan bamme, 
  Palung kali maitu rankhai bine;
  Ma nuan jiu kubamme Lungsabo khuan niu,
  Malum khai sai nuan hina kuakkhai ne.

V3: |
  3. Chamaina lung hai kahiambo niu fui-e,
  Hathuanlo nangniu alung tamiubo; 
  Chalungsabo nabenniu atu julo, 
  Thiuta mibo luidi thiulan sune.

V4: |
  4. Kashai maitu ranlo haise naten-e, 
  Tenlo a Rapiu niu pumtan pine; 
  Masanbo 'puiga paliutu luang wanglo, 
  Rankhaipiu shaibo chamse din khailo.

Translation: "(Rescue the Perishing)"

Category: "Christian service & Reward"

