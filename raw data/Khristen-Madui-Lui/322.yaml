ID: "322"

Title: "JESU TU MALUMME"

Key: "A"

Time signature: "6/4"

V1: |
  1. Tingkai tingriu dao bamdi,
  Nai machang I malumme;
  Agu malum siam liudi,
  Jesu tu malum bamne.

CH: |
  (Chorus)
  Nai machang malum bamme,
  Nai machang tadbo kumjiu;
  Ariga wakhat wangdi,
  I Jesu tu malumme.

V2: |
  2. Masanbo hiupuina niu,
  Alungga thaoben khai-e;
  Paniu jukhai sai kaolak,
  Jesu tu malum bamne.

V3: |
  3. Agu puiki masan sai, 
  I chalui thiujiu bamne; 
  Paniu atu kuboga, 
  Jesu tu malum bamne.

V4: |
  4. Aringting loijiu bamdi, 
  Kadih hai hami liudi; 
  Kachia ram wangtang makthen, 
  Jesu tu malum bamne.

Translation: "(Trusting Jesus)"

Category: "Songs of pilgrimage"

