ID: "140"

Title: "AHIUNA KABENBO"

Key: "F"

Time signature: "3/4"

V1: |
  1. Ahiuna tu Rankhaibopiu,
  Nang bamsai tamiubo hane;
  Kadihri kamuang niu gomlak,
  Naten thiumai khuga bailo.

V2: |
  2. Kajik kiubo wan jikiujiu,
  Amikrak su lakjiu bamdi;
  Wijiu atu mathak khailo,
  Rankhaipiu khuga bam mine.

V3: |
  3. Pawan machang majang khailo,
  Nang hasai I ring lulakge;
  Chun nawang sai majang khailo,
  Nang hasai I shai nimakge.

V4: |
  4. Nanahmai ronmeng mimai bamsai,
  Kakungbo khuan thainai shenlo; 
  Rapiu tuhoi tensu mikhe, 
  Nuan ga patu bamtheng talo.

V5: |
  5. I susai atu thoi khaibilo, 
  Kadihri aliu puimachang; 
  Duidi kenmibo nalungsa, 
  Pibam khailo Tinggen tangjiu.

Translation: "(Sun of My Soul)"

Category: "Prayer meeting & Revival"

