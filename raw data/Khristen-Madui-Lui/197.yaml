ID: "197"

Title: "RANKHAIPIU WANGKHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! Rankhaipiu atu lungsa khailo,
  Wangjiu kalan khailo;
  Alungchun niu natu ramgun bamme,
  Wangjiu kalan khailo.

CH: |
  (Chorus)
  Ramluang gasu ronmeng jiu tad mide,
  Chaky gasu tad madiu mi;
  He! atu lungsa jiu luangwang khailo,
  Rankhaipiu wang khailo.

V3: |
  3. Chariubo daojiu aronna bamme,
  Wangjiu kalan khailo; 
  A Rapiu lungsiat tu I phui bamme, 
  Wangjiu kalan khailo.

V4: |
  4. Chariubo lungchun tu phutkhai tulo, 
  Wangjiu kalan khailo; 
  I niu khengbo rathoi hai lukhailo, 
  Wangjiu kalan khailo.

Translation: "(Come Great Deliverer Come)"

Category: "Response & Repentance"

