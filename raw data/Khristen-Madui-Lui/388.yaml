ID: "388"

Title: "CHUNWIBO NAI CHUNSABO GENLAM"

Key: "A"

Time signature: "2/3"

V1: |
  1. Chunwibo nai chunsabo genlam, 
  I wang sune;
  Rak bambo nai zi bambo genlam,
  Lingkhaibo nai gebambo genlam,
  I wang sune.

CH: |
  (Chorus)
  Withubo ky kiu mazadlo Rapiu.

V2: |
  2. Penbambo nai kuirabo genlam,
  I wang sune;
  Benbambo nai tamiubo genlam,
  Amanbo nai chariubo genlam,
  I wang sune.

V3: |
  3. Naimik padbo nai kiubo genlam,
  I wang sune;
  Manuanbo nai marangbo genlam,
  Ningtaobo nai mangaibo genlam,
  I wang sune.

V4: |
  4. Kajik kiubo kiumakbo genlam,
  I wang sune;
  Tudibam singgiu luangbo genlam,
  Tingtheng bambo nai habo genlam,
  Bamji sune.

V5: |
  5. Ramnabo nai aruangbo genlam,
  I wang sune;
  Bamrabo nai tad rabo genlam,
  Lungwibo nai lungsabo genlam,
  Wangji sune.

Translation: "(Beyond the Smiling and the Weeping)"

Category: "Aspiration after Heaven"

