ID: "21"

Title: "ALUNG GA NABAM LENG"

Key: "F"

Time signature: "4/4"

V1: |
  1. Nagu dibo chawang bam nai pirun saodiak jiu 
  Haibo kadihri ga wang-e;
  Chiudi naki masanbo Bethlehem nam ga,
  Nang wang bam khai rabo leng hah.

CH: |
  (Chorus)
  {He! Wanglo Jesu alung ga 
  Alungga nabam leng bamme. (2x)}

V2: |
  2. Tinggen bang biujiu mazadung chalui thiu-e 
  Nakendi se madu bamme;
  Rapiu lungsiat seniu kadih ga lung wang-e,
  Manuan bo lunlung lung-e.

V3: |
  3. Asathiky di bam thingnadi pasip bam,
  Mariu singbang dibo hiuga;
  Tingwang Nahpiu papi mangiu khaibo bamleng,
  Galilee ram lung ga ngao mak.

V4: |
  4. Tingwang nah chamai tu juringra wangkiu-e,
  Shailising chamsi phung lujiu;
  Chiudi talianbo gu tathu pirun runkhai,
  Calvary lam jutad mide.
  He wanglo! Jesu alung ga nagu singchaise aleng-e.
  He wanglo! Jesu alung ga nagu singchaise aleng-e.

V5: |
  5. Nang niu kashaibo tu ngamjiu sulan mide,
  Tinggen hom mai chalui thiu-e;
  Atu kukhailo a Rapiu nang kiulan sai, 
  Chabam maroung bamme chiujiu. 
  He! alung mathane Jesu,
  Atu kura nang wang kiusai. 
  He wanglo! Rapiu alung ga, 
  Alung ga Nabam leng bamme.

Translation: "(Room for Thee)"

Category: "Christmas"

