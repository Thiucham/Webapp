ID: "359"

Title: "PATEN TEN JIU BAMKHE"

Key: "F"

Time signature: "4/4"

V1: |
  1. He! sao rabo ram tu maning,
  Dedao niu wang ralo?
  Dedao aripuan khaikiu jiu
  Tinggen kyga lungra?

CH: |
  (Chorus)
  Paten ten jiu bamkhe,
  Jesu kiu lan makthen tenlo;
  Jesu wang sai Tinggen lam aruang ne.

V2: |
  2. Kadih ga kawibo ha-e,
  Sao rabo bam ha-e;
  Kapbo kahuibo kadih-e,
  Kadih aky makge.

V3: |
  3. I Jesu ga sao raleng wang, 
  I ronmeng lan lakge; 
  Papam ga atu khai lujiu, 
  Atu akhi bamne.

V4: |
  4. I niu Jesu khu zuan wang-e, 
  I ronmeng lan lakge; 
  I shaidi pasai sui bamne, 
  Tinggen wang tang makthen.

Translation: "(We'll Work Till Jesus Comes)"

Category: "Aspiration after Heaven"

