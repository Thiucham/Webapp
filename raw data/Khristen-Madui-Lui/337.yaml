ID: "337"

Title: "NAGU MALEE RAMJIU TAD BAMMA?"

Key: "F"

Time signature: "4/4"

V1: |
  1. Ringting gu malee ramjiu tad bamma?
  Tingthung tingkai katan hun wang bamdi;
  Duiliu katanbo kasuak bam liudi,
  Ringting gu malee ramjiu bamlo.

CH: |
  (Chorus)
  Malee ramse thin matip lulo,
  Chap matiplo tadui kasuak di;
  Khrista tudi ga chap matiplo,
  Rankhaipiu lungsiat ga chap matiplo.

V2: |
  2. Pingrabo ha-e malee rambo ga, 
  Tadui kasuak bamdi pingmi tulo;
  Malee ramjiu chap matip bam saira,
  Tingthung tingkai se pacham phung-e.

V3: |
  3. Kashaibo duiliu tanwang bamliudi, 
  Nagu maleese ramjiu bam suma? 
  Tingthung tingkaise tanjiu hun wangdi, 
  Ringting gu malee ramjíu bamlo.

V4: |
  4. Nsuan benbo 'biuse nang ngao suma? 
  Kachia namdi benbo ga adaora; 
  Tinggen ramga aliu wang lung raleng, 
  Ringting gu tingthung se loi dasai.

Translation: "(Will Your Anchor Hold)"

Category: "Assurance & Testimony"

