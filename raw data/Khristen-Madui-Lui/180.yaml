ID: "180"

Title: "HAMIBO NAH YO WANGLO"

Key: "B"

Time signature: "12/8"

V1: |
  1. Hamibo nahyo wanglo Tingwang niu kubamme,
  Kinglo kubamme Tingwang niu kubo khuan;
  Tingwang khugasu taddiu mide thainai wanglo,
  Kinglo lungsajiu kubo khuan.

CH: |
  (Chorus)
  {Kubamme natu,
  Hamibo nahyo wanglo; (2x)}

V2: |
  2. Pakhuan manuan jiu napiu niu natu kubamme,
  Kinglo manuan jiu kubamme wang lulo;
  Malan wanglo chiujiu natu lungsajiu ku-e,
  Kinglo lungsajiu kubo khuan.

V3: |
  3. Wanglo napiu niu khumkibo ga chabam bamme,
  Kinglo manuan jiu kubam ga wang lulo;
  Phuilo khumki raleng dijiu kaden khai bamme,
  Kinglo lungsajiu kubo khuan.

Translation: "(Calling the Prodigal Son)"

Category: "Invitation & Baptism"

