ID: "328"

Title: "I NIU SE-E A RAPIU KHUAN "

Key: "A"

Time signature: "4/4"

V1: |
  1. A Rapiu tu I ngao makdi,
  Pawan machang atu din-e;
  Patu kada lubo jeng niu,
  Thuan kiulo pakhuan I se-e.

CH: |
  (Chorus)
  I niu se-e a Rapiu khuan,
  He! alung pi matha khai-e;
  Pawan machang atu dinne,
  He! thuan kiulo pakhuan se-e.

V2: |
  2. I niu palun ngao mak bamdi,
  Tingkai gasu pakhuan chiu-e;
  Duiliu tu paniu kham khai-e,
  Naimik 'biu kawi thaokhai-e.

V3: |
  3. Majibo se aleng dinkhai,
  Lungsabo cham akhu dinkhai;
  Chunwi mathara dinkhai-e,
  Tinggen chamse atu dinkhai.

Translation: "(I know Hos Voice)"

Category: "Assurance & Testimony"

