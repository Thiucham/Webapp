ID: "96"

Title: "I MALUMJIU PHUI-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. I malumjiu phui-e,
  Calvary milypoi,
  Rankhaibo piu;
  Athoi hai lukhailo,
  A nuan hai kuak khailo;
  Thainai gasu atu namai thiulo.

V2: |
  2. Lungsa sibo nang niu,
  Chariubo alung hai,
  Kha khai khelo;
  Nang niu aleng shaikhai,
  I natu lungsa ra;
  Masanbo lungchun chami kum taolo.

V3: |
  3. Alung chun tamiujiu,
  Chariubo dao saira,
  Puidin khailo;
  Tamiubo ha thonlo,
  Amikdui nunsanglo;
  Atu phut khaitulo napam ganiu.

V4: |
  4. Ating hai tang lujiu.
  Charaw nawang saira,
  Lusu khailo;
  Atu chalung sajiu,
  Pingbo hathon khailo;
  Thiuniu makjiu tinggen majang khailo.

Translation: "(My Faith Looks up to Thee)"

Category: "Praise & Opening"

