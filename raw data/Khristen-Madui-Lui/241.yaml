ID: "241"

Title: "I JESU KUM NI-E"

Key: "A"

Time signature: "6/8"

V1: |
  1. Kadihri lunitu makjiu,
  I Jesu kum ni -e;
  Kadihri chengtu phut lujiu,
  I Jesu kum ni -e.

CH: |
  (Chorus)
  Tad khaibo bam machang ga,
  I Jesu saisui bamne;
  Nai machang pawan machang,
  I Jesu kum ni -e.

V2: |
  2. Bangbo riang se kam tab khailo,
  I Jesu kum ni -e;
  Ahiuna patu macha ra,
  I Jesu kum ni -e.

V3: |
  3. I kadhiri ga lung bam thenna,
  I Jesu kum ni -e;
  Paracham maikhu din ronne, 
  I Jesu kum ni-e.

V4: |
  4. Tinggen lam atu sun daone,
  I Jesu kum ni-e;
  Kamdao de chiujiu sun daone, 
  I Jesu kum ni-e.

Translation: "(I would be Like Jesus)"

Category: "Desire after holiness"

