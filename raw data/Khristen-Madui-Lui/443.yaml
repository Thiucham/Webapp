ID: "443"

Title: "MAJIJIU SAOMAILO"

Key: "C"

Time signature: "6/8"

V1: |
  1. A Rapiu tingthung tanwang jiu,
  Kashuak maliam kam sune;
  Tingthung siudung tamiu wangbo ga,
  Gukhaira mai ha thainai;
  Nang dejiu rijiu bamgulo,
  Nalung manang makma?
  Duidi kashuak jiu aliu jingmine,
  Pingjiu aliu chun hane.

CH: |
  (Chorus)
  Tingthung di tadui kashuak acham jai din bisai,
  Duidi nai tingkai di tadui khuan,
  Rapiu khu satan di chamai chamtan ha.
  Aliam tudi tadui malin lulak,
  Duidi Tinggen kadih hina Rapiu.
  Wahina dung acham majaine,
  Maji jiu sao mine,
  Kata hina pacham manon jiu,
  Sao kam mine.

V2: |
  2. A Rapiu I shaira thiujiu,
  Nasuang ga khudung jiu kheng;
  Alung kasabo niu magenthiu,
  Suijiu ranlo I kheng-e;
  Anuan tadui kadi kumme,
  Kuak khai khelo nangniu;
  Shaira kummi ne a Rapiu khalo,
  Majat jiu atu julo.

V3: |
  3. A Rapiu kapingbo hane,
  Tuhoira mathak mine;
  Kadih naimik duidi thaoben ne,
  Benlo alung Tinggen 'biu;
  Dejiu wilo rankhaibopiu,
  Tingtheng jiu gukhailo;
  A Rapiu saomak jiu matha bamra,
  Duidi gen kawibo ga.

Translation: "(Peace be Still)"

Category: "Special songs"

