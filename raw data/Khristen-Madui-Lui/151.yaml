ID: "151"

Title: "RANKHAIPIU TU PI NGUTLO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Sangmai kamun ga chapbam pi ngutlo!
  Pah karai gasu chapbam pi ngutlo!
  Tadlan makjiu pi ngutlo!
  Masanmai-e pi ngutlo!
  Tingwang nah Jesu Khrista pi ngutlo!

V2: |
  2. Tuhoi nalung kham lelo pi ngutlo!
  Rimisai tadmi sune pi ngutlo!
  Naka piu-e pi ngutlo!
  Paniu natu gukhai ne;
  Tathiu lura gukhai ne pi ngutlo!

V3: |
  3. Lungsabo khuanse kinglo pi ngutlo! 
  Tuhoi kaden lusulo pi ngutlo! 
  Kamun ga chapjiu bamme, 
  Paniu nachun wi khaine; 
  Pazan ga nang kahumlo pi ngutlo!

V4: |
  4. Pahai Tinggen giangpiu-e pi ngutlo! 
  Natu khumki khai sune pi ngutlo! 
  Nanuan hina kuak khaine, 
  Kasabo ri ngam khaijiu; 
  Tinggen lam lusu khaine pi ngutlo!

Translation: "(Let the Saviour In)"

Category: "Prayer meeting & Revival"

