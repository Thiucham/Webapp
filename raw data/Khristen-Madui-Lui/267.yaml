ID: "267"

Title: "ALIU CHAWANG RIPHEN "

Key: "G"

Time signature: "4/4"

V1: |
  1. Aliu chawang riphen,
  Pazai niu rankhaibo;
  Pumkhat thiujiu chari thiura,
  Chawang Khrista leng se;
  Maipum makhin bamdi,
  Mathajiu thiubam khe;
  Chawang riphen saisui sukhe,
  Paniu maluang khaine.

CH: |
  (Chorus)
  Chawang riphen aliu,
  Patu thuan jiu thiukhe;
  Malumjiu paleng ten bamkhe,
  Aliu wang kadibo.

V2: |
  2. Aliu chawang riphen,
  Mathajiu dinron khe;
  Singchai ga genkhaibo piu zan sise,
  Chawang Khrista;
  Chawang riphen aliu,
  Magenthiu jiu bamdi;
  Kadibo wang Jesu zan tu,
  Malumjiu kheng bam khe.

V3: |
  3. Chawang riphen aliu,
  Patu wang ngao sune;
  Pagu chariubo phung cham sai,
  Padam se lu chamne;
  Pengphai se pon kulo,
  Pating tangra nade;
  Pirun dibo lura nade,
  Aliu chawang riphen.

Translation: "(Soldiers of the King)"

Category: "Conflict & Victory"

