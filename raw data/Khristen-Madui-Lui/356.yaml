ID: "356"

Title: "KACHIA NAMDI"

Key: "A"

Time signature: "4/4"

V1: |
  1. Namdi bamme kashaibo genlam phui khai sai,
  Sibo namdi se dinse lakge;
  Naimik di kiumak chapiu niudi kui makge,
  Sibo kachia namdi wibo ga.

CH: |
  (Chorus)
  Siga naimik kiumak, 
  Chapiu niudi kui mak;
  Malum maidung niu Rankhaipiu tu ngao sune,
  Sibo kachia namdi wibo ga.

V2: |
  2. Siga bambo aliu niu kungbo Rapiu tu,
  Malumlu maihina niu ngao ne;
  Tacheng tadmai tingtheng chagan kum ben bamne,
  Sibo kachia namdi wibo ga.

V3: |
  3. Singchai ga aliu niu pui wangbo hiupuina,
  Mily rongga jukhai mi maidung;
  Pirun leng kabenbo kachia pirun lura,
  Sibo kachia namdi wibo ga.

Translation: "(The City of Gold)"

Category: "Aspiration after Heaven"

