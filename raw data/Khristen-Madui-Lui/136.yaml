ID: "136"

Title: "NGAMBO CHAWANG KIULO"

Key: "G"

Time signature: "3/4"

V1: |
  1. Ngambo chawang kiulo,
  Nang zantu thuan bamra,
  Kha khai khelo;
  Pakendibo Tingwang,
  Chari ngambo piu-e;
  Wangjiu aliu khu chawang thiu khailo.

V2: |
  2. Ladkeng niu chamai thiu,
  Rapiu gu apang heng,
  Thinsu khailo;
  Wangjiu thoikhai khelo,
  Namai hina rihga;
  Masanbo hiupuina lang kiu khailo.

V3: |
  3. Masanbo Hiupuina,
  Aliu khu bam khaijiu,
  Gukhai khelo;
  Chamai hina lungchun,
  Hiu'na Masanbo niu;
  Aliu Hiu'na ga pumtan pikhailo.

V4: |
  4. Sumniu khat thiu Rapiu,
  Kawi atu pilo,
  Thuanjiu thiune;
  Ngamkambo Rapiu niu,
  Aliu tu gukhailo;
  Tingtheng Natu thuanne lungsa khailo.

Translation: "(Come Thou Almighty King)"

Category: "Prayer meeting & Revival"

