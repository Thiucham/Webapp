ID: "178"

Title: "RANKHAIPIU KHUGA WANG MAJAT LO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Rankhaipiu khuga wang majat lo,
  Paniu aliu 'puiki dinkhai ne;
  Jesu 'thai aliu khu wang chapbam,
  Wanglo chiujiu ku-e.

CH: |
  (Chorus)
  Dejiu mathalo wang aruangbo,
  Nuan gasu aliu masan lujiu;
  A Rapiu Jesu nai aruangne,
  Tingtheng ringbo kyga.

V2: |
  2. Nahmai dung kawi dinkhailo,
  Mathiuna lung mathajiu bamlo;
  Thoidam lujiu patu thuan bam khe,
  Wanglo namen jijiu.

V3: |
  3. Thainai pah aliutu majang bam,
  Pagu chamtan tu majai lulo;
  Kinglo chalungsa jiu kubo khuan,
  Wanglo anah thiulo.

Translation: "(Come to the Saviour)"

Category: "Invitation & Baptism"

