ID: "344"

Title: "KHRISTA TUDI"

Key: "G"

Time signature: "3/4"

V1: |
  1. Wakaki tu maning makge,
  Jesu zaitu maning sang nu;
  Wakaki tu malum makge,
  Jesu zan ga mangiu khai-e.

CH: |
  (Chorus)
  Khrista tudi ga I chapne,
  {Kaki bora buidih niang-e. (2x)}

V2: |
  2. Tamiubo niu gombam liudi,
  Palungsiat ga I mathak khai;
  Tingthung katan hun wang bamdi,
  Pakhuga I mangiu khaine.

V3: |
  3. Paladren nai pazai seniu, 
  Atu duidi juken khai-e; 
  Ting kadih hahjiu bam liudi, 
  I ra pakhu lam wangra-e.

V4: |
  4. Paken dijiu shenwang saira, 
  Pakhu ga I wang bam mine; 
  Lungsa khaibo phai I benjiu, 
  Pawang bamga I wang chapne.

Translation: "(The Solid Rock)"

Category: "Assurance & Testimony"

