ID: "259"

Title: "TINGWANG GU KUNGBO KALEN"

Key: "A"

Time signature: "6/8"

V1: |
  1. Tachun wibo alungga wang,
  Chunwi mathabo din ngamlak;
  Situ I din lanlan bamne,
  Tingwang kungbo kalen se.

CH: |
  (Chorus) 
  Maisuang habo agimanaibo kalen!
  He! maisuang habo manaibo!
  Tingwang kungbo kalenne!

V2: |
  2. Khrista singchai riga suniu,
  Agimanaibo phung wang khai;
  Wakhat niu di kada silak,
  Tingwang kungbo kalen se.

V3: |
  3. Chawang pirun I ngaobo nai, 
  Jesu tu Rapiu chiu kune; 
  Pakhu gasu thoidam daone,
  Tingwang kungbo kalen se.

V4: |
  4. Manaibo bamne Jesu ga, 
  Pakhu I wang lungbam misai; 
  Manaibo chunwat bam mine, 
  Tingwang kungbo kalen se.

Translation: "(Sweet Peace the Gift of God's Love)"

Category: "Love, Joy & Peace"

