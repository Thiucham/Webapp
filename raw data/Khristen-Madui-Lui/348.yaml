ID: "348"

Title: "PALUNGSIAT SE ALENG BUIDE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Palungsiat se aleng buide! 
  Kapingbo wang dasai I niu pakhu nawang;
  Paniu a nuan kuak khaijiu khiu masan khai-e,
  Palungsiat se aleng buide.

CH: |
  (Chorus)
  Aleng aleng palungsiat se aleng buide. (2x)

V2: |
  2. Palungsiat se aleng buide! 
  Sise I niu patu malumjiu silude;
  Kapingbo thak gasu atu khipad khaide,
  Palungsiat se aleng buide.

V3: |
  3. Palungsiat se aleng buide! 
  Aluni hina pikhaijiu majang khaine; 
  Shaijiu bamdi pakhu ga chalui thiu bamne, 
  Palungsiat se aleng buide.

V4: |
  4. Palungsiat se aleng buide! 
  Thoidam daobo tingmik chalui kasan thiune; 
  A wang piutu thuanbo luisan thiujiu bamne, 
  Palungsiat se aleng buide.

Translation: "(His Grace is Sufficient for Me)"

Category: "Assurance & Testimony"

