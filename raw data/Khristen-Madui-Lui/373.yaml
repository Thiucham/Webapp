ID: "373"

Title: "JORDAN GIUGEN GA I CHAP JIU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jordan giugen ga I chap jiu,
  Khuan lulak jiu phui bam;
  I niu wang rabo canaan ram,
  Kawibo dih se-e

CH: |
  (Chorus)
  Charam kawibo ga aliu saone,
  Jordan giu genlam kenpat lusai;
  Milypoi nai Mose lui kawibo thiune,
  Jesu nai bamne tingtheng jiu.

V2: |
  2. Kadih ramjing pakhiangna se,
  Tingtheng benjiu bamne;
  Panah piu Jesu niu m'wang ne,
  Tamiubo bam lakge.

V3: |
  3. Dedao niu siga wangtang jiu,
  Tingtheng thuan bam ralo;
  Debo nai apiu lun ngaojiu,
  Papam ga bam ralo.

V4: |
  4. Mathabo niu alung fui-e,
  Haiga bam theng lakge;
  Jordan giu duise di bamdi,
  I ping makjiu kenne.

Translation: "(On Jordan's Stormy Bank)"

Category: "Aspiration after Heaven"

