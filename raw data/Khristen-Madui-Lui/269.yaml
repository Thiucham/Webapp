ID: "269"

Title: "KHRISTEN MAI KADEN BAMLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Khristen mai kaden bamlo,
  Tadiu damjiu bam tulo;
  Chari ruangga nang bamme,
  Kadenlo!

V2: |
  2. Kasabo pumtan seniu,
  Nang kaden makbo tingga;
  Natu hom magui wangne,
  Kadenlo!

V3: |
  3. Tinggen ripon khai lujiu,
  Pawan machang sing bamlo;
  Satan seniu lin bamme,
  Kadenlo!

V4: |
  4. Chari ngambo khuan kinglo, 
  Hozam khuan kangin bamme; 
  Mathabo khuan niu shen-e, 
  Kadenlo!

V5: |
  5. Na Rapiu khuanse kinglo, 
  Paniu natu lungsa-e; 
  Paniu kadinbo phunglo, 
  Kadenlo!

V6: |
  6. Naronna kaden silo, 
  Naimachang pasai suilo; 
  Kawi pikhaira khenglo, 
  Kadenlo!

Translation: "(Christian Seek not Yet Repose)"

Category: "Conflict & Victory"

