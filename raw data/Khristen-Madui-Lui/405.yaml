ID: "405"

Title: "JERUSALEM AKY WIBO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jerusalem aky wibo,
  Situ I maning-e;
  Dedao niu chariubo sao jiu,
  Amanbo ngao ralo?

V2: |
  2. Kachia niu alon khaibo ky,
  'Puiki di kachia-e;
  Juringbo niu rengnam khaibo,
  Dedao niu ngao ralo?

V3: |
  3. De donniu chariubo khengjiu,
  Achunsa bam ralo;
  Canaan ramse wangtang dasai,
  Tingtheng aman bamne.

V4: |
  4. Rapiu khuga tadrai mimai, 
  Rankhaipiu pamga bam; 
  Khrista ga aka aphenmai, 
  Tingtheng aman bamme.

V5: |
  5. Jerusalem aky wibo, 
  Situ ramgun bamme; 
  Aten rabo tenloi dasai, 
  Matha mala bamne.

Translation: "(Jerusalem My Happy Home)"

Category: "Aspiration after Heaven"

