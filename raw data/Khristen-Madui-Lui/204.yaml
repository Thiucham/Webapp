ID: "204"

Title: "SINGCHAI TU I ZUAN WANG-E"

Key: "G"

Time signature: "3/4"

V1: |
  1. Singchai tu I zuan wang-e,
  Miktiatbo nuan phungmai-e;
  Kasa hina thuan lujiu,
  Rankhaibo se I lune.

CH: |
  (Chorus)
  I malumme a Rapiu,
  Calvary milypoina;
  Singchai ga wang kahumme,
  Jesu atu rankhailo.

V2: |
  2. Jesu tu I ramgun ne,
  A nuan hina kuak khaira;
  Jesu niu akhu din-e,
  Na nuanse masan khaide.

V3: |
  3. Agu kabambo hina, 
  Kadih pot nai akamai; 
  Apum nai ahiupuina, 
  Tingtheng jiu nagu thiulo.

V4: |
  4. Jesu akhu wangkiu sai, 
  I di pakum masanne; 
  Atu khiu masan khaine, 
  Milypoi tu thuan bamne.

Translation: "(I am Coming to the Cross)"

Category: "Response & Repentance"

