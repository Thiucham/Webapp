ID: "274"

Title: "CHAP BENLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Malong lamniu tacham wibo, 
  Make niu kubo khuanse;
  Kinglo majibo wibo cham, 
  Aliu maihina leng-e.

CH: |
  (Chorus) 
  Chap benlulo chari thiura, (2x)
  Kinglo make khuan saisui;
  Kangjang tadlo tadlo khristen riphendung.

V2: |
  2. Chawang riphen puan piu lujiu, 
  Kendi pengphai pon kulo;
  Maji raleng chalad bamme, 
  Maza niu akhe bine.

V3: |
  3. Make khuanse mud khailo, 
  Chari se aphen sune;
  Wahina se Jesu leng-e, 
  Aliu niu ngam sangjing ne.

Translation: "(Fall into Line)"

Category: "Conflict & Victory"

