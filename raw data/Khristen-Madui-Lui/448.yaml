ID: "448"

Title: "JESU JERICHO KENNE"

Key: "E"

Time signature: "⚪"

V1: |
  1. Jesu Jericho kenne singchai tu ken wang kin,
  Kamaomai don ganiu Tingwang pah natu langkiu;
  Kadih ga chariu miktiat paphi paben samai,
  Lungsa jiu tuhoi ku-e Jesu paliu leng wang.

CH: |
  (Chorus)
  Rapiu I malum tuhoi amik ngao khailo,
  Jericho Khrista atu dinlo ringbo 'pui.

V2: |
  2. Jesu Jericho kenne miktiat piupah chunwi,
  Pah kadih mania kheng mak pah wa ngao suira kheng;
  Pawan kawi siga paleng juringbo daode,
  Rapiu I wa ngao ni-e lungsa khaira kheng-e.

V3: |
  3. Jesu Jericho kenne tuhoi di ken wang-e,
  Na nuanse phut khai lujiu pakhu ga kheng lulo;
  Patu malumjiu kulo pah haibo 'pui wangne,
  Thainai Jericho Khrista niu natu gukhaine.

Translation: "(Jesus Passed Through Jericho)"

Category: "Special songs"

