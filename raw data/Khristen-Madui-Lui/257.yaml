ID: "257"

Title: "I NATU KUNGDIANG-E RAPIU "

Key: "C"

Time signature: "4/4"

V1: |
  1. I natu kungdiang a Rapiu,
  Kadih chunwi tu suang;
  Nang niu amanbo pikhai-e,
  Maidi pikhai silak.

CH: |
  (Chorus)
  Wadao di dintang silakge,
  Matha pibo lungsiat;
  Wadao di dintang silakge,
  Pazai niu masan khai.

V2: |
  2. Akhu mana diangbo si-e,
  Kadih mania suangdi;
  Nang cham suang widiangbo hah-e,
  Wibo lui suangdi wi.

V3: |
  3. Achunwira nang niu pikhai, 
  Achun wijiu bamra; 
  Nalungsiat niu makjiu kimlak, 
  Achun wirabo leng.

V4: |
  4. He! atu Rankhaipiu Jesu, 
  Dejiu chunwi gulo! 
  Ringbo pirun daolu saira, 
  Nakhu ga bam mine.

Translation: "(I know I Love Thee Better Lord)"

Category: "Love, Joy & Peace"

