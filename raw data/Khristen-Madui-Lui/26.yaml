ID: "26"

Title: "MASANBO CHUNDING GA"

Key: "B"

Time signature: "6/8"

V1: |
  1. Masanbo chunding ga;
  Masim rim rim bam ga,
  Ngenah tu pa pui niu pam lu
  Masanbo ngena chunwi;
  Ji bamme ngena se,
  Agimanai jiu bam.

V2: |
  2. Masanbo chunding ga;
  Tamiubo ha mide,
  Benbo gase chalui  thiu bam
  Tingwang kendibo thuan bam;
  Rankhaipiu khrista se,
  Pachang jiu manade.

V3: |
  3. Masanbo chunding ga;
  Tingwang nahpiu lungsiat,
  Masanbo nazu biu se niu
  Nsuan lungsiat kawibo;
  Rapiu Jesu lung wang,
  Rapiu Jesu lung wang.

V4: |
  4. Masanbo chunding ga;
  Maisuang habo gan biu,
  Mazadung niu chalui thiu bam
  Halleluyah thuan bamlo;
  Rankhaipiu khrista se,
  Pachang jiu manade.

Translation: "(Silent Night)"

Category: "Christmas"

