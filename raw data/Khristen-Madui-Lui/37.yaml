ID: "37"

Title: "I NIU PATU LUNGSA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kadih mania alungga hamilo,
  Tuhoira tazai pen niu masande;
  Singchai ga alung magenthiu khaibo,
  Jesu zai masanbo niu khiu masan khaide.

CH: |
  (Chorus)
  I niu patu lungsa paniu lungsa raijiu;
  Calvary luang ganiu atu rankhai mide.

V2: |
  2. A nuan gasu I diujiu bambo ga,
  Kasabo nuan vang thiujiu bam gasu;
  Tingwang lungpom tu daora ping bamga,
  Tuhoira Jesu zai niu khiu masan lude.

V3: |
  3. Atu bangjiu bambo tuhoi phutde,
  Amik tiat bambo tuhoi ngao lude;
  Shaibo gasu Tingwang ga ringlande,
  Paniu pikhaibo manaibo cham din khailo.

Translation: "(I Love Him)"

Category: "Christ life & Love"

