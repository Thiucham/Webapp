ID: "68"

Title: "SINGCHAI GA"

Key: "F"

Time signature: "6/8"

V1: |
  1. Atu khailo cross mungga, 
  Ringbo duipok gase;
  Paman kungbo ringbo dui, 
  Calvary 'su luang kiu.

CH: |
  (Chorus) 
  Singchai ga singchai ga, 
  A kendi jiu bamne;
  I niu ringsu lan makthen, 
  Mathakbo giugen lam.

V2: |
  2. Singchai mun ga chariubo, 
  Atu lungsa khailo;
  Siga nsuan ganbiu seniu, 
  Pabiu thaoben bamme.

V3: |
  3. Tingwang nah milypoina, 
  Nang asuang ga wanglo;
  I niu tadbo bam machang, 
  Atu majang khailo.

V4: |
  4. Singchai tu I phui bamme, 
  Malum jiu khuan bamme;
  Kachia ram wang tang makthen, 
  Kabenbo giugen lam.

Translation: "(Near the Cross)"

Category: "Humiliation, Resurrection & Glory"

