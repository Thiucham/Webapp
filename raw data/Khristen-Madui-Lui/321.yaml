ID: "321"

Title: "JESU LENG LUNG NE"

Key: "F"

Time signature: "4/4"

V1: |
  1. Majibo ringting Jesu leng lungne;
  Pachun kim khaira I khengjiu lung ne;
  Kasabo lungchun situ phut lujiu,
  Haise aleng thoidam mpui se-e.

CH: |
  (Chorus)
  Rapiu Jesu I haitu nang chunbo thiululo,
  Nang kadihga kalung ting nang niu aleng shaikhai;
  I natu malum ne pakendibo Rapiu,
  Thainai gasu ating katang naten thiujiu lungne.

V2: |
  2. Aleng shaikhaibo Jesu leng lung ne,
  Calvary ga a nuan hina phung khai;
  Sibo lungsiat seniu atu pao khai,
  Agu pakhiangna pakhu pikhai ne.

V3: |
  3. Tadkhaibo 'naga Jesu leng lungne, 
  Wahina masanbo zan ga tenne; 
  Chariu magen thiubo tu ping makjiu, 
  Agu singchai phungjiu pasai suine.

V4: |
  4. Dunbo ringting ga Jesu leng lungne, 
  Pazubiu benbose aleng withu; 
  Hami maitu rankhaira Pah shaikhai,
  Pakhuga mathak raleng puiwanglo.

Translation: "(Living for Jesus)"

Category: "Songs of pilgrimage"

