ID: "212"

Title: "TINGWANG NIU ALIU LAM LIANG KHAISAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. He! mathalo Rapiu lungsiat se senkhe,
  Bangbo riangse khipad khaide;
  Pa zainiu rankhai aliu pingra hade,
  Jesu aliu maihina leng.

CH: |
  (Chorus)
  Tingwang niu aliu lam liang khai saira.
  Aliu lam liang sai saoniu 'liutu ngamra?
  Sao sao sao?
  Aliutu saoniu ngamlu ralo?

V2: |
  2. Rapiu ga chapjiu pakendi tu thuanlo,
  Nai machang matip jiu chaplo;
  Kawibo niu kasa hinatu ngamra,
  Paniu pumtan pikhai bine.

V3: |
  3. Pacham jailo palad rianse maolakge, 
  Khrista zan niu ngamne, Amen, 
  Kadih hahmidi paladse halakge, 
  Paladse raokhai lan lanne.

V4: |
  4. Rapiu khu bamsai paniu gukhai bine, 
  Karingbo ting loiwang dasai;
  Suan thubo hiuna situ paben gasu,
  Wakamdi kam mahah lakge.

Translation: "(If God be for Us)"

Category: "Christian fellowship"

