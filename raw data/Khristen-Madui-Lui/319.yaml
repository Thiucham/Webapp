ID: "319"

Title: "KHANGSIA MAI"

Key: "D"

Time signature: "9/8"

V1: |
  1. Khangsia mai kawi ten thiu-e, 
  Pakah maileng pikhai jiu bam;
  Khangsia mai matha lui thiubam, 
  Marin ting piben khaijiu bam.

CH: |
  (Chorus) 
  Khangsia mai se nang ma? (2x)

V2: |
  2. Khangsia mai kungbo kalen thin, 
  Tachun wijiu bang rip phung-e;
  Khangsia mai Khrista lungsiat din, 
  De chiujiu pah shaimi gulo.

V3: |
  3. Khangsia mai kawi maning jiu, 
  Paliu chunwi jiu pikhai-e; 
  Khangsia mai chari aphenjiu, 
  Hujiu majibo ga chapbam.

V4: |
  4. Khangsia mai makejiu bamme, 
  Karingting gu wattu simak; 
  Khangsia mai kajit mahajiu, 
  Kamao boga lung khaijiu bam.

V5: |
  5. Khangsia mai kabenbo niu phui, 
  Chun tamiubo 'puise hakhai; 
  Khangsia mai chunwi manai bam, 
  Paringting wadaodi thin lak.

Translation: "(Somebody)"

Category: "Christian service & Reward"

