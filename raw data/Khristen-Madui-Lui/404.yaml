ID: "404"

Title: "ADAO JIU MATHAK NE"

Key: "G"

Time signature: "3/4"

V1: |
  1. Charapen kasan penbo ram,
  Wadaodi kuilan lakge;
  Tamiubo tingpuk di benne,
  Wadaodi tamiu lanlak;
  Chunsamai chunwi misune,
  Mathabo ken tingtheng ne;
  King wibo lui thiujiu bamne,
  Tingtheng masanbo lui thiu.

CH: |
  (Chorus)
  Adao jiu mathak sune,
  Masanbo thoidam lujiu;
  Adao ne wibo genga,
  Tadrai mibo kungbo mai.
  (Repeat 1st and 2nd lines)

V2: |
  2. Chalungsabo niu phuibo ram,
  Pawan hai mana wang-e;
  Kuilan makbo rapen niu fui,
  Pawan machang san benne;
  Lungsabo chunwi daobo ga,
  Wadaodi lungsa makbo;
  Nahmai tu masenbo kumjiu,
  Tingtheng lungsa jiu bamne.

V3: |
  3. Tingtheng kuilan makbo ramga,
  Haibo ringting loi dasai;
  Nuan gu shaibo tu ngam lujiu,
  Chamang di manlan lakge;
  Panah papui tu daobo kum,
  Papiu panah tu dao' kum;
  Ramjing ga ronmeng mi maidung,
  Kakung mai wang aruang ne.

Translation: "(We Shall Meet and Rest)"

Category: "Aspiration after Heaven"

