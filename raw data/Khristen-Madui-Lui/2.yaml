ID: "2"

Title: "RANPADBO RACHAM"

Key: "E"

Time signature: "6/8"

V1: |
  1. Maisuang habo ranpadbo racham.
  Naleng aleng dejiu wilo!
  Tasing riga Jesu shai khaibo.
  Nang I aliu mathiu leng-e.

CH: |
  (Chorus)
  Malumlo nuan phungmai malumlo,
  Palingbo cham hai ngen khailo;
  Singchai ga shai piutu malumlo.
  Malumlo rankhaibo piutu.

V2: |
  2. Juring lude kashaibo ganiu,
  Tingwang nah aliutu lungsa;
  Nuan phungmaileng duiking luang khai-e.
  Pazai niu khiu masan raleng.

V3: |
  3. Kahiambo niu chariujiu bambo,
  Na nuan siniu ngamlu lakge;
  Jesu niu lungsajiu rankhaibo,
  Nuan gu pumtan si hah khai-e.

V4: |
  4. Ngen khailo a Rapiu lungsabo,
  Thai nai wang khailo Jesu ga: 
  Rapiu khulam zuanwang maidung tu,
  Wadao khatdi phutlan lakge.

Translation: "(Redemption)"

Category: "Grace, Redemption & Love"

