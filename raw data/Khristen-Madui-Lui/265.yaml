ID: "265"

Title: "CHAPLO CHAPLO JESU LENG"

Key: "B"

Time signature: "4/4"

V1: |
  1. Chaplo chaplo Jesu leng,
  Singchai riphen naliu;
  Ngambo pengphai pon kulo,
  Ha makra matanlo;
  Chari thiubo bam machang,
  Pariphen tu june;
  Charimai tu ngamlu jiu,
  Khrista chawang thiune.

V2: |
  2. Chaplo chaplo Jesu leng,
  Make khuan saisui jiu;
  Chari thiubo bam gase,
  Pakendibo tingga;
  Naliu paten ten bamlo,
  Tenlo chari thiudi;
  Manang makjiu chap bamlo,
  Tan hujiu masun lo.

V3: |
  3. Chaplo chaplo Jesu leng, 
  Papum tan pen ganiu;
  Napumtan niura ngamlak, 
  Natu malum mitu; 
  Kawibo cham phung lujiu,
  Kaden jiu kheng bamlo;
  Tenra leng kuwang saira, 
  Dao lakjiu bam mane.

V4: |
  4. Chaplo chaplo Jesu leng, 
  Chari thiu theng lakde; 
  Thai chari thiubo khuan chiu, 
  Suannai ngambo luithiu; 
  Chari ngam maidung lengra, 
  Ringbo pirun pine; 
  Paken dibo chawang nai,
  Tingtheng ring chambamne.

Translation: "(Stand Up for Jesus)"

Category: "Conflict & Victory"

