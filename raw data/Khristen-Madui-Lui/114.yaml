ID: "114"

Title: "CHALUI KASANBO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Mathabo lui I maning jiu thiune,
  Thingna dung chunwi jiu marabo kum;
  Mathabo lui I chiulu achunwi ye,
  Tamiubo bamga naimik thaokhai bo kum.

CH: |
  (Chorus)
  Chalui kasanbo, (2x)
  Tuhoi I thiune senlo rankhaibo;
  Pakendi chamtan paniu chawang thiune,
  Kamshat mibo milypoi tu thuanlo.

V2: |
  2. Matha malajiu I bamne tingtheng,
  Kawibo piuniu mathabo pine;
  Chabam kaden khaine malummai lengra,
  Chakhuan manuan jiu kujiu bamme natu.

V3: |
  3. Kaben boky ga I wang lungsu ne,
  Tamiubo ramtu I saodia lujiu;
  Kapingbo nai tamiubo hina bamdi,
  Pahniu kabenbo mpuiki thaokhai ne.

Translation: "(The New Song)"

Category: "Praise & Opening"

