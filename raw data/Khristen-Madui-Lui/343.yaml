ID: "343"

Title: "HAI WIBO ALENG-E"

Key: "D"

Time signature: "4/4"

V1: |
  1. Agimanaibo se tadui kum luang bam,
  Chunsabo se wang bam liudi;
  I sira leng se nangniu kati khailo,
  Ahiupuina leng ra wibo-e.

CH: |
  (Chorus)
  Hiuna leng wibo-e,
  Ahiupuina leng ra wibo-e.

V2: |
  2. Satan niu alungchun kam chariu bamdi,
  Tacham wibo aleng dinkhai;
  Khrista kiubo hai azeng tan raleng-e,
  Achengsa donniu pazai luang khai.

V3: |
  3. A nuan kuak khaibo tu I makumbo ga, 
  Dejiu kha chunwibo gulo!
  Nuan pakhiang na singchai ga gian khaimide, 
  Ahiuna a Rapiu tu thuanlo!

V4: |
  4. Khrista se aleng-e aleng-e ringra, 
  Jordan giuse dibam liudi;
  Alung pubo leng wakhat dibam lakge, 
  Ahiuna nang niu din khai-e.

V5: |
  5. Rapiu nang wangrabo tu aliu khuan bam, 
  Tinggen ga I wangtang makthen; 
  Tinggen make khuanse I niu chiu dasai, 
  Ahiupuina leng dejiu wira!

Translation: "(It is Well With My Soul)"

Category: "Assurance & Testimony"

