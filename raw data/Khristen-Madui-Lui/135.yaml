ID: "135"

Title: "NANG THAINAI TADPAD SURAGA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Nang thainai tadpad sura ga,
  Singkhaibo bamma?
  Rapiu Jesu Khrista zan ga,
  Natu lungsa khai raleng-e; 
  Thainai tingmik leng.

CH: |
  (Chorus)
  Nadon wikhai ra kheng lulo,
  Khengbi sai kali lubui;
  Chunsa zengsabo wang dasai,
  Sing mangai mane.

V2: |
  2. Nakhu kahiambo wangbo lon,
  Singkhaibo bamma?
  Naleng shaikhai bibo jeng niu,
  Masanbo hiupuina khuga;
  Nang nbai bamma?

V3: |
  3. Lungpomse nakhu wangbo lon,
  Singkhaibo bamma?
  Nasingnah maitu lungsa jiu,
  Khat khat tu kuak khaijiu bamra;
  Kaden jiu bamma?

V4: |
  4. Chunsabo nakhu wangbo lon,
  Singkhaibo bamma?
  Nalung chariu jiu bambo ga,
  Gilead gu chapiuse naleng;
  Kadenlu dama?

Translation: "(Ere You Left Your Room)"

Category: "Prayer meeting & Revival"

