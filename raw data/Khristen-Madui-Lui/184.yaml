ID: "184"

Title: "MATEN KUMJIU "

Key: "A"

Time signature: "4/4"

V1: |
  1. Aliam ram sabo jengniu,
  Natu maten tadmide;
  Natu koina maten tadmid mid mide.
  Duipui duiliu tadbo ga,
  Natu maten tadmide;
  Natu koina maten tadmid mid mide.

CH: |
  (Chorus)
  Pingbo duipui gu tamiubo ga natu maten mide,
  Rapiu gu lungsiat gasu niu maten mide;
  Tamiubo pingbo bamg,
  Natu koina maten tadmid mid mide.

V2: |
  2. Chaky lam benbo seniu,
  Natu kachan khaijiu bam;
  Natu koina maten tadmid mid mide.
  Aliam saophung gasu niu,
  Natu maten tamide;
  Natu koina maten tadmid mid mide.

V3: |
  3. Chaky lam kubo khuanse,
  Chiuta midmid wang mide;
  Natu koina maten tadmid mid mide.
  Singnah yo ribam talo,
  Nagu aliam tai sulo;
  Tuhoi tai lumaksai tingtheng hamine.

Translation: "(Drifting Down)"

Category: "Invitation & Baptism"

