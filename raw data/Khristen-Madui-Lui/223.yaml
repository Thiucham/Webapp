ID: "223"

Title: "SUI TADNE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Taning maluang ga taddi Jesu sai suine,
  Charapen rimwibo duilim luangbo bamga;
  Atu majang khaibo bam machang I suitad ne,
  Pasai suine chawang pirun lu makthen.

CH: |
  (Chorus)
  {Suine suine Jesu sai I suine,
  Paniu tad khaibo bam machang I suine. (2x)}

V2: |
  2. Taning maluang ga taddi Jesu sai suine,
  Tingthung malang jiu tadui kasuak bam liudi;
  Paben niu atu jusai I wadi ping lakge,
  Paniu atu majang sai manang lakge.

V3: |
  3. Taning gadi maluang tonlam khangra gadi,
  Ahiupuinah se rankhaipiu khuga bamne;
  Thiukaniu hajiu paniu atu majang khaine,
  Tingwang ky wibo ga aman bam mine.

Translation: "(Follow On)"

Category: "Driving guidance & Protection"

