ID: "320"

Title: "HAISE MALABO MPUIKI MAKGE"

Key: "E"

Time signature: "3/4"

V1: |
  1. Tinggen zuanbo puiki, 
  Haise malabo makge;
  Sibo 'pui chariubo niu fui-e, 
  Sibo puiki lui kungdi Khrista niu khakhai ne;
  Pah bamsai nai machang chunwi-e.

CH: |
  (Chorus) 
  Tinggen 'pui sira mala mak, (2x)
  Chiudi Rapiu atu julo;
  Atu thao benlo,
  Apot ripbo masin khailo.

V2: |
  2. Sibo 'pui mala mak, 
  Kamaobo nai chariubo;
  Kapingbo niu fui sibo puise, 
  Jesu aliutu gu bamme Kapingbo gase;
  Aliu pot di kam masin khaine.

V3: |
  3. Tabin tadga chariu, 
  Wa kakeng dao bam liudi;
  Alung chariubo wajiu daodi, 
  Chunwibo namdi ga wang lung mibo nai saira;
  Matha chunwi jiu lung bam mine.

Translation: "(It is not an Easy Road)"

Category: "Songs of pilgrimage"

