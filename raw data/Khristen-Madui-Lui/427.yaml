ID: "427"

Title: "NAIMIK BIUNIU BENBOGA TADLO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Naimik 'biuniu benbo wibo ga tadlo,
  Nsuan rapen nai kajik dui kiubo ga;
  Tingmik machang suang lam zuan jiu tad sukhe,
  'Pui machang pasai suikhe.

CH: |
  (Chorus)
  Suilo aliudi sui sune,
  Suilo Jesu sai suilo;
  Suilo natu jukhai sune,
  'Pui machang pasai suikhe.

V2: |
  2. Tamiubo ga bamdi benbo ga bamdi,
  Mathajiu thiulo a Rapiu masan ne;
  Rankhaibopiu niu kubam-e wang sulo,
  'Pui machang pasai suikhe.

V3: |
  3. Kachia niu benbo gadi tamiu gadi,
  Kahiambo niu tan bamdi pawan machang;
  Loibo tingmik tangjiu palad malumlo,
  'Pui machang pasai suikhe.

Translation: "(Walking in the Sunshine)"

Category: "Christian mission"

