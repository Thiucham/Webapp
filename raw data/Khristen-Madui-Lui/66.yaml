ID: "66"

Title: "RUN KHAILO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Magenthiubo piu kendise, 
  Masan maidung wang phuilo;
  Chari ngamjiu malan wangde, 
  Patu mathiu kahum lo.

CH: |
  (Chorus) 
  Runkhailo Tinggen mazadung, 
  Rankhaipiu tu runkhailo;
  Chawang hina dung gu chawang-e, 
  Chawang pirun runkhailo.

V2: |
  2. Chari ngambo piu pirunse, 
  Masan maidung run khailo;
  Chawang bam ga pi 'tao khaijiu, 
  Tinggen bangse biu bamme.

V3: |
  3. Nuan phungmai dung a Rapiu tu,
  Mainui raleng run khai-e;
  Masanmai nai maza dung niu,
  Wangjiu patu thuan bamme.

V4: |
  4. Kinglo chari ngambo khuan se.
  Dejiu wilo thuanbo lui;
  Jesu niu kangambo thiude,
  He! dejiu matha gulo.

Translation: "(Crown Him)"

Category: "Humiliation, Resurrection & Glory"

