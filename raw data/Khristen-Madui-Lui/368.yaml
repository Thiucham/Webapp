ID: "368"

Title: "RAMNARABO CHAMDIN LAKGE"

Key: "B"

Time signature: "6/8"

V1: |
  1. Aka maitu majang chunwidi,
  Pawan hanuang mine;
  Chunsa jengsa jiu kap bambo di,
  Pating hanuang mine.

CH: |
  (Chorus)
  Ramna rabo cham dinlakge,
  Tinggen namdi gase;
  Matha mala bambo ramga,
  Ramna lanbo ha-e.

V2: |
  2. A maning mai shaibo giu kensai,
  Dejiu chunwi ralo;
  Kadih piri ten hai loi dasai,
  Tinggen lam aruang ne.

V3: |
  3. Siga ramna bo cham dinlakge,
  Tinggen dih wibo ga;
  Matha malabo luise thiujiu,
  Tingtheng aman bamne.

Translation: "(We'll Never Say Goodbye)"

Category: "Aspiration after Heaven"

