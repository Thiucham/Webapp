ID: "199"

Title: "RAPIU I WANG-E"

Key: "A"

Time signature: "4/4"

V1: |
  1. Tingwang gasu taddiu lujiu, 
  Tuhoi I wang-e;
  Nuan puilam I tadtheng jude, 
  Rapiu I wang-e.

CH: |
  (Chorus) 
  I wang-e chaky lam, 
  Ronmeng lan lakge;
  Lungsa jiu atu lulo, 
  Rapiu I wang-e.

V2: |
  2. Takum watheng ronmeng lujiu, 
  Tuhoi I wang-e;
  Tuhoi alung lilan lujiu, 
  Rapiu I wang-e.

V3: |
  3. Nuan ga tad thengjiu chariu-e,
  Tuhoi I wang-e;
  Nalungsiat tu malum lujiu,
  Rapiu I wang-e.

V4: |
  4. Alung hiupuina magenthiu,
  Tuhoi I wang-e;
  Pumtan tachun kasan pilo, 
  Rapiu I wang-e.

Translation: "(Lord, I am Coming)"

Category: "Response & Repentance"

