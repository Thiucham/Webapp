ID: "160"

Title: "KHAM LE MANGALO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Jesu niu kham maganne,
  Natu juring ra ku-e;
  Ten chariu maidung wanglo,
  Kham le ma ngalo.

CH: |
  (Chorus)
  Kham le ma ngalo, (2x) 
  Paronna juring ngamme,
  Kham le ma ngalo.

V2: |
  2. Juring piu kham maganne,
  Nang ringra paniu shaikhai;
  Kashaitu ngambo piu-e,
  Kham le ma ngalo.

V3: |
  3. Jesu kham magan bamme, 
  Nalung lekhailo tuhoi; 
  Nachun wirabo leng-e, 
  Kham le ma ngalo.

V4: |
  4. Jesu niu kham maganne, 
  Juring bose nawang-e; 
  Rankhaipiu tadmi sune, 
  Kham le ma ngalo.

Translation: "(Open Wide the Door)"

Category: "Invitation & Baptism"

