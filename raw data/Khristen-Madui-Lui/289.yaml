ID: "289"

Title: "ALIU MIKNIU NGAOTANG MAKBO"

Key: "C"

Time signature: "4/4"

V1: |
  1. Ngao tang makbo namdih kawi khat bamme,
  Kadih muang jiu kabambo rilamse;
  Jesu niu gukhai mainah dung niu ngao-e,
  Sibo ramga king wibo lui khuan chiu.

CH: |
  (Chorus)
  Aliu mikniu ngao tang makbo,
  Chariubo kadih racham;
  Sibo genlam ben jiu bamme,
  Masan maidung lungbo ky.

V2: |
  2. Tinggen namdih se wadao di kui lakge,
  Khrista milypoi niu khiu masan khai;
  Wibo benbo pakendibo niu phuibam,
  Tingtheng chari ngambo lui thiu bamne.

V3: |
  3. Shaikhaibo Milypoi chawang bamga taobam, 
  Mily khuanmai niu pazu thiu bamme; 
  Sikamlak paten tenloi lumai dung niu, 
  Homjiu patu thuanbo lui thiu bamme.

V4: |
  4. Kadih ga magenthiubo hiuna dungtu, 
  Kawibo namdih genlam puiwanglo; 
  Siga lungsa maidung khuan jiu mathak bam, 
  Namikdui kiudi thuanta mak bamlo.

Translation: "(Beyond Our Sight)"

Category: "Comfort in sorrow"

