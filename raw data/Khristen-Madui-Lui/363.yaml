ID: "363"

Title: "I MANING-E TINGGEN KYTU"

Key: "A"

Time signature: "4/4"

V1: |
  1. I maning-e Tinggen ky tu,
  Duidi gen kabenbo lam bambo;
  Masan maidung se shailan lakge,
  Paliu puanse kabun kumme.

CH: |
  (Chorus)
  Tinggen lam tinggen lam,
  I maning-e Tinggen ky tu;
  {Tinggen lam, (3x)}
  I maning-e Tinggen ky tu;

V2: |
  2. Aka maidung tu maning-e,
  Aliu suang tadrai mimai dungtu;
  Paliu niu a Rapiu ky gasu,
  Chalui thiubo khuanse chiu-e.

V3: |
  3. Rankhaibopiu siga bamme,
  Amaning maidung siga saobam; 
  Chariubo gu hina saolujiu, 
  I di sigase tad mine.

V4: |
  4. Sibo ramga I tad mine, 
  Aringting loisai pazu ngaone;
  Lungsamai sibo ramga bamme,
  I wang rabotu khuan bamme. 
  Tinggen lam tinggen lam, 
  Sibo ramga I tad mine; 
  {Tinggen lam, (3x)}
  Sibo ramga I tad mine.

Translation: "(The Home Over There)"

Category: "Aspiration after Heaven"

