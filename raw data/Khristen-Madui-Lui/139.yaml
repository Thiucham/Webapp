ID: "139"

Title: "WAHINAGA JESU AGU"

Key: "A"

Time signature: "6/9"

V1: |
  1. Wahina ga Jesu agu, 
  Ringting chunwi hina;
  Nai machang pah agu pumtan, 
  Jesu maksai kaone;
  Chunsabo ga I pakhu wang,
  Maikhat niudi kimkhai ngammak;
  Chariubo ga matha khai pah aka-e.

V2: |
  2. Wahina ga Jesu agu,
  Pah agu chaka-e;
  Pathoi lura pakhu wangsai,
  Pahniu pikhai bine;
  Pahniu tingnai tingriu pikhai,
  Kachia miusy lura pikhai;
  Wahina pahniu pikhai pah aka-e.

V3: |
  3. Wahina ga Jesu agu, 
  Pakhu maji bamne; 
  I dekamjiu suini makra, 
  Majibo patuse;
  Pasai shuijiu I majine, 
  Nchun 'nien paniu atu phuibam; 
  Naimachang pasai suine pah aka-e.

V4: |
  4. Wahina ga Jesu agu, 
  Wibibo chaka hah;
  I niu tuhoi nai pasaidi, 
  Jesu tu malumne; 
  Patu majangjiu lung bamne, 
  Pamalan thiumakbo ringting;
  Chun wijiu lungne pah agu chaka-e.

Translation: "(Jesus is all the World to Me)"

Category: "Prayer meeting & Revival"

