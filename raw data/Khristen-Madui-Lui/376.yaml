ID: "376"

Title: "TINGTHENG BENBO BAMME"

Key: "B"

Time signature: "4/4"

V1: |
  1. Siga kawibo dih khat bam,
  Nnien suang benbo dih;
  Siga wadao di tamiu mak,
  Ranpao se sibo 'biu.

CH: |
  (Chorus)
  Singchai se aliu phung sai
  Pirun se daolune;
  Sibo ram wangtang dasai,
  Nnien suang ben rabo-e.

V2: |
  2. Siga agimanaibo bam,
  Singgiu kenpat dasai;
  Tingthung tingkai habo ramga,
  Aliu gu chakhiu bam.

V3: |
  3. Siga kendibo ky bamme, 
  Tinggen ram wibo ga; 
  Aliuniu lungsa maidungtu, 
  Wanglo chiu ku bamme.

V4: |
  4. Ramnabo dih hai phut khaira, 
  Tad bamme nai machang; 
  Aliu aruangne tinggen lam, 
  Mathabo kuilakge.

Translation: "(The Bright for Evermore)"

Category: "Aspiration after Heaven"

