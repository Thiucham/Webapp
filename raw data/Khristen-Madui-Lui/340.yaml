ID: "340"

Title: "ATU RANKHAIPIU "

Key: "A"

Time signature: "9/8"

V1: |
  1. Atu Rankhaipiu tu thuan ne,
  Pah atu dejiu kunglo;
  Singchai ga paniu shaikhaibo,
  A nuan hina di kuakkhai.

CH: |
  (Chorus)
  He! thiulo Rankhaipiu lui wi,
  Pazai niu atu liu khai;
  Singchai ga a nuan kuak lude,
  Apaw phung hina rui khai.

V2: |
  2. Maisuang habo racham dinne,
  Pah atu juring khai-e;
  Paniu lungsabo din ngamlak,
  Matha atu rankhai-e.

V3: |
  3. Rankhaipiu tu I thuan bamne, 
  Papumtan tu I dinne;
  Kashaibo nuan charuidih tu, 
  Papumtan niu ngam khai-e.

V4: |
  4. Atu rankhaipiu tu thuanne, 
  Tinggen kakungbo aleng;
  Shaibo ganiu piring khai-e,
  Tingwang nah nai lung bamne.

Translation: "(My Redeemer)"

Category: "Assurance & Testimony"

