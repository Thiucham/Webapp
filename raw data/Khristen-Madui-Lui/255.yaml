ID: "255"

Title: "AHIUPUINA KUNGBO JESU "

Key: "C"

Time signature: "4/4"

V1: |
  1. Ahiupuina kungbo Jesu, 
  Nalungsiat tu chunwi jiu thuan;
  Nathoi kawibo pikhailo, 
  I niu natu thuan jiu bamne.

CH: |
  (Chorus) 
  Kawibo nang pikhai lujiu, 
  Kachia namdi se ngao raleng;
  Alungchun hai piben khailo,
  Jesu se Tinggen-e aleng.

V2: |
  2. Kadih gu lungsabo haira, 
  Naliu leng pageng wadi ha;
  Ngao ni jiu natu phiu wang-e, 
  Nazu ngao sai chunwi bamne.

V3: |
  3. Tinggen mathabo phui bamdi, 
  Charapen kawi keng liudi;
  Tinggen mai thuanbo lui thiudi, 
  Nalungsiat kumbo I chiu mak.

Translation: "(Jesus Beloved of My Heart)"

Category: "Love, Joy & Peace"

