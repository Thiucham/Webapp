ID: "166"

Title: "KHRISTA NIU NUAN PHUNG MAITU"

Key: "D"

Time signature: "3/4"

V1: |
  1. Khrista niu nuan phungmai tu,
  Chalungsa jiu kubamme;
  'Puiki tad kamao mai nai,
  Magenthiu bammai wanglo.

CH: |
  (Chorus)
  Patu thuanbo lui thiulo,
  Khrista niu nuan kuak khaine;
  Haise din masan khailo,
  Khrista niu nuan kuak khaine.

V2: |
  2. Wanglo mathak khai sune,
  Malumlo Khrista lad hai;
  Maojiu bam liudi wanglo,
  Khrista niu kuak khaine.

V3: |
  3. Acheng kasa masan khai, 
  Masanbo ga I chapne; 
  Apum karabo kuak khai, 
  Tingtheng leng I masanne.

V4: |
  4. Khrista niu nuan kuak khai-e, 
  Akummai tudi gukhai;
  Achengsa masan lusai, 
  Tinggen ramga I ngutne.

Translation: "(Christ Recieved Sinfulmen)"

Category: "Invitation & Baptism"

