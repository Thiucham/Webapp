ID: "253"

Title: "NACHUNBO THIULO RAPIU "

Key: "F"

Time signature: "9/4"

V1: |
  1. Nachunbo thiulo Rapiu Jesu!
  Nang chali dampao I cha gamme;
  Atu nachunbo thiulo Rapiu, 
  Rapiu I khuan bam nagu thiulo.

V2: |
  2. Nachunbo thiulo Rapiu Jesu!
  Nachunbo thiulo atu thainai;
  Kabun suang kajiu khiu 'san khailo, 
  Nasuang ga khudung jiu kahumme.

V3: |
  3. Nachunbo thiulo Rapiu Jesu! 
  Chariubo hina ga kha khailo;
  Pumtan hinase Rapiu gu-e, 
  Atu di khaijiu piwi khailo.

V4: |
  4. Nachunbo thiulo Rapiu Jesu! 
  Alun lung hina masan khailo; 
  Masanbo hiuna akhu bamjiu, 
  Naimachang atu gukhai khelo.

Translation: "(Have Time Own Way Lord)"

Category: "Consecration"

