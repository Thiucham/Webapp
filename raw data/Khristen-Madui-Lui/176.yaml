ID: "176"

Title: "A RAPIU NIU KU BAMME"

Key: "A"

Time signature: "4/4"

V1: |
  1. Kinglo a Rapiu niu kubamme,
  Chalu ge rabo leng;
  Khuan bamme kachia lu gera leng;
  Tenra maiha bijiu.

CH: |
  (Chorus)
  Lungsa sibo lung phungjiu tadlo,
  A Rapiu zan ganiu;
  Rankhaibo karingbo cham phungjiu,
  Kadihga dinron lo.

V2: |
  2. Tadlo hami maitu ranpad ra,
  Nuan phungjiu bam maitu;
  Tadjiu naliu benniu kha khailo;
  Kahiambo riang khira.

V3: |
  3. Tadlo mathabo ga puiwanglo, 
  Khumkibo ga tiura, 
  Tingtheng karingbo taruak paniu, 
  Naliutu sundaone.

V4: |
  4. Tadlo ting naimik kiuji sune, 
  Kabenbo bam lakge; 
  Kadibo tingmik leng nawang-e, 
  Taten tenlan lakge.

Translation: "(The Master's Call)"

Category: "Invitation & Baptism"

