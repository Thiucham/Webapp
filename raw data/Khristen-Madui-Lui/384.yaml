ID: "384"

Title: "JORDAN GENLAM"

Key: "E"

Time signature: "4/4"

V1: |
  1. Lungsa jiu atu rankhai,
  Rankhaipiu majang suma?
  Malong kubo wibo ram Jordan genlam.
  Aliu saojiu mathak ne,
  Duidi gen kawibo ga;
  Manaibo dibo bamga Jordan genlam.

CH: |
  (Chorus)
  Jordan genlam, (2x)
  Siga aliu dung saone;
  Amanbo duidih genlam
  {Jordan genlam, (2x)}
  Manaibo dibo bamga Jordan genlam.

V2: |
  2. Tamiubo turen tadken,
  Rankhaipiu majang suma?
  Aliu wang lung rabo ram Jordan genlam.
  Nchun sai chami pong seniu,
  Nnien sai kamuang tiang seniu;
  Aliutu majang wang ne Jordan genlam.

V3: |
  3. Pumtan bambo paben niu, 
  Rankhaipiu majang suma?
  Kawibo chunwibo ram Jordan genlam.
  Olive singbang fuibo ram,
  Singgiu tadui wibo ram;
  Mariu chari lan lakge Jordan genlam.

V4: |
  4. Ladren khaibo ram gase,
  Rankhaipiu majang suma?
  Canaan ram wangtang makthen Jordan genlam.
  Nakhu wang lung bam mine,
  Aliutu majang khailo;
  Ramnabo ting loi makthen Jordan genlam.

Translation: "(Over Jordan)"

Category: "Aspiration after Heaven"

