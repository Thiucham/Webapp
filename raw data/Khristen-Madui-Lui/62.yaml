ID: "62"

Title: "KAKUGA PAH LUNGBAM"

Key: "B"

Time signature: "4/4"

V1: |
  1. Jesu Tinggen lamsu kadih ga kiu,
  Nuan gu mangambo ha khaibi ra;
  Papi ga tathu pirun run khai-e,
  Calvary ga pah aleng shaikhai-e.

CH: |
  (Chorus)
  Pah Tinggen ga mawang bamme,
  Nuan gu taniabo hina masan khai,
  Pah Tinggen ga mawang bamme,
  Pah naikhat kiulan sune.

V2: |
  2. Kashaibo mathad situ ngamlu jiu,
  Chunwi ri nga jiu lunglu raleng;
  Pah Tinggen lamsu kiulan bonai sai,
  Pahnah maitu Tinggen maluang wangne.

V3: |
  3. Nuan phungmai Jesu khu wangjiu pao lo,
  Paniu natu juring khai bine;
  Jesu khu wangjiu thoidam dao lulo,
  Siga ngambo ri ngabo ringting bam.

Translation: "(He Lives on High)"

Category: "Humiliation, Resurrection & Glory"

