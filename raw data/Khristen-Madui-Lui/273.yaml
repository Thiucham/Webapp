ID: "273"

Title: "TAMIUBO GANIU KABENBO "

Key: "G"

Time signature: "3/4"

V1: |
  1. Tamiubo ganiu kabenbo, 
  Naimik 'biu benpat raleng;
  Tamiubo ga I bam theng 'de, 
  Siga I bam theng mide.

CH: |
  (Chorus) 
  Jesu atu Rankhaipiu tu, 
  Lungsabo malum buibo;
  Bangbo riangse kamtap khailo, 
  Nang' liutu lungsa khailo.

V2: |
  2. Tuhoi kaben bose wang-e, 
  Jesu aliutu khuan bam;
  Lungsabo khuan niu kubamme, 
  Wanglo nuan tenlan talo.

V3: |
  3. Chariu magenthiubo ronna, 
  Aliu khu bam tuhoi di;
  Taniabo seniu phui bamme, 
  Aliutu juken khailo.

V4: |
  4. Aliu pumtan bambo hina, 
  Nachun ga tadkhai makge;
  Tuhoira nagu kendi ga,
  I chap bamme nasuang ga.

V5: |
  5. Nang niu aliutu rankhai-e, 
  Aliutu phuikhai lanlo; 
  Masanbo hiupuina seniu, 
  Aliutu kati khailo.

Translation: "(Out of Darkness into the Light)"

Category: "Conflict & Victory"

