ID: "102"

Title: "THIULO JESU LUNGSIAT SE"

Key: "A"

Time signature: "9/8"

V1: |
  1. He! thiulo kaguangbo racham,
  Rapiu lungsiat din silak!
  Thiulo Jesu kendibo lui,
  Ranlumai nai thiucham lo.

CH: |
  (Chorus)
  He! thiulo Jesu lungsiat se,
  Pabam machang sen ronlo;
  Tasibo lui thiuluan lan lo,
  Kadihri chiuchia makthen.

V2: |
  2. He! thiulo natu kungbo lui,
  Dinlo Jesu shaibo cham;
  Kuwang khailo zat hina tu,
  Lungsabo Rapiu pamga.

V3: |
  3. He! thiulo ranlumai racham,
  Sibo lui thiuluan lanlo;
  Sanwibo Jesu racham se,
  Maihina ga thiu lanlo.

Translation: "(Sing the Love of Jesus)"

Category: "Praise & Opening"

