ID: "24"

Title: "SIGA PABAM HAYE"

Key: "G"

Time signature: "6/9"

V1: |
  1. Mathak khairabo bam ha, ngena bam ha;
  Matomki gase ha, papi mangiu khai,
  Chun wikhai ra mai ha nuan lam mai simak;
  Chunsabo niu phui-e, si ga pabam ha.

CH: |
  (Chorus)
  Jesu leng pabam ha-e! 
  Patu lukhai lulo;
  Maksai tinggen dih ga sira, 
  Naleng chabam ha-e.

V2: |
  2. Masanmai khatdi ha, pahtu phiu mai ha;
  Chakhuang thiu khaira ha, maikhat nadi ha;
  Rankhaipiu tu phuijiu nuan kuak ramai ha;
  Rapiu khu kheng raleng siga maidi ha.

V3: |
  3. Pahtu lukhai raleng, maikhat nadi ha;
  Pazamsi wikhai ra, chapiu wadi ha;
  Pagu chakhiu chalan lukhaira mai ha;
  Pazu thiu khaira ha, siga maidi ha.

Translation: "(No Room in the Inn)"

Category: "Christmas"

