ID: "429"

Title: "KHRISTA TU MANING MADIRA"

Key: "F"

Time signature: "2/4"

V1: |
  1. Naimik kiu taning lamsu niu wibo cham wang,
  A Rapiu khrista gu kadin piu raleng-e.
  Chalui thiubo khuan niu kadihpiri chiade,
  A Rapiu khrista tu maning madi raleng-e.

CH: |
  (Chorus)
  Chari ngam raleng, (2x)
  A Rapiu niu kubamme;
  Kadih wibo lura palad wibo phunglo,
  A Rapiu khrista tu maning madi raleng-e.

V2: |
  2. Kinglo paliu khuan niu kadihri malai-e,
  A Rapiu khrista gu kadin piu raleng-e;
  Sulo tenlo majibo cham dinjiu shenlo,
  A Rapiu khrista tu maning madi raleng-e.

V3: |
  3. Wanglo chari thiura satan tu aphen ra,
  A Rapiu khrista gu kadin piu raleng-e;
  Wanglo make se ponjiu mudjiu shen sukhe,
  A Rapiu khrista tu maning madi raleng-e.

Translation: "(Loyalty to Church)"

Category: "Christian mission"

