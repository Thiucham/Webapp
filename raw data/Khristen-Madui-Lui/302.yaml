ID: "302"

Title: "CHABEN RUANG I TAD SURAMA?"

Key: "D"

Time signature: "6/8"

V1: |
  1. Chaben ruang I tadsu rama? 
  A Rapiu tu dao raleng;
  Naikhat di paten thiumak jiu, 
  Kangambo lenkhai makjiu.

CH: |
  (Chorus) 
  Chaben ruang I tadsu rama? 
  A Rapiu tu dao raleng;
  Hiuna khatdi puiwang makjiu,
  Chaben ruang I tad rama?

V2: |
  2. Kashaibo tu I ping lakge, 
  A Rapiu niu gukhai ne;
  Chiudi aben ruang dao raleng, 
  Alung magenthiu bamme.

V3: |
  3. Pating katheng lam tad kende,
  Tuhoi I kulan ngamlak;
  Hiupuina phungwang ye saira,
  Mathajiu adao ra gu.

V4: |
  4. Sulo masan maidung hina,
  Pawan bamga ten lulo;
  Kashaibo tingniu nangmak ga, 
  Na hiupuina leng tenlo.

Translation: "(Must I Go an Empty Handed)"

Category: "Christian service & Reward"

