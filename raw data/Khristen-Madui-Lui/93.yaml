ID: "93"

Title: "AHIUNA KUNGBO JESU"

Key: "F"

Time signature: "6/4"

V1: |
  1. Ahiuna kungbo Jesu,
  Na suangga atu khailo;
  Kahiambo seniu tanjiu,
  Duidi khuan kum wang bam ga;
  He! Rankhaipiu gukhailo,
  Kadihga I bam thenna;
  Tinggen tangjiu gukhailo,
  Ahiupuinah lukhailo.

V2: |
  2. Saokhai rabo bam hajiu,
  Ahiupuina zuan wang-e;
  He! phut khai tulo atu,
  Lungsa sibo piu nang-e;
  I niu natu malumme,
  Khakhai raleng I wang-e;
  Chalungsa jiu gukhailo,
  Nakan sung wibo gase.

V3: |
  3. I kungbo Khrista nang-e, 
  Agu kabambo hina; 
  Kao bam maitu jusu khai, 
  Thiu kaniu maitu wikhai;
  Nazan masanbo seniu, 
  Atu pi masan khailo; 
  Nuan nai kamaobo situ, 
  Nang niu chalungsa khailo.

V4: |
  4. Lungsiat niu nakhu phuibam, 
  Anuan hina kuak khailo; 
  Wikhai rabo dui luangbam, 
  Atu khiu masan khailo; 
  Nangra karingbo duipuak, 
  Lungsajiu atu lulo;
  Hiupuina ringrabo leng, 
  Tingtheng chalungsa khailo.

Translation: "(Jesus Lover of My Soul)"

Category: "Praise & Opening"

