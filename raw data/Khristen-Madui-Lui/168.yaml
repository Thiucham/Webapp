ID: "168"

Title: "JESU NIU KU-E"

Key: "C"

Time signature: "6/4"

V1: |
  1. Jesu niu natu manuan jiu ku-e,
  Thainai ku-e thainai ku-e;
  Lungsa bijiu nang detu pak gulo?
  Tad madiu bibi talo.

CH: |
  (Chorus)
  Thainai ku-e thainai ku-e;
  Jesu niu nangtu lungsa jiu thainai kubamme.

V2: |
  2. Chariumai sao raleng Jesu ku-e,
  Thainai ku-e thainai ku-e;
  Nabang phungjiu wangsai khakhai bine,
  Natu ha padmi lakge.

V3: |
  3. Jesu niu khuan bamme wang majadlo, 
  Thainai ku-e thainai ku-e;
  A Rapiu khuga na nuan paokhailo,
  Namen jijiu wang shuilo.

V4: |
  4. Kinglo Jesu niu ku bambo khuanse, 
  Kingjiu bamlo kingjiu bamlo;
  Jesu tu malummai matha sune,
  Sulujiu wang majadlo.

Translation: "(Jesus is Calling)"

Category: "Invitation & Baptism"

