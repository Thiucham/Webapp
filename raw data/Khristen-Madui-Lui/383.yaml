ID: "383"

Title: "MARI PHUILO "

Key: "G"

Time signature: "9/3"

V1: |
  1. Duidi genlam maizu I ngao-e,
  Nsuan naimik 'biu kum atu phui;
  Chariubo gasu kenlu maidung,
  Atu liangri jiu khuanbam siga.

CH: |
  (Chorus)
  Mazuan khai lujiu mari phuilo,
  Lungsa mainiu khuan jiu bambo ga;
  Nsuan naimik 'biu kum thaoben bam,
  Lungsa maidung niu khuan jiu bamme.

V2: |
  2. Apui apiu niu khuan jiu bamme,
  Malee se ramra khuan jiu bamne;
  Lungsa maidung tu puipat raleng,
  Rampung gen gase saokhai raleng.

V3: |
  3. Singnah atanpui tadrai maidung,
  Khangsia wanglan ratu khuan bamne;
  Kabun suang ka maza niu gukhai,
  Lungsa maidung tu khuan jiu bamme.

V4: |
  4. Lungsa maidung wanglo chaky ga, 
  Wanglo chiujiu benjia jiu kubam; 
  Jikdui kum ring ring naimik kum ben,
  Apui yo natu liangri bamme.

V5: |
  5. Ranpao Jesu se benbo ganbiu, 
  Hami maitu liangri jiu khuanbam; 
  Wibo cham paoye ronmeng talo, 
  Jesu niu ku nuan phungmai wanglo.

Translation: "(Looking this Way)"

Category: "Aspiration after Heaven"

