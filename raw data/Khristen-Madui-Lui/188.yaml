ID: "188"

Title: "WIBO KARENG"

Key: "D"

Time signature: "6/8"

V1: |
  1. Jesu karengga aliu leng kheng bam,
  Pareng wibose mai dinsilak;
  Jesu niu kareng tu thaoben khai-e,
  Tingtheng jiu benbo reng thiu khai-e.

CH: |
  (Chorus)
  Kareng situ kawi mainiu masen bamme,
  Kareng se bensao makjiu bamme;
  Atu ranlu ra rengmun lejiu khuan bamme,
  Tingtheng kabenbo wibo reng-e.

V2: |
  2. Karengga Jesu aliu leng kheng bam,
  Apuad phungjiu I patu phiune;
  Tachun wibo cham pakhuga sine,
  Masanbo reng pazu wibo ga.

V3: |
  3. Karengga Jesu aliutu khuan bam,
  Siga niu adao ra khuan bamme;
  Aliutu kubamme thoidam pira,
  I niu sibo rengga wang chapne.

Translation: "(The Beautiful Garden)"

Category: "Invitation & Baptism"

