ID: "303"

Title: "ALIU KADEN BAMGA JESU WANGSUMA?"

Key: "B"

Time signature: "4/4"

V1: |
  1. Taten phizeng janra Jesu kiusai, 
  Nchun nnien di suma? 
  Malumjiu khuan bam suma pah wang sai? 
  'Liu mibung benbam suma?

CH: |
  (Chorus) 
  Kaden lude chiujiu kak ngam suma? 
  Hiupuina Tinggen wang ra;
  Aliu kaden bamga wang dao suma? 
  Khuan bamkhe a Rapiu wang lanra.

V2: |
  2. Tingben karai ga kuwang su saira, 
  Khat khatna kuwang saira;
  Aliu ten hina pakhu lenkhai sai, 
  Kamdao de chiu din suma?

V3: |
  3. Pachamse aliu majaijiu bamma?
  Aliu lai khaijiu bamma?
  Aliu khuga kamaobo ha saira, 
  Aliu kendibo lune.

V4: |
  4. Kaden bamga wang daosai sanwi-e, 
  Paken dibo ngao lune; 
  A Rapiu niu wang lanbo tingmik ga, 
  Khuan bamga wangdao suma?

Translation: "(Will Jesus Find us Watching)"

Category: "Christian service & Reward"

