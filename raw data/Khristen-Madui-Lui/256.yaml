ID: "256"

Title: "DINBO SUANG ATU LUNGSA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jesu niu atu lungsa jiu,
  Singchai riga niu kheng khai-e;
  Ahiupuina ranpad khaibo,
  Dinbo suangdi wi-e.

CH: |
  (Chorus)
  Dinbo suang di atu lungsa, (2x)
  Jesu niu atu lungsabo,
  Dinbo suang di lungsa.

V2: |
  2. Chariubo paniu phungkhai jiu,
  Tathu pirun se runkhai-e;
  I niu tingtheng ring rabo leng,
  Dinbo suangdi wi-e.

V3: |
  3. A Rapiu ga manaibo bam, 
  Tingwang bamga niu kheng lujiu; 
  Kungbo pazai niu masan khai,
  Dinbo suangdi wi-e.

V4: |
  4. Pakhu mana wangjiu chun wi, 
  Paniu kapingbo ha khai-e;
  Pakhu ga masan kam mine,
  Dinbo suangdi wi-e.

Translation: "(More Than Tongue Can Tell)"

Category: "Love, Joy & Peace"

