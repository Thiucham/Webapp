  Baibo nai Galilram masan mine; 
  Oh! pawan khatna pingbo akhuga,
  Pingbo wang-e;
  Tingwang niu Patu juring lanne.

V4: |
  4. Mary niu shen tadle matha kamlo,
  Maihina tu juring khai kam mine; 
  Oh! pawan khatna pingbo akhuga, 
  Pingbo wang-e;
  Malum maihina tu juringne.

