ID: "236"

Title: "NAWANG-E A RAPIU "

Key: "G"

Time signature: "6/4"

V1: |
  1. Nawang-e a Rapiu I nawang-e,
  Magenthiubo daodi singchai phungjiu;
  Natu thuanbo luise tingtheng I thiu bamne,
  Nawang-e nakhu lam I nawang-e.

V2: |
  2. I niu tadjiu bamga naimik kiumi,
  Tingdi tamiu wangmi amang kummi;
  Chiudi majang khailo nawang-e a Rapiu,
  Nawang-e nakhu lam I nawang-e.

V3: |
  3. Tinggen zuan bo 'puiki I sui wang-e,
  Nang niu atu lungsa khaibo jeng niu;
  Namai tu lang kiujiu atu juaklo Tingwang,
  Nawang-e nakhu lam I nawang-e.

V4: |
  4. Iniu zikiang sujiu natu I thuan, 
  Chariujiu bam liudi Bethel zuanwang;
  Achun sajiu bamdi nawang-e a Rapiu, 
  Nawang-e a Rapiu I nawang-e.

V5: |
  5. Akan bamlu saira tinggen zuanjiu, 
  Chahiu naimik chagan lenton tadjiu; 
  Alui thiubam sune nawang-e a Rapiu, 
  Nawang-e a Rapiu I nawang-e.

Translation: "(Nearer My God to Thee)"

Category: "Desire after holiness"

