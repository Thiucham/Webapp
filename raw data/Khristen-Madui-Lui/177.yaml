ID: "177"

Title: "HAMI MAITU PHIU-E"

Key: "B"

Time signature: "9/3"

V1: |
  1. Hami maitu phiu-e chalungsa jiu,
  Maluang riga ronmeng jiu bammai;
  Akhuga wanglo chiujiu ku bamme,
  Rapiu ladkeng niu thainai din-e.

CH: |
  (Chorus)
  Maluang rilam tad madiu mimai,
  Ron maha mimai wanglan lo wanglan lo;
  Rankhaibopiu mily dung ruangga,
  Nuanmai jengniu Jesu shai-e Jesu shai-e.

V2: |
  2. Hami maitu phiu Jesu khu wanglo,
  Hiuna nai chalung chariu bammai;
  Juringbo 'puiga paliutu juwang,
  Tingtheng ringbo mpui lenkhai bilo.

V3: |
  3. Thoidam wiboga aliu lung bamma?
  Khrista sai suijiu nai machangga;
  Kaobam maidung tu jusu khai lanlo,
  Hami maidung tu 'pui dinbilo.

Translation: "(Seeking the Lost)"

Category: "Invitation & Baptism"

