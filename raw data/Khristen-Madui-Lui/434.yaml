ID: "434"

Title: "APUI RATHOI"

Key: "D"

Time signature: "3/4"

V1: |
  1. Haibo apui ladkeng haitu,
  Wadao khatdi mangai lakge;
  Apam aziuna bam sulo,
  Napui singbo se makumlo.

CH: |
  (Chorus)
  Apui niu kungbo maning tao,
  Tuhoi di pah ringbam kumme;
  Tingkai hun riri wangbo ga,
  Apui singbo maning tao-e.

V2: |
  2. Pawan machang chunwi khaibo,
  Apui khuanse mangai lulak;
  Tingwang niu atu se bamme,
  Apui ladtu makum tao-e.

V3: |
  3. Rankhaipiu tu I thuan bamne,
  Paniu anuan masan khaide;
  Sise apui rathoi niu-e,
  Rapiu suangga patu dao ne.

V4: |
  4. Tingkum sira tadsao makge,
  Apui gu lungsabo ladkeng; 
  Akhu ga wang lujiu thoikhai, 
  Napui rathoi mangai dulo.

Translation: "(My Mother's Prayer)"

Category: "Special songs"

