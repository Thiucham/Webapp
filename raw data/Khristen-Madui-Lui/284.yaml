ID: "284"

Title: "LUNG CHARIUMAI KILENG BAMME"

Key: "C"

Time signature: "4/4"

V1: |
  1. Lung chariumai ky leng bamme,
  Kadih tenhai saodiak lusai;
  Wadao di kalilan makbo,
  Saolo mathak makta rabo.

CH: |
  (Chorus)
  Nalung manang makjiu khuan bamlo, (2x)
  Khuan jiu bamlo nalung manang makjiu.

V2: |
  2. Karipbo bang niu chariu di,
  Tinggen lamsu masen khaine;
  Ngang phuilo mathak ra nade,
  Khuan jiu bamlo manang makjiu.

V3: |
  3. Nang puidi ga tathu daodi, 
  Naleng kheng khaibo maningjiu; 
  Nalung chariubo daoliudi, 
  Nasuang masanmai raimide.

V4: |
  4. Chariujiu bamdi ten bamlo, 
  Singjiu bamlo ma ngai makjiu; 
  Aman raleng tingmik nade, 
  Khuan jiu bamlo manang makjiu.

Translation: "(O Weary Heart there is a Home)"

Category: "Comfort in sorrow"

