ID: "190"

Title: "PHUILO NANG RINGNE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Phuilo Ranpao tu Calvary ga,
  Naleng aleng chariu kheng khaibo;
  Kinglo paniu lungsa jiu kubo,
  Phuilo nang ringne.

CH: |
  (Chorus)
  Phuilo nang ringne, (2x)
  Phuilo naleng singchai ga shaibo,
  Phuilo nang ringne.

V2: |
  2. Nabang ripbo gukhai ra bamma?
  Tingtheng karingbo nang daolu ma?
  Jesu shaikhai mide gukhai ra.

V3: |
  3. Ringlan mibo Jesu tu phuilo, 
  Chabam marongbo tingga tadlo; 
  Pazu nbiu niu tamiubo hade, 
  Phuilo nang ringne.

V4: |
  4. Ringbam maileng Jesu kheng khaira, 
  Nuan phungmai luni paniu se-e; 
  Jesu niu naphipa jukhaine, 
  Phuilo nang ringne.

Translation: "(Look and Thou Shall Live!)"

Category: "Invitation & Baptism"

