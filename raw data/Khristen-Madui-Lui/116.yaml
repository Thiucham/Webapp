ID: "116"

Title: "MALUM MAI WANGLO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Wanglo masanmai wanglo,
  Tingwang chawang dibo tu;
  Thuanbo lui thiu sukhe,
  Kaden sijiu thuan jiu bamlo;
  Tingku ga chawang dibo,
  Ku kachangbo tu.

CH: |
  (Chorus)
  Ringbo Tingwang malan habo,
  Tingnai kadih Rapiu;
  Charam sum ladzan pao-e,
  Tinggen kadih Ramluang, 
  Duinaih naimik chahiu chagan dung sidi,
  Tamiu kaben ringbo mania,
  Paniu damkhaibo-e;
  Thuanlo dambopao tu.

V2: |
  2. Kadih chawang maidung di,
  Tingwang thoidam gasu;
  Kangambo pumtan ne,
  Chawang tu thuanbo lui thiulo;
  Kadihri lungchun saojiu, 
  Tinggen ky zuan lo.

V3: |
  3. Tinggen ky wibo gase,
  Tingkum pariak hajiu;
  Chawang thiubam mine,
  Nangra siga wang ni makma?
  Kaden bamsulo,
  Natu kuwang ji sune.

Translation: "(Come Ye Believers)"

Category: "Praise & Opening"

