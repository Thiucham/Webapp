ID: "231"

Title: "MILY KHUANPAO KUMJIU JULO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Mily khonpao kumjiu julo,
  Jesu nang niu jukhailo;
  Piubon wibo ga jukhailo,
  Aliu niu naten thiura;
  {Rapiu Jesu gukhaibopiu,
  Nang niu 'liutu liulude. (2x)}

V2: |
  2. Aliutu chaka thiukhai lo,
  Nang niu 'liutu gukhailo;
  Nuan gasu 'liutu gukhailo,
  Ronmeng tadmibo gasu;
  {Rapiu Jesu gukhaibopiu,
  Aliu khengbo chiukhai lo. (2x)}

V3: |
  3. 'Liutu lukhaira ladriat khai, 
  Aliu maomeng bam liudi; 
  Nalungsiat seniu phuikhaibi, 
  Masan khaibi lungsiat niu; 
  {Rapiu Jesu Gukhaibopiu, 
  Nakhulam mari wang-e. (2x)}

V4: |
  4. Aliuniu nalungsiat phiu-e, 
  Aliu niu nachun kamne; 
  Thuanlo rankhaibo Rapiu tu, 
  Nalungsiat aliu lune; 
  {Rapiu Jesu gukhaibopiu, 
  Aliu tu lungsa khailo. (2x)}

Translation: "(Saviour Like a Shepherd Lead Us)"

Category: "Driving guidance & Protection"

