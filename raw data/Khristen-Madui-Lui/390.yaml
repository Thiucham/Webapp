ID: "390"

Title: "AKY WANGTANG SAI"

Key: "C"

Time signature: "4/4"

V1: |
  1. Aky wang dasai kachia pirun run ne,
  Abang ripbo saone aky wangtang sai;
  Kendibo puan piujiu tacham wibo dinne,
  Paniu lukhaine aky wangtang sai.

CH: |
  (Chorus)
  {Aky wang sai aky wang sai,
  Chariubo hina saone aky wang sai. (2x)}

V2: |
  2. Aky wangtang sai tamiubo bam lakge,
  Kabenbo se ngao ne aky wangtang sai;
  Tinggen lam kabenbo seniu atu thaokhai,
  I wangtang makthen atu jukhai ne.

V3: |
  3. Aky wangtang sai gukhaipiu lun ngaone,
  Gukhaibo lui thiubam ne aky wang sai;
  Mathajiu pasuang ga chapjiu kahum bamne,
  Tingtheng bam cham mine aky wang sai.

Translation: "(When I Get Home)"

Category: "Aspiration after Heaven"

