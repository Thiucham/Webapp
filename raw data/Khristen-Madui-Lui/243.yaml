ID: "243"

Title: "MAJIBO LUNG CHUN"

Key: "F"

Time signature: "6/8"

V1: |
  1. Majibo lungchun seniu palad piulo,
  Nalungsiat seniu aliu lung ra-e;
  Kadibo gase aliu lung rabo-e,
  Na pumtan gasu aliu niu ngamne.

CH: |
  (Chorus)
  Nagu ladkeng se dinpad khai sulo,
  Chunwibo lui se aliu thiubam ne,
  Nagu ladkeng se dinpad khai sulo,
  Nalungsiat seniu aliu lung ra-e.

V2: |
  2. Majibo lungchun seniu aliu lung ne,
  Pakendibo se thiulo Rapiu khu;
  Kadinpiubo nai lungsabo ga lung ne,
  Chunwi ri nga jiu aliu phungwang ne.

V3: |
  3. Majibo lungchun seniu Rapiu kendi,
  Kendibo thiujiu tingtheng mawanglo;
  Pagu kendi ga aliu chunwi bamne,
  Pakhiang na pikhai nagu thiu milo.

Translation: "(True Hearted)"

Category: "Consecration"

