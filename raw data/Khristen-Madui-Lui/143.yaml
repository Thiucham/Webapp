ID: "143"

Title: "NATEN PISU KHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Naten pisu khailo,
  Masanmai khu lenlo;
  Maihina ga nalad dinlo,
  Namai tu pi chiulo.

CH: |
  (Chorus)
  Naten pisu khailo,
  Kahumme a Rapiu;
  Wang kiulo lungsa sibo piu,
  Thoidam pikiu khailo.

V2: |
  2. Naten pisu khailo,
  A Rapiu zan dira;
  Nalungsiat se aliu lungga,
  Chami kum tao khailo.

V3: |
  3. Naten pisu khailo, 
  A Rapiu naladse;
  Masanbo majibo pilo, 
  Malumjiu pi chiulo.

V4: |
  4. Penticost nai kumjiu, 
  Naten pisu khailo; 
  Lungsa bose aliu lujiu, 
  Paken dibo naleng.

Translation: "(Revive Thy Work Oh! Lord)"

Category: "Prayer meeting & Revival"

