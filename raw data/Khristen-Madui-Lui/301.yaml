ID: "301"

Title: "APIRUN GA GANBIU BAM SUMA?"

Key: "A"

Time signature: "4/4"

V1: |
  1. Thainai I maning-e kawibo ram tuse,
  Naimik kiu misai bam rabo ram;
  Rapiu niu Lungsabo bamga wang chap saira,
  Apirun ga ganbiu bam suma?

CH: |
  (Chorus)
  Apirun ga ganbiu kabenbo bam suma?
  Chawan wang jiu naimik kiu misai;
  I sujiu masanbo ramga wang mathak sai,
  Apirun ga ganbiu bam suma?

V2: |
  2. A Rapiu ga I singjiu paten ten bamne,
  Hiupuina khommai thiu ngamlu ra;
  Dibo tingmik gase aleng ganbiu daora,
  Duidi genlam patu thuan bamne.

V3: |
  3. He! dejiu mathara  pazu wang ngao saira,
  Kakungbo pasuang ga lenbo nai;
  Siga chunwi matha bamne Tinggen dihga,
  Apirun ga ganbiu bam suma?

Translation: "(Will there be Any Star?)"

Category: "Christian service & Reward"

