ID: "208"

Title: "DINKHAILO DINKHAILO"

Key: "F"

Time signature: "4/4"

V1: |
  1. Dinlenlo maihina khuga,
  Kukhaibo kawicham se,
  Dinlenlo dinlenlo;
  Dinlenlo lungsabo chamse,
  Mariu charimai khuga,
  Dinlenlo dinlenlo.

CH: |
  (Chorus)
  Dinlenlo maihina khuga,
  Dinlenlo Tingwang chamse,
  Chamai hina jat hina khuga;
  Khrista cham paokhailo,
  Paokhailo dinlenlo,
  Khrista cham hai dinlenlo.

V2: |
  2. Khrista niu natu pikhaibo,
  Lungsiat chamse paokhailo,
  Dinlenlo dinlenlo;
  Chariu magenthiu bammai ga,
  Tacham hai pageng bamme,
  Dinlenlo dinlenlo.

V3: |
  3. Tadmibo naringting lungga, 
  Nangniu daolubo thoidam,
  Dinlenlo dinlenlo;
  Chariu magenthiu bam maitu, 
  Nangniu nkha khai bilo,
  Dinlenlo dinlenlo.

V4: |
  4. Tamiubose loiwang kinne, 
  Hujiu bamra dinlenlo,
  Dinlenlo dinlenlo;
  Tingben jiu naimik pad mide, 
  Masan siakjiu ngao mide,
  Dinlenlo dinlenlo.

Translation: "(Pass it On)"

Category: "Response & Repentance"

