ID: "95"

Title: "TINGWANG GU LUNGSABO "

Key: "B"

Time signature: "4/4"

V1: |
  1. Tingwang gu lungsabo haise,
  Tinggen gu mathabo-e;
  Nagu lungsabo ga bamme,
  Nagu malumbuibo ga;
  Jesu nangra lungsa se-e,
  Dinkam se lakbo lungsa;
  Aliutu juring khai khelo,
  Maihina leng pikhailo.

V2: |
  2. Chariu jiu bam maihina ga,
  Nahiupuina pikhailo;
  Nathoi kawise mai hina,
  Aliu niu daojiu bamme;
  Nuan phungbo lungchun halujiu,
  Alpha Omega thiulo;
  Haise paphibang thiu lujiu,
  Patondi pithiu khailo.

V3: |
  3. Aliu tu gukhaira wanglo, 
  Nangu lungsiat lutaora;
  Na rakyga tingtheng lungra; 
  Wadaodi tadlan makra; 
  Siga tingtheng thoidam thiura, 
  Aliu natu thuan bamne;
  Nakendibo lungsiat situ, 
  Tingtheng jeng thuanjiu bamne.

V4: |
  4. Nagu kasanbo gandam ga, 
  Masanjiu aliu lungne;
  Juring bose aliu lujiu, 
  Palingjiu aliu thuanne;
  Tinggen ramga wangtang lujiu,
  Kendibo aliu thiune;
  Pirunse aliu run lujiu, 
  Tingtheng Natu thuan bamne.

Translation: "(Love Divine)"

Category: "Praise & Opening"

