ID: "6"

Title: "MASAN MASAN MASAN"

Key: "E"

Time signature: "4/4"

V1: |
  1. Masan masan masan ngam kambo Tingwang 
  Nsuan sujiu natu thuanbo lui I thiu bamne.
  Masan masan masan kangambo Rapiu-e;
  Khangsum niu Tingwang khat thiubo piu-e.

V2: |
  2. Masan masan masan natu kahum me
  Masan maidung pirun khai kiu jiu kahum bamme.
  Cheru bim nai Seraphim khudungkiu kahum-e;
  Tadmibo bambo wangrabo piu-e.

V3: |
  3. Masan masan masan tamiubo tu gom
  Nuan phungmai mik seniu nakendibo tu ngao mak.
  Nangra masan bo-e nakumbo mai di ha;
  Pumtan nai lungsa bo nakhu bamme.

V4: |
  4. Masan masan masan ngamkambo Tingwang 
  Tingpuk nai kadihri dui pui niu thuan jiu bamme.
  Masan masan masan kangambo Rapiu-e;
  Papiu panah masanbo hiupuinah.

Translation: "(Holy, Holy, Holy)"

Category: "Grace, Redemption & Love"

