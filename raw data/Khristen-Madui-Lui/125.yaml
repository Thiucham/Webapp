ID: "125"

Title: "RAPIU NAGU KATIU KAIGA"

Key: "A"

Time signature: "3/4"

V1: |
  1. Rapiu nagu katiu kaiga,
  Aliu madui bamme;
  Natia nazan seniu taruak,
  Nazai niu mumse dui.

V2: |
  2. Haibo maluad kaden khai piu,
  Aliu jeng niu shaikhai;
  Pagu maluad tiura kubam,
  Kheng khaibo maluad ga Amen.

V3: |
  3. Hai suang lungsa kakung ha-e, 
  Rapiu lungsa kungbo; 
  Nangniu lungsa khaibo situ,
  Wadaodi ruisilak.

V4: |
  4. Agu pumtan jengtan hina, 
  Nakhu ga pikhai-e; 
  Nang niu atu kuwang dasai, 
  Nakhu pikhai kamne.

Translation: "(Here at Thy Table Lord We Meet)"

Category: "Lord supper"

