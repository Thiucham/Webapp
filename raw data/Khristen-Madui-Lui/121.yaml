ID: "121"

Title: "MAISUANG HABO RINGRABO CHAM "

Key: "G"

Time signature: "6/9"

V1: |
  1. Hiupuina ring rabo luise, 
  Thiukhailo akhuga;
  Hiupuina ring rabo chamse, 
  Dinkhailo akhuga;
  Kawibo cham ringbo, 
  Dinkhailo malum ra.

CH: |
  (Chorus)
  {Kawibo maisuang habo cham,
  Mai ring rabo chamme; (2x)}

V2: |
  2. Khrista niu pikhaibo chamse, 
  Mai ring rabo chamme;
  Hiupuina ring rabo chamse, 
  Kinglo nuan phung maidung;
  Lungsa jiu ku bamme,
  Tinggen ram lung raleng,

V3: |
  3. Masanbo chamkeng niu ku-e,
  Mai ring rabo chamme;
  Ring rabo pathoi kawibo,
  Maihina ga pilo;
  Rankhaipiu Jesu niu,
  Tingtheng masan khaine.

Translation: "(Wonderful Words of Life)"

Category: "Bible"

