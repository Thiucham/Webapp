ID: "305"

Title: "NAIMIK 'BIUSE THAO KHAILO "

Key: "A"

Time signature: "4/4"

V1: |
  1. Nang kamaobo tenjiu kapingbo bamma? 
  Tamiubo ga lungjiu chariu bamkha ma? 
  Kyranki nai khamse le ma nga khailo, 
  Pi naimik biu thao khailo.

CH: |
  (Chorus) 
  Naimik biuse thao khailo, (2x)
  Kyranki nai khamse le ma nga khailo, 
  Naimik biuse thao khailo.

V2: |
  2. Nagu malumse khin bibi jiu bamma? 
  Narathoi situ paokak khai makjiu ma? 
  Kyranki nai khamse le ma nga khailo, 
  Pi naimik biu thao khailo.

V3: |
  3. Chunwi matha jiu Tinggen pui zuan rama? 
  Tamiubo ringting hai nang kenlu dasai,
  Kyranki nai khamse le ma nga khailo, 
  Pi naimik biu thao khailo.

Translation: "(Let the Sunshine In)"

Category: "Christian service & Reward"

