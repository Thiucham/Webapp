ID: "347"

Title: "ATU RANLUDE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Calvary ga shaibo Jesu,
  Milypoi tu thuanlo;
  Pazai niu aliutu rankhai,
  Aliutu thoi khaira.

CH: |
  (Chorus)
  Ranlude ranlude,
  Shaikhaibo Milypoi zai ganiu;
  Ranlude ranlude halleluyah!
  Tingwang milypoi.

V2: |
  2. Maisuang habo pumtan bambo,
  Lungsa khaibo seniu;
  Jat hina tu rankhai lujiu,
  Aliutu aruang khai.

V3: |
  3. Pakendibo Rapiu Khrista,
  Zanse tingtheng thuanlo;
  Paniu kadihmai nuan kuak khai,
  Aliutu di kuak khai-e.

Translation: "(I'm Redeemer)"

Category: "Assurance & Testimony"

