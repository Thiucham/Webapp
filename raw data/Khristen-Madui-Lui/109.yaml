ID: "109"

Title: "PHUMLING GU PHIDUNG"

Key: "E"

Time signature: "4/4"

V1: |
  1. Phumling duansu khaibo papao piu se Jesu-e,
  Phumling haise Rapiu gu gandam kasanbo-e;
  Phumling tu magiang raleng pah Tinggen lamsu kiu,
  Shaikhai lujiu pazai niu phumling tu ran lude.

V2: |
  2. Zat hina gasu kadalu phumling khat thiu-e,
  Juring leng Rapiu khat tu malum jiu ten bamne;
  Masanbo Rapiu zan gasu niu maluad poncham,
  Tachun khat thiujiu Rapiu lungsiat lutao lude.

V3: |
  3. Chariu magen thiudi mainiu mala bam luidi,
  Chuncham lakbo wajiu kha wangra thiubam luidi;
  Masanmai dungniu de theng kapjiu khuan bam ralo?
  Watheng lakde, chariubo sao lujiu mathara.

V4: |
  4. Chariu magen thiujiu tathu chara keng bamdi, 
  Tingtheng manai agibo tu 'liu khuan jiu bamkhe; 
  Pakendibo tingmiktu khuanlu maise duanwi, 
  Charingam lubonai phumling mathak misune.

V5: |
  5. Kadihgadi khat thiu sumniu khat thiubo Rapiu, 
  Suang habo lungsiat seniu chari ngamji sune; 
  Rapiu lungsiat daolumai aliudung chun wine, 
  Agi njangjiu pah nai lungchun cham jiu bamne.

Translation: "(Church's One Foundation)"

Category: "Praise & Opening"

