ID: "234"

Title: "JESU ATU MAJANG BAMSAI"

Key: "C"

Time signature: "6/8"

V1: |
  1. Jesu atu majang bamsai achunwi sune,
  Atu paniu lang boga I niu tadjiu bamne;
  Lungpubo dao gadi kapingbo dao liudi,
  Jesu tu majang sai I wanglu diu-e.

CH: |
  (Chorus)
  Jesu atu majang bamsai chunwi ne,
  Paniu tadbo 'pui ga I tad sune achunwi jiu;
  I chariubo dao bam liudi achunwi ne,
  Atu kadao ga wanglo chiudi wang diu-e.

V2: |
  2. Jesu atu majang sai pabam hina suine,
  Atu awan jeng gadi paten thiulo chiu sai;
  I patu malumjiu pakendibo dinne,
  Mpui kadiu lamdi paten thiu tadne.

V3: |
  3. Jesu atu majang sai I wadi thin lakge,
  Atu lang khaibo hina I pachamse phung ne;
  I apumtan hina thinjiu paten thiune,
  Atu dinbo hina I pacham phung ne.

Translation: "(If Jesus Goes With Me)"

Category: "Driving guidance & Protection"

