ID: "353"

Title: "AZAN RAOKHAI BAMMA?"

Key: "B"

Time signature: "3/4"

V1: |
  1. Nagu chakhiu chalan tu Jesu suang lunima?
  Tingtheng Jesu tu majang Tinggen ga lung rao ma?
  Karingbo ariak khuang se Tingwang benga bamme,
  Asingnah yo nazandi siga raokhai bamma?

CH: |
  (Chorus)
  Karingbo ariak ga azan raokhai bamma?
  Asingnah yo nazandi siga raokhai bamma?

V2: |
  2. Namao nameng keng jujiu sikam lak bam suma?
  Jesu niu pazai luang jiu khiu masan kam mine,
  Paniu dinkhaibo chamdung Bible ga raokhai bam,
  Jesu tu malum bisai natu saomi lakge.

V3: |
  3. Tinggen namdi ga Jesu aliu bam kaden bam,
  Siga aliu dung wangjiu Jesu tu adao ne,
  Maji makmai hina niu namdi gase ngutlak,
  Asingnah yo nangdi tu siga wangni makma?

Translation: "(Is My Name Written There?)"

Category: "Assurance & Testimony"

