ID: "147"

Title: "KAPBO NIU RING LAKGE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Kapbo niu ring lakge,
  Mikdui luang jiu bam liudi;
  Kapingbo gu ha lakge,
  Tingtheng chunsa ha lakge;
  Kapbo niu ring lakge.

CH: |
  (Chorus)
  Jesu aleng shaikhai-e,
  Singchai riga genkhai-e;
  Jesu niu atu lungsa,
  Pazai niu rankhai-e.

V2: |
  2. Tenbo niu ring lakge,
  Masanbo ngam kam bamdi;
  Masan thubo lungchun niu,
  Hiupuina ran lulakge;
  Tenbo niu ring lakge.

V3: |
  3. Khuan bamdi ring lakge,
  Acheng kasa saokhaijiu; 
  Lungsabo khuan I chiu-e, 
  I khuan ngamdi shaira-e; 
  Khuan bamdi ring lakge.

V4: |
  4. Khrista malum mai ring, 
  Nanahtu I malumme;
  Paten tu maning saira, 
  Papum tanniu juringra, 
  Khrista malumbo niu.

Translation: "(Weeping Will Not Save)"

Category: "Prayer meeting & Revival"

