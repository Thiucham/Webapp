ID: "40"

Title: "JESU BENNIU GUKHAI"

Key: "G"

Time signature: "4/4"

V1: |
  1. Jesu benniu gukhai jiu,
  Pa pamga lukhai-e;
  Lungsabo niu gom liam khai, 
  Hiupuina aman ne;
  Masan maidung khuan kinglo,
  Chalui niu din bamme; 
  Pakendibo lui thiujiu,
  Duipui gen se kenjiu.

V2: |
  2. Jesu benniu gukhai jiu, 
  Kasa hina kenne;
  Kahiambo gadi gukhai,
  Nuan niu chariu lakge;
  Chunsa bodi chunwi khai,
  Kapingbo ga gukhai;
  Mikdui luang jiu chariubo,
  Pating watheng lakge.

V3: |
  3. Jesu atu gukhai bo,
  Paniu aleng shaikhai;
  Tingtheng bambo tu dihga,
  I niu malum bamne;
  I natu khuanbam sune,
  Tamiubo ken makthen; 
  kachia duidi genlam se,
  Ben makthen khuan bamne.

Translation: "(Safe in the Arms of Jesus)"

Category: "Christ life & Love"

