ID: "186"

Title: "KARENGGA"

Key: "A"

Time signature: "6/8"

V1: |
  1. Karengga aronna tad bam,
  Charapen riga kajik kiu bam;
  Chakhuan kawibo I chiulu ganiu,
  Tingwang niu akhu dinne.

CH: |
  (Chorus)
  Pah atu majang jiu tacham dinkhai,
  I hai pagu-e chiujiu din;
  Patu majang jiu I achunwi-e,
  Maikhat niudi simakge.

V2: |
  2. Pakhuan seniu akhu din-e,
  Haise thingna khuan kawi kumme;
  Kingwibo chalui khuan kumjiu wang-e,
  Sibo khuan niu atu ku.

V3: |
  3. Tamiubo seniu gom bamdi,
  Paniu atu majang jiu bamne;
  Pachunsa bo khuan niu atu ku-e,
  Wanglo chiujiu kubamme.

Translation: "(In the Garden)"

Category: "Invitation & Baptism"

