ID: "266"

Title: "MALUMBO NIU NGAMNE"

Key: "F"

Time signature: "6/8"

V1: |
  1. Naliu Khristen riphen maidung sulo chari thiura,
  Naimik kiujiu tamiu wangkin matip jiu chap bamlo;
  Mikre mainiu tanjiu bamdi aliu ngam sangjing ne,
  Malum mainiu ngam sangjing ne kadihri tu ngamne.

CH: |
  (Chorus)
  Malumbo niu ngamne, (2x)
  Jesu tu malum bamsai, 
  Kadihri tu ngamne.

V2: |
  2. Tingwang chamse aliu heng ngiu pengphai niu lungsabo,
  Ranlubo puikiga tadjiu ngambo pirun runne;
  Malumbo lad luise thiujiu aliu niu tad ronne,
  Malumbo chagee se phungjiu kashaibo tu ngamne.

V3: |
  3. Mikre maise kengjiu bamme aliutu aphenra, 
  Sailam nkhin makjiu bamlo aliu ngam sangjing ne; 
  Juringbo pirun nai khengak khailujiu chap bamkhe, 
  Kadihri hai malai sune aliu khuan chiu dasai.

V4: |
  4. Chari ngam lumai leng sira kabo phaini pine, 
  Tinggen mazadung masuangga paliu zan madune; 
  Paken dibo luang gase aliu chun wijiu bamne, 
  Jesu zan gasu aliuniu chari ngam sangjing ne.

Translation: "(Faith is the Victory)"

Category: "Conflict & Victory"

