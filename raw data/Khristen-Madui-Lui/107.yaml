ID: "107"

Title: "KINGLO KINGLO AHIUPUINA "

Key: "D"

Time signature: "4/4"

V1: |
  1. Kinglo masan maidung niu chalui thiubo,
  Kadihri tamiubo duidi genlam;
  Ranlu mainiu dinbose dejiu wilo,
  Chaken kasan siga maobo ha-e.

CH: |
  (Chorus)
  Masanmai chalui thiujiu malum bamlo,
  Aliu Tinggen lam wang thiu aruangne;
  Tamiubo 'chun loisai matha jiu bamne,
  Karingting lungsa sijiu lung bamne.

V2: |
  2. Kadiubo lamniu chawan bang khuan kumjiu,
  Jesu shenne tadui ramluang riga;
  Mai sangsang hiupuina ha kammi bijiu,
  Chariumai phikem pakhulam jukhai.

V3: |
  3. Aliu chalui khuan chiu bamga tad sukhe,
  Jesu niu gukhai ne magenthiu mai;
  Tamiubo ga chalui thiujiu shen bamkhe,
  Wibo luiniu chaki lam jukhai ne.

Translation: "(Hark, Hark My Soul)"

Category: "Praise & Opening"

