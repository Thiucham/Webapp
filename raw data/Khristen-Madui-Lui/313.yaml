ID: "313"

Title: "WIBO CHAM THAOBEN KHAILO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Duidi genlam kabenbo ky kum chaplo, 
  Nuan gu tamiubo duidet situ phuilo;
  Taten thiu raleng kham le ma nga khailo, 
  Thaoben khailo wibo cham.

CH: |
  (Chorus) 
  Wibo cham thaoben khailo, (2x)
  Namibung thaoben raleng kam masanlo, 
  Wibo cham thaoben khailo.

V2: |
  2. Maihina harabo bam ga tadlu jiu, 
  Pabam machang tamiubo niu jin mide;
  Kasabo bam ga wang makra rukhailo, 
  Thaoben khailo wibo cham.

V3: |
  3. Namibung 'biu situ pi gom khai mane, 
  Pawan machang pabiuse piben khailo; 
  Tamiu bose piben khaira matanlo, 
  Thaoben khailo wibo cham.

V4: |
  4. Jesu wangmak then paten tenjiu bamlo, 
  Haibo 'puikise naliu tadlan lakge; 
  Singgiu genlam natu sundao mak thenna, 
  Thaoben khailo wibo cham.

Translation: "(Let the Gospel Light Shine Out)"

Category: "Christian service & Reward"

