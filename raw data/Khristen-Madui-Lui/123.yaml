ID: "123"

Title: "NANG WANG DASAI"

Key: "C"

Time signature: "4/4"

V1: |
  1. Nang wang dasai he! a Rapiu, 
  Nang wang dasai he! a wang;
  Jat hina niu natu thuanne,
  Thuanbo luise thiubam ne;
  Nang wang dasai nahken di niu,
  Zushung phaise kekbo kum;
  Chariumai aman raleng-e,
  Napumtan se pikhailo.

CH: |
  (Chorus)
  Nang wang dasai, (2x)
  Aliu natu adao ne;
  Nang wang dasai I ngao dao ne,
  Siga I nalun phungjiu;
  {Nang wang dasai, (2x)}
  I kungbo a wang Jesu;
  Na ladzan tingmik khuan lulak,
  Natu I thuan bam raleng.

V2: |
  2. Nang wang dasai magenthiubo,
  Kapbo mikdui luang lakge;
  Nuan gu chariubo bam lakge,
  Nakendibo nai dasai;
  Nang wang dasai a wang Jesu,
  Kakibo maning lakge;
  He! dejiu nakendi gulo,
  Nazai seniu rankhaide.

V3: |
  3. Nang wang dasai Rankhaibopiu,
  Chunwi jiu thuan bam sune;
  Pawan nai pating mik phuijiu,
  Thuanbo lui thiujiu bamne;
  Nang wang dasai ladren bamne,
  Nang wang rabo I se-e;
  Tuhoi aliu aruangbo kum,
  Tinggen lamdi aruang ne.

Translation: "(Thou art Coming)"

Category: "Lord supper"

