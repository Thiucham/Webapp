ID: "94"

Title: "THUANLO ALIUTU DAMPAO TU"

Key: "C"

Time signature: "4/4"

V1: |
  1. Thuanlo aliutu dampao Rankhaipiu tu,
  Kashaibo ganiu piring lanbo piu;
  Chalui thiulo mathajiu thuankiu sukhe,
  Chalungsa sibo Rankhaibo piutu.

CH: |
  (Chorus)
  Thuanlo thuanlo 
  Pangam dibo thuanjiu pazan masan milo!
  Thuanlo thuanlo 
  Aliu wangdi bo zantu thuanlo.

V2: |
  2. Thuanlo aliutu dampao pangam dibo,
  Pabam machang aliutu majang khai;
  Pah aliutu damkhai jiu gukhaipiu-e,
  Taning duidi gadi atu jukhai.

V3: |
  3. Thuanlo damkhai wibo majibo piutu,
  Paken pangam dibo tu thuankiu jiu;
  Pa ladren malumjiu pakhuga saokhe,
  Chalungsa jiu aliutu gukhai-e.

Translation: "(Praise Our Creator)"

Category: "Praise & Opening"

