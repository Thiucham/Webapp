ID: "142"

Title: "TINGRIU KUMJIU THOIDAM KHAILO"

Key: "B"

Time signature: "6/8"

V1: |
  1. Tingriu kumjiu thoidam khailo,
  Chalungsabo ladriatse;
  Siga masanbo riu khailo,
  Rankhaipiu pikiu khailo;

CH: |
  (Chorus)
  Thoidam pikiulo,
  Kawi pira kheng bamme;
  Tingpuak kumjiu riukiu khailo,
  Aliu mathiu kheng bamme.

V2: |
  2. Tingriu kumjiu thoidam khailo,
  Ringsu lanra riu khailo;
  Taning ramluang pabam machang,
  Tingriubo kum riu khailo.

V3: |
  3. Tingriu kumjiu thoidam khailo, 
  Aliu riga pikhailo; 
  Tachun kasan pikhai lanlo, 
  Nalungsiat lad pikhailo.

V4: |
  4. Tingriu kumjiu thoidam khailo, 
  Thainai tingmik pikhailo; 
  He! Tingwang nang niu pikhailo, 
  Aliu Jesu tu ku-e.

Translation: "(There Shall be Shower of blessing)"

Category: "Prayer meeting & Revival"

