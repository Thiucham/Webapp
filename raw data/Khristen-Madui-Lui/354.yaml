ID: "354"

Title: "I CHAKY WANG-E"

Key: "B"

Time signature: "4/4"

V1: |
  1. I nuan phungmai thiujiu bam liudi,
  Tingwang I nasai suijiu wangne;
  Na pumtan niu pi masan khailo,
  I chaky wang-e.

CH: |
  (Chorus)
  I wang-e, (2x)
  Kasabo 'puiki tadlan lakge;
  I wang kinme Rapiu khulam,
  Rapiu I naky ga wang-e.

V2: |
  2. Papiu panah tu phiubo kumjiu, 
  Tingwang niu atu phiujiu bamme;
  A nuan hainiu I thiuniu lujiu,
  I chaky wang-e.

V3: |
  3. Nang niu dinbo khuanse I chiu-e,
  Deleng I natu phut mijiulo; 
  A chariu hina nang niu phuibi, 
  I chaky wang-e.

V4: |
  4. Paniu panah tu dinbo kum jiu, 
  Tingwang niu atu hai chiujiu dinne; 
  Kangambo gu pirun lu raleng, 
  I chaky wang-e.

V5: |
  5. Nahpiu niu degu kamkhai milo? 
  Papui khu ga dinkhai tangbilo; 
  Ronmeng mibo nanahpiu seniu, 
  I chaky wang-e.

Translation: "(Coming Home)"

Category: "Assurance & Testimony"

