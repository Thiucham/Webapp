ID: "225"

Title: "RANKHAIPIU A MPUI DINLO!"

Key: "D"

Time signature: "4/4"

V1: |
  1. Rankhaipiu atu julo,
  'Pui machang jukhai khelo;
  I nakhuga bam dasai,
  I nalungsa ga bamne.

CH: |
  (Chorus)
  Atu julo rankhaipiu 'pui jukhai lo,
  Pawan tadbo sai suijiu;
  Rankhaipiu a mpui julo.

V2: |
  2. Ahiuna baibo bam nang,
  Karingting tadjiu bamga;
  Nakhuga I ranlune,
  Nalungsiat tu I malum.

V3: |
  3. Kaloibo tangjiu julo,
  Karingting hai kendasai;
  Benbo ram I tang sune,
  Mikdui hina sang sune.

Translation: "(Lead Me Saviour)"

Category: "Driving guidance & Protection"

