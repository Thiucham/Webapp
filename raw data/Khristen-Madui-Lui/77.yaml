ID: "77"

Title: "TAZAI NIU GUKHAILO RAPIU"

Key: "B"

Time signature: "6/4"

V1: |
  1. Nang niu pikhai bo manse,
  Tingwang nah piu-e;
  I natu malum gasu,
  Tazai niu gukhai.

CH: |
  (Chorus)
  Tazai niu gukhailo Rapiu,
  Calvary zai seniu;
  Achun mak jiu nachunlo,
  Tazai niu gukhailo.

V2: |
  2. I singchai ga makhum kiu,
  Nuan niu phui lujiu;
  Juringbo I silude,
  Nakhu pi bamlo.

V3: |
  3. Nuan gase I shai khaide,
  Jesu niu ran khai; 
  Atu kam masan khailo,
  Nang kungbo zainiu.

V4: |
  4. Agu ringting loi midi, 
  I niu thuan bamne; 
  Saoniu a nuan kuak khailo? 
  Masanbo zainiu.

Translation: "(Keep Me Under the Blood)"

Category: "Humiliation, Resurrection & Glory"

