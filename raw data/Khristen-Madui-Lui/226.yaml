ID: "226"

Title: "ALIU BAIBAM TUDIH"

Key: "F"

Time signature: "4/4"

V1: |
  1. Kasa daojiu waping saira,
  Aliu baibo tudi Rapiu; 
  Chariu magenthiubo daosai,
  Aliu mahiu khai bam nang-e.

CH: |
  (Chorus)
  Chalung pubo ramga Jesu tudi ye,
  Lung pubo ram lung pubo ram;
  Chalung pubo ramga Jesu tudi ye,
  Aliu mahiu khai bam nang-e.

V2: |
  2. Niendi chundi gukhaibopiu,
  Aliu baibam tudi Rapiu; 
  Kaping hane chari hane,
  Aliu mahiu khai bam nang-e.

V3: |
  3. Tingthung tanjiu wang bam liudi, 
  Aliu baibam tudi Rapiu; 
  Wadaodi phutlan lakmide, 
  Aliu mahiu khaibam Rapiu.

V4: |
  4. Lungsa khaibo tudi bamme, 
  Aliu baibam tudi Rapiu; 
  Aliu tu khakhai siak sune, 
  Aliu mahiu khai bam nang-e.

Translation: "(A Shelter in the Time of Storm)"

Category: "Driving guidance & Protection"

