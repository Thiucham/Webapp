ID: "341"

Title: "ANUAN HINA PANIU KUAK KHAI-E"

Key: "B"

Time signature: "4/3"

V1: |
  1. A Rapiu tu thuanbo lui thiune,
  Pakhu achunka wang-e;
  Atu lungsabo lui thiu bamne,
  Haise alui thiune.

CH: |
  (Chorus)
  A nuan hina paniu kuak khai-e,
  Pazan masanbo situ thuan kiulo;
  A nuan hina paniu kuak khai-e,
  Pazai niu halleluyah!

V2: |
  2. Acheng kasabo I phungwang di,
  Aleng kawibo pi-e;
  Atu khengrang thiu khaibo jeng niu,
  Saomak jiu thuan bamne.

V3: |
  3. Aringting loi makthen thuan bamne,
  Kashaibo tu ngam lude;
  Tingtheng jeng I niu thuan jiu bamne,
  Haise alui thiune.

Translation: "(He Has Taken My Sins Away)"

Category: "Assurance & Testimony"

