ID: "270"

Title: "TINGWANG TADRON BAMME "

Key: "C"

Time signature: "4/4"

V1: |
  1. Amik niu a Rapiu ken dijiu wang rabo tu ngao-e,
  Palung pomgu mumsy kense ju maseng khaijiu bamme;
  Paniu ting kalikbo kumjiu paheng se jusu bamme,
  Tingwang tad ron bamme.

CH: |
  (Chorus)
  Pakendi-e halleluyah, (3x)
  Tingwang tad ron bamme.

V2: |
  2. Paliu riziky tu chap magui bambo I niu ngao-e,
  Rapiu tu kahum rabo rathak bamse thiukhai bamde;
  Pagu masanbo chamkeng se paling jiu I ngao lude,
  Tingwang tad ron bamme.

V3: |
  3. Sailam phan khin lan makra Tingwang make mara bamme,
  Palad zan bam suang gasu chamaina lung kada padne;
  Majatlo ahiupuina a Rapiu tu pao kak raleng,
  Tingwang tad ron bamme.

V4: |
  4. Duidi gen lily pen wibo ga Khrista tu mana-e,
  Pa suang gasu ania lunse kali khai kam misune;
  Paniu shaikhaibo kumjiu aliudi maidung leng shaikhe,
  Tingwang tad ron bamme.

Translation: "(Our God is Marching On)"

Category: "Conflict & Victory"

