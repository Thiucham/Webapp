ID: "23"

Title: "MATHALO A RAPIU WANG-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. Mathalo a Rapiu wang-e, 
  Kadihri wang kiu-e;
  Maihina lungga pabam leng, 
  {Tinggen nai kadihmai; (2x)}
  Hai dung niu di thuan jiu bamme.

V2: |
  2. Rapiu kadih ri wang thiune,
  Maihina niu thuan lo;
  Maluang taning tadui tatu,
  {Niudi thuan jiu bamne; (2x)}
  Tinggen kadih mai niu thuanne.

V3: |
  3. Ladling se nai lungsa bo niu,
  Zat hina ladzan ne;
  Pacheng winiu paken dine,
  {Palungsiat din silak; (2x)}
  Palungsiat se de jiu dilo!

Translation: "(Joy to the World)"

Category: "Christmas"

