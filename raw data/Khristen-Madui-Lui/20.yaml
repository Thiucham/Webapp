ID: "20"

Title: "MILY KHUANMAI NIU CHUNDING GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Mily khuanmai niu chunding ga,
  Mily khuan jiu bam ga;
  Rapiu maza seniu kiujiu,
  Paliu bam thaoben-e.

V2: |
  2. Mily khuanmai dung khu din-e,
  Naliu ping mitu lo;
  Rankhaibo ringbo wibo cham,
  Maihina leng wang-e.

V3: |
  3. David namga thainai naleng,
  Manade rankhaipiu;
  A Rapiu khrista niu ngam jiu,
  Pakendibo thiune.

V4: |
  4. David namga thainai na'leng, 
  David phiu ga lungwang; 
  Pazan se Rankhaibo Rapiu, 
  Haise madan dung-e.

V5: |
  5. Tingwang Nahtu naliu ngaone, 
  Chamai lun thiu wang-e;
  Phailep niu Patu majiu khai, 
  Matomki ga jibam.

V6: |
  6. Sibo wan tingku gen lamsu, 
  Masan maidung tu ngao; 
  Paliu niu Tingwang tu thuanjiu, 
  Mathabo lui thiu-e.

V7: |
  7. Kulam Tingwang kendi bamlo,
  Kadih manai chialo;
  Kawicham chamai khu wangjiu, 
  Tingtheng jiu lung mine.

Translation: "(While Shepherds Watched)"

Category: "Christmas"

