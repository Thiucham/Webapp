ID: "31"

Title: "CHRISTMAS NAI NCHUN "

Key: "G"

Time signature: "4/4"

V1: |
  1. Kadih riga chawang mainah keng bamliudi,
  Chawang khrista kumbo manalu mai ha-e;
  Tinggen wang Bethlehem matomki ga mana,
  Tingwang tu thuan raleng kadih mainah madui.

CH: |
  (Chorus)
  Mathajiu thuan sukhe, tinggen wang tu thuanlo,
  Kamanabo nai-e, mathiuna mathalo;
  Tinggen wang kadihbo pirun janra mana,
  Tinggen masan mainai aliu thuan jiu bamkhe.

V2: |
  2. Tinggen lam masanmai thuan jiu mathalui thiu,
  Siga mily khuanmai manam hangga chiu-e;
  Jesu manabo bamse paling na dinkhai,
  Paliu gu mily phud lujiu wang kahumme.

V3: |
  3. Naimik padlamsu kasimai kahumra wang, 
  Tingsang pui niu raijiu paliu majang wang-e; 
  Khaoring kuangga papui Mary niu ponbamme, 
  Kakungbo gu hina pilujiu kahumme.

V4: |
  4. Chawang Herod sira palung magenthiu bam, 
  Kahum rabo kumjiu kasimai ga maniu; 
  Judah ramlung ga nahmai dungtu kamshat bam, 
  Ngenah 'wangtu Tinggen 'wang niu juringkhai-e.

V5: |
  5. He! Jesu thainai aliu khuga wanglanlo, 
  Wang kasan thiulanjiu tingtheng 'wang thiu lanlo; 
  Aben masan makdi Mary ben se kumjiu, 
  Tingtheng Natu thuan raleng takum wang lanlo.

Translation: "(On the Christmas Night)"

Category: "Christmas"

