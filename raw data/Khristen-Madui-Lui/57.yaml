ID: "57"

Title: "MALUANG KAWIBO"

Key: "E"

Time signature: "3/4"

V1: |
  1. Maluang kawibo bam, sibo ram diu lamse,
  Duidigen kawibo ramlam bam;
  Tapirao kubo bam ga a Rapiu shaikhai,
  Aliu kadihmai leng shaikhai-e.

CH: |
  (Chorus)
  Pa shaibo tu maning jiu, Amikdui kiu-e,
  Maluang tu I phui pawan machang;
  Chariu puijiu a Rapiu niu siga shai-e,
  Akum jiu nuan maitu rankhai-e.

V2: |
  2. Singchai ripbo phungtad, palung chariu puijiu,
  Tathu pirun run khaira tadle;
  Singchai ga gen khai jiu maihina kap hui-e,
  Tapirao luang ga Jesu shai-e.

V3: |
  3. Kadihri tamiu-e, tatudi kak mine, 
  Chariu magenthiubo khuan chiujiu; 
  A Rapiu khuan niu shen chia mine kadih riga, 
  Aliu maihina tu rankhai-e.

V4: |
  4. Naimik di pad ngam mak, kadihri tamiu-e, 
  Rankhaipiu shai kathi malai-e;
  Maihina malumlo kasa hina ngamde, 
  Kashaitu ngam ringsu lan mide.

Translation: "(There is a Hill)"

Category: "Christ life & Love"

