ID: "402"

Title: "SIGA TAZAN KUBO RONGGA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Tingwang niu make mud kiu sune kadihri tinghah sai,
  Tingtheng kabenbo ramga I bam raleng;
  Rankhai mainah tu duidi genlam khom wang arong dasai,
  Siga tazan kubo rong ga I bamne.

CH: |
  (Chorus)
  Siga tazan kubo rong ga, (3x)
  Siga tazan kubo rong ga I bamne.

V2: |
  2. Khrista ga shai lumai ringsu lanbo nai nsuan dasai,
  Ringsu lanbo pakendi ga I bamne;
  Paniu kadalu maidung Tinggen ky wangbo nai dasai,
  Siga tazan kubo rong ga I bamne.

V3: |
  3. A Rapiu tense tingmik machang I tenjiu lung bamne,
  Paniu lungsabo cham dinron tad sukhe;
  Pasai ating tangjiu kadihpiri ten hai loi dasai,
  Siga tazan kubo rong ga I bamne.

Translation: "(When the Roll is Called up)"

Category: "Aspiration after Heaven"

