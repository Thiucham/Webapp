ID: "183"

Title: "RANKHAIPIU TU PI NGUT KHAILO "

Key: "E"

Time signature: "4/4"

V1: |
  1. Rankhaipiu kamunga chapjiu bamme,
  Ngut khailo kalung ga.
  Kham maganjiu lekhaira khuan bamme,
  Pingutlo kalung ga.

CH: |
  (Chorus)
  Rankhaipiu kamunga cham bamme,
  Liangri bambo suanna khang mide;
  Nalung khamle mangalo,
  Rankhaibopiu ngut raleng;
  Pingutlo kalung ga.

V2: |
  2. Pahai naka withubopiu se-e,
  Pingutlo kalung ga.
  Pawan machang gukhaibo piu se-e,
  Pingutlo kalung ga.

V3: |
  3. Pingut khaimakjiu kalan mitulo, 
  Pingutlo kalung ga.
  Pasaira Pah wanglan lakmi sune, 
  Pingutlo kalung ga.

V4: |
  4. Paniu kubambo khuanse kingkhailo, 
  Pingutlo kalung ga. 
  Nachun wijiu Patu sundao khailo, 
  Pi ngutlo kalung ga.

Translation: "(Let the Blessed Saviour In)"

Category: "Invitation & Baptism"

