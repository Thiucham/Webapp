ID: "12"

Title: "TINGWANG LU MADIA RIRI"

Key: "D"

Time signature: "3/4"

V1: |
  1. Tingwang lu madiari ri, tadui agi bonai,
  Chawan ramliang, Tingwang nai I tadda,
  Pagu mily dung tapin tiutad, manam hangga
  Pah mily I.

CH: |
  (Chorus)
  Singgiu dui <Taning dihga>
  Singh bang dung <kadih luangri>
  chawanram liang <Chawanram liang>
  Tingwang nai I tad <Tingwang nai I tad.>
  'chun da sai <Taning dihga>
  Pakhanlui  <luangku riga,>
  Koikoi na <koikoi na>
  Tingwang nai I <Tingwang nai I>

V2: |
  2. Tingwang lungsiat ga pumtan , nai chunwibo bamme,
  Tingwang nai I tadbo dejiu wilo,
  Kadih piri bamthen patu kung paten thiune
  Panah ye I.

V3: |
  3. Tingwang chamkeng kawi, kadihri sichai khailo.
  Masanbo hiupuinah pumtan pine,
  Tingpi tingrun sitang jiu, patu malum mine,
  Halleluyah.

Translation: "(In God's Green Pastures)"

Category: "Grace, Redemption & Love"

