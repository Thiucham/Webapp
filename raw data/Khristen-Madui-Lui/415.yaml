ID: "415"

Title: "KUNGBO KACHIA"

Key: "E"

Time signature: "3/4"

V1: |
  1. Paniu wang dasai wang dasai, 
  Pagu kachia hina;
  Kakungbo kachia hinase, 
  Pagu thiu kamne.

CH: |
  (Chorus) 
  Paliu nsuan ganbiu kum, 
  Pa pirun thiu lujiu;
  Paliu gu wat seniu, 
  Paliu pirun thiu-e.

