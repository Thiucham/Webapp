  Pawang dihga khom wang;
  Kamasanbo kachia dungse, 
  Pagu thiu kamne.

V3: |
  3. Nahmai dungse nahmai dungse, 
  Ranpao tu kakung maidung;
  Kakungbo kachia dungse, 
  Pagu kam mide.

Translation: "(Jewels)"

