ID: "334"

Title: "TASIBO RACHAM I THIUNE"

Key: "E"

Time signature: "3/4"

V1: |
  1. Tasibo racham I thiune,
  Khrista aleng shaikhaibo;
  Tinggen ky wibo saodiak jiu,
  Calvary ga shaikhai-e.

CH: |
  (Chorus)
  Tasibo racham I thiune,
  Aleng-e Khrista shaibo;
  Thiulo kendibo lui khuan niu, 
  Aruang ne singgiu genlam.

V2: |
  2. Hamibo mily tu kumjiu,
  Jesu atu phiu wang-e;
  Lungsabo benniu jukhai jiu,
  Puiki ga luang wang khaide.

V3: |
  3. Jesu niu azambo wikhai,
  I kaojiu bambo gasu;
  Ping bamma amik ngao makjiu,
  Paniu wikhai lan bide.

V4: |
  4. Tamiubo niu atu gombam, 
  Magenthiu jiu I tad bam; 
  Rankhaipiu atu 'luang bamme, 
  Paben niu juken khaine.

V5: |
  5. Singgiu se I niu ken makthen,
  Paniu majang khai bamne; 
  Paniu tinggen maluang wangjiu, 
  Amaning maitu ngaone.

Translation: "(I Will Sing the Wondrous Story)"

Category: "Assurance & Testimony"

