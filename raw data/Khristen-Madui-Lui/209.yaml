ID: "209"

Title: "I ZUAN WANG-E"

Key: "B"

Time signature: "4/4"

V1: |
  1. Kadihri chengsa I saodiak jiu,
  Tuhoira malan lakge;
  Kadihri ten kasabo dungniu,
  Atu kam mariu bamme.

CH: |
  (Chorus)
  I zuan wang-e mazat jiu,
  Achun matha jiu;
  Jesu tan kachangbo ga,
  I zuan wang-e.

V2: |
  2. Tuhoi sujiu a nuan sao mine,
  Rankhaipiu khulam zuan jiu;
  Jesu lad majibo masanbo,
  Chamai hina ringra-e.

V3: |
  3. Tuhoi sujiu ranpao sai suine,
  I achun wijiu tadne;
  Palad piujiu bammai dung lengra,
  Tingtheng ringbo pikhai ne.

Translation: "(I am Resolved)"

Category: "Response & Repentance"

