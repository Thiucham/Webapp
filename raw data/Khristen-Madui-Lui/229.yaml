ID: "229"

Title: "JESU ATU JUKHAILO"

Key: "B"

Time signature: "3/4"

V1: |
  1. Jesu atu jukhailo,
  Kahiambo duidi kenra;
  Maidin silakbo duidi,
  Tasing tatu liam mide;
  Nang niu maning bo gase,
  Jesu atu jukhailo.

V2: |
  2. Papui panah tu hiam kum,
  Kasuak bo dui kham khailo;
  Tadui di nalad piu-e,
  Nang niu dinkhai sai saone;
  Duidih papao se nang-e,
  Jesu atu jukhailo.

V3: |
  3. Duidih gen I nawang sai,
  Kapingbo pi ha khailo;
  Atu pi mathak khailo,
  Napam ga I mathak ra;
  Nang akhu dinbo chiura,
  Ping mane jukhai bine.

Translation: "(Jesus Saviour Pilot Me)"

Category: "Driving guidance & Protection"

