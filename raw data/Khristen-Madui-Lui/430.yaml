ID: "430"

Title: "MASUANG ZUANLO CHABONKIN MAI"

Key: "D"

Time signature: "6/4"

V1: |
  1. Masuang zuanlo chabon kinmai, 
  Nahmai tu ranlo thainai;
  Nahmai Jesu khuga wanglo,
  Wangjiu 'puise zuan wanglo.

CH: |
  (Chorus)
  Masuang zuanlo chabon kinmai, 
  Majibo 'puiga wanglo;
  Tamiubo ga hami maitu,
  Kabenbo ga pui wanglo.

V2: |
  2. Masuang zuanlo chabon kinmai, 
  Aliu dechiu ri bamlo?
  Tingwang lungsiat aliu simak, 
  Chunsa maitu pui wanglo.

V3: |
  3. Masuang zuanlo chabon kinmai, 
  Karingbo taruak phungjiu;
  'Liutu Jesu khu puiwanglo, 
  Paliu mathiuse wanglo.

V4: |
  4. Masuang zuanlo chabon kinmai, 
  Marakjiu ngajiu tadlo; 
  Masuang zuanlo kawi lura, 
  Chunwi lui thiujiu tadlo.

Translation: "(Onward Oh! Junior Endeavour)"

Category: "Christian mission"

