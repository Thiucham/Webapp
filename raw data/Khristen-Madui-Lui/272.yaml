ID: "272"

Title: "SINGGIU KHUAN KUM"

Key: "G"

Time signature: "6/8"

V1: |
  1. Maluang kaku ganiu singgui luangkiu, 
  Duiliu kawi luangjiu bamme;
  Chalui khuan kawibo kumjiu luang bam, 
  Sibo saisui thiulo.

CH: |
  (Chorus) 
  Singgui khuan kum, (2x)
  Duipui ga luang khai-e;
  {Singgui khuan kum, (2x)} 
  Chalui kawi thiubam.

V2: |
  2. Tatun tingriu seniu kam agikhai, 
  Nuirim rim jiu patu thuanlo;
  Chapiu niu charapen hina riga, 
  Chunwi matha bamlo.

V3: |
  3. Nang niu luang bambo saisui chunwi bam,
  Duiliu kawi luangjiu bamme;
  Tad khaibo bam machangna thoidam bam, 
  Maihina niu thuanlo.

V4: |
  4. Aliu nahmai dungdi singgiu kumjiu, 
  Chalui thiune chalui thiune;
  Tachun wijiu tachun ri nga bamlo, 
  Ri ngabo lui thiulo.

Translation: "(Murmuring Stream)"

Category: "Conflict & Victory"

