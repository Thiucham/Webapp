ID: "367"

Title: "ALENG CHAKY"

Key: "A"

Time signature: "4/4"

V1: |
  1. Naimik kiu khaibo sailam se,
  Kamuang gombo sailam;
  Ganbiu kabambo rilam se,
  Aleng chaky bamme.

CH: |
  (Chorus)
  Chaben niu thiumak bo kysin,
  Kaden khaibam aleng;
  Tingwang nai masan maidung bam,
  Sise aky leng nge.

V2: |
  2. Kashai thiuniu bo genlam ra,
  Magenthiubo genlam;
  Pawan kali makbo ram lam,
  Aky leng kaden bam.

V3: |
  3. Kashaibo tamiubo genlam, 
  Lung chariubo genlam; 
  Achun wijiu I niu phui-e, 
  Kabenbo aky tu.

V4: |
  4. Amao nai I niu kapingbo, 
  I phutkhai dia lujiu; 
  I tad mine siga tingtheng,
  Khrista nai lung bamra.

Translation: "(A Home on High)"

Category: "Aspiration after Heaven"

