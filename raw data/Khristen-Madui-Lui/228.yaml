ID: "228"

Title: "RANKHAIPIU NIU JUKHAI GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rankhaipiu benniu jukhai ga,
  Aluni hina pikhai-e;
  Palungsiat dibo malumjiu,
  'Pui machang pasai suine.

CH: |
  (Chorus)
  Rankhaipiu jukhai ga tadne, (3x)
  'Pui machang pasai suine.

V2: |
  2. A mpui tamiu jiu chariudi,
  Aphi khengkhai raobam liudi;
  Pakhuan niu achun ka wang-e,
  'Pui machang pasai suine.

V3: |
  3. Kadih gu thiuniubo bamdi, 
  Sabo niu atu rebamdi; 
  Lungsabo ben niu atu pam, 
  'Pui machang pasai suine.

V4: |
  4. Kadih ating loiwang dasai, 
  Tingtheng lungra atu kusai; 
  Singgiu genlam lungsamai nai, 
  'Pui machang pasai suine.

Translation: "(Where My Saviour Leads)"

Category: "Driving guidance & Protection"

