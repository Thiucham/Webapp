ID: "54"

Title: "PABENNIU ATU PAMLU"

Key: "E"

Time signature: "4/4"

V1: |
  1. Shaibo nuan bang phunglu jiu I khrista gasu diu mide,
  Maikhat tudi wajiu kha malum bimak;
  Chiudi atu kendibo Rapiu niu pakhuga jukhai,
  Khatdi paben niu atu pam lude.

CH: |
  (Chorus)
  {Kungbo paben niu atu pamlu, (2x)}
  I niu paju phui khaijiu lungsa diang mide,
  Paniu kungbo ben niu atu pamlu.

V2: |
  2. Rankhai mibo zainiu kuak khaira koina atu dinne,
  Pa anuan kuak ra singchai ga maseng khai;
  Agimanaibo hiuna tinggen thoidam alungga wang,
  Paniu kungbo benniu atu jukhai.

V3: |
  3. Naimachang marumbo 'pui gasu jukhaijiu thoikhai-e, 
  Shaibo nuan gasu pah atu phud khai-e; 
  I niu palungsa ga bamsai maidi atu hiamlulak, 
  Khatdi Paben niu atu pamlude.

V4: |
  4. Nuan phungbo nang pagu ringbo thoidamtu lukhai lakma? 
  Mangambo nuanse paniu phudkhai ngamme;
  Nalung tuhoi pahtu pikhaisai chunwibo daosiakne,
  Khatdi pa ben niu atu pamlude.

Translation: "(His Loving Arms Around Me)"

Category: "Christ life & Love"

