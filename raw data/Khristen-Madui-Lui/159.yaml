ID: "159"

Title: "BIBLE MAJI-E"

Key: "C"

Time signature: "6/9"

V1: |
  1. Tingwang ganiu daobo Bible hai,
  Chamchang khuang-e I se-e;
  Hiupuina masanbo rachamme,
  Masan kachangbo chamme.

CH: |
  (Chorus)
  I niu se-e masan kachangbo chamme;
  Masanbo ariak kawi chamme,
  Masan kachangbo chamme.

V2: |
  2. Masanbo ariak Tingwang niu pi,
  Nai machang atu jukhai;
  Kawi cham-e atu kam matan,
  Hiuna ringrabo chamme.

V3: |
  3. Masanbo ariak mai luraodi,
  Kawi chamme I lune;
  Juringbo ngaolu rabo chamme,
  Tingwang gu ladriat chamme.

Translation: "(I Know the Bible is True)"

Category: "Message"

