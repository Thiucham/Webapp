ID: "268"

Title: "MATIP JIU CHAP BAMLO A RAPIU GA"

Key: "G"

Time signature: "4/4"

V1: |
  1. Matib jiu chap bam lo a Rapiu pumtan ga,
  Palingbo palad gase chap bamlo;
  Chari thiubo bam gasu natu gukhai ne,
  A Rapiu zan ga nang niu ngam sune.

CH: |
  (Chorus)
  Matip jiu chap bamlo, 
  Chawang lad phungjiu ngamra tadlo;
  A Rapiu kendibo nai palad niu ngam rabo leng,
  Chap matiplo a Rapiu zan ga.

V2: |
  2. Matib jiu chap bam lo a Rapiu pumtan ga,
  Ngao khailak maidung suangga pak makjiu;
  Maji raleng chari thiubo ga khakhai ne,
  Pa pumtan ga hujiu suang lam tadlo.

V3: |
  3. Matib jiu chap bam lo a Rapiu pumtan ga,
  Paladriat hina maolan bi lakge;
  Maji raleng chari thiubo ga jukhai ne,
  Patu malumlo nang niu ngam sune.

Translation: "(Be Yet Strong in the Lord)"

Category: "Conflict & Victory"

