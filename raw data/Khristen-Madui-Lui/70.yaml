ID: "70"

Title: "JESU CHAWANG BAMGA"

Key: "E"

Time signature: "6/9"

V1: |
  1. Tinggen chawang bamga, 
  Tuhoi Jesu bamde;
  Chawang pirun run lujiu, 
  Masan maidung kahumme.

CH: |
  (Chorus) 
  Rankhaipiu pamga pakendibo thiu sune;
  Aliu chun kim sune, 
  {Pa saira (3x)}
  Aliu chun kim sune, 
  Pa saira.

V2: |
  2. Paliu chapga thaoben, 
  Chamai dinkam kalak;
  Paliu benniu tadan nui, 
  Thinjiu thuanbo lui thiu-e.

V3: |
  3. Tingwang tu thuanbo lui, 
  Thiuronlo kadih ga;
  Milyzai niu khiu kalumai, 
  Masanbo pon piune.

V4: |
  4. Masanbo Hiupuina,
  Lungsiat pikiu khai-e; 
  Aliu chunwi mathajiu, 
  Bam chamne tinggendih ga.

Translation: "(Enthron is Jesus Now)"

Category: "Humiliation, Resurrection & Glory"

