ID: "87"

Title: "PHUILO PAH WANGKIUBO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Phuilo pah kamuang ga kiubo,
  Nuan phungmai niu kam shatbo;
  Kashaibo tu ngambo piu-e,
  Pakhommai niu sen wang ne;
  Halleluyah halleluyah halleluyah!
  Jesu niu chawang thiune.

V2: |
  2. Mathiuna mikniu ngao sune,
  Pakendi jiu wang sune;
  Patu minlu zaun mi maidung,
  Cha ngiu phen khaimi maidung;
  Kapjiu huibam achung jiu bam kapjiu huibam,
  Paliu mikniu ngao sune.

V3: |
  3. Kanambo makese mudsai,
  Ting kadih hami sune;
  Patu mareng mai hinatu,
  Kam mangam khaira bo-e;
  Ladzan tingmikse wang kinne, wangsang jing ne,
  Ladzan thiu raleng wanglo.

V4: |
  4. Pah wangra khuan bambo maidung, 
  Pakendi jiu wang kinne; 
  Pagu masan maidung seniu, 
  Tingpuk ga patu daone; 
  Halleluyah halleluyah halleluyah!
  Phuilo tingmikse wangde.

V5: |
  5. Natu kahumjiu thuan, Amen! 
  Tingtheng nakendi bamlo; 
  Kendi nai pumtan nagu-e, 
  Tingtheng chawang thiu bamlo; 
  Majad sulo kalang sulo katum sulo,
  Halleluyah!

Translation: "(Lo! He Comes)"

Category: "Second coming"

