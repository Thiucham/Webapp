ID: "154"

Title: "ALIU NIU DINRABO RACHAM KHAT BAM"

Key: "E"

Time signature: "4/3"

V1: |
  1. Aliu niu dinrabo racham khat bam,
  Paliu chun kam maji khaira;
  Lungsiat nai majibo racham,
  {Agimanaibo racham. (2x)}

CH: |
  (Chorus)
  Tamiubo se nsuan kum ben mine,
  Nsuan se Nnian kum ben mine;
  Khrista niu kadih mawang mine;
  Lungsabo nai benbo niu Amen.

V2: |
  2. Aliu niu thiurabo luidi khat bam,
  Paliu lungsu khai rabo lui;
  Kasabo ritu ngambo lui;
  {Chaheng changiu hamira. (2x)}

V3: |
  3. Aliuniu paoronra mari khat bam, 
  Sise Rapiu gu kawicham; 
  Aliu leng Panahtu pikhai,
  {Tingwang lungsiat madu khai. (2x)}

V4: |
  4. Aliuniu lianrabo Rapiu khat bam, 
  Chariu magenthiubo kheng khai; 
  Kadihmai khu dinron raleng, 
  {Tingwang gu majibo-e. (2x)}

Translation: "(We've a Story to Tell)"

Category: "Message"

