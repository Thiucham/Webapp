ID: "377"

Title: "MANING SURA GASUANG"

Key: "B"

Time signature: "6/4"

V1: |
  1. Maning surai gasuang,
  Alungchun nawang-e;
  I nawang-e tingmik machang,
  Karai ga suang nade.

CH: |
  (Chorus)
  Nade aky, (2x)
  Aky nawang tingmik machang;
  Karai ga suang nade.

V2: |
  2. Nawang-e apiu ky,
  Siga chabam keng bam;
  Chawang pirunse lu raleng,
  Duipui se nawang-e.

V3: |
  3. Karing ting hai nawang,
  Karipbo bang saora;
  Singchai sao khaira nawangde, 
  Chawang pirun lura.

V4: |
  4. Singgiu mung ga nawang, 
  Atu jukhai khelo; 
  Chaky lam nawang mid midle, 
  Karai ga suang nade.

Translation: "(One Sweetly Solemn Thought)"

Category: "Aspiration after Heaven"

