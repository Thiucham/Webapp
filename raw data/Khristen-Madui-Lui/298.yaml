ID: "298"

Title: "PALIUTU PUIWANGLO"

Key: "A"

Time signature: "4/4"

V1: |
  1. Chabam maruang bamme pui wanglo,
  Chawang khum kibo tiu raleng;
  Ka madui jiu paky se phui khailo,
  Mariu charimai wang tiulo.

CH: |
  (Chorus)
  'Puidi nai pabam machang ga tadlo,
  Tamiubo nuan mpui gase;
  Chalungsabo ladse phung lujiu,
  Hami maitu pui wanglo.

V2: |
  2. Chabam maruang bamme pui wanglo,
  Magenthiu maitu pui wanglo;
  Paliu lung dejiu ga chariu gulo?
  Kubo khuanse chiulan lakge.

V3: |
  3. Chabam maruang bamme pui wanglo,
  Haise kulam Tingwang ladle;
  Lungsabo ga puiwang madui khailo,
  Lungsa sibo Jesu pamga.

Translation: "(Gather them in)"

Category: "Christian service & Reward"

