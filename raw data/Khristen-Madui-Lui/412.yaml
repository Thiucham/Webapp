ID: "412"

Title: "TADUI MALIAM MINE"

Key: "E"

Time signature: "6/8"

V1: |
  1. Tadui maliam mine ramkeng lam tad,
  Akang maidung tu maten tadle duidi siga niu;
  Dangbambo duidi se tuhoi lekhai de, 
  Ringbo duidi tuse zuan jiu tad sulo.

CH: |
  (Chorus) 
  {Maten tadle, 
  Tingtheng ringbo dui ring lungga; (2x)}

V2: |
  2. Duidi kasuak bo khuan I chiulu ne, 
  Aliu kangmai khangsia tudi siga maten tadle;
  Tingwang tu thuanbo lui thiujiu maten tad, 
  Masanbo phaini thin paliu Tinggen zuan.

V3: |
  3. Tadui maliam mine ramkeng lam tad, 
  Akamai dung khangsia tudi siga maten tadle;
  Tamiubo gadi kabenbo pikhai-e,
  Tingkai tingriu wangdi shingbo tan bamne.

V4: |
  4. Tingkai hunwang bijiu tadui kasuak,
  Akamai khon tadui kadi riga I chiu lune;
  Sise rankhaipiu niu atu kakbo-e,
  Akhu ga wangsai aman bose ngaone.

Translation: "(The Tied is Flowing Out)"

Category: "Aspiration after Heaven"

