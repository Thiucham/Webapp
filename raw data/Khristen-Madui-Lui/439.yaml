ID: "439"

Title: "TINGWANG LUNGSA"

Key: "⚪"

Time signature: "3/4"

V1: |
  1. Tingwang lungsabo hai dithu,
  Chamai niu ra din silakge;
  Palungsiat hai tingpuk suang ku,
  Chariu dih suang di nah diang-e;
  Chamai nahgu kamao bose,
  Tingwang nah niu ngam khai;
  Panah maigu kamao bose,
  Paniu kuak khai bi-e.

CH: |
  (Chorus)
  Tingwang lungsa dejiu wilo,
  Waniu kada silak;
  Palungsiat hai tingtheng leng-e,
  Chiujiu Tinggen mai thiu.

V2: |
  2. Kadih chariubo ting loisai,
  Kadih chawang hina hane;
  Tingwang tu simak maidung se,
  Malong dung hangga bai sune;
  Tingwang lungsa lilan makge,
  Waniu kada silak;
  Adam kaikik tu rankhai-e,
  Chiujiu Tinggen mai thiu.

V3: |
  3. Duipui niu ariak dui thiujiu,
  Tingpuk niu ariak pek thiujiu;
  Singke hina ariak tang thiu,
  Kadihmai hina niu rao di;
  Tingwang lungsa ra rao kamlak,
  Duipui di sang mine;
  Ariak gadi rao kam silak,
  Wadao di rao kamlak.

Translation: "(The Love of God)"

Category: "Special songs"

