ID: "153"

Title: "OH! ZION MAI MAJATLO"

Key: "B"

Time signature: "4/2"

V1: |
  1. Oh! Zionmai majatlo naten donga,
  Tingwang hai ben bo-e chiujiu dinlo;
  Kadih mainah khat nadi hara suimak,
  Tingkadih jat hina kadampao niu.

CH: |
  (Chorus)
  Wibo cham dinlo, 
  Manaibo cham;
  Rankhaibo Jesu, 
  Racham dinron sulo.

V2: |
  2. Chamai jat hina chakhuan hina khuga,
  Pao ronlo Tingwang niu lungsabo cham;
  Pagu gandam situ ranlura shaikhai,
  Tinggen ramga chamai hina lung ra.

V3: |
  3. Pakendibo chamse namaidung khuga,
  Chakhiu chalan hina pikhai bilo;
  Paliu hiuna jengniu singjiu kheng bamlo,
  Oh! Zionmai majatlo benbam ga.

Translation: "(Oh! Zion, Haste, Thy Mission High Fulfilling)"

Category: "Message"

