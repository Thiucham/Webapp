ID: "349"

Title: "MASUANG ZUANLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Khrista khuga tan hujiu maji maidung,
  Nang chari thiu raleng kaden khai bamme;
  Nuan gu kadih kenjiu masuang zuan tadlo,
  Aliu phizeng Tinggen kadih ga daone.

CH: |
  (Chorus)
  Masuang zuanlo cross riphen,
  Manang makjiu malum bamlo;
  Masuang zuanlo cross riphen,
  Patu malumjiu palad phunglo;
  Chari ngam raleng.

V2: |
  2. Satan niu kam mahara matan bamme,
  Jesu lungsiat pen ganiu aliu ngamne;
  Katan kahubo riphen tadrai mide,
  Ch'ri ngam lujiu paliu kylam wang mide.

V3: |
  3. Aliu matanjiu masuang lam zuan sukhe,
  Jesu tu phuijiu malumjiu sing bamkhe;
  Dinron khe mathiuna Rapiu Khrista tu,
  Aliu hosanna shensai satan pak'ne.

Translation: "(Onward Ever Onward)"

Category: "Assurance & Testimony"

