ID: "345"

Title: "MAIDI HAH"

Key: "F"

Time signature: "4/4"

V1: |
  1. Jesu kumjiu chaka wimai hah-e,
  Maidi ha maidi hah.
  Atu juring raleng kaki mai ha,
  Maidi ha maidi hah.

CH: |
  (Chorus)
  Jesu aliu chariu tu se-e,
  Paniu aliutu majang khai;
  Jesu kumjiu chaka wimai hah-e,
  Maidi ha maidi hah.

V2: |
  2. Jesu kumjiu kamasan mai hah-e,
  Maidi ha maidi hah.
  Jesu kumjiu palung wimai hah-e,
  Maidi ha maidi hah.

V3: |
  3. Jesu kumjiu majang khai mai hah-e, 
  Maidi ha maidi hah.
  Jesu kumjiu lungsa khaimai hah-e, 
  Maidi ha maidi hah.

V4: |
  4. Jesu kumjiu jukhaibi mai hah-e, 
  Maidi ha maidi hah.
  Jesu kumjiu masan maidi hah-e, 
  Maidi ha maidi hah.

V5: |
  5. Ranpao kumjiu pikhai simai hah-e, 
  Maidi ha maidi hah.
  Tinggen ga aliutu luang ngut rahah, 
  Maidi ha maidi hah.

Translation: "(No Not One)"

Category: "Assurance & Testimony"

