ID: "130"

Title: "ATU MAJANG BAMLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Atu majang bamlo chun tamiu ga,
  Tamiu wang kinne atu majang lo;
  Kha khaimai hajiu alung chariu sai,
  Rankhaipiu nang atu majang khailo.

V2: |
  2. I karingting ra kuinuang rabo-e,
  Kadih kendi nai mathabo hane;
  Kata hina kuimaha kamra-e,
  Kalimakbo nang niu majang khailo.

V3: |
  3. Pingbo manangbo thiu makjiu wanglo,
  Wikhai ra nakan hangga I wang-e;
  Chariubo mikdui luang jiu kheng bamme,
  Nuan phungmai chaka atu luang bamlo.

V4: |
  4. Pawan machang I natu maning-e, 
  Kahiambo hara sao pumtan bamlo? 
  Atu jukhaimai nakumbo hah-e, 
  Bendi tamiudi nang majang khailo.

V5: |
  5. I ping lakge nang atu majang sai, 
  Chariubo niu mikdui luangbam liudi; 
  Kashaibo nai charaw niu tan bamdi, 
  I niu ngamne nang niu majang bamsai.

V6: |
  6. Ating tangjiu bamdi majang khailo, 
  Tamiu wangkinne atu majanglo;
  Tingben padsai nakhu lam wangtang ra, 
  Shaidi ringdi Rapiu majang khailo.

Translation: "(Abide With Me)"

Category: "Evening closing"

