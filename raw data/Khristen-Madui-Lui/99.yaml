ID: "99"

Title: "A RAPIU GA MATHA BAMLO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Matha ringalo Rapiu ga,
  Chamai masan mai hina niu;
  Patu malumjiu ring ngalo,
  Chariubo lungchun se sao jiu.

CH: |
  (Chorus)
  {Matha, matha,
  A Rapiu ga matha bamlo, (2x)}

V2: |
  2. Mathalo pah a Rapiu-e,
  Kadihmai na nai Tinggen mai;
  Pagu ladkeng niu kadih dam,
  Pagu pumtan niu rankhai-e.

V3: |
  3. Naliu ri keng jiu bam luidi,
  Matan lo tachun li makjiu;
  Tingwang riphenmai na suangga,
  Sang sang suang keng jiu bam phui-e.

V4: |
  4. Tamiubo niu natu gomdi, 
  Natu gukhaira wangkinne; 
  Wakamdi nalung chariutu, 
  Tingtheng malumjiu bamlulo.

V5: |
  5. Matha ringalo Rapiu ga, 
  Thuanbo lui kawaise thiujiu; 
  Thiulo naliu khuan marangjiu, 
  Senlo halleluyah chiujiu.

Translation: "(Rejoice in the Lord)"

Category: "Praise & Opening"

