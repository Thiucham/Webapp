ID: "108"

Title: "THUANLO A RAPIU TU"

Key: "B"

Time signature: "4/4"

V1: |
  1. Thuanlo a Rapiu tu hosanna shenjiu,
  Thuanlo naliu chunwi jiu;
  Thuanlo naliu chunwi jiu chawang bamga,
  Pazan masanbo dinlo;
  Majang bamlo chawang pengphai hangga,
  Lungsa khaibo malum jiu tadlo;
  Lungsa jiu kaben boniu majang bine,
  Kabenbo niu aliutu tingtheng jukhai sune.

CH: |
  (Chorus)
  Nachun wijiu tadlo,
  Pengphai kazit aliu riga,
  Nachun wijiu tadlo,
  Thiujiu tadlo mathabo lui,
  Nachun wijiu tadlo,
  Aliu suangga kamuang kum tadbam,
  Pah maken tingtheng dihga wang tang makthen.

V2: |
  2. Tingtheng 'wang kadibo Rapiu tu thuanlo,
  Kulangbo Rapiu kendi;
  Rapiu tu thuanlo palungsiat tu dinjiu,
  Tinggen mailui thiu chamlo;
  Kangjang tad ringa jiu kangjang tadlo,
  Aliu tadne Jesu bam boga;
  Aliu matha rabo chunwi thubo ky,
  Aruang jiu Rankhaipiu zantu tingtheng thuan bamne.

Translation: "(Praise Ye the Lord)"

Category: "Praise & Opening"

