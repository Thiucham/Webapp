ID: "339"

Title: "SINGCHAI GA"

Key: "E"

Time signature: "4/4"

V1: |
  1. A Rapiu ladlui thiu raleng,
  Mangambo thiu lakge;
  Pagu singchai I niu phungne,
  Palad se din ronne.

CH: |
  (Chorus)
  Singchai ga, (2x)
  Siga benbo bamme,
  Chengsa hina masan khaibo bamme;
  Situ malumjiu I wang ngao lune,
  Karingting mathajiu bam mine.

V2: |
  2. A Rapiu zan I niu se-e,
  Patu ronna malum;
  Akummai tudi rankhai ra,
  Paniu shaikhai mide.

V3: |
  3. Paniu ladriat khaibo kumjiu, 
  Atu rankhai sune; 
  Anuan jengniu patu kamshat, 
  Tu' alung li mide.

V4: |
  4. Pageng hahbo atu gujiu, 
  Tinggen lam lukhangra; 
  Jerusalem kasanbo ga, 
  Azan raokhai mide.

Translation: "(At the Cross)"

Category: "Assurance & Testimony"

