ID: "38"

Title: "ATU PHIU-E"

Key: "G"

Time signature: "6/4"

V1: |
  1. Jesu gukhaipiu Bethlehem ga wang,
  Magenthiu jiu matomky ga mana;
  He! dejiu tasi gulo pazan hai,
  Atu phiu-e phiu-e.

CH: |
  (Chorus)
  Atu phiu-e phiu-e, (2x)
  He! tasiye dechiu ngamlu gulo!
  Atu phiu-e phiu-e.

V2: |
  2. Jesu gukhaipiu Calvary ga shai,
  Ahiupuinah rankhai ra shai khai-e;
  He! tasiye dechiu ngamlu gulo!
  Atu phiu-e phiu-e.

V3: |
  3. Jesu Gukhaipiu niu atu ku-e,
  I 'pui simak jiu tad mariu bamga;
  Chalungsabo khuan niu atu ku-e, 
  {Atu ku-e ku-e. (3x)}

V4: |
  4. Rankhaipiu tinggen lamniu wanglanne,
  Pahniu ladriat khaibo kum wang lanne;
  Tinggen lamsu niu wangbo I ngaone,
  {Ajeng gasu wang-e. (2x)}

Translation: "(Seeking for Me)"

Category: "Christ life & Love"

