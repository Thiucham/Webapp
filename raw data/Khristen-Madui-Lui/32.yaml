ID: "32"

Title: "JESU AKUMMAI TUDI LUNGSA"

Key: "G"

Time signature: "6/8"

V1: |
  1. Achunwi-e tinggen lam apiu bam,
  Paniu kungbo Bible gadin khai-e;
  Pagu tasibo hina I ngaode,
  Sise Jesu atu kungbo gu-e.

CH: |
  (Chorus)
  Achunwi-e Jesu niu lungsa,
  Atu lungsa, atu lungsa,
  Achunwi-e Jesu niu lungsa,
  Atu di lungsa khai.

V2: |
  2. Patu mangai jiu ronmeng tad midi,
  I hamidi paniu atu kung-e;
  Pah kungbo I maning daolu gasu,
  Mari wangjiu pakhu lam zuan wang-e.

V3: |
  3. Iniu chalui kawibo thiusi sai,
  Paken dibo situ thuan jiu bamne; 
  Jesu niu atu kungbo hai suang hah,
  Tingtheng I patu thuan jiu bam mine.

V4: |
  4. Jesu atu kung, I patu lungsa, 
  Atu kungjiu paniu atu rankhai; 
  Jesu aleng singchai riga shai khai, 
  I silude, Jesu atu kungbo.

V5: |
  5. Mainiu Juringbo chamsi maniu sai, 
  Jesu niu atu kungbo din khaine; 
  Masanbo Hiupuina niu din khaine, 
  Jesu niu atu kungbo madune.

V6: |
  6. I sulujiu achun wijiu bamme, 
  Jesu tu malumjiu I amanne;
  Alung kasabo satan pak mide, 
  Jesu niu atu kungbo I si-e.

Translation: "(Jesus Loves Even Me)"

Category: "Christ life & Love"

