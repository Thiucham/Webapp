ID: "424"

Title: "CHALU GERA KU BAMME "

Key: "A"

Time signature: "3/2"

V1: |
  1. Pabam machang chamiu minde,
  Miusy minrem ra thiude;
  Paluang pabek pabam machang,
  Naimik padbo bam hina.

CH: |
  (Chorus)
  Tingwang niu chalu gera,
  Lang kiulo aliu kheng-e;
  Chamiuse ge madui raleng,
  Miusy remra thiu bamme.

V2: |
  2. Naimik pad kaji kari ga,
  Nsuan nnien thao khailo;
  Chawan liang liudi thao khailo,
  Miusy dung hai ge raleng.

V3: |
  3. Ge majatlo chamiu minrem de,
  Miusy dung hai ge kamra;
  Chawan sai chaky wang raleng,
  Matha jiu chaky zuan khe.

Translation: "(A Call for Reapers)"

Category: "Christian mission"

