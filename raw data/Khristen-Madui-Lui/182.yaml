ID: "182"

Title: "JESU TU NALUNGGA PI NGUT KHAILO "

Key: "A"

Time signature: "6/8"

V1: |
  1. Nang nuan bang phungjiu chariu bamme sai,
  Nang Jesu lukhai lulo;
  Kasanbo ringting tu luni-e sai,
  Jesu tu nalungga bamlo.

CH: |
  (Chorus)
  Nalung manang bam tulo,
  Nang patu phut mitulo;
  Tuhoi kham lejiu khuan bam,
  Nalungga Jesu tu khailo.

V2: |
  2. Masanbo situ nang luni-e sai,
  Nalungga Jesu lukhailo;
  Masan raleng duipin naleng luang bam,
  Jesu tu nalungga bamlo.

V3: |
  3. Na khuanniu dinpad silakbo bamsai,
  Nalungga Jesu lukhailo;
  Kadihri niu nachun kimkhai maksai,
  Jesu tu nalungga bamlo.

V4: |
  4. Nang malum naka kachang hahmisai, 
  Nalung ga Jesu lukhailo;
  Pahai dejiukha wibo nakalo,
  Nalung ga Jesu lukhailo.

V5: |
  5. Chunwibo lui thiubo ruang jao nisai,
  Nalung ga Jesu lukhailo;
  Mathabo kyga nang ngut ni ye sai,
  Nalung ga Jesu lukhailo.

Translation: "(Let Jesus Come into Your Heart)"

Category: "Invitation & Baptism"

