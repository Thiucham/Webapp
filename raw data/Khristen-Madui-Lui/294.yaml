ID: "294"

Title: "KHOMWANG MADUILO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Nsuan nnien chawan chalin wibo linglo,
  Tingnai gadi linglo chawan di linglo;
  Ageting tu khuan jiu pasy wibo gejiu,
  Mathajiu phungwang khe a Rapiu kyga.

CH: |
  (Chorus)
  {Khomwang maduilo, (2x)
  Mathajiu phungwang khe a Rapiu kyga. (2x)}

V2: |
  2. Tingnai randi linglo tingkai gadi linglo,
  Tingthung tingkai tudi pingmak jiu linglo;
  Pasy khomwang kam jiu taten hai loi dasai,
  Mathajiu phungwang khe a Rapiu kyga.

V3: |
  3. Rapiu ten thiu raleng kapjiu bamdi lingkhe,
  Chariubo daojiu kap achunsa bamdi;
  Aliutu ku saira kap bose sao lujiu,
  Mathajiu phungwang khe a Rapiu kiga.

Translation: "(Blessing in the Sheaves)"

Category: "Christian service & Reward"

