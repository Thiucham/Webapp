ID: "445"

Title: "PALIU NIU KACHIA BANG BIU DASAI"

Key: "F"

Time signature: "⚪"

V1: |
  1. Singgiu genlam kadih khat bam,
  Sise tingtheng wibo dih-e;
  Aliu malum penniu siga wang sune,
  Shailan makjiu lungbam raleng;
  Khat khat thiujiu siga ngut ne,
  Nang nai aleng kachia bang biubo wanga.

CH: |
  (Chorus)
  Biu bambo khuan nang chiu makma?
  Mazadung lui khuan chiu makma?
  Halleluyah! Jubilee chiujiu thiu-e.
  Kadiulam tingtheng wibo ram,
  Singgiu genlam bambo ramga nang nai.

V2: |
  2. Duidi aliam tai kenpad sai,
  Aliam saobo bam wangtang sai;
  Nuan nai chariubo aliu silan lakge,
  Aliu piuniu lungsa khaibo;
  Pagu thoidam aliu sine,
  Nang nai aleng kachia bang biubo wanga.

V3: |
  3. Aliu ringting hai loibo nai,
  Shaijiu aliu jikiu dasai;
  Aliu hiuna aliutu phut khaibo nai,
  Chariubo adao lan makjiu;
  Kawibo Tinggen ga wangne,
  Nang nai aleng kachia bang biubo wanga.

Translation: "(When they Ring the Golden Bells)"

Category: "Special songs"

