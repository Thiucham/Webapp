ID: "16"

Title: "TINGGEN MAZA LUI"

Key: "A"

Time signature: "12/8"

V1: |
  1. Naikhat nchun chunding tingga,
  Tinggen lamsu chalui thiu jiu wang;
  Chun wijiu ringabo luise,
  Tinggen mazadung chalui thiu-e.

CH: |
  (Chorus)
  Tinggen lam kendi jiu bamlo,
  Kadih ga agimanai bamlo;
  Maidung khu haisi dintad lo,
  Senlo kadihmai dungniu.

V2: |
  2. Mily khuanmai ngao chunding ga,
  Kinglo pabiu thao jiu shenbo khuan;
  Khaoring kuang ga patu kahum,
  Chunwi lui khuan siniu thiubam ga.

V3: |
  3. Aliu nuan hina kuak khaira,
  Rankhaipiu khrista tu lung wang-e;
  Nuan phungmai tu kuak khaira leng,
  Tingwang milypoi khrista lungwang.

Translation: "(The Angel's Song)"

Category: "Christmas"

