ID: "126"

Title: "KACHIA RANGKANG NIU MAKGE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Kachia rangkang niu ahiupuina ran lulak,
  Kadihri mania niu atu ran lulak;
  Singchai ga luang kiubo zai niu atu rankhai,
  Jesu zai seniu atu wikhai bo-e.

CH: |
  (Chorus)
  Jesu zai niu atu rankhai-e,
  Kachia rangkang niu makge;
  Jesu zai niu atu rankhai-e,
  Paniu atu lungsa-e.

V2: |
  2. Kachia rangkang niu ahiupuina ran lulak,
  A nuan seniu alungchun magenthiu-e;
  Jesu zai niu makjiu atu ran lulakge,
  Jesu zai seniu atu wikhai bo-e.

V3: |
  3. Kachia rangkang niu ahiupuina ran lulak,
  Masanbo chamtan seniu atu kubam; 
  Jesu zai niu makjiu atu ranlulakge,
  Jesu zai seniu atu wikhaibo-e.

V4: |
  4. Kachia rangkang niu ahiupuina ran lulak, 
  Tinggen wang raleng haise niu daolak;
  Jesu zai niu makjiu atu ran lulakge,
  Jesu zai seniu atu wikhaibo-e.

Translation: "(No Silver Nor Gold)"

Category: "Lord supper"

