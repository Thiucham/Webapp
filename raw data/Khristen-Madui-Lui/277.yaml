ID: "277"

Title: "DANIEL KANGMAI"

Key: "B"

Time signature: "2/4"

V1: |
  1. Tingwang chamtan phung lujiu, 
  Maji jiu chap lo;
  Malumbui maitu raolo,
  Daniel kangtu thuanlo.

CH: |
  (Chorus)
  Daniel kumjiu hulo,
  Hujiu chap bamlo;
  Chalung matip jiu bamlo,
  Maikhu si khailo.

V2: |
  2. Aliu Daniel kangmai-e,
  Ngamra aphenlo;
  Tanhu mai keng kao mide,
  Tingwang riphen suangga.

V3: |
  3. Tanhumai kakeng,
  Kadih ga ha ngut maidung;
  Daniel kang mai tu daosai,
  Paliu kao misune.

V4: |
  4. Kawicham pengphai ponlo, 
  Charise ngamne; 
  Satan rimai ngam lakge, 
  Shenlo Daniel kangmai.

Translation: "(Daniel's Band)"

Category: "Conflict & Victory"

