ID: "260"

Title: "JESU I NATU LUNGSA"

Key: "F"

Time signature: "4/4"

V1: |
  1. Jesu I natu lungsa nang agu-e,
  Nazeng gasu niu I nuan ten tamine;
  Atu rankhai jiu juringbo se nang-e,
  Tuhoi gasu Jesu tu lungsa mine.

V2: |
  2. I natu lungsa nang niu lungsa raijiu,
  Calvary singchai ga aleng shaikhai-e;
  Tathu pirun run jiu aleng shaikhai-e,
  Tuhoi gasu Jesu tu lungsa mine.

V3: |
  3. I shaidi ringdi natu I lungsa ne, 
  Asiu thi bamthen I natu thuan bamne; 
  Shai jiu amik tanguijiu bamdi thuanne, 
  Tuhoi gasu Jesu tu lungsa mine.

V4: |
  4. Matha sao makbo kendibo tinggen ga, 
  Benboky ga natu thuanjiu bam sune;
  Kabenbo pirun run lujiu thuan bamne,
  Tuhoi gasu Jesu tu lungsa mine.

Translation: "(My Jesus I Love thee)"

Category: "Love, Joy & Peace"

