ID: "329"

Title: "NAIMIK BIUNIU ATU THAO BEN-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. Jesu akhu wang makbo ga,
  I tamiuga bamme;
  Pagu lungsiat 'biu wangbo ga,
  Tamiubo hamide.

CH: |
  (Chorus)
  Naimik 'biu niu atu thaoben-e,
  Naimik 'biu niu a mpui thaoben-e;
  Rankhaipiu niu a nuan hina masan khai,
  Jesu nbiu alungga ben bam mide.

V2: |
  2. Ting tamiu wangjiu chariu sai,
  Kapingbo wang sune;
  Kadihri hai tamiu bamdi,
  Aleng ra naimik 'biu.

V3: |
  3. Tingwang gu kaben ga tadjiu,
  Patu maluang bamme;
  Alai khaijiu I tad bamme,
  Kadih tu saodiak jiu.

V4: |
  4. Haibo dihga tad ronjiu bam, 
  Naikhat ra loi mine; 
  Pagu lungsiat kaben boga, 
  Kachialu gera leng.

V5: |
  5. Siga pazu I wang ngaone, 
  Atu damkhaibo piu; 
  Kabenbo ramga wangtang sai, 
  Tingtheng thuanjiu bamne.

Translation: "(Sunshine in My Soul)"

Category: "Assurance & Testimony"

