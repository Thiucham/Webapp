ID: "215"

Title: "THIUNIU MAKJIU TEN WANG-E"

Key: "G"

Time signature: "3/2"

V1: |
  1. Thiuniu makjiu ten wang-e,
  Haibo jeng charok lungga;
  Aliu wang madui lande,
  Tingwang tu thuan jiu thiukhe;
  {Tingwang tingmik kasanne,
  Tinggen lam aman raleng. (2x)}

V2: |
  2. He! lungsa sibo Jesu,
  Achengsa khiu masan lo;
  Nuan phungmai khengbo ngen lo,
  Aliu nuanse kuak khailo;
  {Kadihri cheng phut lujiu,
  Nakhu lam aliu wang ra. (2x)}

V3: |
  3. Aliu kheng bambo tingga,
  Aliu lung masan khailo;
  Haibo masanbo kyga,
  Lenkhailo Tingwang nazu;
  {Nagu karingbo taruak,
  Aliu leng pikiu khailo. (2x)}

V4: |
  4. Kahumbo Tingwang kyga,
  Ping sijiu rao jiu bamlo;
  Kalung lam ngut khai dasai,
  Tingwang tu maning bamlo;
  {Kadih lungchun saodiak jiu,
  Tingwang khuga kheng bamlo. (2x)}

Translation: "(Safety Through Another Week)"

Category: "Christian fellowship"

