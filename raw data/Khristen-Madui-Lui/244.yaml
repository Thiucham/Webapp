ID: "244"

Title: "ATU JUWANG MANA KHAILO "

Key: "A"

Time signature: "4/4"

V1: |
  1. Rapiu I nagu I nakhuan chiu-e,
  Atu lungsabo cham din;
  Malumbo ga atu matip khailo,
  Nakhu pi mana khailo.

CH: |
  (Chorus)
  Atu juwang mana khai khelo,
  Nang shaikhaibo singchai ga;
  Rapiu atu juwang mana khai khelo,
  Kungbo zai luang khaibo ga.

V2: |
  2. Rapiu yo atu kam masan khailo,
  Na pumtan nalungsiat niu;
  Ahiupuinah niu machunbo phuijiu,
  Atu nachunbo thiulo.

V3: |
  3. Nawangbam ga masan maidung wangra, 
  Dejiu ga masen bamlo; 
  I niu khudung jiu nakhuga kheng-e, 
  Atu naka thiu khailo.

V4: |
  4. Din ngam lakbo lungsa siga bamme, 
  Shaibo singgiu ken makthen; 
  Malan thiu makbo chunwi se daora, 
  Napam ga I wang dasai.

Translation: "(Draw Me Nearer)"

Category: "Consecration"

