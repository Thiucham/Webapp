ID: "300"

Title: "KUAK KHAILO AGIMANAIBO "

Key: "B"

Time signature: "6/4"

V1: |
  1. A Rapiu ga matha bamma?
  Chakhiu wibo gase;
  Palad wibo tu malumlo,
  Malumjiu dinronlo.

CH: |
  (Chorus)
  Manaibo nai pumtan bam,
  Masanbo nai lungsabo bam;
  Aleng pira Khrista zeng niu,
  Mathabo lui niu patu thuan kiu ne.

V2: |
  2. Nuan hina khiu masan khai-e,
  Lungsabo singchai ga;
  Jesu zai luang kiu khaibo ga,
  Manai khai kam mide.

V3: |
  3. Lungsabo niu khui mao hane,
  Aleng pumtan pine;
  Masanbo hiupuina kiujiu,
  Nuan hina kuak khai-e.

V4: |
  4. Hami maitu kuwang khaira, 
  Hiuna niu pumtan pi; 
  Aliu Rapiu kalen hiuna, 
  Aliu lung ga bamme.

V5: |
  5. Malum mainiu kawi lune, 
  Nahmai kum lungmai tu; 
  Khrista zan ganiu pikhaine, 
  Paniu ladriat khai-e.

Translation: "(Pardon Peace)"

Category: "Christian service & Reward"

