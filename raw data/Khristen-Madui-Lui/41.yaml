ID: "41"

Title: "THAINAI AGU SUANNAI WANGMAK LUBUI"

Key: "B"

Time signature: "4/4"

V1: |
  1. Thainai agu suannai wangmak lu bui,
  Tingnaimik ka sandi ngao maklu bui;
  Chawan wangsai aten hina loijiu,
  Thainai agu, suannai wangmak lu bui.

V2: |
  2. Thainai agu mathabo lui thiura,
  Kawicham se I niu dinron bamne;
  Paphiken sai I di suitad bamne,
  Thainai agu mathabo lui thiura.

V3: |
  3. Thainai agu suannai wangmak lu bui,
  I tadjiu bamga naimik kiu misai;
  Rapiu niu atu 'kamdaode' chiuma?
  Thainai agu ringbo lui thiura leng.

Translation: "(Today is Mine Tomorrow May not Come)"

Category: "Christ life & Love"

