ID: "362"

Title: "ALIU ADAO LANNE"

Key: "E"

Time signature: "4/4"

V1: |
  1. Aten rabo loi dasai,
  Naimik di kiuji sune;
  Chariubo gasu aman raleng,
  Ting kadih Rapiu seniu;
  Aliutu jusu khaine,
  Zion ga aliu adao lanne.

CH: |
  (Chorus) 
  Aliu adao lanne, 
  He! siga niu adaone;
  A Rapiu lunse kumjiu,
  Sibo ram kawibo ga;
  Aliu adao lanne, 
  He! siga niu adaone;
  Dibopiu nah thiu bamne.

V2: |
  2. Kadihri hai tamiu-e, 
  Kapingbo guniu fui-e;
  Aliu puiki tamiu bam liudi, 
  A Rapiu majang khaine;
  Nnien kumbo benbo ramga, 
  Kadih tamiubo bamlan lakge.

V3: |
  3. Mikdui luang jiu bam liudi, 
  Achunsa jiu bam liudi;
  Kadihri achun keng bam liudi, 
  A Rapiu niu kiulan jiu;
  Aliutu jusu khaine,
  Siga chariubo bamlan lakge.

Translation: "(We'll Meet Each Other There)"

Category: "Aspiration after Heaven"

