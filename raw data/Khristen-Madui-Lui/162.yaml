ID: "162"

Title: "RENGMUN ALENG LEKHAI "

Key: "C"

Time signature: "6/8"

V1: |
  1. Rengmun wibo aleng lekhai,
  Sibo rengmun benjiu bam;
  Singchai ganiu benbo langkiu,
  Khrista kakungbo lenkhai.

CH: |
  (Chorus)
  He! kungbo wibo rengmun se,
  Aleng jeng niu lekhai guma?
  Aleng aleng rengmun aleng lekhai.

V2: |
  2. Ranka lubo luni maileng,
  Rengmun se lekhai bamme;
  Lunglak mainai sing khiu maileng,
  Zat hina leng wibo-e.

V3: |
  3. Masong zuanlo chari ngamra, 
  Kungbo rengmun lebam ga; 
  Singchai ponlo pirun lura, 
  Tingtheng ringbo ngaolune.

V4: |
  4. Singgiu genlam wangsao khaine, 
  Singchai aliu phung bambo; 
  Ringbo pirunse runlujiu,
  Patu thuanne tinggen ga.

Translation: "(The Gate Are for Me)"

Category: "Invitation & Baptism"

