ID: "326"

Title: "I MALUMBO PIU TU SE-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. I din ngamlak paniu kungbo,
  Atu pise khai-e;
  Akumbo buimak maitu tudi,
  Paniu kada khaide.

CH: |
  (Chorus)
  Gukhaipiu tu I niu si lude,
  Paniu atu gukhai ngamme chiubo;
  Gukhaibo ting wangtang makthen,
  Rapiu niu gukhai bine.

V2: |
  2. I se ngamlak ranlu raleng,
  Malumbo pikhai-e;
  Palad malum lubo gasu,
  A nuan hina kuak khai.

V3: |
  3. I se ngamlak hiupuina niu,
  Nuanmai lungli khaibo;
  Palad niu Jesu lam dinkhai,
  Malumbo pikhai-e.

V4: |
  4. I se ngamlak kawi kasa, 
  Aleng kaden khaibo; 
  Chunsa rama chunwi ralo? 
  Pazu wang ngao dasai.

V5: |
  5. I simak Pah wang rabo ting, 
  'Chun suma 'nien sulo? 
  Shaijiu Patu adao suma? 
  Ringjiu adao ralo?

Translation: "(I know Whom I Have Believeth)"

Category: "Assurance & Testimony"

