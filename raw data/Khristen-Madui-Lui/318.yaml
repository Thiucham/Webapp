ID: "318"

Title: "MALONG RIGA BAMBO SINGCHAI "

Key: "B"

Time signature: "6/8"

V1: |
  1. Malong riga bambo singchai ga shaikhai ji,
  Mangambo chariubo phungkhai;
  Sibo singchai situ I niu lungsa diang-e,
  Nuan phungmai aliu leng shaikhai-e.

CH: |
  (Chorus) 
  Agu tathuan I dao makthen na, 
  Singchai situ I kung jiu bamne; 
  Singchai ga I ma ngiu khai bamsai, 
  Chawang pirunse aleng pine.

V2: |
  2. Kadihmai niu singchai situ luni makge, 
  Aleng ra hai suang wibo ha;
  Kungbo Tingwang milypoi niu aleng pikhai, 
  Calvary ga aleng kheng khai-e.

V3: |
  3. Singchai riga luang khaibo zaise aleng-e, 
  Dejiu ga maisuang ha gulo! 
  Singchai riga Jesu niu aleng shaikhai-e,
  Nuan kuak khaijiu khiu masan khai-e.

V4: |
  4. Singchai situ I niu malum jiu bamra-e, 
  Achun wijiu I phung bamne;
  Tinggen lam lungra paniu atu kuwangne, 
  Tingtheng jeng I lungjiu bam mine.

Translation: "(The Old Rugged Cross)"

Category: "Christian service & Reward"

