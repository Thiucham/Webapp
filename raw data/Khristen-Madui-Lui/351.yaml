ID: "351"

Title: "I JESU TU LUNI"

Key: "E"

Time signature: "2/2"

V1: |
  1. I Jesu tu luni nuan kuakra,
  Jesu kummai aka kawi ha-e;
  I Jesu tu luni achunwi jiu,
  Apot karitbo hinase paniu phung khaine.

CH: |
  (Chorus)
  I niu Jesu tu nai machang aka thiura masen-e,
  Tamiudi bendi I niu Jesu tu aka thiuni;
  Tingmik machang I niu Jesu tu luni-e.

V2: |
  2. I Jesu tu luni chaka thiujiu,
  Puiki tamiudi paniu thaoben ne;
  I Jesu tu majang sai 'pui dinne,
  Jesu akhu bamsai I niu puiki tad maolak.

V3: |
  3. I Jesu tu luni loibo tangjiu,
  Nuan phungmai ka pah kumbo maidi hah;
  I Jesu tu lusai paniu khane,
  Paniu atu gujiu kungbo pumtan pikhai ne.

Translation: "(I need Jesus)"

Category: "Assurance & Testimony"

