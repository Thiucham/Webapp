ID: "52"

Title: "KHRISTA ACHUNBO-E"

Key: "B"

Time signature: "3/4"

V1: |
  1. I kamaobo kambam lon,
  Palungsiat tu I silu,
  Tinggendih kawi I ngaolu;
  Khrista ronna agu-e.

CH: |
  (Chorus)
  Mathabo lui I thiu chapbam,
  Khrista agu mathabo!
  Haise tingtheng alui thiune,
  Khrista agu kendi bo!
  Haise tingtheng jiu alui ne,
  Khrista agu pakhiang-e!

V2: |
  2. Chunsa niu atu gombam ga,
  Chariubo mikdui kiu ga;
  Chariu khengbo lui I thiu-e,
  Khrista si aka wibo.

V3: |
  3. Sailam tasibo tingwang sai,
  Kasabo hina hane;
  Ringsu khaibo luise thiune,
  Khrista agu pakhiang-e!

Translation: "(Christ my All)"

Category: "Christ life & Love"

