ID: "358"

Title: "DUIDIH GENLAM SIRA"

Key: "G"

Time signature: "6/8"

V1: |
  1. Jesu zainiu khiu khai maidung,
  Duidi genlam adao jine;
  Chariubo hajiu aruangne,
  Ramna botu pinglan lakge;
  Duidi genlam sira.

CH: |
  (Chorus)
  Duidi genlam sira, (3x) 
  {Aliu ramna lakge aliu ramna lakge; (2x)}
  Duidi genlam sira.

V2: |
  2. Thiuniubo wangdi ping lakge,
  Malumbo niu Tinggen ngao ne;
  Maza seniu dinbo chiu-e,
  Tingwang niu mikdui nun sang ne;
  Duidi genlam sira.

V3: |
  3. A maningmai nai ngao daone.
  Dejiu ga king wibo khuan lo!
  Si lujiu hiupuina sulo, 
  Sailam kachia kham le khaine;
  Duidi genlam sira.

V4: |
  4. Rankhaipiu niu atu juaklo, 
  Sibo chunwat se lu taora; 
  Malan hahjiu thuanbam raleng, 
  Lungsabo niu mikdui sangne;
  Duidi genlam sira.

Translation: "(Beyond the Swelling Flood)"

Category: "Aspiration after Heaven"

