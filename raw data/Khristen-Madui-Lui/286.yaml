ID: "286"

Title: "NSUAN BENBO GA WANGLO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Chalung chariu bam maidung ngang phuilo,
  Nsuan benbo ga wanglo.
  Tingwang niu chunwi matha bamlo chiu,
  Nsuan benbo ga wanglo.

CH: |
  (Chorus)
  Nsuan benbo ga ri ngalo, (2x)
  Mathalo kapbo chun hawang mide,
  Nsuan benbo ga wanglo.

V2: |
  2. Kapingbo gu hinase hamide,
  Nsuan benbo ga wanglo.
  Chariumai mikdui sangne mathalo,
  Nsuan benbo ga wanglo.

V3: |
  3. Mathajiu bamlo chunting loi mide, 
  Nsuan benbo ga wanglo.
  Mathajiu bamlo rankhaipiu wang-e, 
  Nsuan benbo ga wanglo.

V4: |
  4. Mathajiu bamlo thainai chunwijiu, 
  Nsuan benbo ga wanglo. 
  Tingwang niu aliu mikdui nun sangne,
  Nsuan benbo ga wanglo.

Translation: "(Joy Cometh in the Morning)"

Category: "Comfort in sorrow"

