ID: "242"

Title: "I PIKHAI KAMDE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Wahina Jesu ga pikhaide, 
  Mathajiu pipad de;
  Patu kung jiu malum bamme,
  Nai machang malumne.

CH: |
  (Chorus)
  I pikhai kamde, (2x)
  Atu thoikhaibo piu khuga,
  I pikhai kamde.

V2: |
  2. Wahina Jesu ga pikhaide, 
  Khudung jiu kahumme;
  Kadihri lungchun hina saojiu,
  Jesu tu  lukhaide.

V3: |
  3. Wahina Jesu ga pikhaide, 
  Rapiu nagu thiulo; 
  Nahiupuina akhu ga wangjiu; 
  Atu nagu thiulo.

V4: |
  4. Wahina Jesu ga pikhaide, 
  Apum pakhiang nadi;
  Nang kungbo pumtanse ariga, 
  Nagu thoidam pilo.

V5: |
  5. Wahina Jesu ga pikhaide,
  Atu masan khailo; 
  Juring khai bijiu achun wi-e, 
  Nazan paken dilo.

Translation: "(I Surrender All)"

Category: "Consecration"

