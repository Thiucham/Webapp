ID: "331"

Title: "MALUM MINE"

Key: "F"

Time signature: "3/4"

V1: |
  1. I manangbo Jesu ga pi,
  Paladren tu malumjiu;
  Atu phut lakge wadao di,
  I niu palad malumjiu.

CH: |
  (Chorus)
  {I malumme malum mine,
  I malumme palad tu. (2x)}

V2: |
  2. Amao hina Jesu ga sao,
  Pazai niu atu khiusai;
  Masan jiu atu khai bamne,
  Tingwang khuga juwang ra.

V3: |
  3. I kapingbo Jesu gapi, 
  Pakhuga mathak bamra; 
  I tadbo 'puiki tamiudi, 
  Pabiura midlan lakge.

V4: |
  4. Achun wibo Jesu gapi, 
  Achun wira paronna; 
  Ting kadihgu papao se nang, 
  Natu ronna ramgun ne.

V5: |
  5. Jesu leng I pakhiangna pi, 
  Apum nai ahiuna di; 
  Akhu bambo machun hina, 
  Pikhaide tingtheng jeng leng.

Translation: "(Fully Trusting)"

Category: "Assurance & Testimony"

