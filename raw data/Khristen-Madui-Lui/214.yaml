ID: "214"

Title: "NAGU MALUM BUIBO"

Key: "E"

Time signature: "3/2"

V1: |
  1. Nagu malum buibo a Rapiu Tingwang,
  Tamiubo kalibo ha nakhuga;
  Nalungsiat hai wadao di limak mao mak;
  Nang bambo kum tingtheng lilan lakge.

CH: |
  (Chorus)
  Nagu malum buibo, (2x)
  Nsuan machang nagu lungsiat I ngao;
  Aleng gengbo hina nang pikhai bamme;
  Nagu malum buibo aleng pikhai.

V2: |
  2. Tatun chaken tathe kariak age ting,
  Chahiu naimik chagan dungdi thuan bam;
  Nagu lungsiat nchang bose tu thuan bam;
  Maihina zat hina niu thuan bamne.

V3: |
  3. Nuan kuak khai lujiu majang chunwi bamme,
  Nang niu maluang khaibo ga hai chunwi;
  Thainai leng pumtan suan nai leng agunbo;
  Takum sang kariu thoidam aleng nge.

Translation: "(Great is thy Faithfulness)"

Category: "Christian fellowship"

