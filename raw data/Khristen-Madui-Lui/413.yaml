ID: "413"

Title: "TINGGEN KADIH KHUAN BAM BOSE"

Key: "G"

Time signature: "9/8"

V1: |
  1. Tinggen kadih khuan bambo se, 
  Tingmik machang nawang-e;
  Kabenbo ramga wang raleng, 
  Tingmik machang nawang-e;
  Kadih tamiubo loi saira, 
  Aliu lungdi ben mine;
  Siga Tinggen ganbiu kumjiu, 
  Tingtheng jeng ben bam sune.

V2: |
  2. Chalu gemai gekam makthen, 
  Pon madui ra khuan bamme;
  Magenthiubo hina hane, 
  Tinggen ramga wangtang sai;
  Chalu gemai khom wang jine, 
  Pon madui wangji sune;
  Karingting hai hawang sune, 
  Aringting di loi mine.

V3: |
  3. Tinggen maza niu kamunga, 
  Chapjiu atu khuan bamme;
  Magenthiu chariu jiu bammai, 
  Wanglo chiujiu kubamme;
  Juring bose a Rapiu niu, 
  Pikhai ra khuan jiu bamme;
  Paliu niu atu ku saira, 
  Kadenjiu I khuan bamme.

V4: |
  4. I wadao di ngao matai mak, 
  Kabenbo Tinggen ramga;
  Madia ringbo lujam gase, 
  Shaili singbang pen bamme;
  Agu juringbo tu khuan bam, 
  Atu ranpao niu pira;
  Nuan gu pumtan bamlan lakge, 
  Chariubo bamlan lakge.

Translation: "(Only Waiting Till the Shadow)"

Category: "Aspiration after Heaven"

