ID: "360"

Title: "DEJIU GA MATHA BAMRALO"

Key: "C"

Time signature: "4/4"

V1: |
  1. Aliu niu dinbo wibo ram,
  Sibo ram bense masan ne;
  Pakendibo piu lungbo ram,
  Dejiu ga matha bamralo!

CH: |
  (Chorus)
  {Sibo ram ga bamra,
  Dejiu ga matha bamralo! (2x)}

V2: |
  2. Aliu niu dinbo kachiapui,
  Kachia niu alon khaibo-e;
  Param wat maidi dinsilak,
  Dejiu ga matha bamralo!

V3: |
  3. Aliu niu dinbo lungsabo,
  Pakendibo puan maliang-e;
  Kawibo lui thiucham rabo,
  Dejiu ga matha bamralo!

V4: |
  4. Nuan gasu khen rang thiu khaibo,
  Chariubo kahiambo gasu; 
  Madiubo hina kenlusai,
  Dejiu ga matha bamralo!

V5: |
  5. Rapiu niu chariukheng khaijiu; 
  Ahiupuina leng kadenjiu; 
  Sibo ramga bamrabo leng,
  Dejiu ga matha bamralo!

Translation: "(What Must it be to be There)"

Category: "Aspiration after Heaven"

