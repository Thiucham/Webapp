ID: "150"

Title: "PALINGJIU PALINGJIU "

Key: "G"

Time signature: "4/4"

V1: |
  1. He! Rankhaipiu ajeng niu shaikhai-e,
  Ladjan ga paniu atu duakpad khai;
  Pa dinne panapiu tu malummai,
  Tingtheng ringbo ngao ne.

CH: |
  (Chorus)
  Palingjiu, (2x)
  I nakhu dinne;
  {Palingjiu, (2x)}
  Tacham kasanne;
  Pa dinne panapiu tu malummai,
  Tingtheng ringbo ngao ne.

V2: |
  2. I kamaobo hina paniu phungkhai,
  Apao phung hinadi paniu ruikhai;
  Pa dinne panapiu tu malummai,
  Tingtheng ringbo ngao ne.

V3: |
  3. I wimakdi Rapiu tu malumne, 
  Suanmai thiu bamdi I palad malum; 
  He! Tingwang nahdung leng kawichamme. 
  Tingtheng ringbo ngao ne.

V4: |
  4. I buimak bamdi malum masalak, 
  Pakhu wang maitu paniu phutlakge;
  Patu malummai kawicham senlo, 
  Tingtheng ringbo ngao ne.

Translation: "(Verily, Verily)"

Category: "Prayer meeting & Revival"

