ID: "389"

Title: "ALIU TINGGEN WANG TANG SAI"

Key: "C"

Time signature: "4/4"

V1: |
  1. Jesu lungsiat suang habo lui,
  Thiulo naliu chunwi jiu;
  Chaky kadibo wibo se,
  Aliu leng kaden khai bam.

CH: |
  (Chorus)
  Aliu Tinggen wangtang sai,
  Dejiu matha mala jiu bamralo;
  Jesu tu ngao dasai,
  Chari ngambo luise thiune.

V2: |
  2. Aliu tabin tadbo tingga,
  Kamuang niu gombam ditu;
  Aliu ringting hai loi dasai,
  Wakhat di gom lan lakge.

V3: |
  3. Majibo cham aliu phungjiu,
  Tingmik machang malumkhe;
  Pakendibo aliu ngaosai,
  Aliu phijeng pikhaine.

V4: |
  4. Jesu aliu masuang ga bam,
  Pabiu wibo ngao jine;
  Kachia rengmun le jisune,
  Benbo 'pui aliu tadra.

Translation: "(When We All Get to Heaven)"

Category: "Aspiration after Heaven"

