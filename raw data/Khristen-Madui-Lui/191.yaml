ID: "191"

Title: "RINGTING WIBO DUNJU-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. Ringting wibo dun ju-e,
  Chapiu niu tangbo kumjiu;
  Paken khat ron naleng-e kaden lo,
  Karingting hai tad bamme,
  Nangleng karingting dunne,
  Kashai ting hai nawang-e kaden lo.

CH: |
  (Chorus)
  Majatlo majatlo,
  Jesu niu nang tu kubamme majadlo;
  Nang nuan ram ga bam theng sai,
  Khamle jiu khuan bilakge;
  Kapbam di riju mine majatlo.

V2: |
  2. Charapen kuibo kumjiu,
  Chamai kendi then nong-e;
  Nangdi tingtheng ring lakge kadenlo,
  Rapiu niu natu kuga;
  Majat sulo nuan phungmai,
  Shaibo bamga ngut makra kaden lo.

V3: |
  3. Pawan hai tad saomakge,
  Kashaibo ladzan na-e;
  Jesu khuga wang lulo kaden lo,
  Nagu ringting hai loijiu;
  Natu ladzan thiumak ga,
  Nang hiupuina ha makga kaden lo.

V4: |
  4. Kadinbo lad kinglu jiu,
  Jesu lad hai malumlo;
  Tinggen mai pachunwi ne kaden lo,
  Kabenbo bamga wanglo;
  Jesu niu masan khaine,
  Tinggen ramga ngut raleng kaden lo.

Translation: "(Life at Best is Very Brief)"

Category: "Warning & Entreaty"

