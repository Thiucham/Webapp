ID: "366"

Title: "ALENG KENDIBO"

Key: "A"

Time signature: "6/4"

V1: |
  1. Aten rabo hina ten loi misai,
  Wibo singgiu genlam wang bam mine;
  I niu kungbo Rapiu suangga bamne,
  Tingtheng jiu kendibo aleng lune.

CH: |
  (Chorus)
  He! seniu aleng kendibo, 
  Kendibo aleng  kendibo;
  Lungsabo niu pazu I wang ngao ne,
  Kendibo seniu aleng kendibo.

V2: |
  2. Pagu dinse lakbo lungsiat seniu,
  Tinggen dihse aleng kaden khaibam;
  Siga wangjiu pazu I wang ngao sai,
  Tingtheng jiu kendibo aleng lune.

V3: |
  3. Lungsamai akamai tu ngao daone,
  Singgiu luangbo kum chunwibo niu fui;
  I se-e rrankhaipiu chunwi rabo,
  Tingtheng jiu kendibo aleng lune.

Translation: "(Glory for Me)"

Category: "Aspiration after Heaven"

