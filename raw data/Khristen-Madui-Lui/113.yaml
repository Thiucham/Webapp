ID: "113"

Title: "THUANLO PAKEN DIBO WANGTU"

Key: "B"

Time signature: "4/4"

V1: |
  1. Thuanlo pakendibo paronna Tingwang,
  Paniu aliu leng kam khaibo tendi hai;
  Aliu gu tabin loi makthen jukhai ne,
  Chamipong nai kamuang seniu jukhai ne.

CH: |
  (Chorus)
  Tinggen mazadung niu patu thuan lulo,
  Tara khuan wibo niu patu thuan lulo;
  Pakendibo hina pawan bam thenna,
  Paten kam niu patu thuan bamne thuan bamne;
  Ahiupuina yo Rapiu tu thuan bamlo.

V2: |
  2. Matha rankhaibo kum chunwi jiu thuankhe,
  Tazai duipok seniu aliu tu wikhai;
  Lungsajiu pikhaibo kalense hai-e,
  Aliu rathoi chiu khaijiu thoikhai bi-e.

V3: |
  3. Madiu khai bose 'liutu lungsa bo-e,
  Lungsabo seniu juwang mana khai-e;
  Malumbo nai ramgunbo niu chari ngam khai,
  Siga amaning mai nai lung aruangne.

Translation: "(Praise the King of Glory)"

Category: "Praise & Opening"

