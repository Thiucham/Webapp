ID: "47"

Title: "JESU JENGNIU LADKENG KHAT"

Key: "D"

Time signature: "4/4"

V1: |
  1. Jesu jeng niu ladkeng khat, 
  Pah napiu kung thubo;
  'Liuleng shaikhai bo don niu,
  Aliu chun piwi khai.

CH: |
  (Chorus)
  Jesu jeng niu ladkeng khat,
  Dinsai natu gu ne;
  Jesu ladkeng khat nadi,
  Shenjiu thiujiu khenglo.

V2: |
  2. Jesu jeng niu ladkeng khat,
  Na nuan madu khai sai;
  Na nuan hina kuak khai ne,
  Tinggen ga wang raleng.

V3: |
  3. Jesu jeng niu ladkeng khat,
  Nang mangai mi tulo;
  I kungbo rankhaipiu niu,
  Azeng niu shai khai-e.

V4: |
  4. Jesu lamchap thiu raleng, 
  Pawan kam mahahtu; 
  Ten matun makbo donniu, 
  Chariubo phungwang-e.

V5: |
  5. Jesu jengniu ladkeng khat, 
  Na malum suan liudi; 
  Nang suanbo gadi tenlo, 
  Pakhiangna pikhailo.

Translation: "(Just a Word for Jesus)"

Category: "Christ life & Love"

