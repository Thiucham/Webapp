ID: "138"

Title: "WITHUBO CHAKA SIRA JESU-E"

Key: "G"

Time signature: "4/4"

V1: |
  1. Withubo chaka sira Jesu, 
  Ringting gu manangbo wangbo ga;
  Chariubo lung mathak khai,
  Lungsa jiu pumtan pikhai;
  Withubo chaka sira Jesu.

CH: |
  (Chorus)
  Withubo chaka se Jesu, (2x)
  Nang kaoboga kha khaine;
  Nang kuboga chiu khaine;
  Withubo chaka sira Jesu.

V2: |
  2. Dejiu wibo chakalo Jesu!
  Ahiuna leng manaibo phungwang;
  Pakhuga man giu khaijiu,
  Kasabo tu ping lakge,
  Withubo chaka sira Jesu.

V3: |
  3. Kapingbo chunting I tad bamdi, 
  Agu chariubo hina phung khai; 
  Wakamdi I ping lakge, 
  Rankhaipiu maluang bamme; 
  Withubo chaka sira Jesu.

V4: |
  4. Aliu suang tadrai mai kakungmai, 
  Nai tinggen ramga aruangbo ga; 
  Aliu chalui thiu sune, 
  Tingtheng patu thuanbo lui; 
  Withubo chaka sira Jesu.

Translation: "(The Best Friend is Jesus)"

Category: "Prayer meeting & Revival"

