ID: "278"

Title: "MASUANG ZUANJIU TADLO"

Key: "D"

Time signature: "4/4"

V1: |
  1. Masuang zuan jiu tadlo hujiu ha ngutlo,
  Tanhubo jupao seniu tadrai mide;
  Paben niu jukhaibo Jesu tu phuilo,
  Chari thiura nakamai tu kululo.

CH: |
  (Chorus)
  Masuang zuan jiu tadlo,
  Jesu tadrai mide; 
  {Masuang zuan jiu tadlo, (2x)}
  Tingmik wibo nai pakendibo thiune.

V2: |
  2. Masuang zuanlo piubon madiabo gadi,
  Duiliu tanbo singgiu situ kenwang di;
  Chakhau parum kasa ga tad wang liudi,
  Patu malumsai paniu jukhai bine.

V3: |
  3. Kabenbo gase wangra masuang zuanlo,
  Chariubo kadih tu I niu len tonjiu;
  Chunwi lui thiu bamne I wang tang makthen,
  Halleluyah! shen bamne sangkai mai nai.

Translation: "(Onward and Upward)"

Category: "Conflict & Victory"

