ID: "281"

Title: "RIPHEN MAI LUI"

Key: "B"

Time signature: "4/4"

V1: |
  1. Sulo rankhai mainah hina,
  Khrista ga bammai hina;
  Sulo naliu katan maijat,
  Zion ga chari thiura.

CH: |
  (Chorus)
  Thiu sulo kangambo luise, (2x)
  Duidi tingsingbo khuan kum;
  Khrista niu aliutu rankhai,
  {Kangam maidung suang di-e; (3x)}
  Khrista zainiu liutu rankhai,
  Kangam maidung suang di-e.

V2: |
  2. Masan maidung tadrai mine,
  Haiga chap matip bamlo;
  Paliu gu pengphai kajit jiu,
  Jesu zainiu ngam khai-e.

V3: |
  3. Kashaibo tu aliu pinglak, 
  Khrista tu majang bamga;
  Patu ka ngaobo 'suan dasai, 
  Pakendijiu sui tadne.

V4: |
  4. Pasuang ga aliu wang chapne, 
  Rapiu tu aliu ngaone; 
  Chunwijiu patu kahumne, 
  Maihina phijeng daone.

Translation: "(The Song of Soldier)"

Category: "Conflict & Victory"

