ID: "441"

Title: "RANKHAIBO MALEE SE JESU"

Key: "G"

Time signature: "4/4"

V1: |
  1. Rankhaibo malee se kiumide,
  Rankhaibo malee se Jesu-e;
  Parih maidung tuse ngamlu jiu,
  Luang ngut ne param amanbo ga.

CH: |
  (Chorus)
  {Amanbo ga ngut ne, (2x)
  Malee ga kiulo asingnah mai. (2x)}

V2: |
  2. Haibo kadih phutlo singnah mai,
  Zion ram aman mai wang thiulo;
  Sigasu na nuanse kuak lune,
  Nang magenthiubo di bam lakge.

V3: |
  3. Paman hajiu nangtu ken khaine,
  Paniu chalungsabo se di-e;
  Dejeng gasu namen ri gulo?
  Zion ram lam zuan jiu tad sulo.

V4: |
  4. Kenrabo malee ga tad lulo,
  Wanglan bilakge nang kubam di;
  Zion ram amanbo tang dasai,
  Nang kapbam ne duidi genlam se.

Translation: "(Christ is the Pilot)"

Category: "Special songs"

