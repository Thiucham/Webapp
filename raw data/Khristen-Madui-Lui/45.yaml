ID: "45"

Title: "CALVARY TU MANING TAO-E"

Key: "E"

Time signature: "3/4"

V1: |
  1. Rapiu maluang jiu I tadne,
  I niu patu malum raleng;
  Calvary ga aleng shaikhai,
  Sise maning tao-e aleng.

CH: |
  (Chorus)
  Jesu niu atu maluang ne,
  Nchun nnian tadbo pui ga.
  Pah hai withubo aka-e,
  Calvary tu maning tao-e.

V2: |
  2. Pagu chamtan ga achunwi,
  Lungsabo benniu jukhai-e;
  Akhuga palung chun kim me,
  Calvary zai niu masan khai.

V3: |
  3. Rapiu majang sai ping lakge,
  Rapiu ga bamsai achunwi;
  Calvary kawibo Jesu,
  Patu zudao ra malum me.

Translation: "(I Remember Calvary)"

Category: "Christ life & Love"

