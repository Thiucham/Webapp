ID: "91"

Title: "ATINGLANG HAI LUKHAILO"

Key: "G"

Time signature: "4/4"

V1: |
  1. Ating lang hai lukhailo,
  Rapiu nangleng thin piulo;
  Agu pating pawandi,
  Lujiu natu thuan bamlo;
  Lujiu natu thuan bamlo.

V2: |
  2. Aphi aben lukhai jiu,
  Nagu lungsabo situ;
  Thuan jiu chalui thiu bamne;
  Aphi aben hina niu,
  Thuan jiu chalui thiu bamne.

V3: |
  3. A khuan hai pikhai lujiu,
  A wangtu thuan bamra leng;
  Agu ningting di pikhai,
  Nangniu pikhaibo hina,
  Natu thuan jiu bamra-e.

V4: |
  4. Alungchun hai lukhailo, 
  I niu machunbo makjiu;
  Nang niu machunbo thiulo,
  Haise nagu kendibo;
  Haise nagu kendibo.

V5: |
  5. I niu kungbo lungsabo,
  Pakhiang nakhu pikhai-e;
  Apum haidi lukhaijiu,
  Nagu thiu khailo Rapiu;
  Nagu thiu khailo Rapiu.

Translation: "(Take My Life and Let it be)"

Category: "Praise & Opening"

