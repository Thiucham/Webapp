ID: "64"

Title: "MAISUANG HABO RANKHAIPIU "

Key: "D"

Time signature: "4/4"

V1: |
  1. Khrista aliu nuan leng shaikhai, 
  Tasi-e Rankhaipiu! 
  Paman niu aliutu liulu-e, 
  Dejiu suang ha Rankhaipiu!

CH: |
  (Chorus) 
  Dejiu tasi gulo, 
  Rankhaipiu agu Jesu
  Dejiu tasi gulo, 
  Rankhaipiu a Rapiu.

V2: |
  2. Pazai niu atu masan khai, 
  Tasi-e Rankhaipiu! 
  Ahiuna tudi rankhai bi-e, 
  Dejiu suang ha Rankhaipiu!

V3: |
  3. Paniu agu nuan masan khai, 
  Tasi-e Rankhaipiu! 
  Paniu mawang mine tuhoi ra, 
  Dejiu suang ha Rankhaipiu!

V4: |
  4. Pah nai I tad chamjiu bamne,
  Tasi-e Rankhaipiu! 
  Naimachang atu majang bamne, 
  Dejiu suang ha Rankhaipiu!

V5: |
  5. Pah atu ngambo pumtanpi,
  Tasi-e Rankhaipiu! 
  Matan maihina tu ngamkhai-e. 
  Dejiu suang ha Rankhaipiu!

V6: |
  6. Pakhu alung chun pikamne,
  Tasi-e Rankhaipiu! 
  Kadih niu wadaodi ngamlakge,
  Dejiu suang ha Rankhaipiu!

Translation: "(What a Wonderful Saviour)"

Category: "Humiliation, Resurrection & Glory"

