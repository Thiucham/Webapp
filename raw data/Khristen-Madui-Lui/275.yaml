ID: "275"

Title: "MAKE MUDSULO"

Key: "B"

Time signature: "4/4"

V1: |
  1. Make mud sulo chari nawang de, 
  A Rapiu leng aphen sukhe;
  Nari puan khai lujiu chap matib lo,
  Palad masan bose malumlo.

CH: |
  (Chorus) 
  Sulo riphen dung pengphai pon kulo, 
  Chap matib jiu palad dinron lo;
  Suanglam zuan jiu hosanna senlo sulo, 
  Charipi kadibo se khrista-e.

V2: |
  2. Chap matiblo chari tanjiu bamdi, 
  Aliu niu ngam sangjing ra-e;
  Benbo chagee nai pengphai thin sulo, 
  Majibo ga chaplo 'liu ngamne.

V3: |
  3. He! mathiu wang aliu khuan 'king khailo, 
  Nalungsiat niu nkha khailo;
  Aphen lujiu chari ngam wang dasai, 
  Nasuang ga ngambo pirun runne.

Translation: "(Sound the Battle Cry)"

Category: "Conflict & Victory"

