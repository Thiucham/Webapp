ID: "379"

Title: "MATHAK BAM KADIH KHAT BAMME"

Key: "E"

Time signature: "4/4"

V1: |
  1. Mathak bam kadih khat bamme,
  Duidi genlam sira;
  Tamiubo magen kathiubo ha-e,
  Tenbo kapbo ha-e.

CH: |
  (Chorus)
  Sundaolo he! sundao lo,
  Nsuan naimik 'biu kabenbo ram gase;
  Sundaolo he! sundao lo,
  Duidi genram ganiu atu sundaolo.

V2: |
  2. Pirun niu benbo ram bamme,
  Amun niu dinsilak;
  Siga ngut maidung se a Rapiu nai,
  Tingtheng jiu lung bamne.

V3: |
  3. Chawang pirun kaden khaibam,
  Khrista niu pirabo;
  Pah wanglan ratu khuan bammai lengra, 
  Juringbo pikhaine.

V4: |
  4. Kashaibo tangjiu malum mai,
  Tinggen 'pui ga tadne; 
  Karingbo rengmun gase tad ngutne, 
  Tingtheng jiu lung raleng.

Translation: "(There is a Paradise of Rest)"

Category: "Aspiration after Heaven"

