ID: "291"

Title: "PALUNGSIAT HAI SINGCHAI SUANG DI-E"

Key: "E"

Time signature: "4/4"

V1: |
  1. Singchai se ripjiu bamliu ditu,
  Pagu lungsiat niu di diang;
  Tingthung tingkai tanjiu bam liudi,
  Pazuse baimi lakge.

CH: |
  (Chorus)
  Palungsiat hai singchai suang di-e,
  Tingthung seniu pazu bai lakge;
  Jesu tu majang bamsai alungchun kim rabo-e,
  Mikre hina tu ngamne.

V2: |
  2. Aphi ga tathu duak rabo sung,
  Tathu pirunse runkhai;
  I sak ngam lakbo khabo duise,
  Paniu a sung sak lude.

V3: |
  3. Palungsiat niu atu thaoben khai, 
  I chariubo 'pui lon ga; 
  Agu taten hai loiji wangkin, 
  Kao bammai tu jusu khai.

V4: |
  4. Pagu mathabo ga I bamne, 
  I pasai suitad bamne; 
  Agu kabambo hina pikhai, 
  Pazai niu atu khiu khai.

Translation: "(The Cross is not Greater Than His Grace)"

Category: "Christian service & Reward"

