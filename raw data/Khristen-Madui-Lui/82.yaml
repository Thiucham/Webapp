ID: "82"

Title: "PAH RINGBAM"

Key: "B"

Time signature: "6/8"

V1: |
  1. A Rapiu ringsu mine,
  Pah Tinggen khang mine;
  Pah ringbam bo I si-e, 
  Mainiu malum makdi;
  I niu pabiu kawi ngao, 
  Pakhon di I chiu-e,
  I niu patu malum sai, ngao bam sune.

CH: |
  (Chorus)
  {Ringbam, (2x)} Jesu 'thaidi ringbam,
  I niu tad khaibo mpui gadi,
  Patu pao jiu bamme;
  {Ringbam, (2x)} tingtheng ringbo pira,
  Pah ringbam bose I si-e;
  Pah alungga bamme.

V2: |
  2. Maning khaibo hina ga,
  Pah kakungbo ngao-e;
  I niu achunwi lusai,
  I masai lan lakge;
  Kapingbo hina daodi,
  Pah niu mpui sio ne;
  Jesu Jesu kiulan rabo, I si-e.

V3: |
  3. Khristen mai hina chunwi,
  Jesu tu thuan lulo;
  Chawangmai riga chawang,
  Khrista tu thuan lulo;
  Pakhu kawang mai hina,
  Patu ngaojiu bamne;
  Maikhat di atu kungjiu, pakum bo ha.

Translation: "(He Lives)"

Category: "Humiliation, Resurrection & Glory"

