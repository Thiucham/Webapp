ID: "316"

Title: "NANGDI NAKHULAM BENSULO"

Key: "E"

Time signature: "4/4"

V1: |
  1. Taten kadibo tu tenlura khuan bam tulo, 
  Thaoben raleng machun bam talo;
  Naten thiubo gase Rapiu ga matip lulo, 
  Nangniu bam boga benlulo.

CH: |
  (Chorus) 
  Nangniu bam boga benlulo, (2x)
  Maikhat niu nagu nbiu tu phuibam ta lakge, 
  Nangniu bam boga benlulo.

V2: |
  2. Masan makbo kamuang situ kam masan khailo, 
  Lengsibo seniu pi khammi tu;
  Maikhat tura naliu khuan niu suikhai lu bui-e, 
  Nangniu bam boga benlulo.

V3: |
  3. Nangniu palad kengse kensai gukhai bine chiu, 
  Na nuan seniu kham mitulo;
  Nazu benbo seniu Rapiu khuga pui wanglo, 
  Nangniu bam boga benlulo.

Translation: "(Brighten the Corner)"

Category: "Christian service & Reward"

