ID: "202"

Title: "ATU NARA LULO"

Key: "E"

Time signature: "6/8"

V1: |
  1. A Rapiu khuga I kap khai,
  Khakhai bi maksai I shaine;
  Tingtheng ringbo se pikhailo,
  Atu nara lulo.

CH: |
  (Chorus)
  Atu nara lulo, (2x)
  Azeng gasu Khrista shaikhai;
  Atu nara lulo.

V2: |
  2. Atu khaikhai ra mai ha-e,
  Nangniu aleng nazai luang khai;
  Atu nangniu nachun kamjiu,
  Atu nara lulo.

V3: |
  3. I niu kaden bamlu lakge, 
  Alungchun chap matip ngammak;
  Chiudi nangra atu kha ngam, 
  Atu nara lulo.

V4: |
  4. Atu gukhailo a Rapiu, 
  Nasuang ga I kahum bamme; 
  Naten thiu sujiu thiu loide, 
  Atu nara lulo.

Translation: "(Take Me as I am)"

Category: "Response & Repentance"

