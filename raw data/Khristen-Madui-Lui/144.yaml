ID: "144"

Title: "KAHUMRABO WAN WIBOGA"

Key: "D"

Time signature: "6/8"

V1: |
  1. Kahum rabo wan wibo ga,
  Kadih ganiu atu ku-e;
  Aluni hina se bamme,
  A Rapiu bam ganiu pi-e;
  Magen kathiubo wan gase,
  Ahiupuina tu pi wikhai;
  Kahiambo ganiu pi duak khai,
  Kahum rabo wan pi khai-e;
  Kahiambo gasu pi duak khai,
  Kahum rabo wan pi khai-e.

V2: |
  2. Kahum rabo wan wibo ga,
  Mathabo chunwi kachangbo;
  Hiupuina niu ramgun bamme,
  Pah wang rabo tu khuan bammai;
  I niu khuan lulakjiu bamme,
  Tingwang Rankhaipiu zu ngaora;
  {Atu siga majang wangne, (2x)}
  {Kahum rabo patu khuan bam. (2x)}

V3: |
  3. Kahum rabo wan wibo ga,
  Nakanniu I singbo phungjiu;
  Pisgah luangbut kakubo ga,
  I mazuan jiu lemtad makthen;
  Patu malumjiu bam maitu,
  Patu thoidam pikhai bine;
  {Tingwang zu wibo lenkhai-e, (2x)}
  {Pagu lungsiat cham malumjiu. (2x)}

Translation: "(Sweet Hour of Prayer)"

Category: "Prayer meeting & Revival"

