ID: "385"

Title: "KHRISTEN MAI MANGWI"

Key: "A"

Time signature: "4/4"

V1: |
  1. Singnah mai mathak sulo,
  A Rapiu pamga zisulo najeng thiu sulo;
  Aliu gu suang Jesu lungsiat di-e,
  Mangwilo mangwilo.

V2: |
  2. Naziji hai sira pamnah kumjiu,
  Chiudi nangra chariu lanlak mide;
  Namang wijiu ji mathak mi sulo, 
  Mangwilo mangwilo.

V3: |
  3. Kadihri tamiubogu ha makthen, 
  Pasuang gase khom wang aruang makthen; 
  Tamiubo chun ben pad lan makthen na,
  Mangwilo mangwilo.

V4: |
  4. Ringsu lanbo pumtan benpad makthen, 
  Jesu ga shaimai ringsu lan makthen; 
  Paken dijiu a Rapiu kiu makthen, 
  Mangwilo mangwilo.

V5: |
  5. Rapiu niu natu lunli khai makthen, 
  A Rapiu 'biu kumjiu benmak thenna; 
  Kachia pirun natu runkhai makthen, 
  Mangwilo mangwilo.

V6: |
  6. Zilo aliu pek lakge mangwilo, 
  Namang wilo pakak khatna leng-e;
  Ramna lakge karingting loi dasai, 
  Mangwilo mangwilo.

Translation: "(The Christian Good Night)"

Category: "Aspiration after Heaven"

