ID: "200"

Title: "I NIU CHAP NE"

Key: "A"

Time signature: "4/4"

V1: |
  1. Nagu ladkeng gase ahiupuina, 
  Pakhiangna pikhai-e;
  Rapiu tu lukhai ra I chap lude, 
  Tuhoi I chap lude.

CH: |
  (Chorus) 
  I niu chapne Rapiu sui khai sai, 
  I nagu thiune Tingwang;
  Kungbo nazai niu atu liulude, 
  I nagu thiu kamne.

V2: |
  2. Nalungsiat niu I thoidam dao lude, 
  Liulude lungsiat niu;
  Khrista I natu malum siak lude, 
  Natu ronna malum.

V3: |
  3. I dejiu suan salo nang se bamme, 
  Ronmeng lanlak mide;
  Natu macha ra pumtan I kheng-e, 
  Pumtanse pikhailo.

V4: |
  4. Thainai aliu khuga pikhai khelo, 
  Nalungsiat lui thiura;
  Lungchun gasu wijiu din ngam lura, 
  I Khrista gu thiune.

V5: |
  5. Wangmai hina haichiu din ngam lura, 
  Nangniu nachun-e sai;
  Siga I achun-e chiu paokaklo, 
  Siga aliu lungne.

Translation: "(I Will)"

Category: "Response & Repentance"

