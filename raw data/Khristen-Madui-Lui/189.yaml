ID: "189"

Title: "AKHUGA WANGNI HINA"

Key: "B"

Time signature: "4/4"

V1: |
  1. I niu thainai tingmik achunwi bamme,
  Alung chariubo hane,
  Wangni maihina akhuga wanglo,
  Chiujiu Jesu ku-e.

CH: |
  (Chorus)
  Wangni maihina chiujiu atu natu kubamme,
  Yo atu kubamme wangni hina chiu atu ku-e,
  Wanglo chiu atu ku-e.

V2: |
  2. Wangni hina chiujiu 'liutu kubamme,
  Yo atu kujiu bamme,
  Wangni hina chiubo atu-e, 
  Wanglo chiubo atu-e.

V3: |
  3. I achunsa bam dao pah atu kujiu,
  Achun kam mawi khai-e,
  Pah atu ngao lujiu a nuan kuakkhai-e,
  Pazai niu masande.

Translation: "(Whosoever Meaneth Me)"

Category: "Invitation & Baptism"

