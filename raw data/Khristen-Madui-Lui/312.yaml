ID: "312"

Title: "PIPATLO"

Key: "F"

Time signature: "2/4"

V1: |
  1. Langra giu dung niu din, 
  Rapiu tu macha lo;
  Langra giu dung niu din, 
  Luang khaibo bam hina ga;
  I siam thubo giu thiubam di, 
  Luang saomak jiu luang bam;
  Tad khai tad khaibo bam hina, 
  Tadui I niu kajin khai.

CH: |
  (Chorus) 
  Chalui kawibo thiujiu, 
  Rapiu tu machalo, 
  Ngambo pi padlo.

V2: |
  2. Nsuan jikdui niu din, 
  Rapiu tu macha lo;
  Kajik dui niu din bam, 
  Agibo chunding wan ga;
  Ke mibo alin tara nai, 
  Kuimibo 'rapen dung; 
  Saomak jiu tadui pisak bam, 
  Pabon kasan bon lanra.

V3: |
  3. Chagan dung niu dinne, 
  Rapiu tu macha lo;
  Chagan dung niu dinne, 
  Kadihri pakhiang naga;
  Abiu siam jiu bam liudi du, 
  Tamiubo wan gase;
  'Pui mao maidung niu ngao lujiu, 
  Paliu lung pi matha khai.

Translation: "(Give Oh! Give)"

Category: "Christian service & Reward"

