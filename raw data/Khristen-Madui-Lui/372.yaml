ID: "372"

Title: "WIJIU LUNGBAM MINE"

Key: "D"

Time signature: "4/4"

V1: |
  1. Tingthung kenjiu tamiubo puiki,
  Kenpat dasai;
  Tingtheng jeng benbo ringbo bamme,
  Nnien suangdi benne.

CH: |
  (Chorus)
  Magenthiu jiu ramna bo,
  Chunsabo bam lakge;
  He! siga aliu adao lanne,
  Wijiu lungbam mine.

V2: |
  2. Malum bamsai 'liutu pui wangne,
  Sibo bamga;
  Lungsa jiu kachia namdi gase,
  Kendibo lui thiune.

V3: |
  3. Duidi genlam aliu aruang ne, 
  Lungsamai nai;
  Kysin gase aliu adaone, 
  Aliu adao kamne.

V4: |
  4. Siga aliu chunwi mathane, 
  Kendibo nai;
  Chariu magenthiubo mikduise, 
  Jesu niu nun sangne.

Translation: "(The Home Land Shore)"

Category: "Aspiration after Heaven"

