ID: "295"

Title: "LADRIAT KHAIBO LIN"

Key: "A"

Time signature: "9/8"

V1: |
  1. Chalungsabo lin maruklo,
  Kadih niang wibo ga;
  Nang niu maruk khaibo kumjiu,
  Miusy matak pad ne.

CH: |
  (Chorus)
  Tingmik machang pabam machang,
  Maruk khailo muisy;
  Minma jinbam taning ram luang,
  Chaki ga phungwang ne.

V2: |
  2. Mikdui luang jiu maruk khaibo,
  Mao makjiu masyne;
  Chariu khai mibo hinase,
  Tingwang niu pikhai ne.

V3: |
  3. Tenkhai mibose ge raleng,
  Chariu khaibo kumjiu;
  Kachia pirun nai tathon se,
  Naleng pikhai bine.

Translation: "(Seeds of Promise)"

Category: "Christian service & Reward"

