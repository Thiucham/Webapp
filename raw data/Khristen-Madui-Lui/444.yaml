ID: "444"

Title: "CHAMAI SANG SANG"

Key: "G"

Time signature: "2/2"

V1: |
  1. Chamai sang sang chalui thiu thuan,
  {Rankhaipiu tu thuanne. (2x)}
  A Rapiu pakendibo chawang,
  {Palungsa niu ngam ra. (3x)}

V2: |
  2. Lungsa sibo Rapiu Tingwang,
  {Ladzan thiura pilo. (2x)}
  Kadih pakhiangna sichia ra,
  {Rapiu Jesu zantu. (3x)}

V3: |
  3. Kaping hahkhaibo piu Jesu, 
  {Chunsabo hahmilo. (2x)}
  Chalui hainiu nuanmai dungtu, 
  {Chunwi matha pine. (3x)}

V4: |
  4. Paniu nuan hina kuak khai-e, 
  {Mathabo di pikhai. (2x)}
  Nuan hina paniu masan khai,
  {Aleng ringbo pi-e. (3x)}

Translation: "(Oh! For a Thousand Tongues)"

Category: "Special songs"

