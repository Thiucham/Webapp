ID: "27"

Title: "CHRISTMAS RAITHUBO CHUNDING WAN"

Key: "D"

Time signature: "3/4"

V1: |
  1. Christmas raithubo chunding wan,
  Mily khuanmai luzam jibam;
  Maza wang jiu paliu khu din,
  Agibo tatheting chunding.

CH: |
  (Chorus)
  Christmas, (4x)
  Israel mai wangpiu manade.

V2: |
  2. Paliu niu phuikhang ganbiu ngao,
  Tingbang lamniu ganbiu dibo;
  Kadih piriga thaokiu khai,
  Nchun nnian saomak jiu thao.

V3: |
  3. Sibo ganbiu si ngao lujiu,
  Tingbang lamsu kasimai wang;
  Chawang situ phui ra zuanwang,
  Sibo ganbiu situ zuanwang.

V4: |
  4. Tingpi tingrun tu ju aruang, 
  Ganbiu seniu Bethlehem ga; 
  Ngena bamga puiwang khaijiu,
  Thaoben khaijiu siokhai bi-e.

V5: |
  5. Ningtingmai khangsum di wangjiu, 
  Khudungkiu kahumjiu pikhai;
  Kachia maruta rimwi sa, 
  Paliu gu kungbo kalendung.

Translation: "(The First Noel, the Angel did say)"

Category: "Christmas"

