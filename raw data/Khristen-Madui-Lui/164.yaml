ID: "164"

Title: "WANGNI MAI HINA"

Key: "D"

Time signature: "4/4"

V1: |
  1. Chamai na hina tacham hai chiulu mai,
  Kawibo chamme kadihri sichialo;
  Mathabo cham dinronlo maihina ga.

CH: |
  (Chorus)
  Wangni mai hina wanglo.
  Chamai na hina ring nimai wanglo,
  Maluang nai taning dihga tadjiu dinlo;
  Apiu lungsiat niu hami maitu ku-e,
  Wangni mai hina wanglo.

V2: |
  2. Wangni mai hina namen jijiu wanglo,
  Kham lebo tingga ngut khai sulo naliu;
  Jesu hai karingbo majibo 'pui-e.

V3: |
  3. Wangni mai hina leng paladren bamme,
  Wangni maileng ra chambam maruang bamme;
  Wangni mai hina tingtheng ringjiu bamne.

Translation: "(Whosoever Will)"

Category: "Invitation & Baptism"

