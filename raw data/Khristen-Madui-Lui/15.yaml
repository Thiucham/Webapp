ID: "15"

Title: "BETHLEHEM NAMPOI GASE"

Key: "G"

Time signature: "4/4"

V1: |
  1. Bethlehem nam poi gase, 
  Nang zi bam bose ngao-e;
  Chamang man mak jiu zibam ga,
  Chagan dung zuan jiu bam;
  Tamiu gase thao weng wang,
  Tingtheng ben bo nbiu;
  Pariak sikam lak bo tingkum,
  Siniu natu khuan bam.

V2: |
  2. Khrista tu Mary pon bam, 
  Maidung se wang madui bam;
  Mazadung nai mily khuan mai,
  Lungsa jiu wang phui bam;
  Nsuan ganbiu dung siniu,
  Chalui thiu jiu thuan bam;
  Kadih ga agimanai jiu,
  Kulam Tingwang thuan lo.

V3: |
  3. Masim rim rimbo chunding,
  Pikhai bi-e ngena se;
  Tingwang niu chamainah dungleng,
  Pikhai-e thoidam se;
  Nuan phungbo kadih riga,
  Panah tu langwang jiu;
  Paliu lungchun ga ngut khaine,
  Hiupuina ranlu ra.

V4: |
  4. Bethlehem ga pon bo nah, 
  Aliu khuga wang khailo;
  Aliu nuan khiu masan lujiu, 
  Aliu tu lukhailo;
  Tinggen mazadung siniu, 
  Natu thuan bo lui thiu;
  Aliu khuga wangbam khailo,
  Rapiu Immanuel.

Translation: "(Oh! Little Town of Bethlehem)"

Category: "Christmas"

