ID: "264"

Title: "I SINGCHAI RIPHEN KHAT THIUJIU "

Key: "D"

Time signature: "4/4"

V1: |
  1. I singchai riphen thiu lujiu,
  Mily saisui rama?
  A Rapiu khulam liang lujiu,
  Pazan dinping rama?

CH: |
  (Chorus)
  Pazan ga kungbo zan ga,
  Shaikhaibo pazan ga;
  Lungsiat niu pirun I lune,
  Agu singchai penniu.

V2: |
  2. Mainiu tathuan lurabo leng,
  Chari aphen bamga;
  I ra amanbo tu phiubam,
  Seniu ngamlu rama?

V3: |
  3. Atu atung ramai hahma? 
  Duidi kenra hahma? 
  Kadihri niu khakhai suma, 
  Tingwang pam zuan raleng.

V4: |
  4. Chawang pirun lurabo leng, 
  Hura pilo Rapiu; 
  Chariubo khengh ngamlu raleng, 
  Nalad niu kha khailo.

Translation: "(A Soldier of the Cross)"

Category: "Conflict & Victory"

