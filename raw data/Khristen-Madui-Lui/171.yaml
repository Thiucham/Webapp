ID: "171"

Title: "KADIH PIRI NBIU"

Key: "F"

Time signature: "6/4"

V1: |
  1. Kadih piri hai tacheng saniu tamiu,
  Jesu kadihri nbiu-e;
  Pagu biu sira niending nbiu kumme,
  Jesu kadihri gu nbiu-e.

CH: |
  (Chorus)
  Wanglo naleng thaoben khai bamme,
  Kabenbo aleng thaokhai;
  Amiktiatbo tuhoi ngao lude,
  Jesu kadihri nbiu-e.

V2: |
  2. Jesu ga bammai tamiubo ga bammak,
  Jesu kadihri nbiu-e;
  Jupao sai suisai benbo ga tab bamme,
  Jesu kadihri gu nbiu-e.

V3: |
  3. Tamiuga bammai nuan niu naliu mik tiat, 
  Jesu kadihri nbiu-e;
  Tadlujiu khiu lulo benbose wangne, 
  Jesu kadihri gu nbiu-e.

V4: |
  4. Tinggen gara Naimik nbiu pageng hah-e,
  Jesu hai Tinggen nbiu-e;
  Kachia namdi gase Milypoi niu ben,
  Jesu hai tinggen nbiu-e.

Translation: "(The Light of the World)"

Category: "Invitation & Baptism"

