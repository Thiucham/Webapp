ID: "240"

Title: "JESU TU I LUNI-E"

Key: "D"

Time signature: "3/4"

V1: |
  1. Kachia rangkang suangdi Jesu tu luni,
  Kadih khiudung suangdi Jesu tu lune;
  Charam dibo suangdi Jesu tu luni,
  Singchai ga shaikhaibo tu mazuan tadne.

CH: |
  (Chorus) 
  Kadihga chawang mania I phiujiu, 
  Kamao ga bam san nimak;
  Kadih gu khiu hina atu pidi, 
  Jesu tu luni-e.

V2: |
  2. Tathuan hina suangdi Jesu tu luni-e, 
  Jesu zan ga I niu matha bam sune;
  Kadihga thuan kiubo Jesu niu ngamne;
  Jesu Khrista zan tuse thuan jiu bamne.

V3: |
  3. Charapen dung suangdi Jesu tu luni, 
  Makhui dui hum suangdi Jesu cham humme; 
  Ahiupuina leng di pikhai bambo-e, 
  Pah dinkhaibo 'puiki mazuan jiu tadne.

V4: |
  4. Tinggen ram ga I wang Jesu tu ngaosai, 
  Dejiu chunwijiu matha ri nga ralo! 
  Rapiu pamga I niu lungjiu bam mine, 
  Ahiuna tinggen mai lun lujiu bamne.

Translation: "(I'd Rather Have Jesus)"

Category: "Desire after holiness"

