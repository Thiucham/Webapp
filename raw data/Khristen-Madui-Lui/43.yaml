ID: "43"

Title: "LUNGSABO NIU ATU RANKHAI"

Key: "A"

Time signature: "6/8"

V1: |
  1. I nuan zai ga kahak jiu asang siak mibo ga,
  Alung chariu jiu kheng-e, lungsa khaira kheng-e;
  Duipui gu papao seniu, arathoi chiukhai bi,
  Rapiu Khrista niu atu rankhai bi-e.

CH: |
  (Chorus)
  {Lungsabo niu atu rankhai;
  Jesu niu atu lungsa jiu rankhai-e; (2x)}

V2: |
  2. Ahiuna chariubo hai Jesu niu wikhai-e,
  Kapingbo duiliu gasu paniu jupad khai ne;
  Duipui gu papao khuanse paliu niu majai-e,
  Paniu natu rankhai ne, thainai wanglo.

V3: |
  3. Chariubo seniu tanjiu alung chun tamiu-e,
  Jesu niu aben ju jiu pathoi kawi pikhai;
  Kapingbo wadi hade, alung chun pikim khai,
  Palungsiat khuan chiulu mai hina wanglo.

Translation: "(Love Lifted Me)"

Category: "Christ life & Love"

