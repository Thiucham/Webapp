ID: "49"

Title: "TANING GU LILY RAPEN"

Key: "F"

Time signature: "6/9"

V1: |
  1. Jesu ga aka daolu, paniu aleng machang;
  Ahiuna leng sang kariu suang widiang-e,
  Taning gu Lily rapen, pakhu ronna I ngao;
  Agu taniabo hina masan khai-e;
  Achunsiat paniu kimkhai, achariu di phungkhai; 
  Paniu apuat ritbo hina luak khai.

CH: |
  (Chorus)
  Pahai taning Lily rapen, Nsuan gu ganbiu benbo;
  Ahiuna leng sang kariu suang widiang-e.

V2: |
  2. Paniu achengsa kuak khai, achariu phung khai-e;
  Kahiambo tu ngam ra pumtanse pa-e,
  Agu mania wadi ha, pakhiangna pagu-e;
  Pagu pumtanse alungga bam mide,
  Kadihri pa khiangna nai, satan niu hiam bamdi,
  Jesu zan gasu chaki wangtang ne.

V3: |
  3. Paniu wadao khat nadi, atu phutmi lakge;
  Malumjiu bamsai paniu thoikhai bine,
  Pakhuga I bam thenna, kapingbo dao lakge;
  Hiuna mariu maitu paniu pitiu khai,
  Pazu watse I ngaosai, dibo pirun runne;
  Tingtheng luangsao makbo singgiu luang bam.

Translation: "(The Lily of the Valley)"

Category: "Christ life & Love"

