ID: "118"

Title: "BIBLE HAI KADIHPIRI LENG-E"

Key: "B"

Time signature: "4/4"

V1: |
  1. Bible hai maihina leng-e,
  Kendibo ladpui thiubam ra;
  Maihina tu pise khaijiu,
  Thoidam kawibo dao lulo.

CH: |
  (Chorus)
  Tingwang cham niu thaoben khailo,
  Tingkadih duipui hina ga;
  Tamiuga ron tadbam maitu,
  Rapiu Tingwang ga pui wanglo.

V2: |
  2. Kabenbo wangbo hina ga,
  Tamiubo kamuang niu gomdi;
  Naimik niu padjiu thaobo kum,
  Nuan hina kuakjiu ben sune.

V3: |
  3. Papiu niu lungsa khai bose,
  Nuan kuak khaijiu madu khai-e;
  Adam ganiu maobo jengniu, 
  Ranlura thoidam pikhai-e.

V4: |
  4. Chariujiu kapbam maidung tu,
  Amanbo pikhai raleng-e;
  Pazeng sajiu bam maidungtu,
  Tingtheng karingbo pikhaine.

Translation: "(An Open Bible for the World)"

Category: "Bible"

