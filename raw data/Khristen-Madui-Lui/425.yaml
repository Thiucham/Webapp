ID: "425"

Title: "KHRISTEN MAI ALIU MAI HINA"

Key: "c"

Time signature: "4/4"

V1: |
  1. Khristen mai aliu maihina,
  Jesu kendi ra madui-e;
  Pacham phara nai kati ra,
  Tachun mathajiu ramgun-e.

CH: |
  (Chorus)
  Matan jiu ten bammai,
  Pazan ga madui-e;
  Tachun khat thiu lujiu,
  Pazan dinron tadkhe;
  Aliu chap matip khe,
  Tingwang nai adih leng;
  Sing bamkhe aliu leng,
  Kawi pikhai raleng.

V2: |
  2. Madui maihina niu thiukhe,
  Khrista chawang tu thuanbo lui;
  Chabonkin niu 'pui sira leng,
  Then makjiu ringbam rabo leng.

V3: |
  3. A Rapiu ten tenjiu bamkhe,
  Ladren kasanbo lui thiujiu;
  Palungsiat malumjiu suira,
  Patu wangbam aruang makthen.

Translation: "(The Endeavour Band)"

Category: "Christian mission"

