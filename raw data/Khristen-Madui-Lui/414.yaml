ID: "414"

Title: "CHARIUMAI LENG MATHAK BAM"

Key: "C"

Time signature: "4/4"

V1: |
  1. Kristen mai lungra Tinggen ram, 
  Aliu siga lung sune;
  Jesu aliu bam kadenlu, 
  Aliutu majang lu.

CH: |
  (Chorus) 
  Jordan giugen khatlam sira, 
  Eden gu kareng lungga;
  Karingbo singbang bambo ga, 
  Mathak ra bamme;
  {Lak maileng mathak ra bam, (3x)}
  Mathak ra bamme.

V2: |
  2. Jesu aliu bam kadenra, 
  Chaky sira ha lakge;
  Aliu chaky siga bamjiu, 
  Jesu tu majang ne.

V3: |
  3. Sibo naira kasa hane, 
  Chunsa jengsa bam lakge;
  Aliu chawang pirun runne, 
  Jesu tu majang ne.

Translation: "(There is a Rest for the Weary)"

Category: "Aspiration after Heaven"

