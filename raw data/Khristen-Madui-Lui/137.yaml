ID: "137"

Title: "JESU NIU MANANG KHAI SUMA?"

Key: "D"

Time signature: "6/2"

V1: |
  1. Alung chariu magenthiubo niu, 
  Wadi sitami suma?
  Chariubo seniu rejiu kap bamga,
  Jesu niu akhuan chiu khai-e.

CH: |
  (Chorus) 
  Jesu niu atu manang khai, 
  Agu chariu hinase;
  Magenthiu chariubo wang jiu bam luidi, 
  Rapiu niu lungsa khai.

V2: |
  2. Tamiubo ga I rontad bam jiu, 
  Kapingbo daobo gadi;
  Ting tamiu wangjiu ngao tamibo ga, 
  Jesu niu manang khai bine.

V3: |
  3. Kahiambo niu tanjiu wangbo ga, 
  Alung manang chariu-e;
  Chariubo seniu kapjiu bambo ga,
  Jesu niu thonkhai lak suma?

V4: |
  4. I niu kungthubo tu ramnajiu, 
  Achunsa jiu bambo ga; 
  Chunsabo seniu shaira kum bamga, 
  Jesu niu lungsa khai lakma?

Translation: "(Does Jesus Care?)"

Category: "Prayer meeting & Revival"

